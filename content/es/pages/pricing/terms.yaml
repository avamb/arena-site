title: "Condiciones de precios en detalle"
description: "Comisión: pago tras el evento, créditos, entradas de hasta US$10, 50% a organizaciones benéficas, recintos, white label €45/US$45 al mes por marca."
h1: Condiciones detalladas
lead: Las condiciones que hay detrás del precio por entrada. Condiciones estándar; condiciones por volumen e individuales bajo petición. Todos los importes sin IVA.
sections:
  - type: prose
    id: terms
    body: |
      ## Qué cobramos

      La comisión de la plataforma se cobra por entrada vendida, no como porcentaje de tus ingresos, salvo en los dos casos que se indican abajo. Una entrada de US$15 y una de US$150 te cuestan lo mismo. Las invitaciones y las entradas gratuitas a eventos de pago no llevan comisión.

      ## Pago tras el evento

      US$0,62 por entrada sin asiento y US$1,18 por entrada con un asiento elegido en el plano del recinto (€0,55 y €1,05 para recintos de países de la UE).

      Los precios se fijan en dólares estadounidenses. Los precios en euros son los precios en dólares convertidos al tipo de referencia del Banco Central Europeo (1 EUR = 1,1193 USD el 9 de noviembre de 2026) y redondeados al céntimo; la [página de precios](/pricing) muestra ambos. Dos importes no se convierten: el umbral para eventos con entradas baratas es €10, y el tope para recintos permanentes es €1,09. Facturamos tras el evento, por las entradas vendidas, y pagas por transferencia bancaria. Para eventos a la venta durante varios meses y para recintos permanentes facturamos una vez al mes. El pago tras el evento está abierto a organizaciones confirmadas en la plataforma. La gestión de cobros con tarjeta se paga a tu proveedor de pagos según sus propias condiciones.

      ## Créditos

      Compras un paquete de créditos una vez y cada entrada toma su comisión de tus créditos a la tarifa de ese paquete. Un asiento suma US$0,35 (€0,31) a la tarifa de créditos. Los créditos son dinero en tu cuenta: no caducan, puedes comprar paquetes de créditos tantas veces como quieras y se gastan solo en nuestros servicios. No se pueden retirar, transferir ni convertir en efectivo. Si los créditos se acaban a mitad de las ventas, las ventas no se detienen: las entradas que no cubrieron se facturan al precio de pago tras el evento. Puedes activar una recarga automática. Los paquetes de créditos y sus tarifas están en la [página de precios](/pricing#packages).

      ## Organizaciones benéficas registradas

      Las organizaciones benéficas registradas pagan el 50% de la comisión indicada en esta página, con pago por uso y con créditos. Nuestro equipo activa el descuento para tu organización cuando haya visto el registro: escríbenos desde la [página de contacto](/contact).

      ## Eventos en los que cada entrada cuesta US$10 o menos

      La tarifa menor es una propiedad de todo el evento: se aplica solo si el precio más alto de cualquier entrada del evento, antes de los códigos promocionales, es de US$10 o menos, **US$10 incluidos** (€10 en países de la UE). Cuentan todas las categorías y tramos de precio, también los añadidos después. Si hay una entrada por encima, se aplica el precio estándar a todas las entradas del evento, también a las baratas: un evento con entradas de US$5 y de US$25 va al precio estándar. La tarifa es el 4% del precio de la entrada, como mínimo US$0,10 y como máximo US$0,35 por entrada, y US$0,20 más por una entrada con asiento (en países de la UE: como mínimo €0,09, como máximo €0,31, €0,18 más con asiento).

      ## Recintos permanentes

      Los recintos que organizan eventos por sí mismos, todo el año o por temporada, pagan el 2% del precio de la entrada (después de los códigos promocionales, sin el cargo por servicio), como máximo US$1,18 por entrada (€1,09 en países de la UE), igual con asiento y sin él. Facturamos cada mes. Nuestro equipo activa el estatus de recinto: escríbenos desde la [página de contacto](/contact).

      ## Operador de venta en la página del evento, o white label

      Los precios de esta página suponen que la página donde vendes nombra a ArenaSoldOut.com como operador de venta de entradas, con un enlace a arenasoldout.com. Basta una línea como «Tickets: ArenaSoldOut.com» junto a las entradas, y el widget de entradas muestra esa línea por defecto, así que con el widget no hay nada que añadir. Las páginas de venta que alojamos siempre llevan nuestro nombre.

      Si prefieres vender sin nombrarnos, el white label cuesta **€45 al mes por marca o recinto** en países de la UE y **US$45 al mes por marca o recinto** en todos los demás países, en la moneda de tu comisión. Una marca es el promotor del evento, o tu organización en eventos sin promotor: dos promotores que venden sin nuestro nombre son dos marcas. Un recinto permanente que vende sin nuestro nombre paga como una sola marca. Un mes incompleto se cobra por días. El cargo es una línea de tu factura mensual; los créditos no lo pagan.

      Mientras el white label está activo, desaparecen la línea del widget, el pie de tu tienda y la línea de la plataforma en los correos a los compradores, y los correos salen con el nombre de la marca. Lo que se mantiene: las páginas de venta que alojamos, los enlaces a los términos y la política de privacidad de la plataforma en el pago y los datos del vendedor, como exige la ley. Nuestro equipo activa y desactiva el white label de una marca desde la fecha que elijas: escríbenos desde la [página de contacto](/contact).

      ## Reembolsos, cambios de fecha y cancelación

      Cuando un comprador devuelve una entrada, el reembolso al comprador lo pagas tú, el organizador. La comisión de una venta que ya ocurrió se mantiene. No cobramos una comisión aparte por procesar un reembolso, por cambiar la fecha ni por los correos a los compradores. Se aplican las condiciones propias del proveedor de pagos, tal como él las indica. Si un evento se cancela, la comisión ya cobrada no se devuelve en dinero.

      ## Moneda

      La comisión es en dólares estadounidenses para todos los países fuera de la UE, incluidos los países europeos que no pertenecen a la UE, Asia y Oriente Medio, y en euros para recintos de países de la UE. Los precios en euros son los precios en dólares estadounidenses al tipo del BCE indicado arriba. La moneda de la comisión no cambia la moneda en la que vendes las entradas. Si una organización tiene recintos en ambos grupos, recibe dos cuentas.

      ## Informes

      El Event Center ofrece totales por sesión y un informe CSV detallado por sesión. Las exportaciones a tu CRM o a tu sistema de contabilidad se configuran bajo petición.

      ## Privacidad

      ArenaSoldOut.com trata los datos de los compradores por cuenta del organizador, con el fin de vender y entregar las entradas. La [política de privacidad](/legal/privacy) describe qué se trata y durante cuánto tiempo; los [términos y condiciones](/legal/terms) son el acuerdo con el organizador.
