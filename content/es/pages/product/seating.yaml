title: "Planos de asientos: plazas numeradas y zonas de pie"
description: "Planos con versiones, importación SVG, asientos y entrada general mezclados, precios por categoría. Envía un PDF, un boceto o una tabla: lo dibujamos gratis."
h1: Planos de asientos que coinciden con el recinto
lead: Los asientos numerados están en el núcleo de la plataforma, no son un añadido. El equipo construye tu plano con lo que tengas, normalmente en un día, y lo reutiliza para cada fecha.
