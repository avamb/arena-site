sections:
  - type: faq
    id: questions
    eyebrow: Asientos
    title: ¿Cómo funcionan los asientos con ArenaSoldOut.com?
    items:
      - q: ¿Tengo que dibujar el plano yo mismo?
        a: "No, nunca. Envíanos el plano y lo dibujamos en tu evento gratis, normalmente en un día. Basta cualquiera de estas opciones: un PDF del plano del recinto, una foto de un boceto a mano o una tabla de filas con los asientos de cada una (Excel o Google Sheets). Los archivos vectoriales (SVG) se importan directamente."
      - q: ¿Puede un evento tener asientos y plazas de pie?
        a: Sí, en un mismo plano. Filas reservadas con categorías, zonas de pie con cupos, cada categoría con su propio precio y periodo de venta.
      - q: ¿Puedo cambiar el plano cuando ya han empezado las ventas?
        a: Sí. Los planos tienen versiones, así que una nueva distribución para la próxima sesión no afecta a las entradas ya vendidas.
      - q: ¿Cuánto me cuesta una entrada con asiento?
        a: "La comisión por una entrada con asiento es de US$1,18 (€1,05 en países de la UE), frente a US$0,62 (€0,55) sin asiento; los créditos la reducen. El plano en sí es gratis. Consulta los [precios](/pricing)."
      - q: ¿Elige el comprador el asiento desde el móvil?
        a: Sí. El plano de asientos es el mismo en el widget y en la página alojada, con zoom con los dedos en el móvil, una leyenda por categoría y un temporizador de reserva para los asientos elegidos.
      - q: ¿Y las invitaciones y los asientos para prensa?
        a: Emite entradas gratuitas para asientos concretos desde el Event Center; se escanean en la puerta como cualquier entrada.
