title: "Entradas electrónicas con EAN-13 y QR, escaneo, correos"
description: "Entradas PDF con EAN-13 y QR en el idioma del comprador, app de escaneo MACS para iOS y Android, entradas de muestra, correos si una sesión se mueve o cancela."
h1: Una entrada que se escanea
lead: Cada entrada es un PDF con un código de barras EAN-13 y un código QR, en el idioma del comprador. Escanéala con la app o con un escáner de mano, reenvíala, reembólsala, sustitúyela cuando una fecha cambie.
