title: "App de escaneo MACS: escaneo de entradas en iOS y Android"
description: "MACS escanea entradas EAN-13 y QR de cualquier organizador y de tus socios, en iPhone, iPad, Android y escáneres de mano. Gratis en las tiendas de apps."
h1: "MACS: la app en la puerta"
lead: Una app para cada entrada del recinto. El personal de puerta inicia sesión, elige la sesión y escanea el EAN-13 o el QR de la entrada, en papel o en pantalla. Acepta entradas de cualquier organizador que venda con ArenaSoldOut.com y entradas de socios de otros sistemas, así que un recinto usa los mismos móviles para todos los eventos.
related:
  - { label: Entradas electrónicas con EAN-13 y QR, href: /product/tickets }
  - { label: "Recintos y clubes: un plano, todos los eventos", href: /solutions/venues }
