title: "Códigos promo, precio anticipado, tramos y precio libre"
description: "Códigos promocionales con límites, precios por fecha, tramos por cantidad, cadenas de categorías, cargo por servicio, entradas gratis y de precio libre."
h1: Precios que cambian como los planeaste
lead: Precio anticipado por fecha, el siguiente precio cuando se agota un tramo, códigos para socios, un cargo por servicio por canal. Todo se configura en el Event Center y se aplica en el widget y en la página alojada.
