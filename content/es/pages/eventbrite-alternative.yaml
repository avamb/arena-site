  - type: prose
    id: examples
    title: ¿Qué significa esto para un evento?
    body: |
      Todas las cifras, a los precios de ambas plataformas al 11 de noviembre de 2026.

      **1.000 entradas a US$30, pago por uso.** ArenaSoldOut.com: 1.000 × US$0,62 = **US$620**. Eventbrite: 1.000 × (3,7% de US$30 + US$1,79) = US$2.900. Son **US$2.280** de diferencia, antes del procesamiento de tarjetas en ambos casos.

      **300 entradas con asiento a US$60.** ArenaSoldOut.com: 300 × US$1,18 = **US$354**, y dibujamos el plano de asientos gratis. Eventbrite: 300 × (3,7% de US$60 + US$1,79) = US$1.203.

      **Cuanto más cuesta una entrada, mayor es la diferencia.** Nuestra comisión es la misma en una entrada de US$15 y en una de US$150. Un porcentaje crece con el precio.

      Calcula tu propio evento en la [calculadora de la página de precios](/pricing#packages).

  - type: cards
    id: more
    eyebrow: Más allá del precio
    title: ¿Qué más es distinto con ArenaSoldOut.com?
    items:
      - title: El dinero es tuyo desde el primer pedido
        text: "Los compradores pagan en tu propia cuenta de Stripe, Flitt o AllPay. ArenaSoldOut.com nunca retiene fondos, así que no hay un pago que esperar después del evento."
        link: { label: Pagos, href: /payments }
      - title: Planos de asientos dibujados para ti, gratis
        text: "Envía un PDF, una foto de un boceto a mano o una tabla de filas y asientos. El equipo construye el recinto; tú nunca lo dibujas."
        link: { label: Planos de asientos, href: /product/seating }
      - title: Tarifa menor para entradas baratas
        text: "Cuando cada entrada del evento cuesta {usdLowMax} o menos: {lowPercent}% del precio de la entrada en lugar de la tarifa fija. Discotecas, carreras, fiestas infantiles, excursiones."
        link: { label: Cómo funciona, href: /pricing#low-price }
      - title: Tu página, tus compradores
        text: "Vende en tu propio sitio con el widget de entradas o en tu página con nosotros. Los compradores vienen a ti, no a un catálogo junto a otros eventos."
        link: { label: Vende en tu sitio o en el nuestro, href: /product/sell }
      - title: Cada venta en tu Telegram
        text: "Crea un evento a partir de la foto de un cartel en el bot de Telegram y ve cada venta y reembolso en tu grupo en segundos."
        link: { label: Bot de Telegram, href: /product/telegram }
      - title: Configúralo tú o encárganoslo
        text: "Creas los eventos en el Event Center o en el bot de Telegram en minutos; dibujamos los planos de asientos gratis. ¿Sin tiempo? Nuestro gestor de eventos lo hace por ti, como servicio de pago."
        link: { label: Gestor de eventos, href: /pricing#services }

  - type: faq
    id: questions
    title: Preguntas que hacen los organizadores cuando comparan
    items:
      - q: ¿Es ArenaSoldOut.com más barata que Eventbrite?
        a: "En la comisión, sí, con cualquier precio de entrada: {usdPrice} por entrada en lugar de 3,7% + US$1,79 en EE. UU., y {eurPrice} en lugar de 5,9% + €0,79 en Irlanda. El procesamiento de tarjetas se suma en ambas plataformas en EE. UU."
      - q: ¿Quién paga la tarifa, yo o el comprador?
        a: "Tú decides. Puedes añadir tu propio cargo por servicio para el comprador sobre el precio de la entrada, o mantener el precio y pagar tú nuestra comisión. Las invitaciones y las entradas gratuitas a eventos de pago no llevan comisión."
      - q: ¿Adónde va el dinero del comprador?
        a: "A tu propia cuenta de pagos con cada pedido: Stripe, Flitt o AllPay. ArenaSoldOut.com nunca retiene fondos. Nuestra comisión se factura después del evento o se toma de tus créditos."
      - q: ¿Aparecerá mi evento en un mercado?
        a: "No. Eventbrite tiene un mercado donde los compradores exploran eventos; ArenaSoldOut.com no. Vendemos entradas en tu sitio y en tu propia página del evento, y tú traes a los compradores con tus propios canales."
      - q: ¿Puedo pasar mis eventos desde Eventbrite?
        a: "Sí. Creas los eventos en el Event Center o en el bot de Telegram en minutos, y dibujamos tus planos de asientos gratis a partir de tu PDF o boceto. ¿Sin tiempo? Nuestro gestor de eventos los pasa por ti, como servicio de pago. Sigue vendiendo en Eventbrite hasta que tu página con nosotros esté lista."
      - q: ¿Pago una suscripción?
        a: "No. Pagas solo por las entradas vendidas, después del evento, o compras créditos por adelantado desde {usdFrom} por entrada. Los créditos nunca caducan."

