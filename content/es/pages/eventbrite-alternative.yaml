    lead: "Precios de ambas plataformas al 11 de noviembre de 2026. Nuestra comisión por entrada vendida junto al cargo por servicio de Eventbrite. El procesamiento de tarjetas se paga aparte en ambas plataformas en EE. UU.: a Eventbrite allí, a tu propio proveedor de pagos con nosotros."
