  - type: faq
    id: questions
    eyebrow: Preguntas sobre el dinero
    title: ¿Cuánto me cuesta exactamente una entrada?
    items:
      - q: ¿Cuánto cuesta una entrada con asiento?
        a: "Pagando después del evento: US$1,09 fuera de la UE, €0,97 en la UE. Una entrada sin asiento cuesta US$0,59 o €0,53. El plano de asientos en sí no cuesta nada: lo dibujamos gratis a partir de un PDF, una foto de un boceto a mano o una tabla de filas y asientos. Con créditos la comisión es menor, y un asiento suma US$0,35 (€0,31) a la tarifa de créditos."
      - q: ¿Cómo funcionan los créditos?
        a: "Compras un paquete de créditos una vez. Cada entrada vendida toma su comisión de tus créditos a la tarifa del paquete, hasta que se acaban. Los créditos no caducan, se pueden recargar en cualquier momento y se gastan solo en nuestros servicios: no se pueden retirar ni transferir."
      - q: ¿Qué pasa si los créditos se acaban a mitad de las ventas?
        a: Las ventas no se detienen. Las entradas que tus créditos no cubrieron pasan a la factura habitual al precio de pago tras el evento.
      - q: ¿Hay recarga automática?
        a: Sí. Puedes activarla, y cuando tus créditos bajan de tu umbral se compra el siguiente paquete por ti.
      - q: ¿Adónde va el dinero del comprador?
        a: "A tu propia cuenta de pagos, con cada pedido. ArenaSoldOut.com nunca retiene fondos. El comprador paga el precio de la entrada y, si lo añades, tu cargo por servicio."
      - q: ¿Cuándo pago a ArenaSoldOut.com?
        a: "Después del evento, por transferencia bancaria, por las entradas vendidas. Para eventos a la venta durante varios meses y para recintos permanentes, una vez al mes. Los créditos se pagan al comprarlos."
      - q: ¿Y la gestión de cobros con tarjeta?
        a: Es un contrato entre tú y tu proveedor de pagos, con las condiciones del proveedor. No forma parte de nuestra comisión y no le añadimos nada.
      - q: ¿Tengo que mencionar ArenaSoldOut.com en mi sitio?
        a: "Los precios suponen que la página del evento nombra a ArenaSoldOut.com como operador de venta de entradas, con un enlace a nosotros; el widget de entradas muestra esa línea por defecto. Para vender sin nuestro nombre, el white label cuesta €45 al mes por marca o recinto en países de la UE y US$45 al mes por marca o recinto en todos los demás países, cobrado por días en un mes incompleto. Las [condiciones detalladas](/pricing/terms) explican qué es una marca y qué oculta el white label."
      - q: ¿Hay descuento para organizaciones benéficas?
        a: "Sí. Las organizaciones benéficas registradas pagan el 50% de nuestra comisión, con pago por uso y con créditos. Escríbenos desde la [página de contacto](/contact) y lo activamos para tu organización."
      - q: ¿Las invitaciones son gratis?
        a: Sí. Las invitaciones y las entradas gratuitas a eventos de pago no llevan comisión.
      - q: ¿Qué pasa con la comisión cuando se reembolsa una entrada o se cambia la fecha?
        a: "El reembolso al comprador lo haces tú. La comisión de una venta que ya ocurrió se mantiene, y no cobramos una comisión aparte por procesar el reembolso, por cambiar la fecha ni por los correos a los compradores. Las condiciones propias del proveedor de pagos son las del proveedor."
      - q: ¿Y si cancelo el evento?
        a: "La comisión ya cobrada no se devuelve en dinero. Escríbenos sobre tu caso antes de cancelar el evento."
      - q: Una de mis entradas cuesta más de US$10 (€10 en la UE) y las demás son baratas. ¿Qué precio se aplica?
        a: "El estándar, a todas las entradas del evento: la tarifa menor exige que cada entrada de cada categoría y tramo de precio cueste US$10 o menos (€10 en la UE). Una entrada de US$5 junto a una de US$25 va al precio estándar."
      - q: Tengo un recinto y organizo muchos eventos al mes. ¿Hay otro trato?
        a: "Sí. Los propietarios de recintos permanentes (teatros, clubes, estadios, circos y otros lugares que organizan eventos por sí mismos, todo el año o por temporada) pagan el {percent}% del precio de la entrada, calculado después de los códigos promocionales y sin tu cargo por servicio. La comisión por entrada tiene un tope de US$1,09 (€1,09 en la UE), igual con asiento y sin él. Las invitaciones no llevan comisión. Facturamos cada mes. Nuestro equipo activa el estatus de recinto: escríbenos desde la [página de contacto](/contact). Las condiciones completas están en las [condiciones detalladas](/pricing/terms)."

