title: "Venta de entradas por país: proveedores de pago y monedas"
description: "Dónde venden entradas los organizadores con ArenaSoldOut.com: cada país, proveedor de pago, moneda y método. El dinero va siempre a tu propia cuenta."
h1: "¿En qué países funciona ArenaSoldOut.com?"
lead: "En todos los países donde acepte a tu empresa alguno de nuestros proveedores de pago. El dinero de cada entrada llega a tu propia cuenta de pagos; ArenaSoldOut.com nunca cobra las entradas."
related:
  - { label: "Pagos en tu propia cuenta", href: "/payments", text: "Proveedores, estados y cómo conectar tu cuenta." }
  - { label: "Giras de conciertos", href: "/solutions/concert-tours", text: "Muchas ciudades y países en un solo evento, una página por promotor." }
  - { label: "Precios", href: "/pricing", text: "Paga después del evento por las entradas vendidas, o compra créditos." }
sections:
  - type: cards
    id: rules
    eyebrow: "Todos los países"
    title: "¿Qué reglas son iguales en todas partes?"
    items:
      - title: "Tu cuenta, tu dinero"
        text: "El dinero de cada entrada vendida llega a tu propia cuenta con tu proveedor de pagos: Stripe, Flitt o AllPay. ArenaSoldOut.com nunca lo retiene. Los pagos a tu banco siguen el calendario de tu proveedor; los reembolsos vuelven al comprador a través de tu proveedor."
      - title: "Un precio, menor con créditos"
        text: "{usdPrice} por entrada, {usdSeated} con asiento; en la UE {eurPrice} y {eurSeated}. Pagas después del evento, por las entradas vendidas. Compra créditos por adelantado y el precio baja a {usdFrom} por entrada ({eurFrom} en la UE)."
      - title: "Sin IVA sobre nuestra comisión"
        text: "Facturamos nuestra comisión sin IVA."
      - title: "Los métodos de pago los eliges tú"
        text: "Los compradores ven los métodos que activas en la cuenta de tu proveedor."

  - type: cards
    id: benefits
    eyebrow: "Por qué ArenaSoldOut.com"
    title: "¿Qué obtienen los organizadores?"
    lead: "Una plataforma de venta de entradas hecha para organizadores: te quedas con más de cada entrada, vendes más y empiezas antes."
    items:
      - title: "Gana más con cada entrada"
        text: "Un precio fijo de {usdPrice} por entrada, no un porcentaje del precio. Con créditos es menor, desde {usdFrom} por entrada. Las comisiones de tarjeta quedan entre tú y tu proveedor de pagos."
        link: { label: "Precios →", href: "/pricing" }
      - title: "Vende más"
        text: "Códigos promocionales, precios de lanzamiento, enlaces para recomendar a un amigo, recordatorios de carritos abandonados y un correo a los suscriptores en cuanto se abre la venta."
        link: { label: "Códigos promocionales y ventanas de precio →", href: "/product/pricing-tools" }
      - title: "Empieza antes"
        text: "Un evento sin plano de asientos sale a la venta en 10 minutos. Un plano de asientos lo dibujamos nosotros gratis, normalmente en un día."
        link: { label: "Tu primer evento →", href: "/first-event" }

  - type: countries
    id: list
    eyebrow: "Países"
    title: "Países, proveedores y métodos de pago"
    lead: "Todos los países donde alguno de nuestros proveedores acepta empresas. Qué empresas acepta un proveedor lo decide el proveedor, y las reglas cambian: consulta las condiciones actuales con el proveedor antes de abrir una cuenta. Los países con página propia son enlaces."
    labels:
      country: "País"
      provider: "Proveedor"
      currencies: "Monedas"
      methods: "Métodos de pago"
      agreed: "se fija en la cuenta de tu proveedor"
    methods_map:
      card: "tarjetas"
      apple_pay: "Apple Pay"
      google_pay: "Google Pay"
      bit: "Bit"
      installments: "pagos a plazos"
      bank_transfer: "transferencia bancaria"
      ideal: "iDEAL"
      twint: "TWINT"
    preparing:
      title: "En preparación"
      text: "Países donde estamos añadiendo un proveedor de pagos. ¿Tu país no está en la tabla, o quieres vender ya en uno de estos? [Escríbenos](/contact#write)."

  - type: cards
    id: where
    eyebrow: "Dónde vendes"
    title: "¿Dónde puedo vender entradas?"
    lead: "En tres lugares a la vez. Las ventas de todos ellos llegan a un único Event Center."
    items:
      - title: "Nuestra página de venta"
        text: "Alojamos una página para tu evento en tickets.arenasoldout.com/tu-nombre/tu-evento. No hay nada que construir."
        link: { label: "Dónde vendes →", href: "/product/sell" }
      - title: "Tu propio sitio"
        text: "Pon el widget de entradas en el sitio que ya tienes. Los compradores eligen asientos y pagan sin salir de él."
        link: { label: "El widget →", href: "/product/sell" }
      - title: "Tus redes sociales"
        text: "Comparte el enlace en redes sociales y mensajeros, o imprime un código QR en el cartel. Cada pedido queda asociado a su enlace, así ves cuál vendió."
        link: { label: "Enlaces y códigos QR →", href: "/product/sell" }

  - type: prose
    id: abroad
    eyebrow: "Giras de conciertos"
    title: "¿Puedo vender un espectáculo en otro país?"
    body: "Sí. Una gira puede cruzar fronteras: las sesiones en distintas ciudades y países viven en un solo evento, y los compradores eligen la fecha. La cuenta de pagos y la moneda siguen a tu organización. Si necesitas una segunda moneda, configuramos un canal de venta aparte para ese país. Consulta las [giras de conciertos](/solutions/concert-tours)."

  - type: faq
    id: questions
    eyebrow: "Preguntas"
    title: "¿Qué preguntan los organizadores antes de empezar?"
    items:
      - q: "¿Cuánto me cuesta una entrada?"
        a: "{usdPrice} por entrada, {usdSeated} con asiento; en la UE {eurPrice} y {eurSeated}. Pagas después del evento, por las entradas vendidas. Las invitaciones no llevan comisión. Consulta los [precios](/pricing)."
      - q: "¿Puedo pagar menos por entrada?"
        a: "Sí. Compra créditos por adelantado y el precio baja a {usdFrom} por entrada ({eurFrom} en la UE). Los créditos nunca caducan. Consulta los [precios](/pricing)."
      - q: "¿Cuándo le pago a ArenaSoldOut.com?"
        a: "Después del evento, por las entradas vendidas, si eliges pagar así. También puedes comprar créditos antes del evento."
      - q: "¿A dónde va el dinero de las entradas?"
        a: "A tu propia cuenta con tu proveedor de pagos, por cada entrada vendida. ArenaSoldOut.com nunca lo retiene."
      - q: "¿Qué tan rápido puedo empezar a vender?"
        a: "Confirmamos tu organización, normalmente en un día. Con una cuenta de pagos lista, un evento sin plano de asientos sale a la venta en 10 minutos. Un plano de asientos lo dibujamos gratis, normalmente en un día."
      - q: "¿Qué tan fiable es la plataforma?"
        a: "Probada con 800 pedidos por minuto y 1000 compradores a la vez. Un sistema de vigilancia avisa al equipo, las copias de seguridad se hacen cada noche, cifradas, y Cloudflare protege el acceso. No se ha registrado ni una sola caída desde el inicio en 2019, ni siquiera con varias decenas de miles de entradas vendidas en 5 minutos. Consulta la [fiabilidad](/product/reliability)."
      - q: "Gestiono un recinto permanente. ¿Hay otra tarifa?"
        a: "Sí. Los teatros, clubes y otros recintos que celebran eventos todo el año o por temporada pagan el {percent}% del precio de la entrada, con un tope por entrada, facturado cada mes. Consulta los [precios](/pricing)."
      - q: "Mis entradas son baratas. ¿Hay un precio menor?"
        a: "Sí. Cuando todas las entradas del evento cuestan {usdLowMax} o menos ({eurLowMax} en la UE), la comisión es el {lowPercent}% del precio de la entrada. Consulta los [precios](/pricing)."
      - q: "¿Puede un mismo evento tener entradas con precios distintos?"
        a: "Sí. Categorías con su propio precio, precios de lanzamiento que cambian en una fecha, escalones de cantidad, entradas gratuitas y de pago libre."
      - q: "¿Puedo usar códigos promocionales?"
        a: "Sí, con un alcance (qué categorías y sesiones), fechas de validez y un límite por comprador. Consulta [códigos promocionales y ventanas de precio](/product/pricing-tools)."
      - q: "¿Se puede vender una entrada infantil solo junto con una de adulto?"
        a: "Sí, con categorías complementarias. Un complemento se vende solo junto con una entrada principal de la misma sesión, así que no se puede comprar una entrada infantil sin una de adulto."
      - q: "¿Puedo vender bebidas o merchandising junto con las entradas?"
        a: "Sí. Un vale de bebida puede ser una categoría complementaria: se vende solo junto con una entrada y llega como una entrada propia. El merchandising, el vino y los sets de regalo se venden en una tienda junto a tus entradas, con variantes, carrito, recogida en el evento o tu propio envío, y reembolsos. La tienda se activa por separado, condiciones a petición."
      - q: "Hago el mismo espectáculo cada semana. ¿Creo un evento nuevo cada vez?"
        a: "No. Añades una sesión al mismo evento; los precios, las categorías y el plano de asientos se mantienen, y los compradores eligen la fecha."
      - q: "¿Puedo ver las ventas de cada evento en tiempo real?"
        a: "Sí. En el Event Center, desde el teléfono o el ordenador, en el navegador, sin instalar nada: pedidos y totales por sesión y un informe CSV. Si usas Telegram, cada venta y cada reembolso llega también a tu grupo en segundos."
      - q: "¿Necesito equipo especial en la puerta?"
        a: "No. La aplicación MACS escanea entradas en cualquier iPhone o teléfono Android, desde papel o desde una pantalla. También funcionan los escáneres láser de mano y los lectores de códigos de barras USB o Bluetooth. Consulta [la aplicación MACS](/product/scanner)."
      - q: "¿Cuánto cuesta la aplicación de escaneo MACS?"
        a: "MACS está incluida para los organizadores que venden a través de ArenaSoldOut.com."
      - q: "¿Qué métodos de pago verán mis compradores?"
        a: "Los que actives en la cuenta de tu proveedor de pagos."

  - type: prose
    id: team
    eyebrow: "Nuestro equipo"
    title: "¿Preguntas o ideas?"
    body: "Escribe al equipo. Respondemos preguntas sobre tu país, tu recinto y tu evento, y escuchamos ideas: construimos ArenaSoldOut.com para que vender entradas sea cómodo y te resulte rentable. [Contacta con el equipo](/contact#write)."

  - type: cta
    id: start
    title: "Empieza a vender hoy"
    text: "Crea el evento, conecta tu cuenta de pagos, comparte el enlace."
    primary: { label: "Crea tu evento", href: "/start#create" }
    secondary: { label: "Contacta con el equipo", href: "/contact#write" }
    note: "Confirmamos tu organización, conectamos tu cuenta de pagos y dibujamos tu plano de asientos gratis."
