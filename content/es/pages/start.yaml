title: "Empieza a vender: solicitud de organizador"
description: "Cuéntanos sobre tu organización y tus eventos. El equipo configura tu organización, tu página de venta y tu cuenta de pagos, normalmente en un día."
h1: Empieza a vender
lead: "Cuéntanos quién eres y dónde vendes. Configuramos tu organización y tu página de venta y conectamos tu cuenta de pagos, normalmente en un día. Los eventos sin plano de asientos salen a la venta hoy."
sections:
  - type: steps
    id: how
    eyebrow: Qué pasa después
    title: "¿Cómo empezamos?"
    items:
      - title: Envías la solicitud
        text: "Cinco pasos cortos: contacto, organización, eventos, pagos y consentimiento. Tus respuestas se guardan sobre la marcha, así que puedes salir y volver."
      - title: Te configuramos
        text: El equipo revisa la solicitud, crea tu organización y tu página de venta, conecta contigo tu cuenta de pagos y, si tienes un recinto con asientos, dibuja sin coste el plano de asientos a partir de tu PDF, boceto a mano o tabla de filas.
      - title: Sales a la venta
        text: Comparte un solo enlace o pon el widget en tu web. Cada venta llega a tu Event Center y a tu grupo de Telegram.
  - type: onboarding
    id: form
    mode: apply
    eyebrow: Solicitud
    title: Cuéntanos sobre ti
