      ## 1. Quiénes somos

      La plataforma de venta de entradas ArenaSoldOut.com y la aplicación de Meta «Arena Sold Out» las opera ABH TEAM OÜ, inscrita en el Registro Mercantil de Estonia con el número de registro 14162982, Narva mnt 5a, 10117 Tallin, Estonia.

      ## 2. Organizadores que conectaron una cuenta publicitaria de Meta (Facebook)

      Un organizador puede conectar su cuenta publicitaria de Meta a Arena Sold Out: para enviar las ventas de entradas a Meta como conversiones y ver el gasto en publicidad junto a las ventas. Para ello guardamos un token de acceso, los ID del píxel y de la cuenta publicitaria y las estadísticas de publicidad recibidas.

      **Retira el acceso tú mismo.** Tras cualquiera de estos pasos, Arena Sold Out ya no puede leer ni enviar nada a través de tu cuenta:

      - en el Event Center, como propietario de la organización: Publicidad → Meta → Desconectar (además pedimos a Meta que retire el acceso y borramos al instante el token de acceso guardado);
      - en Facebook: Configuración y privacidad → Configuración → Integraciones comerciales, busca «Arena Sold Out» y pulsa Eliminar;
      - en Meta Business Suite: Configuración → Configuración del negocio → Integraciones (o Cuentas → Apps), busca «Arena Sold Out» y elimínala.

      **Pídenos que eliminemos los datos guardados.** Escribe a support@arenasoldout.com desde el correo de tu cuenta del Event Center, indicando «Eliminar datos de Meta» y el nombre de tu organización. Eliminamos el token de acceso, los ID del píxel y de la cuenta publicitaria y las estadísticas de publicidad, y te lo confirmamos por correo. Respondemos en el plazo de un mes. Los datos que la ley nos obliga a conservar se guardan solo durante ese plazo (sección 3 de la política de privacidad).

      Los datos que Meta ya recibió a través de tu cuenta los conserva Meta según su propia política de privacidad.

      ## 3. Compradores de entradas

      Tus derechos sobre tus datos personales (acceso, rectificación, supresión y los demás) están en la [sección 5 de la política de privacidad](/es/legal/privacy). Los datos de tus entradas los tratamos por encargo del organizador de tu evento, que es su responsable: envía tu solicitud al organizador, cuyo contacto aparece en la página de venta y en el correo con tu entrada. También puedes escribir a support@arenasoldout.com y reenviaremos la solicitud al organizador.

      ## 4. Más información

      Qué tratamos, para qué y durante cuánto tiempo: [política de privacidad](/es/legal/privacy).
