sections:
  - type: prose
    id: story
    eyebrow: Empresa
    title: "¿Qué es ArenaSoldOut.com?"
    body: |
      ArenaSoldOut.com es una plataforma de venta de entradas para organizadores: asientos numerados y entrada general en un mismo evento, la cuenta de pagos del propio organizador, una página de venta que alojamos nosotros o un widget en la web del organizador, y un Event Center en el navegador y en Telegram. Los compradores pagan directamente al organizador; la plataforma nunca retiene el dinero.

      La empresa es ABH TEAM OÜ, registrada en la Unión Europea. Las plataformas anteriores de los fundadores dieron servicio a espectáculos del Cirque du Soleil, estadios de la FIFA 2018, los World Choir Games y 800 shows sobre hielo; ArenaSoldOut.com vende entradas para organizadores desde 2019 y se reconstruyó desde cero en 2026.

      El equipo responde a los organizadores en persona, en inglés, español, checo, ruso y hebreo. La mayoría de las peticiones de los organizadores se entregan en semanas; todas las que llegaron a producción figuran en la [página de cambios](/changes) con su fecha, y la [página de datos](/facts) dice qué existe, qué no y desde cuándo.
