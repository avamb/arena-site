title: "Sobre ArenaSoldOut.com: venta de entradas desde 2019"
description: "ArenaSoldOut.com es infraestructura de venta de entradas para organizadores, de ABH TEAM OÜ (UE). Clientes en 31 países desde 2019; plataforma nueva en 2026."
h1: Quién está detrás de ArenaSoldOut.com
lead: Un equipo pequeño que construye infraestructura de venta de entradas para organizadores que venden sus propias entradas. No es un marketplace ni un listado de eventos. Organizadores en 31 países desde 2019; la plataforma que hay detrás se reconstruyó en 2026 y los organizadores se pasaron con ella.
