title: "Contacto ArenaSoldOut.com: Telegram, correo, solicitud"
description: "Escribe al equipo de ArenaSoldOut.com con el formulario, en el chat o el bot de Telegram, o por correo. Compradores: primero pregunta al organizador del evento."
h1: Contacta con el equipo
lead: Los organizadores contactan con el equipo con el formulario de abajo, en Telegram o por correo; responden las mismas personas. Los compradores de entradas deben escribir primero al organizador de su evento; la página de ayuda para compradores explica dónde encontrar la entrada.
related:
  - { label: Empieza a vender, href: /start }
  - { label: Ayuda para compradores de entradas, href: /help/tickets }
  - { label: Socios, href: /partners }
sections:
  - type: contact-form
    id: write
    eyebrow: Escribe al equipo
    title: "¿Cómo hago una pregunta al equipo?"
    lead: "Escribe tu pregunta abajo. Una persona del equipo responde por correo, normalmente el mismo día laborable. Las preguntas y respuestas, sin nombres ni correos, pasan a ser las respuestas de este sitio."
  - type: cards
    id: ways
    eyebrow: Contacto
    title: "¿Cómo contacto con el equipo?"
    items:
      - { title: Chat de Telegram, text: "La vía más rápida. El equipo lee el chat durante el día en Europa e Israel.", link: { label: Abrir el chat de Telegram →, href: https://t.me/ArenaSoldOutChat } }
      - { title: Bot de Telegram, text: "Crea un evento a partir de un cartel o simplemente saluda; el equipo responde en el mismo bot.", link: { label: Abrir el bot de Telegram →, href: https://t.me/EventsCentrBot } }
      - { title: Formulario de solicitud, text: "Cuéntanos sobre tu evento y dónde vendes; te configuramos, normalmente en un día.", link: { label: Empieza a vender →, href: /start } }
      - { title: Correo, text: "hello@arenasoldout.com para todo lo demás, incluidas alianzas y prensa.", link: { label: Escribir un correo →, href: "mailto:hello@arenasoldout.com" } }
  - type: faq
    id: questions
    eyebrow: Preguntas
    title: "¿A quién debo contactar?"
    items:
      - q: Compré una entrada y tengo una pregunta
        a: "Escribe al organizador del evento; su contacto está en la página de venta y en el correo de la entrada. La [página de ayuda para compradores](/help/tickets) explica dónde está la entrada y qué hacer en la puerta."
      - q: Soy organizador y quiero empezar
        a: "Usa el [formulario](/start) o el bot de Telegram. El equipo crea contigo tu organización y tu página de venta, y conecta tu cuenta de pagos."
      - q: Soy desarrollador o una agencia
        a: "La [página para desarrolladores](/developers) tiene el widget y la API; [socios](/partners) explica cómo trabajan con nosotros las agencias y los recintos."
  - type: cta
    id: start
    title: Empieza a vender hoy
    text: Crea el evento, conecta tu cuenta de pagos y comparte el enlace.
    primary: { label: Empieza a vender, href: /start }
    secondary: { label: Abre el chat de Telegram, href: https://t.me/ArenaSoldOutChat }
    note: "ABH TEAM OÜ, Unión Europea."
