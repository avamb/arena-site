  - type: faq
    id: faq
    eyebrow: Preguntas
    title: Lo que preguntan los organizadores
    items:
      - q: "¿Cuánto cuesta empezar?"
        a: "Nada. No hay suscripción ni pagos adicionales mensuales o anuales. Pagas una comisión por cada entrada vendida, desde {usdPrice}. Las invitaciones y las entradas gratuitas no llevan comisión. [Precios y calculadora →](/pricing)"
      - q: "¿Hay algún pago adicional, mensual o anual?"
        a: "No. Ni pagos mensuales o anuales, ni suscripción. Solo pagas una comisión por cada entrada vendida."
      - q: "Vendo entradas por WhatsApp y los compradores me llaman. ¿Para qué necesito una plataforma de venta de entradas?"
        a: "Para dejar de atender cada pedido a mano. Los compradores eligen sus asientos y pagan a cualquier hora, también de noche; el dinero llega directamente a tu cuenta y la entrada con código QR, al correo del comprador. Puedes seguir compartiendo el enlace de venta por WhatsApp, y tu tiempo lo dedicas al evento, no a mensajes y listas."
      - q: "¿Quién paga el cargo por servicio, yo o el comprador?"
        a: "Tú decides. Puedes añadir tu propio cargo por servicio al precio de la entrada, y te llega íntegro con el pago. Nuestra comisión por entrada no cambia."
      - q: "¿Cuándo recibo el dinero?"
        a: "Con cada pedido. El comprador paga directamente en tu cuenta de pagos; ArenaSoldOut.com nunca retiene el dinero. Las transferencias a tu banco siguen el calendario de tu proveedor."
      - q: "¿Puedo integrar la venta de entradas en mi propia web?"
        a: "Sí. El widget de entradas va en cualquier página con tres líneas de código: WordPress, Tilda, Wix, Webflow o código propio. Los compradores eligen sus asientos y entradas sin salir de tu web. [Para desarrolladores →](/developers)"
      - q: "¿Cómo funciona el control de acceso el día del evento?"
        a: "Cada entrada es un PDF con un código QR y un código de barras EAN-13. En la puerta, la app MACS para iOS y Android escanea las entradas con un móvil cualquiera; también sirve un escáner de mano. La app acepta además las entradas vendidas por tus socios en otros sistemas. [App de escaneo MACS →](/product/scanner)"
      - q: "¿Se pueden comprar entradas en la misma puerta?"
        a: "Sí. Imprime un código QR con un enlace corto de compra y colócalo en la puerta. La gente lo escanea con el móvil y compra su entrada allí mismo."
      - q: "¿Qué pasa si el evento se cancela o cambia de fecha?"
        a: "Tú decides. Reembolsa a todos los compradores, ofrece una nueva fecha en lugar del reembolso o elige otra opción. Los compradores reciben un correo en su idioma con la entrada actualizada."
      - q: "¿Puedo ver de dónde vienen los compradores?"
        a: "Sí. Añade etiquetas UTM a tus enlaces de venta y el Event Center te muestra qué canal ha traído los pedidos."
      - q: "Nunca he vendido entradas. ¿Esto es para mí?"
        a: "Sí. Te acompañamos paso a paso: [tu primer evento →](/first-event). Dibujamos tu plano de asientos gratis y, si lo prefieres, lo configuramos todo contigo en una llamada."
      - q: "¿Cómo contacto con el equipo de ArenaSoldOut.com si tengo una pregunta?"
        a: "Escríbenos por Telegram, a través del [formulario del sitio](/contact#write) o a hello@arenasoldout.com. Te responden personas del equipo."

