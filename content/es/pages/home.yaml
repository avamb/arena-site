  - type: reasons
    id: why
    eyebrow: Por qué ArenaSoldOut.com
    title: ¿Por qué los organizadores venden entradas con nosotros?
    lead: "Cuatro razones, cada una con los datos que la respaldan."
    items:
      - icon: wallet
        title: Te quedas con más de cada entrada
        text: "**{price}** fijos por entrada, no un porcentaje de tus ingresos: una entrada de US$15 y una de US$150 te cuestan lo mismo. Los compradores pagan en tu propia cuenta de pagos, así que el dinero es tuyo en el momento del pago, no después del evento."
        bullets:
          - Nada se descuenta de tus ventas, no retenemos ninguna reserva
          - Sin comisión por invitaciones ni entradas gratuitas
          - Tu plano de asientos, dibujado por nosotros gratis
        link: { label: Precios y calculadora →, href: /pricing }
      - icon: clock
        title: A la venta en 10 minutos
        text: "Cuando tu organización está confirmada, normalmente en un día, un evento sin plano de asientos sale a la venta en **10 minutos**, si ya tienes una cuenta con un proveedor de pagos. Conectas esa cuenta una vez; cada evento siguiente solo necesita su nombre, fechas y precios."
        link: { label: "Tu primer evento, paso a paso →", href: /first-event }
      - icon: list-checks
        title: Lo que piden los organizadores, ya construido
        text: "Sin módulos que comprar ni plugins que instalar:"
        bullets:
          - Widget en tu sitio o una página de venta que alojamos
          - Asientos y zonas de pie en un mismo evento
          - Códigos promocionales, precios que cambian por fecha
          - Invitaciones, reembolsos, fechas cambiadas con correos a los compradores
          - App de escaneo para iOS y Android
          - Cada venta en tu grupo de Telegram en segundos
        link: { label: Las respuestas en detalle →, href: "#answers" }
      - icon: shield-check
        title: Vendemos entradas desde {since}
        text: "Organizadores en **{countries}** países desde {since}: conciertos, teatros, festivales, espectáculos, clases magistrales. **800** pedidos por minuto en pruebas de carga, copias de seguridad cifradas cada noche, un sistema de vigilancia que avisa al equipo antes de que tú lo notes."
        link: { label: Clientes y testimonios →, href: /clients }

  - type: steps
    id: how
    eyebrow: Cómo funciona
    title: A la venta hoy. Tres preguntas que los organizadores hacen primero.
    items:
      - title: ¿Con qué rapidez puedo empezar a vender?
        text: "Un evento sin plano de asientos sale a la venta en 10 minutos una vez confirmada tu organización y conectada tu cuenta de pagos; la conectas una sola vez. Para un recinto con asientos, envíanos tu plano: lo dibujamos gratis, normalmente en un día."
      - title: ¿Qué necesito?
        text: "El nombre y el calendario del evento, los precios de las entradas, tu cartel y tu propia cuenta de pagos: Stripe, Flitt, AllPay u otro proveedor de tu país. El dinero llega a ti desde la primera entrada."
      - title: ¿De qué forma lo configuro?
        text: "En el navegador, desde un ordenador o un móvil, en el «Event Center»*. O en Telegram, donde el bot lee tu cartel y rellena fechas, precios y recinto para que los confirmes. O nos lo envías y lo configuramos nosotros."
    note: "* El «Event Center» es tu cuenta de organizador en ArenaSoldOut.com: todos los eventos, pedidos, reembolsos, invitaciones y sesiones, para ti y tu equipo, en el navegador y en Telegram. [Ver el Event Center más abajo →](#center) Todos los pasos, de la solicitud al escáner: [tu primer evento →](/first-event)"

  - type: ways
    id: where
    eyebrow: Dónde vendes
    title: En tu sitio o en el nuestro. El dinero va a ti en ambos casos.
    items:
      - title: Tienes un sitio web
        text: "Tu sitio es la caja. Inserta el widget de entradas en cualquier página: WordPress, Tilda, Wix, Webflow o código propio. Los compradores nunca salen de tu dominio."
        bullets:
          - Widget en cualquier sitio, tres líneas de código
          - Plugin de WordPress con pedidos de WooCommerce
          - Tus colores, tus fuentes, tu idioma
      - title: No tienes un sitio web
        text: "Alojamos la página de venta: tickets.arenasoldout.com/tu-nombre/tu-evento. Comparte un solo enlace en redes sociales, mensajería y en el cartel."
        bullets:
          - Una página por organizador y por evento
          - Una página aparte para cada promotor
          - Lista en minutos, sin trabajo de diseño
          - Enlaces a tus vendedores asociados en la misma página

  - type: qa
    id: answers
    eyebrow: Lo que preguntan después los organizadores
    title: Sí. Y así funciona.
    items:
      - title: ¿Puedo usar códigos promocionales?
        text: Sí. Un código puede aplicarse a un evento, una sesión o una categoría, con un periodo de validez, un mínimo y un límite por comprador.
      - title: ¿Pueden cambiar los precios en la fecha que yo elija?
        text: Sí. Las ventanas de precio anticipado cambian por fecha y hora. Los tramos por cantidad abren el siguiente precio cuando se agota el actual.
        visual:
          type: ladder
          rungs:
            - { price: US$24, width: 100, label: primeras 100 · vendidas }
            - { price: US$119, width: 62, label: siguientes 150 · en venta }
            - { price: US$599, width: 0, label: se abre después, next: true }
      - title: ¿Varios precios para un mismo evento?
        text: Sí. Categorías con su propio precio, cupo y periodo de venta, además de entradas gratuitas y de precio libre.
      - title: ¿Puedo añadir un cargo por servicio?
        text: Sí. Un porcentaje por canal de venta, que el comprador ve como una línea aparte y que se paga en tu cuenta junto con la entrada. Comprueba que tu país permite un cargo por servicio en la venta de entradas.
      - title: ¿Con asientos y sin ellos?
        text: "Sí, y las dos cosas en un mismo evento: un plano de asientos con categorías y zonas de pie con cupos. Envíanos el plano de tu recinto y lo dibujamos en el sistema gratis, normalmente en un día: basta un PDF, una foto de un boceto a mano o una tabla de filas con los asientos de cada una (Excel o Google Sheets). Nunca tienes que introducirlo a mano."
        visual:
          type: plan
          aria: Plano de un recinto con platea, dos palcos, un balcón y una zona de pie
          stage: Escenario
          parterre: Platea · 312
          logeLeft: Palco izq. · 48
          logeRight: Palco der. · 48
          balcony: Balcón · 180
          standing: De pie
      - title: ¿Funciona un escáner con las entradas?
        text: Sí. Cada entrada es un PDF con un código de barras EAN-13 y un QR, en el idioma del comprador. Escanea en la puerta con la app de escaneo para iOS y Android o con un escáner de mano. La app también acepta las entradas vendidas por tus socios en otros sistemas.
        visual:
          type: ticket
          event: Autumn Jazz Night
          meta: Vie 24 oct · 19:30 · Palác Akropolis
          seat: Platea · Fila G · Asiento 7
          code: "2173049188256"
      - title: ¿Cómo veo mis ventas?
        text: "En tu «Event Center», tu propia cuenta en este sitio: ábrelo en un móvil o un ordenador, sin instalar nada. Todos tus eventos, cada pedido, reembolsos y totales por sesión, visibles solo para ti y tu equipo. ¿Prefieres Telegram? Cada venta y cada reembolso también llegan a tu grupo de Telegram en segundos, con el contacto del comprador. [Ver el Event Center más abajo →](#center)"
        visual:
          type: telegram
          from: ArenaSoldOut.com
          lines:
            - "**Pagado** · Autumn Jazz Night · Vie 24 oct"
            - Fila G 7–8 · Platea
            - "**€76,00** · Anna K. · +420 ••• 41 18"
          time: "19:42"
      - title: ¿Reembolsos, invitaciones, cambios de fecha?
        text: "Sí, desde tu cuenta del «Event Center». Reembolsa una entrada, emite invitaciones, mueve o cancela una sesión: los compradores reciben un correo en su idioma con la entrada actualizada."
      - title: ¿Aguantará un estadio?
        text: Sí. 800 pedidos por minuto con 1.000 compradores en la página a la vez en pruebas de carga, copias de seguridad cifradas cada noche, un sistema de vigilancia que nos avisa antes de que lo notes.

