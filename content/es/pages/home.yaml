    compact: true
    planBullets:
      - "**{seated}** por entrada con asiento elegido en el plano del recinto"
      - "**Gratis** invitaciones y entradas gratuitas a eventos de pago: sin comisión"
      - "Los **[créditos](/pricing#packages)** bajan la comisión por entrada"
    cta: { label: Empezar a vender, href: /start }
    buyCredits: { label: Comprar créditos, href: /pricing#packages }
    plans:
      currency: "Mostrar precios en"
      payg:
        name: Pago por uso
        text: Una tarifa fija y sencilla por entrada vendida, que se paga después del evento.
        bullets:
          - "**{seated}** por entrada con asiento elegido en el plano del recinto"
          - "Se factura después del evento, por transferencia bancaria"
          - "Sin suscripción, sin contrato"
      upfront:
        name: Pago anticipado con créditos
        text: "Compra créditos por adelantado y paga hasta un {saving}% menos por cada entrada."
        from: desde
        bullets:
          - "**{fromSeated}** por entrada con asiento"
          - "Los créditos no caducan; recarga cuando quieras"
          - "Las ventas nunca se detienen: si se acaban los créditos, el resto se factura al precio de pago por uso"
      perks:
        - { big: "50%", title: Organizaciones benéficas registradas, text: "50% de descuento en nuestra comisión. Escríbenos y lo activamos." }
        - { big: "Gratis", title: Invitaciones, text: "Sin comisión por invitaciones ni entradas gratuitas a eventos de pago." }
        - { big: "Gratis", title: Plano de asientos, text: "Dibujamos tu plano a partir de un PDF, una foto de un boceto o una tabla de filas y asientos." }
        - { big: "{lowPercent}%", title: "Entradas de hasta {lowMax}", text: "Para eventos en los que cada entrada cuesta {lowMax} o menos. [Cómo funciona](#low-price)" }
      brand: "Los precios suponen la línea **Tickets: ArenaSoldOut.com** con un enlace a nosotros en la página de tu evento; el widget de entradas la muestra por defecto. Para vender sin ella, el white label cuesta **€45 al mes por marca o recinto en países de la UE** y **US$45 al mes por marca o recinto en todos los demás países**. [Condiciones detalladas →](/pricing/terms)"
    currencyNote: "Comisión en **dólares estadounidenses** para todos los países fuera de la UE y en **euros** para recintos de países de la UE. El dólar es la base; los precios en euros son los precios en dólares al tipo del BCE. Los importes no incluyen IVA."
