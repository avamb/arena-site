    eyebrow: Dinero
    title: Los compradores te pagan a ti. No a nosotros.
    lead: El 100% de cada venta es tuyo. El comprador paga el precio de la entrada, y el cargo por servicio si lo añades, directamente en tu propia cuenta de pagos, en tu moneda, en tu extracto. ArenaSoldOut.com nunca retiene tu dinero. Tú pagas a ArenaSoldOut.com la comisión de la plataforma por cada entrada vendida, después del evento o con un paquete prepago. Los reembolsos y los contracargos son decisión tuya, no una política de la plataforma.
