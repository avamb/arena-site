  - type: steps
    id: how
    eyebrow: Cómo funciona
    title: A la venta hoy. Tres preguntas que los organizadores hacen primero.
    items:
      - title: ¿Con qué rapidez puedo empezar a vender?
        text: "Un evento sin plano de asientos sale a la venta en 10 minutos una vez confirmada tu organización y conectada tu cuenta de pagos; la conectas una sola vez. Para un recinto con asientos, envíanos tu plano: lo dibujamos gratis, normalmente en un día."
      - title: ¿Qué necesito?
        text: "El nombre y el calendario del evento, los precios de las entradas, tu cartel y tu propia cuenta de pagos: Stripe, Flitt, AllPay u otro proveedor de tu país. El dinero llega a ti desde la primera entrada."
      - title: ¿De qué forma lo configuro?
        text: "En el navegador, desde un ordenador o un móvil, en el «Event Center»*. O en Telegram, donde el bot lee tu cartel y rellena fechas, precios y recinto para que los confirmes. O nos lo envías y lo configuramos nosotros."
    note: "* El «Event Center» es tu cuenta de organizador en ArenaSoldOut.com: todos los eventos, pedidos, reembolsos, invitaciones y sesiones, para ti y tu equipo, en el navegador y en Telegram. [Ver el Event Center más abajo →](#center) Todos los pasos, de la solicitud al escáner: [tu primer evento →](/first-event)"

  - type: ways
    id: where
    eyebrow: Dónde vendes
    title: En tu web, en nuestra página, en webs de socios y en redes sociales. El dinero te llega en cualquier caso.
    items:
      - title: Tu web
        text: "Tu web es tu taquilla. Inserta el widget de entradas en cualquier página: WordPress, Tilda, Wix, Webflow o código propio. Los compradores nunca salen de tu dominio."
        bullets:
          - Widget en cualquier web, tres líneas de código
          - Integración con WordPress
          - Tus colores, tus fuentes, tu idioma
      - title: Nuestra página de venta
        text: "Alojamos la página de venta: tickets.arenasoldout.com/tu-nombre/tu-evento. Un solo enlace para el cartel, el boletín y la mensajería."
        bullets:
          - Una página por organizador y por evento
          - Lista en minutos, sin trabajo de diseño
          - Enlaces a tus vendedores asociados en la misma página
      - title: Webs de socios
        text: "El mismo widget se coloca en la web de una sala, un promotor o una agencia. Cada promotor tiene su propia página de venta y su propio enlace."
        bullets:
          - Widget en la web de un socio
          - Una página y un enlace aparte para cada promotor
          - Todas las ventas de los socios en un solo Event Center
      - title: Redes sociales y mensajería
        text: "Un enlace de venta en Instagram, Facebook, Telegram y WhatsApp, en el cartel y en el boletín. Un código QR con un enlace corto en la puerta: lo escanean y compran la entrada allí mismo."
        bullets:
          - Un solo enlace para todos los canales
          - Un código QR en el cartel y en la puerta
          - El origen de las ventas, con etiquetas UTM

  - type: qa
    id: answers
    eyebrow: Funciones
    title: Todo lo que necesita un organizador, en una sola plataforma
    more: { label: Todas las funciones →, href: /features }
    items:
      - title: Códigos promocionales
        text: Un código puede aplicarse a un evento, una sesión o una categoría, con un periodo de validez, un mínimo y un límite por comprador.
      - title: Precios que cambian solos
        text: Las ventanas de preventa cambian por fecha y hora. Los tramos por cantidad abren el siguiente precio cuando se agota el actual.
        visual:
          type: ladder
          rungs:
            - { price: US$24, width: 100, label: primeras 100 · vendidas }
            - { price: US$119, width: 62, label: siguientes 150 · en venta }
            - { price: US$599, width: 0, label: se abre después, next: true }
      - title: Categorías y entradas gratuitas
        text: Categorías con su propio precio, cupo y periodo de venta, además de entradas gratuitas y de precio libre.
      - title: Tu propio cargo por servicio
        text: Un porcentaje por canal de venta, que el comprador ve como una línea aparte y que llega a tu cuenta junto con la entrada, íntegro para ti. Comprueba que tu país permite un cargo por servicio en la venta de entradas.
      - title: Asientos y zonas de pie
        text: "Un plano de asientos con categorías y zonas de pie con cupos, en un mismo evento. Envíanos el plano de tu recinto y lo dibujamos en el sistema gratis, normalmente en un día: basta un PDF, una foto de un boceto a mano o una tabla de filas con los asientos de cada una (Excel o Google Sheets). Nunca tienes que introducirlo a mano."
        visual:
          type: plan
          aria: Plano de un recinto con platea, dos palcos, un balcón y una zona de pie
          stage: Escenario
          parterre: Platea · 312
          logeLeft: Palco izq. · 48
          logeRight: Palco der. · 48
          balcony: Balcón · 180
          standing: De pie
      - title: Entradas y acceso
        text: Cada entrada es un PDF con un código de barras EAN-13 y un QR, en el idioma del comprador. Escanea en la puerta con la app de escaneo para iOS y Android o con un escáner de mano. La app también acepta las entradas vendidas por tus socios en otros sistemas.
        visual:
          type: ticket
          event: Autumn Jazz Night
          meta: Vie 24 oct · 19:30 · Palác Akropolis
          seat: Platea · Fila G · Asiento 7
          code: "2173049188256"
      - title: Ventas en tiempo real
        text: "En tu «Event Center», tu propia cuenta en este sitio: ábrelo en un móvil o un ordenador, sin instalar nada. Todos tus eventos, cada pedido, reembolsos y totales por sesión, visibles solo para ti y tu equipo. Las etiquetas UTM muestran de dónde vienen los compradores. ¿Prefieres Telegram? Cada venta y cada reembolso también llegan a tu grupo de Telegram en segundos, con el contacto del comprador. [Ver el Event Center más abajo →](#center)"
        visual:
          type: telegram
          from: ArenaSoldOut.com
          lines:
            - "**Pagado** · Autumn Jazz Night · Vie 24 oct"
            - Fila G 7–8 · Platea
            - "**€76,00** · Anna K. · +420 ••• 41 18"
          time: "19:42"
      - title: Reembolsos, invitaciones, cambios de fecha
        text: "Todo desde tu cuenta del «Event Center»: reembolsa una entrada, emite invitaciones, mueve o cancela una sesión. Si un evento se cancela o cambia de fecha, tú decides qué pasa con el dinero: reembolsar a todos u ofrecer una nueva fecha. Los compradores reciben un correo en su idioma con la entrada actualizada."
      - title: Fiabilidad
        text: 800 pedidos por minuto con 1.000 compradores en la página a la vez en pruebas de carga, copias de seguridad cifradas cada noche, un sistema de vigilancia que cuida la plataforma día y noche.
      - title: Un código QR en la puerta
        text: Imprime un código QR con un enlace corto de compra y colócalo en la puerta. La gente lo escanea y compra su entrada allí mismo, aunque haya venido sin ella.
      - title: API a petición
        text: La API, los webhooks y la importación de eventos en una sola llamada se configuran a petición, cuando tus ventas necesitan conectarse con tu propio sistema.

