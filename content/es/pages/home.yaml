  - type: money
    id: money
    eyebrow: Dinero
    title: Los compradores te pagan a ti. No a nosotros.
    lead: El 100% de cada venta es tuyo. El comprador paga el precio de la entrada, y el cargo por servicio si lo añades, directamente en tu propia cuenta de pagos, en tu moneda, en tu extracto. ArenaSoldOut.com nunca retiene tu dinero. Tú pagas a ArenaSoldOut.com la comisión de la plataforma por cada entrada vendida, después del evento o con un paquete prepago. Los reembolsos y las contracargos son decisión tuya, no una política de la plataforma.
    flowAria: Flujo de pago
    nodes:
      - { label: Comprador, sub: "tarjeta, Apple Pay, Google Pay" }
      - { label: Tu sitio, sub: o la página de venta que alojamos }
      - { label: ArenaSoldOut.com, sub: "pedido, asientos, entrada" }
      - { label: Tu cuenta de pagos, providers: true, highlight: true }
      - { label: Tu banco, sub: según el calendario del proveedor }
    note: Tú pagas a ArenaSoldOut.com la comisión de la plataforma por cada entrada vendida. Nada se descuenta de tus ventas, nada se retiene.

  - type: pricing
