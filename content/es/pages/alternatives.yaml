      - title: TicketSpice
        text: "Una tarifa fija por entrada en ambas. La nuestra es menor, y los planos de asientos vienen con cada evento en lugar de con un plan superior."
        link: { label: ArenaSoldOut.com frente a TicketSpice, href: /ticketspice-alternative }
      - title: TicketSource
        text: "Un porcentaje de cada reserva, frente a nuestra tarifa fija por entrada. Planos de asientos dibujados para ti en lugar de por ti."
        link: { label: ArenaSoldOut.com frente a TicketSource, href: /ticketsource-alternative }
      - title: Weezevent
        text: "El dinero de las entradas en tu propia cuenta con cada pedido en lugar de un pago cada 15 días, y asientos numerados en cada evento."
