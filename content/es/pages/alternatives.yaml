    title: Elige la plataforma que usas ahora
    items:
      - title: Eventbrite
        text: "Un porcentaje de cada entrada más un importe fijo, frente a nuestros {usdPrice} fijos. Pagos después del evento, frente al dinero en tu cuenta con cada pedido."
        link: { label: ArenaSoldOut.com frente a Eventbrite, href: /eventbrite-alternative }
      - title: Ticket Tailor
        text: "Una tarifa fija por entrada en ambas. La nuestra es menor con pago por uso y con créditos, y un asiento no cuenta como dos entradas."
