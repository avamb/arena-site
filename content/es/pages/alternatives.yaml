  - type: prose
    id: how
    title: Cómo comparamos
    body: |
      **Solo precios publicados.** Una fila entra en una tabla solo si pudimos leerla en la página de precios o en el centro de ayuda de la otra plataforma. El enlace a la fuente y la fecha están debajo de cada tabla.

      **En igualdad de condiciones.** Algunas plataformas incluyen la tarifa de la tarjeta en su comisión; nosotros no, porque el comprador paga en tu propia cuenta de pagos y tu proveedor cobra su propia tarifa de tarjeta. Cada página indica cuál es cuál.

      **Lo que no hacemos.** ArenaSoldOut.com no tiene un mercado donde los compradores exploren eventos, ni pagos sin efectivo en la barra. La lista completa está en la [página de datos](/facts).

      ¿Has encontrado un precio que cambió? [Escríbenos](/contact) y corregimos la página.

