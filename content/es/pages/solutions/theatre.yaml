title: "Venta de entradas para teatro: plano de asientos"
description: "Entradas para teatros con asientos numerados fieles a la sala, fechas repetidas en un plano, invitaciones, reembolsos y cambios de fecha. De 100 a 1.500."
h1: Teatro
lead: Un plano que refleja tu sala, dibujado por nosotros sin coste a partir de tu PDF, boceto o tabla de filas, y reutilizado en cada función. Invitaciones para prensa y socios, reembolsos y cambios de fecha desde el Event Center.
related:
  - { label: Planos de asientos que reflejan la sala, href: /product/seating }
  - { label: "Recintos y clubes: condiciones aparte", href: /solutions/venues }
  - { label: Entradas electrónicas y escaneo, href: /product/tickets }
sections:
  - type: cards
    id: what
    eyebrow: Para teatros
    title: "¿Qué importa en un teatro?"
    items:
      - { title: El plano es tuyo, text: "Filas, palcos, anfiteatro, categorías por precio. Las versiones protegen las entradas vendidas cuando cambia la distribución.", link: { label: Planos de asientos →, href: /product/seating } }
      - { title: Fechas repetidas, text: "Añade sesiones al mismo evento; el plano, los precios y las categorías se mantienen. Cambia o cancela una fecha con correos a los compradores.", link: { label: Event Center →, href: /#center } }
      - { title: Invitaciones, text: "Entradas gratuitas para asientos concretos, para prensa, socios y elenco, que se escanean como cualquier otra entrada.", link: { label: Entradas →, href: /product/tickets } }
      - { title: Tu propia taquilla, text: "Vende en tu web con el widget o en la página alojada; el dinero va a tu cuenta, no pasa por un marketplace.", link: { label: Dónde vendes →, href: /product/sell } }
  - type: faq
    id: questions
    eyebrow: Preguntas
    title: "¿Qué preguntan primero los teatros?"
    items:
      - q: "¿Dibujan ustedes el plano de asientos?"
        a: Sí, sin coste. Envía un PDF del plano, una foto de un boceto a mano o una tabla de filas con los asientos de cada fila; lo dibujamos en tu evento, normalmente en un día, y lo apruebas antes de que empiece la venta.
      - q: "¿Podemos tener precios distintos para platea y anfiteatro?"
        a: Sí. Categorías con sus propios precios, cupos y ventanas; las ventanas de preventa se activan por fecha.
      - q: "Hacemos muchas funciones al mes. ¿Hay otra tarifa?"
        a: "Sí. A los recintos permanentes se les ofrece un porcentaje del precio de la entrada en lugar de la tarifa por entrada; consulta [recintos](/solutions/venues) y [precios](/pricing)."
      - q: "¿Los compradores pueden elegir asientos desde el móvil?"
        a: Sí, el mapa de asientos funciona en móviles con zoom táctil, en el idioma del comprador.
  - type: cta
    id: start
    title: Envíanos tu plano
    text: "Basta con un PDF, una foto de un boceto a mano o una tabla de filas y asientos. Lo dibujamos en tu evento sin coste y te lo mostramos antes de que empiece la venta."
    primary: { label: Empieza a vender, href: /start }
    secondary: { label: Abre el bot de Telegram, href: https://t.me/EventsCentrBot }
    note: "¿Dudas? Escríbenos: el equipo responde en un día laborable."
