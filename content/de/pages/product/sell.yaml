title: "Tickets auf Ihrer Website oder unserer Seite verkaufen"
description: "Widget mit drei Zeilen einbinden, WordPress-Plugin nutzen oder gehostete Verkaufsseite teilen. Käufer zahlen in beiden Fällen auf Ihr eigenes Zahlungskonto."
h1: Ihre Website oder unsere. Das Geld geht in beiden Fällen an Sie.
lead: Zwei Wege zum Verkauf, ein Event Center dahinter. Binden Sie das Widget in die Website ein, die Sie schon haben, oder teilen Sie eine gehostete Seite, die wir in Minuten anlegen. Jede Bestellung landet auf Ihrem eigenen Zahlungskonto.
related:
