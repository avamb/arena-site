title: "E-Tickets mit EAN-13 und QR, Scan, E-Mails an Käufer"
description: "PDF-Tickets mit EAN-13 und QR in der Sprache des Käufers, die MACS-Scanner-App für iOS und Android, Beispiel-Tickets, E-Mails bei Terminverlegung oder Absage."
h1: Ein Ticket, das sich scannen lässt
lead: Jedes Ticket ist ein PDF mit EAN-13-Barcode und QR-Code, in der Sprache des Käufers. Scannen Sie es mit der App oder einem Handscanner, senden Sie es erneut, erstatten Sie es, ersetzen Sie es bei einer Terminverlegung.
