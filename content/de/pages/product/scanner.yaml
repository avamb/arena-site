title: "MACS-Scanner-App: Tickets scannen auf iOS und Android"
description: "MACS scannt EAN-13- und QR-Tickets aller Veranstalter der Plattform und Partner, auf iPhone, iPad, Android und Handscannern. Kostenlos in den App-Stores."
h1: "MACS: die App am Einlass"
lead: Eine App für jeden Eingang. Das Einlasspersonal meldet sich an, wählt die Vorstellung und scannt den EAN-13 oder den QR-Code auf dem Ticket, auf Papier oder auf dem Bildschirm. Sie nimmt Tickets jedes Veranstalters an, der über ArenaSoldOut.com verkauft, und Partner-Tickets aus anderen Systemen, sodass eine Spielstätte für jedes Event dieselben Smartphones nutzt.
