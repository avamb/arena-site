sections:
  - type: faq
    id: questions
    eyebrow: Saalplan
    title: Wie funktionieren Plätze mit ArenaSoldOut.com?
    items:
      - q: Muss ich den Plan selbst zeichnen?
        a: "Nein, nie. Senden Sie uns den Plan, und wir zeichnen ihn kostenlos in Ihr Event, meist binnen eines Tages. Eines davon genügt: ein PDF des Saalplans, ein Foto einer Handskizze oder eine Tabelle mit Reihen und den Plätzen jeder Reihe (Excel oder Google Sheets). Vektordateien (SVG) werden direkt importiert."
      - q: Kann ein Event Sitz- und Stehplätze haben?
        a: Ja, in einem Plan. Reservierte Reihen mit Kategorien, Stehbereiche mit Kontingenten, jede Kategorie mit eigenem Preis und eigenem Verkaufszeitraum.
      - q: Kann ich den Plan ändern, nachdem der Verkauf begonnen hat?
        a: Ja. Pläne haben Versionen, sodass ein neues Layout für die nächste Vorstellung die bereits verkauften Tickets nicht berührt.
      - q: Was kostet mich ein Ticket mit Platz?
        a: "Die Provision für ein Ticket mit Platz beträgt US$1,09 (€0,97 in EU-Ländern), gegenüber US$0,59 (€0,53) ohne Platz; mit Credits sinkt sie. Der Plan selbst ist kostenlos. Siehe [Preise](/pricing)."
      - q: Wählt der Käufer den Platz auf dem Smartphone?
        a: Ja. Der Saalplan ist im Widget und auf der gehosteten Seite derselbe, mit Zoomen per Zwei-Finger-Geste auf dem Smartphone, einer Legende pro Kategorie und einem Reservierungs-Timer für gewählte Plätze.
      - q: Und Freikarten und Pressenplätze?
        a: Stellen Sie kostenlose Tickets für bestimmte Plätze aus dem Event Center aus; sie werden am Einlass wie jedes Ticket gescannt.
