title: "Saalpläne: reservierte Plätze und Stehbereiche"
description: "Saalpläne mit Versionen, SVG-Import, Sitz- und Stehplätze gemischt, Preise pro Kategorie. Senden Sie PDF, Skizze oder Tabelle, wir zeichnen kostenlos."
h1: Saalpläne, die zur Spielstätte passen
lead: Reservierte Plätze gehören zum Kern der Plattform, sie sind kein Zusatz. Das Team baut Ihren Plan aus allem, was Sie haben, meist binnen eines Tages, und nutzt ihn für jeden Termin wieder.
