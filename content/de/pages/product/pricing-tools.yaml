sections:
  - type: faq
    id: questions
    eyebrow: Preis-Werkzeuge
    title: Was kann ich mit Preisen machen?
    items:
      - q: Kann ich Promo-Codes verwenden?
        a: Ja. Ein Code kann für ein Event, eine Vorstellung oder eine Kategorie gelten, mit Verkaufszeitraum, Mindestbestellung und Limit pro Käufer. Partner erhalten eigene Codes.
      - q: Gibt es ein fertiges Preisschema?
        a: "Ja, Smart Price. Wählen Sie ein fertiges Schema aus Preisstufen nach Menge und Datum, statt jede Stufe von Hand einzustellen. Anschließend können Sie es anpassen."
      - q: Kann ein Ticket nur zusammen mit einem anderen verkauft werden?
        a: "Ja, mit Zusatzkategorien. Ein Zusatz wird nur zusammen mit einem Ticket einer Hauptkategorie derselben Vorstellung verkauft. Ein Kinderticket lässt sich zum Beispiel nicht ohne Erwachsenenticket verkaufen, und „ein weiteres Kind“ wird zu „Kind plus Erwachsener“ hinzugefügt. Sind die Hauptkategorien ausverkauft, wird die Vorstellung als ausverkauft angezeigt."
      - q: Können sich Preise zu einem von mir festgelegten Datum ändern?
        a: Ja. Early-Bird-Zeiträume wechseln nach Datum und Uhrzeit. Mengenstufen öffnen den nächsten Preis, wenn der aktuelle ausverkauft ist, sodass eine ausverkaufte Stufe den Verkauf nie blockiert.
      - q: Mehrere Preise für ein Event?
        a: Ja. Kategorien mit eigenem Preis, eigenem Kontingent und eigenem Verkaufszeitraum. Kategorien können Ketten bilden, die nicht verkaufte Plätze an die nächste weitergeben.
      - q: Kann ich eine Servicegebühr aufschlagen?
        a: Ja. Ein Prozentsatz pro Verkaufskanal, dem Käufer als eigene Zeile angezeigt und zusammen mit dem Ticketpreis auf Ihr Konto gezahlt.
      - q: Kostenlose Tickets und Zahl-was-Sie-möchten?
        a: Ja, beides. Kostenlose Tickets für Freikarten und Anmeldungen sowie Zahl-was-Sie-möchten-Tickets mit einem von Ihnen festgelegten Mindestbetrag.
      - q: Funktionieren Rabatte mit Plätzen?
        a: Ja. Codes und Zeiträume gelten für Kategorien mit Platz ebenso wie für Stehbereiche.
