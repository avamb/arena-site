title: "Promo-Codes, Early Bird, Preisstufen, Zahl-was-Sie-möchten"
description: "Promo-Codes mit Geltungsbereich und Limits, Preiszeiträume nach Datum, Mengenstufen, Kategorieketten, Servicegebühr je Kanal, Gratis- und Zahl-was-Sie-möchten."
h1: Preise, die sich so ändern, wie Sie es geplant haben
lead: Early Bird nach Datum, der nächste Preis, wenn eine Stufe ausverkauft ist, Codes für Partner, eine Servicegebühr pro Kanal. Alles wird im Event Center eingestellt und im Widget und auf der gehosteten Seite angewendet.
