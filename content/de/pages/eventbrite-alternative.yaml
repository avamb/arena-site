  - type: prose
    id: examples
    title: Was bedeutet das für ein Event?
    body: |
      Alle Zahlen zu den Preisen beider Plattformen Stand 11. November 2026.

      **1.000 Tickets zu US$30, Pay as you go.** ArenaSoldOut.com: 1.000 × US$0,62 = **US$620**. Eventbrite: 1.000 × (3,7% von US$30 + US$1,79) = US$2.900. Das sind **US$2.280** Unterschied, vor der Kartenabwicklung auf beiden Seiten.

      **300 Tickets mit Platz zu US$60.** ArenaSoldOut.com: 300 × US$1,18 = **US$354**, und den Saalplan zeichnen wir kostenlos. Eventbrite: 300 × (3,7% von US$60 + US$1,79) = US$1.203.

      **Je mehr ein Ticket kostet, desto größer der Abstand.** Unsere Provision bleibt bei einem Ticket zu US$15 und bei einem zu US$150 gleich. Ein Prozentsatz wächst mit dem Preis.

      Rechnen Sie Ihr eigenes Event im [Rechner auf der Preisseite](/pricing#packages) durch.

  - type: cards
    id: more
    eyebrow: Mehr als der Preis
    title: Was ist mit ArenaSoldOut.com sonst anders?
    items:
      - title: Das Geld gehört Ihnen ab der ersten Bestellung
        text: "Käufer zahlen auf Ihr eigenes Stripe-, Flitt- oder AllPay-Konto. ArenaSoldOut.com hält nie Gelder, also müssen Sie nach der Veranstaltung auf keine Auszahlung warten."
        link: { label: Zahlungen, href: /payments }
      - title: Saalpläne, die wir für Sie zeichnen, kostenlos
        text: "Senden Sie ein PDF, ein Foto einer Handskizze oder eine Tabelle mit Reihen und Plätzen. Das Team baut die Spielstätte nach; Sie zeichnen sie nie selbst."
        link: { label: Saalpläne, href: /product/seating }
      - title: Niedrigerer Satz für günstige Tickets
        text: "Wenn jedes Ticket des Events {usdLowMax} oder weniger kostet: {lowPercent}% des Ticketpreises statt der festen Gebühr. Discos, Läufe, Kindergeburtstage, Ausflüge."
        link: { label: So funktioniert es, href: /pricing#low-price }
      - title: Ihre Seite, Ihre Käufer
        text: "Verkaufen Sie auf Ihrer eigenen Website mit dem Ticket-Widget oder auf Ihrer Seite bei uns. Die Käufer kommen zu Ihnen, nicht in einen Katalog neben anderen Events."
        link: { label: Verkaufen auf Ihrer Website oder unserer, href: /product/sell }
      - title: Jeder Verkauf in Ihrem Telegram
        text: "Legen Sie im Telegram-Bot ein Event aus einem Plakatfoto an und sehen Sie jeden Verkauf und jede Erstattung binnen Sekunden in Ihrer Gruppe."
        link: { label: Telegram-Bot, href: /product/telegram }
      - title: Selbst einrichten oder abgeben
        text: "Events, Preise und Kategorien legen Sie selbst im Event Center oder im Telegram-Bot an, in Minuten; Saalpläne zeichnen wir kostenlos. Keine Zeit? Unser Event-Manager übernimmt es für Sie, als bezahlte Leistung."
        link: { label: Zusatzleistungen, href: /pricing#services }

  - type: faq
    id: questions
    title: Fragen, die Veranstalter beim Vergleich stellen
    items:
      - q: Ist ArenaSoldOut.com günstiger als Eventbrite?
        a: "Bei der Provision ja, bei jedem Ticketpreis: {usdPrice} pro Ticket statt 3,7% + US$1,79 in den USA und {eurPrice} statt 5,9% + €0,79 in Irland. Die Kartenabwicklung kommt auf beiden Plattformen in den USA dazu."
      - q: Wer zahlt die Gebühr, ich oder der Käufer?
        a: "Sie entscheiden. Sie können Ihre eigene Servicegebühr für den Käufer auf den Ticketpreis aufschlagen oder den Preis lassen, wie er ist, und unsere Provision selbst zahlen. Freikarten und kostenlose Tickets zu kostenpflichtigen Events sind provisionsfrei."
      - q: Wohin geht das Geld des Käufers?
        a: "Mit jeder Bestellung auf Ihr eigenes Zahlungskonto: Stripe, Flitt oder AllPay. ArenaSoldOut.com hält nie Gelder. Unsere Provision wird nach der Veranstaltung in Rechnung gestellt oder von Ihren Credits abgezogen."
      - q: Wird mein Event in einem Marktplatz gelistet?
        a: "Nein. Eventbrite hat einen Marktplatz, auf dem Käufer Events durchstöbern; ArenaSoldOut.com nicht. Wir verkaufen Tickets auf Ihrer Website und auf Ihrer eigenen Eventseite, und Sie holen die Käufer über Ihre eigenen Kanäle."
      - q: Kann ich meine Events von Eventbrite umziehen?
        a: "Ja. Sie legen Ihre Events im Event Center oder im Telegram-Bot an, wir zeichnen Ihre Saalpläne kostenlos, und Sie verkaufen weiter über Eventbrite, bis Ihre Seite bei uns fertig ist. Keine Zeit, es selbst einzurichten? Unser [Event-Manager](/pricing#services) übernimmt es für Sie, als bezahlte Leistung."
      - q: Zahle ich ein Abo?
        a: "Nein. Sie zahlen nur für verkaufte Tickets, nach der Veranstaltung, oder kaufen vorab Credits ab {usdFrom} pro Ticket. Credits verfallen nie."

