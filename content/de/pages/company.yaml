h1: Wer hinter ArenaSoldOut.com steht
lead: Ein kleines Team, das Ticketing-Infrastruktur für Veranstalter baut, die ihre eigenen Tickets verkaufen. Kein Marktplatz, keine Veranstaltungsliste. Veranstalter in 31 Ländern seit 2019; die Plattform dahinter wurde 2026 neu gebaut, und die Veranstalter sind mit ihr umgezogen.
