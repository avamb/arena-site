sections:
  - type: prose
    id: story
    eyebrow: Unternehmen
    title: Was ist ArenaSoldOut.com?
    body: |
      ArenaSoldOut.com ist eine Ticketing-Plattform für Veranstalter: Plätze mit Reservierung und freie Platzwahl in einem Event, das eigene Zahlungskonto des Veranstalters, eine Verkaufsseite, die wir hosten, oder ein Widget auf der Website des Veranstalters, ein Event Center im Browser und in Telegram. Käufer zahlen direkt an den Veranstalter; die Plattform hält das Geld nie.

      Das Unternehmen ist ABH TEAM OÜ, registriert in der Europäischen Union. Die früheren Plattformen der Gründer bedienten Shows des Cirque du Soleil, Stadien der FIFA 2018, die World Choir Games und 800 Eisshows; ArenaSoldOut.com verkauft seit 2019 Tickets für Veranstalter und wurde 2026 von Grund auf neu gebaut.

      Das Team antwortet Veranstaltern persönlich, auf Englisch, Spanisch, Tschechisch, Russisch und Hebräisch. Die meisten Wünsche von Veranstaltern sind innerhalb weniger Wochen umgesetzt; jeder, der in Produktion gegangen ist, steht mit Datum auf der [Seite mit den Änderungen](/changes), und die [Faktenseite](/facts) sagt, was es gibt, was nicht und seit wann.
