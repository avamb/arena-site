  - type: prose
    id: how
    title: So vergleichen wir
    body: |
      **Nur veröffentlichte Preise.** Eine Zeile kommt nur in eine Tabelle, wenn wir sie auf der Preisseite oder im Hilfecenter der anderen Plattform lesen konnten. Quellenlink und Datum stehen unter jeder Tabelle.

      **Gleiches mit Gleichem.** Manche Plattformen schließen die Kartengebühr in ihre Provision ein; wir nicht, denn der Käufer zahlt auf Ihr eigenes Zahlungskonto, und Ihr Anbieter berechnet seine eigene Kartengebühr. Jede Seite sagt, welcher Preis die Kartengebühr enthält und welcher nicht.

      **Was wir nicht tun.** ArenaSoldOut.com hat keinen Marktplatz, auf dem Käufer Events durchstöbern, und keine bargeldlose Bezahlung an der Bar. Die vollständige Liste steht auf der [Fakten-Seite](/facts).

      Ist ein Preis nicht mehr aktuell? [Schreiben Sie uns](/contact), und wir korrigieren die Seite.

