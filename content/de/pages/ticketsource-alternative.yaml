sections:
  - type: compare
    id: prices
    eyebrow: Preis pro Ticket
    title: Was kostet ein Ticket auf jeder Plattform?
    lead: "Preise beider Plattformen Stand 11. November 2026. TicketSource hat zwei Optionen: die eigene Kartenabwicklung, mit eingeschlossener Kartengebühr, oder Ihr eigenes Stripe-Konto zu einem niedrigeren Satz. Die Preise unterscheiden sich zwischen Großbritannien und der EU. Bei ArenaSoldOut.com nutzen Sie immer Ihr eigenes Zahlungskonto, daher ist die zweite Option der faire Vergleich."
    cols: { what: "", us: ArenaSoldOut.com, them: TicketSource }
    rows:
      - { what: "Wie die Gebühr berechnet wird", us: "Feste Gebühr pro Ticket", them: "Prozentsatz jeder bezahlten Buchung" }
      - { what: "Großbritannien, eigenes Stripe-Konto", us: "**{usdPrice}** pro Ticket, etwa £0,47", them: "4,5% + MwSt." }
      - { what: "Großbritannien, Ticket zu £20, eigenes Stripe-Konto", us: "**{usdPrice}**, etwa £0,47", them: "£1,08 (£0,90 + MwSt.)" }
      - { what: "Großbritannien, Ticket zu £50, eigenes Stripe-Konto", us: "**{usdPrice}**, etwa £0,47", them: "£2,70 (£2,25 + MwSt.)" }
      - { what: "Großbritannien, ihre eigene Kartenabwicklung", us: "Nicht angeboten: Sie nutzen immer Ihr eigenes Konto", them: "7% + MwSt., mindestens £0,25 + MwSt., Kartengebühr eingeschlossen" }
      - { what: "EU, eigenes Stripe-Konto", us: "**{eurPrice}** pro Ticket", them: "4,5%" }
      - { what: "EU, Ticket zu €20, eigenes Stripe-Konto", us: "**{eurPrice}**", them: "€0,90" }
      - { what: "EU, Ticket zu €50, eigenes Stripe-Konto", us: "**{eurPrice}**", them: "€2,25" }
      - { what: "EU, ihre eigene Kartenabwicklung", us: "Nicht angeboten: Sie nutzen immer Ihr eigenes Konto", them: "8,5%, mindestens €0,30, Kartengebühr eingeschlossen" }
      - { what: "Wann Sie das Geld bekommen", us: "Mit jeder Bestellung, auf Ihrem eigenen Konto", them: "Mit eigenem Stripe: mit jeder Bestellung. Mit ihrer Abwicklung: am Montag nach der Veranstaltung" }
      - { what: "Wer den Saalplan erstellt", us: "Unser Team, kostenlos, nach Ihrem PDF oder Ihrer Skizze", them: "Sie, im Saalplan-Designer" }
