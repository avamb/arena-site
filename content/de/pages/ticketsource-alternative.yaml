    note: "Preise von TicketSource: [Großbritannien](https://www.ticketsource.com/pricing) und [EU](https://www.ticketsource.com/es/pricing), geprüft am 11. November 2026. Unsere Preise: [Preise](/pricing) und [detaillierte Bedingungen](/pricing/terms). Veranstalter in EU-Ländern zahlen unsere Provision in Euro, überall sonst in US-Dollar; Beträge in Pfund sind zum EZB-Referenzkurs vom 11. November 2026 umgerechnet (US$1 = £0,7515). TicketSource ist eine Marke ihres Inhabers; ArenaSoldOut.com steht in keiner Verbindung zu ihr."

  - type: prose
    id: examples
    title: Was bedeutet das für ein Event?
    body: |
      Alle Zahlen zu den Preisen beider Plattformen Stand 11. November 2026. Unsere Provision ist in US-Dollar; die Beträge in Pfund gelten zum EZB-Referenzkurs desselben Tages, US$1 = £0,7515.

      **400 Tickets zu £25, bei beiden eigenes Stripe-Konto.** ArenaSoldOut.com: 400 × US$0,62 = **US$248, etwa £186**. TicketSource: 400 × (4,5% von £25 + MwSt.) = £540.

      **250 Tickets mit Platz zu £40.** ArenaSoldOut.com: 250 × US$1,18 = **US$295, etwa £222**, und den Saalplan zeichnen wir kostenlos. TicketSource: 250 × (4,5% von £40 + MwSt.) = £540.

      **300 Tickets zu €30 in der EU, bei beiden eigenes Stripe-Konto.** ArenaSoldOut.com: 300 × €0,55 = **€165**. TicketSource: 300 × 4,5% von €30 = €405.

      **Je mehr ein Ticket kostet, desto größer der Abstand.** Unsere Provision bleibt bei einem Ticket zu £15 und bei einem zu £150 gleich. Ein Prozentsatz wächst mit dem Preis.

      Rechnen Sie Ihr eigenes Event im [Rechner auf der Preisseite](/pricing#packages) durch.

  - type: cards
    id: more
    eyebrow: Mehr als der Preis
    title: Was bekommen Sie sonst noch mit ArenaSoldOut.com?
    items:
      - title: Saalpläne, die wir für Sie zeichnen, kostenlos
        text: "Senden Sie ein PDF, ein Foto einer Handskizze oder eine Tabelle mit Reihen und Plätzen. Das Team baut die Spielstätte nach; Sie zeichnen sie nie selbst."
        link: { label: Saalpläne, href: /product/seating }
      - title: Das Geld direkt auf Ihr Konto
        text: "Käufer zahlen mit jeder Bestellung auf Ihr eigenes Stripe-, Flitt- oder AllPay-Konto. ArenaSoldOut.com hält nie Gelder und zieht nichts von Ihren Verkäufen ab."
        link: { label: Zahlungen, href: /payments }
      - title: Niedrigerer Satz für günstige Tickets
        text: "Wenn jedes Ticket des Events {usdLowMax} oder weniger kostet: {lowPercent}% des Ticketpreises statt der festen Gebühr. Discos, Läufe, Kindergeburtstage, Ausflüge."
        link: { label: So funktioniert es, href: /pricing#low-price }
      - title: Käufer in ihrer eigenen Sprache
        text: "Käuferseite, E-Mails und Tickets in der Sprache des Käufers, auch Hebräisch von rechts nach links. Jede neue Sprache fügen wir innerhalb von 40 Stunden hinzu."
        link: { label: E-Tickets, href: /product/tickets }
      - title: Jeder Verkauf in Ihrem Telegram
        text: "Legen Sie im Telegram-Bot ein Event aus einem Plakatfoto an und sehen Sie jeden Verkauf und jede Erstattung binnen Sekunden in Ihrer Gruppe."
        link: { label: Telegram-Bot, href: /product/telegram }
      - title: Selbst einrichten oder abgeben
        text: "Sie legen Events in Minuten im Event Center oder im Telegram-Bot an; Saalpläne zeichnen wir kostenlos. Keine Zeit? Unser Event-Manager übernimmt es für Sie, als kostenpflichtige Leistung."
        link: { label: Event-Manager, href: /pricing#services }

  - type: faq
    id: questions
    title: Fragen, die Veranstalter beim Vergleich stellen
    items:
      - q: Ist ArenaSoldOut.com günstiger als TicketSource?
        a: "Mit eigenem Stripe-Konto bei beiden ja, bei jedem Ticket über etwa £9 in Großbritannien und über etwa €12 in der EU: {usdPrice} pro Ticket statt 4,5% plus MwSt. in Großbritannien, {eurPrice} statt 4,5% in der EU. Bei einem Ticket zu £20 sind das etwa £0,47 gegen £1,08; bei einem Ticket zu €20 {eurPrice} gegen €0,90."
      - q: Ist die Kartengebühr in Ihrer Provision enthalten?
        a: "Nein. Die Kartengebühr berechnet Ihr eigener Zahlungsanbieter zu Ihrem Satz, und unsere Provision kommt getrennt dazu. Die eigene Abwicklung von TicketSource (7% + MwSt. in Großbritannien, 8,5% in der EU) schließt die Kartengebühr ein; ihre Option mit 4,5% und Ihrem eigenen Stripe-Konto tut das, wie bei uns, nicht."
      - q: Wohin geht das Geld des Käufers?
        a: "Mit jeder Bestellung auf Ihr eigenes Zahlungskonto: Stripe, Flitt oder AllPay. ArenaSoldOut.com hält nie Gelder. Unsere Provision wird nach der Veranstaltung in Rechnung gestellt oder von Ihren Credits abgezogen."
      - q: Kann ich meine Events von TicketSource umziehen?
        a: "Ja. Sie legen die Events in Minuten im Event Center oder im Telegram-Bot an, und wir zeichnen Ihre Saalpläne kostenlos nach Ihrem PDF oder Ihrer Skizze. Keine Zeit? Unser Event-Manager zieht sie für Sie um, als kostenpflichtige Leistung. Verkaufen Sie weiter über TicketSource, bis Ihre Seite bei uns fertig ist."
      - q: Und gemeinnützige Organisationen?
        a: "Eingetragene gemeinnützige Organisationen erhalten 50% Rabatt auf unsere Provision. Schreiben Sie uns, und wir schalten ihn für Ihre Organisation frei."
      - q: Zahle ich ein Abo?
        a: "Nein. Sie zahlen nur für verkaufte Tickets. Freikarten und kostenlose Tickets zu kostenpflichtigen Events sind provisionsfrei."

