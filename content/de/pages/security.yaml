title: "Sicherheit bei ArenaSoldOut.com"
description: "Wie ArenaSoldOut.com Daten von Veranstaltern und Käufern schützt: Hosting in der EU, Kartenzahlung auf der Seite des Anbieters, Trennung der Veranstalter."
h1: "Sicherheit bei ArenaSoldOut.com"
lead: "Wir wickeln den Ticketverkauf ab und verwalten die Kontaktdaten der Käufer von Veranstaltern. Deshalb gehen wir mit Sicherheit praktisch und konkret um. Das tun wir heute."
