  - type: faq
    id: questions
    eyebrow: Fragen zum Geld
    title: Was kostet mich ein Ticket genau?
    items:
      - q: Wie viel kostet ein Ticket mit Platz?
        a: "Bei Zahlung nach der Veranstaltung: US$1,09 außerhalb der EU, €0,97 in der EU. Ein Ticket ohne Platz kostet US$0,59 oder €0,53. Der Saalplan selbst kostet nichts: Wir zeichnen ihn kostenlos nach einem PDF, einem Foto einer Handskizze oder einer Tabelle mit Reihen und Plätzen. Mit Credits ist die Provision niedriger, und ein Platz kostet US$0,35 (€0,31) zusätzlich zum Credit-Preis."
      - q: Wie funktionieren Credits?
        a: "Sie kaufen einmal ein Credit-Paket. Jedes verkaufte Ticket zieht seine Provision zum Preis des Pakets von Ihren Credits ab, bis sie aufgebraucht sind. Credits verfallen nie, können jederzeit aufgeladen werden und werden nur für unsere Leistungen verwendet: Sie lassen sich weder auszahlen noch übertragen."
      - q: Was, wenn die Credits mitten im Verkauf aufgebraucht sind?
        a: Der Verkauf stoppt nicht. Die Tickets, die Ihre Credits nicht abgedeckt haben, kommen zum Preis bei Zahlung nach der Veranstaltung in die übliche Rechnung.
      - q: Gibt es eine automatische Aufladung?
        a: Ja. Sie können sie einschalten, und wenn Ihre Credits unter Ihren Schwellenwert fallen, wird das nächste Paket für Sie gekauft.
      - q: Wohin geht das Geld des Käufers?
        a: "Auf Ihr eigenes Zahlungskonto, mit jeder Bestellung. ArenaSoldOut.com hält nie Gelder. Der Käufer zahlt den Ticketpreis und, wenn Sie eine aufschlagen, Ihre Servicegebühr."
      - q: Wann zahle ich ArenaSoldOut.com?
        a: "Nach der Veranstaltung, per Banküberweisung, für die verkauften Tickets. Bei Events, die mehrere Monate im Verkauf sind, und bei festen Spielstätten einmal im Monat. Credits werden beim Kauf bezahlt."
      - q: Wie sieht es mit der Kartenabwicklung aus?
        a: Die Kartenabwicklung ist ein Vertrag zwischen Ihnen und Ihrem Zahlungsanbieter, zu dessen Konditionen. Sie ist nicht Teil unserer Provision, und wir schlagen nichts darauf.
      - q: Muss ich ArenaSoldOut.com auf meiner Website nennen?
        a: "Die Preise setzen voraus, dass die Eventseite ArenaSoldOut.com mit einem Link zu uns als Ticketbetreiber nennt; das Ticket-Widget zeigt diese Zeile standardmäßig an. Um ohne unseren Namen zu verkaufen, kostet White Label €45 im Monat pro Marke oder Spielstätte in EU-Ländern und US$45 im Monat pro Marke oder Spielstätte in allen anderen Ländern, bei einem nicht vollen Monat tageweise berechnet. Die [detaillierten Bedingungen](/pricing/terms) erklären, was eine Marke ist und was White Label verbirgt."
      - q: Gibt es einen Rabatt für gemeinnützige Organisationen?
        a: "Ja. Eingetragene gemeinnützige Organisationen zahlen 50% unserer Provision, bei Pay as you go und mit Credits. Schreiben Sie uns über die [Kontaktseite](/contact), und wir schalten es für Ihre Organisation frei."
      - q: Sind Freikarten kostenlos?
        a: Ja. Freikarten und kostenlose Tickets zu kostenpflichtigen Events sind provisionsfrei.
      - q: Was passiert mit der Provision, wenn ein Ticket erstattet oder der Termin verlegt wird?
        a: "Der Käufer erhält die Erstattung von Ihnen. Die Provision für einen bereits erfolgten Verkauf bleibt bestehen, und wir berechnen keine gesonderte Provision für die Bearbeitung der Erstattung, für das Verlegen des Termins oder für die E-Mails an die Käufer. Die eigenen Konditionen des Zahlungsanbieters sind Sache des Anbieters."
      - q: Was, wenn ich das Event absage?
        a: "Die bereits berechnete Provision wird nicht in Geld zurückgezahlt. Schreiben Sie uns zu Ihrem Fall, bevor das Event abgesagt wird."
      - q: Eines meiner Tickets kostet mehr als US$10 (€10 in der EU), die übrigen sind günstig. Welcher Preis gilt?
        a: "Der Standardpreis, für alle Tickets des Events: Der niedrigere Satz setzt voraus, dass jedes Ticket jeder Kategorie und Preisstufe US$10 oder weniger kostet (€10 in der EU). Ein Ticket für US$5 neben einem Ticket für US$25 gilt zum Standardpreis."
      - q: Ich betreibe eine Spielstätte und richte viele Events im Monat aus. Gibt es ein anderes Angebot?
        a: "Ja. Inhaber fester Spielstätten (Theater, Clubs, Stadien, Zirkusse und andere Orte, die selbst Veranstaltungen ausrichten, ganzjährig oder saisonal) zahlen {percent}% des Ticketpreises, berechnet nach Promo-Codes und ohne Ihre Servicegebühr. Die Provision pro Ticket ist auf US$1,09 (€1,09 in der EU) begrenzt, mit und ohne Platz gleich. Freikarten sind provisionsfrei. Wir stellen monatlich Rechnung. Unser Team schaltet den Spielstätten-Status frei: Schreiben Sie uns über die [Kontaktseite](/contact). Die vollständigen Bedingungen stehen in den [detaillierten Bedingungen](/pricing/terms)."

