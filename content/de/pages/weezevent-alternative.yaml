  - type: prose
    id: examples
    title: Was bedeutet der Unterschied in der Praxis?
    body: |
      Alle Zahlen zu den Preisen beider Plattformen Stand 11. November 2026.

      **Geld vor dem Event.** Ein Festival verkauft 2.000 Tickets in den drei Wochen vor dem Einlass. Bei ArenaSoldOut.com landet jede Zahlung in dem Moment auf Ihrem eigenen Konto, in dem die Bestellung bezahlt ist, sodass Sie Bühne, Ton und Sicherheitsdienst mit Ticketgeld bezahlen. Bei einer Auszahlung alle 15 Tage kommt ein Teil dieses Geldes später an, als Sie es brauchten.

      **Ein Theater mit nummerierten Plätzen.** Bei uns gehört der Saalplan zu jedem Event: Sie senden ein PDF oder ein Foto einer Handskizze, das Team baut den Plan kostenlos, und ein Ticket mit Platz kostet {eurSeated}. Bei Weezevent sind nummerierte Sitzplätze im maßgeschneiderten Angebot enthalten, Preis auf Anfrage.

      **Die Provision selbst.** Unsere beträgt {eurPrice} pro Ticket, egal was das Ticket kostet; die von Weezevent 2,5% mit einem Minimum von €0,99, Bankgebühren eingeschlossen. Addieren Sie die Kartengebühr Ihres Zahlungsanbieters zu unserer, um die Gesamtkosten für Ihren Ticketpreis zu vergleichen.

  - type: cards
    id: more
    eyebrow: Mehr als der Preis
    title: Was bekommen Sie sonst noch mit ArenaSoldOut.com?
    items:
      - title: Das Geld direkt auf Ihr Konto
        text: "Käufer zahlen auf Ihr eigenes Stripe-, Flitt- oder AllPay-Konto. ArenaSoldOut.com hält nie Gelder und zieht nichts von Ihren Verkäufen ab."
        link: { label: Zahlungen, href: /payments }
      - title: Saalpläne, die wir für Sie zeichnen, kostenlos
        text: "Senden Sie ein PDF, ein Foto einer Handskizze oder eine Tabelle mit Reihen und Plätzen. Das Team baut die Spielstätte nach; Sie zeichnen sie nie selbst."
        link: { label: Saalpläne, href: /product/seating }
      - title: Niedrigerer Satz für günstige Tickets
        text: "Wenn jedes Ticket des Events {eurLowMax} oder weniger kostet: {lowPercent}% des Ticketpreises statt der festen Gebühr. Discos, Läufe, Kindergeburtstage, Ausflüge."
        link: { label: So funktioniert es, href: /pricing#low-price }
      - title: Käufer in ihrer eigenen Sprache
        text: "Käuferseite, E-Mails und Tickets in der Sprache des Käufers, auch Hebräisch von rechts nach links. Jede neue Sprache fügen wir innerhalb von 40 Stunden hinzu."
        link: { label: E-Tickets, href: /product/tickets }
      - title: Jeder Verkauf in Ihrem Telegram
        text: "Legen Sie im Telegram-Bot ein Event aus einem Plakatfoto an und sehen Sie jeden Verkauf und jede Erstattung binnen Sekunden in Ihrer Gruppe."
        link: { label: Telegram-Bot, href: /product/telegram }
      - title: Selbst einrichten oder abgeben
        text: "Sie legen Events in Minuten im Event Center oder im Telegram-Bot an; Saalpläne zeichnen wir kostenlos. Keine Zeit? Unser Event-Manager übernimmt es für Sie, als kostenpflichtige Leistung."
        link: { label: Event-Manager, href: /pricing#services }

  - type: faq
    id: questions
    title: Fragen, die Veranstalter beim Vergleich stellen
    items:
      - q: Ist ArenaSoldOut.com günstiger als Weezevent?
        a: "Unsere Provision ist niedriger: {eurPrice} pro Ticket gegen mindestens €0,99 bei Weezevent. Die Provision von Weezevent schließt Bankgebühren ein, unsere nicht; addieren Sie daher die Kartengebühr Ihres Zahlungsanbieters zu unserer, um die Gesamtkosten für Ihren Ticketpreis zu vergleichen."
      - q: Wann bekomme ich das Ticketgeld?
        a: "Mit jeder Bestellung. Der Käufer zahlt auf Ihr eigenes Zahlungskonto: Stripe, Flitt oder AllPay. ArenaSoldOut.com hält nie Gelder. Unsere Provision wird nach der Veranstaltung in Rechnung gestellt oder von Ihren Credits abgezogen."
      - q: Bieten Sie bargeldlose Bezahlung und RFID-Armbänder an?
        a: "Nein. ArenaSoldOut.com verkauft Tickets und prüft sie am Einlass mit der Scanner-App MACS. Wenn Sie bargeldlose Bezahlung an der Bar brauchen, behalten Sie dafür einen eigenen Anbieter."
      - q: Kann ich meine Events von Weezevent umziehen?
        a: "Ja. Sie legen die Events in Minuten im Event Center oder im Telegram-Bot an, und wir zeichnen Ihre Saalpläne kostenlos nach Ihrem PDF oder Ihrer Skizze. Keine Zeit? Unser Event-Manager zieht sie für Sie um, als kostenpflichtige Leistung. Verkaufen Sie weiter über Weezevent, bis Ihre Seite bei uns fertig ist."
      - q: Zahle ich ein Abo?
        a: "Nein. Sie zahlen nur für verkaufte Tickets. Freikarten und kostenlose Tickets zu kostenpflichtigen Events sind provisionsfrei."

