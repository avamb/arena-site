    title: Käufer zahlen an Sie. Nicht an uns.
    lead: 100% jedes Verkaufs gehen an Sie. Der Käufer zahlt den Ticketpreis und, wenn Sie eine aufschlagen, die Servicegebühr direkt auf Ihr eigenes Zahlungskonto, in Ihrer Währung, auf Ihrem Kontoauszug. ArenaSoldOut.com hält Ihr Geld nie. Sie zahlen ArenaSoldOut.com die Plattform-Provision pro verkauftem Ticket, nach der Veranstaltung oder aus einem vorausbezahlten Paket. Erstattungen und Chargebacks entscheiden Sie, nicht eine Plattformregel.
