  - type: steps
    id: how
    eyebrow: So funktioniert es
    title: Heute im Verkauf. Drei Fragen, die Veranstalter zuerst stellen.
    items:
      - title: Wie schnell kann ich in den Verkauf gehen?
        text: "Ein Event ohne Saalplan geht in 10 Minuten in den Verkauf, sobald Ihre Organisation bestätigt und Ihr Zahlungskonto verbunden ist; das verbinden Sie einmal. Für eine Spielstätte mit Sitzplätzen schicken Sie uns Ihren Plan: Wir zeichnen ihn kostenlos, meist innerhalb eines Tages."
      - title: Was brauche ich?
        text: "Den Namen und den Zeitplan des Events, Ihre Ticketpreise, Ihr Plakat und Ihr eigenes Zahlungskonto: Stripe, Flitt, AllPay oder einen anderen Anbieter Ihres Landes. Das Geld geht ab dem ersten Ticket an Sie."
      - title: Wie richte ich es ein?
        text: "Im Browser am Computer oder Telefon, im „Event Center“*. Oder in Telegram, wo der Bot Ihr Plakat liest und Termine, Preise und Spielstätte zur Bestätigung einträgt. Oder Sie schicken es uns, und wir richten es ein."
    note: "* Das „Event Center“ ist Ihr Veranstalterkonto bei ArenaSoldOut.com: jedes Event, jede Bestellung, Erstattung, Freikarte und Vorstellung, für Sie und Ihr Team, im Browser und in Telegram. [Das Event Center unten ansehen →](#center) Jeder Schritt von der Anmeldung bis zum Scanner: [Ihr erstes Event →](/first-event)"

  - type: ways
    id: where
    eyebrow: Wo Sie verkaufen
    title: Auf Ihrer Website, auf unserer Seite, bei Partnern und in sozialen Netzwerken. Das Geld geht in jedem Fall an Sie.
    items:
      - title: Ihre Website
        text: "Ihre Website ist der Checkout. Binden Sie das Ticket-Widget auf jeder Seite ein: WordPress, Tilda, Wix, Webflow oder eigener Code. Käufer verlassen Ihre Domain nie."
        bullets:
          - Widget auf jeder Website, drei Zeilen Code
          - WordPress-Integration
          - Ihre Farben, Ihre Schriften, Ihre Sprache
      - title: Unsere Verkaufsseite
        text: "Wir hosten die Verkaufsseite: tickets.arenasoldout.com/your-name/your-event. Ein Link für das Plakat, den Newsletter und Messenger."
        bullets:
          - Eine Seite pro Veranstalter und pro Event
          - In Minuten fertig, ohne Designarbeit
          - Links zu Ihren Partner-Verkäufern auf derselben Seite
      - title: Websites von Partnern
        text: "Dasselbe Widget kommt auf die Website einer Spielstätte, eines Promoters oder einer Agentur. Jeder Promoter bekommt eine eigene Verkaufsseite und einen eigenen Link."
        bullets:
          - Widget auf der Website eines Partners
          - Eine eigene Seite und ein eigener Link für jeden Promoter
          - Alle Verkäufe der Partner in einem Event Center
      - title: Soziale Netzwerke und Messenger
        text: "Ein Verkaufslink auf Instagram, Facebook, Telegram und WhatsApp, auf dem Plakat und im Newsletter. Ein QR-Code mit kurzem Link am Einlass: Wer ihn scannt, kauft sein Ticket direkt vor Ort."
        bullets:
          - Ein Link für jeden Kanal
          - Ein QR-Code auf dem Plakat und am Einlass
          - Verkaufsquellen nach UTM-Parametern

  - type: qa
    id: answers
    eyebrow: Funktionen
    title: Alles, was Veranstalter brauchen, auf einer Plattform
    more: { label: Alle Funktionen →, href: /features }
    items:
      - title: Rabattcodes
        text: Ein Code kann für ein Event, eine Vorstellung oder eine Kategorie gelten, mit Zeitfenster, Mindestmenge und Limit pro Käufer.
      - title: Preise, die sich von selbst ändern
        text: Early-Bird-Fenster wechseln nach Datum und Uhrzeit. Mengenstufen öffnen den nächsten Preis, wenn der aktuelle ausverkauft ist.
        visual:
          type: ladder
          rungs:
            - { price: US$24, width: 100, label: erste 100 · verkauft }
            - { price: US$119, width: 62, label: nächste 150 · im Verkauf }
            - { price: US$599, width: 0, label: öffnet danach, next: true }
      - title: Kategorien und kostenlose Tickets
        text: Kategorien mit eigenem Preis, Kontingent und Verkaufsfenster, dazu kostenlose Tickets und Tickets zum selbst gewählten Preis.
      - title: Ihre eigene Servicegebühr
        text: Ein Prozentsatz pro Verkaufskanal, dem Käufer als eigene Zeile angezeigt und zusammen mit dem Ticket auf Ihr Konto gezahlt, vollständig für Sie. Prüfen Sie, ob Ihr Land eine Servicegebühr auf Ticketverkäufe erlaubt.
      - title: Sitz- und Stehplätze
        text: "Ein Saalplan mit Kategorien und Stehbereiche mit Kontingenten, in einem Event. Schicken Sie uns den Plan Ihrer Spielstätte, wir zeichnen ihn kostenlos im System, meist innerhalb eines Tages: Ein PDF, ein Foto einer Handskizze oder eine Tabelle der Reihen mit den Plätzen je Reihe (Excel oder Google Sheets) genügt. Von Hand eingeben müssen Sie ihn nie."
        visual:
          type: plan
          aria: Saalplan mit Parkett, zwei Logen, einem Balkon und einem Stehbereich
          stage: Bühne
          parterre: Parkett · 312
          logeLeft: Loge L · 48
          logeRight: Loge R · 48
          balcony: Balkon · 180
          standing: Stehplätze
      - title: Tickets und Einlass
        text: Jedes Ticket ist ein PDF mit EAN-13-Barcode und QR-Code, in der Sprache des Käufers. Scannen Sie am Einlass mit der Scanner-App für iOS und Android oder mit einem Handscanner. Die App nimmt auch Tickets an, die Ihre Partner in anderen Systemen verkauft haben.
        visual:
          type: ticket
          event: Autumn Jazz Night
          meta: Fr 24. Okt · 19:30 · Palác Akropolis
          seat: Parkett · Reihe G · Platz 7
          code: "2173049188256"
      - title: Verkäufe in Echtzeit
        text: "In Ihrem „Event Center“, Ihrem eigenen Konto auf dieser Seite: am Telefon oder Computer öffnen, nichts zu installieren. Alle Ihre Events, jede Bestellung, Erstattungen und Summen pro Vorstellung, sichtbar nur für Sie und Ihr Team. UTM-Parameter zeigen, woher die Käufer kommen. Lieber Telegram? Jeder Verkauf und jede Erstattung landet auch in Sekunden in Ihrer Telegram-Gruppe, mit dem Kontakt des Käufers. [Das Event Center unten ansehen →](#center)"
        visual:
          type: telegram
          from: ArenaSoldOut.com
          lines:
            - "**Bezahlt** · Autumn Jazz Night · Fr 24. Okt"
            - Reihe G 7–8 · Parkett
            - "**€76.00** · Anna K. · +420 ••• 41 18"
          time: "19:42"
      - title: Erstattungen, Freikarten, Terminänderungen
        text: "Alles in Ihrem Konto im „Event Center“: ein Ticket erstatten, Freikarten ausstellen, eine Vorstellung verlegen oder absagen. Wird eine Veranstaltung abgesagt oder verlegt, entscheiden Sie, was mit dem Geld geschieht: allen erstatten oder einen neuen Termin anbieten. Käufer erhalten eine E-Mail in ihrer Sprache mit dem aktualisierten Ticket."
      - title: Zuverlässigkeit
        text: 800 Bestellungen pro Minute bei 1.000 Käufern gleichzeitig auf der Seite in Lasttests, nächtliche verschlüsselte Backups, ein Watchdog, der die Plattform rund um die Uhr im Blick behält.
      - title: Ein QR-Code am Eingang
        text: Drucken Sie einen QR-Code mit einem kurzen Kauflink aus und hängen Sie ihn am Eingang auf. Besucher scannen ihn und kaufen ihr Ticket direkt vor Ort, auch wenn sie ohne gekommen sind.
      - title: API auf Anfrage
        text: Die API, Webhooks und der Import von Events mit einem einzigen Aufruf werden auf Anfrage eingerichtet, wenn Ihr Ticketverkauf an Ihr eigenes System angebunden werden soll.

