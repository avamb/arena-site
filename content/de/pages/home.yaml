  # {price}, {seated}, {countries} und {since} kommen aus content/data (pricing, clients).
  - type: reasons
    id: why
    eyebrow: Warum ArenaSoldOut.com
    title: Warum verkaufen Veranstalter ihre Tickets bei uns?
    lead: "Vier Gründe, jeweils mit den Fakten dahinter."
    items:
      - icon: wallet
        title: Sie behalten mehr von jedem Ticket
        text: "Pauschal **{price}** pro Ticket, kein Prozentsatz Ihres Umsatzes: Ein Ticket für $15 und ein Ticket für $150 kosten Sie gleich viel. Käufer zahlen auf Ihr eigenes Zahlungskonto, das Geld gehört Ihnen also in dem Moment, in dem sie zahlen, nicht erst nach der Veranstaltung."
        bullets:
          - Nichts wird von Ihren Einnahmen abgezogen, keine Rücklage einbehalten
          - Keine Provision auf Freikarten und kostenlose Tickets
          - Ihren Saalplan zeichnen wir kostenlos
        link: { label: Preise und Rechner →, href: /pricing }
      - icon: clock
        title: In 10 Minuten im Verkauf
        text: "Sobald Ihre Organisation bestätigt ist, meist innerhalb eines Tages, geht ein Event ohne Saalplan in **10 Minuten** in den Verkauf, wenn Sie bereits ein Konto bei einem Zahlungsanbieter haben. Dieses Konto verbinden Sie einmal; jedes weitere Event braucht nur Namen, Termine und Preise."
        link: { label: "Ihr erstes Event, Schritt für Schritt →", href: /first-event }
      - icon: list-checks
        title: Was Veranstalter verlangen, ist schon eingebaut
        text: "Keine Module zu kaufen, keine Plugins zu installieren:"
        bullets:
          - Widget auf Ihrer Website oder eine Verkaufsseite, die wir hosten
          - Sitz- und Stehplätze in einem Event
          - Promo-Codes, Preise, die sich nach Datum ändern
          - Freikarten, Erstattungen, verlegte Termine mit E-Mails an die Käufer
          - Scanner-App für iOS und Android
          - Jeder Verkauf in Sekunden in Ihrer Telegram-Gruppe
        link: { label: Die Antworten im Detail →, href: "#answers" }
      - icon: shield-check
        title: Ticketverkauf seit {since}
        text: "Veranstalter in **{countries}** Ländern seit {since}: Konzerte, Theater, Festivals, Shows, Masterclasses. **800** Bestellungen pro Minute in Lasttests, nächtliche verschlüsselte Backups, ein Watchdog, der das Team alarmiert, bevor Sie etwas merken."
