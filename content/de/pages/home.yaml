  - type: faq
    id: faq
    eyebrow: Fragen
    title: Was Veranstalter fragen
    items:
      - q: Was kostet der Start?
        a: "Nichts. Es gibt kein Abo und keine zusätzlichen monatlichen oder jährlichen Zahlungen. Sie zahlen eine Provision pro verkauftem Ticket, ab {usdPrice}. Auf Freikarten und kostenlose Tickets fällt keine Provision an. [Preise und Rechner →](/pricing)"
      - q: Gibt es zusätzliche Zahlungen, monatlich oder jährlich?
        a: Nein. Keine monatlichen oder jährlichen Zahlungen, kein Abo. Sie zahlen nur eine Provision pro verkauftem Ticket.
      - q: Ich verkaufe Tickets über WhatsApp, und Käufer rufen mich an. Wozu brauche ich eine Ticketplattform?
        a: "Damit Sie nicht mehr jede Bestellung von Hand annehmen. Käufer wählen ihre Plätze selbst und zahlen zu jeder Uhrzeit, auch nachts; das Geld geht direkt auf Ihr Konto und das Ticket mit QR-Code in das Postfach des Käufers. Den Verkaufslink können Sie weiter über WhatsApp teilen: Ihre Zeit gehört der Veranstaltung, nicht Nachrichten und Listen."
      - q: Wer zahlt die Servicegebühr, ich oder der Käufer?
        a: Das entscheiden Sie. Sie können eine eigene Servicegebühr auf den Ticketpreis aufschlagen, und sie kommt vollständig mit der Zahlung bei Ihnen an. Unsere Provision pro Ticket bleibt gleich.
      - q: Wann bekomme ich das Geld?
        a: Mit jeder Bestellung. Der Käufer zahlt direkt auf Ihr Zahlungskonto; ArenaSoldOut.com hält das Geld nie. Auszahlungen auf Ihr Bankkonto folgen dem Zeitplan Ihres Anbieters.
      - q: Kann ich den Ticketverkauf in meine eigene Website einbinden?
        a: "Ja. Das Ticket-Widget kommt mit drei Zeilen Code auf jede Seite: WordPress, Tilda, Wix, Webflow oder eigener Code. Käufer wählen Plätze und Tickets direkt auf Ihrer Website. [Für Entwickler →](/developers)"
      - q: Wie funktioniert die Einlasskontrolle am Tag der Veranstaltung?
        a: "Jedes Ticket ist ein PDF mit QR-Code und EAN-13-Barcode. Am Einlass scannt die App MACS für iOS und Android die Tickets mit einem gewöhnlichen Smartphone; ein Handscanner funktioniert ebenfalls. Die App nimmt auch Tickets an, die Ihre Partner in anderen Systemen verkauft haben. [MACS Scanner-App →](/product/scanner)"
      - q: Können Besucher Tickets direkt am Eingang kaufen?
        a: Ja. Drucken Sie einen QR-Code mit einem kurzen Kauflink aus und hängen Sie ihn am Eingang auf. Besucher scannen ihn mit dem Smartphone und kaufen ihr Ticket direkt vor Ort.
      - q: Was passiert, wenn die Veranstaltung abgesagt oder verlegt wird?
        a: Das entscheiden Sie. Erstatten Sie allen Käufern das Geld, bieten Sie statt einer Erstattung einen neuen Termin an oder wählen Sie eine andere Lösung. Käufer erhalten eine E-Mail in ihrer Sprache mit dem aktualisierten Ticket.
      - q: Kann ich sehen, woher die Käufer kommen?
        a: Ja. Ergänzen Sie Ihre Verkaufslinks um UTM-Parameter, und das Event Center zeigt, welcher Kanal die Bestellungen gebracht hat.
      - q: Ich habe noch nie Tickets verkauft. Ist das etwas für mich?
        a: "Ja. Wir begleiten Sie Schritt für Schritt: [Ihr erstes Event →](/first-event). Ihren Saalplan zeichnen wir kostenlos, und wenn Sie möchten, richten wir alles gemeinsam mit Ihnen in einem Gespräch ein."
      - q: Wie erreiche ich das Team von ArenaSoldOut.com, wenn ich eine Frage habe?
        a: "Schreiben Sie uns auf Telegram, über das [Formular auf der Website](/contact#write) oder an hello@arenasoldout.com. Es antworten Menschen aus dem Team."

