  - type: steps
    id: how
    eyebrow: So funktioniert es
    title: Heute im Verkauf. Drei Fragen, die Veranstalter zuerst stellen.
    items:
      - title: Wie schnell kann ich in den Verkauf gehen?
        text: "Ein Event ohne Saalplan geht in 10 Minuten in den Verkauf, sobald Ihre Organisation bestätigt und Ihr Zahlungskonto verbunden ist; das verbinden Sie einmal. Für eine Spielstätte mit Sitzplätzen schicken Sie uns Ihren Plan: Wir zeichnen ihn kostenlos, meist innerhalb eines Tages."
      - title: Was brauche ich?
        text: "Den Namen und den Zeitplan des Events, Ihre Ticketpreise, Ihr Plakat und Ihr eigenes Zahlungskonto: Stripe, Flitt, AllPay oder einen anderen Anbieter Ihres Landes. Das Geld geht ab dem ersten Ticket an Sie."
      - title: Wie richte ich es ein?
        text: "Im Browser am Computer oder Telefon, im „Event Center“*. Oder in Telegram, wo der Bot Ihr Plakat liest und Termine, Preise und Spielstätte zur Bestätigung einträgt. Keine Zeit? Unser [Event-Manager](/pricing#services) übernimmt es für Sie, als bezahlte Leistung."
    note: "* Das „Event Center“ ist Ihr Veranstalterkonto bei ArenaSoldOut.com: jedes Event, jede Bestellung, Erstattung, Freikarte und Vorstellung, für Sie und Ihr Team, im Browser und in Telegram. [Das Event Center unten ansehen →](#center) Jeder Schritt von der Anmeldung bis zum Scanner: [Ihr erstes Event →](/first-event)"

  - type: ways
    id: where
    eyebrow: Wo Sie verkaufen
    title: Auf Ihrer Website oder auf unserer Seite. Das Geld geht in beiden Fällen an Sie.
    items:
      - title: Sie haben eine Website
        text: "Ihre Website ist der Checkout. Binden Sie das Ticket-Widget auf jeder Seite ein: WordPress, Tilda, Wix, Webflow oder eigener Code. Käufer verlassen Ihre Domain nie."
        bullets:
          - Widget auf jeder Website, drei Zeilen Code
          - WordPress-Plugin mit WooCommerce-Bestellungen
          - Ihre Farben, Ihre Schriften, Ihre Sprache
      - title: Sie haben keine Website
        text: "Wir hosten die Verkaufsseite: tickets.arenasoldout.com/your-name/your-event. Teilen Sie einen Link in sozialen Netzwerken, Messengern und auf dem Plakat."
        bullets:
          - Eine Seite pro Veranstalter und pro Event
          - Eine eigene Seite für jeden Promoter
          - In Minuten fertig, ohne Designarbeit
          - Links zu Ihren Partner-Verkäufern auf derselben Seite

  - type: qa
    id: answers
    eyebrow: Was Veranstalter als Nächstes fragen
    title: Ja. Und so geht es.
    items:
      - title: Kann ich Promo-Codes nutzen?
        text: Ja. Ein Code kann für ein Event, eine Vorstellung oder eine Kategorie gelten, mit Zeitfenster, Mindestmenge und Limit pro Käufer.
      - title: Können sich Preise zu einem von mir gesetzten Datum ändern?
        text: Ja. Early-Bird-Fenster wechseln nach Datum und Uhrzeit. Mengenstufen öffnen den nächsten Preis, wenn der aktuelle ausverkauft ist.
        visual:
          type: ladder
          rungs:
            - { price: US$24, width: 100, label: erste 100 · verkauft }
            - { price: US$119, width: 62, label: nächste 150 · im Verkauf }
            - { price: US$599, width: 0, label: öffnet danach, next: true }
      - title: Mehrere Preise für ein Event?
        text: Ja. Kategorien mit eigenem Preis, Kontingent und Verkaufsfenster, dazu kostenlose Tickets und Tickets zum selbst gewählten Preis.
      - title: Kann ich eine Servicegebühr aufschlagen?
        text: Ja. Ein Prozentsatz pro Verkaufskanal, dem Käufer als eigene Zeile angezeigt und zusammen mit dem Ticket auf Ihr Konto gezahlt. Prüfen Sie, ob Ihr Land eine Servicegebühr auf Ticketverkäufe erlaubt.
      - title: Mit Sitzplätzen und ohne?
        text: "Ja, und beides in einem Event: ein Saalplan mit Kategorien, Stehbereiche mit Kontingenten. Schicken Sie uns den Plan Ihrer Spielstätte, wir zeichnen ihn kostenlos im System, meist innerhalb eines Tages: Ein PDF, ein Foto einer Handskizze oder eine Tabelle der Reihen mit den Plätzen je Reihe (Excel oder Google Sheets) genügt. Von Hand eingeben müssen Sie ihn nie."
        visual:
          type: plan
          aria: Saalplan mit Parkett, zwei Logen, einem Balkon und einem Stehbereich
          stage: Bühne
          parterre: Parkett · 312
          logeLeft: Loge L · 48
          logeRight: Loge R · 48
          balcony: Balkon · 180
          standing: Stehplätze
      - title: Funktioniert ein Scanner mit den Tickets?
        text: Ja. Jedes Ticket ist ein PDF mit EAN-13-Barcode und QR-Code, in der Sprache des Käufers. Scannen Sie am Einlass mit der Scanner-App für iOS und Android oder mit einem Handscanner. Die App nimmt auch Tickets an, die Ihre Partner in anderen Systemen verkauft haben.
        visual:
          type: ticket
          event: Autumn Jazz Night
          meta: Fr 24. Okt · 19:30 · Palác Akropolis
          seat: Parkett · Reihe G · Platz 7
          code: "2173049188256"
      - title: Wie sehe ich meine Verkäufe?
        text: "In Ihrem „Event Center“, Ihrem eigenen Konto auf dieser Seite: am Telefon oder Computer öffnen, nichts zu installieren. Alle Ihre Events, jede Bestellung, Erstattungen und Summen pro Vorstellung, sichtbar nur für Sie und Ihr Team. Lieber Telegram? Jeder Verkauf und jede Erstattung landet auch in Sekunden in Ihrer Telegram-Gruppe, mit dem Kontakt des Käufers. [Das Event Center unten ansehen →](#center)"
        visual:
          type: telegram
          from: ArenaSoldOut.com
          lines:
            - "**Bezahlt** · Autumn Jazz Night · Fr 24. Okt"
            - Reihe G 7–8 · Parkett
            - "**€76.00** · Anna K. · +420 ••• 41 18"
          time: "19:42"
      - title: Erstattungen, Freikarten, Terminänderungen?
        text: "Ja, in Ihrem Konto im „Event Center“. Ein Ticket erstatten, Freikarten ausstellen, eine Vorstellung verlegen oder absagen: Käufer erhalten eine E-Mail in ihrer Sprache mit dem aktualisierten Ticket."
      - title: Hält es ein Stadion aus?
        text: Ja. 800 Bestellungen pro Minute bei 1.000 Käufern gleichzeitig auf der Seite in Lasttests, nächtliche verschlüsselte Backups, ein Watchdog, der uns alarmiert, bevor Sie etwas merken.

