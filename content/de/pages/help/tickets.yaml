title: "Ich habe ein Ticket gekauft: wo es ist, was am Einlass"
description: "Ihr Ticket ist ein PDF in der Bestätigungs-E-Mail mit EAN-13 und QR-Code, auf dem Handy oder gedruckt. Erstattung, Terminänderung: fragen Sie den Veranstalter."
h1: Hilfe für Ticketkäufer
lead: Ihr Ticket ist ein PDF im Anhang der Bestätigungs-E-Mail, mit Barcode und QR-Code. Zeigen Sie es auf dem Handy oder gedruckt. Fragen zu Erstattungen und Terminen gehen an den Veranstalter des Events, dessen Kontakt auf der Verkaufsseite und in der E-Mail steht.
