  - type: prose
    id: examples
    title: Was bedeutet das für ein Event?
    body: |
      **1.000 Tickets ohne Platz, Pay as you go.** ArenaSoldOut.com: 1.000 × US$0,62 = **US$620**. Ticket Tailor: 1.000 × US$0,85 = US$850. Bei Ihnen bleiben **US$230** mehr.

      **500 Tickets mit Platz, Pay as you go.** ArenaSoldOut.com: 500 × US$1,18 = **US$590**. Ticket Tailor: 500 × US$1,70 = US$850. Bei Ihnen bleiben **US$260** mehr, und den Saalplan zeichnen wir kostenlos.

      **1.000 Tickets im Jahr, im Voraus mit Credits bezahlt.** Credit-Paket 1K von ArenaSoldOut.com: **US$430**. Ticket Tailor, 1.000 Credits: US$520. **US$90** weniger, und die Credits verfallen auf keiner der Plattformen.

      Rechnen Sie Ihr eigenes Event im [Rechner auf der Preisseite](/pricing#packages) durch.

  - type: cards
    id: more
    eyebrow: Mehr als der Preis
    title: Was bekommen Sie sonst noch mit ArenaSoldOut.com?
    items:
      - title: Saalpläne, die wir für Sie zeichnen, kostenlos
        text: "Senden Sie ein PDF, ein Foto einer Handskizze oder eine Tabelle mit Reihen und Plätzen. Das Team baut die Spielstätte nach; Sie zeichnen sie nie selbst."
        link: { label: Saalpläne, href: /product/seating }
      - title: Das Geld direkt auf Ihr Konto
        text: "Käufer zahlen auf Ihr eigenes Stripe-, Flitt- oder AllPay-Konto. ArenaSoldOut.com hält nie Gelder und zieht nichts von Ihren Verkäufen ab."
        link: { label: Zahlungen, href: /payments }
      - title: Niedrigerer Satz für günstige Tickets
        text: "Wenn jedes Ticket des Events {usdLowMax} oder weniger kostet: {lowPercent}% des Ticketpreises statt der festen Gebühr. Discos, Läufe, Kindergeburtstage, Ausflüge."
        link: { label: So funktioniert es, href: /pricing#low-price }
      - title: Käufer in ihrer eigenen Sprache
        text: "Käuferseite, E-Mails und Tickets in der Sprache des Käufers, auch Hebräisch von rechts nach links. Jede neue Sprache fügen wir innerhalb von 40 Stunden hinzu."
        link: { label: E-Tickets, href: /product/tickets }
      - title: Jeder Verkauf in Ihrem Telegram
        text: "Legen Sie im Telegram-Bot ein Event aus einem Plakatfoto an und sehen Sie jeden Verkauf und jede Erstattung binnen Sekunden in Ihrer Gruppe."
        link: { label: Telegram-Bot, href: /product/telegram }
      - title: Selbst einrichten oder abgeben
        text: "Events, Preise und Kategorien legen Sie selbst im Event Center oder im Telegram-Bot an, in Minuten; Saalpläne zeichnen wir kostenlos. Keine Zeit? Unser Event-Manager übernimmt es für Sie, als bezahlte Leistung."
        link: { label: Zusatzleistungen, href: /pricing#services }

  - type: faq
    id: questions
    title: Fragen, die Veranstalter beim Vergleich stellen
    items:
      - q: Ist ArenaSoldOut.com günstiger als Ticket Tailor?
        a: "Ja, pro Ticket bei jeder veröffentlichten Menge bis 5.000 Tickets im Jahr: {usdPrice} statt US$0,85 bei Pay as you go, {usdSeated} statt US$1,70 für ein Ticket mit Platz und ab {usdFrom} pro Ticket mit Credits. Über 5.000 Tickets im Jahr vereinbaren wir individuelle Konditionen."
      - q: Nehmen Sie einen Prozentsatz des Ticketpreises?
        a: "Nein. Wie Ticket Tailor berechnen wir eine feste Gebühr pro verkauftem Ticket. Die einzigen Prozentsätze sind optional: der niedrigere Satz für Events, bei denen jedes Ticket {usdLowMax} oder weniger kostet, und der Satz für feste Spielstätten."
      - q: Wohin geht das Geld des Käufers?
        a: "Mit jeder Bestellung auf Ihr eigenes Zahlungskonto: Stripe, Flitt oder AllPay. ArenaSoldOut.com hält nie Gelder. Unsere Provision wird nach der Veranstaltung in Rechnung gestellt oder von Ihren Credits abgezogen."
      - q: Kann ich meine Events von Ticket Tailor umziehen?
        a: "Ja. Sie legen Ihre Events im Event Center oder im Telegram-Bot an, wir zeichnen Ihre Saalpläne kostenlos, und Sie verkaufen weiter über Ticket Tailor, bis Ihre Seite bei uns fertig ist. Keine Zeit, es selbst einzurichten? Unser [Event-Manager](/pricing#services) übernimmt es für Sie, als bezahlte Leistung."
      - q: Zahle ich ein Abo?
        a: "Nein. Sie zahlen nur für verkaufte Tickets. Freikarten und kostenlose Tickets zu kostenpflichtigen Events sind provisionsfrei."
      - q: Und gemeinnützige Organisationen?
        a: "Eingetragene gemeinnützige Organisationen erhalten 50% Rabatt auf unsere Provision, wie bei Ticket Tailor. Schreiben Sie uns, und wir schalten ihn für Ihre Organisation frei."
      - q: Wie verkaufe ich in Euro?
        a: "Spielstätten in EU-Ländern zahlen unsere Provision in Euro: {eurPrice} pro Ticket bei Pay as you go. Die Tickets selbst werden in der Währung Ihres Zahlungskontos verkauft."

