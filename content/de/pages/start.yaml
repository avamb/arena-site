title: "Verkauf starten: als Veranstalter bewerben"
description: "Erzählen Sie uns von Ihrer Organisation und Ihren Events. Das Team richtet Organisation, Verkaufsseite und Zahlungskonto ein, meist innerhalb eines Tages."
h1: Verkauf starten
lead: "Sagen Sie uns, wer Sie sind und wo Sie verkaufen. Wir richten Ihre Organisation und Ihre Verkaufsseite ein und verbinden Ihr Zahlungskonto, meist innerhalb eines Tages. Events ohne Saalplan gehen noch heute in den Verkauf."
sections:
  - type: steps
    id: how
    eyebrow: Was danach passiert
    title: Wie fangen wir an?
    items:
      - title: Sie senden den Antrag
        text: "Fünf kurze Schritte: Kontakt, Organisation, Events, Zahlungen und Einwilligung. Ihre Angaben werden laufend gespeichert, Sie können also unterbrechen und später weitermachen."
      - title: Wir richten Sie ein
        text: Das Team prüft den Antrag, legt Ihre Organisation und Ihre Verkaufsseite an, verbindet gemeinsam mit Ihnen Ihr Zahlungskonto und zeichnet, wenn Sie eine Spielstätte mit Sitzplätzen haben, den Saalplan kostenlos nach Ihrem PDF, Ihrer Handskizze oder Ihrer Tabelle mit Reihen.
      - title: Sie gehen in den Verkauf
        text: Teilen Sie einen Link oder setzen Sie das Widget auf Ihre Website. Jeder Verkauf landet in Ihrem Event Center und in Ihrer Telegram-Gruppe.
