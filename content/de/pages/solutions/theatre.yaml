title: "Ticketverkauf für Theater: Saalplan, wiederkehrende Termine"
description: "Ticketverkauf für Theater mit Platzreservierung passend zur Spielstätte, wiederkehrende Termine auf einem Plan, Einladungen, Erstattungen. 100 bis 1.500 Plätze."
h1: Theater
