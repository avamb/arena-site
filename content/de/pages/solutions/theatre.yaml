title: "Ticketverkauf für Theater: Saalplan, wiederkehrende Termine"
description: "Ticketverkauf für Theater mit Platzreservierung passend zur Spielstätte, wiederkehrende Termine auf einem Plan, Freikarten, Erstattungen. 100 bis 1.500 Plätze."
h1: Theater
tagline: Eine Vorstellung beginnt, lange bevor sich der Vorhang hebt.
lead: Ein Plan, der zu Ihrem Haus passt, von uns kostenlos nach Ihrem PDF, Ihrer Skizze oder Ihrer Tabelle mit Reihen gezeichnet und für jede Vorstellung wiederverwendet. Freikarten für Presse und Partner, Erstattungen und verlegte Termine im Event Center.
