  - type: faq
    id: questions
    eyebrow: Fragen
    title: Was fragen Theater zuerst?
    items:
      - q: Zeichnen Sie den Saalplan?
        a: Ja, kostenlos. Schicken Sie ein PDF des Plans, ein Foto einer Handskizze oder eine Tabelle mit Reihen und den Plätzen jeder Reihe; wir zeichnen ihn in Ihr Event, meist innerhalb eines Tages, und Sie geben ihn frei, bevor der Verkauf beginnt.
      - q: Können wir unterschiedliche Preise für Parkett und Balkon haben?
        a: Ja. Kategorien mit eigenen Preisen, Kontingenten und Fenstern; Early-Bird-Fenster schalten nach Datum um.
      - q: Wir spielen viele Vorstellungen im Monat. Gibt es ein anderes Angebot?
        a: "Ja. Festen Spielstätten bieten wir einen Prozentsatz des Ticketpreises statt der Gebühr pro Ticket an; siehe [Spielstätten](/solutions/venues) und [Preise](/pricing)."
      - q: Können Käufer Plätze auf dem Handy wählen?
        a: Ja, der Saalplan funktioniert auf Handys mit Pinch-Zoom, in der Sprache des Käufers.
  - type: cta
    id: start
    title: Schicken Sie uns Ihren Plan
    text: "Ein PDF, ein Foto einer Handskizze oder eine Tabelle mit Reihen und Plätzen genügt. Wir zeichnen ihn kostenlos in Ihr Event und zeigen ihn Ihnen, bevor der Verkauf beginnt."
