sections:
  - type: paycountries
    id: countries
  - type: cards
    id: what
    eyebrow: Für Theater
    title: Was zählt bei einem Theater?
    items:
      - { title: Der Plan gehört Ihnen, text: "Parkett, Logen, Balkon, Kategorien nach Preis. Schicken Sie ein PDF, eine Tabelle oder eine Handskizze, und das Team zeichnet den Plan kostenlos; Versionen schützen verkaufte Tickets, wenn sich die Bestuhlung ändert.", link: { label: Saalpläne →, href: /product/seating } }
      - { title: Wiederkehrende Termine, text: "Fügen Sie demselben Event Vorstellungen hinzu; Plan, Preise und Kategorien werden übernommen, und Käufer wählen den Termin.", link: { label: Event Center →, href: /#center } }
      - { title: Freikarten ohne Provision, text: "Freikarten für genaue Plätze für Presse, Partner und Ensemble, am Einlass gescannt wie jedes andere Ticket.", link: { label: Tickets →, href: /product/tickets } }
      - { title: Ihre eigene Kasse, text: "Verkaufen Sie auf Ihrer Website mit dem Widget oder auf der gehosteten Seite; das Geld geht direkt auf Ihr eigenes Konto.", link: { label: Wo Sie verkaufen →, href: /product/sell } }
      - { title: Rabattcodes und Frühbucherpreise, text: "Codes für Abonnenten, Schulen oder Partner mit Zeitfenster und Limit pro Käufer; ein Frühbucherpreis, der an dem von Ihnen gewählten Datum endet.", link: { label: Preis-Tools →, href: /product/pricing-tools } }
      - { title: "Eine Vorstellung wird verlegt? Sie entscheiden", text: "Allen erstatten, stattdessen einen neuen Termin anbieten oder eine andere Lösung wählen. Käufer erhalten eine E-Mail mit dem aktualisierten Ticket.", link: { label: Tickets →, href: /product/tickets } }
      - { title: Verkäufe in Telegram, text: "Jeder Verkauf und jede Erstattung erscheint in Sekunden in Ihrer Telegram-Gruppe, mit dem Kontakt des Käufers.", link: { label: Telegram →, href: /product/telegram } }
      - { title: Der Einlass, text: "Die Scanner-App MACS für iOS und Android prüft jedes Ticket. Mit einem ausgedruckten QR-Code und kurzem Kauflink am Eingang kaufen Kurzentschlossene direkt vor Ort.", link: { label: MACS Scanner-App →, href: /product/scanner } }
      - { title: Ihre Servicegebühr gehört Ihnen, text: "Schlagen Sie eine eigene Servicegebühr für Käufer auf den Ticketpreis auf; sie geht vollständig an Sie.", link: { label: Preise →, href: /pricing } }
  - type: faq
    id: questions
    eyebrow: Fragen
    title: Was fragen Theater zuerst?
    items:
      - q: Zeichnen Sie den Saalplan?
        a: Ja, kostenlos. Schicken Sie ein PDF des Plans, ein Foto einer Handskizze oder eine Tabelle mit Reihen und den Plätzen jeder Reihe; wir zeichnen ihn in Ihr Event, meist innerhalb eines Tages, und Sie geben ihn frei, bevor der Verkauf beginnt.
      - q: Können wir unterschiedliche Preise für Parkett und Balkon haben?
        a: Ja. Kategorien mit eigenen Preisen, Kontingenten und Fenstern; Early-Bird-Fenster schalten nach Datum um.
      - q: Wir spielen viele Vorstellungen im Monat. Gibt es ein anderes Angebot?
        a: "Ja. Festen Spielstätten bieten wir einen Prozentsatz des Ticketpreises statt der Gebühr pro Ticket an; siehe [Spielstätten](/solutions/venues) und [Preise](/pricing)."
      - q: Können Käufer Plätze auf dem Handy wählen?
        a: Ja, der Saalplan funktioniert auf Handys mit Pinch-Zoom, in der Sprache des Käufers.
  - type: cta
    id: start
    title: Ihre beste Veranstaltung liegt noch vor Ihnen. Fangen wir mit den Tickets an?
    text: "Ein PDF, ein Foto einer Handskizze oder eine Tabelle mit Reihen und Plätzen genügt. Wir zeichnen ihn kostenlos in Ihr Event und zeigen ihn Ihnen, bevor der Verkauf beginnt."
    primary: { label: Verkauf starten, href: /start }
    secondary: { label: Event anlegen, href: /start#create }
    tertiary: { label: Team kontaktieren, href: /contact#write }
