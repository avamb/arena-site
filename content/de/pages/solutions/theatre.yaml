    items:
      - { title: Der Plan gehört Ihnen, text: "Reihen, Logen, Balkon, Kategorien nach Preis. Versionen schützen verkaufte Tickets, wenn sich die Bestuhlung ändert.", link: { label: Saalpläne →, href: /product/seating } }
      - { title: Wiederkehrende Termine, text: "Fügen Sie demselben Event Sessions hinzu; Plan, Preise und Kategorien werden übernommen. Verlegen oder sagen Sie einen Termin ab, mit E-Mails an die Käufer.", link: { label: Event Center →, href: /#center } }
