sections:
  - type: cards
    id: what
    eyebrow: Für WordPress-Websites
    title: Welche Option passt zu meiner Website?
    items:
      - { title: Das Plugin, text: "Bestellungen landen in WooCommerce, Ihr Shop und Ihre Berichte funktionieren weiter; Plätze, Tickets und Einlass kommen von ArenaSoldOut.com.", link: { label: Plugin anfragen →, href: /start } }
      - { title: Das Widget, text: "Zwei Zeilen auf jeder Seite oder in einem Block; Käufer zahlen im gehosteten Checkout Ihres Anbieters, die Bestellungen liegen im Event Center.", link: { label: Entwickler →, href: /developers } }
      - { title: Wechsel von ArenaSoldOut.com, text: "Sessions, Saalpläne und Kunden importiert; zwei Kunden sind ohne Ausfallzeit umgezogen.", link: { label: Kunden →, href: /clients } }
  - type: faq
    id: questions
    eyebrow: Fragen
    title: Was fragen Betreiber von WordPress-Websites zuerst?
    items:
      - q: Macht das Plugin meine Website langsamer?
        a: Das Plugin spricht beim Checkout mit der API von ArenaSoldOut.com; Seiten werden wie bisher dargestellt. Das Widget ist eine Web Component, die einmal geladen wird.
      - q: Verlässt der Käufer meine Domain?
        a: Mit dem Widget bleibt der Käufer auf Ihrer Seite bis zum gehosteten Checkout des Anbieters und kehrt dann zurück. Mit dem Plugin ist der Checkout der von WooCommerce.
      - q: Welche Zahlungsanbieter funktionieren?
        a: "Ihr eigenes Konto bei einem Anbieter Ihres Landes; die Liste mit Status steht auf der [Zahlungsseite](/payments). In Israel funktioniert AllPay heute für Verkäufe über WordPress."
      - q: Wer installiert es?
        a: Das Team kann das Plugin gemeinsam mit dem Administrator Ihrer Website installieren und konfigurieren; das Widget braucht keine Installation.
  - type: cta
    id: start
    title: Verkaufen Sie auf Ihrer Website
    text: "Setzen Sie das Ticket-Widget auf Ihre Website: drei Zeilen Code, und der Verkauf läuft aus Ihrem Event Center."
    primary: { label: Verkauf starten, href: /start }
    secondary: { label: Entwicklerdokumentation lesen, href: /developers }
    note: WooCommerce-Websites behalten ihren Shop.
