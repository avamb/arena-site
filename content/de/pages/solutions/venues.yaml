sections:
  - type: cards
    id: what
    eyebrow: Für Spielstätten
    title: Was zählt bei einer Spielstätte?
    items:
      - { title: "Ein Plan, jedes Event", text: "Einmal nach Ihrer Datei gebaut, für jedes Event wiederverwendet; Versionen für Bühnenaufbauten.", link: { label: Saalpläne →, href: /product/seating } }
      - { title: "Veranstalter, die die Spielstätte mieten", text: "Eine Seite pro Veranstalter mit eigenem Link; die Spielstätte sieht jedes Event, der Veranstalter sieht seine eigenen.", link: { label: Wo Sie verkaufen →, href: /product/sell } }
      - { title: Eigene Konditionen, text: "Zwei Prozent des Ticketpreises statt der Gebühr pro Ticket, keine Gebühr auf Einladungen und Erstattungen, Mengenkonditionen auf Anfrage.", link: { label: Preise →, href: /pricing } }
      - { title: Der Einlass, text: "Scanner-App für iOS und Android, Handscanner, Tickets von Partnern aus anderen Systemen werden akzeptiert.", link: { label: MACS Scanner-App →, href: /product/scanner } }
  - type: faq
    id: questions
    eyebrow: Fragen
    title: Was fragen Betreiber von Spielstätten zuerst?
    items:
      - q: Welche Konditionen gelten für eine feste Spielstätte?
        a: "Ein Prozentsatz des Ticketpreises statt der Gebühr pro Ticket, keine Gebühr auf Einladungen und Erstattungen. Die Zahl steht auf der [Preisseite](/pricing); Mengen- und individuelle Konditionen auf Anfrage."
      - q: Kann ein Veranstalter unsere Events auf seiner eigenen Website verkaufen?
        a: Ja, mit dem Widget auf seiner Website oder einer Veranstalterseite, die wir hosten. Verkäufe aus jedem Kanal erscheinen im Event Center der Spielstätte.
      - q: Können wir von einem anderen Ticketsystem wechseln?
        a: "Ja. Sessions, Saalpläne und Kunden wurden für zwei Kunden ohne Ausfallzeit von ArenaSoldOut.com importiert; andere Systeme über die Event-Bundle-API. Siehe [Entwickler](/developers)."
      - q: Wer betreibt das Event Center?
        a: Ihr Team, mit Rollen. Die Spielstätte besitzt die Organisation; Manager sehen, was Sie erlauben.
  - type: cta
    id: start
    title: Sprechen Sie mit uns
    text: Erzählen Sie uns von der Spielstätte und der Zahl der Events im Monat. Wir zeichnen den Plan kostenlos und vereinbaren die Konditionen für die Spielstätte.
    primary: { label: Sprechen Sie mit uns, href: /start }
    secondary: { label: Preise ansehen, href: /pricing }
    note: "Fragen? Schreiben Sie uns: Das Team antwortet innerhalb eines Werktags."
