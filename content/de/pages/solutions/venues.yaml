title: "Ticketverkauf für Spielstätten und Clubs: ein Plan"
description: "Für feste Spielstätten und Clubs: ein Saalplan für jedes Event, viele Events im Monat, Scan am Einlass, ein Prozentsatz des Ticketpreises statt einer Gebühr."
h1: Spielstätten und Clubs
lead: "Ihre eigene Spielstätte, viele Events im Monat. Der Plan wird einmal gebaut und wiederverwendet, jeder Veranstalter, der die Spielstätte mietet, verkauft über Ihre oder seine Seite, und die Konditionen sind andere: ein Prozentsatz des Ticketpreises statt der Gebühr pro Ticket."
