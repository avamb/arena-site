sections:
  - type: paycountries
    id: countries
  - type: cards
    id: what
    eyebrow: Für Konzerte
    title: Was zählt bei einem Konzert?
    items:
      - { title: Steh- und Sitzplätze zusammen, text: "Ein Stehbereich mit Kontingent neben Sitzkategorien, in einem Plan und einem Checkout.", link: { label: Saalpläne →, href: /product/seating } }
      - { title: "Early Bird, der sich selbst umschaltet", text: "Ein Preisfenster nach Datum und Uhrzeit, oder eine Mengenstufe, die den nächsten Preis öffnet, wenn die erste ausverkauft ist.", link: { label: Preis-Tools →, href: /product/pricing-tools } }
      - { title: Partner und Veranstalter, text: "Eine Seite pro Veranstalter mit eigenem Link, Rabattcodes pro Partner, alle Kanäle in einem Event Center.", link: { label: Wo Sie verkaufen →, href: /product/sell } }
      - { title: Der Einlass, text: "Scanner-App für iOS und Android, EAN-13 und QR auf jedem Ticket, Tickets von Partnern aus anderen Systemen werden ebenfalls akzeptiert.", link: { label: MACS Scanner-App →, href: /product/scanner } }
      - { title: Ihr Saalplan kostenlos, text: "Schicken Sie ein PDF, eine Tabelle oder eine Handskizze der Spielstätte: Unser Team zeichnet den Plan, von Hand eingeben müssen Sie ihn nie.", link: { label: Saalpläne →, href: /product/seating } }
      - { title: Kategorien und VIP, text: "Jede Kategorie hat ihren eigenen Preis, ihr Kontingent und ihr Verkaufsfenster; eine ausverkaufte Kategorie kann ihre unverkauften Plätze an die nächste weitergeben.", link: { label: Preis-Tools →, href: /product/pricing-tools } }
      - { title: Verkäufe in Echtzeit, text: "Jeder Verkauf landet in Sekunden in Ihrer Telegram-Gruppe; UTM-Parameter zeigen, welcher Kanal die Käufer gebracht hat.", link: { label: Telegram-Bot →, href: /product/telegram } }
      - { title: Abgesagt oder verlegt, text: "Sie entscheiden: allen erstatten oder einen neuen Termin anbieten. Käufer erhalten eine E-Mail mit dem aktualisierten Ticket.", link: { label: E-Tickets →, href: /product/tickets } }
      - { title: Ein QR-Code am Einlass, text: "Hängen Sie einen QR-Code mit kurzem Kauflink auf: Wer ohne Ticket gekommen ist, kauft es noch in der Warteschlange." }
  - type: faq
    id: questions
    eyebrow: Fragen
    title: Was fragen Konzertveranstalter zuerst?
    items:
      - q: Wie schnell kann ein Konzert in den Verkauf gehen?
        a: "Ohne Saalplan in 10 Minuten, sobald Ihre Organisation bestätigt und Ihr Zahlungskonto verbunden ist: Name, Datum, Preise, Plakat. Mit Plätzen meist innerhalb eines Tages, nachdem wir den Plan nach Ihrer Datei kostenlos gezeichnet haben."
      - q: Kann ich eine VIP-Kategorie mit begrenztem Kontingent verkaufen?
        a: Ja. Jede Kategorie hat ihren eigenen Preis, ihr Kontingent und ihr Verkaufsfenster; eine ausverkaufte Kategorie kann ihre unverkauften Plätze an die nächste weitergeben.
      - q: Was kostet mich ein Ticket?
        a: "Ein fester Betrag pro verkauftem Ticket, nach der Session in Rechnung gestellt; siehe [Preise](/pricing). Freikarten und Erstattungen sind kostenlos."
      - q: Kann ich Verkäufe in Echtzeit sehen?
        a: Ja. Jeder Verkauf landet innerhalb von Sekunden in Ihrer Telegram-Gruppe und im Event Center, mit Summen pro Session und CSV-Export.
  - type: cta
    id: start
    title: Ihre beste Veranstaltung liegt noch vor Ihnen. Fangen wir mit den Tickets an?
    text: Event anlegen, Zahlungskonto verbinden, Link teilen.
    primary: { label: Verkauf starten, href: /start }
