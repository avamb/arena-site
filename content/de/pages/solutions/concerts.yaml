title: "Ticketverkauf für Konzerte: Steh- und Sitzplätze"
description: "Konzerttickets auf Ihrer Website oder einer gehosteten Seite: Stehplatz-Kontingente, Sitzkategorien, Early Bird, Partner-Codes, Scan. Das Geld geht an Sie."
h1: Konzerte
lead: Steh- und Sitzplätze in einem Event, mehrere Preiskategorien, ein Early-Bird-Zeitraum, der sich zu einem Datum umschaltet, und ein Einlass, der jedes Ticket scannt. Käufer zahlen vom ersten Ticket an auf Ihr eigenes Konto.
related:
  - { label: Promo-Codes und Preisfenster, href: /product/pricing-tools }
  - { label: E-Tickets und Scan, href: /product/tickets }
