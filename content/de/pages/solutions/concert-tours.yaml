title: "Ticketverkauf für Konzerttourneen: Seite pro Veranstalter"
description: "Konzerttournee in einem Event verkaufen: Sessions pro Stadt, ein Saalplan pro Spielstätte, Veranstalterseiten mit eigenen Links und Codes, Scan in jeder Stadt."
h1: Konzerttourneen
tagline: Eine Tournee beginnt lange vor der ersten Stadt.
lead: Eine Show, viele Städte und Termine. Jede Stadt bekommt ihre Session und ihren Plan, jeder Veranstalter eine Seite mit eigenem Link, und Sie sehen die ganze Konzerttournee in einem Event Center.
