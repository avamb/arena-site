title: "Ticketverkauf für Konzerttourneen: Seite pro Veranstalter"
description: "Konzerttournee in einem Event verkaufen: Sessions pro Stadt, ein Saalplan pro Spielstätte, Veranstalterseiten mit eigenen Links und Codes, Scan in jeder Stadt."
h1: Konzerttourneen
lead: Eine Show, viele Städte und Termine. Jede Stadt bekommt ihre Session und ihren Plan, jeder Veranstalter eine Seite mit eigenem Link, und Sie sehen die ganze Tournee in einem Event Center.
related:
  - { label: Shows, href: /solutions/shows }
  - { label: Wo Sie verkaufen, href: /product/sell }
  - { label: Zahlungen nach Land, href: /payments }
  - { label: "Länder und Zahlungsarten", href: /countries }
sections:
  - type: cards
    id: what
    eyebrow: Für Konzerttourneen
    title: Was zählt auf Tournee?
    items:
      - { title: Sessions pro Stadt, text: "Termine und Spielstätten in einem Event; Käufer wählen die Stadt, Sie sehen die Summen pro Session und für die ganze Tournee.", link: { label: Event Center →, href: /#center } }
      - { title: Veranstalterseiten, text: "Eine eigene Seite für jeden lokalen Veranstalter mit eigenem Link und eigenen Promo-Codes; die Verkäufe laufen bei Ihnen zusammen.", link: { label: Wo Sie verkaufen →, href: /product/sell } }
      - { title: Mehrere Länder, text: "Verkaufen Sie in Tschechien, Spanien, Frankreich, Georgien oder Israel mit dem Anbieter des jeweiligen Landes, auf Ihr eigenes Konto.", link: { label: Zahlungen →, href: /payments } }
      - { title: Sprachen der Käufer, text: "Seiten und Tickets in der Sprache des Käufers, E-Mails in sieben Sprachen, rechts-nach-links für Hebräisch.", link: { label: Tickets →, href: /product/tickets } }
  - type: faq
    id: questions
    eyebrow: Fragen
    title: Was fragen Tournee-Veranstalter zuerst?
    items:
      - q: Kann ein Event mehrere Länder und Währungen umfassen?
        a: Sessions können in verschiedenen Ländern liegen; Zahlungskonto und Währung richten sich nach der Organisation. Für getrennte Währungen richtet das Team pro Land einen Kanal ein.
      - q: Sehen Veranstalter die Verkäufe der anderen?
        a: Nein. Jeder Veranstalter sieht nur seine eigene Seite; der Veranstalter der Tournee sieht alles.
      - q: Eine Stadt wechselt die Spielstätte. Was passiert mit verkauften Tickets?
        a: Die Session wird verlegt, mit E-Mails an die Käufer und aktualisierten Tickets; die Plätze werden gemeinsam mit Ihnen auf den neuen Plan übertragen.
      - q: Was kostet mich ein Ticket auf Tournee?
        a: "In jeder Stadt derselbe Betrag pro Ticket; siehe [Preise](/pricing)."
  - type: cta
    id: start
    title: Starten Sie heute den Verkauf
    text: Event anlegen, Zahlungskonto verbinden, Link teilen.
    primary: { label: Event anlegen, href: /start#create }
    secondary: { label: Telegram-Bot öffnen, href: https://t.me/EventsCentrBot }
    note: "Oder schreiben Sie uns: Wir richten alles gemeinsam mit Ihnen in einem Gespräch ein."
