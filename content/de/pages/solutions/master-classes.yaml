title: "Ticketverkauf für Workshops, Trainings und Verkostungen"
description: "Plätze für Workshops, Masterclasses, Trainings und Verkostungen: kleine Gruppen mit Kontingent, wiederkehrende Termine, eigene E-Mails, Pay what you want."
h1: Workshops und Trainings
tagline: Ein Workshop beginnt mit der ersten Anmeldung.
lead: Kleine Gruppen, wiederkehrende Termine, Ihre eigenen E-Mails in Ihrer Sprache. Eine gehostete Seite ist in Minuten fertig; das Widget passt zu der Website, die Sie schon haben. Vino&Co in Israel verkauft so seine Verkostungen.
