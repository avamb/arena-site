title: "Ticketverkauf für Masterclasses, Trainings, Verkostungen"
description: "Plätze für Masterclasses, Trainings, Verkostungen und Workshops: kleine Gruppen mit Kontingent, wiederkehrende Termine, eigene E-Mails, Pay what you want."
h1: Masterclasses und Trainings
lead: Kleine Gruppen, wiederkehrende Termine, Ihre eigenen E-Mails in Ihrer Sprache. Eine gehostete Seite ist in Minuten fertig; das Widget passt zu der Website, die Sie schon haben. Vino&Co in Israel verkauft so seine Verkostungen.
