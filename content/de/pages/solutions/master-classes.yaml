sections:
  - type: paycountries
    id: countries
  - type: cards
    id: what
    eyebrow: Für Gastgeber
    title: Was zählt bei einem Workshop?
    items:
      - { title: Ein Kontingent pro Termin, text: "Zwölf Plätze am Dienstag, zwanzig am Samstag; ausverkaufte Termine schließen sich selbst.", link: { label: Preis-Tools →, href: /product/pricing-tools } }
      - { title: Wiederkehrende Termine, text: "Fügen Sie demselben Event Sessions hinzu; Preise und Kategorien werden übernommen, Käufer wählen den Termin.", link: { label: Event Center →, href: /#center } }
      - { title: Kostenlos und Pay what you want, text: "Kostenlose Anmeldungen, oder ein Mindestpreis, und der Käufer entscheidet, wie viel er dazugibt.", link: { label: Preis-Tools →, href: /product/pricing-tools } }
      - { title: Rabattcodes und Frühbucherpreise, text: "Ein Code für Ihre Stammgäste oder einen Partner mit Limit pro Käufer; ein Frühbucherpreis, der an dem von Ihnen gewählten Datum endet.", link: { label: Preis-Tools →, href: /product/pricing-tools } }
      - { title: Verkäufe in Telegram, text: "Jeder Verkauf und jede Erstattung erscheint in Sekunden in Ihrer Telegram-Gruppe, mit dem Kontakt des Käufers.", link: { label: Telegram →, href: /product/telegram } }
      - { title: Woher die Teilnehmer kommen, text: "Ergänzen Sie Ihre Links um UTM-Parameter und sehen Sie, welcher Beitrag, Newsletter oder Partner Anmeldungen bringt.", link: { label: Wo Sie verkaufen →, href: /product/sell } }
      - { title: Ihre Sprache, text: "Seite, Widget, E-Mail und Ticket in der Sprache des Käufers, auch Hebräisch rechts-nach-links.", link: { label: Tickets →, href: /product/tickets } }
      - { title: "Ein Termin wird verlegt? Sie entscheiden", text: "Allen erstatten, stattdessen einen neuen Termin anbieten oder eine andere Lösung wählen. Teilnehmer erhalten eine E-Mail mit dem aktualisierten Ticket.", link: { label: Tickets →, href: /product/tickets } }
      - { title: "Kein Abo, keine zusätzlichen Zahlungen", text: "Kein Abo und keine monatlichen oder jährlichen Zahlungen: eine Provision pro bezahltem Ticket, kostenlose Anmeldungen kosten nichts.", link: { label: Preise →, href: /pricing } }
  - type: faq
    id: questions
    eyebrow: Fragen
    title: Was fragen Gastgeber zuerst?
    items:
      - q: Ich habe keine Website. Wo kaufen die Leute?
        a: "Auf einer gehosteten Seite, tickets.arenasoldout.com/your-name/your-event, in Minuten fertig. Teilen Sie den Link in Messengern und sozialen Netzwerken."
      - q: Kann ich nur eine Anzahlung einnehmen?
        a: Setzen Sie den Ticketpreis auf die Anzahlung und kassieren Sie den Rest vor Ort; oder nutzen Sie Pay what you want mit einem Mindestpreis.
      - q: Bekommen Käufer eine Erinnerung?
        a: Käufer erhalten das Ticket per E-Mail und eine E-Mail, wenn ein Termin verlegt oder abgesagt wird. Erinnerungen vor dem Termin werden derzeit nicht versendet.
      - q: Was kostet es?
        a: "Ein fester Betrag pro bezahltem Ticket; kostenlose Anmeldungen kosten nichts. Siehe [Preise](/pricing)."
  - type: cta
    id: start
    title: Ihre beste Veranstaltung liegt noch vor Ihnen. Fangen wir mit den Tickets an?
    text: Event anlegen, Zahlungskonto verbinden, Link teilen.
    primary: { label: Verkauf starten, href: /start }
