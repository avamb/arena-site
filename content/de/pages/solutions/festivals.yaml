title: "Ticketverkauf für Festivals: mehrere Tage, viele Kategorien"
description: "Festival-Ticketverkauf mit Tages- und Gesamtpässen, Kategorien mit Kontingenten, Ketten für unverkaufte Plätze, Early Bird nach Datum, Scan an jedem Eingang."
h1: Festivals
lead: Tagespässe und Gesamtpässe, viele Kategorien mit Kontingenten, Early Bird, der sich zu einem Datum umschaltet, und eine Kette, die unverkaufte Plätze von einer Kategorie an die nächste weitergibt. Scan an jedem Eingang mit der App.
