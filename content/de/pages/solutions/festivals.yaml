sections:
  - type: paycountries
    id: countries
  - type: cards
    id: what
    eyebrow: Für Festivals
    title: Was zählt bei einem Festival?
    items:
      - { title: Kategorien mit Kontingenten, text: "Tag eins, Tag zwei, Gesamtpass, VIP, Camping: jede mit eigenem Preis, Kontingent und Verkaufsfenster.", link: { label: Preis-Tools →, href: /product/pricing-tools } }
      - { title: Kategorienketten, text: "Ist der Early Bird ausverkauft, fließen seine unverkauften Plätze in die nächste Kategorie, statt den Verkauf zu blockieren.", link: { label: Preis-Tools →, href: /product/pricing-tools } }
      - { title: Frühbucherpreise und Preisstufen, text: "Ein Frühbucherpreis, der an dem von Ihnen gewählten Datum endet, oder ein Preis, der steigt, wenn eine Mengenstufe ausverkauft ist.", link: { label: Preis-Tools →, href: /product/pricing-tools } }
      - { title: Rabattcodes mit Limit, text: "Codes für Partner, die Fans der Künstler oder Ihren Newsletter, mit Zeitfenster und Limit pro Käufer.", link: { label: Preis-Tools →, href: /product/pricing-tools } }
      - { title: Freikarten ohne Provision, text: "Freikarten für Sponsoren, Künstler und Presse, am Tor gescannt wie jedes andere Ticket.", link: { label: Tickets →, href: /product/tickets } }
      - { title: Eingänge, text: "Die Scanner-App MACS für iOS und Android an jedem Tor; Tickets von Partnern aus anderen Systemen werden ebenfalls akzeptiert.", link: { label: MACS Scanner-App →, href: /product/scanner } }
      - { title: Tickets am Eingang, text: "Stellen Sie einen ausgedruckten QR-Code mit kurzem Kauflink am Eingang auf: Besucher scannen ihn und kaufen direkt vor Ort.", link: { label: Wo Sie verkaufen →, href: /product/sell } }
      - { title: Ein großer Verkaufsstart, text: "800 Bestellungen pro Minute bei 1.000 gleichzeitigen Käufern in Lasttests: Auch die erste Minute des Vorverkaufs läuft stabil.", link: { label: Zuverlässigkeit →, href: /product/reliability } }
      - { title: Verkäufe in Telegram, text: "Jeder Verkauf und jede Erstattung erscheint in Sekunden in Ihrer Telegram-Gruppe, mit dem Kontakt des Käufers.", link: { label: Telegram →, href: /product/telegram } }
  - type: faq
    id: questions
    eyebrow: Fragen
    title: Was fragen Festivalveranstalter zuerst?
    items:
      - q: Kann ein Käufer Tagespass und Camping in einer Bestellung kombinieren?
        a: Ja, mehrere Kategorien eines Events in einem Checkout.
      - q: Können wir die Preise für die letzte Woche ändern?
        a: Ja. Preisfenster schalten nach Datum und Uhrzeit um; Mengenstufen öffnen den nächsten Preis, wenn eine Stufe ausverkauft ist.
      - q: Wir haben Freikarten für Sponsoren. Wie geht das?
        a: Freikarten und Einladungen aus dem Event Center, ohne Plattformgebühr, gescannt wie jedes Ticket.
      - q: Was kostet es?
        a: "Eine feste Provision pro verkauftem Ticket, nach dem Event in Rechnung gestellt oder mit Ihren Credits bezahlt, monatlich bei Events, die mehrere Monate im Verkauf sind; siehe [Preise](/pricing)."
  - type: cta
    id: start
    title: Ihre beste Veranstaltung liegt noch vor Ihnen. Fangen wir mit den Tickets an?
    text: Event anlegen, Zahlungskonto verbinden, Link teilen.
    primary: { label: Verkauf starten, href: /start }
