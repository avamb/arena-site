sections:
  - type: paycountries
    id: countries
  - type: cards
    id: what
    eyebrow: Für Shows
    title: Was zählt bei einer Show?
    items:
      - { title: Ein Plan pro Spielstätte, text: "Schicken Sie ein PDF, eine Tabelle oder eine Handskizze, und das Team zeichnet den Plan jeder Spielstätte kostenlos. Beim nächsten Besuch wird er wiederverwendet; Versionen bewahren den Verlauf.", link: { label: Saalpläne →, href: /product/seating } }
      - { title: Viele Termine, text: "Sessions nach Stadt und Tag in einem Event; Käufer wählen den Termin im Widget, Sie sehen die Summen pro Session.", link: { label: Event Center →, href: /#center } }
      - { title: Lokale Veranstalter, text: "Eine Seite pro Veranstalter mit eigenem Link und eigenen Codes; die Verkäufe aller Kanäle laufen in einem Event Center zusammen.", link: { label: Wo Sie verkaufen →, href: /product/sell } }
      - { title: Kinder und Gruppen, text: "Eigene Kategorien für Kinder und Gruppen, Freikarten für begleitende Erwachsene.", link: { label: Preis-Tools →, href: /product/pricing-tools } }
      - { title: Woher die Käufer kommen, text: "Ergänzen Sie Ihre Links um UTM-Parameter und sehen Sie, welcher Beitrag, Newsletter oder Partner in jeder Stadt die Verkäufe bringt.", link: { label: Wo Sie verkaufen →, href: /product/sell } }
      - { title: Verkäufe in Telegram, text: "Jeder Verkauf und jede Erstattung aus jeder Stadt erscheint in Sekunden in Ihrer Telegram-Gruppe, mit dem Kontakt des Käufers.", link: { label: Telegram →, href: /product/telegram } }
      - { title: Der Einlass, text: "Die Scanner-App MACS für iOS und Android prüft am selben Eingang Ihre Tickets und die Tickets von Partnern aus anderen Systemen.", link: { label: MACS Scanner-App →, href: /product/scanner } }
      - { title: "Ein Termin wird verlegt? Sie entscheiden", text: "Allen erstatten, stattdessen einen neuen Termin anbieten oder eine andere Lösung wählen. Käufer erhalten eine E-Mail mit dem aktualisierten Ticket.", link: { label: Tickets →, href: /product/tickets } }
      - { title: Geld auf Ihrem Konto, text: "Käufer zahlen über einen Anbieter in Ihrem Land direkt auf Ihr eigenes Konto; ArenaSoldOut.com hält das Geld nie.", link: { label: Zahlungen →, href: /payments } }
  - type: faq
    id: questions
    eyebrow: Fragen
    title: Was fragen Show-Produzenten zuerst?
    items:
      - q: Kann ein Event eine ganze Tournee abdecken?
        a: Ja. Sessions tragen Stadt, Spielstätte und Plan; Summen und CSV-Berichte gibt es pro Session und für das ganze Event.
      - q: Wie gehen wir mit einer Spielstätte um, in der wir noch nie gespielt haben?
        a: Schicken Sie den Plan in einer beliebigen lesbaren Form, und das Team baut ihn ein. Beim nächsten Besuch wird er wiederverwendet.
      - q: Unsere Tickets verkaufen auch lokale Partner. Kommt der Einlass damit zurecht?
        a: Ja. Die Scanner-App akzeptiert Tickets von Partnern aus anderen Systemen neben Tickets von ArenaSoldOut.com.
      - q: Wohin geht das Geld?
        a: "Auf Ihr eigenes Zahlungskonto, in Ihrer Währung, mit jeder Bestellung. Siehe [Zahlungen](/payments)."
  - type: cta
    id: start
    title: Ihre beste Veranstaltung liegt noch vor Ihnen. Fangen wir mit den Tickets an?
    text: Event anlegen, Zahlungskonto verbinden, Link teilen.
    primary: { label: Verkauf starten, href: /start }
    secondary: { label: Event anlegen, href: /start#create }
    tertiary: { label: Team kontaktieren, href: /contact#write }
