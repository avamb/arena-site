title: "Ticketverkauf für Shows: Eis, Zirkus, Tanz, viele Städte"
description: "Tickets für Tourneeshows verkaufen: ein Saalplan pro Spielstätte wiederverwendet, viele Termine, eine Seite pro Veranstalter, alle Städte in einem Event Center."
h1: Shows
tagline: Eine Show beginnt, lange bevor jemand die Bühne betritt.
lead: Eisshows, Zirkus, Tanz und Kindershows laufen an vielen Terminen in vielen Spielstätten. Ein Event, ein Plan pro Spielstätte, eine Seite pro Veranstalter, und die Verkäufe jeder Stadt an einem Ort.
