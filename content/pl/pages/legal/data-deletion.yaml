  # Shown only when Meta sends the person here after our data-deletion callback (?code=<confirmation code>).
  - type: deletion-status
    id: request
    title: "Otrzymaliśmy Twoje żądanie usunięcia danych"
    code_label: "Kod potwierdzenia:"
    text: "Połączenie z Meta (Facebook) i powiązane z nim dane (token dostępu, identyfikatory piksela i konta reklamowego oraz statystyki reklamowe) zostały usunięte z Arena Sold Out. Jeśli masz pytanie dotyczące tego żądania, napisz na support@arenasoldout.com i podaj kod potwierdzenia."
  - type: prose
    id: text
    body: |
      ## 1. Kim jesteśmy

      Platformą biletową ArenaSoldOut.com i aplikacją Meta „Arena Sold Out” zarządza ABH TEAM OÜ, wpisana do estońskiego rejestru handlowego pod numerem rejestrowym 14162982, Narva mnt 5a, 10117 Tallinn, Estonia.

      ## 2. Organizatorzy, którzy podłączyli konto reklamowe Meta (Facebook)

      Organizator może podłączyć swoje konto reklamowe Meta do Arena Sold Out: aby przekazywać sprzedaż biletów do Meta jako konwersje i widzieć wydatki na reklamę obok sprzedaży. W tym celu przechowujemy token dostępu, identyfikatory piksela i konta reklamowego oraz otrzymane statystyki reklam.

      **Odbierz dostęp samodzielnie.** Po każdym z tych kroków Arena Sold Out nie może już niczego odczytać ani wysłać przez twoje konto:

      - na Facebooku: Ustawienia i prywatność → Ustawienia → Integracje firmowe, znajdź „Arena Sold Out” i kliknij Usuń;
      - w Meta Business Suite: Ustawienia → Ustawienia firmy → Integracje (lub Konta → Aplikacje), znajdź „Arena Sold Out” i usuń ją.

      **Poproś nas o usunięcie przechowywanych danych.** Napisz na support@arenasoldout.com z adresu e-mail twojego konta w Event Center, podając „Usuń dane Meta” i nazwę twojej organizacji. Usuwamy token dostępu, identyfikatory piksela i konta reklamowego oraz statystyki reklam i potwierdzamy to e-mailem. Odpowiadamy w ciągu miesiąca. Dane, które musimy przechowywać z mocy prawa, przechowujemy tylko przez ten okres (sekcja 3 polityki prywatności).

      Dane, które Meta już otrzymała przez twoje konto, przechowuje Meta zgodnie z własną polityką prywatności.

      ## 3. Kupujący bilety

      Twoje prawa do danych osobowych (dostęp, sprostowanie, usunięcie i pozostałe) opisuje [sekcja 5 polityki prywatności](/pl/legal/privacy). Dane twoich biletów przetwarzamy w imieniu organizatora wydarzenia, który jest ich administratorem: wyślij prośbę do organizatora, którego kontakt jest na stronie sprzedaży i w e-mailu z biletem. Możesz też napisać na support@arenasoldout.com, a przekażemy prośbę organizatorowi.

      ## 4. Więcej informacji

      Co przetwarzamy, po co i jak długo: [polityka prywatności](/pl/legal/privacy).
