title: "Bilety dla obiektów i klubów: jeden plan, osobne warunki"
description: "Dla stałych obiektów i klubów: jeden plan sali na każde wydarzenie, wiele wydarzeń w miesiącu, skanowanie przy wejściu, procent ceny biletu zamiast opłaty."
h1: Obiekty i kluby
tagline: Klub ożywa na długo przed otwarciem drzwi.
lead: "Własny obiekt, wiele wydarzeń w miesiącu. Plan powstaje raz i jest używany ponownie, każdy promotor wynajmujący obiekt sprzedaje przez twoją stronę lub własną, a warunki są inne: procent ceny biletu zamiast opłaty za bilet."
related:
  - { label: Cennik i szczegółowe warunki, href: /pricing }
  - { label: Plany sali, href: /product/seating }
  - { label: Teatr, href: /solutions/theatre }
sections:
  - type: paycountries
    id: countries
  - type: cards
    id: what
    eyebrow: Dla obiektów
    title: Co jest ważne w obiekcie?
    items:
      - { title: "Jeden plan, każde wydarzenie", text: "Wyślij PDF, arkusz kalkulacyjny lub odręczny szkic, a zespół bezpłatnie narysuje plan; służy każdemu wydarzeniu, z wersjami dla różnych układów sceny.", link: { label: Plany sali →, href: /product/seating } }
      - { title: Promotorzy wynajmujący obiekt, text: "Strona dla każdego promotora z własnym linkiem; obiekt widzi wszystkie wydarzenia, promotor tylko swoje.", link: { label: Gdzie sprzedajesz →, href: /product/sell } }
      - { title: Osobne warunki, text: "Procent ceny biletu zamiast opłaty za bilet, bez prowizji od zaproszeń i zwrotów, warunki wolumenowe na zapytanie.", link: { label: Cennik →, href: /pricing } }
      - { title: Kody rabatowe i wczesne ceny, text: "Kody dla stałych gości i partnerów z limitem na kupującego, wczesne ceny do wybranej daty, bilety darmowe i z ceną do wyboru przez kupującego.", link: { label: Narzędzia cenowe →, href: /product/pricing-tools } }
      - { title: Wejście, text: "Aplikacja skanera MACS na iOS i Androida, skanery ręczne, bilety partnerów z innych systemów są przyjmowane.", link: { label: Aplikacja skanera MACS →, href: /product/scanner } }
      - { title: Bilety przy wejściu, text: "Ustaw przy wejściu wydrukowany kod QR z krótkim linkiem do zakupu: goście skanują go i kupują bilet na miejscu.", link: { label: Gdzie sprzedajesz →, href: /product/sell } }
      - { title: Sprzedaż w Telegramie, text: "Każda sprzedaż i każdy zwrot z każdego wydarzenia pojawia się w twojej grupie na Telegramie w kilka sekund, razem z kontaktem do kupującego.", link: { label: Telegram →, href: /product/telegram } }
      - { title: "Wydarzenie przeniesione? Ty decydujesz", text: "Zwracasz pieniądze wszystkim, proponujesz nowy termin albo wybierasz inne rozwiązanie. Kupujący dostają e-mail z zaktualizowanym biletem.", link: { label: Bilety →, href: /product/tickets } }
      - { title: Gotowe na duży start sprzedaży, text: "800 zamówień na minutę przy 1000 jednoczesnych kupujących w testach obciążeniowych, nocne szyfrowane kopie zapasowe.", link: { label: Niezawodność →, href: /product/reliability } }
  - type: faq
    id: questions
    eyebrow: Pytania
    title: O co właściciele obiektów pytają najpierw?
    items:
      - q: Jakie są warunki dla stałego obiektu?
        a: "Procent ceny biletu zamiast opłaty za bilet, bez prowizji od zaproszeń i zwrotów. Wartość podana jest na [stronie z cennikiem](/pricing); warunki wolumenowe i indywidualne na zapytanie."
      - q: Czy promotor może sprzedawać nasze wydarzenia na własnej stronie?
        a: Tak, przez widget na swojej stronie albo stronę promotora, którą hostujemy. Sprzedaż ze wszystkich kanałów pojawia się w Event Center obiektu.
      - q: Czy możemy przejść z innego systemu biletowego?
        a: "Tak. Dwóch klientów przeszło już ze swojego poprzedniego systemu biletowego bez przerwy w działaniu, razem z sesjami, planami sali i bazą klientów; inne systemy przez API na zapytanie. Zobacz [dla developerów](/developers)."
      - q: Kto prowadzi Event Center?
        a: Twój zespół, z rolami. Obiekt jest właścicielem organizacji; menedżerowie widzą to, na co im pozwolisz.
  - type: cta
    id: start
    title: Twoje najlepsze wydarzenie wciąż przed tobą. Zaczniemy od biletów?
    text: Opowiedz nam o obiekcie i liczbie wydarzeń w miesiącu. Plan i warunki ustawimy razem z tobą.
    primary: { label: Zacznij sprzedaż, href: /start }
    secondary: { label: Utwórz wydarzenie, href: /start#create }
    tertiary: { label: Skontaktuj się z zespołem, href: /contact#write }
