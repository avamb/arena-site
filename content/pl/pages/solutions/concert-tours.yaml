title: "Bilety na trasy koncertowe: miasta, strona na promotora"
description: "Sprzedawaj trasę koncertową z jednego wydarzenia: sesje według miast, plan sali dla każdego obiektu, strony promotorów z własnymi linkami i kodami, skanowanie."
h1: Trasy koncertowe
tagline: Trasa koncertowa zaczyna się na długo przed pierwszym miastem.
lead: Jeden show, wiele miast i dat. Każde miasto ma swoją sesję i plan, każdy promotor ma stronę z własnym linkiem, a całą trasę koncertową widzisz w jednym Event Center.
related:
  - { label: Pokazy i spektakle, href: /solutions/shows }
  - { label: Gdzie sprzedajesz, href: /product/sell }
  - { label: Płatności według krajów, href: /payments }
  - { label: "Kraje i metody płatności", href: /countries }
sections:
  - type: paycountries
    id: countries
  - type: cards
    id: what
    eyebrow: Dla tras koncertowych
    title: Co jest ważne w trasie koncertowej?
    items:
      - { title: Sesje według miast, text: "Daty i obiekty w jednym wydarzeniu; kupujący wybierają miasto, a ty widzisz sumy dla każdej sesji i dla całej trasy koncertowej.", link: { label: Event Center →, href: /#center } }
      - { title: Plan dla każdego obiektu, text: "Wyślij PDF, arkusz kalkulacyjny lub odręczny szkic, a zespół bezpłatnie narysuje plan każdego obiektu; przy następnej wizycie plan już na ciebie czeka.", link: { label: Plany sali →, href: /product/seating } }
      - { title: Strony promotorów, text: "Osobna strona dla każdego lokalnego promotora z własnym linkiem i kodami rabatowymi; sprzedaż zbiera się u ciebie.", link: { label: Gdzie sprzedajesz →, href: /product/sell } }
      - { title: Skąd przychodzą kupujący, text: "Dodaj tagi UTM do linków i zobacz, który post, newsletter lub partner sprzedaje bilety w każdym mieście.", link: { label: Gdzie sprzedajesz →, href: /product/sell } }
      - { title: Kilka krajów, text: "Sprzedawaj w Czechach, Hiszpanii, Francji, Gruzji czy Izraelu przez dostawcę z danego kraju, na własne konto.", link: { label: Płatności →, href: /payments } }
      - { title: Języki kupujących, text: "Strony i bilety w języku kupującego, e-maile w siedmiu językach, pismo od prawej do lewej dla hebrajskiego.", link: { label: Bilety →, href: /product/tickets } }
      - { title: Cała trasa koncertowa w Telegramie, text: "Każda sprzedaż i każdy zwrot z każdego miasta pojawia się w twojej grupie na Telegramie w kilka sekund, razem z kontaktem do kupującego.", link: { label: Telegram →, href: /product/telegram } }
      - { title: "Zmiana w jednym z miast? Ty decydujesz", text: "Zwracasz pieniądze wszystkim, proponujesz nowy termin albo wybierasz inne rozwiązanie. Kupujący dostają e-mail z zaktualizowanym biletem.", link: { label: Bilety →, href: /product/tickets } }
      - { title: Wejście w każdym mieście, text: "Aplikacja skanera MACS na iOS i Androida w każdym obiekcie; bilety lokalnych partnerów z innych systemów także są przyjmowane.", link: { label: Aplikacja skanera MACS →, href: /product/scanner } }
  - type: faq
    id: questions
    eyebrow: Pytania
    title: O co organizatorzy tras pytają najpierw?
    items:
      - q: Czy jedno wydarzenie może obejmować kilka krajów i walut?
        a: Sesje mogą odbywać się w różnych krajach; konto płatności i waluta zależą od organizacji. Dla osobnych walut zespół ustawia kanał dla każdego kraju.
      - q: Czy promotorzy widzą swoją sprzedaż nawzajem?
        a: Nie. Każdy promotor widzi tylko własną stronę; organizator widzi wszystko.
      - q: Miasto zmienia obiekt. Co z biletami, które już sprzedano?
        a: Sesja zostaje przeniesiona, a kupujący dostają e-mail z zaktualizowanym biletem; miejsca przypisujemy na nowo razem z tobą na nowym planie.
      - q: Ile kosztuje mnie bilet w trasie koncertowej?
        a: "Ta sama kwota za bilet w każdym mieście; zobacz [cennik](/pricing)."
  - type: cta
    id: start
    title: Twoje najlepsze wydarzenie wciąż przed tobą. Zaczniemy od biletów?
    text: Utwórz wydarzenie, podłącz konto płatności, udostępnij link.
    primary: { label: Zacznij sprzedaż, href: /start }
    secondary: { label: Utwórz wydarzenie, href: /start#create }
    tertiary: { label: Skontaktuj się z zespołem, href: /contact#write }
