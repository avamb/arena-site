title: "Sprzedaż biletów do teatru: plany sali, powtarzalne daty"
description: "Bilety do teatru z numerowanymi miejscami zgodnymi z salą, powtarzalne daty na jednym planie, zaproszenia, zwroty i zmiany terminów. Od 100 do 1500 miejsc."
h1: Teatr
tagline: Spektakl zaczyna się na długo przed podniesieniem kurtyny.
lead: Plan zgodny z twoją salą, narysowany przez nas bezpłatnie z twojego PDF, szkicu lub tabeli rzędów i używany przy każdym spektaklu. Zaproszenia dla prasy i partnerów, zwroty i przesunięte terminy obsługujesz z Event Center.
related:
  - { label: Plany sali zgodne z obiektem, href: /product/seating }
  - { label: "Obiekty i kluby: osobne warunki", href: /solutions/venues }
  - { label: E-bilety i skanowanie, href: /product/tickets }
sections:
  - type: paycountries
    id: countries
  - type: cards
    id: what
    eyebrow: Dla teatrów
    title: Co jest ważne w teatrze?
    items:
      - { title: Plan jest twój, text: "Parter, loże, balkon, kategorie według ceny. Wyślij PDF, arkusz kalkulacyjny lub odręczny szkic, a zespół bezpłatnie narysuje plan; wersje chronią sprzedane bilety, gdy zmienia się układ sali.", link: { label: Plany sali →, href: /product/seating } }
      - { title: Powtarzalne daty, text: "Dodawaj kolejne spektakle do tego samego wydarzenia; plan, ceny i kategorie są przenoszone, a kupujący wybierają datę.", link: { label: Event Center →, href: /#center } }
      - { title: Zaproszenia bez prowizji, text: "Darmowe bilety na konkretne miejsca dla prasy, partnerów i obsady, skanowane przy wejściu jak każdy inny bilet.", link: { label: Bilety →, href: /product/tickets } }
      - { title: Własna kasa, text: "Sprzedawaj na swojej stronie przez widget lub na stronie hostowanej; pieniądze trafiają prosto na twoje konto.", link: { label: Gdzie sprzedajesz →, href: /product/sell } }
      - { title: Kody rabatowe i wczesne ceny, text: "Kody dla stałych widzów, szkół lub partnerów z oknem czasowym i limitem na kupującego; wczesna cena, która kończy się w wybranym przez ciebie dniu.", link: { label: Narzędzia cenowe →, href: /product/pricing-tools } }
      - { title: "Spektakl przeniesiony? Ty decydujesz", text: "Zwracasz pieniądze wszystkim, proponujesz nowy termin albo wybierasz inne rozwiązanie. Kupujący dostają e-mail z zaktualizowanym biletem.", link: { label: Bilety →, href: /product/tickets } }
      - { title: Sprzedaż w Telegramie, text: "Każda sprzedaż i każdy zwrot pojawia się w twojej grupie na Telegramie w kilka sekund, razem z kontaktem do kupującego.", link: { label: Telegram →, href: /product/telegram } }
      - { title: Wejście, text: "Aplikacja skanera MACS na iOS i Androida sprawdza każdy bilet. Wydrukowany kod QR z krótkim linkiem do zakupu przy wejściu pozwala kupić bilet na miejscu tym, którzy przyszli bez niego.", link: { label: Aplikacja skanera MACS →, href: /product/scanner } }
      - { title: Opłata serwisowa w całości dla ciebie, text: "Dolicz własną opłatę serwisową do ceny biletu; trafia do ciebie w całości.", link: { label: Cennik →, href: /pricing } }
  - type: faq
    id: questions
    eyebrow: Pytania
    title: O co teatry pytają najpierw?
    items:
      - q: Czy rysujecie plan sali?
        a: Tak, bezpłatnie. Prześlij PDF z planem, zdjęcie odręcznego szkicu albo tabelę rzędów z liczbą miejsc w każdym rzędzie; wprowadzamy go do twojego wydarzenia, zwykle w ciągu doby, a ty zatwierdzasz go przed startem sprzedaży.
      - q: Czy możemy mieć różne ceny na parterze i na balkonie?
        a: Tak. Kategorie z własnymi cenami, pulami i oknami; okna early bird przełączają się według daty.
      - q: Gramy wiele spektakli w miesiącu. Czy jest inna oferta?
        a: "Tak. Stałym obiektom proponujemy procent ceny biletu zamiast opłaty za bilet; zobacz [obiekty](/solutions/venues) i [cennik](/pricing)."
      - q: Czy kupujący mogą wybierać miejsca na telefonie?
        a: Tak, mapa miejsc działa na telefonach z powiększaniem dwoma palcami, w języku kupującego.
  - type: cta
    id: start
    title: Twoje najlepsze wydarzenie wciąż przed tobą. Zaczniemy od biletów?
    text: "Wystarczy PDF, zdjęcie odręcznego szkicu albo tabela rzędów i miejsc. Bezpłatnie wprowadzamy go do twojego wydarzenia i pokazujemy ci przed startem sprzedaży."
    primary: { label: Zacznij sprzedaż, href: /start }
    secondary: { label: Utwórz wydarzenie, href: /start#create }
    tertiary: { label: Skontaktuj się z zespołem, href: /contact#write }
