title: "Sprzedaż biletów na koncerty: stojące i siedzące, early bird"
description: "Sprzedawaj bilety na koncerty na własnej lub hostowanej stronie: pule stojące, kategorie siedzące, early bird, kody partnerów, skanowanie. Pieniądze są twoje."
h1: Koncerty
lead: Miejsca stojące i siedzące w jednym wydarzeniu, kilka kategorii cenowych, okno early bird włączane w wybranym dniu i wejście, które skanuje każdy bilet. Kupujący płacą na twoje konto od pierwszego biletu.
related:
  - { label: Kody promocyjne i okna cenowe, href: /product/pricing-tools }
  - { label: E-bilety i skanowanie, href: /product/tickets }
  - { label: Festiwale, href: /solutions/festivals }
sections:
  - type: cards
    id: what
    eyebrow: Dla koncertów
    title: Co jest ważne w koncercie?
    items:
      - { title: Stojące i siedzące razem, text: "Strefa stojąca z pulą obok kategorii siedzących, w jednym planie i jednym koszyku.", link: { label: Plany sali →, href: /product/seating } }
      - { title: "Early bird, który włącza się sam", text: "Okno cenowe według daty i godziny albo próg ilościowy, który otwiera kolejną cenę, gdy pierwsza się wyprzedaje.", link: { label: Narzędzia cenowe →, href: /product/pricing-tools } }
      - { title: Partnerzy i promotorzy, text: "Strona dla każdego promotora z własnym linkiem, kody promocyjne dla partnerów, wszystkie kanały w jednym Event Center.", link: { label: Gdzie sprzedajesz →, href: /product/sell } }
      - { title: Wejście, text: "Aplikacja skanera na iOS i Androida, EAN-13 i QR na każdym bilecie, bilety partnerów z innych systemów także są przyjmowane.", link: { label: Aplikacja skanera MACS →, href: /product/scanner } }
  - type: faq
    id: questions
    eyebrow: Pytania
    title: O co organizatorzy koncertów pytają najpierw?
    items:
      - q: Jak szybko koncert może trafić do sprzedaży?
        a: "Bez planu sali: 10 minut od potwierdzenia organizacji i podłączenia konta płatności; wystarczy nazwa, data, ceny i plakat. Z miejscami zwykle w ciągu doby, po tym jak bezpłatnie narysujemy plan z twojego pliku."
      - q: Czy mogę sprzedawać kategorię VIP z ograniczoną pulą?
        a: Tak. Każda kategoria ma własną cenę, pulę i okno sprzedaży; wyprzedana kategoria może przekazać niesprzedane miejsca następnej.
      - q: Ile kosztuje mnie bilet?
        a: "Stała kwota za sprzedany bilet, rozliczana po sesji; zobacz [cennik](/pricing). Zaproszenia i zwroty są bezpłatne."
      - q: Czy widzę sprzedaż na bieżąco?
        a: Tak. Każda sprzedaż trafia do twojej grupy w Telegramie w ciągu kilku sekund oraz do Event Center z sumami dla sesji i eksportem CSV.
  - type: cta
    id: start
    title: Wystaw koncert na sprzedaż już dziś
    text: Utwórz wydarzenie, podłącz konto płatności, udostępnij link.
    primary: { label: Utwórz wydarzenie, href: /start#create }
    secondary: { label: Otwórz bota w Telegramie, href: https://t.me/EventsCentrBot }
    note: "Albo napisz do nas: wszystko ustawimy razem z tobą na rozmowie."
