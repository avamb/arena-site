title: "Bilety na warsztaty, szkolenia i degustacje"
description: "Sprzedawaj miejsca na warsztaty, szkolenia, degustacje i zajęcia: małe grupy z pulą, cykliczne terminy, e-maile, wejścia bezpłatne i płatne dowolną kwotą."
h1: Warsztaty i szkolenia
lead: Małe grupy, cykliczne terminy, własne e-maile w twoim języku. Strona hostowana jest gotowa w kilka minut; widget pasuje do strony, którą już masz. Vino&Co w Izraelu sprzedaje w ten sposób swoje degustacje.
related:
  - { label: Kody promocyjne i okna cenowe, href: /product/pricing-tools }
  - { label: Gdzie sprzedajesz, href: /product/sell }
