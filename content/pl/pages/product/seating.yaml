title: "Plany sali: miejsca numerowane i strefy stojące"
description: "Plany sali z wersjami, importem SVG, mieszanymi miejscami numerowanymi i stojącymi, cenami kategorii. Wyślij PDF, szkic lub tabelę rzędów, narysujemy za darmo."
h1: Plany sali zgodne z obiektem
lead: Miejsca numerowane są w rdzeniu platformy, a nie dodatkiem. Zespół buduje twój plan z tego, co masz, zwykle w ciągu doby, i używa go ponownie dla każdego terminu.
