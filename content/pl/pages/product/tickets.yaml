title: "E-bilety z EAN-13 i QR, skanowanie, e-maile do kupujących"
description: "Bilety PDF z EAN-13 i QR w języku kupującego, aplikacja skanera MACS na iOS i Androida, bilety próbne, e-maile przy przeniesieniu lub odwołaniu terminu."
h1: Bilet, który się skanuje
lead: Każdy bilet to PDF z kodem kreskowym EAN-13 i kodem QR, w języku kupującego. Zeskanuj go aplikacją lub skanerem ręcznym, wyślij ponownie, zwróć, wymień, gdy termin się przesuwa.
