  - type: money
    id: money
    eyebrow: Pieniądze
    title: Kupujący płacą tobie. Nie nam.
    lead: 100% każdej sprzedaży trafia do ciebie. Kupujący płaci cenę biletu, a jeśli ją dodasz, także opłatę serwisową, prosto na twoje konto płatności, w twojej walucie, na twoim wyciągu. ArenaSoldOut.com nigdy nie przechowuje twoich pieniędzy. Płacisz ArenaSoldOut.com prowizję platformy za każdy sprzedany bilet, po wydarzeniu lub z przedpłaconego pakietu. Zwroty i obciążenia zwrotne (chargebacki) to twoja decyzja, a nie polityka platformy.
