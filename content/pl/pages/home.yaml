  - type: reasons
    id: why
    eyebrow: Dlaczego ArenaSoldOut.com
    title: Dlaczego organizatorzy sprzedają bilety u nas?
    lead: "Cztery powody, a za każdym fakty."
    items:
      - icon: wallet
        title: Z każdego biletu zostaje ci więcej
        text: "Stała opłata **{price}** za bilet, a nie procent od przychodu: bilet za $15 i bilet za $150 kosztują cię tyle samo. Kupujący płacą na twoje konto płatności, więc pieniądze są twoje w chwili zapłaty, a nie po wydarzeniu."
        bullets:
          - Nic nie jest potrącane z twojej sprzedaży, żadna rezerwa nie jest wstrzymywana
          - Bez prowizji od zaproszeń i darmowych biletów
          - Plan sali rysujemy dla ciebie za darmo
        link: { label: Ceny i kalkulator →, href: /pricing }
      - icon: clock
        title: Sprzedaż w 10 minut
        text: "Gdy twoja organizacja zostanie potwierdzona, zwykle w ciągu doby, wydarzenie bez planu sali trafia do sprzedaży w **10 minut**, jeśli masz już konto u operatora płatności. Konto podłączasz raz; każde kolejne wydarzenie wymaga tylko nazwy, dat i cen."
        link: { label: "Twoje pierwsze wydarzenie, krok po kroku →", href: /first-event }
      - icon: list-checks
        title: To, o co proszą organizatorzy, już gotowe
        text: "Bez modułów do dokupienia, bez wtyczek do instalowania:"
        bullets:
          - Widget na twojej stronie lub strona sprzedaży, którą hostujemy
          - Miejsca siedzące i stojące w jednym wydarzeniu
          - Kody promocyjne, ceny zmieniające się z datą
          - Zaproszenia, zwroty, przeniesione terminy z e-mailami do kupujących
          - Aplikacja skanera na iOS i Androida
          - Każda sprzedaż w twojej grupie na Telegramie w kilka sekund
        link: { label: Odpowiedzi w szczegółach →, href: "#answers" }
      - icon: shield-check
        title: Sprzedajemy bilety od {since} roku
        text: "Organizatorzy w **{countries}** krajach od {since} roku: koncerty, teatry, festiwale, widowiska, warsztaty. **800** zamówień na minutę w testach obciążeniowych, nocne szyfrowane kopie zapasowe, watchdog, który alarmuje zespół, zanim ty cokolwiek zauważysz."
        link: { label: Klienci i opinie →, href: /clients }

  - type: steps
    id: how
    eyebrow: Jak to działa
    title: Sprzedaż jeszcze dziś. Trzy pytania, które organizatorzy zadają najpierw.
    items:
      - title: Jak szybko mogę zacząć sprzedaż?
        text: "Wydarzenie bez planu sali trafia do sprzedaży w 10 minut, gdy twoja organizacja jest potwierdzona, a konto płatności podłączone; podłączasz je raz. Przy sali z numerowanymi miejscami wyślij nam plan: narysujemy go za darmo, zwykle w ciągu doby."
      - title: Czego potrzebuję?
        text: "Nazwy i terminów wydarzenia, cen biletów, plakatu oraz własnego konta płatności: Stripe, Flitt, AllPay lub innego operatora z twojego kraju. Pieniądze trafiają do ciebie od pierwszego biletu."
      - title: Jak to skonfigurować?
        text: "W przeglądarce na komputerze lub telefonie, w „Event Center”*. Albo w Telegramie, gdzie bot czyta twój plakat i uzupełnia daty, ceny i miejsce do twojego potwierdzenia. Nie masz czasu? Nasz [event manager](/pricing#services) zrobi to za ciebie, jako usługa płatna."
    note: "* „Event Center” to twoje konto organizatora na ArenaSoldOut.com: każde wydarzenie, zamówienie, zwrot, zaproszenie i termin, dla ciebie i twojego zespołu, w przeglądarce i w Telegramie. [Zobacz Event Center poniżej →](#center) Wszystkie kroki od zgłoszenia do skanera: [twoje pierwsze wydarzenie →](/first-event)"

  - type: ways
    id: where
    eyebrow: Gdzie sprzedajesz
    title: Na twojej stronie lub na naszej. Pieniądze i tak trafiają do ciebie.
    items:
      - title: Masz stronę
        text: "Twoja strona jest kasą. Osadź widget biletowy na dowolnej podstronie: WordPress, Tilda, Wix, Webflow lub własny kod. Kupujący nie opuszczają twojej domeny."
        bullets:
          - Widget na dowolnej stronie, trzy linijki kodu
          - Wtyczka WordPress z zamówieniami WooCommerce
          - Twoje kolory, twoje czcionki, twój język
      - title: Nie masz strony
        text: "Hostujemy stronę sprzedaży: tickets.arenasoldout.com/your-name/your-event. Udostępnij jeden link w mediach społecznościowych, komunikatorach i na plakacie."
        bullets:
          - Strona dla każdego organizatora i każdego wydarzenia
          - Osobna strona dla każdego promotora
          - Gotowa w kilka minut, bez pracy projektowej
          - Linki do twoich partnerów sprzedaży na tej samej stronie

  - type: qa
    id: answers
    eyebrow: O co organizatorzy pytają dalej
    title: Tak. A oto jak.
    items:
      - title: Czy mogę używać kodów promocyjnych?
        text: Tak. Kod może obowiązywać dla jednego wydarzenia, jednego terminu lub jednej kategorii, z oknem czasowym, minimum i limitem na kupującego.
      - title: Czy ceny mogą zmieniać się w ustalonym przeze mnie dniu?
        text: Tak. Okna cen wczesnych (early bird) przełączają się według daty i godziny. Progi ilościowe otwierają kolejną cenę, gdy bieżąca się wyprzeda.
        visual:
          type: ladder
          rungs:
            - { price: US$24, width: 100, label: pierwsze 100 · sprzedane }
            - { price: US$119, width: 62, label: kolejne 150 · w sprzedaży }
            - { price: US$599, width: 0, label: otwiera się potem, next: true }
      - title: Kilka cen w jednym wydarzeniu?
        text: Tak. Kategorie z własną ceną, pulą i oknem sprzedaży, a do tego bilety darmowe i z ceną do wyboru przez kupującego.
      - title: Czy mogę dodać opłatę serwisową?
        text: Tak. Procent dla każdego kanału sprzedaży, pokazany kupującemu w osobnej linii i wpłacany na twoje konto razem z biletem. Sprawdź, czy twój kraj dopuszcza opłatę serwisową przy sprzedaży biletów.
      - title: Z miejscami numerowanymi i bez?
        text: "Tak, i jedno z drugim w jednym wydarzeniu: plan sali z kategoriami, strefy stojące z pulami. Wyślij nam plan swojej sali, a narysujemy go w systemie za darmo, zwykle w ciągu doby: wystarczy PDF, zdjęcie odręcznego szkicu lub tabela z rzędami i miejscami w każdym rzędzie (Excel lub Google Sheets). Nigdy nie wpisujesz go ręcznie."
        visual:
          type: plan
          aria: Plan sali z parterem, dwiema lożami, balkonem i strefą stojącą
          stage: Scena
          parterre: Parter · 312
          logeLeft: Loża L · 48
          logeRight: Loża P · 48
          balcony: Balkon · 180
          standing: Strefa stojąca
      - title: Czy skaner działa z biletami?
        text: Tak. Każdy bilet to PDF z kodem kreskowym EAN-13 i kodem QR, w języku kupującego. Skanuj przy wejściu aplikacją skanera na iOS i Androida lub skanerem ręcznym. Aplikacja przyjmuje też bilety sprzedane przez twoich partnerów w innych systemach.
        visual:
          type: ticket
          event: Autumn Jazz Night
          meta: pt. 24 paź · 19:30 · Palác Akropolis
          seat: Parter · Rząd G · Miejsce 7
          code: "2173049188256"
      - title: Jak sprawdzam swoją sprzedaż?
        text: "W „Event Center”, twoim własnym koncie na tej stronie: otwierasz je na telefonie lub komputerze, nic nie trzeba instalować. Wszystkie twoje wydarzenia, każde zamówienie, zwroty i sumy dla każdego terminu, widoczne tylko dla ciebie i twojego zespołu. Wolisz Telegram? Każda sprzedaż i każdy zwrot trafia też do twojej grupy na Telegramie w kilka sekund, razem z kontaktem do kupującego. [Zobacz Event Center poniżej →](#center)"
        visual:
          type: telegram
          from: ArenaSoldOut.com
          lines:
            - "**Opłacone** · Autumn Jazz Night · pt. 24 paź"
            - Rząd G 7–8 · Parter
            - "**€76.00** · Anna K. · +420 ••• 41 18"
          time: "19:42"
      - title: Zwroty, zaproszenia, zmiany terminów?
        text: "Tak, z twojego konta „Event Center”. Zwróć bilet, wystaw zaproszenia, przenieś lub odwołaj termin: kupujący dostają e-mail w swoim języku z zaktualizowanym biletem."
      - title: Czy poradzi sobie ze stadionem?
        text: Tak. 800 zamówień na minutę przy 1000 kupujących jednocześnie na stronie w testach obciążeniowych, nocne szyfrowane kopie zapasowe, watchdog, który alarmuje nas, zanim ty cokolwiek zauważysz.

