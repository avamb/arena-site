  - type: faq
    id: faq
    eyebrow: Pytania
    title: O co pytają organizatorzy
    items:
      - q: Ile kosztuje start?
        a: "Nic. Nie ma abonamentu ani dodatkowych opłat miesięcznych czy rocznych. Płacisz prowizję za każdy sprzedany bilet, od {usdPrice}. Zaproszenia i darmowe bilety są bez prowizji. [Ceny i kalkulator →](/pricing)"
      - q: Czy są jakieś dodatkowe opłaty, miesięczne lub roczne?
        a: Nie. Żadnych opłat miesięcznych ani rocznych, żadnego abonamentu. Płacisz tylko prowizję za każdy sprzedany bilet.
      - q: Sprzedaję bilety przez WhatsAppa, a kupujący do mnie dzwonią. Po co mi platforma biletowa?
        a: "Żeby nie przyjmować każdego zamówienia ręcznie. Kupujący wybierają miejsca i płacą o każdej porze, także w nocy; pieniądze trafiają prosto na twoje konto, a bilet z kodem QR do skrzynki e-mail kupującego. Link do sprzedaży możesz dalej wysyłać na WhatsAppie: twój czas idzie na wydarzenie, a nie na wiadomości i listy."
      - q: Kto płaci opłatę serwisową, ja czy kupujący?
        a: Ty decydujesz. Możesz doliczyć własną opłatę serwisową do ceny biletu, a całość trafia do ciebie razem z płatnością. Nasza prowizja za bilet pozostaje taka sama.
      - q: Kiedy dostaję pieniądze?
        a: Przy każdym zamówieniu. Kupujący płaci prosto na twoje konto płatności; ArenaSoldOut.com nigdy nie przechowuje pieniędzy. Wypłaty do twojego banku idą według harmonogramu twojego operatora.
      - q: Czy mogę osadzić sprzedaż biletów na własnej stronie?
        a: "Tak. Widget biletowy umieścisz na dowolnej stronie trzema linijkami kodu: WordPress, Tilda, Wix, Webflow lub własny kod. Kupujący wybierają miejsca i bilety bezpośrednio na twojej stronie. [Dla developerów →](/developers)"
      - q: Jak działa kontrola wejść w dniu wydarzenia?
        a: "Każdy bilet to PDF z kodem QR i kodem kreskowym EAN-13. Przy wejściu aplikacja MACS na iOS i Androida skanuje bilety zwykłym telefonem; sprawdzi się też skaner ręczny. Aplikacja przyjmuje również bilety sprzedane przez twoich partnerów w innych systemach. [Aplikacja skanera MACS →](/product/scanner)"
      - q: Czy można kupić bilet tuż przy wejściu?
        a: Tak. Wydrukuj kod QR z krótkim linkiem do zakupu i powieś go przy wejściu. Ludzie skanują go telefonem i kupują bilet na miejscu.
      - q: Co się dzieje, gdy wydarzenie zostanie odwołane lub przeniesione?
        a: Ty decydujesz. Zwracasz pieniądze wszystkim kupującym, proponujesz nowy termin zamiast zwrotu albo wybierasz inne rozwiązanie. Kupujący dostają e-mail w swoim języku z zaktualizowanym biletem.
      - q: Czy widzę, skąd przychodzą kupujący?
        a: Tak. Dodaj tagi UTM do linków sprzedażowych, a Event Center pokaże, który kanał przyniósł zamówienia.
      - q: Pierwszy raz sprzedaję bilety. Czy to dla mnie?
        a: "Tak. Przeprowadzimy cię przez wszystko krok po kroku: [twoje pierwsze wydarzenie →](/first-event). Plan sali narysujemy za darmo, a jeśli wolisz, skonfigurujemy wszystko razem z tobą podczas rozmowy."
      - q: Jak skontaktować się z zespołem ArenaSoldOut.com, gdy mam pytanie?
        a: "Napisz do nas na Telegramie, przez [formularz na stronie](/contact#write) lub na hello@arenasoldout.com. Odpowiadają ludzie z zespołu."

