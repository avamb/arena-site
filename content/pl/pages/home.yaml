  - type: steps
    id: how
    eyebrow: Jak to działa
    title: Sprzedaż jeszcze dziś. Trzy pytania, które organizatorzy zadają najpierw.
    items:
      - title: Jak szybko mogę zacząć sprzedaż?
        text: "Wydarzenie bez planu sali trafia do sprzedaży w 10 minut, gdy twoja organizacja jest potwierdzona, a konto płatności podłączone; podłączasz je raz. Przy sali z numerowanymi miejscami wyślij nam plan: narysujemy go za darmo, zwykle w ciągu doby."
      - title: Czego potrzebuję?
        text: "Nazwy i terminów wydarzenia, cen biletów, plakatu oraz własnego konta płatności: Stripe, Flitt, AllPay lub innego operatora z twojego kraju. Pieniądze trafiają do ciebie od pierwszego biletu."
      - title: Jak to skonfigurować?
        text: "W przeglądarce na komputerze lub telefonie, w „Event Center”*. Albo w Telegramie, gdzie bot czyta twój plakat i uzupełnia daty, ceny i miejsce do twojego potwierdzenia. Albo wyślij nam materiały, a skonfigurujemy to za ciebie."
    note: "* „Event Center” to twoje konto organizatora na ArenaSoldOut.com: każde wydarzenie, zamówienie, zwrot, zaproszenie i termin, dla ciebie i twojego zespołu, w przeglądarce i w Telegramie. [Zobacz Event Center poniżej →](#center) Wszystkie kroki od zgłoszenia do skanera: [twoje pierwsze wydarzenie →](/first-event)"

  - type: ways
    id: where
    eyebrow: Gdzie sprzedajesz
    title: Na twojej stronie, na naszej stronie, u partnerów i w mediach społecznościowych. Pieniądze zawsze trafiają do ciebie.
    items:
      - title: Twoja strona
        text: "Twoja strona jest kasą. Osadź widget biletowy na dowolnej podstronie: WordPress, Tilda, Wix, Webflow lub własny kod. Kupujący nie opuszczają twojej domeny."
        bullets:
          - Widget na dowolnej stronie, trzy linijki kodu
          - Integracja z WordPressem
          - Twoje kolory, twoje czcionki, twój język
      - title: Nasza strona sprzedaży
        text: "Hostujemy stronę sprzedaży: tickets.arenasoldout.com/your-name/your-event. Jeden link na plakat, do newslettera i do komunikatorów."
        bullets:
          - Strona dla każdego organizatora i każdego wydarzenia
          - Gotowa w kilka minut, bez pracy projektowej
          - Linki do twoich partnerów sprzedaży na tej samej stronie
      - title: Strony partnerów
        text: "Ten sam widget możesz umieścić na stronie obiektu, promotora lub agencji. Każdy promotor dostaje własną stronę sprzedaży i własny link."
        bullets:
          - Widget na stronie partnera
          - Osobna strona i link dla każdego promotora
          - Cała sprzedaż partnerów w jednym Event Center
      - title: Media społecznościowe i komunikatory
        text: "Link do sprzedaży na Instagramie, Facebooku, Telegramie i WhatsAppie, na plakacie i w newsletterze. Przy wejściu kod QR z krótkim linkiem: ludzie skanują go i od razu kupują bilet."
        bullets:
          - Jeden link do każdego kanału
          - Kod QR na plakacie i przy wejściu
          - Źródła sprzedaży według tagów UTM

  - type: qa
    id: answers
    eyebrow: Funkcje
    title: Wszystko, czego potrzebuje organizator, na jednej platformie
    more: { label: Wszystkie funkcje →, href: /features }
    items:
      - title: Kody rabatowe
        text: Kod może obowiązywać dla jednego wydarzenia, jednego terminu lub jednej kategorii, z oknem czasowym, minimum i limitem na kupującego.
      - title: Ceny, które zmieniają się same
        text: Okna cen wczesnych (early bird) przełączają się według daty i godziny. Progi ilościowe otwierają kolejną cenę, gdy bieżąca się wyprzeda.
        visual:
          type: ladder
          rungs:
            - { price: US$24, width: 100, label: pierwsze 100 · sprzedane }
            - { price: US$119, width: 62, label: kolejne 150 · w sprzedaży }
            - { price: US$599, width: 0, label: otwiera się potem, next: true }
      - title: Kategorie i darmowe bilety
        text: Kategorie z własną ceną, pulą i oknem sprzedaży, a do tego bilety darmowe i z ceną do wyboru przez kupującego.
      - title: Własna opłata serwisowa
        text: Procent dla każdego kanału sprzedaży, pokazany kupującemu w osobnej linii i wpłacany na twoje konto razem z biletem, w całości dla ciebie. Sprawdź, czy twój kraj dopuszcza opłatę serwisową przy sprzedaży biletów.
      - title: Miejsca siedzące i stojące
        text: "Plan sali z kategoriami i strefy stojące z pulami w jednym wydarzeniu. Wyślij nam plan swojej sali, a narysujemy go w systemie za darmo, zwykle w ciągu doby: wystarczy PDF, zdjęcie odręcznego szkicu lub tabela z rzędami i miejscami w każdym rzędzie (Excel lub Google Sheets). Nigdy nie wpisujesz go ręcznie."
        visual:
          type: plan
          aria: Plan sali z parterem, dwiema lożami, balkonem i strefą stojącą
          stage: Scena
          parterre: Parter · 312
          logeLeft: Loża L · 48
          logeRight: Loża P · 48
          balcony: Balkon · 180
          standing: Strefa stojąca
      - title: Bilety i wejście
        text: Każdy bilet to PDF z kodem kreskowym EAN-13 i kodem QR, w języku kupującego. Skanuj przy wejściu aplikacją skanera na iOS i Androida lub skanerem ręcznym. Aplikacja przyjmuje też bilety sprzedane przez twoich partnerów w innych systemach.
        visual:
          type: ticket
          event: Autumn Jazz Night
          meta: pt. 24 paź · 19:30 · Palác Akropolis
          seat: Parter · Rząd G · Miejsce 7
          code: "2173049188256"
      - title: Sprzedaż na bieżąco
        text: "W „Event Center”, twoim własnym koncie na tej stronie: otwierasz je na telefonie lub komputerze, nic nie trzeba instalować. Wszystkie twoje wydarzenia, każde zamówienie, zwroty i sumy dla każdego terminu, widoczne tylko dla ciebie i twojego zespołu. Tagi UTM pokazują, skąd przychodzą kupujący. Wolisz Telegram? Każda sprzedaż i każdy zwrot trafia też do twojej grupy na Telegramie w kilka sekund, razem z kontaktem do kupującego. [Zobacz Event Center poniżej →](#center)"
        visual:
          type: telegram
          from: ArenaSoldOut.com
          lines:
            - "**Opłacone** · Autumn Jazz Night · pt. 24 paź"
            - Rząd G 7–8 · Parter
            - "**€76.00** · Anna K. · +420 ••• 41 18"
          time: "19:42"
      - title: Zwroty, zaproszenia, zmiany terminów
        text: "Wszystko z twojego konta „Event Center”: zwróć bilet, wystaw zaproszenia, przenieś lub odwołaj termin. Jeśli wydarzenie zostanie odwołane lub przeniesione, to ty decydujesz, co dzieje się z pieniędzmi: zwracasz je wszystkim albo proponujesz nowy termin. Kupujący dostają e-mail w swoim języku z zaktualizowanym biletem."
      - title: Niezawodność
        text: 800 zamówień na minutę przy 1000 kupujących jednocześnie na stronie w testach obciążeniowych, nocne szyfrowane kopie zapasowe, watchdog, który pilnuje platformy przez całą dobę.
      - title: Kod QR przy wejściu
        text: Wydrukuj kod QR z krótkim linkiem do zakupu i powieś go przy wejściu. Ludzie skanują go i kupują bilet na miejscu, nawet jeśli przyszli bez biletu.
      - title: API na zapytanie
        text: API, webhooki i import wydarzeń jednym wywołaniem uruchamiamy na zapytanie, gdy twoja sprzedaż ma się łączyć z twoim własnym systemem.

