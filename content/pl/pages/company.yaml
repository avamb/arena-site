sections:
  - type: prose
    id: story
    eyebrow: Firma
    title: Czym jest ArenaSoldOut.com?
    body: |
      ArenaSoldOut.com to platforma biletowa dla organizatorów: miejsca numerowane i wejścia ogólne w jednym wydarzeniu, własne konto płatności organizatora, strona sprzedaży hostowana przez nas lub widget na stronie organizatora, Event Center w przeglądarce i w Telegramie. Kupujący płacą bezpośrednio organizatorowi; platforma nigdy nie przetrzymuje pieniędzy.

      Firmą jest ABH TEAM OÜ, zarejestrowana w Unii Europejskiej. Wcześniejsze platformy założycieli obsługiwały pokazy Cirque du Soleil, stadiony FIFA 2018, World Choir Games i 800 pokazów na lodzie; ArenaSoldOut.com sprzedaje bilety dla organizatorów od 2019 roku, a w 2026 roku został zbudowany od podstaw na nowo.

      Zespół odpowiada organizatorom osobiście, po angielsku, hiszpańsku, czesku, rosyjsku i hebrajsku. Większość próśb organizatorów trafia do produkcji w ciągu kilku tygodni; każda, która tam trafiła, jest wymieniona na [stronie zmian](/changes) z datą, a [strona z faktami](/facts) mówi, co istnieje, czego nie ma i od kiedy.
