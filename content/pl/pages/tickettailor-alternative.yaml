  - type: prose
    id: examples
    title: Co to oznacza dla jednego wydarzenia?
    body: |
      **1000 biletów, wstęp bez miejsc numerowanych, płatność za sprzedane bilety.** ArenaSoldOut.com: 1000 × US$0,62 = **US$620**. Ticket Tailor: 1000 × US$0,85 = US$850. Zostaje ci o **US$230** więcej.

      **500 biletów z miejscami, płatność za sprzedane bilety.** ArenaSoldOut.com: 500 × US$1,18 = **US$590**. Ticket Tailor: 500 × US$1,70 = US$850. Zostaje ci o **US$260** więcej, a plan sali rysujemy za darmo.

      **1000 biletów rocznie, płatność z góry w kredytach.** Pakiet kredytów 1K w ArenaSoldOut.com: **US$430**. Ticket Tailor, 1000 kredytów: US$520. O **US$90** mniej, a kredyty nie wygasają na żadnej z platform.

      Policz własne wydarzenie w [kalkulatorze na stronie cennika](/pricing#packages).

  - type: cards
    id: more
    eyebrow: Poza ceną
    title: Co jeszcze dostajesz z ArenaSoldOut.com?
    items:
      - title: Plany sali rysowane za ciebie, za darmo
        text: "Wyślij PDF, zdjęcie odręcznego szkicu lub tabelę z rzędami i miejscami. Zespół buduje obiekt; sam nigdy go nie rysujesz."
        link: { label: Plany sali, href: /product/seating }
      - title: Pieniądze prosto na twoje konto
        text: "Kupujący płacą na twoje własne konto Stripe, Flitt lub AllPay. ArenaSoldOut.com nigdy nie przechowuje środków i niczego nie potrąca z twojej sprzedaży."
        link: { label: Płatności, href: /payments }
      - title: Niższa stawka dla tanich biletów
        text: "Gdy każdy bilet wydarzenia kosztuje {usdLowMax} lub mniej: {lowPercent}% ceny biletu zamiast stałej opłaty. Dyskoteki, biegi, urodziny dla dzieci, wycieczki."
        link: { label: Jak to działa, href: /pricing#low-price }
      - title: Kupujący w swoim języku
        text: "Strona kupującego, e-maile i bilety w języku kupującego, także hebrajski od prawej do lewej. Każdy nowy język dodajemy w ciągu 40 godzin."
        link: { label: E-bilety, href: /product/tickets }
      - title: Każda sprzedaż w twoim Telegramie
        text: "Utwórz wydarzenie ze zdjęcia plakatu w bocie na Telegramie i zobacz każdą sprzedaż i zwrot w swojej grupie w kilka sekund."
        link: { label: Bot w Telegramie, href: /product/telegram }
      - title: Skonfiguruj sam albo zleć nam
        text: "Wydarzenia, ceny i kategorie tworzysz sam w Event Center lub w bocie na Telegramie, w kilka minut; plany sali rysujemy za darmo. Nie masz czasu? Nasz event manager zrobi to za ciebie, jako usługa płatna."
        link: { label: Usługi dodatkowe, href: /pricing#services }

  - type: faq
    id: questions
    title: Pytania organizatorów, którzy porównują
    items:
      - q: Czy ArenaSoldOut.com jest tańsze niż Ticket Tailor?
        a: "Tak, za bilet przy każdym opublikowanym wolumenie do 5000 biletów rocznie: {usdPrice} zamiast US$0,85 przy płatności za sprzedane bilety, {usdSeated} zamiast US$1,70 za bilet z miejscem i od {usdFrom} za bilet z kredytami. Powyżej 5000 biletów rocznie ustalamy warunki indywidualne."
      - q: Czy pobieracie procent od ceny biletu?
        a: "Nie. Tak jak Ticket Tailor, pobieramy stałą opłatę za sprzedany bilet. Jedyne procenty są opcjonalne: niższa stawka dla wydarzeń, w których każdy bilet kosztuje {usdLowMax} lub mniej, oraz stawka dla stałych obiektów."
      - q: Dokąd trafiają pieniądze kupującego?
        a: "Na twoje własne konto płatności z każdym zamówieniem: Stripe, Flitt lub AllPay. ArenaSoldOut.com nigdy nie przechowuje środków. Nasza prowizja jest fakturowana po wydarzeniu albo pobierana z twoich kredytów."
      - q: Czy mogę przenieść swoje wydarzenia z Ticket Tailor?
        a: "Tak. Wydarzenia tworzysz w Event Center lub w bocie na Telegramie, plany sali rysujemy za darmo, a ty sprzedajesz dalej na Ticket Tailor, dopóki twoja strona u nas nie będzie gotowa. Nie masz czasu, by to skonfigurować? Nasz [event manager](/pricing#services) zrobi to za ciebie, jako usługa płatna."
      - q: Czy płacę abonament?
        a: "Nie. Płacisz tylko za sprzedane bilety. Zaproszenia i darmowe bilety na płatne wydarzenia nie podlegają prowizji."
      - q: A organizacje charytatywne?
        a: "Zarejestrowane organizacje charytatywne dostają 50% zniżki od naszej prowizji, tak jak w Ticket Tailor. Napisz do nas, a włączymy to dla twojej organizacji."
      - q: Jak sprzedawać w euro?
        a: "Obiekty w krajach UE płacą naszą prowizję w euro: {eurPrice} za bilet przy płatności za sprzedane bilety. Same bilety są sprzedawane w walucie twojego konta płatności."

  - type: cta
    id: start
    title: Wypróbuj na swoim następnym wydarzeniu
    text: Utwórz wydarzenie, podłącz konto płatności, udostępnij link.
    primary: { label: Zacznij sprzedaż, href: /start }
    secondary: { label: Zobacz cennik, href: /pricing }
    note: "Pytania? Wyślij nam, ile płacisz w Ticket Tailor, a porównamy to z twoimi kosztami tutaj."
