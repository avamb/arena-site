title: "Kupiłem bilet: gdzie jest i co pokazać przy wejściu"
description: "Twój bilet to PDF w e-mailu z potwierdzeniem z kodem EAN-13 i QR; pokaż go na telefonie lub wydrukowany. Zwroty i zmiany terminów: zapytaj organizatora."
h1: Pomoc dla kupujących bilety
lead: Twój bilet to PDF w załączniku do e-maila z potwierdzeniem, z kodem kreskowym i kodem QR. Pokaż go na telefonie lub wydrukowany. Pytania o zwroty i terminy kieruj do organizatora wydarzenia, którego kontakt jest na stronie sprzedaży i w e-mailu.
