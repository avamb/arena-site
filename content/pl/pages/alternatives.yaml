  - type: prose
    id: how
    title: Jak porównujemy
    body: |
      **Tylko opublikowane ceny.** Wiersz trafia do tabeli tylko wtedy, gdy mogliśmy go przeczytać na własnej stronie z cennikiem lub w centrum pomocy innej platformy. Link do źródła i data są pod każdą tabelą.

      **Porównanie jak z jak.** Niektóre platformy wliczają opłatę kartową do swojej prowizji; my nie, bo kupujący płaci na twoje własne konto płatności, a twój operator pobiera własną opłatę kartową. Każda strona mówi, jak jest.

      **Czego nie robimy.** ArenaSoldOut.com nie ma rynku, na którym kupujący przeglądają wydarzenia, ani płatności bezgotówkowych przy barze. Pełna lista jest na [stronie z faktami](/facts).

      Znalazłeś cenę, która się zmieniła? [Napisz do nas](/contact), a poprawimy stronę.

  - type: cta
    id: start
    title: Wypróbuj na swoim następnym wydarzeniu
    text: Utwórz wydarzenie, podłącz konto płatności, udostępnij link.
    primary: { label: Zacznij sprzedaż, href: /start }
    secondary: { label: Zobacz cennik, href: /pricing }
    note: "Pytania? Napisz do nas: zespół odpowiada w ciągu jednego dnia roboczego."
