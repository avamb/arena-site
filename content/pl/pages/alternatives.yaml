      - title: Eventbrite
        text: "Procent od każdego biletu plus stała kwota, wobec naszych stałych {usdPrice}. Wypłata po wydarzeniu, wobec pieniędzy na twoim koncie z każdym zamówieniem."
        link: { label: ArenaSoldOut.com i Eventbrite, href: /eventbrite-alternative }
