lead: Płacisz ArenaSoldOut.com prowizję platformy za każdy sprzedany bilet. Płatność za sprzedane bilety po wydarzeniu albo kredyty z góry, dzięki którym płacisz mniej za bilet. Obsługę kart (acquiring) płacisz własnemu operatorowi płatności na jego warunkach.
