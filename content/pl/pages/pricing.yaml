  - type: cards
    id: services
    eyebrow: Usługi dodatkowe
    title: Co jeszcze mogę zamówić?
    lead: "Poza prowizją za bilet. Każdą usługę zamawia się osobno."
    items:
      - title: Event manager
        text: "Nie masz czasu, by samemu ustawiać wydarzenia? Osoba z naszego zespołu pracuje jako część twojego: tworzy wydarzenia i sesje, sprawdza ceny, kategorie i plan sali przed sprzedażą, przygotowuje potrzebne raporty, wysyła zaproszenia i ponownie wysyła bilety. Płatne osobno; warunki ustalamy z każdym organizatorem."
        link: { label: Napisz do nas, href: /contact }
      - title: White label
        text: "Sprzedawaj bez linii Tickets: ArenaSoldOut.com: €45 miesięcznie za markę lub obiekt w krajach UE, US$45 we wszystkich pozostałych krajach."
        link: { label: Warunki, href: /pricing/terms }
      - title: Rysowanie planu sali
        text: "Za darmo. Wyślij PDF, zdjęcie odręcznego szkicu lub tabelę rzędów i miejsc, a narysujemy plan, zwykle w ciągu doby."
        link: { label: Plany sali, href: /product/seating }
  - type: faq
    id: questions
    eyebrow: Pytania o pieniądze
    title: Ile dokładnie kosztuje mnie bilet?
    items:
      - q: Ile kosztuje bilet z miejscem?
        a: "Przy płatności po wydarzeniu: US$1,18 poza UE, €1,05 w UE. Bilet bez miejsca to US$0,62 lub €0,55. Sam plan sali nic nie kosztuje: rysujemy go za darmo z PDF-a, zdjęcia odręcznego szkicu lub tabeli z rzędami i miejscami. Przy kredytach prowizja jest niższa, a miejsce dodaje US$0,35 (€0,31) do stawki kredytowej."
      - q: Jak działają kredyty?
        a: "Pakiet kredytów kupujesz raz. Każdy sprzedany bilet pobiera swoją prowizję z twoich kredytów według stawki pakietu, aż się skończą. Kredyty nigdy nie wygasają, można je doładować w każdej chwili i są wydawane tylko na nasze usługi: nie można ich wypłacić ani przenieść."
      - q: Co, jeśli kredyty skończą się w trakcie sprzedaży?
        a: Sprzedaż się nie zatrzymuje. Bilety, których twoje kredyty nie pokryły, trafiają na zwykłą fakturę po cenie płatności po wydarzeniu.
      - q: Czy jest automatyczne doładowanie?
        a: Tak. Możesz je włączyć, a gdy twoje kredyty spadną poniżej ustalonego progu, kolejny pakiet zostanie kupiony za ciebie.
      - q: Dokąd trafiają pieniądze kupującego?
        a: "Na twoje własne konto płatności, z każdym zamówieniem. ArenaSoldOut.com nigdy nie przechowuje środków. Kupujący płaci cenę biletu i, jeśli ją dodasz, twoją opłatę serwisową."
      - q: Kiedy płacę ArenaSoldOut.com?
        a: "Po wydarzeniu, przelewem bankowym, za sprzedane bilety. Przy wydarzeniach w sprzedaży przez kilka miesięcy i przy stałych obiektach raz w miesiącu. Kredyty płaci się przy zakupie."
      - q: A co z obsługą kart (acquiring)?
        a: Obsługa kart to umowa między tobą a twoim operatorem płatności, na warunkach operatora. Nie wchodzi w skład naszej prowizji i niczego do niej nie dodajemy.
      - q: Czy muszę wspominać ArenaSoldOut.com na swojej stronie?
        a: "Ceny zakładają, że strona wydarzenia wymienia ArenaSoldOut.com jako operatora sprzedaży biletów, z linkiem do nas; widget biletowy pokazuje tę linię domyślnie. Aby sprzedawać bez naszej nazwy, white label kosztuje €45 miesięcznie za markę lub obiekt w krajach UE i US$45 miesięcznie za markę lub obiekt we wszystkich pozostałych krajach, naliczane dniami za niepełny miesiąc. [Szczegółowe warunki](/pricing/terms) wyjaśniają, czym jest marka i co white label ukrywa."
      - q: Czy jest zniżka dla organizacji charytatywnych?
        a: "Tak. Zarejestrowane organizacje charytatywne płacą 50% naszej prowizji, przy płatności za sprzedane bilety i z kredytami. Napisz do nas ze [strony kontaktowej](/contact), a włączymy to dla twojej organizacji."
      - q: Czy zaproszenia są darmowe?
        a: Tak. Zaproszenia i darmowe bilety na płatne wydarzenia nie podlegają prowizji.
      - q: Co dzieje się z prowizją, gdy bilet jest zwracany lub termin się przesuwa?
        a: "Zwrot kupujący otrzymuje od ciebie. Prowizja za sprzedaż, która już się odbyła, zostaje, a za obsługę zwrotu, przeniesienie terminu ani e-maile do kupujących nie pobieramy osobnej prowizji. Własne warunki operatora płatności to sprawa operatora."
      - q: Co, jeśli odwołam wydarzenie?
        a: "Pobrana już prowizja nie jest zwracana w pieniądzach. Napisz do nas o swojej sprawie, zanim wydarzenie zostanie odwołane."
      - q: Jeden z moich biletów kosztuje więcej niż US$10 (€10 w UE), reszta jest tania. Jaka cena obowiązuje?
        a: "Standardowa, dla wszystkich biletów wydarzenia: niższa stawka wymaga, aby każdy bilet każdej kategorii i progu cenowego kosztował US$10 lub mniej (€10 w UE). Bilet za US$5 obok biletu za US$25 jest rozliczany po cenie standardowej."
      - q: Mam obiekt i organizuję wiele wydarzeń w miesiącu. Czy jest inna oferta?
        a: "Tak. Właściciele stałych obiektów (teatrów, klubów, stadionów, cyrków i innych miejsc, które same organizują wydarzenia, przez cały rok lub sezonowo) płacą {percent}% ceny biletu, liczone po kodach promocyjnych i bez twojej opłaty serwisowej. Prowizja za bilet jest ograniczona do US$1,18 (€1,09 w UE), tak samo z miejscem i bez. Zaproszenia nie podlegają prowizji. Faktury wystawiamy co miesiąc. Status obiektu włącza nasz zespół: napisz do nas ze [strony kontaktowej](/contact). Pełne warunki są w [szczegółowych warunkach](/pricing/terms)."

