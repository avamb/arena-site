title: "Cennik: za bilet, bez abonamentu"
description: "Prowizja za sprzedany bilet, bez abonamentu. Płać po wydarzeniu lub kup kredyty z góry taniej. Niższe stawki dla obiektów i tanich wydarzeń. Zaproszenia gratis."
