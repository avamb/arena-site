sections:
  - type: compare
    id: prices
    eyebrow: Ceny w euro
    title: Jak wypadają obie oferty?
    lead: "Ceny obu platform z 11 listopada 2026. Nasza prowizja za sprzedany bilet obok prowizji Weezevent za sprzedaż online. Prowizja Weezevent zawiera opłaty bankowe; u nas opłatę kartową pobiera twój własny operator płatności, według twojej stawki, oprócz naszej prowizji."
    cols: { what: "", us: ArenaSoldOut.com, them: Weezevent }
    rows:
      - { what: "Jak liczona jest opłata", us: "Stała opłata za bilet", them: "2,5% ceny biletu, co najmniej €0,99" }
      - { what: "Bilet za €20", us: "**{eurPrice}** + opłata kartowa twojego operatora", them: "€0,99, opłaty bankowe wliczone" }
      - { what: "Bilet za €50", us: "**{eurPrice}** + opłata kartowa twojego operatora", them: "€1,25, opłaty bankowe wliczone" }
      - { what: "Bilet za €100", us: "**{eurPrice}** + opłata kartowa twojego operatora", them: "€2,50, opłaty bankowe wliczone" }
      - { what: "Kiedy dostajesz pieniądze", us: "Z każdym zamówieniem, na twoje konto", them: "Co 15 dni, wypłata od Weezevent" }
      - { what: "Kto trzyma pieniądze kupującego", us: "Ty, od pierwszego zamówienia", them: "Weezevent, do wypłaty" }
      - { what: "Miejsca numerowane", us: "**{eurSeated}** za bilet z miejscem, plan rysowany za ciebie za darmo", them: "Tylko oferta szyta na miarę, cena na zapytanie" }
      - { what: "Kredyty płatne z góry", us: "Od **{eurFrom}** za bilet, nigdy nie wygasają", them: "Brak w ich cenniku" }
