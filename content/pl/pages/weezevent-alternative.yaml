    note: "Ceny Weezevent: [weezevent.com/fr/nos-tarifs](https://weezevent.com/fr/nos-tarifs/) i [weezevent.com/en-gb/our-prices](https://weezevent.com/en-gb/our-prices/), sprawdzone 11 listopada 2026, z VAT, tak jak opublikowano. Nasze ceny: [cennik](/pricing) i [szczegółowe warunki](/pricing/terms), bez VAT. Weezevent jest znakiem towarowym swojego właściciela; ArenaSoldOut.com nie jest z nim powiązane."

  - type: prose
    id: examples
    title: Co ta różnica oznacza w praktyce?
    body: |
      Wszystkie kwoty według cen obu platform z 11 listopada 2026.

      **Gotówka przed wydarzeniem.** Festiwal sprzedaje 2000 biletów w trzy tygodnie przed otwarciem bram. W ArenaSoldOut.com każda płatność trafia na twoje konto w chwili opłacenia zamówienia, więc scenę, nagłośnienie i ochronę opłacasz z pieniędzy za bilety. Przy wypłacie co 15 dni część tych pieniędzy przychodzi po tym, jak była potrzebna.

      **Teatr z miejscami numerowanymi.** U nas plan sali jest częścią każdego wydarzenia: wysyłasz PDF lub zdjęcie odręcznego szkicu, zespół buduje plan za darmo, a bilet z miejscem kosztuje {eurSeated}. W Weezevent miejsca numerowane są w ofercie szytej na miarę, z ceną na zapytanie.

      **Sama prowizja.** Nasza to {eurPrice} za bilet, niezależnie od jego ceny; w Weezevent to 2,5% z minimum €0,99, z opłatami bankowymi. Dolicz opłatę kartową swojego operatora płatności do naszej, aby porównać sumy dla twojej ceny biletu.

  - type: cards
    id: more
    eyebrow: Poza ceną
    title: Co jeszcze dostajesz z ArenaSoldOut.com?
    items:
      - title: Pieniądze prosto na twoje konto
        text: "Kupujący płacą na twoje własne konto Stripe, Flitt lub AllPay. ArenaSoldOut.com nigdy nie przechowuje środków i niczego nie potrąca z twojej sprzedaży."
        link: { label: Płatności, href: /payments }
      - title: Plany sali rysowane za ciebie, za darmo
        text: "Wyślij PDF, zdjęcie odręcznego szkicu lub tabelę z rzędami i miejscami. Zespół buduje obiekt; sam nigdy go nie rysujesz."
        link: { label: Plany sali, href: /product/seating }
      - title: Niższa stawka dla tanich biletów
        text: "Gdy każdy bilet wydarzenia kosztuje {eurLowMax} lub mniej: {lowPercent}% ceny biletu zamiast stałej opłaty. Dyskoteki, biegi, urodziny dla dzieci, wycieczki."
        link: { label: Jak to działa, href: /pricing#low-price }
      - title: Kupujący w swoim języku
        text: "Strona kupującego, e-maile i bilety w języku kupującego, także hebrajski od prawej do lewej. Każdy nowy język dodajemy w ciągu 40 godzin."
        link: { label: E-bilety, href: /product/tickets }
      - title: Każda sprzedaż w twoim Telegramie
        text: "Utwórz wydarzenie ze zdjęcia plakatu w bocie na Telegramie i zobacz każdą sprzedaż i zwrot w swojej grupie w kilka sekund."
        link: { label: Bot w Telegramie, href: /product/telegram }
      - title: Skonfiguruj sam albo zleć nam
        text: "Wydarzenia, ceny i kategorie tworzysz sam w Event Center lub w bocie na Telegramie, w kilka minut; plany sali rysujemy za darmo. Nie masz czasu? Nasz event manager zrobi to za ciebie, jako usługa płatna."
        link: { label: Usługi dodatkowe, href: /pricing#services }

  - type: faq
    id: questions
    title: Pytania organizatorów, którzy porównują
    items:
      - q: Czy ArenaSoldOut.com jest tańsze niż Weezevent?
        a: "Nasza prowizja jest niższa: {eurPrice} za bilet wobec co najmniej €0,99 w Weezevent. Prowizja Weezevent zawiera opłaty bankowe, a nasza nie, więc dolicz opłatę kartową swojego operatora płatności do naszej, aby porównać sumy dla twojej ceny biletu."
      - q: Kiedy dostaję pieniądze z biletów?
        a: "Z każdym zamówieniem. Kupujący płaci na twoje własne konto płatności: Stripe, Flitt lub AllPay. ArenaSoldOut.com nigdy nie przechowuje środków. Nasza prowizja jest fakturowana po wydarzeniu albo pobierana z twoich kredytów."
      - q: Czy oferujecie płatności bezgotówkowe i opaski RFID?
        a: "Nie. ArenaSoldOut.com sprzedaje bilety i sprawdza je przy wejściu w aplikacji skanera MACS. Jeśli potrzebujesz płatności bezgotówkowych przy barze, zostaw do tego osobnego dostawcę."
      - q: Czy mogę przenieść swoje wydarzenia z Weezevent?
        a: "Tak. Wydarzenia tworzysz w Event Center lub w bocie na Telegramie, plany sali rysujemy za darmo, a ty sprzedajesz dalej na Weezevent, dopóki twoja strona u nas nie będzie gotowa. Nie masz czasu, by to skonfigurować? Nasz [event manager](/pricing#services) zrobi to za ciebie, jako usługa płatna."
      - q: Czy płacę abonament?
        a: "Nie. Płacisz tylko za sprzedane bilety. Zaproszenia i darmowe bilety na płatne wydarzenia nie podlegają prowizji."

  - type: cta
    id: start
    title: Wypróbuj na swoim następnym wydarzeniu
    text: Utwórz wydarzenie, podłącz konto płatności, udostępnij link.
    primary: { label: Zacznij sprzedaż, href: /start }
    secondary: { label: Zobacz cennik, href: /pricing }
    note: "Pytania? Wyślij nam, ile płacisz w Weezevent, a porównamy to z twoimi kosztami tutaj."
