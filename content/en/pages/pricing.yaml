# Pricing page. Numbers come from content/data/pricing/*.yaml and tariff.yaml, never from here.
# Source: pricing policy rev. 3 (18.10.2026) and the owner's decision of 19.10 to publish approved terms only.
title: "Pricing: per ticket, no subscription"
description: "Platform commission per ticket sold: US$0.59 without a seat and US$1.09 with a seat (the same numbers in euro for EU countries), less with prepaid packages. 4% for events where every ticket costs US$10 or less, 2% for permanent venues. Invitations are free."
h1: Per ticket. No subscription.
lead: You pay ArenaSoldOut.com a platform commission per ticket sold. Pay after the event, or prepay a package and pay less per ticket. Card acquiring is paid to your own payment provider on its terms.
sections:
  - type: pricing
    id: plans
    planBullets:
      - "**{seated}** per ticket with a seat chosen on the venue plan"
      - "**Free** invitations and free tickets to paid events: no commission"
      - "**Prepaid packages** lower the commission per ticket, see below"
    cta: { label: Start selling, href: /start }
    currencyNote: "Commission in **US dollars** for every country outside the EU, including European countries outside the EU, Asia and the Middle East, and in **euro** for venues in EU countries. The numbers are the same in both currencies. This is our commission only: tickets are sold in the currency of your payment account. Amounts are without VAT."
    packages:
      title: Prepay a package, pay less per ticket
      text: "You buy a package once; every ticket sold takes its commission from it, at the rate of that package. The prepayment never expires and is spent only on our services. If it runs out in the middle of sales, sales go on: the remaining tickets are invoiced at the pay-after-the-event price."
      cols: { name: Package, prepay: Prepayment, plain: "Commission, no seat", seated: "Commission, with a seat", plainCount: "Tickets without a seat", seatedCount: "Or tickets with a seat", saving: "Saving vs. pay-after" }
      note: "Packages can be bought as often as you like; a ticket takes its commission from the package it is paid from. You can switch on an automatic top-up. For volumes above 5,000 tickets a year: individual terms, write to us."
    lowPrice:
      title: "Events where every ticket costs {lowMax} or less"
      text: "{lowPercent}% of the ticket price, at least {lowMin} and at most {lowCap} per ticket; {lowSeat} more for a ticket with a seat. For discos, runs, marathons, children's parties, excursions. It applies to the whole event, and only if **no ticket of any category or price step**, including later ones, costs more than {lowMax} before promo codes. One ticket above that and the standard price applies to all tickets of the event, the cheap ones too."
      example: "Commission per ticket, pay after the event:"
      cols: { price: Ticket price, plain: Commission, seated: With a seat }
    venues:
      title: Permanent venues
      text: "Theatres, clubs, stadiums, circuses and other places that hold events themselves, all year or by season: **{percent}% of the ticket price** (after promo codes, without the service fee), at most **{cap}** per ticket, the same with and without a seat. Invoiced monthly. No commission on invitations. Our team connects the venue status."
      example: "A {ex25} ticket costs {ex} in commission; the cap of {cap} is reached at a ticket price of {capAt}."
      cta: { label: Talk to us, href: /contact }
    calculator:
      aria: Commission calculator
      region: Venue country
      regionEu: EU (EUR)
      regionWorld: Other countries (USD)
      price: Ticket price of this category
      maxPrice: Highest price of any ticket in the event
      quantity: Tickets of this category
      seating: Seat chosen on the plan
      result: Commission, paid after the event
      button: Find out the price
      hint: "The result updates as you type. The commission depends on the number of tickets and on seats, not on the ticket price, except for events where every ticket costs US$10 or less. This is the price when you pay after the event; the prepaid package option is shown below it."
      sales: your sales {net}, acquiring not included
      needMax: Enter the highest ticket price of the event to see the commission.
      maxBelowPrice: The highest price in the event cannot be lower than the price of this ticket.
      lowRate: "Every ticket costs {max} or less, so {percent}% applies, at least {min} and at most {cap} per ticket."
      package: "Prepaid package {name} ({prepay}) covers it: {cost} for these tickets, {left} stays on your balance for the next events."
      noPackage: "More tickets than the biggest package covers: write to us for volume terms."
    note: "You pay after the event by bank transfer. For events on sale for several months and for permanent venues we invoice monthly. Paying after the event is open to organizations confirmed on the platform. Volume and individual terms on request."
    terms: { label: Detailed terms →, href: /pricing/terms }

  - type: faq
    id: questions
    eyebrow: Questions about money
    title: What does a ticket cost me, exactly?
    items:
      - q: How much is a ticket with a seat?
        a: "Paying after the event: US$1.09 outside the EU, €1.09 in the EU. A ticket without a seat is US$0.59 or €0.59. The seating plan itself costs nothing; the team builds it from your PDF, spreadsheet or sketch. With a prepaid package the commission is lower, and a seat adds 0.35 to the package rate."
      - q: How does a prepaid package work?
        a: "You pay the package once. Every sold ticket takes its commission from it at the rate of the package, until it runs out. The prepayment never expires, can be topped up at any time and is spent only on our services: it cannot be withdrawn or transferred."
      - q: What if the prepayment runs out in the middle of sales?
        a: Sales do not stop. The tickets the package did not cover go into the usual invoice at the pay-after-the-event price.
      - q: Is there an automatic top-up?
        a: Yes. You can switch it on, and when the balance falls below your threshold the next package is bought for you.
      - q: Where does the buyer's money go?
        a: "Into your own payment account, with every order. ArenaSoldOut.com never holds funds. The buyer pays the ticket price and, if you add one, your service fee."
      - q: When do I pay ArenaSoldOut.com?
        a: "After the event, by bank transfer, for the tickets sold. For events on sale for several months and for permanent venues, once a month. A prepaid package is paid when you buy it."
      - q: What about card acquiring?
        a: Card acquiring is a contract between you and your payment provider, on the provider's terms. It is not part of our commission and we do not add anything to it.
      - q: Are invitations free?
        a: Yes. Invitations and free tickets to paid events carry no commission.
      - q: What happens to the commission when a ticket is refunded or the date moves?
        a: "The buyer gets the refund from you. The commission for a sale that already happened stays, and we do not charge a separate commission for processing the refund, for moving the date or for the e-mails to buyers. The payment provider's own terms are the provider's."
      - q: What if I cancel the event?
        a: "The commission already charged is not returned in money. Write to us about your case before the event is cancelled."
      - q: One of my tickets costs more than US$10 (€10), the rest are cheap. Which price applies?
        a: "The standard one, to all tickets of the event: the lower rate needs every ticket of every category and price step to cost US$10 or less. A US$5 ticket next to a US$25 ticket is at the standard price."
      - q: I own a venue and run many events a month. Is there a different deal?
        a: "Yes. Owners of permanent venues (theatres, clubs, stadiums, circuses and other places that hold events themselves, all year or by season) pay {percent}% of the ticket price, calculated after promo codes and without your service fee. The commission per ticket is capped at the price of a ticket with a seat (US$1.09, or €1.09 in the EU), the same with and without a seat. Invitations carry no commission. We invoice monthly. Our team connects the venue status: write to us from the [contact page](/contact). Full conditions are in the [detailed terms](/pricing/terms)."

  - type: cta
    id: start
    title: Start selling today
    text: Create the event, connect your payment account, share the link. An event without a seating plan is on sale within the hour; a seating plan we draw with you.
    primary: { label: Create your event, href: /start#create }
    secondary: { label: Open the Telegram bot, href: https://t.me/EventsCentrBot }
    note: "Or write to us: we set everything up with you on a call."
