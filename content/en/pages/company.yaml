sections:
  - type: prose
    id: story
    eyebrow: Company
    title: What is ArenaSoldOut.com?
    body: |
      ArenaSoldOut.com is a ticketing platform for organizers: reserved seating and general admission in one event, the organizer's own payment account, a sales page we host or a widget on the organizer's site, an Event Center in the browser and in Telegram. Buyers pay the organizer directly; the platform never holds the money.

      The company is ABH TEAM OÜ, registered in the European Union. The founders' earlier platforms served Cirque du Soleil shows, FIFA 2018 stadiums, the World Choir Games and 800 ice shows; ArenaSoldOut.com has sold tickets for organizers since 2019 and was rebuilt from the ground up in 2026.

      The team answers organizers in English, Spanish, Czech, Russian and Hebrew. Most requests from organizers ship within weeks; every one that reached production is listed on the [changes page](/changes) with its date, and the [facts page](/facts) says what exists, what does not and since when.
