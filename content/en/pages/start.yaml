# /start: the application form (wave 1: Hono handler → n8n webhook; later the platform's onboarding API, doc 34).
title: "Start selling: tell us about your event"
description: "Send your organization, country and contact. The team sets up your organization, your sales page and your payment account, usually within a day."
h1: Start selling
lead: "Tell us who you are and where you sell. We set up your organization, your sales page and connect your payment account, usually within a day. Events without a seating plan go on sale today."
sections:
  - type: steps
    id: how
    eyebrow: What happens next
    title: How do we start?
    items:
      - title: You send the form
        text: Organization, country, the payment provider you already use if any, and how to reach you. One minute.
      - title: We set you up
        text: The team creates your organization and your sales page, connects your payment account with you and, if you have a seated venue, builds the seating plan from your PDF, spreadsheet or sketch.
      - title: You go on sale
        text: Share one link, or put the widget on your site. Every sale lands in your event center and in your Telegram group.
  - type: form
    id: form
    eyebrow: Application
    title: Tell us about yourself
    fields:
      organization: Organization or event name
      country: Country where you sell
      countryOther: Another country
      provider: Payment provider you already use
      providerNone: None yet
      providerOther: Another provider
      name: Your name
      email: E-mail
      phone: Phone or WhatsApp, with country code
      message: What are you going to sell?
      messageHint: "Optional: the event, the venue, dates, how many tickets. A link to a poster helps."
    submit: Send
    sending: Sending
    errors:
      required: This field is required
      email: Check the e-mail address
      phone: "Check the number: country code and digits, like +420 777 123 456"
      server: Could not send right now. Write to us in Telegram instead, or try again in a minute.
      turnstile: The anti-spam check did not pass. Reload the page and try again.
    consent: "By sending the form you agree that the team contacts you about your event. We store the application only to set you up and never pass it on. [Detailed terms](/pricing/terms)."
    alt:
      text: "Prefer Telegram? The bot creates your event from a poster photo and the same team answers there."
      link: { label: Open the Telegram bot, href: https://t.me/EventsCentrBot }
