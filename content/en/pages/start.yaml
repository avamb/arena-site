# /start: the application form. Client script src/scripts/onboarding.ts draws it from the platform's
# GET /v1/onboarding/form-schema (fields, lists and labels are not in this file) and posts to the
# platform API directly (doc 34 §9). Only the form's own UI strings live here.
title: "Start selling: apply as an organizer"
description: "Tell us about your organization and events. The team sets up your organization, sales page and payment account, usually within a day."
h1: Start selling
lead: "Tell us who you are and where you sell. We set up your organization, your sales page and connect your payment account, usually within a day. Events without a seating plan go on sale today."
sections:
  - type: steps
    id: how
    eyebrow: What happens next
    title: How do we start?
    items:
      - title: You send the application
        text: "Five short steps: contact, organization, events, payments and consent. Your answers are saved as you go, so you can leave and come back."
      - title: We set you up
        text: The team checks the application, creates your organization and your sales page, connects your payment account with you and, if you have a seated venue, builds the seating plan from your PDF, spreadsheet or sketch.
      - title: You go on sale
        text: Share one link, or put the widget on your site. Every sale lands in your Event Center and in your Telegram group.
  - type: onboarding
    id: form
    mode: apply
    eyebrow: Application
    title: Tell us about yourself
    ui:
      noscript: "The application form needs JavaScript. Write to us in Telegram instead and we will set you up by hand."
      optional: "(optional)"
      url_list_hint: "One link per line"
      sending: "Sending…"
      email: "E-mail"
      err_required: "This field is required"
      err_invalid: "Check this value"
      err_too_long: "This is too long"
      err_not_allowed: "We do not accept applications from this country yet"
      e_generic: "Something went wrong. Try again in a minute, or write to us in Telegram."
      e_network: "No connection to the server. Check your internet and try again."
      e_unavailable: "The form is not available right now. Try again in a minute, or write to us in Telegram."
      e_session: "Your draft is no longer available. Start again, it takes a minute."
      e_incomplete: "Some required answers are missing. They are marked above."
      e_email_not_confirmed: "Confirm your e-mail first: open the link in the message we sent you, then press Send again."
      e_rate_limited: "Too many attempts. Wait a few minutes and try again."
      e_turnstile_failed: "The anti-spam check did not pass. Wait a second for it to finish and try again."
      e_captcha_not_configured: "The form is not available right now. Write to us in Telegram."
      e_captcha_unavailable: "Could not run the anti-spam check. Try again in a minute."
      e_locked: "This application is already sent and can no longer be edited."
      step_of: "Step {n} of {total}"
      start_button: "Continue"
      start_note: "We send a link to confirm your e-mail. You can keep filling the form while it travels."
      have_draft: "Continue an earlier draft"
      back: "Back"
      next: "Next"
      submit: "Send application"
      email_sent: "We sent a confirmation link to {email}. Open it when you can: the form is already saved, and the e-mail must be confirmed before you send it."
      info_requested: "The team asked for more details:"
      legal_lead: "By sending the application you accept"
      terms: "the terms"
      privacy: "the privacy policy"
    alt:
      text: "Prefer Telegram? The bot takes the same application in a chat and the same team answers there."
      link: { label: Open the Telegram bot, href: https://t.me/EventsCentrBot }
