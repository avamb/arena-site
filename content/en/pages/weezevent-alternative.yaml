        text: "You create events, prices and categories yourself in the Event Center or the Telegram bot, in minutes; we draw seating plans for free. No time? Our event manager does it for you, as a paid service."
        link: { label: Extra services, href: /pricing#services }

  - type: faq
    id: questions
    title: Questions organizers ask when they compare
    items:
      - q: Is ArenaSoldOut.com cheaper than Weezevent?
        a: "Our commission is lower: {eurPrice} per ticket against at least €0.99 on Weezevent. Weezevent's commission includes bank fees and ours does not, so add your payment provider's card fee to ours to compare the totals for your ticket price."
      - q: When do I get the ticket money?
        a: "With every order. The buyer pays into your own payment account: Stripe, Flitt or AllPay. ArenaSoldOut.com never holds funds. Our commission is invoiced after the event or taken from your credits."
      - q: Do you offer cashless payments and RFID wristbands?
        a: "No. ArenaSoldOut.com sells tickets and checks them at the door with the MACS scanner app. If you need cashless payments at the bar, keep a separate provider for that."
      - q: Can I move my events from Weezevent?
        a: "Yes. You create your events in the Event Center or the Telegram bot, we draw your seating plans for free, and you keep selling on Weezevent until your page with us is ready. No time to set it up yourself? Our [event manager](/pricing#services) does it for you, as a paid service."
      - q: Do I pay a subscription?
        a: "No. You pay only for tickets sold. Invitations and free tickets to paid events carry no commission."

