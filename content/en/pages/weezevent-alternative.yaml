  - type: prose
    id: examples
    title: What does the difference mean in practice?
    body: |
      All figures at the prices of both platforms as of 11 November 2026.

      **Cash before the event.** A festival sells 2,000 tickets in the three weeks before the gates open. With ArenaSoldOut.com every payment lands in your own account the moment the order is paid, so you pay the stage, the sound and the security from ticket money. With a payout every 15 days, part of that money arrives after you needed it.

      **A theatre with numbered seats.** With us the seating plan is part of every event: you send a PDF or a photo of a hand sketch, the team builds the plan for free, and a seated ticket costs {eurSeated}. On Weezevent numbered seating is in the tailor-made offer, priced on request.

      **The commission itself.** Ours is {eurPrice} per ticket whatever the ticket costs; Weezevent's is 2.5% with a €0.99 minimum, bank fees included. Add your payment provider's card fee to ours to compare the totals for your ticket price.

