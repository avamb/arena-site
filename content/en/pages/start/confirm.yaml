# /start/confirm?token=...: opened from the e-mail. Confirms the address, stores the new access token
# and sends the applicant back to the form.
title: "Confirm your e-mail"
description: "Confirming your e-mail address for the organizer application."
h1: Confirm your e-mail
lead: One moment, we are checking the link.
