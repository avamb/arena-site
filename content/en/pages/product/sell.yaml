# Product: where you sell. Facts from BRIEF.md (verified capabilities). H2s are organizers' questions.
title: "Sell tickets on your own site or on a page we host"
description: "Embed the Arena ticket widget on any site with three lines, use the WordPress plugin, or share a hosted sales page. Buyers pay into your own payment account either way."
h1: Your site, or ours. The money goes to you either way.
lead: Two ways to sell, one event center behind them. Embed the widget on the site you already have, or share a hosted page we create in minutes. Every order lands in your own payment account.
related:
  - { label: Seating plans that match the venue, href: /product/seating, text: "Send a PDF, a spreadsheet or a sketch; the team builds the plan in." }
  - { label: Payments into your own account, href: /payments, text: "Providers by country, statuses, how to connect." }
  - { label: WordPress sites, href: /solutions/wordpress, text: "Plugin with WooCommerce orders, two clients moved from Bil24 without downtime." }
sections:
  - type: ways
    id: ways
    eyebrow: Where you sell
    title: Which way fits my event?
    items:
      - title: You have a site
        text: "Your site is the checkout. Embed the ticket widget on any page: WordPress, Tilda, Wix, Webflow or custom code. Buyers never leave your domain."
        bullets:
          - Widget on any site, three lines of code
          - WordPress plugin with WooCommerce orders
          - Your colours, your fonts, your language
      - title: You do not have a site
        text: "We host the sales page: tickets.arenasoldout.com/your-name/your-event. Share one link in social media, messengers and on the poster."
        bullets:
          - A page per organizer and per event
          - A separate page for each promoter
          - Ready in minutes, no design work
          - Links to your partner sellers on the same page
  - type: faq
    id: questions
    eyebrow: Questions
    title: What does the widget do on my site?
    items:
      - q: How do I put the widget on my site?
        a: "Two lines of HTML: a script tag and the <arena-tickets> element with your feed token. The widget shows sessions, the seating plan or categories, the cart and the checkout. Details and the code are on the [developers page](/developers)."
      - q: Does it look like my site?
        a: Yes. The widget reads four CSS variables from your page (accent colour, radius, background, border) and follows the buyer's language. No iframe, no second design.
      - q: Where does the buyer pay?
        a: "In the hosted checkout of your own payment provider, into your own account. Arena creates the order, holds the seats and issues the ticket; it never holds the money. See [payments](/payments)."
      - q: Can I sell through partners too?
        a: Yes. Each promoter gets a page with its own link, and the hosted page can list your partner sellers. Sales from every channel appear in one event center.
      - q: What if I move my site to another platform?
        a: Nothing changes for buyers. The widget is a web component; it moves with your pages, and the hosted page keeps working as a fallback.
  - type: cta
    id: start
    title: Start selling today
    text: Create the event, connect your payment account, share the link. An event without a seating plan is on sale within the hour; a seating plan we draw with you.
    primary: { label: Create your event, href: /start#create }
    secondary: { label: Open the Telegram bot, href: https://t.me/EventsCentrBot }
    note: "Or write to us: we set everything up with you on a call."
