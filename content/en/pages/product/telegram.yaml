title: "The organizer bot in Telegram: event from a poster"
description: "Create an event from a poster photo, confirm what the bot read, add dates and team. Every sale and refund is posted to your Telegram group within seconds."
h1: Run the event from Telegram
lead: The Event Center lives in the bot too. A photo of the poster is enough to start; every reading is a button to confirm, nothing is published without you.
related:
  - { label: Event Center in the browser, href: /#center }
  - { label: Sell on your site or ours, href: /product/sell }
  - { label: Start selling, href: /start }
sections:
  - type: steps
    id: how
    eyebrow: How it works
    title: What does the bot do?
    items:
      - title: Reads the poster
        text: Send a photo. The bot reads the name, dates, venue and prices and shows every value as a button to confirm or edit.
      - title: Builds the event
        text: Sessions, categories, prices and the poster go into the event. Add team members, get a sample ticket with a watermark, publish when ready.
      - title: Reports every sale
        text: Each sale and refund is posted to your organizer group within seconds, with the buyer's name, seats, amount and contact.
  - type: faq
    id: questions
    eyebrow: Questions
    title: Is Telegram the only way?
    items:
      - q: Do I need Telegram to use ArenaSoldOut.com?
        a: "No. The same Event Center works in the browser on ArenaSoldOut.com, and the team can set everything up for you. Telegram is one way, for organizers who live in the messenger."
      - q: Which languages does the bot speak?
        a: English, Russian and Spanish today; more follow the site languages.
      - q: Can my team use it?
        a: Yes. Add team members with roles; the sales group can include everyone who needs to see orders.
      - q: Does it work with the seating plan?
        a: The bot creates events with categories and dates; a seating plan is built in by the team and attached to the event.
  - type: cta
    id: start
    title: Open the bot
    text: Send a poster or just say hello. The team answers in the same chat.
    primary: { label: Open the Telegram bot, href: https://t.me/EventsCentrBot }
    secondary: { label: Start on the site instead, href: /start }
    note: Events without a seating plan go on sale today.
