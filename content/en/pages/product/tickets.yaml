title: "E-tickets with EAN-13 and QR, scanning, buyer e-mails"
description: "PDF tickets with EAN-13 and QR in the buyer's language, the MACS scanner app for iOS and Android, sample tickets, e-mails when a session moves or is cancelled."
h1: A ticket that scans
lead: Every ticket is a PDF with an EAN-13 barcode and a QR code, in the buyer's language. Scan it with the app or a handheld scanner, resend it, refund it, replace it when a date moves.
related:
  - { label: Seating plans, href: /product/seating }
  - { label: "Reliability: load, backups, watchdog", href: /product/reliability }
  - { label: Help for ticket buyers, href: /help/tickets }
  - { label: "MACS scanner app: any organizer, any entrance", href: /product/scanner }
sections:
  - type: faq
    id: questions
    eyebrow: Tickets
    title: What does the buyer get?
    items:
      - q: What is on the ticket?
        a: "Event, session, seat or category, price, the buyer's name, an EAN-13 barcode and a QR code. One PDF per order, in the buyer's language: English, Russian, Czech, Hebrew or Spanish on the page, seven languages in e-mails. We add any new language within 40 hours."
      - q: Is the payment receipt in the e-mail?
        a: "Yes. The payment receipt comes attached to the ticket e-mail, and the e-mail names who received the payment: your organization and your payment provider."
      - q: Can I check that the buyer got the ticket?
        a: "Yes. Every e-mail shows its status in the order card: Sent, Delivered, Read. You always see whether the buyer received the ticket, and you can send it again if they lost it."
      - q: How do I scan at the door?
        a: "With the [MACS scanner app](#scanner) for iOS and Android, or a handheld barcode scanner. The app also accepts tickets sold by your partners in other systems, so one door works for every channel."
      - q: Can I see a ticket before sales start?
        a: Yes. A sample ticket with a watermark comes with the event, from the Event Center or the Telegram bot.
      - q: What happens when a date moves?
        a: Buyers get an e-mail in their language with the updated ticket attached. The same for a cancellation, with the refund handled by you.
      - q: Can I resend or refund a ticket?
        a: Yes, from the Event Center. Resend to a new address, refund to the buyer's card, the seat returns to sale.
      - q: Is there an app for buyers?
        a: No. The PDF and the e-mail are enough at the door; nothing to install.
  - type: cards
    id: scanner
    eyebrow: At the door
    title: Which app scans the tickets?
    lead: "MACS is the ArenaSoldOut.com access control app. Install it on the phones of your door staff, sign in with your Event Center account and scan the EAN-13 or the QR on every ticket: paper, PDF on a screen, or the e-mail. One app scans tickets of any organizer on the platform and partners' tickets from other systems, so a venue, a festival or a promoter who rents a venue uses the same phones for every event."
    items:
      - { title: iPhone and iPad, text: "MACS on the App Store. Sign in with your Event Center account; the event list and the sessions are already there.", link: { label: Open the App Store →, href: "https://apps.apple.com/app/id6770095694" } }
      - { title: Android, text: "MACS on Google Play. The same app, the same account, handheld scanners with a camera or a laser work as well.", link: { label: Open Google Play →, href: "https://play.google.com/store/apps/details?id=com.arenasoldout.macs" } }
      - { title: "Any organizer, one app", text: "Door staff of a venue scan tickets of every organizer who sells through ArenaSoldOut.com, and tickets sold by partners in other systems, without switching apps.", link: { label: "MACS as a product →", href: /product/scanner } }
  - type: cta
    id: start
    title: Start selling today
    text: Create the event, connect your payment account, share the link. The sample ticket is ready with the event.
    primary: { label: Create your event, href: /start#create }
    secondary: { label: Open the Telegram bot, href: https://t.me/EventsCentrBot }
    note: "Or write to us: we set everything up with you on a call."
