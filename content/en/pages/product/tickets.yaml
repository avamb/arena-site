title: "E-tickets with EAN-13 and QR, scanning at the door, buyer e-mails"
description: "PDF tickets with EAN-13 and QR in the buyer's language, scanner app for iOS and Android, sample tickets, e-mails when a session moves or is cancelled."
h1: A ticket that scans
lead: Every ticket is a PDF with an EAN-13 barcode and a QR code, in the buyer's language. Scan it with the app or a handheld scanner, resend it, refund it, replace it when a date moves.
related:
  - { label: Seating plans, href: /product/seating }
  - { label: "Reliability: load, backups, watchdog", href: /product/reliability }
  - { label: Help for ticket buyers, href: /help/tickets }
sections:
  - type: faq
    id: questions
    eyebrow: Tickets
    title: What does the buyer get?
    items:
      - q: What is on the ticket?
        a: "Event, session, seat or category, price, the buyer's name, an EAN-13 barcode and a QR code. One PDF per order, in the buyer's language: English, Russian, Czech, Hebrew or Spanish on the page, seven languages in e-mails."
      - q: How do I scan at the door?
        a: With the scanner app for iOS and Android, or a handheld barcode scanner. The app also accepts tickets sold by your partners in other systems, so one door works for every channel.
      - q: Can I see a ticket before sales start?
        a: Yes. A sample ticket with a watermark comes with the event, from the event center or the Telegram bot.
      - q: What happens when a date moves?
        a: Buyers get an e-mail in their language with the updated ticket attached. The same for a cancellation, with the refund handled by you.
      - q: Can I resend or refund a ticket?
        a: Yes, from the event center. Resend to a new address, refund to the buyer's card, the seat returns to sale.
      - q: Is there an app for buyers?
        a: No. The PDF and the e-mail are enough at the door; nothing to install.
  - type: cta
    id: start
    title: Start selling today
    text: Create the event, connect your payment account, share the link. The sample ticket is ready with the event.
    primary: { label: Create your event, href: /start#create }
    secondary: { label: Open the Telegram bot, href: https://t.me/EventsCentrBot }
    note: "Or write to us: we set everything up with you on a call."
