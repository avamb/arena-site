sections:
  - type: compare
    id: prices
    eyebrow: Price per ticket
    title: How much does a ticket cost on each platform?
    lead: "TicketSource has two options: their own card processing, with the card fee included, or your own Stripe account at a lower rate. With ArenaSoldOut.com you always use your own payment account, so the fair comparison is with the second option."
    cols: { what: "", us: ArenaSoldOut.com, them: TicketSource }
    rows:
      - { what: "How the fee is counted", us: "Flat fee per ticket", them: "Percentage of each paid booking, plus VAT" }
      - { what: "With your own Stripe account", us: "**{usdPrice}** per ticket", them: "4.5% + VAT" }
      - { what: "£20 ticket, own Stripe account", us: "**{usdPrice}**", them: "£1.08 (£0.90 + VAT)" }
      - { what: "£50 ticket, own Stripe account", us: "**{usdPrice}**", them: "£2.70 (£2.25 + VAT)" }
