  - type: prose
    id: examples
    title: What does that mean for one event?
    body: |
      All figures at the prices of both platforms as of 11 November 2026. Our commission is in US dollars; the amounts in pounds are at the ECB reference rate of the same day, US$1 = £0.7515.

      **400 tickets at £25, own Stripe account on both.** ArenaSoldOut.com: 400 × US$0.62 = **US$248, about £186**. TicketSource: 400 × (4.5% of £25 + VAT) = £540.

      **250 seated tickets at £40.** ArenaSoldOut.com: 250 × US$1.18 = **US$295, about £222**, and we draw the seating plan for free. TicketSource: 250 × (4.5% of £40 + VAT) = £540.

      **The more a ticket costs, the bigger the gap.** Our commission stays the same on a £15 ticket and on a £150 one. A percentage grows with the price.

      Count your own event in the [calculator on the pricing page](/pricing#packages).

  - type: cards
    id: more
    eyebrow: Beyond the price
    title: What else do you get with ArenaSoldOut.com?
    items:
      - title: Seating plans drawn for you, free
        text: "Send a PDF, a photo of a hand sketch or a table of rows and seats. The team builds the venue; you never draw it yourself."
        link: { label: Seating plans, href: /product/seating }
      - title: Money straight to your account
        text: "Buyers pay into your own Stripe, Flitt or AllPay account with every order. ArenaSoldOut.com never holds funds and deducts nothing from your sales."
        link: { label: Payments, href: /payments }
      - title: Lower rate for cheap tickets
        text: "When every ticket of the event costs {usdLowMax} or less: {lowPercent}% of the ticket price instead of the flat fee. Discos, runs, children's parties, excursions."
        link: { label: How it works, href: /pricing#low-price }
      - title: Buyers in their own language
        text: "Buyer page, e-mails and tickets in the buyer's language, Hebrew right to left included. We add any new language within 40 hours."
        link: { label: E-tickets, href: /product/tickets }
      - title: Every sale in your Telegram
        text: "Create an event from a poster photo in the Telegram bot and see every sale and refund in your group within seconds."
        link: { label: Telegram bot, href: /product/telegram }
      - title: Set it up yourself, or hand it over
        text: "You create events in the Event Center or the Telegram bot in minutes; we draw seating plans for free. No time? Our event manager does it for you, as a paid service."
        link: { label: Event manager, href: /pricing#services }

  - type: faq
    id: questions
    title: Questions organizers ask when they compare
    items:
      - q: Is ArenaSoldOut.com cheaper than TicketSource?
        a: "With your own Stripe account on both, yes, on any ticket above a few pounds: {usdPrice} per ticket instead of 4.5% of the booking plus VAT. On a £20 ticket that is {usdPrice}, about £0.47, against £1.08."
      - q: Is the card fee included in your commission?
        a: "No. The card fee is charged by your own payment provider at your rate, and our commission is separate. TicketSource's 7% option includes the card fee; their 4.5% option, like us, does not."
      - q: Where does the buyer's money go?
        a: "Into your own payment account with every order: Stripe, Flitt or AllPay. ArenaSoldOut.com never holds funds. Our commission is invoiced after the event or taken from your credits."
      - q: Can I move my events from TicketSource?
        a: "Yes. You create the events in the Event Center or the Telegram bot in minutes, and we draw your seating plans for free from your PDF or sketch. No time? Our event manager moves them for you, as a paid service. Keep selling on TicketSource until your page with us is ready."
      - q: What about charities?
        a: "Registered charities get 50% off our commission. Write to us and we switch it on for your organization."
      - q: Do I pay a subscription?
        a: "No. You pay only for tickets sold. Invitations and free tickets to paid events carry no commission."

