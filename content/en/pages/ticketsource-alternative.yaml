# Comparison page for organizers who look for a TicketSource alternative (Marina's request of 11.11.2026, wave 1).
# TicketSource figures and sources: docs/competitors/prices-2026-11-11.md. Read in a browser on 11.11.2026:
# ticketsource.com/pricing (UK, pounds) and ticketsource.com/es/pricing (EU, euro). Their site refuses automated
# readers, so re-check in a browser. Our figures come from content/data ({usd...}, {eur...} placeholders).
# Pound amounts next to our dollar prices ("about £0.47", the examples) are converted by hand at the ECB reference
# rate of 11.11.2026, 1 EUR = 1.1127 USD = 0.83618 GBP, so US$1 = £0.7515. Update them with the tariff or the rate.
