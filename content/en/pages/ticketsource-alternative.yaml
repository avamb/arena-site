  - type: faq
    id: questions
    title: Questions organizers ask when they compare
    items:
      - q: Is ArenaSoldOut.com cheaper than TicketSource?
        a: "With your own Stripe account on both, yes, on any ticket above about £9 in the UK and about €12 in the EU: {usdPrice} per ticket instead of 4.5% plus VAT in the UK, {eurPrice} instead of 4.5% in the EU. On a £20 ticket that is about £0.47 against £1.08; on a €20 ticket, {eurPrice} against €0.90."
      - q: Is the card fee included in your commission?
        a: "No. The card fee is charged by your own payment provider at your rate, and our commission is separate. TicketSource's own processing (7% + VAT in the UK, 8.5% in the EU) includes the card fee; their 4.5% option with your own Stripe account, like us, does not."
      - q: Where does the buyer's money go?
        a: "Into your own payment account with every order: Stripe, Flitt or AllPay. ArenaSoldOut.com never holds funds. Our commission is invoiced after the event or taken from your credits."
      - q: Can I move my events from TicketSource?
        a: "Yes. You create your events in the Event Center or the Telegram bot, we draw your seating plans for free, and you keep selling on TicketSource until your page with us is ready. No time to set it up yourself? Our [event manager](/pricing#services) does it for you, as a paid service."
      - q: What about charities?
        a: "Registered charities get 50% off our commission. Write to us and we switch it on for your organization."
      - q: Do I pay a subscription?
        a: "No. You pay only for tickets sold. Invitations and free tickets to paid events carry no commission."

