title: "Partners: venues, promoters, WordPress agencies and developers"
description: "How venues, promoters, WordPress agencies and developers work with Arena Sold Out: promoter pages, the plugin, the widget and the public API, separate terms for permanent venues."
h1: Partners
lead: Venues that host events, promoters who sell them, agencies that build organizers' sites, developers who integrate. Each has a place in the platform and a person on the team to talk to.
related:
  - { label: For developers, href: /developers }
  - { label: Venues and clubs, href: /solutions/venues }
  - { label: Contact, href: /contact }
sections:
  - type: cards
    id: kinds
    eyebrow: Partners
    title: How do partners work with Arena?
    items:
      - { title: Venues, text: "A permanent venue brings its plan once and offers it to every organizer who rents it; separate terms with a percentage of the ticket price.", link: { label: Venues and clubs →, href: /solutions/venues } }
      - { title: Promoters, text: "A page per promoter with its own link and codes; the organizer sees every channel, the promoter sees its own.", link: { label: Where you sell →, href: /product/sell } }
      - { title: WordPress agencies, text: "The plugin puts orders into WooCommerce; the widget fits any theme. The team supports the agency during the launch.", link: { label: WordPress →, href: /solutions/wordpress } }
      - { title: Developers, text: "Public API, event bundle in one call, signed webhooks, scoped keys, widget events; imports from Bil24 and others.", link: { label: Developers →, href: /developers } }
  - type: faq
    id: questions
    eyebrow: Questions
    title: What do partners ask first?
    items:
      - q: Is there a referral or reseller fee?
        a: Partnership terms are agreed individually; write to the team with what you do and for whom.
      - q: Can a ticket sold by a partner be scanned at the door?
        a: Yes. The scanner app accepts partners' tickets from other systems next to Arena tickets.
      - q: Can an agency manage several organizers?
        a: Yes, with roles in each organization's event center and scoped API keys per organization.
  - type: cta
    id: start
    title: Write to the team
    text: Tell us who you are and whom you work with. We answer in person within one working day.
    primary: { label: Contact us, href: /contact }
    secondary: { label: Read the developer docs, href: /developers }
    note: "Or in Telegram: the chat is read during the day in Europe and Israel."
