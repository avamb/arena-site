# Detailed terms. Source: pricing policy rev. 3 (18.10.2026); approved terms only (owner, 19.10.2026).
# White label: €45 / US$45 a month per brand (doc 51 R-1, owner 01.11.2026; spec 52 decisions В-1..В-7 of 02.11.2026,
# platform PR avamb/arena-platform#361). Replaces the "€45 per event" draft of doc 33 §4.3a.
title: "Detailed pricing terms"
description: "Platform commission: pay after the event, credits, tickets up to US$10, charities 50% off, venues, white label €45/US$45 a month per brand, refunds, currency."
h1: Detailed terms
lead: The conditions behind the per-ticket price. Standard terms; volume and individual terms on request. All amounts are without VAT.
sections:
  - type: prose
    id: terms
    body: |
      ## What we charge for

      The platform commission is charged per ticket sold, not as a percentage of your revenue, except for the two cases below. A ticket for €15 and a ticket for €150 cost you the same. Invitations and free tickets to paid events carry no commission.

      ## Pay after the event

      US$0.59 per ticket without a seat and US$1.09 per ticket with a seat chosen on the venue plan (€0.59 and €1.09 for venues in EU countries). We invoice after the event, for the tickets sold, and you pay by bank transfer. For events on sale for several months and for permanent venues we invoice once a month. Paying after the event is open to organizations confirmed on the platform. Card acquiring is paid to your payment provider on its own terms.

      ## Credits

      You buy a credit pack once and every ticket takes its commission from your credits at the rate of that pack. A seat adds 0.35 to the credit rate. Credits are money on your account: they never expire, you can buy credit packs as often as you like, and it is spent only on our services. It cannot be withdrawn, transferred or cashed out. If credits run out in the middle of sales, sales do not stop: the tickets they did not cover are invoiced at the pay-after-the-event price. You can switch on an automatic top-up. The credit packs and their rates are on the [pricing page](/pricing#packages).

      ## Registered charities

      Registered charities pay 50% of the commission set out on this page, with pay as you go and with credits. Our team switches the discount on for your organization once it has seen the registration: write to us from the [contact page](/contact).

      ## Events where every ticket costs US$10 or less

      The lower rate is a property of the whole event: it applies only if the highest price of any ticket of the event, before promo codes, is US$10 or less, **US$10 included** (€10 in EU countries). All categories and price steps count, including those added later. If there is a ticket above €10, the standard price applies to every ticket of the event, the cheap ones too: an event with tickets at US$5 and US$25 is at the standard price. The rate is 4% of the ticket price, at least US$0.10 and at most US$0.35 per ticket, and US$0.20 more for a ticket with a seat.

      ## Permanent venues

      Venues that hold events themselves, all year or by season, pay 2% of the ticket price (after promo codes, without the service fee), at most US$1.09 per ticket (€1.09 in EU countries), the same with and without a seat. We invoice monthly. The venue status is connected by our team: write to us from the [contact page](/contact).

      ## Ticketing operator on the event page, or white label

      The prices on this page assume that the page where you sell names ArenaSoldOut.com as the ticketing operator, with a link to arenasoldout.com. A line such as "Tickets: ArenaSoldOut.com" next to the tickets is enough, and the ticket widget shows such a line by default, so with the widget there is nothing to add. The sales pages we host always carry our name.

      If you prefer to sell without naming us, white label costs **€45 a month per brand** for venues in EU countries and **US$45 a month per brand** elsewhere, in the currency of your commission. A brand is the promoter of the event, or your organization for events without a promoter: two promoters that both sell without our name are two brands. A month that is not full is charged by days. The charge is a line of your monthly invoice; credits do not pay it.

      While white label is on, the widget line, the footer of your shop and the platform line in buyer e-mails are gone, and the e-mails go out under the brand's name. What stays: the sales pages we host, the links to the platform's terms and privacy policy at checkout and the seller details, as the law requires. Our team switches white label on and off for a brand from a date you choose: write to us from the [contact page](/contact).

      ## Refunds, date changes and cancellation

      When a buyer returns a ticket, the refund is paid to the buyer by you, the organizer. The commission for a sale that already happened stays. We do not charge a separate commission for processing a refund, for moving the date or for the e-mails to buyers. The payment provider's own terms apply as the provider states them. If an event is cancelled, the commission already charged is not returned in money.

      ## Currency

      The commission is in US dollars for every country outside the EU, including European countries outside the EU, Asia and the Middle East, and in euro for venues in EU countries. The numbers are the same in both currencies. The currency of the commission does not change the currency in which you sell tickets. If one organization has venues in both groups, it gets two accounts.

      ## Reports

      The Event Center gives per-session totals and a detailed CSV report per session. Exports to your CRM or accounting system are set up on request.

      ## Privacy

      ArenaSoldOut.com processes buyers' data on behalf of the organizer for the purpose of selling and delivering tickets. The [privacy policy](/legal/privacy) describes what is processed and for how long; the [terms and conditions](/legal/terms) are the organizer agreement.
