# Countries hub (Marina, 18.11.2026). Countries, providers, currencies and methods come from content/data
# (markets, providers); prose names only what those files say. Country pages: countries/*.
title: "Ticketing by country: payment providers and currencies"
description: "Where organizers sell tickets with ArenaSoldOut.com: countries, payment providers, currencies and methods. The money always goes to your own account."
h1: In which countries does ArenaSoldOut.com work?
lead: In every country where one of our payment providers accepts your company. Buyers pay into your own payment account; ArenaSoldOut.com never takes payments for tickets.
related:
  - { label: Payments into your own account, href: /payments, text: "Providers, statuses and how to connect your account." }
  - { label: Concert tours, href: /solutions/concert-tours, text: "Many cities and countries in one event, a page per promoter." }
  - { label: Pricing, href: /pricing, text: "Pay after the event for tickets sold, or buy credits." }
sections:
  - type: cards
    id: rules
    eyebrow: Every country
    title: Which rules are the same everywhere?
    items:
      - title: Your account, your money
        text: Every order is paid into your own account with Stripe, Flitt or AllPay. Payouts follow your provider's schedule; refunds go back to the buyer through your provider.
      - title: One price
        text: "{usdPrice} per ticket, {usdSeated} with a seat; in the EU {eurPrice} and {eurSeated}. You pay after the event, for tickets sold."
      - title: No VAT on our commission
        text: We invoice our commission without VAT.
      - title: Payment methods are your choice
        text: Buyers see the methods you turn on in your provider's account.

  - type: countries
    id: list
    eyebrow: Countries
    title: Where do organizers sell today?
    lead: Countries with a page of their own are links.
    labels:
      country: Country
      provider: Provider
      currencies: Currencies
      methods: Payment methods
      agreed: agreed with the provider
    methods_map:
      card: cards
      apple_pay: Apple Pay
      google_pay: Google Pay
      bit: Bit
      installments: instalments
      bank_transfer: bank transfer
      ideal: iDEAL
      twint: TWINT
    preparing:
      title: In preparation
      text: "Countries where we are adding a payment provider. Selling there now? [Write to us](/contact#write)."

  - type: cards
    id: where
    eyebrow: Where you sell
    title: Where do buyers find my tickets?
    lead: In every country, in three places at once. Sales from all of them come into one Event Center.
    items:
      - title: Our sales page
        text: We host a page for your event at tickets.arenasoldout.com/your-name/your-event. There is nothing to build.
        link: { label: Where you sell →, href: /product/sell }
      - title: Your own site
        text: Put the ticket widget on the site you already have. Buyers choose seats and pay without leaving it.
        link: { label: The widget →, href: /product/sell }
      - title: Your social media
        text: Share the link in social media and messengers, or print a QR code on the poster. Every order is tied to its link, so you see which one sold.
        link: { label: Links and QR codes →, href: /product/sell }

  - type: coverage
    id: my-country
    eyebrow: Your country
    title: Does ArenaSoldOut.com work in my country?
    lead: Yes, if your company is registered in a country where one of these providers opens accounts. Which companies a provider accepts is decided by the provider, and the rules change. Check the current terms with the provider before you open an account.
    labels:
      countries: Countries
      note: Providers add countries over time.
      missing: "Your country is not listed?"
    cta: { label: Write to us, href: /contact#write }

  - type: prose
    id: abroad
    eyebrow: Concert tours
    title: Can I sell a show in another country?
    body: |
      Yes. A tour can cross borders: sessions in different cities and countries live in one event, and buyers choose the date. The payment account and the currency follow your organization. If you need a second currency, we set up a separate sales channel for that country. See [concert tours](/solutions/concert-tours).

  - type: faq
    id: questions
    eyebrow: Questions
    title: What do organizers ask before they start?
    items:
      - q: How much does a ticket cost me?
        a: "{usdPrice} per ticket, {usdSeated} with a seat; in the EU {eurPrice} and {eurSeated}. You pay after the event, for tickets sold. Invitations carry no commission. See [pricing](/pricing)."
      - q: How fast can I start selling?
        a: We confirm your organization, usually within a day. With a payment account in place, an event without a seating plan goes on sale in 10 minutes. A seating plan we draw for free, usually within a day.
      - q: My tickets are cheap. Is there a lower price?
        a: "Yes. When every ticket of the event costs {usdLowMax} or less ({eurLowMax} in the EU), the commission is {lowPercent}% of the ticket price. See [pricing](/pricing)."
      - q: I run the same show every week. Do I create a new event each time?
        a: No. You add a session to the same event; prices, categories and the seating plan carry over, and buyers pick the date.
      - q: Can I see the sales of each event in real time?
        a: Yes. The Event Center shows orders and totals per session, with a CSV report. Every sale and refund also comes to your Telegram group within seconds.
      - q: Which payment methods will my buyers see?
        a: The ones you turn on in your payment provider's account.

  - type: cta
    id: start
    title: Start selling today
    text: Create the event, connect your payment account, share the link.
    primary: { label: Create your event, href: /start#create }
    secondary: { label: Contact the team, href: /contact#write }
    note: We confirm your organization, connect your payment account and draw your seating plan for free.
