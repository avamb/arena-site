# Payments page (doc 33 §3.9, item 3). Provider and market facts come from content/data; prose never names providers.
title: "Payments: your own payment account, in your country"
description: "Buyers pay into the organizer's own payment account. Providers by region with status, methods and currencies; markets live today and regions in preparation."
h1: Buyers pay into your own payment account
lead: You connect the account you already have, or open one with a provider of your country. Every order goes straight to it. Arena never holds funds and never touches your payouts.
sections:
  - type: providers
    id: providers
    eyebrow: Providers
    title: Which payment providers work with Arena?
    lead: The list is the list of what runs in production today. A provider is added when its adapter is in the code, never before.
    labels:
      regions: Countries
      currencies: Currencies
      methods: Methods
      checkout: In the widget
      since: Since
      statuses:
        live: Live
        api: Through the API
        planned: In preparation
        checkout_yes: "yes, hosted checkout"
        checkout_no: "not yet"
      methods_map:
        card: cards
        apple_pay: Apple Pay
        google_pay: Google Pay
        bit: Bit
        installments: instalments
        bank_transfer: bank transfer

  - type: markets
    id: markets
    eyebrow: Markets
    title: Where do organizers sell with Arena today?
    lead: A market is a language, a currency, a provider and the local rules together. These are live.
    preparing:
      title: In preparation
      text: Regions where organizers have asked for Arena and a local provider is being integrated. No dates and no provider names until the adapter is in the code.

  - type: cards
    id: connect
    eyebrow: How to connect
    title: How do I connect my payment account?
    lead: Three things, usually within a day.
    items:
      - title: Keys in your own account
        text: You create API keys in your provider's dashboard and paste them into the event center or send them to the team. The account stays yours; Arena only initiates payments into it.
      - title: Money to your account
        text: Every order is paid to your account directly. Payouts to your bank follow your provider's schedule. Refunds and chargebacks are decided by you.
      - title: Arena holds nothing
        text: The platform service is invoiced after each session, separately. Nothing is deducted from your sales. If you ever leave, your payment account and your buyers' data stay with you.

  - type: cta
    id: start
    title: Start selling today
    text: Create the event, connect your payment account, share the link. An event without a seating plan is on sale within the hour; a seating plan we draw with you.
    primary: { label: Create your event, href: /start#create }
    secondary: { label: Open the Telegram bot, href: https://t.me/EventsCentrBot }
    note: "Or write to us: we set everything up with you on a call."
