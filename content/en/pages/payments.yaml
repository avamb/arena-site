# Payments page (doc 33 §3.9, item 3). Provider and market facts come from content/data; prose never names providers.
title: "Payments: your own payment account, in your country"
description: "Buyers pay into the organizer's own payment account. Countries where a company can connect a payment provider, with methods and currencies."
h1: Buyers pay into your own payment account
lead: You connect the account you already have, or open one with a provider of your country. Every order goes straight to it. ArenaSoldOut.com never holds funds and never touches your payouts.
related:
  - { label: "Countries and payment methods", href: /countries, text: "Providers, currencies and payment methods in every country where you can sell." }
sections:
  - type: coverage
    id: countries
    eyebrow: Countries
    title: In which countries can I sell tickets?
    lead: In every country where a payment provider below accepts your company. Organizers have sold with ArenaSoldOut.com in {countries} countries since {since}. If your legal entity is registered in one of these countries, you connect the provider's account and sell.
    labels:
      countries: Countries
      note: Providers add countries over time; we confirm yours before you start.
      missing: "Your country is not listed?"
    cta: { label: Write to us, href: /contact }

  - type: providers
    id: providers
    eyebrow: Providers
    title: Which payment providers work with ArenaSoldOut.com?
    lead: The list is the list of what runs in production today. A provider is added when its adapter is in the code, never before.
    labels:
      currencies: Currencies
      methods: Methods
      checkout: In the widget
      statuses:
        live: Live
        api: Through the API
        planned: In preparation
        checkout_yes: "yes, hosted checkout"
        checkout_no: "not yet"
      methods_map:
        card: cards
        apple_pay: Apple Pay
        google_pay: Google Pay
        bit: Bit
        installments: instalments
        bank_transfer: bank transfer
        ideal: iDEAL
        twint: TWINT

  - type: cards
    id: connect
    eyebrow: How to connect
    title: How do I connect my payment account?
    lead: Three things, usually within a day.
    items:
      - title: Keys in your own account
        text: You create API keys in your provider's dashboard and paste them into the Event Center or send them to the team. The account stays yours; ArenaSoldOut.com only initiates payments into it.
      - title: Money to your account
        text: Every order is paid to your account directly. Payouts to your bank follow your provider's schedule. Refunds are decided by you and go back to the buyer through your provider, with any provider.
      - title: Automatic chargeback handling
        text: "When a buyer disputes a payment, ArenaSoldOut.com collects the evidence for you: payment data, the buyer's consent, the delivery of the ticket e-mails and every download of the ticket."
      - title: ArenaSoldOut.com holds nothing
        text: The platform commission is invoiced after the event or taken from your credits, separately. Nothing is deducted from your sales. If you ever leave, your payment account and your buyers' data stay with you.

  - type: cta
    id: start
    title: Start selling today
    text: "Create the event, connect your payment account, share the link. An event without a seating plan is on sale in 10 minutes; a seating plan we draw for you, free of charge."
    primary: { label: Create your event, href: /start#create }
    secondary: { label: Open the Telegram bot, href: https://t.me/EventsCentrBot }
    note: "Questions? Write to us: the team answers within one working day."
