title: "Ticketing for concert tours: one show, many cities, a page per promoter"
description: "Sell a concert tour from one event: sessions by city, a seating plan per venue, promoter pages with their own links and codes, scanning in every city, money in your own account."
h1: Concert tours
lead: One show, many cities and dates. Each city gets its session and plan, each promoter gets a page with its own link, and you see the whole tour in one Event Center.
related:
  - { label: Shows, href: /solutions/shows }
  - { label: Where you sell, href: /product/sell }
  - { label: Payments by country, href: /payments }
sections:
  - type: cards
    id: what
    eyebrow: For concert tours
    title: What matters on tour?
    items:
      - { title: Sessions by city, text: "Dates and venues in one event; buyers choose the city, you see totals per session and for the tour.", link: { label: Event Center →, href: /#center } }
      - { title: Promoter pages, text: "A separate page for each local promoter with its own link and promo codes; sales roll up to you.", link: { label: Where you sell →, href: /product/sell } }
      - { title: Several countries, text: "Sell in Czechia, Spain, France, Georgia or Israel with the provider of each country, into your own account.", link: { label: Payments →, href: /payments } }
      - { title: Buyers' languages, text: "Pages and tickets in the buyer's language, e-mails in seven languages, right-to-left for Hebrew.", link: { label: Tickets →, href: /product/tickets } }
  - type: faq
    id: questions
    eyebrow: Questions
    title: What do touring organizers ask first?
    items:
      - q: Can one event span several countries and currencies?
        a: Sessions can live in different countries; the payment account and currency follow the organization. For separate currencies the team sets up a channel per country.
      - q: Do promoters see each other's sales?
        a: No. Each promoter sees only its own page; the organizer sees everything.
      - q: A city moves to another venue. What happens to sold tickets?
        a: The session moves with buyer e-mails and updated tickets; seats are remapped with you on the new plan.
      - q: What does a ticket cost me on tour?
        a: "The same per-ticket amount in every city; see [pricing](/pricing)."
  - type: cta
    id: start
    title: Start selling today
    text: Create the event, connect your payment account, share the link.
    primary: { label: Create your event, href: /start#create }
    secondary: { label: Open the Telegram bot, href: https://t.me/EventsCentrBot }
    note: "Or write to us: we set everything up with you on a call."
