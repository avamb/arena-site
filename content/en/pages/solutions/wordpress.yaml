title: "WordPress ticketing: sell tickets on your own site"
description: "WordPress integration: put the ArenaSoldOut.com ticket widget on any page or block, with seating, tickets and scanning from the platform. Money goes to you."
h1: Your WordPress, your checkout
lead: Keep your site. The ticket widget goes on any WordPress page or block with three lines of code; the seating plan, the e-ticket and the scanning come from ArenaSoldOut.com, and buyers pay into your own account.
related:
  - { label: Where you sell, href: /product/sell }
  - { label: "For developers: widget and API", href: /developers }
  - { label: Payments, href: /payments }
sections:
  - type: paycountries
    id: countries
  - type: cards
    id: what
    eyebrow: For WordPress sites
    title: What does your WordPress site get?
    items:
      - { title: WordPress integration, text: "The ticket widget on any page, post or block of your WordPress site: buyers choose seats and pay without leaving it.", link: { label: Developers →, href: /developers } }
      - { title: Three lines of code, text: "Paste the widget into a page or a custom HTML block; buyers pay in the hosted checkout of your provider, orders live in the Event Center.", link: { label: Developers →, href: /developers } }
      - { title: Moving from another system, text: "Sessions, seating plans and customers come with you; two clients moved from their previous ticketing system with zero downtime.", link: { label: Clients →, href: /clients } }
      - { title: Seating plans drawn for free, text: "Send a PDF, a spreadsheet or a hand sketch and the team draws the plan; buyers pick seats right on your site.", link: { label: Seating plans →, href: /product/seating } }
      - { title: Money in your account, text: "Buyers pay through a provider in your country straight into your own account; ArenaSoldOut.com never holds the money.", link: { label: Payments →, href: /payments } }
      - { title: Promo codes and early prices, text: "Codes with a date window and a limit per buyer, early prices that end on a date, free and pay-what-you-want tickets.", link: { label: Pricing tools →, href: /product/pricing-tools } }
      - { title: Where buyers come from, text: "Add UTM tags to your links and see which post, newsletter or partner brings buyers to your site.", link: { label: Where you sell →, href: /product/sell } }
      - { title: Sales in Telegram, text: "Every sale and refund appears in your Telegram group within seconds, with the buyer's contact.", link: { label: Telegram →, href: /product/telegram } }
      - { title: The door, text: "E-tickets with a QR code and EAN-13, checked with the MACS scanner app for iOS and Android.", link: { label: MACS scanner app →, href: /product/scanner } }
  - type: faq
    id: questions
    eyebrow: Questions
    title: What do WordPress site owners ask first?
    items:
      - q: Will the widget slow my site down?
        a: No. The widget is a web component loaded once; your pages render as before.
      - q: Does the buyer leave my domain?
        a: The buyer stays on your page until the provider's hosted checkout, then returns.
      - q: Which payment providers work?
        a: "Your own account with a provider of your country; the list with statuses is on the [payments page](/payments)."
      - q: Who sets it up?
        a: You paste three lines of code, or the team sets the widget up with your site admin on a call.
  - type: cta
    id: start
    title: Your best event is yet to come. Shall we start with the tickets?
    text: Tell us the site address and the provider you use. We set up the widget with you.
    primary: { label: Start selling, href: /start }
    secondary: { label: Create your event, href: /start#create }
    tertiary: { label: Contact the team, href: /contact#write }
