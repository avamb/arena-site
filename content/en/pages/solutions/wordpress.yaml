title: "Ticket sales on WordPress: plugin with WooCommerce"
description: "The ArenaSoldOut.com plugin puts orders into WooCommerce, with seating, tickets and scanning from the platform. Or embed the widget on any page."
h1: Your WordPress, your checkout
lead: Keep your site and your shop. The plugin creates WooCommerce orders for every ticket; the seating plan, the e-ticket and the scanning come from ArenaSoldOut.com. Or embed the widget on any page with two lines.
related:
  - { label: Where you sell, href: /product/sell }
  - { label: "For developers: widget and API", href: /developers }
  - { label: Payments, href: /payments }
sections:
  - type: cards
    id: what
    eyebrow: For WordPress sites
    title: Which option fits my site?
    items:
      - { title: The plugin, text: "Orders land in WooCommerce, your shop and reports keep working; seats, tickets and the door are ArenaSoldOut.com's.", link: { label: Ask for the plugin →, href: /start } }
      - { title: The widget, text: "Two lines on any page or in a block; buyers pay in the hosted checkout of your provider, orders live in the Event Center.", link: { label: Developers →, href: /developers } }
      - { title: Moving from ArenaSoldOut.com, text: "Sessions, seating plans and customers imported; two clients moved with zero downtime.", link: { label: Clients →, href: /clients } }
  - type: faq
    id: questions
    eyebrow: Questions
    title: What do WordPress site owners ask first?
    items:
      - q: Will the plugin slow my site down?
        a: The plugin talks to ArenaSoldOut.com's API on checkout; pages render as before. The widget is a web component loaded once.
      - q: Does the buyer leave my domain?
        a: With the widget the buyer stays on your page until the provider's hosted checkout, then returns. With the plugin the checkout is WooCommerce's own.
      - q: Which payment providers work?
        a: "Your own account with a provider of your country; the list with statuses is on the [payments page](/payments). In Israel, AllPay works for WordPress sales today."
      - q: Who installs it?
        a: The team can install and configure the plugin with your site admin; the widget needs no installation.
  - type: cta
    id: start
    title: Start selling on your site
    text: Put the ticket widget on your site: three lines of code, and the sales run from your Event Center.
    primary: { label: Start selling, href: /start }
    secondary: { label: Read the developer docs, href: /developers }
    note: WooCommerce sites keep their shop.
