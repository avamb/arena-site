title: "Festival ticketing software: day passes, many categories"
description: "Festival ticketing with day and full passes, categories with quotas, chains that pass unsold places on, early bird by date, scanning at every entrance."
h1: Festival ticketing
tagline: A festival starts long before the gates open.
lead: Day passes and full passes, many categories with quotas, early bird that switches on a date, and a chain that hands unsold places from one category to the next. Scanning at every entrance with the app.
