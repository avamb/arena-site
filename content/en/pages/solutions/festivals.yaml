title: "Festival ticketing: several days, many categories"
description: "Festival ticketing with day and full passes, categories with quotas, chains that pass unsold places on, early bird by date, scanning at every entrance."
h1: Festivals
lead: Day passes and full passes, many categories with quotas, early bird that switches on a date, and a chain that hands unsold places from one category to the next. Scanning at every entrance with the app.
related:
  - { label: Promo codes and price windows, href: /product/pricing-tools }
  - { label: Concerts, href: /solutions/concerts }
  - { label: Reliability, href: /product/reliability }
sections:
  - type: cards
    id: what
    eyebrow: For festivals
    title: What matters for a festival?
    items:
      - { title: Categories with quotas, text: "Day one, day two, full pass, VIP, camping: each with its own price, quota and sale window.", link: { label: Pricing tools →, href: /product/pricing-tools } }
      - { title: Category chains, text: "When early bird sells out, its unsold places flow to the next category instead of blocking sales.", link: { label: Pricing tools →, href: /product/pricing-tools } }
      - { title: Entrances, text: "Scanner app for iOS and Android at every gate; partners' tickets from other systems accepted too.", link: { label: MACS scanner app →, href: /product/scanner } }
      - { title: Load, text: "800 orders a minute at 1,000 concurrent buyers in load tests; the opening minute of sales is covered.", link: { label: Reliability →, href: /product/reliability } }
  - type: faq
    id: questions
    eyebrow: Questions
    title: What do festival organizers ask first?
    items:
      - q: Can a buyer combine a day pass and camping in one order?
        a: Yes, several categories of one event in one checkout.
      - q: Can we change prices for the last week?
        a: Yes. Price windows switch by date and time; quantity steps open the next price when a step sells out.
      - q: We have sponsors' free tickets. How?
        a: Free tickets and invitations from the Event Center, no platform charge, scanned like any ticket.
      - q: What does it cost?
        a: "A fixed commission per ticket sold, invoiced after the event or taken from your credits, monthly for events on sale for months; see [pricing](/pricing)."
  - type: cta
    id: start
    title: Start selling today
    text: Create the event, connect your payment account, share the link.
    primary: { label: Create your event, href: /start#create }
    secondary: { label: Open the Telegram bot, href: https://t.me/EventsCentrBot }
    note: "Or write to us: we set everything up with you on a call."
