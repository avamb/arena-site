  - type: cards
    id: what
    eyebrow: For festivals
    title: What matters for a festival?
    items:
      - { title: Categories with quotas, text: "Day one, day two, full pass, VIP, camping: each with its own price, quota and sale window.", link: { label: Pricing tools →, href: /product/pricing-tools } }
      - { title: Category chains, text: "When early bird sells out, its unsold places flow to the next category instead of blocking sales.", link: { label: Pricing tools →, href: /product/pricing-tools } }
      - { title: Early bird and price steps, text: "An early price that ends on the date you set, or a price that goes up when a quantity step sells out.", link: { label: Pricing tools →, href: /product/pricing-tools } }
      - { title: Promo codes with limits, text: "Codes for partners, artists' fans or your newsletter, with a date window and a limit per buyer.", link: { label: Pricing tools →, href: /product/pricing-tools } }
      - { title: Invitations without commission, text: "Free tickets for sponsors, artists and press, scanned at the gate like any other ticket.", link: { label: Tickets →, href: /product/tickets } }
      - { title: Entrances, text: "The MACS scanner app for iOS and Android at every gate; partners' tickets from other systems accepted too.", link: { label: MACS scanner app →, href: /product/scanner } }
      - { title: Tickets at the gate, text: "Put a printed QR code with a short purchase link at the entrance: people scan it and buy on the spot.", link: { label: Where you sell →, href: /product/sell } }
      - { title: A big opening day, text: "800 orders a minute at 1,000 concurrent buyers in load tests: the first minute of sales goes smoothly.", link: { label: Reliability →, href: /product/reliability } }
      - { title: Sales in Telegram, text: "Every sale and refund appears in your Telegram group within seconds, with the buyer's contact.", link: { label: Telegram →, href: /product/telegram } }
  - type: faq
    id: questions
    eyebrow: Questions
    title: What do festival organizers ask first?
    items:
      - q: Can a buyer combine a day pass and camping in one order?
        a: Yes, several categories of one event in one checkout.
      - q: Can we change prices for the last week?
        a: Yes. Price windows switch by date and time; quantity steps open the next price when a step sells out.
      - q: We have sponsors' free tickets. How?
        a: Free tickets and invitations from the Event Center, no platform charge, scanned like any ticket.
      - q: What does it cost?
        a: "A fixed commission per ticket sold, invoiced after the event or paid with your credits, monthly for events on sale for months; see [pricing](/pricing)."
