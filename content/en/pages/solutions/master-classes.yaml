title: "Ticketing for master classes, trainings and tastings"
description: "Sell places for master classes, trainings, tastings and workshops: small groups with a quota, recurring dates, your own e-mails, free and pay-what-you-want."
h1: Master classes and trainings
tagline: A master class starts with the first person who signs up.
lead: Small groups, recurring dates, your own e-mails in your language. A hosted page is ready in minutes; the widget fits the site you already have. Vino&Co in Israel sells its tastings this way.
related:
  - { label: Promo codes and price windows, href: /product/pricing-tools }
  - { label: Where you sell, href: /product/sell }
  - { label: Clients, href: /clients }
sections:
  - type: paycountries
    id: countries
  - type: cards
    id: what
    eyebrow: For hosts
    title: What matters for a workshop?
    items:
      - { title: A quota per date, text: "Twelve places on Tuesday, twenty on Saturday; sold-out dates close themselves.", link: { label: Pricing tools →, href: /product/pricing-tools } }
      - { title: Recurring dates, text: "Add sessions to the same event; prices and categories carry over, buyers pick the date.", link: { label: Event Center →, href: /#center } }
      - { title: Free and pay-what-you-want, text: "Free sign-ups, or a minimum price and the buyer decides how much to add.", link: { label: Pricing tools →, href: /product/pricing-tools } }
      - { title: Promo codes and early prices, text: "A code for your regulars or a partner with a limit per buyer; an early price that ends on the date you set.", link: { label: Pricing tools →, href: /product/pricing-tools } }
      - { title: Sales in Telegram, text: "Every sale and refund appears in your Telegram group within seconds, with the buyer's contact.", link: { label: Telegram →, href: /product/telegram } }
      - { title: Where people come from, text: "Add UTM tags to your links and see which post, newsletter or partner brings sign-ups.", link: { label: Where you sell →, href: /product/sell } }
      - { title: Your language, text: "Page, widget, e-mail and ticket in the buyer's language, including Hebrew right-to-left.", link: { label: Tickets →, href: /product/tickets } }
      - { title: "A date moves? You decide", text: "Refund everyone, offer a new date instead, or choose another solution. Participants get an e-mail with the updated ticket.", link: { label: Tickets →, href: /product/tickets } }
      - { title: "No subscription, no extra payments", text: "No subscription and no monthly or yearly payments: a commission per paid ticket, and free sign-ups cost nothing.", link: { label: Pricing →, href: /pricing } }
  - type: faq
    id: questions
    eyebrow: Questions
    title: What do hosts ask first?
    items:
      - q: I have no site. Where do people buy?
        a: "On a hosted page, tickets.arenasoldout.com/your-name/your-event, ready in minutes. Share the link in messengers and social media."
      - q: Can I collect a deposit only?
        a: Set the ticket price to the deposit and collect the rest on site; or use pay-what-you-want with a minimum.
      - q: Do buyers get a reminder?
        a: Buyers get the ticket by e-mail and an e-mail when a date moves or is cancelled. Reminders before the date are not sent today.
      - q: What does it cost?
        a: "A fixed amount per paid ticket; free registrations cost nothing. See [pricing](/pricing)."
  - type: cta
    id: start
    title: Your best event is yet to come. Shall we start with the tickets?
    text: Create the event, connect your payment account, share the link.
    primary: { label: Start selling, href: /start }
    secondary: { label: Create your event, href: /start#create }
    tertiary: { label: Contact the team, href: /contact#write }
