  - type: prose
    id: examples
    title: What does that mean for one event?
    body: |
      **1,000 tickets at US$30, pay as you go.** ArenaSoldOut.com: 1,000 × US$0.62 = **US$620**. Eventbrite: 1,000 × (3.7% of US$30 + US$1.79) = US$2,900. That is **US$2,280** of difference, before card processing on either side.

      **300 seated tickets at US$60.** ArenaSoldOut.com: 300 × US$1.18 = **US$354**, and we draw the seating plan for free. Eventbrite: 300 × (3.7% of US$60 + US$1.79) = US$1,203.

      **The more a ticket costs, the bigger the gap.** Our commission stays the same on a US$15 ticket and on a US$150 one. A percentage grows with the price.

      Count your own event in the [calculator on the pricing page](/pricing#packages).

  - type: cards
    id: more
    eyebrow: Beyond the price
    title: What else is different with ArenaSoldOut.com?
    items:
      - title: The money is yours from the first order
        text: "Buyers pay into your own Stripe, Flitt or AllPay account. ArenaSoldOut.com never holds funds, so there is no payout to wait for after the event."
        link: { label: Payments, href: /payments }
      - title: Seating plans drawn for you, free
        text: "Send a PDF, a photo of a hand sketch or a table of rows and seats. The team builds the venue; you never draw it yourself."
        link: { label: Seating plans, href: /product/seating }
      - title: Lower rate for cheap tickets
        text: "When every ticket of the event costs {usdLowMax} or less: {lowPercent}% of the ticket price instead of the flat fee. Discos, runs, children's parties, excursions."
        link: { label: How it works, href: /pricing#low-price }
      - title: Your page, your buyers
        text: "Sell on your own site with the ticket widget or on your page with us. Buyers come to you, not to a catalogue next to other events."
        link: { label: Sell on your site or ours, href: /product/sell }
      - title: Every sale in your Telegram
        text: "Create an event from a poster photo in the Telegram bot and see every sale and refund in your group within seconds."
        link: { label: Telegram bot, href: /product/telegram }
      - title: Set it up yourself, or hand it over
        text: "You create events in the Event Center or the Telegram bot in minutes; we draw seating plans for free. No time? Our event manager does it for you, as a paid service."
        link: { label: Event manager, href: /pricing#services }

  - type: faq
    id: questions
    title: Questions organizers ask when they compare
    items:
      - q: Is ArenaSoldOut.com cheaper than Eventbrite?
        a: "On the commission, yes, at any ticket price: {usdPrice} per ticket instead of 3.7% + US$1.79 in the US, and {eurPrice} instead of 5.9% + €0.79 in Ireland. Card processing comes on top on both platforms in the US."
      - q: Who pays the fee, me or the buyer?
        a: "You decide. You can add your own service fee for the buyer on top of the ticket price, or keep the price as it is and pay our commission yourself. Invitations and free tickets to paid events carry no commission."
      - q: Where does the buyer's money go?
        a: "Into your own payment account with every order: Stripe, Flitt or AllPay. ArenaSoldOut.com never holds funds. Our commission is invoiced after the event or taken from your credits."
      - q: Will my event be listed in a marketplace?
        a: "No. Eventbrite has a marketplace where buyers browse events; ArenaSoldOut.com does not. We sell tickets on your site and on your own event page, and you bring the buyers with your own channels."
      - q: Can I move my events from Eventbrite?
        a: "Yes. You create the events in the Event Center or the Telegram bot in minutes, and we draw your seating plans for free from your PDF or sketch. No time? Our event manager moves them for you, as a paid service. Keep selling on Eventbrite until your page with us is ready."
      - q: Do I pay a subscription?
        a: "No. You pay only for tickets sold, after the event, or buy credits upfront from {usdFrom} per ticket. Credits never expire."

