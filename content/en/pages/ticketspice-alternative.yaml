    id: prices
    eyebrow: Prices in US dollars
    title: How much does a ticket cost on each platform?
    lead: "Our commission per ticket sold next to TicketSpice's fee per paid ticket. Card processing is separate on both platforms."
    cols: { what: "", us: ArenaSoldOut.com, them: TicketSpice }
    rows:
      - { what: "Per paid ticket, general admission", us: "**{usdPrice}**", them: "US$0.99 on Standard" }
