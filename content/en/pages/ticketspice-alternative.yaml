    note: "TicketSpice prices: [ticketspice.com/pricing](https://www.ticketspice.com/pricing) and the [TicketSpice help centre](https://help.ticketspice.com/en/articles/14172125-understand-webconnex-payments-payout-timing-and-when-you-ll-receive-your-funds), checked on 11 November 2026. Our prices: [pricing](/pricing) and [detailed terms](/pricing/terms). TicketSpice is a trademark of its owner; ArenaSoldOut.com is not affiliated with it."

  - type: prose
    id: examples
    title: What does that mean for one event?
    body: |
      **1,000 tickets, general admission.** ArenaSoldOut.com: 1,000 × US$0.62 = **US$620**. TicketSpice Standard: 1,000 × US$0.99 = US$990. You keep **US$370** more.

      **500 seated tickets.** ArenaSoldOut.com: 500 × US$1.18 = **US$590**, and we draw the seating plan for free. TicketSpice Premium: 500 × US$1.49 = US$745. You keep **US$155** more and do not build the plan yourself.

      **1,000 tickets a year, paid upfront with credits.** ArenaSoldOut.com credit pack 1K: **US$430**, or US$0.43 per ticket. The credits never expire.

      Count your own event in the [calculator on the pricing page](/pricing#packages).

  - type: cards
    id: more
    eyebrow: Beyond the price
    title: What else do you get with ArenaSoldOut.com?
    items:
      - title: Seating plans drawn for you, free
        text: "Send a PDF, a photo of a hand sketch or a table of rows and seats. The team builds the venue; you never draw it yourself."
        link: { label: Seating plans, href: /product/seating }
      - title: Money straight to your account
        text: "Buyers pay into your own Stripe, Flitt or AllPay account with every order. ArenaSoldOut.com never holds funds, so there is no weekly payout to wait for."
        link: { label: Payments, href: /payments }
      - title: Lower rate for cheap tickets
        text: "When every ticket of the event costs {usdLowMax} or less: {lowPercent}% of the ticket price instead of the flat fee. Discos, runs, children's parties, excursions."
        link: { label: How it works, href: /pricing#low-price }
      - title: Buyers in their own language
        text: "Buyer page, e-mails and tickets in the buyer's language, Hebrew right to left included. We add any new language within 40 hours."
        link: { label: E-tickets, href: /product/tickets }
      - title: Every sale in your Telegram
        text: "Create an event from a poster photo in the Telegram bot and see every sale and refund in your group within seconds."
        link: { label: Telegram bot, href: /product/telegram }
      - title: A person who sets it up with you
        text: "Not a help centre: our team connects your payment account, builds the plan and checks the first event with you."
        link: { label: Your first event, href: /first-event }

  - type: faq
    id: questions
    title: Questions organizers ask when they compare
    items:
      - q: Is ArenaSoldOut.com cheaper than TicketSpice?
        a: "Per ticket, yes: {usdPrice} instead of US$0.99 on TicketSpice Standard, and {usdSeated} for a seated ticket instead of US$1.49 on TicketSpice Premium. With credits it is from {usdFrom} per ticket. Card processing is separate on both."
      - q: Do I need a higher plan for reserved seating?
        a: "No. Every event can have a seating plan; a ticket with a seat costs {usdSeated}. You do not draw the plan: send us a PDF, a photo of a sketch or a table of rows and seats, and the team builds it for free."
      - q: Where does the buyer's money go?
        a: "Into your own payment account with every order: Stripe, Flitt or AllPay. ArenaSoldOut.com never holds funds. Our commission is invoiced after the event or taken from your credits."
      - q: Can I sell outside the US and Canada?
        a: "Yes. Organizers in EU countries pay our commission in euro, {eurPrice} per ticket pay as you go; everywhere else in US dollars. Tickets are sold in the currency of your payment account."
      - q: Can I move my events from TicketSpice?
        a: "Yes. Send us your event list and your seating plans; the team sets up the events and draws the plans for free, and you keep selling on TicketSpice until your page with us is ready."
      - q: Do I pay a subscription?
        a: "No. You pay only for tickets sold. Invitations and free tickets to paid events carry no commission."

  - type: cta
    id: start
    title: Try it on your next event
    text: Create the event, connect your payment account, share the link.
    primary: { label: Start selling, href: /start }
    secondary: { label: See pricing, href: /pricing }
    note: "Or write to us: we compare your current costs and set everything up with you on a call."
