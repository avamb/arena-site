      - { what: "Who builds the seating plan", us: "Our team, free, from your PDF or sketch", them: "You, in the venue builder" }
      - { what: "Credits paid upfront", us: "From **{usdFrom}** per ticket, never expire", them: "Not on their price list" }
      - { what: "Card processing", us: "Paid to your own payment provider", them: "2.9% + 30¢ per transaction" }
