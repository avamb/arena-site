  - type: money
    id: money
    eyebrow: Money
    title: Buyers pay you. Not us.
    lead: 100% of every sale goes to you. The buyer pays the ticket price, and the service fee if you add one, straight into your own payment account, in your currency, on your statement. ArenaSoldOut.com never holds your money. You pay ArenaSoldOut.com the platform commission per ticket sold, after the event or from a prepaid package. Refunds and chargebacks are your decision, not a platform policy.
    flowAria: Payment flow
    nodes:
      - { label: Buyer, sub: "card, Apple Pay, Google Pay" }
      - { label: Your site, sub: or the sales page we host }
      - { label: ArenaSoldOut.com, sub: "order, seats, ticket" }
      - { label: Your payment account, providers: true, highlight: true }
      - { label: Your bank, sub: on the provider's schedule }
    note: You pay ArenaSoldOut.com the platform commission per ticket sold. Nothing is deducted from your sales, nothing is held.

