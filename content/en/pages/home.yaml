# Home page. Every string here is the final English copy from design/prototype/direction-a.html
# (direction A, iteration 3, founders' review 08.10.2026). Change texts here, not in components.
# Inline marks: **bold**, [link text](href). Nothing else is interpreted.
title: "Arena Sold Out: sell seats, sell tickets, keep the money"
description: "Ticketing platform for organizers. Put your event on sale in minutes, on your own site or on a page we host. Buyers pay into your own payment account."
sections:
  - type: hero
    eyebrow: Ticketing platform for organizers
    title: Sell seats. Sell tickets. Keep the money.
    lead: Put your event on sale in minutes, on your own site or on a page we host. Buyers pay into your own payment account. Every ticket and every payout stays under your control.
    primary: { label: Start selling, href: /start }
    secondary: { label: Create your event, href: /start#create }
    note: Connect your payment account in minutes. Events without a seating plan go on sale today.
    widget:
      aria: Ticket widget preview
      event: Autumn Jazz Night
      meta: "Fri 24 Oct · 19:30 · Palác Akropolis, Prague"
      sessions: [Fri 24 Oct, Sat 25 Oct]
      stage: Stage
      mapAria: "Seat map: rows A to J, two seats selected in row G"
      mapText: "Seat map of a 140-seat venue: rows A to J, seven seats either side of the aisle. Rows A to C are sold, the stalls fill from the front, two seats in row G are selected: Parterre, 2 × €38.00."
      seatTitle: "Row {row}, seat {seat}"
      legend: { cat1: Parterre €38, cat2: Balcony €24, sold: Sold, selected: Selected }
      line: "Row G · Seats 7, 8"
      qty: 2 × €38.00
      category: Parterre
      fee: Service fee 5%
      feeValue: €3.80
      held: Held for
      heldFor: "09:41"
      total: €79.80
      pay: Pay €79.80

  - type: facts
    items:
      - Organizers in **35** countries since 2019
      - "**800** orders a minute in load tests"
      - Tickets in **7** languages
      - Payouts go to **your** account

  - type: steps
    id: how
    eyebrow: How it works
    title: On sale today. Three questions organizers ask first.
    items:
      - title: How fast can I go on sale?
        text: "An event without a seating plan is on sale within the hour: name, dates, prices, your poster, your payment account, done. A seated venue takes a seating plan, which we draw with you from your plan or SVG, usually within a day."
      - title: What do I need?
        text: "The event name and schedule, your ticket prices, your poster, and your own payment account: Stripe, Flitt, AllPay or another provider of your country. Money goes to you from the first ticket."
      - title: Which way do I set it up?
        text: In the browser, in the event center. Or in Telegram, where the bot reads your poster and fills in dates, prices and the venue for you to confirm. Or send it to us and we set it up.

  - type: ways
    id: where
    eyebrow: Where you sell
    title: Your site, or ours. The money goes to you either way.
    items:
      - title: You have a site
        text: "Your site is the checkout. Embed the ticket widget on any page: WordPress, Tilda, Wix, Webflow or custom code. Buyers never leave your domain."
        bullets:
          - Widget on any site, three lines of code
          - WordPress plugin with WooCommerce orders
          - Your colours, your fonts, your language
      - title: You do not have a site
        text: "We host the sales page: tickets.arenasoldout.com/your-name/your-event. Share one link in social media, messengers and on the poster."
        bullets:
          - A page per organizer and per event
          - A separate page for each promoter
          - Ready in minutes, no design work
          - Links to your partner sellers on the same page

  - type: qa
    id: answers
    eyebrow: What organizers ask next
    title: Yes. And here is how.
    items:
      - title: Can I use promo codes?
        text: Yes. A code can apply to one event, one session or one category, with a window, a minimum and a per-buyer limit.
      - title: Can prices change on a date I set?
        text: Yes. Early-bird windows switch by date and time. Quantity steps open the next price when the current one sells out.
        visual:
          type: ladder
          rungs:
            - { price: €24, width: 100, label: first 100 · sold }
            - { price: €32, width: 62, label: next 150 · selling }
            - { price: €38, width: 0, label: opens after, next: true }
      - title: Several prices for one event?
        text: Yes. Categories with their own price, quota and sale window, plus free and pay-what-you-want tickets.
      - title: Can I add a service fee?
        text: Yes. A percentage per sales channel, shown to the buyer as a separate line and paid into your account with the ticket.
      - title: With seats and without?
        text: "Yes, and both in one event: a seating plan with categories, standing areas with quotas. Send us your venue plan as a PDF, a spreadsheet or a hand sketch: we build it into your event. You never draw it yourself."
        visual:
          type: plan
          aria: Venue plan with parterre, two loges, a balcony and a standing area
          stage: Stage
          parterre: Parterre · 312
          logeLeft: Loge L · 48
          logeRight: Loge R · 48
          balcony: Balcony · 180
          standing: Standing
      - title: Does a scanner work with the tickets?
        text: Yes. Every ticket is a PDF with an EAN-13 barcode and a QR, in the buyer's language. Scan at the door with the scanner app for iOS and Android or a handheld scanner. The app also takes tickets sold by your partners in other systems.
        visual:
          type: ticket
          event: Autumn Jazz Night
          meta: Fri 24 Oct · 19:30 · Palác Akropolis
          seat: Parterre · Row G · Seat 7
          code: "2173049188256"
      - title: How do I see my sales?
        text: "In seconds: every sale and refund lands in your Telegram group with the buyer's contact. And in your own account on this site, the event center: open it on a phone or a computer, nothing to install. All your events, every order, refunds and per-session totals, visible to you and your team only. [See the event center below →](#center)"
        visual:
          type: telegram
          from: Arena Sales
          lines:
            - "**Paid** · Autumn Jazz Night · Fri 24 Oct"
            - Row G 7–8 · Parterre
            - "**€76.00** · Anna K. · +420 ••• 41 18"
          time: "19:42"
      - title: Refunds, invitations, date changes?
        text: "Yes, from your event center account. Refund a ticket, issue invitations, move or cancel a session: buyers get an e-mail in their language with the updated ticket."
      - title: Will it hold a stadium?
        text: Yes. 800 orders a minute with 1,000 buyers on the page at once in load tests, nightly encrypted backups, a watchdog that alerts us before you notice.

  - type: center
    id: center
    eyebrow: Event center
    title: Orders, tickets, refunds and invitations in one place
    lead: "The event center is your own account on arenasoldout.com. Open it on a phone or a computer, nothing to install. Every event you run, every order, refunds, invitations and sales figures: visible to you and your team only. Scroll the screens to see what it does."
    bullets:
      - Orders and buyers, with search and CSV reports per session
      - "Tickets: resend, refund, invite"
      - "Sessions: add dates, move or cancel with buyer e-mails"
      - Prices, categories, promo codes, service fee
      - "Team roles: owner, manager"
    note: "Prefer Telegram? The same event center lives in the bot: create an event from a poster photo, get every sale in your group."
    stripAria: Event center screens, scroll sideways
    screens:
      - kind: orders
        aria: "Event center: orders list"
