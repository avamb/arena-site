      - { icon: drama, title: Theatre, text: "Seating plans that match the venue, repeat dates, invitations for press and partners.", link: { label: For theatres →, href: /solutions/theatre } }
      - { icon: box, title: Shows, text: "Ice shows, circus, dance: many dates, many cities, one plan per venue reused.", link: { label: For shows →, href: /solutions/shows } }
      - { icon: tent, title: Festivals, text: "Several days, many categories, categories that hand over unsold places to the next one.", link: { label: For festivals →, href: /solutions/festivals } }
      - { icon: waypoints, title: Concert tours, text: "One show, many cities and dates, a page per promoter with its own link.", link: { label: For tours →, href: /solutions/concert-tours } }
      - { icon: mic, title: Master classes and trainings, text: "Small groups, recurring dates, the host's own e-mails and language.", link: { label: For hosts →, href: /solutions/master-classes } }
      - { icon: building, title: Venues and clubs, text: "Your own venue, many events a month, one seating plan reused, separate terms.", link: { label: For venues →, href: /solutions/venues } }

  - type: clients
    id: clients
    eyebrow: Clients
    title: Organizers in {countries} countries
    lead: Arena Sold Out has sold tickets for organizers since {since}; the platform behind it was rebuilt in 2026 and the organizers moved with it. The founders' earlier platforms served {track}. Their words and logos are on the clients page.
    cta: { label: Clients and testimonials, href: /clients }
    marksAria: Clients

  - type: changes
