# Home page. Every string here is the final English copy from design/prototype/direction-a.html
# (direction A, iteration 3, founders' review 08.10.2026), plus Marina's review of 01.11.2026 (doc 51 §1): the
# four reasons block, 10 minutes to sale, the free seating plan with its formats, the first-event page.
# Change texts here, not in components.
# Inline marks: **bold**, [link text](href). Nothing else is interpreted.
title: "Event ticketing platform for organizers: ArenaSoldOut.com"
description: "Ticketing platform for organizers. Put your event on sale in minutes, on your own site or on a page we host. Buyers pay into your own payment account."
sections:

  - type: hero
    eyebrow: Ticketing platform for organizers
    title: Every concert starts with a ticket.
    rotate: [Every concert, Every festival, Every premiere, Every show, Every master class, Every children's party]
    lead: "Tickets with reserved seats or without: for artists, bands, promoters, venues, festivals, theatres and master classes. Simple for your first event, professional for your hundredth."
    widgetNote: "This is how buyers pick their seats. Events without reserved seats are simpler still: buyers choose a ticket category and a quantity."
    primary: { label: Start selling, href: /start }
    secondary: { label: Create your event, href: /start#create }
    benefits:
      - icon: clock
        title: On sale today
        text: An event without reserved seats goes on sale in 10 minutes once your payment account is connected.
      - icon: list-checks
        title: Every feature organizers need
        text: Seating plans, early bird prices, promo codes, invitations, sessions, door scanning, Telegram sales and much more.
        link: { label: All features →, href: /features }
      - icon: wallet
        title: Your money, your control
        text: Buyers pay into your own payment account with every order.
      - icon: shield-check
        title: Good value
        text: "From **{price}** per ticket sold, not a percentage of your revenue. No subscription."
    widget:
      aria: Ticket widget preview
      event: Autumn Jazz Night
      meta: "Fri 24 Oct · 19:30 · Palác Akropolis, Prague"
      sessions: [Fri 24 Oct, Sat 25 Oct]
      stage: Stage
      mapAria: "Seat map: rows A to J, five price categories, pick free seats"
      mapText: "Seat map of a 140-seat venue: rows A to J, seven seats either side of the aisle, five price categories from the front rows to the back of the balcony, about a third of the seats sold, wheelchair spaces at both ends of row J. Two seats in row G are selected to start with; pick free seats and the cart below recalculates. Seats are held for 10 minutes."
      seatTitle: "Row {row}, seat {seat}"
      legend: { sold: Sold, held: Reserved, wheelchair: Wheelchair space, selected: Selected }
