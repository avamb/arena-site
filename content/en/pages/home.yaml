        - { name: Parterre, price: 38, rows: CDE }
        - { name: "Parterre, back", price: 32, rows: FG }
        - { name: Balcony, price: 24, rows: HI }
        - { name: "Balcony, back", price: 18, rows: J }
      feePercent: 5
      holdMinutes: 10
      line: "Row {row} · Seats {seats}"
      lineOne: "Row {row} · Seat {seat}"
      qty: "{n} × {price}"
      fee: "Service fee {percent}%"
      held: Held for
      pay: "Pay {total}"
      empty: Pick your seats on the plan
      tips:
        free: "{category}, {price}. Click to add"
        wheelchair: "Wheelchair space, {category}, {price}. Click to add"
        selected: "In your cart. Click to remove"
        sold: Already sold
        held: Reserved by another buyer, not paid yet
        blocked: Not for sale
      modal:
        title: This is what your buyers see
        text: "A preview of the checkout on your sales page or in the widget on your site. Your buyers pay {total} into your own payment account; the seats, the ticket and the door are ours to handle. Set up your event and this plan is yours."
