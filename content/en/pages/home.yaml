# Home page. Every string here is the final English copy from design/prototype/direction-a.html
# (direction A, iteration 3, founders' review 08.10.2026), plus Marina's review of 01.11.2026 (doc 51 §1): the
# four reasons block, 10 minutes to sale, the free seating plan with its formats, the first-event page.
# Change texts here, not in components.
# Inline marks: **bold**, [link text](href). Nothing else is interpreted.
title: "ArenaSoldOut.com: sell seats, sell tickets, keep the money"
description: "Ticketing platform for organizers. Put your event on sale in minutes, on your own site or on a page we host. Buyers pay into your own payment account."
sections:
  - type: hero
    eyebrow: Ticketing platform for organizers
    title: Sell seats. Sell tickets. Keep the money.
    lead: Start selling in minutes, on your own site or on a page we host. Buyers pay into your own payment account. Every ticket and every payout stays under your control.
    primary: { label: Start selling, href: /start }
    secondary: { label: Create your event, href: /start#create }
    note: Connect your payment account, share the link. Events without a seating plan go on sale today.
    widget:
      aria: Ticket widget preview
      event: Autumn Jazz Night
      meta: "Fri 24 Oct · 19:30 · Palác Akropolis, Prague"
      sessions: [Fri 24 Oct, Sat 25 Oct]
      stage: Stage
      mapAria: "Seat map: rows A to J, five price categories, pick free seats"
      mapText: "Seat map of a 140-seat venue: rows A to J, seven seats either side of the aisle, five price categories from the front rows to the back of the balcony, about a third of the seats sold, wheelchair spaces at both ends of row J. Two seats in row G are selected to start with; pick free seats and the cart below recalculates. Seats are held for 10 minutes."
      seatTitle: "Row {row}, seat {seat}"
      legend: { sold: Sold, held: Reserved, wheelchair: Wheelchair space, selected: Selected }
      # Price categories by rows and the organizer's service fee; the cart, the legend and the hints are computed from these.
      currency: "€"
      categories:
        - { name: Front rows, price: 48, rows: AB }
        - { name: Parterre, price: 38, rows: CDE }
        - { name: "Parterre, back", price: 32, rows: FG }
        - { name: Balcony, price: 24, rows: HI }
        - { name: "Balcony, back", price: 18, rows: J }
      feePercent: 5
      holdMinutes: 10
      line: "Row {row} · Seats {seats}"
      lineOne: "Row {row} · Seat {seat}"
      qty: "{n} × {price}"
      fee: "Service fee {percent}%"
      held: Held for
      pay: "Pay {total}"
      empty: Pick your seats on the plan
      tips:
        free: "{category}, {price}. Click to add"
        wheelchair: "Wheelchair space, {category}, {price}. Click to add"
        selected: "In your cart. Click to remove"
        sold: Already sold
        held: Reserved by another buyer, not paid yet
        blocked: Not for sale
      modal:
        title: This is what your buyers see
        text: "A preview of the checkout on your sales page or in the widget on your site. Your buyers pay {total} into your own payment account; the seats, the ticket and the door are ours to handle. Set up your event and this plan is yours."
        primary: { label: Start selling, href: /start }
        bot: { label: Open the Telegram bot, href: https://t.me/EventsCentrBot }
        close: Keep exploring
  - type: facts
    items:
      - Organizers in **31** countries since 2019
      - "**800** orders a minute in load tests"
      - Tickets in **7** languages
      - Payouts go to **your** account

  # Doc 51 §1.1: the page rests on four reasons. Benefit is worded without competitors' numbers (owner, 02.11.2026);
  # {price}, {seated}, {countries} and {since} come from content/data (pricing, clients).
  - type: reasons
    id: why
    eyebrow: Why ArenaSoldOut.com
    title: Why do organizers sell tickets with us?
    lead: "Four reasons, each with the facts behind it."
    items:
      - icon: wallet
        title: You keep more of every ticket
        text: "A flat **{price}** per ticket, not a percentage of your revenue: a €15 ticket and a €150 ticket cost you the same. Buyers pay into your own payment account, so the money is yours the moment they pay, not after the event."
        bullets:
          - Nothing deducted from your sales, no reserve held back
          - No commission on invitations and free tickets
          - Your seating plan drawn by us for free
        link: { label: Prices and the calculator →, href: /pricing }
      - icon: clock
        title: On sale in 10 minutes
        text: "Once your organization is confirmed, usually within a day, an event without a seating plan goes on sale in **10 minutes**, if you already have an account with a payment provider. You connect that account once; every next event needs only its name, dates and prices."
        link: { label: "Your first event, step by step →", href: /first-event }
      - icon: list-checks
        title: What organizers ask for, already built
        text: "No modules to buy, no plugins to install:"
        bullets:
          - Widget on your site, or a sales page we host
          - Seats and standing places in one event
          - Promo codes, prices that change by date
          - Invitations, refunds, moved dates with buyer e-mails
          - Scanner app for iOS and Android
          - Every sale in your Telegram group within seconds
        link: { label: The answers in detail →, href: "#answers" }
      - icon: shield-check
        title: Selling tickets since {since}
        text: "Organizers in **{countries}** countries since {since}: concerts, theatres, festivals, shows, master classes. **800** orders a minute in load tests, nightly encrypted backups, a watchdog that alerts the team before you notice."
        link: { label: Clients and testimonials →, href: /clients }

  - type: steps
    id: how
    eyebrow: How it works
    title: On sale today. Three questions organizers ask first.
    items:
      - title: How fast can I go on sale?
        text: "An event without a seating plan goes on sale in 10 minutes once your organization is confirmed and your payment account is connected; you connect it once. For a seated venue, send us your plan: we draw it for free, usually within a day."
      - title: What do I need?
        text: "The event name and schedule, your ticket prices, your poster, and your own payment account: Stripe, Flitt, AllPay or another provider of your country. Money goes to you from the first ticket."
      - title: Which way do I set it up?
        text: "In the browser on a computer or a phone, in the “Event Center”*. Or in Telegram, where the bot reads your poster and fills in dates, prices and the venue for you to confirm. Or send it to us and we set it up."
    note: "* The “Event Center” is your organizer account on ArenaSoldOut.com: every event, order, refund, invitation and session, for you and your team, in the browser and in Telegram. [See the Event Center below →](#center) Every step from the application to the scanner: [your first event →](/first-event)"

  - type: ways
    id: where
    eyebrow: Where you sell
    title: Your site, or ours. The money goes to you either way.
    items:
      - title: You have a site
        text: "Your site is the checkout. Embed the ticket widget on any page: WordPress, Tilda, Wix, Webflow or custom code. Buyers never leave your domain."
        bullets:
          - Widget on any site, three lines of code
          - WordPress plugin with WooCommerce orders
          - Your colours, your fonts, your language
      - title: You do not have a site
        text: "We host the sales page: tickets.arenasoldout.com/your-name/your-event. Share one link in social media, messengers and on the poster."
        bullets:
          - A page per organizer and per event
          - A separate page for each promoter
          - Ready in minutes, no design work
          - Links to your partner sellers on the same page

  - type: qa
    id: answers
    eyebrow: What organizers ask next
    title: Yes. And here is how.
    items:
      - title: Can I use promo codes?
        text: Yes. A code can apply to one event, one session or one category, with a window, a minimum and a per-buyer limit.
      - title: Can prices change on a date I set?
        text: Yes. Early-bird windows switch by date and time. Quantity steps open the next price when the current one sells out.
        visual:
          type: ladder
          rungs:
            - { price: US$24, width: 100, label: first 100 · sold }
            - { price: US$119, width: 62, label: next 150 · selling }
            - { price: US$599, width: 0, label: opens after, next: true }
      - title: Several prices for one event?
        text: Yes. Categories with their own price, quota and sale window, plus free and pay-what-you-want tickets.
      - title: Can I add a service fee?
        text: Yes. A percentage per sales channel, shown to the buyer as a separate line and paid into your account with the ticket. Check that your country allows a service fee on ticket sales.
      - title: With seats and without?
        text: "Yes, and both in one event: a seating plan with categories, standing areas with quotas. Send us your venue plan and we draw it in the system for free, usually within a day: a PDF, a photo of a hand sketch or a table of rows with the seats in each row (Excel or Google Sheets) is enough. You never enter it by hand."
        visual:
          type: plan
          aria: Venue plan with parterre, two loges, a balcony and a standing area
          stage: Stage
          parterre: Parterre · 312
          logeLeft: Loge L · 48
          logeRight: Loge R · 48
          balcony: Balcony · 180
          standing: Standing
      - title: Does a scanner work with the tickets?
        text: Yes. Every ticket is a PDF with an EAN-13 barcode and a QR, in the buyer's language. Scan at the door with the scanner app for iOS and Android or a handheld scanner. The app also takes tickets sold by your partners in other systems.
        visual:
          type: ticket
          event: Autumn Jazz Night
          meta: Fri 24 Oct · 19:30 · Palác Akropolis
          seat: Parterre · Row G · Seat 7
          code: "2173049188256"
      - title: How do I see my sales?
        text: "In your “Event Center”, your own account on this site: open it on a phone or a computer, nothing to install. All your events, every order, refunds and per-session totals, visible to you and your team only. Prefer Telegram? Every sale and refund also lands in your Telegram group within seconds, with the buyer's contact. [See the Event Center below →](#center)"
        visual:
          type: telegram
          from: ArenaSoldOut.com
          lines:
            - "**Paid** · Autumn Jazz Night · Fri 24 Oct"
            - Row G 7–8 · Parterre
            - "**€76.00** · Anna K. · +420 ••• 41 18"
          time: "19:42"
      - title: Refunds, invitations, date changes?
        text: "Yes, from your “Event Center” account. Refund a ticket, issue invitations, move or cancel a session: buyers get an e-mail in their language with the updated ticket."
      - title: Will it hold a stadium?
        text: Yes. 800 orders a minute with 1,000 buyers on the page at once in load tests, nightly encrypted backups, a watchdog that alerts us before you notice.

