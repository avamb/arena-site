  - type: steps
    id: how
    eyebrow: How it works
    title: On sale today. Three questions organizers ask first.
    items:
      - title: How fast can I go on sale?
        text: "An event without a seating plan goes on sale in 10 minutes once your organization is confirmed and your payment account is connected; you connect it once. For a seated venue, send us your plan: we draw it for free, usually within a day."
      - title: What do I need?
        text: "The event name and schedule, your ticket prices, your poster, and your own payment account: Stripe, Flitt, AllPay or another provider of your country. Money goes to you from the first ticket."
      - title: Which way do I set it up?
        text: "In the browser on a computer or a phone, in the “Event Center”*. Or in Telegram, where the bot reads your poster and fills in dates, prices and the venue for you to confirm. Or send it to us and we set it up."
    note: "* The “Event Center” is your organizer account on ArenaSoldOut.com: every event, order, refund, invitation and session, for you and your team, in the browser and in Telegram. [See the Event Center below →](#center) Every step from the application to the scanner: [your first event →](/first-event)"

  - type: ways
    id: where
    eyebrow: Where you sell
    title: On your website, on our page, on partner sites and on social media. The money comes to you either way.
    items:
      - title: Your website
        text: "Your site is the checkout. Embed the ticket widget on any page: WordPress, Tilda, Wix, Webflow or custom code. Buyers never leave your domain."
        bullets:
          - Widget on any site, three lines of code
          - WordPress integration
          - Your colours, your fonts, your language
      - title: Our sales page
        text: "We host the sales page: tickets.arenasoldout.com/your-name/your-event. One link for the poster, the newsletter and messengers."
        bullets:
          - A page per organizer and per event
          - Ready in minutes, no design work
          - Links to your partner sellers on the same page
      - title: Partner sites
        text: "The same widget goes on the site of a venue, a promoter or an agency. Every promoter gets a sales page and a link of their own."
        bullets:
          - Widget on a partner's site
          - A separate page and link for each promoter
          - All partner sales in one Event Center
      - title: Social media and messengers
        text: "A sales link on Instagram, Facebook, Telegram and WhatsApp, on the poster and in the newsletter. A QR code with a short link at the door: people scan it and buy a ticket on the spot."
        bullets:
          - One link for every channel
          - A QR code on the poster and at the door
          - Sales sources by UTM tags

  - type: qa
    id: answers
    eyebrow: Features
    title: Everything an organizer needs, on one platform
    more: { label: All features →, href: /features }
    items:
      - title: Promo codes
        text: A code can apply to one event, one session or one category, with a window, a minimum and a per-buyer limit.
      - title: Prices that change by themselves
        text: Early-bird windows switch by date and time. Quantity steps open the next price when the current one sells out.
        visual:
          type: ladder
          rungs:
            - { price: US$24, width: 100, label: first 100 · sold }
            - { price: US$119, width: 62, label: next 150 · selling }
            - { price: US$599, width: 0, label: opens after, next: true }
      - title: Categories and free tickets
        text: Categories with their own price, quota and sale window, plus free and pay-what-you-want tickets.
      - title: Your own service fee
        text: A percentage per sales channel, shown to the buyer as a separate line and paid into your account with the ticket, all of it yours. Check that your country allows a service fee on ticket sales.
      - title: Seats and standing
        text: "A seating plan with categories and standing areas with quotas, in one event. Send us your venue plan and we draw it in the system for free, usually within a day: a PDF, a photo of a hand sketch or a table of rows with the seats in each row (Excel or Google Sheets) is enough. You never enter it by hand."
        visual:
          type: plan
          aria: Venue plan with parterre, two loges, a balcony and a standing area
          stage: Stage
          parterre: Parterre · 312
          logeLeft: Loge L · 48
          logeRight: Loge R · 48
          balcony: Balcony · 180
          standing: Standing
      - title: Tickets and entry
        text: Every ticket is a PDF with an EAN-13 barcode and a QR, in the buyer's language. Scan at the door with the scanner app for iOS and Android or a handheld scanner. The app also takes tickets sold by your partners in other systems.
        visual:
          type: ticket
          event: Autumn Jazz Night
          meta: Fri 24 Oct · 19:30 · Palác Akropolis
          seat: Parterre · Row G · Seat 7
          code: "2173049188256"
      - title: Sales in real time
        text: "In your “Event Center”, your own account on this site: open it on a phone or a computer, nothing to install. All your events, every order, refunds and per-session totals, visible to you and your team only. UTM tags show where buyers come from. Prefer Telegram? Every sale and refund also lands in your Telegram group within seconds, with the buyer's contact. [See the Event Center below →](#center)"
        visual:
          type: telegram
          from: ArenaSoldOut.com
          lines:
            - "**Paid** · Autumn Jazz Night · Fri 24 Oct"
            - Row G 7–8 · Parterre
            - "**€76.00** · Anna K. · +420 ••• 41 18"
          time: "19:42"
      - title: Refunds, invitations, date changes
        text: "All from your “Event Center” account: refund a ticket, issue invitations, move or cancel a session. If an event is cancelled or moved, you decide what happens to the money: refund everyone or offer a new date. Buyers get an e-mail in their language with the updated ticket."
      - title: Reliability
        text: 800 orders a minute with 1,000 buyers on the page at once in load tests, nightly encrypted backups, a watchdog that keeps an eye on the platform around the clock.
      - title: A QR code at the door
        text: Print a QR code with a short purchase link and put it up at the entrance. People scan it and buy a ticket on the spot, even if they came without one.
      - title: API on request
        text: The API, webhooks and importing events in one call are set up on request, when your sales need to connect to your own system.

