  - type: money
    id: money
    eyebrow: Money
    title: Buyers pay you. Not us.
    lead: 100% of every sale goes to you. The buyer pays the ticket price, and the service fee if you add one, straight into your own payment account, in your currency, on your statement. Arena never holds your money. After each session you pay Arena for the platform service, per event. Refunds and chargebacks are your decision, not a platform policy.
    flowAria: Payment flow
    nodes:
      - { label: Buyer, sub: "card, Apple Pay, Google Pay" }
      - { label: Your site, sub: or the sales page we host }
      - { label: Arena, sub: "order, seats, ticket" }
      - { label: Your payment account, providers: true, highlight: true }
      - { label: Your bank, sub: on the provider's schedule }
    note: After each session you pay Arena for the platform service. Nothing is deducted from your sales, nothing is held.

  - type: pricing
    id: pricing
    eyebrow: Pricing
    title: Per ticket. No subscription.
    lead: Platform fee only. Card acquiring is paid to your provider on its own terms, which depend on your acquirer and your bank.
    planBullets:
      - "**+{seating}** per ticket on events with a seating plan"
      - "**Free** invitations and refunds, no fee"
      - Name Arena Sold Out as the ticketing partner on your event page
    cta: { label: Start selling, href: /start }
    venues:
      text: "**Owners of permanent venues** (theatres, clubs, stadiums, circuses): separate terms, {percent}% of the ticket price instead of the per-ticket fee. No fee on invitations and refunds."
      cta: { label: Talk to us, href: /start }
    calculator:
      aria: Fee calculator
      price: Ticket price, €
      quantity: Tickets sold
      seating: Event with a seating plan
      result: Platform service, paid after the session
      sales: your sales {net}, acquiring not included
    note: "Standard terms; volume and individual terms on request. You pay for the platform service after each session; for events on sale for several months, monthly."
    terms: { label: Detailed terms →, href: /pricing/terms }

