  - type: faq
    id: faq
    eyebrow: Questions
    title: What organizers ask
    items:
      - q: How much does it cost to start?
        a: "Nothing. There is no subscription and no extra monthly or yearly payment. You pay a commission per ticket sold, from {usdPrice}. Invitations and free tickets carry no commission. [Prices and the calculator →](/pricing)"
      - q: Are there any extra payments, monthly or yearly?
        a: No. No monthly or yearly payments, no subscription. You only pay a commission per ticket sold.
      - q: I sell tickets over WhatsApp and buyers call me. Why do I need a ticketing platform?
        a: "So you no longer take every order by hand. Buyers pick their seats and pay at any hour, even at night; the money goes straight to your account and the ticket with a QR code goes to the buyer's inbox. You can keep sharing the sales link on WhatsApp: your time goes into the event, not into messages and lists."
      - q: Who pays the service fee, me or the buyer?
        a: You decide. You can add your own service fee to the ticket price, and all of it comes to you with the payment. Our commission per ticket stays the same.
      - q: When do I get the money?
        a: With every order. The buyer pays straight into your payment account; ArenaSoldOut.com never holds the money. Payouts to your bank follow your provider's schedule.
      - q: Can I embed ticket sales on my own website?
        a: "Yes. The ticket widget goes on any page with three lines of code: WordPress, Tilda, Wix, Webflow or custom code. Buyers pick their seats and tickets right on your site. [For developers →](/developers)"
      - q: How does access control work on the day of the event?
        a: "Every ticket is a PDF with a QR code and an EAN-13 barcode. At the door, the MACS app for iOS and Android scans the tickets on an ordinary phone; a handheld scanner works too. The app also takes tickets sold by your partners in other systems. [MACS scanner app →](/product/scanner)"
      - q: Can people buy tickets right at the entrance?
        a: Yes. Print a QR code with a short purchase link and put it up at the entrance. People scan it with their phone and buy a ticket on the spot.
      - q: What happens if the event is cancelled or moved?
        a: You decide. Refund every buyer, offer a new date instead of a refund, or choose another option. Buyers get an e-mail in their language with the updated ticket.
      - q: Can I see where buyers come from?
        a: Yes. Add UTM tags to your sales links and the Event Center shows which channel brought the orders.
      - q: I have never sold tickets before. Is this for me?
        a: "Yes. We walk you through it step by step: [your first event →](/first-event). We draw your seating plan for free and, if you prefer, set everything up with you on a call."
      - q: How do I reach the ArenaSoldOut.com team if I have a question?
        a: "Write to us on Telegram, through the [form on the site](/contact#write) or at hello@arenasoldout.com. People from the team answer."

