title: "Security at ArenaSoldOut.com"
description: "How ArenaSoldOut.com protects organizers' and buyers' data: hosting in the EU, hosted card payments, separation between organizers, backups, monitoring."
h1: "Security at ArenaSoldOut.com"
lead: "We handle ticket sales and buyer contact details for event organizers, so we keep security practical and specific. Here is what we do today."
