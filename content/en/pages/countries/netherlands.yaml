  - type: cards
    id: benefits
    eyebrow: "Why ArenaSoldOut.com"
    title: "What do organizers get?"
    lead: "A ticketing platform built for organizers: you keep more of every ticket, sell more and start sooner."
    items:
      - title: "Earn more on every ticket"
        text: "A fixed {eurPrice} per ticket, not a percent of the price. With credits it is lower, from {eurFrom} per ticket. Card fees stay between you and your payment provider."
        link: { label: "Pricing →", href: "/pricing" }
      - title: "Sell more"
        text: "Promo codes, early bird prices, refer-a-friend links, reminders for abandoned carts and an e-mail to subscribers the moment sales open."
        link: { label: "Promo codes and price windows →", href: "/product/pricing-tools" }
      - title: "Sell sooner"
        text: "An event without a seating plan goes on sale in 10 minutes. A seating plan we draw for you for free, usually within a day."
        link: { label: "Your first event →", href: "/first-event" }

  - type: prose
    id: ideal
    eyebrow: "iDEAL"
    title: "How do buyers pay with iDEAL?"
    body: "iDEAL is the payment method most people in the Netherlands use. You turn it on in your Stripe dashboard, and it appears in the checkout next to cards. Stripe sets its own fees for iDEAL; you see them in your Stripe account. The money for every ticket comes to your account, and ArenaSoldOut.com never holds it."

  - type: cards
    id: where
    eyebrow: "Where you sell"
    title: "Where can I sell tickets?"
    lead: "In three places at once. Sales from all of them come into one Event Center."
    items:
      - title: "Our sales page"
        text: "We host a page for your event at tickets.arenasoldout.com/your-name/your-event. There is nothing to build."
        link: { label: "Where you sell →", href: "/product/sell" }
      - title: "Your own site"
        text: "Put the ticket widget on the site you already have. Buyers choose seats and pay without leaving it."
        link: { label: "The widget →", href: "/product/sell" }
      - title: "Your social media"
        text: "Share the link in social media and messengers, or print a QR code on the poster. Every order is tied to its link, so you see which one sold."
        link: { label: "Links and QR codes →", href: "/product/sell" }

  - type: faq
    id: questions
    eyebrow: "Questions"
    title: "What do organizers ask before they start?"
    items:
      - q: "How much does a ticket cost me?"
        a: "{eurPrice} per ticket, {eurSeated} with a seat. You pay after the event, for tickets sold. Invitations carry no commission. See [pricing](/pricing)."
      - q: "Can I pay less per ticket?"
        a: "Yes. Buy credits upfront and the price drops to {usdFrom} per ticket ({eurFrom} in the EU). Credits never expire. See [pricing](/pricing)."
      - q: "When do I pay ArenaSoldOut.com?"
        a: "After the event, for the tickets sold, if you choose to pay that way. You can also buy credits before the event."
      - q: "Where does the money for tickets go?"
        a: "To your own account with your payment provider, for every ticket sold. ArenaSoldOut.com never holds it."
      - q: "How fast can I start selling?"
        a: "We confirm your organization, usually within a day. With a payment account in place, an event without a seating plan goes on sale in 10 minutes. A seating plan we draw for free, usually within a day."
      - q: "How reliable is the platform?"
        a: "Load tested at 800 orders a minute with 1,000 buyers at once. A watchdog alerts the team, backups run every night, encrypted, and Cloudflare stands in front. Not a single outage has been recorded since the start in 2019, even with several tens of thousands of tickets sold in 5 minutes. See [reliability](/product/reliability)."
      - q: "I run a permanent venue. Is there a different deal?"
        a: "Yes. Theatres, clubs and other venues that hold events all year or by season pay {percent}% of the ticket price, with a cap per ticket, invoiced monthly. See [pricing](/pricing)."
      - q: "My tickets are cheap. Is there a lower price?"
        a: "Yes. When every ticket of the event costs {eurLowMax} or less, the commission is {lowPercent}% of the ticket price. See [pricing](/pricing)."
      - q: "Can one event have tickets at different prices?"
        a: "Yes. Categories with their own prices, early bird prices that change on a date, quantity steps, free and pay-what-you-want tickets."
      - q: "Can I use promo codes?"
        a: "Yes, with a scope (which categories and sessions), dates of validity and a limit per buyer. See [promo codes and price windows](/product/pricing-tools)."
      - q: "Can a child ticket be sold only together with an adult ticket?"
        a: "Yes, with add-on categories. An add-on is sold only together with a main ticket of the same session, so a child ticket cannot be bought without an adult one."
      - q: "Can I sell drinks or merchandise with the tickets?"
        a: "Yes. A drink voucher can be an add-on category: it is sold only together with a ticket and arrives as a ticket of its own. Merchandise, wine and gift sets sell in a shop next to your tickets, with variants, a cart, pickup at the event or your own delivery, and refunds. The shop is connected separately, terms on request."
      - q: "I run the same show every week. Do I create a new event each time?"
        a: "No. You add a session to the same event; prices, categories and the seating plan carry over, and buyers pick the date."
      - q: "Can I see the sales of each event in real time?"
        a: "Yes. In the Event Center on your phone or computer, in the browser, with nothing to install: orders and totals per session and a CSV report. If you use Telegram, every sale and refund also comes to your group within seconds."
      - q: "Do I need special equipment at the door?"
        a: "No. The MACS app scans tickets on any iPhone or Android phone, from paper or a screen. Handheld laser scanners and USB or Bluetooth barcode scanners work too. See [the MACS app](/product/scanner)."
      - q: "How much does the MACS scanner app cost?"
        a: "MACS is included for organizers who sell through ArenaSoldOut.com."
      - q: "Which payment methods will my buyers see?"
        a: "The ones you turn on in your Stripe account. Turn on iDEAL, and buyers in the Netherlands see it next to cards."

