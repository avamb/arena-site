# Netherlands (Marina, 18.11.2026): Stripe; iDEAL works when the organizer turns it on in Stripe; prices in euros.
title: "Event ticketing in the Netherlands: iDEAL through Stripe"
description: "Sell tickets for events in the Netherlands in euros through your own Stripe account, with iDEAL, cards, Apple Pay and Google Pay."
h1: "Ticketing for events in the Netherlands"
lead: "Buyers in the Netherlands pay the way they are used to, with iDEAL, and the money for every ticket comes to your own Stripe account."
related:
  - { label: "All countries", href: "/countries", text: "Providers, currencies and payment methods by country." }
  - { label: "Concert tours", href: "/solutions/concert-tours", text: "Many cities and countries in one event, a page per promoter." }
  - { label: "Seating plans", href: "/product/seating", text: "Send a PDF, a sketch or a table of rows; we draw the plan for free." }
sections:
