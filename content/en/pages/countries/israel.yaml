# Israel (Marina, 18.11.2026): AllPay with Isracard, Leumi Card, Bit and instalments; prices in US$.
title: "Event ticketing in Israel: shekels, Bit, your own account"
description: "Sell tickets for events in Israel in shekels through your own AllPay account: Isracard, Leumi Card, Bit and instalments. Seating plans drawn for free."
h1: Ticketing for events in Israel
lead: Concerts, stand-up, theatre and conferences in Israel. Buyers pay in shekels with a card, with Bit or in instalments, into your own AllPay account.
