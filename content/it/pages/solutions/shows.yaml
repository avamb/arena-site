title: "Biglietti per spettacoli: ice show, circo, danza, più città"
description: "Vendi biglietti per spettacoli in tournée: una mappa per struttura riutilizzata, molte date, una pagina per promoter, tutte le città in un Event Center."
h1: Spettacoli
tagline: Uno show inizia molto prima che si accendano le luci.
lead: Ice show, circo, danza e spettacoli per bambini girano con molte date in molte strutture. Un evento, una mappa per struttura, una pagina per promoter e le vendite di ogni città in un unico posto.
