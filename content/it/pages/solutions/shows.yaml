title: "Biglietti per spettacoli: ice show, circo, danza, più città"
description: "Vendi biglietti per spettacoli in tournée: una mappa per struttura riutilizzata, molte date, una pagina per promoter, tutte le città in un Event Center."
h1: Spettacoli
lead: Ice show, circo, danza e spettacoli per famiglie girano con molte date in molte strutture. Un evento, una mappa per struttura, una pagina per promoter e le vendite di ogni città in un unico posto.
related:
  - { label: Tour di concerti, href: /solutions/concert-tours }
  - { label: Mappe dei posti, href: /product/seating }
  - { label: Clienti, href: /clients }
sections:
  - type: cards
    id: what
    eyebrow: Per gli spettacoli
    title: Cosa conta per uno spettacolo?
    items:
      - { title: Una mappa per struttura, text: "La mappa di ogni struttura si costruisce una volta e si riutilizza alla visita successiva; le versioni conservano lo storico.", link: { label: Mappe dei posti →, href: /product/seating } }
      - { title: Molte date, text: "Sessioni per città e giorno in un solo evento; chi compra sceglie la data nel widget, tu vedi i totali per sessione.", link: { label: Event Center →, href: /#center } }
      - { title: Promoter locali, text: "Una pagina per promoter con link e codici propri; ogni canale riporta nello stesso Event Center.", link: { label: Dove vendi →, href: /product/sell } }
      - { title: Biglietti famiglia, text: "Categorie per bambini e gruppi, scaglioni di quantità, biglietti gratuiti per gli adulti accompagnatori.", link: { label: Strumenti di prezzo →, href: /product/pricing-tools } }
  - type: faq
    id: questions
    eyebrow: Domande
    title: Cosa chiedono per primo i produttori di spettacoli?
    items:
      - q: Un solo evento può coprire un intero tour?
        a: Sì. Le sessioni portano la città, la struttura e la mappa; totali e report CSV arrivano per sessione e per l'intero evento.
      - q: Come gestiamo una struttura in cui non abbiamo mai suonato?
        a: Mandaci la sua mappa in qualsiasi forma leggibile e il team la costruisce. La visita successiva la riutilizza.
      - q: I nostri biglietti li vendono anche partner locali. L'ingresso reggerà?
        a: Sì. L'app scanner accetta i biglietti dei partner emessi da altri sistemi insieme ai biglietti di ArenaSoldOut.com.
      - q: Dove vanno gli incassi?
        a: "Sul tuo conto di pagamento, nella tua valuta, a ogni ordine. Vedi i [pagamenti](/payments)."
  - type: cta
    id: start
    title: Inizia a vendere oggi
    text: Crea l'evento, collega il tuo conto di pagamento, condividi il link.
    primary: { label: Crea il tuo evento, href: /start#create }
    secondary: { label: Apri il bot Telegram, href: https://t.me/EventsCentrBot }
    note: "Oppure scrivici: configuriamo tutto insieme a te in una chiamata."
