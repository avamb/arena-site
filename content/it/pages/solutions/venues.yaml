sections:
  - type: cards
    id: what
    eyebrow: Per le strutture
    title: Cosa conta per una struttura?
    items:
      - { title: "Una mappa, ogni evento", text: "Costruita una volta dal tuo file, riutilizzata per ogni evento; versioni per le disposizioni del palco.", link: { label: Mappe dei posti →, href: /product/seating } }
      - { title: Promoter che affittano la struttura, text: "Una pagina per promoter con il proprio link; la struttura vede ogni evento, il promoter vede il proprio.", link: { label: Dove vendi →, href: /product/sell } }
      - { title: Condizioni separate, text: "Due percento del prezzo del biglietto al posto della commissione per biglietto, nessuna commissione su inviti e rimborsi, condizioni per volumi su richiesta.", link: { label: Prezzi →, href: /pricing } }
      - { title: L'ingresso, text: "App scanner per iOS e Android, scanner portatili, accettati i biglietti dei partner emessi da altri sistemi.", link: { label: App scanner MACS →, href: /product/scanner } }
  - type: faq
    id: questions
    eyebrow: Domande
    title: Cosa chiedono per primo i gestori di strutture?
    items:
      - q: Quali sono le condizioni per una struttura permanente?
        a: "Una percentuale sul prezzo del biglietto al posto della commissione per biglietto, nessuna commissione su inviti e rimborsi. Il valore è sulla [pagina dei prezzi](/pricing); condizioni per volumi e individuali su richiesta."
      - q: Un promoter può vendere i nostri eventi sul suo sito?
        a: Sì, con il widget sul suo sito o con una pagina promoter che ospitiamo noi. Le vendite di ogni canale compaiono nell'Event Center della struttura.
      - q: Possiamo passare da un altro sistema di biglietteria?
        a: "Sì. Sessioni, mappe dei posti e clienti sono stati importati da ArenaSoldOut.com per due clienti senza interruzioni; altri sistemi tramite l'API del pacchetto evento. Vedi gli [sviluppatori](/developers)."
      - q: Chi gestisce l'Event Center?
        a: Il tuo team, con ruoli. La struttura possiede l'organizzazione; i responsabili vedono ciò che consenti.
  - type: cta
    id: start
    title: Parla con noi
    text: Raccontaci la struttura e il numero di eventi al mese. Configuriamo mappa e condizioni insieme a te.
    primary: { label: Parla con noi, href: /start }
    secondary: { label: Vedi i prezzi, href: /pricing }
    note: "Oppure scrivici: configuriamo tutto insieme a te in una chiamata."
