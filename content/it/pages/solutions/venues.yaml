title: "Biglietti per strutture e club: una mappa, termini separati"
description: "Per strutture permanenti e club: una mappa dei posti per ogni evento, molti eventi al mese, scansione all'ingresso, una percentuale al posto della commissione."
h1: Strutture e club
lead: "La tua struttura, molti eventi al mese. La mappa si costruisce una volta e si riutilizza, ogni promoter che affitta la struttura vende dalla tua pagina o dalla sua, e le condizioni sono diverse: una percentuale sul prezzo del biglietto al posto della commissione per biglietto."
