sections:
  - type: cards
    id: what
    eyebrow: Per i festival
    title: Cosa conta per un festival?
    items:
      - { title: Categorie con quote, text: "Primo giorno, secondo giorno, abbonamento completo, VIP, campeggio: ciascuno con prezzo, quota e finestra di vendita propri.", link: { label: Strumenti di prezzo →, href: /product/pricing-tools } }
      - { title: Catene di categorie, text: "Quando l'early bird si esaurisce, i suoi posti invenduti passano alla categoria successiva invece di bloccare le vendite.", link: { label: Strumenti di prezzo →, href: /product/pricing-tools } }
      - { title: Ingressi, text: "App scanner per iOS e Android a ogni varco; accettati anche i biglietti dei partner emessi da altri sistemi.", link: { label: App scanner MACS →, href: /product/scanner } }
