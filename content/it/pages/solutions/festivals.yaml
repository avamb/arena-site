  - type: faq
    id: questions
    eyebrow: Domande
    title: Cosa chiedono per primo gli organizzatori di festival?
    items:
      - q: Chi compra può combinare biglietto giornaliero e campeggio in un solo ordine?
        a: Sì, più categorie dello stesso evento in un solo checkout.
      - q: Possiamo cambiare i prezzi per l'ultima settimana?
        a: Sì. Le finestre di prezzo scattano per data e ora; gli scaglioni di quantità aprono il prezzo successivo quando uno scaglione si esaurisce.
      - q: Abbiamo biglietti gratuiti per gli sponsor. Come si fa?
        a: Biglietti gratuiti e inviti dall'Event Center, senza commissione della piattaforma, scansionati come qualsiasi biglietto.
      - q: Quanto costa?
        a: "Una commissione fissa per biglietto venduto, fatturata dopo l'evento o prelevata dai tuoi crediti, mensile per gli eventi in vendita per mesi; vedi i [prezzi](/pricing)."
  - type: cta
    id: start
    title: Inizia a vendere oggi
    text: Crea l'evento, collega il tuo conto di pagamento, condividi il link.
    primary: { label: Crea il tuo evento, href: /start#create }
    secondary: { label: Apri il bot Telegram, href: https://t.me/EventsCentrBot }
    note: "Domande? Scrivici: il team risponde entro un giorno lavorativo."
