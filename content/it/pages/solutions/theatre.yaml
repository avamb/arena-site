title: "Biglietti per il teatro: mappe dei posti, repliche"
description: "Biglietteria teatrale con posti numerati fedeli alla sala, repliche su una sola mappa, inviti, rimborsi e cambi di data. Da 100 a 1.500 posti."
h1: Teatro
tagline: Uno spettacolo inizia molto prima che si alzi il sipario.
lead: Una mappa fedele alla tua sala, disegnata da noi gratis dal tuo PDF, schizzo o tabella delle file, e riutilizzata per ogni replica. Inviti per stampa e partner, rimborsi e cambi di data gestiti dall'Event Center.
related:
