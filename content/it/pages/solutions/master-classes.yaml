title: "Biglietti per masterclass, corsi e degustazioni"
description: "Vendi posti per masterclass, corsi, degustazioni e workshop: piccoli gruppi con quota, date ricorrenti, e-mail tue, ingresso gratuito e paga quanto vuoi."
h1: Masterclass e corsi
tagline: Una masterclass inizia con il primo iscritto.
lead: Piccoli gruppi, date ricorrenti, e-mail tue nella tua lingua. Una pagina ospitata è pronta in pochi minuti; il widget si adatta al sito che hai già. Vino&Co in Israele vende così le sue degustazioni.
