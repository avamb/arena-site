title: "Biglietti per master class, corsi e degustazioni"
description: "Vendi posti per master class, corsi, degustazioni e workshop: piccoli gruppi con quota, date ricorrenti, e-mail tue, ingresso gratuito e paga quanto vuoi."
h1: Master class e corsi
lead: Piccoli gruppi, date ricorrenti, e-mail tue nella tua lingua. Una pagina ospitata è pronta in pochi minuti; il widget si adatta al sito che hai già. Vino&Co in Israele vende così le sue degustazioni.
related:
  - { label: Codici promozionali e finestre di prezzo, href: /product/pricing-tools }
  - { label: Dove vendi, href: /product/sell }
