sections:
  - type: prose
    id: story
    eyebrow: Azienda
    title: Cos'è ArenaSoldOut.com?
    body: |
      ArenaSoldOut.com è una piattaforma di biglietteria per organizzatori: posti numerati e ingresso libero nello stesso evento, il conto di pagamento dell'organizzatore, una pagina di vendita che ospitiamo noi o un widget sul sito dell'organizzatore, un Event Center nel browser e in Telegram. Chi compra paga direttamente l'organizzatore; la piattaforma non detiene mai il denaro.

      L'azienda è ABH TEAM OÜ, registrata nell'Unione Europea. Le piattaforme precedenti dei fondatori hanno servito gli spettacoli del Cirque du Soleil, gli stadi dei Mondiali FIFA 2018, i World Choir Games e 800 ice show; ArenaSoldOut.com vende biglietti per gli organizzatori dal 2019 ed è stata ricostruita da zero nel 2026.

      Il team risponde di persona agli organizzatori, in inglese, spagnolo, ceco, russo ed ebraico. La maggior parte delle richieste degli organizzatori viene rilasciata entro poche settimane; ognuna di quelle arrivate in produzione è elencata nella [pagina delle novità](/changes) con la sua data, e la [pagina dei fatti](/facts) dice cosa esiste, cosa no e da quando.
