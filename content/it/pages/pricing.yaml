    currencyNote: "Commissione in **dollari USA** per ogni paese fuori dall'UE, compresi i paesi europei fuori dall'UE, l'Asia e il Medio Oriente, e in **euro** per le strutture nei paesi UE. Il dollaro è la base; i prezzi in euro sono i prezzi in dollari al cambio BCE. È solo la nostra commissione: i biglietti si vendono nella valuta del tuo conto di pagamento. Gli importi sono senza IVA."
    packages:
      title: Compra crediti in anticipo, paga meno per biglietto
      text: "Compri un pacchetto di crediti una volta sola; ogni biglietto venduto preleva la sua commissione dai tuoi crediti, alla tariffa di quel pacchetto. I crediti non scadono mai e si usano solo per i nostri servizi. Se i crediti finiscono a metà delle vendite, le vendite continuano: i biglietti rimanenti sono fatturati al prezzo da pagare dopo l'evento."
      cols: { name: Pacchetto di crediti, prepay: Prezzo, plain: "Commissione, senza posto", seated: "Commissione, con posto", plainCount: "Biglietti senza posto", seatedCount: "Oppure biglietti con posto", saving: "Risparmio rispetto al pagamento dopo", buy: Compra }
      buy: { label: Compra, currency: Paga in, none: Parla con noi, noneHref: /contact, note: "Al checkout Stripe chiede l'e-mail con cui la tua organizzazione è registrata su ArenaSoldOut.com. Inserisci esattamente quell'e-mail: i crediti vengono aggiunti all'organizzazione a cui appartiene. Non hai ancora un'organizzazione? Inserisci l'e-mail con cui ti registrerai e i crediti saranno collegati a essa." }
