  - type: cards
    id: services
    eyebrow: Servizi extra
    title: Cos'altro posso ordinare?
    lead: "Non fanno parte della commissione per biglietto. Ognuno si ordina separatamente."
    items:
      - title: Event manager
        text: "Non hai tempo di configurare gli eventi? Una persona del nostro team lavora come parte del tuo: crea eventi e sessioni, controlla prezzi, categorie e mappa dei posti prima delle vendite, estrae i report che ti servono, invia inviti e reinvia biglietti. A pagamento a parte; le condizioni si concordano con ogni organizzatore."
        link: { label: Scrivici, href: /contact }
      - title: White label
        text: "Vendi senza la riga Tickets: ArenaSoldOut.com: €45 al mese per marchio o struttura nei paesi dell'UE, US$45 in tutti gli altri paesi."
        link: { label: Condizioni, href: /pricing/terms }
      - title: Disegno della mappa dei posti
        text: "Gratis. Mandaci un PDF, una foto di uno schizzo a mano o una tabella di file e posti, e disegniamo la mappa, di solito entro un giorno."
        link: { label: Mappe dei posti, href: /product/seating }
  - type: faq
    id: questions
    eyebrow: Domande sul denaro
    title: Quanto mi costa un biglietto, esattamente?
    items:
      - q: Quanto costa un biglietto con posto?
        a: "Pagando dopo l'evento: US$1,18 fuori dall'UE, €1,05 nell'UE. Un biglietto senza posto costa US$0,62 o €0,55. La mappa dei posti in sé non costa nulla: la disegniamo gratis da un PDF, da una foto di uno schizzo a mano o da una tabella di file e posti. Con i crediti la commissione è più bassa, e un posto aggiunge US$0,35 (€0,31) alla tariffa dei crediti."
      - q: Come funzionano i crediti?
        a: "Compri un pacchetto di crediti una volta sola. Ogni biglietto venduto preleva la sua commissione dai tuoi crediti alla tariffa del pacchetto, finché non finiscono. I crediti non scadono mai, si possono ricaricare in qualsiasi momento e si usano solo per i nostri servizi: non si possono prelevare né trasferire."
      - q: E se i crediti finiscono a metà delle vendite?
        a: Le vendite non si fermano. I biglietti che i tuoi crediti non hanno coperto entrano nella fattura abituale al prezzo da pagare dopo l'evento.
      - q: Esiste una ricarica automatica?
        a: Sì. Puoi attivarla e, quando i tuoi crediti scendono sotto la tua soglia, il pacchetto successivo viene comprato per te.
      - q: Dove va il denaro dell'acquirente?
        a: "Sul tuo conto di pagamento, con ogni ordine. ArenaSoldOut.com non detiene mai fondi. L'acquirente paga il prezzo del biglietto e, se ne aggiungi una, la tua commissione di servizio."
      - q: Quando pago ArenaSoldOut.com?
        a: "Dopo l'evento, con bonifico bancario, per i biglietti venduti. Per gli eventi in vendita per diversi mesi e per le strutture permanenti, una volta al mese. I crediti si pagano al momento dell'acquisto."
      - q: E l'acquiring delle carte?
        a: L'acquiring delle carte è un contratto tra te e il tuo fornitore di pagamenti, alle condizioni del fornitore. Non fa parte della nostra commissione e non vi aggiungiamo nulla.
      - q: Devo citare ArenaSoldOut.com sul mio sito?
        a: "I prezzi presuppongono che la pagina dell'evento indichi ArenaSoldOut.com come operatore della vendita biglietti, con un link a noi; il widget dei biglietti mostra questa riga di default. Per vendere senza il nostro nome, il white label costa €45 al mese per marchio o struttura nei paesi UE e US$45 al mese per marchio o struttura in tutti gli altri paesi, calcolati a giorni per un mese non intero. Le [condizioni dettagliate](/pricing/terms) spiegano che cos'è un marchio e che cosa nasconde il white label."
      - q: C'è uno sconto per gli enti benefici?
        a: "Sì. Gli enti benefici registrati pagano il 50% della nostra commissione, a consumo e con i crediti. Scrivici dalla [pagina dei contatti](/contact) e lo attiviamo per la tua organizzazione."
      - q: Gli inviti sono gratuiti?
        a: Sì. Inviti e biglietti gratuiti a eventi a pagamento non hanno commissione.
      - q: Che fine fa la commissione quando un biglietto viene rimborsato o la data si sposta?
        a: "Il rimborso all'acquirente lo fai tu. La commissione per una vendita già avvenuta resta, e non addebitiamo una commissione separata per l'elaborazione del rimborso, per lo spostamento della data o per le e-mail agli acquirenti. Le condizioni proprie del fornitore di pagamenti sono quelle del fornitore."
      - q: E se annullo l'evento?
        a: "La commissione già addebitata non viene restituita in denaro. Scrivici del tuo caso prima che l'evento venga annullato."
      - q: Uno dei miei biglietti costa più di US$10 (€10 nell'UE), gli altri sono economici. Quale prezzo vale?
        a: "Quello standard, per tutti i biglietti dell'evento: la tariffa ridotta richiede che ogni biglietto di ogni categoria e gradino di prezzo costi US$10 o meno (€10 nell'UE). Un biglietto da US$5 accanto a uno da US$25 è al prezzo standard."
      - q: Ho una struttura e organizzo molti eventi al mese. Esiste un'offerta diversa?
        a: "Sì. I proprietari di strutture permanenti (teatri, club, stadi, circhi e altri luoghi che organizzano eventi in proprio, tutto l'anno o a stagione) pagano il {percent}% del prezzo del biglietto, calcolato dopo i codici promozionali e senza la tua commissione di servizio. La commissione per biglietto è limitata a US$1,18 (€1,09 nell'UE), uguale con e senza posto. Gli inviti non hanno commissione. Fatturiamo ogni mese. Il nostro team attiva lo stato di struttura: scrivici dalla [pagina dei contatti](/contact). Le condizioni complete sono nelle [condizioni dettagliate](/pricing/terms)."

