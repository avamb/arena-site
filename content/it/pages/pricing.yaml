title: "Prezzi: per biglietto, senza abbonamento"
description: "Commissione per biglietto venduto, senza abbonamento. Paghi dopo l'evento o compri crediti per pagare meno. Tariffe ridotte per strutture."
h1: Per biglietto. Senza abbonamento.
lead: Paghi ad ArenaSoldOut.com una commissione della piattaforma per ogni biglietto venduto. Paghi a consumo dopo l'evento, oppure compri crediti in anticipo e paghi meno per biglietto. L'acquiring delle carte lo paghi al tuo fornitore di pagamenti alle sue condizioni.
