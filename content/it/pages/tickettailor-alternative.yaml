    title: Quanto costa un biglietto su ciascuna piattaforma?
    lead: "La nostra commissione per biglietto venduto accanto a quella di Ticket Tailor. Importi senza IVA, elaborazione delle carte pagata al tuo fornitore di pagamenti su entrambe le piattaforme."
