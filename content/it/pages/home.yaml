  - type: money
    id: money
    eyebrow: Denaro
    title: Gli acquirenti pagano te. Non noi.
    lead: Il 100% di ogni vendita va a te. L'acquirente paga il prezzo del biglietto, e la commissione di servizio se ne aggiungi una, direttamente sul tuo conto di pagamento, nella tua valuta, sul tuo estratto conto. ArenaSoldOut.com non detiene mai il tuo denaro. Tu paghi ad ArenaSoldOut.com la commissione della piattaforma per ogni biglietto venduto, dopo l'evento o da un pacchetto prepagato. Rimborsi e chargeback sono una tua decisione, non una politica della piattaforma.
