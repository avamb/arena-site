  - type: faq
    id: faq
    eyebrow: Domande
    title: Cosa chiedono gli organizzatori
    items:
      - q: Quanto costa iniziare?
        a: "Niente. Non c'è abbonamento né alcun pagamento aggiuntivo mensile o annuale. Paghi una commissione per ogni biglietto venduto, da {usdPrice}. Su inviti e biglietti gratuiti non c'è commissione. [Prezzi e calcolatore →](/pricing)"
      - q: Ci sono pagamenti aggiuntivi, mensili o annuali?
        a: No. Nessun pagamento mensile o annuale, nessun abbonamento. Paghi solo una commissione per ogni biglietto venduto.
      - q: Vendo i biglietti su WhatsApp e gli acquirenti mi telefonano. A cosa mi serve una piattaforma di biglietteria?
        a: "A non dover più prendere ogni ordine a mano. Chi compra sceglie i posti e paga a qualsiasi ora, anche di notte; i soldi arrivano direttamente sul tuo conto e il biglietto con il codice QR nella casella e-mail dell'acquirente. Puoi continuare a condividere il link di vendita su WhatsApp: il tuo tempo va all'evento, non a messaggi ed elenchi."
      - q: Chi paga la commissione di servizio, io o l'acquirente?
        a: Decidi tu. Puoi aggiungere la tua commissione di servizio al prezzo del biglietto, e arriva tutta a te insieme al pagamento. La nostra commissione per biglietto resta la stessa.
      - q: Quando ricevo i soldi?
        a: A ogni ordine. L'acquirente paga direttamente sul tuo conto di pagamento; ArenaSoldOut.com non detiene mai il denaro. I versamenti sulla tua banca seguono i tempi del tuo fornitore.
      - q: Posso vendere i biglietti direttamente sul mio sito?
        a: "Sì. Il widget dei biglietti va su qualsiasi pagina con tre righe di codice: WordPress, Tilda, Wix, Webflow o codice personalizzato. Chi compra sceglie posti e biglietti direttamente sul tuo sito. [Per sviluppatori →](/developers)"
      - q: Come funziona il controllo accessi il giorno dell'evento?
        a: "Ogni biglietto è un PDF con un codice QR e un codice a barre EAN-13. All'ingresso, l'app MACS per iOS e Android scansiona i biglietti con un normale telefono; va bene anche uno scanner portatile. L'app accetta anche i biglietti venduti dai tuoi partner in altri sistemi. [App scanner MACS →](/product/scanner)"
      - q: Si possono comprare i biglietti direttamente all'ingresso?
        a: Sì. Stampa un codice QR con un link breve per l'acquisto e appendilo all'ingresso. Le persone lo inquadrano con il telefono e comprano il biglietto sul posto.
      - q: Cosa succede se l'evento viene annullato o spostato?
        a: Decidi tu. Rimborsa tutti gli acquirenti, proponi una nuova data al posto del rimborso o scegli un'altra soluzione. Gli acquirenti ricevono un'e-mail nella loro lingua con il biglietto aggiornato.
      - q: Posso vedere da dove arrivano gli acquirenti?
        a: Sì. Aggiungi i tag UTM ai tuoi link di vendita e l'Event Center mostra quale canale ha portato gli ordini.
      - q: Non ho mai venduto biglietti. Fa per me?
        a: "Sì. Ti accompagniamo passo dopo passo: [il tuo primo evento →](/first-event). La tua mappa dei posti la disegniamo gratis e, se preferisci, configuriamo tutto insieme a te in una chiamata."
      - q: Come contatto il team di ArenaSoldOut.com se ho una domanda?
        a: "Scrivici su Telegram, tramite il [modulo sul sito](/contact#write) o a hello@arenasoldout.com. Ti rispondono persone del team."

