  - type: steps
    id: how
    eyebrow: Come funziona
    title: In vendita oggi. Tre domande che gli organizzatori fanno per prime.
    items:
      - title: Quanto in fretta posso mettere in vendita?
        text: "Un evento senza mappa dei posti va in vendita in 10 minuti, una volta confermata la tua organizzazione e collegato il conto di pagamento; lo colleghi una sola volta. Per una sala con posti numerati, mandaci la tua mappa: la disegniamo gratis, di solito entro un giorno."
      - title: Che cosa mi serve?
        text: "Il nome e il calendario dell'evento, i prezzi dei biglietti, la locandina e il tuo conto di pagamento: Stripe, Flitt, AllPay o un altro fornitore del tuo paese. Il denaro arriva a te dal primo biglietto."
      - title: In che modo lo configuro?
        text: "Nel browser, da computer o telefono, nell'“Event Center”*. Oppure in Telegram, dove il bot legge la tua locandina e compila date, prezzi e luogo da confermare. Oppure mandacelo e lo configuriamo noi."
    note: "* L'“Event Center” è il tuo account di organizzatore su ArenaSoldOut.com: ogni evento, ordine, rimborso, invito e sessione, per te e il tuo team, nel browser e in Telegram. [Vedi l'Event Center qui sotto →](#center) Ogni passo, dalla richiesta allo scanner: [il tuo primo evento →](/first-event)"

  - type: ways
    id: where
    eyebrow: Dove vendi
    title: Sul tuo sito, sulla nostra pagina, sui siti dei partner e sui social. I soldi arrivano a te in ogni caso.
    items:
      - title: Il tuo sito
        text: "Il tuo sito è il checkout. Inserisci il widget dei biglietti in qualsiasi pagina: WordPress, Tilda, Wix, Webflow o codice personalizzato. Gli acquirenti non lasciano mai il tuo dominio."
        bullets:
          - Widget su qualsiasi sito, tre righe di codice
          - Integrazione con WordPress
          - I tuoi colori, i tuoi caratteri, la tua lingua
      - title: La nostra pagina di vendita
        text: "Ospitiamo noi la pagina di vendita: tickets.arenasoldout.com/your-name/your-event. Un solo link per la locandina, la newsletter e i messenger."
        bullets:
          - Una pagina per organizzatore e per evento
          - Pronta in pochi minuti, senza lavoro di grafica
          - Link ai tuoi venditori partner sulla stessa pagina
      - title: I siti dei partner
        text: "Lo stesso widget va sul sito di un locale, di un promoter o di un'agenzia. Ogni promoter ha la sua pagina di vendita e il suo link."
        bullets:
          - Widget sul sito di un partner
          - Una pagina e un link per ogni promoter
          - Tutte le vendite dei partner in un unico Event Center
      - title: Social e messenger
        text: "Un link di vendita su Instagram, Facebook, Telegram e WhatsApp, sulla locandina e nella newsletter. All'ingresso, un codice QR con un link breve: le persone lo inquadrano e comprano il biglietto sul posto."
        bullets:
          - Un solo link per ogni canale
          - Un codice QR sulla locandina e all'ingresso
          - Le fonti delle vendite con i tag UTM

  - type: qa
    id: answers
    eyebrow: Funzioni
    title: Tutto ciò che serve a un organizzatore, in un'unica piattaforma
    more: { label: Tutte le funzioni →, href: /features }
    items:
      - title: Codici promozionali
        text: Un codice può valere per un evento, una sessione o una categoria, con una finestra di validità, un minimo e un limite per acquirente.
      - title: Prezzi che cambiano da soli
        text: Le finestre early bird cambiano per data e ora. I gradini di quantità aprono il prezzo successivo quando quello attuale si esaurisce.
        visual:
          type: ladder
          rungs:
            - { price: US$24, width: 100, label: primi 100 · venduti }
            - { price: US$119, width: 62, label: prossimi 150 · in vendita }
            - { price: US$599, width: 0, label: si apre dopo, next: true }
      - title: Categorie e biglietti gratuiti
        text: Categorie con prezzo, quota e finestra di vendita propri, più biglietti gratuiti e a offerta libera.
      - title: La tua commissione di servizio
        text: Una percentuale per canale di vendita, mostrata all'acquirente come riga separata e versata sul tuo conto insieme al biglietto, tutta per te. Verifica che il tuo paese consenta una commissione di servizio sulla vendita di biglietti.
      - title: Posti numerati e posti in piedi
        text: "Una mappa dei posti con categorie e aree in piedi con quote, nello stesso evento. Mandaci la pianta della tua struttura e la disegniamo nel sistema gratis, di solito entro un giorno: basta un PDF, una foto di uno schizzo a mano o una tabella con le file e i posti di ogni fila (Excel o Google Sheets). Non devi mai inserirla a mano."
        visual:
          type: plan
          aria: Pianta della struttura con platea, due palchi, una balconata e un'area in piedi
          stage: Palco
          parterre: Platea · 312
          logeLeft: Palco sx · 48
          logeRight: Palco dx · 48
          balcony: Balconata · 180
          standing: In piedi
      - title: Biglietti e ingresso
        text: Ogni biglietto è un PDF con codice a barre EAN-13 e un QR, nella lingua dell'acquirente. Scansioni all'ingresso con l'app scanner per iOS e Android o con uno scanner portatile. L'app accetta anche i biglietti venduti dai tuoi partner in altri sistemi.
        visual:
          type: ticket
          event: Autumn Jazz Night
          meta: ven 24 ott · 19:30 · Palác Akropolis
          seat: Platea · Fila G · Posto 7
          code: "2173049188256"
      - title: Vendite in tempo reale
        text: "Nel tuo “Event Center”, il tuo account su questo sito: aprilo da telefono o computer, niente da installare. Tutti i tuoi eventi, ogni ordine, rimborsi e totali per sessione, visibili solo a te e al tuo team. I tag UTM mostrano da dove arrivano gli acquirenti. Preferisci Telegram? Ogni vendita e ogni rimborso arriva anche nel tuo gruppo Telegram in pochi secondi, con il contatto dell'acquirente. [Vedi l'Event Center qui sotto →](#center)"
        visual:
          type: telegram
          from: ArenaSoldOut.com
          lines:
            - "**Pagato** · Autumn Jazz Night · ven 24 ott"
            - Fila G 7–8 · Platea
            - "**€76.00** · Anna K. · +420 ••• 41 18"
          time: "19:42"
      - title: Rimborsi, inviti, cambi di data
        text: "Tutto dal tuo account “Event Center”: rimborsa un biglietto, emetti inviti, sposta o annulla una sessione. Se un evento viene annullato o spostato, decidi tu cosa succede al denaro: rimborsare tutti o proporre una nuova data. Gli acquirenti ricevono un'e-mail nella loro lingua con il biglietto aggiornato."
      - title: Affidabilità
        text: 800 ordini al minuto con 1.000 acquirenti contemporaneamente sulla pagina nei test di carico, backup cifrati ogni notte, un sistema di controllo che veglia sulla piattaforma giorno e notte.
      - title: Un codice QR all'ingresso
        text: Stampa un codice QR con un link breve per l'acquisto e appendilo all'ingresso. Le persone lo inquadrano e comprano il biglietto sul posto, anche se sono arrivate senza.
      - title: API su richiesta
        text: L'API, i webhook e l'importazione degli eventi con una sola chiamata si attivano su richiesta, quando le tue vendite devono collegarsi al tuo sistema.

