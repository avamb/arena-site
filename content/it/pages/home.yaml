  - type: reasons
    id: why
    eyebrow: Perché ArenaSoldOut.com
    title: Perché gli organizzatori vendono i biglietti con noi?
    lead: "Quattro motivi, ciascuno con i fatti a sostegno."
    items:
      - icon: wallet
        title: Ti resta di più su ogni biglietto
        text: "**{price}** fissi per biglietto, non una percentuale sui tuoi incassi: un biglietto da $15 e uno da $150 ti costano lo stesso. Gli acquirenti pagano sul tuo conto di pagamento, quindi il denaro è tuo nel momento in cui pagano, non dopo l'evento."
        bullets:
          - Nulla trattenuto dalle tue vendite, nessuna riserva accantonata
          - Nessuna commissione su inviti e biglietti gratuiti
          - La tua mappa dei posti la disegniamo noi, gratis
        link: { label: Prezzi e calcolatore →, href: /pricing }
      - icon: clock
        title: In vendita in 10 minuti
        text: "Una volta confermata la tua organizzazione, di solito entro un giorno, un evento senza mappa dei posti va in vendita in **10 minuti**, se hai già un account presso un fornitore di pagamenti. Colleghi quell'account una volta sola; per ogni evento successivo servono solo nome, date e prezzi."
        link: { label: "Il tuo primo evento, passo dopo passo →", href: /first-event }
      - icon: list-checks
        title: Ciò che chiedono gli organizzatori, già pronto
        text: "Nessun modulo da comprare, nessun plugin da installare:"
        bullets:
          - Widget sul tuo sito, o una pagina di vendita ospitata da noi
          - Posti numerati e posti in piedi nello stesso evento
          - Codici promozionali, prezzi che cambiano per data
          - Inviti, rimborsi, date spostate con e-mail agli acquirenti
          - App scanner per iOS e Android
          - Ogni vendita nel tuo gruppo Telegram in pochi secondi
        link: { label: Le risposte in dettaglio →, href: "#answers" }
      - icon: shield-check
        title: Vendiamo biglietti dal {since}
        text: "Organizzatori in **{countries}** paesi dal {since}: concerti, teatri, festival, spettacoli, masterclass. **800** ordini al minuto nei test di carico, backup cifrati ogni notte, un sistema di controllo che avvisa il team prima che tu te ne accorga."
        link: { label: Clienti e testimonianze →, href: /clients }

  - type: steps
    id: how
    eyebrow: Come funziona
    title: In vendita oggi. Tre domande che gli organizzatori fanno per prime.
    items:
      - title: Quanto in fretta posso mettere in vendita?
        text: "Un evento senza mappa dei posti va in vendita in 10 minuti, una volta confermata la tua organizzazione e collegato il conto di pagamento; lo colleghi una sola volta. Per una sala con posti numerati, mandaci la tua mappa: la disegniamo gratis, di solito entro un giorno."
      - title: Che cosa mi serve?
        text: "Il nome e il calendario dell'evento, i prezzi dei biglietti, la locandina e il tuo conto di pagamento: Stripe, Flitt, AllPay o un altro fornitore del tuo paese. Il denaro arriva a te dal primo biglietto."
      - title: In che modo lo configuro?
        text: "Nel browser, da computer o telefono, nell'“Event Center”*. Oppure in Telegram, dove il bot legge la tua locandina e compila date, prezzi e luogo da confermare. Non hai tempo? Il nostro [event manager](/pricing#services) lo fa per te, come servizio a pagamento."
    note: "* L'“Event Center” è il tuo account di organizzatore su ArenaSoldOut.com: ogni evento, ordine, rimborso, invito e sessione, per te e il tuo team, nel browser e in Telegram. [Vedi l'Event Center qui sotto →](#center) Ogni passo, dalla richiesta allo scanner: [il tuo primo evento →](/first-event)"

  - type: ways
    id: where
    eyebrow: Dove vendi
    title: Il tuo sito, o il nostro. Il denaro va a te in ogni caso.
    items:
      - title: Hai un sito
        text: "Il tuo sito è il checkout. Inserisci il widget dei biglietti in qualsiasi pagina: WordPress, Tilda, Wix, Webflow o codice personalizzato. Gli acquirenti non lasciano mai il tuo dominio."
        bullets:
          - Widget su qualsiasi sito, tre righe di codice
          - Plugin WordPress con ordini WooCommerce
          - I tuoi colori, i tuoi caratteri, la tua lingua
      - title: Non hai un sito
        text: "Ospitiamo noi la pagina di vendita: tickets.arenasoldout.com/your-name/your-event. Condividi un solo link sui social, nei messenger e sulla locandina."
        bullets:
          - Una pagina per organizzatore e per evento
          - Una pagina separata per ogni promoter
          - Pronta in pochi minuti, senza lavoro di grafica
          - Link ai tuoi venditori partner sulla stessa pagina

  - type: qa
    id: answers
    eyebrow: Cos'altro chiedono gli organizzatori
    title: Sì. Ed ecco come.
    items:
      - title: Posso usare codici promozionali?
        text: Sì. Un codice può valere per un evento, una sessione o una categoria, con una finestra di validità, un minimo e un limite per acquirente.
      - title: I prezzi possono cambiare a una data che scelgo?
        text: Sì. Le finestre early bird cambiano per data e ora. I gradini di quantità aprono il prezzo successivo quando quello attuale si esaurisce.
        visual:
          type: ladder
          rungs:
            - { price: US$24, width: 100, label: primi 100 · venduti }
            - { price: US$119, width: 62, label: prossimi 150 · in vendita }
            - { price: US$599, width: 0, label: si apre dopo, next: true }
      - title: Più prezzi per un solo evento?
        text: Sì. Categorie con prezzo, quota e finestra di vendita propri, più biglietti gratuiti e a offerta libera.
      - title: Posso aggiungere una commissione di servizio?
        text: Sì. Una percentuale per canale di vendita, mostrata all'acquirente come riga separata e versata sul tuo conto insieme al biglietto. Verifica che il tuo paese consenta una commissione di servizio sulla vendita di biglietti.
      - title: Con posti numerati e senza?
        text: "Sì, ed entrambi nello stesso evento: una mappa dei posti con categorie, aree in piedi con quote. Mandaci la pianta della tua struttura e la disegniamo nel sistema gratis, di solito entro un giorno: basta un PDF, una foto di uno schizzo a mano o una tabella con le file e i posti di ogni fila (Excel o Google Sheets). Non devi mai inserirla a mano."
        visual:
          type: plan
          aria: Pianta della struttura con platea, due palchi, una balconata e un'area in piedi
          stage: Palco
          parterre: Platea · 312
          logeLeft: Palco sx · 48
          logeRight: Palco dx · 48
          balcony: Balconata · 180
          standing: In piedi
      - title: Lo scanner funziona con i biglietti?
        text: Sì. Ogni biglietto è un PDF con codice a barre EAN-13 e un QR, nella lingua dell'acquirente. Scansioni all'ingresso con l'app scanner per iOS e Android o con uno scanner portatile. L'app accetta anche i biglietti venduti dai tuoi partner in altri sistemi.
        visual:
          type: ticket
          event: Autumn Jazz Night
          meta: ven 24 ott · 19:30 · Palác Akropolis
          seat: Platea · Fila G · Posto 7
          code: "2173049188256"
      - title: Come vedo le mie vendite?
        text: "Nel tuo “Event Center”, il tuo account su questo sito: aprilo da telefono o computer, niente da installare. Tutti i tuoi eventi, ogni ordine, rimborsi e totali per sessione, visibili solo a te e al tuo team. Preferisci Telegram? Ogni vendita e ogni rimborso arriva anche nel tuo gruppo Telegram in pochi secondi, con il contatto dell'acquirente. [Vedi l'Event Center qui sotto →](#center)"
        visual:
          type: telegram
          from: ArenaSoldOut.com
          lines:
            - "**Pagato** · Autumn Jazz Night · ven 24 ott"
            - Fila G 7–8 · Platea
            - "**€76.00** · Anna K. · +420 ••• 41 18"
          time: "19:42"
      - title: Rimborsi, inviti, cambi di data?
        text: "Sì, dal tuo account “Event Center”. Rimborsa un biglietto, emetti inviti, sposta o annulla una sessione: gli acquirenti ricevono un'e-mail nella loro lingua con il biglietto aggiornato."
      - title: Reggerà uno stadio?
        text: Sì. 800 ordini al minuto con 1.000 acquirenti contemporaneamente sulla pagina nei test di carico, backup cifrati ogni notte, un sistema di controllo che ci avvisa prima che tu te ne accorga.

