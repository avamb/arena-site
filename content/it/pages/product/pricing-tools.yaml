title: "Codici promozionali, early bird e prezzi a gradini"
description: "Codici promozionali con limiti, prezzi per data, gradini di quantità, catene di categorie, commissione di servizio, biglietti gratuiti e a offerta libera."
h1: Prezzi che cambiano come hai pianificato
lead: Early bird per data, il prezzo successivo quando un gradino si esaurisce, codici per i partner, una commissione di servizio per canale. Tutto impostato nell'Event Center, applicato nel widget e sulla pagina ospitata.
