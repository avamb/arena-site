title: "Biglietti elettronici con EAN-13 e QR, scansione, e-mail"
description: "Biglietti PDF con EAN-13 e QR nella lingua dell'acquirente, app scanner MACS per iOS e Android, biglietti di prova, e-mail se una sessione si sposta."
h1: Un biglietto che si scansiona
lead: Ogni biglietto è un PDF con un codice a barre EAN-13 e un codice QR, nella lingua dell'acquirente. Lo scansioni con l'app o con uno scanner portatile, lo reinvii, lo rimborsi, lo sostituisci quando una data si sposta.
