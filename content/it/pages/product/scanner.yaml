title: "App scanner MACS: scansione dei biglietti su iOS e Android"
description: "MACS scansiona i biglietti EAN-13 e QR di ogni organizzatore della piattaforma e dei partner, su iPhone, iPad, Android e scanner portatili. Gratis."
h1: "MACS: l'app all'ingresso"
lead: Un'app per ogni ingresso. Il personale all'ingresso accede, sceglie la sessione e scansiona l'EAN-13 o il QR sul biglietto, su carta o su schermo. Accetta i biglietti di qualsiasi organizzatore che vende con ArenaSoldOut.com e quelli dei partner da altri sistemi, così una struttura usa gli stessi telefoni per ogni evento.
related:
  - { label: Biglietti elettronici con EAN-13 e QR, href: /product/tickets }
  - { label: "Strutture e club: una mappa, ogni evento", href: /solutions/venues }
