sections:
  - type: faq
    id: questions
    eyebrow: Posti
    title: Come funzionano i posti con ArenaSoldOut.com?
    items:
      - q: Devo disegnare la mappa io?
        a: "No, mai. Mandaci la mappa e la disegniamo nel tuo evento gratis, di solito entro un giorno. Basta una di queste cose: un PDF della pianta della struttura, una foto di uno schizzo a mano, o una tabella di file con i posti di ogni fila (Excel o Google Sheets). I file vettoriali (SVG) si importano direttamente."
      - q: Un evento può avere posti numerati e posti in piedi?
        a: Sì, in una sola mappa. File riservate con categorie, aree in piedi con quote, ogni categoria con il suo prezzo e la sua finestra di vendita.
      - q: Posso cambiare la mappa dopo l'inizio delle vendite?
        a: Sì. Le mappe hanno versioni, quindi una nuova disposizione per la sessione successiva non tocca i biglietti già venduti.
      - q: Quanto mi costa un biglietto con posto?
        a: "La commissione per un biglietto con posto è US$1,09 (€0,97 nei paesi UE), contro US$0,59 (€0,53) senza posto; i crediti la abbassano. La mappa in sé è gratis. Vedi i [prezzi](/pricing)."
      - q: L'acquirente sceglie il posto da telefono?
        a: Sì. La mappa dei posti è la stessa nel widget e sulla pagina ospitata, con zoom con le dita sui telefoni, una legenda per categoria e un timer di riserva per i posti selezionati.
      - q: E gli inviti e i posti stampa?
        a: Emetti biglietti gratuiti per posti precisi dall'Event Center; si scansionano all'ingresso come qualsiasi biglietto.
