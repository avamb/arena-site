title: "Inizia a vendere: candidati come organizzatore"
description: "Raccontaci la tua organizzazione e i tuoi eventi. Il team configura organizzazione, pagina di vendita e conto di pagamento, di solito entro un giorno."
h1: Inizia a vendere
lead: "Dicci chi sei e dove vendi. Configuriamo la tua organizzazione, la tua pagina di vendita e colleghiamo il tuo conto di pagamento, di solito entro un giorno. Gli eventi senza mappa dei posti vanno in vendita oggi."
sections:
  - type: steps
    id: how
    eyebrow: Cosa succede dopo
    title: Come iniziamo?
    items:
      - title: Invii la richiesta
        text: "Cinque brevi passaggi: contatto, organizzazione, eventi, pagamenti e consenso. Le tue risposte vengono salvate man mano, così puoi uscire e tornare."
      - title: Ti configuriamo
        text: Il team controlla la richiesta, crea la tua organizzazione e la tua pagina di vendita, collega con te il conto di pagamento e, se hai una struttura con posti numerati, disegna gratis la mappa dei posti dal tuo PDF, schizzo a mano o tabella delle file.
      - title: Vai in vendita
        text: Condividi un solo link, oppure metti il widget sul tuo sito. Ogni vendita arriva nel tuo Event Center e nel tuo gruppo Telegram.
