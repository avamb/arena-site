    note: "Prezzi di Weezevent: [weezevent.com/fr/nos-tarifs](https://weezevent.com/fr/nos-tarifs/) e [weezevent.com/en-gb/our-prices](https://weezevent.com/en-gb/our-prices/), verificati l'11 novembre 2026, IVA inclusa come pubblicato. I nostri prezzi: [prezzi](/pricing) e [condizioni dettagliate](/pricing/terms), IVA esclusa. Weezevent è un marchio del suo titolare; ArenaSoldOut.com non è affiliato a esso."

  - type: prose
    id: examples
    title: Che cosa significa la differenza nella pratica?
    body: |
      Tutte le cifre ai prezzi di entrambe le piattaforme all'11 novembre 2026.

      **Liquidità prima dell'evento.** Un festival vende 2.000 biglietti nelle tre settimane prima dell'apertura dei cancelli. Con ArenaSoldOut.com ogni pagamento arriva sul tuo conto nel momento in cui l'ordine è pagato, così paghi palco, audio e sicurezza con il denaro dei biglietti. Con un versamento ogni 15 giorni, una parte di quel denaro arriva dopo che ti serviva.

      **Un teatro con posti numerati.** Da noi la mappa dei posti fa parte di ogni evento: mandi un PDF o la foto di uno schizzo a mano, il team costruisce la mappa gratis, e un biglietto con posto costa {eurSeated}. Su Weezevent i posti numerati sono nell'offerta su misura, con prezzo su richiesta.

      **La commissione in sé.** La nostra è {eurPrice} per biglietto, qualunque sia il prezzo; quella di Weezevent è 2,5% con un minimo di €0,99, spese bancarie incluse. Aggiungi la commissione della carta del tuo fornitore alla nostra per confrontare i totali al prezzo del tuo biglietto.

  - type: cards
    id: more
    eyebrow: Oltre il prezzo
    title: Che cos'altro ottieni con ArenaSoldOut.com?
    items:
      - title: Il denaro direttamente sul tuo conto
        text: "Gli acquirenti pagano sul tuo conto Stripe, Flitt o AllPay. ArenaSoldOut.com non detiene mai fondi e non trattiene nulla dalle tue vendite."
        link: { label: Pagamenti, href: /payments }
      - title: Mappe dei posti disegnate per te, gratis
        text: "Manda un PDF, una foto di uno schizzo a mano o una tabella di file e posti. Il team costruisce la struttura; tu non la disegni mai."
        link: { label: Mappe dei posti, href: /product/seating }
      - title: Tariffa ridotta per i biglietti economici
        text: "Quando ogni biglietto dell'evento costa {eurLowMax} o meno: {lowPercent}% del prezzo del biglietto invece della tariffa fissa. Discoteche, corse, feste per bambini, gite."
        link: { label: Come funziona, href: /pricing#low-price }
      - title: Acquirenti nella propria lingua
        text: "Pagina dell'acquirente, e-mail e biglietti nella lingua dell'acquirente, ebraico da destra a sinistra compreso. Aggiungiamo qualsiasi nuova lingua entro 40 ore."
        link: { label: Biglietti elettronici, href: /product/tickets }
      - title: Ogni vendita nel tuo Telegram
        text: "Crea un evento da una foto della locandina nel bot di Telegram e vedi ogni vendita e rimborso nel tuo gruppo in pochi secondi."
        link: { label: Bot di Telegram, href: /product/telegram }
      - title: Configuri tu, oppure deleghi
        text: "Crei gli eventi nell'Event Center o nel bot di Telegram in pochi minuti; le mappe dei posti le disegniamo gratis. Non hai tempo? Il nostro event manager lo fa per te, come servizio a pagamento."
        link: { label: Event manager, href: /pricing#services }

  - type: faq
    id: questions
    title: Le domande degli organizzatori quando confrontano
    items:
      - q: ArenaSoldOut.com costa meno di Weezevent?
        a: "La nostra commissione è più bassa: {eurPrice} per biglietto contro almeno €0,99 su Weezevent. La commissione di Weezevent include le spese bancarie e la nostra no, quindi aggiungi la commissione della carta del tuo fornitore alla nostra per confrontare i totali al prezzo del tuo biglietto."
      - q: Quando ricevo il denaro dei biglietti?
        a: "A ogni ordine. L'acquirente paga sul tuo conto di pagamento: Stripe, Flitt o AllPay. ArenaSoldOut.com non detiene mai fondi. La nostra commissione è fatturata dopo l'evento o prelevata dai tuoi crediti."
      - q: Offri pagamenti cashless e braccialetti RFID?
        a: "No. ArenaSoldOut.com vende biglietti e li controlla all'ingresso con l'app scanner MACS. Se ti servono pagamenti cashless al bar, tieni un fornitore separato per quello."
      - q: Posso spostare i miei eventi da Weezevent?
        a: "Sì. Crei gli eventi nell'Event Center o nel bot di Telegram in pochi minuti, e noi disegniamo gratis le tue mappe dei posti da un PDF o da uno schizzo. Non hai tempo? Il nostro event manager li sposta per te, come servizio a pagamento. Continua a vendere su Weezevent finché la tua pagina da noi non è pronta."
      - q: Pago un abbonamento?
        a: "No. Paghi solo per i biglietti venduti. Inviti e biglietti gratuiti a eventi a pagamento non hanno commissione."

  - type: cta
    id: start
    title: Provalo sul tuo prossimo evento
    text: Crea l'evento, collega il tuo conto di pagamento, condividi il link.
    primary: { label: Inizia a vendere, href: /start }
    secondary: { label: Vedi i prezzi, href: /pricing }
    note: "Domande? Scrivici: il team risponde entro un giorno lavorativo."
