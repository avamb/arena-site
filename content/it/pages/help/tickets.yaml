title: "Ho comprato un biglietto: dov'è, cosa mostrare all'ingresso"
description: "Il tuo biglietto è un PDF nell'e-mail di conferma con EAN-13 e codice QR; mostralo sul telefono o stampato. Rimborsi e cambi di data: chiedi all'organizzatore."
h1: Aiuto per chi compra i biglietti
lead: Il tuo biglietto è un PDF allegato all'e-mail di conferma, con un codice a barre e un codice QR. Mostralo sul telefono o stampato. Le domande su rimborsi e date vanno all'organizzatore dell'evento, il cui contatto è sulla pagina di vendita e nell'e-mail.
