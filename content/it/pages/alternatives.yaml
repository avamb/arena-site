  - type: prose
    id: how
    title: Come facciamo il confronto
    body: |
      **Solo prezzi pubblicati.** Una riga entra in una tabella solo se abbiamo potuto leggerla sulla pagina dei prezzi o nel centro assistenza dell'altra piattaforma. Il link alla fonte e la data sono sotto ogni tabella.

      **A parità di condizioni.** Alcune piattaforme includono la commissione della carta nella loro commissione; noi no, perché l'acquirente paga sul tuo conto di pagamento e il tuo fornitore applica la propria commissione sulla carta. Ogni pagina dice qual è quale.

      **Che cosa non facciamo.** ArenaSoldOut.com non ha un marketplace dove gli acquirenti sfogliano gli eventi, né pagamenti cashless al bar. L'elenco completo è nella [pagina dei fatti](/facts).

      Hai trovato un prezzo cambiato? [Scrivici](/contact) e correggiamo la pagina.

