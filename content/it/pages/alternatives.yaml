    title: Scegli la piattaforma che usi adesso
    items:
      - title: Eventbrite
        text: "Una percentuale su ogni biglietto più un importo fisso, contro i nostri {usdPrice} fissi. Pagamenti dopo l'evento, contro il denaro sul tuo conto a ogni ordine."
        link: { label: ArenaSoldOut.com e Eventbrite, href: /eventbrite-alternative }
      - title: Ticket Tailor
