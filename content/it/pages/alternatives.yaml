      - title: TicketSpice
        text: "Una tariffa fissa per biglietto su entrambe. La nostra è più bassa, e le mappe dei posti sono incluse in ogni evento invece che in un piano più caro."
        link: { label: ArenaSoldOut.com e TicketSpice, href: /ticketspice-alternative }
      - title: TicketSource
        text: "Una percentuale su ogni prenotazione, contro la nostra tariffa fissa per biglietto. Mappe dei posti disegnate per te invece che da te."
        link: { label: ArenaSoldOut.com e TicketSource, href: /ticketsource-alternative }
      - title: Weezevent
        text: "Il denaro dei biglietti sul tuo conto a ogni ordine invece di un pagamento ogni 15 giorni, e posti numerati su ogni evento."
