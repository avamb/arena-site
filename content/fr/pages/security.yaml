title: "Sécurité sur ArenaSoldOut.com"
description: "Comment ArenaSoldOut.com protège les données des organisateurs et des acheteurs : hébergement dans l'UE, paiement sur la page du prestataire, sauvegardes."
h1: "Sécurité sur ArenaSoldOut.com"
lead: "Nous gérons la vente de billets et les coordonnées des acheteurs pour des organisateurs d'événements, donc nous traitons la sécurité de façon pratique et précise. Voici ce que nous faisons aujourd'hui."
