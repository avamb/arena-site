title: "Tarifs : par billet, sans abonnement"
description: "Commission par billet vendu, sans abonnement. Payez après l'événement ou achetez des crédits à l'avance. Tarifs réduits pour les salles. Invitations gratuites."
h1: Par billet. Sans abonnement.
lead: Vous versez à ArenaSoldOut.com une commission de plateforme par billet vendu. Paiement à l'usage après l'événement, ou achat de crédits à l'avance pour payer moins par billet. Les frais d'encaissement par carte sont réglés à votre propre prestataire de paiement, selon ses conditions.
