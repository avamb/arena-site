  - type: faq
    id: questions
    eyebrow: Questions d'argent
    title: Combien me coûte un billet, exactement ?
    items:
      - q: Combien coûte un billet avec place ?
        a: "Avec paiement après l'événement : US$1,09 hors UE, €0,97 dans l'UE. Un billet sans place coûte US$0,59 ou €0,53. Le plan de salle lui-même ne coûte rien : nous le dessinons gratuitement à partir d'un PDF, d'une photo de croquis à la main ou d'un tableau de rangs et de places. Avec des crédits, la commission est plus basse, et une place ajoute US$0,35 (€0,31) au tarif des crédits."
      - q: Comment fonctionnent les crédits ?
        a: "Vous achetez un pack de crédits une fois. Chaque billet vendu prélève sa commission sur vos crédits au tarif du pack, jusqu'à épuisement. Les crédits n'expirent jamais, peuvent être rechargés à tout moment et servent uniquement à payer nos services : ils ne peuvent ni être retirés ni être transférés."
      - q: Que se passe-t-il si les crédits sont épuisés en cours de vente ?
        a: Les ventes ne s'arrêtent pas. Les billets que vos crédits n'ont pas couverts passent dans la facture habituelle au tarif du paiement après l'événement.
      - q: Existe-t-il une recharge automatique ?
        a: Oui. Vous pouvez l'activer, et lorsque vos crédits passent sous votre seuil, le pack suivant est acheté pour vous.
      - q: Où va l'argent de l'acheteur ?
        a: "Directement sur votre propre compte de paiement, à chaque commande. ArenaSoldOut.com ne détient jamais de fonds. L'acheteur paie le prix du billet et, si vous en ajoutez, vos frais de service."
      - q: Quand dois-je payer ArenaSoldOut.com ?
        a: "Après l'événement, par virement bancaire, pour les billets vendus. Pour les événements en vente pendant plusieurs mois et pour les salles permanentes, une fois par mois. Les crédits se paient à l'achat."
      - q: Et les frais d'encaissement par carte ?
        a: L'encaissement par carte est un contrat entre vous et votre prestataire de paiement, selon les conditions de ce dernier. Il ne fait pas partie de notre commission et nous n'y ajoutons rien.
      - q: Dois-je mentionner ArenaSoldOut.com sur mon site ?
        a: "Les tarifs supposent que la page de l'événement nomme ArenaSoldOut.com comme opérateur de billetterie, avec un lien vers nous ; le widget de billetterie affiche cette ligne par défaut. Pour vendre sans notre nom, la marque blanche coûte €45 par mois par marque ou salle dans les pays de l'UE et US$45 par mois par marque ou salle dans tous les autres pays, facturée au prorata des jours pour un mois incomplet. Les [conditions détaillées](/pricing/terms) expliquent ce qu'est une marque et ce que la marque blanche masque."
      - q: Existe-t-il une remise pour les associations caritatives ?
        a: "Oui. Les associations caritatives enregistrées paient 50% de notre commission, en paiement à l'usage comme avec des crédits. Écrivez-nous depuis la [page de contact](/contact) et nous l'activons pour votre organisation."
      - q: Les invitations sont-elles gratuites ?
        a: Oui. Les invitations et les billets gratuits pour des événements payants ne supportent aucune commission.
      - q: Que devient la commission en cas de remboursement d'un billet ou de report de la date ?
        a: "L'acheteur est remboursé par vous. La commission d'une vente déjà réalisée reste due, et nous ne facturons pas de commission distincte pour le traitement du remboursement, le report de la date ou les e-mails aux acheteurs. Les conditions propres au prestataire de paiement relèvent du prestataire."
      - q: Et si j'annule l'événement ?
        a: "La commission déjà facturée n'est pas restituée en argent. Écrivez-nous au sujet de votre cas avant l'annulation de l'événement."
      - q: Un de mes billets coûte plus de US$10 (€10 dans l'UE), les autres sont bon marché. Quel tarif s'applique ?
        a: "Le tarif standard, pour tous les billets de l'événement : le tarif réduit exige que chaque billet de chaque catégorie et de chaque palier de prix coûte US$10 ou moins (€10 dans l'UE). Un billet à US$5 à côté d'un billet à US$25 est au tarif standard."
      - q: Je possède une salle et j'organise de nombreux événements par mois. Existe-t-il une autre offre ?
        a: "Oui. Les propriétaires de salles permanentes (théâtres, clubs, stades, cirques et autres lieux qui organisent eux-mêmes des événements, toute l'année ou par saison) paient {percent}% du prix du billet, calculé après codes promo et hors vos frais de service. La commission par billet est plafonnée à US$1,09 (€1,09 dans l'UE), identique avec et sans place. Les invitations ne supportent aucune commission. Nous facturons chaque mois. Notre équipe active le statut de salle : écrivez-nous depuis la [page de contact](/contact). Les conditions complètes figurent dans les [conditions détaillées](/pricing/terms)."

