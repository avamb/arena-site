    currencyNote: "Commission en **dollars US** pour tous les pays hors UE, y compris les pays européens hors UE, l'Asie et le Moyen-Orient, et en **euros** pour les salles des pays de l'UE. Le dollar US sert de base ; les prix en euros sont les prix en dollars au taux de la BCE. Il s'agit uniquement de notre commission : les billets sont vendus dans la devise de votre compte de paiement. Montants hors TVA."
