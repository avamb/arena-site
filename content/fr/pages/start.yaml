title: "Commencer à vendre : candidature d'organisateur"
description: "Parlez-nous de votre organisation et de vos événements. L'équipe configure organisation, page de vente et compte de paiement, en général en un jour."
h1: Commencer à vendre
lead: "Dites-nous qui vous êtes et où vous vendez. Nous configurons votre organisation et votre page de vente, et connectons votre compte de paiement, en général sous un jour. Les événements sans plan de salle sont en vente aujourd'hui."
sections:
  - type: steps
    id: how
    eyebrow: La suite
    title: Comment commencer ?
    items:
      - title: Vous envoyez la candidature
        text: "Cinq courtes étapes : contact, organisation, événements, paiements et consentement. Vos réponses sont enregistrées au fur et à mesure, vous pouvez donc partir et revenir."
      - title: Nous vous configurons
        text: L'équipe vérifie la candidature, crée votre organisation et votre page de vente, connecte avec vous votre compte de paiement et, si vous avez une salle à places numérotées, dessine gratuitement le plan à partir de votre PDF, croquis à la main ou tableau de rangs.
      - title: Vous mettez en vente
        text: Partagez un seul lien, ou placez le widget sur votre site. Chaque vente arrive dans votre Event Center et dans votre groupe Telegram.
  - type: onboarding
    id: form
    mode: apply
    eyebrow: Candidature
    title: Parlez-nous de vous
