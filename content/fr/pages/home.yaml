  - type: steps
    id: how
    eyebrow: Comment ça marche
    title: En vente dès aujourd'hui. Trois questions que les organisateurs posent d'abord.
    items:
      - title: En combien de temps puis-je ouvrir la vente ?
        text: "Un événement sans plan de salle est en vente en 10 minutes une fois votre organisation confirmée et votre compte de paiement connecté ; vous le connectez une seule fois. Pour une salle avec places numérotées, envoyez-nous votre plan : nous le dessinons gratuitement, en général sous un jour."
      - title: De quoi ai-je besoin ?
        text: "Le nom et le calendrier de l'événement, vos prix de billets, votre affiche, et votre propre compte de paiement : Stripe, Flitt, AllPay ou un autre prestataire de votre pays. L'argent vous revient dès le premier billet."
      - title: Comment le configurer ?
        text: "Dans le navigateur, sur ordinateur ou téléphone, dans l'« Event Center »*. Ou dans Telegram, où le bot lit votre affiche et remplit les dates, les prix et la salle pour que vous confirmiez. Pas le temps ? Notre [gestionnaire d'événements](/pricing#services) s'en charge pour vous, en service payant."
    note: "* L'« Event Center » est votre compte d'organisateur sur ArenaSoldOut.com : chaque événement, commande, remboursement, invitation et séance, pour vous et votre équipe, dans le navigateur et dans Telegram. [Voir l'Event Center plus bas →](#center) Chaque étape, de la demande au scanner : [votre premier événement →](/first-event)"

  - type: ways
    id: where
    eyebrow: Où vous vendez
    title: Sur votre site, sur notre page, chez vos partenaires et sur les réseaux sociaux. L'argent vous revient dans tous les cas.
    items:
      - title: Votre site
        text: "Votre site est la caisse. Intégrez le widget de billetterie sur n'importe quelle page : WordPress, Tilda, Wix, Webflow ou code sur mesure. Les acheteurs ne quittent jamais votre domaine."
        bullets:
          - Widget sur n'importe quel site, trois lignes de code
          - Intégration WordPress
          - Vos couleurs, vos polices, votre langue
      - title: Notre page de vente
        text: "Nous hébergeons la page de vente : tickets.arenasoldout.com/your-name/your-event. Un seul lien pour l'affiche, la newsletter et les messageries."
        bullets:
          - Une page par organisateur et par événement
          - Prête en quelques minutes, sans travail de design
          - Liens vers vos revendeurs partenaires sur la même page
      - title: Sites partenaires
        text: "Le même widget s'installe sur le site d'une salle, d'un promoteur ou d'une agence. Chaque promoteur a sa propre page de vente et son propre lien."
        bullets:
          - Widget sur le site d'un partenaire
          - Une page et un lien distincts pour chaque promoteur
          - Toutes les ventes des partenaires dans un seul Event Center
      - title: Réseaux sociaux et messageries
        text: "Un lien de vente sur Instagram, Facebook, Telegram et WhatsApp, sur l'affiche et dans la newsletter. À l'entrée, un QR code avec un lien court : on le scanne et on achète son billet sur place."
        bullets:
          - Un seul lien pour tous les canaux
          - Un QR code sur l'affiche et à l'entrée
          - Les sources des ventes grâce aux balises UTM

  - type: qa
    id: answers
    eyebrow: Fonctions
    title: Tout ce dont un organisateur a besoin, sur une seule plateforme
    more: { label: Toutes les fonctions →, href: /features }
    items:
      - title: Codes promo
        text: Un code peut s'appliquer à un événement, une séance ou une catégorie, avec une période de validité, un minimum et une limite par acheteur.
      - title: Des prix qui changent tout seuls
        text: Les périodes de prévente changent selon la date et l'heure. Les paliers de quantité ouvrent le prix suivant quand le palier en cours est épuisé.
        visual:
          type: ladder
          rungs:
            - { price: US$24, width: 100, label: les 100 premiers · vendus }
            - { price: US$119, width: 62, label: les 150 suivants · en vente }
            - { price: US$599, width: 0, label: ouvre ensuite, next: true }
      - title: Catégories et billets gratuits
        text: Des catégories avec leur propre prix, leur propre quota et leur propre période de vente, plus des billets gratuits et à prix libre.
      - title: Vos propres frais de service
        text: "Un pourcentage par canal de vente, affiché à l'acheteur sur une ligne distincte et versé sur votre compte avec le billet : ils sont entièrement à vous. Vérifiez que votre pays autorise des frais de service sur la vente de billets."
      - title: Places numérotées et places debout
        text: "Un plan de salle avec catégories et des zones debout avec quotas, dans un même événement. Envoyez-nous le plan de votre salle et nous le dessinons gratuitement dans le système, en général sous un jour : un PDF, une photo d'un croquis à la main ou un tableau de rangs avec les places de chaque rang (Excel ou Google Sheets) suffit. Vous ne le saisissez jamais à la main."
        visual:
          type: plan
          aria: Plan de salle avec parterre, deux loges, un balcon et une zone debout
          stage: Scène
          parterre: Parterre · 312
          logeLeft: Loge gauche · 48
          logeRight: Loge droite · 48
          balcony: Balcon · 180
          standing: Debout
      - title: Billets et entrée
        text: Chaque billet est un PDF avec un code-barres EAN-13 et un QR code, dans la langue de l'acheteur. Scannez à l'entrée avec l'application de scan pour iOS et Android ou avec un scanner portable. L'application accepte aussi les billets vendus par vos partenaires dans d'autres systèmes.
        visual:
          type: ticket
          event: Autumn Jazz Night
          meta: ven. 24 oct. · 19:30 · Palác Akropolis
          seat: Parterre · Rang G · Place 7
          code: "2173049188256"
      - title: Les ventes en temps réel
        text: "Dans votre « Event Center », votre propre compte sur ce site : ouvrez-le sur un téléphone ou un ordinateur, rien à installer. Tous vos événements, chaque commande, les remboursements et les totaux par séance, visibles uniquement par vous et votre équipe. Les balises UTM montrent d'où viennent les acheteurs. Vous préférez Telegram ? Chaque vente et chaque remboursement arrive aussi dans votre groupe Telegram en quelques secondes, avec les coordonnées de l'acheteur. [Voir l'Event Center plus bas →](#center)"
        visual:
          type: telegram
          from: ArenaSoldOut.com
          lines:
            - "**Payé** · Autumn Jazz Night · ven. 24 oct."
            - Rang G 7–8 · Parterre
            - "**€76.00** · Anna K. · +420 ••• 41 18"
          time: "19:42"
      - title: Remboursements, invitations, changements de date
        text: "Tout se fait depuis votre compte « Event Center » : remboursez un billet, émettez des invitations, reportez ou annulez une séance. Si un événement est annulé ou reporté, c'est vous qui décidez : rembourser tout le monde ou proposer une nouvelle date. Les acheteurs reçoivent un e-mail dans leur langue avec le billet mis à jour."
      - title: Fiabilité
        text: 800 commandes par minute avec 1 000 acheteurs simultanés sur la page lors des tests de charge, sauvegardes chiffrées chaque nuit, un système de surveillance qui veille sur la plateforme jour et nuit.
      - title: Un QR code à l'entrée
        text: Imprimez un QR code avec un lien d'achat court et affichez-le à l'entrée. On le scanne et on achète son billet sur place, même en arrivant sans billet.
      - title: API sur demande
        text: L'API, les webhooks et l'import d'événements en un seul appel sont mis en place sur demande, quand vos ventes doivent communiquer avec votre propre système.

