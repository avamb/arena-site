  - type: money
    id: money
    eyebrow: Argent
    title: Les acheteurs vous paient. Pas nous.
    lead: 100% de chaque vente vous revient. L'acheteur paie le prix du billet, et les frais de service si vous en ajoutez, directement sur votre propre compte de paiement, dans votre devise, sur votre relevé. ArenaSoldOut.com ne détient jamais votre argent. Vous versez à ArenaSoldOut.com la commission de plateforme par billet vendu, après l'événement ou à partir d'un forfait prépayé. Les remboursements et les rétrofacturations sont votre décision, pas une politique de la plateforme.
    flowAria: Flux de paiement
    nodes:
      - { label: Acheteur, sub: "carte, Apple Pay, Google Pay" }
      - { label: Votre site, sub: ou la page de vente que nous hébergeons }
      - { label: ArenaSoldOut.com, sub: "commande, places, billet" }
      - { label: Votre compte de paiement, providers: true, highlight: true }
      - { label: Votre banque, sub: selon le calendrier du prestataire }
    note: Vous versez à ArenaSoldOut.com la commission de plateforme par billet vendu. Rien n'est déduit de vos ventes, rien n'est retenu.

