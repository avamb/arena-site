  - type: faq
    id: faq
    eyebrow: Questions
    title: Ce que demandent les organisateurs
    items:
      - q: Combien coûte le démarrage ?
        a: "Rien. Pas d'abonnement, aucun paiement mensuel ou annuel supplémentaire. Vous payez une commission par billet vendu, à partir de {usdPrice}. Les invitations et les billets gratuits sont sans commission. [Tarifs et calculateur →](/pricing)"
      - q: Y a-t-il des paiements supplémentaires, mensuels ou annuels ?
        a: Non. Aucun paiement mensuel ou annuel, aucun abonnement. Vous payez seulement une commission par billet vendu.
      - q: Je vends mes billets sur WhatsApp et les acheteurs m'appellent. Pourquoi passer par une plateforme de billetterie ?
        a: "Pour ne plus prendre chaque commande à la main. Les acheteurs choisissent leurs places et paient à toute heure, même la nuit ; l'argent arrive directement sur votre compte et le billet avec son QR code dans la boîte mail de l'acheteur. Vous pouvez continuer à partager le lien de vente sur WhatsApp : votre temps va à l'événement, plus aux messages et aux listes."
      - q: Qui paie les frais de service, moi ou l'acheteur ?
        a: C'est vous qui décidez. Vous pouvez ajouter vos propres frais de service au prix du billet, et ils vous reviennent en totalité avec le paiement. Notre commission par billet reste la même.
      - q: Quand est-ce que je reçois l'argent ?
        a: À chaque commande. L'acheteur paie directement sur votre compte de paiement ; ArenaSoldOut.com ne détient jamais l'argent. Les virements vers votre banque suivent le calendrier de votre prestataire.
      - q: Puis-je intégrer la vente de billets à mon propre site ?
        a: "Oui. Le widget de billetterie s'installe sur n'importe quelle page en trois lignes de code : WordPress, Tilda, Wix, Webflow ou code sur mesure. Les acheteurs choisissent leurs places et leurs billets directement sur votre site. [Pour les développeurs →](/developers)"
      - q: Comment se passe le contrôle d'accès le jour de l'événement ?
        a: "Chaque billet est un PDF avec un QR code et un code-barres EAN-13. À l'entrée, l'application MACS pour iOS et Android scanne les billets sur un simple téléphone ; un scanner portable convient également. L'application accepte aussi les billets vendus par vos partenaires dans d'autres systèmes. [Application de contrôle MACS →](/product/scanner)"
      - q: Peut-on acheter un billet directement à l'entrée ?
        a: Oui. Imprimez un QR code avec un lien d'achat court et affichez-le à l'entrée. On le scanne avec son téléphone et on achète son billet sur place.
      - q: Que se passe-t-il si l'événement est annulé ou reporté ?
        a: "C'est vous qui décidez : rembourser tous les acheteurs, proposer une nouvelle date à la place du remboursement, ou choisir une autre solution. Les acheteurs reçoivent un e-mail dans leur langue avec le billet mis à jour."
      - q: Puis-je voir d'où viennent les acheteurs ?
        a: Oui. Ajoutez des balises UTM à vos liens de vente et l'Event Center montre quel canal a apporté les commandes.
      - q: Je n'ai jamais vendu de billets. Est-ce pour moi ?
        a: "Oui. Nous vous guidons pas à pas : [votre premier événement →](/first-event). Nous dessinons gratuitement votre plan de salle. Pas le temps ? Notre [gestionnaire d'événements](/pricing#services) s'en charge pour vous, en service payant."
      - q: Comment joindre l'équipe ArenaSoldOut.com si j'ai une question ?
        a: "Écrivez-nous sur Telegram, via le [formulaire du site](/contact#write) ou à hello@arenasoldout.com. Ce sont des personnes de l'équipe qui vous répondent."

