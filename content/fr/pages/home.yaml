  - type: reasons
    id: why
    eyebrow: Pourquoi ArenaSoldOut.com
    title: Pourquoi les organisateurs vendent-ils leurs billets chez nous ?
    lead: "Quatre raisons, chacune avec les faits qui la soutiennent."
    items:
      - icon: wallet
        title: Vous gardez plus sur chaque billet
        text: "Un forfait de **{price}** par billet, et non un pourcentage de votre chiffre d'affaires : un billet à $15 et un billet à $150 vous coûtent la même chose. Les acheteurs paient sur votre propre compte de paiement : l'argent est à vous dès qu'ils paient, pas après l'événement."
        bullets:
          - Rien n'est déduit de vos ventes, aucune réserve retenue
          - Aucune commission sur les invitations et les billets gratuits
          - Votre plan de salle dessiné gratuitement par nos soins
        link: { label: Tarifs et calculateur →, href: /pricing }
      - icon: clock
        title: En vente en 10 minutes
        text: "Une fois votre organisation confirmée, en général sous un jour, un événement sans plan de salle est en vente en **10 minutes**, si vous avez déjà un compte chez un prestataire de paiement. Vous connectez ce compte une seule fois ; chaque événement suivant ne demande que son nom, ses dates et ses prix."
        link: { label: "Votre premier événement, étape par étape →", href: /first-event }
      - icon: list-checks
        title: Ce que demandent les organisateurs, déjà inclus
        text: "Aucun module à acheter, aucun plugin à installer :"
        bullets:
          - Widget sur votre site, ou page de vente que nous hébergeons
          - Places assises et places debout dans un même événement
          - Codes promo, prix qui changent selon la date
          - Invitations, remboursements, dates reportées avec e-mails aux acheteurs
          - Application de scan pour iOS et Android
          - Chaque vente dans votre groupe Telegram en quelques secondes
        link: { label: Les réponses en détail →, href: "#answers" }
      - icon: shield-check
        title: De la billetterie depuis {since}
        text: "Des organisateurs dans **{countries}** pays depuis {since} : concerts, théâtres, festivals, spectacles, masterclasses. **800** commandes par minute lors des tests de charge, sauvegardes chiffrées chaque nuit, un système de surveillance qui alerte l'équipe avant que vous ne remarquiez quoi que ce soit."
        link: { label: Clients et témoignages →, href: /clients }

  - type: steps
    id: how
    eyebrow: Comment ça marche
    title: En vente dès aujourd'hui. Trois questions que les organisateurs posent d'abord.
    items:
      - title: En combien de temps puis-je ouvrir la vente ?
        text: "Un événement sans plan de salle est en vente en 10 minutes une fois votre organisation confirmée et votre compte de paiement connecté ; vous le connectez une seule fois. Pour une salle avec places numérotées, envoyez-nous votre plan : nous le dessinons gratuitement, en général sous un jour."
      - title: De quoi ai-je besoin ?
        text: "Le nom et le calendrier de l'événement, vos prix de billets, votre affiche, et votre propre compte de paiement : Stripe, Flitt, AllPay ou un autre prestataire de votre pays. L'argent vous revient dès le premier billet."
      - title: Comment le configurer ?
        text: "Dans le navigateur, sur ordinateur ou téléphone, dans l'« Event Center »*. Ou dans Telegram, où le bot lit votre affiche et remplit les dates, les prix et la salle pour que vous confirmiez. Ou envoyez-nous le tout et nous le configurons."
    note: "* L'« Event Center » est votre compte d'organisateur sur ArenaSoldOut.com : chaque événement, commande, remboursement, invitation et séance, pour vous et votre équipe, dans le navigateur et dans Telegram. [Voir l'Event Center plus bas →](#center) Chaque étape, de la demande au scanner : [votre premier événement →](/first-event)"

  - type: ways
    id: where
    eyebrow: Où vous vendez
    title: Votre site, ou le nôtre. L'argent vous revient dans les deux cas.
    items:
      - title: Vous avez un site
        text: "Votre site est la caisse. Intégrez le widget de billetterie sur n'importe quelle page : WordPress, Tilda, Wix, Webflow ou code sur mesure. Les acheteurs ne quittent jamais votre domaine."
        bullets:
          - Widget sur n'importe quel site, trois lignes de code
          - Plugin WordPress avec commandes WooCommerce
          - Vos couleurs, vos polices, votre langue
      - title: Vous n'avez pas de site
        text: "Nous hébergeons la page de vente : tickets.arenasoldout.com/your-name/your-event. Partagez un seul lien sur les réseaux sociaux, les messageries et sur l'affiche."
        bullets:
          - Une page par organisateur et par événement
          - Une page distincte pour chaque promoteur
          - Prête en quelques minutes, sans travail de design
          - Liens vers vos revendeurs partenaires sur la même page

  - type: qa
    id: answers
    eyebrow: Ce que les organisateurs demandent ensuite
    title: Oui. Et voici comment.
    items:
      - title: Puis-je utiliser des codes promo ?
        text: Oui. Un code peut s'appliquer à un événement, une séance ou une catégorie, avec une période de validité, un minimum et une limite par acheteur.
      - title: Les prix peuvent-ils changer à une date que je choisis ?
        text: Oui. Les périodes de prévente changent selon la date et l'heure. Les paliers de quantité ouvrent le prix suivant quand le palier en cours est épuisé.
        visual:
          type: ladder
          rungs:
            - { price: US$24, width: 100, label: les 100 premiers · vendus }
            - { price: US$119, width: 62, label: les 150 suivants · en vente }
            - { price: US$599, width: 0, label: ouvre ensuite, next: true }
      - title: Plusieurs prix pour un même événement ?
        text: Oui. Des catégories avec leur propre prix, leur propre quota et leur propre période de vente, plus des billets gratuits et à prix libre.
      - title: Puis-je ajouter des frais de service ?
        text: Oui. Un pourcentage par canal de vente, affiché à l'acheteur sur une ligne distincte et versé sur votre compte avec le billet. Vérifiez que votre pays autorise des frais de service sur la vente de billets.
      - title: Avec places numérotées et sans ?
        text: "Oui, et les deux dans un même événement : un plan de salle avec catégories, des zones debout avec quotas. Envoyez-nous le plan de votre salle et nous le dessinons gratuitement dans le système, en général sous un jour : un PDF, une photo d'un croquis à la main ou un tableau de rangs avec les places de chaque rang (Excel ou Google Sheets) suffit. Vous ne le saisissez jamais à la main."
        visual:
          type: plan
          aria: Plan de salle avec parterre, deux loges, un balcon et une zone debout
          stage: Scène
          parterre: Parterre · 312
          logeLeft: Loge gauche · 48
          logeRight: Loge droite · 48
          balcony: Balcon · 180
          standing: Debout
      - title: Un scanner fonctionne-t-il avec les billets ?
        text: Oui. Chaque billet est un PDF avec un code-barres EAN-13 et un QR code, dans la langue de l'acheteur. Scannez à l'entrée avec l'application de scan pour iOS et Android ou avec un scanner portable. L'application accepte aussi les billets vendus par vos partenaires dans d'autres systèmes.
        visual:
          type: ticket
          event: Autumn Jazz Night
          meta: ven. 24 oct. · 19:30 · Palác Akropolis
          seat: Parterre · Rang G · Place 7
          code: "2173049188256"
      - title: Comment suivre mes ventes ?
        text: "Dans votre « Event Center », votre propre compte sur ce site : ouvrez-le sur un téléphone ou un ordinateur, rien à installer. Tous vos événements, chaque commande, les remboursements et les totaux par séance, visibles uniquement par vous et votre équipe. Vous préférez Telegram ? Chaque vente et chaque remboursement arrive aussi dans votre groupe Telegram en quelques secondes, avec les coordonnées de l'acheteur. [Voir l'Event Center plus bas →](#center)"
        visual:
          type: telegram
          from: ArenaSoldOut.com
          lines:
            - "**Payé** · Autumn Jazz Night · ven. 24 oct."
            - Rang G 7–8 · Parterre
            - "**€76.00** · Anna K. · +420 ••• 41 18"
          time: "19:42"
      - title: Remboursements, invitations, changements de date ?
        text: "Oui, depuis votre compte « Event Center ». Remboursez un billet, émettez des invitations, reportez ou annulez une séance : les acheteurs reçoivent un e-mail dans leur langue avec le billet mis à jour."
      - title: Peut-elle tenir la charge d'un stade ?
        text: Oui. 800 commandes par minute avec 1 000 acheteurs simultanés sur la page lors des tests de charge, sauvegardes chiffrées chaque nuit, un système de surveillance qui nous alerte avant que vous ne remarquiez quoi que ce soit.

