title: "Alternative à Weezevent : l'argent à chaque commande"
description: "Comparez ArenaSoldOut.com et Weezevent : argent des billets sur votre compte à chaque commande plutôt que tous les 15 jours, plans de salle partout."
h1: Une alternative à Weezevent qui vous paie à chaque commande
lead: "Chez Weezevent, l'argent des billets est encaissé par Weezevent et versé tous les 15 jours. Chez ArenaSoldOut.com, l'acheteur paie directement sur votre propre compte de paiement, et les plans de salle font partie de chaque événement. Voici les deux offres côte à côte, telles que publiées le 11 novembre 2026."
related:
  - { label: Toutes les comparaisons, href: /alternatives, text: "ArenaSoldOut.com face aux autres plateformes de billetterie." }
  - { label: Paiements, href: /payments, text: "Les comptes de paiement que vous pouvez connecter, par pays." }
  - { label: Plans de salle, href: /product/seating, text: "Nous dessinons votre salle gratuitement à partir d'un PDF ou d'un croquis." }
sections:
  - type: compare
    id: prices
    eyebrow: Prix en euros
    title: Comment les deux offres se comparent-elles ?
    lead: "Prix des deux plateformes au 11 novembre 2026. Notre commission par billet vendu à côté de la commission de Weezevent pour la billetterie en ligne. La commission de Weezevent inclut les frais bancaires ; chez nous, les frais de carte sont facturés par votre propre prestataire de paiement, à votre taux, en plus de notre commission."
    cols: { what: "", us: ArenaSoldOut.com, them: Weezevent }
    rows:
      - { what: "Comment les frais sont calculés", us: "Forfait par billet", them: "2,5% du prix du billet, au moins €0,99" }
