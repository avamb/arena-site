    note: "Tarifs de Weezevent : [weezevent.com/fr/nos-tarifs](https://weezevent.com/fr/nos-tarifs/) et [weezevent.com/en-gb/our-prices](https://weezevent.com/en-gb/our-prices/), vérifiés le 11 novembre 2026, TVA incluse comme publié. Nos tarifs : [tarifs](/pricing) et [conditions détaillées](/pricing/terms), hors TVA. Weezevent est une marque de son propriétaire ; ArenaSoldOut.com n'est pas affilié à celui-ci."

  - type: prose
    id: examples
    title: Que change la différence en pratique ?
    body: |
      Tous les chiffres sont calculés aux prix des deux plateformes au 11 novembre 2026.

      **De la trésorerie avant l'événement.** Un festival vend 2 000 billets dans les trois semaines avant l'ouverture des portes. Avec ArenaSoldOut.com, chaque paiement arrive sur votre propre compte dès que la commande est payée : vous réglez la scène, le son et la sécurité avec l'argent des billets. Avec un versement tous les 15 jours, une partie de cet argent arrive après que vous en avez eu besoin.

      **Un théâtre avec des places numérotées.** Chez nous, le plan de salle fait partie de chaque événement : vous envoyez un PDF ou une photo d'un croquis à la main, l'équipe construit le plan gratuitement, et un billet avec place coûte {eurSeated}. Chez Weezevent, les places numérotées relèvent de l'offre sur mesure, au prix sur demande.

      **La commission elle-même.** La nôtre est de {eurPrice} par billet quel que soit son prix ; celle de Weezevent est de 2,5% avec un minimum de €0,99, frais bancaires inclus. Ajoutez les frais de carte de votre prestataire de paiement à la nôtre pour comparer les totaux au prix de votre billet.

  - type: cards
    id: more
    eyebrow: Au-delà du prix
    title: Qu'obtenez-vous d'autre avec ArenaSoldOut.com ?
    items:
      - title: L'argent directement sur votre compte
        text: "Les acheteurs paient sur votre propre compte Stripe, Flitt ou AllPay. ArenaSoldOut.com ne détient jamais de fonds et ne déduit rien de vos ventes."
        link: { label: Paiements, href: /payments }
      - title: Plans de salle dessinés pour vous, gratuitement
        text: "Envoyez un PDF, une photo d'un croquis à la main ou un tableau de rangs et de places. L'équipe construit la salle ; vous ne la dessinez jamais vous-même."
        link: { label: Plans de salle, href: /product/seating }
      - title: Tarif réduit pour les billets bon marché
        text: "Quand chaque billet de l'événement coûte {eurLowMax} ou moins : {lowPercent}% du prix du billet au lieu du forfait. Soirées, courses, fêtes d'enfants, excursions."
        link: { label: Comment ça marche, href: /pricing#low-price }
      - title: Des acheteurs dans leur propre langue
        text: "Page de l'acheteur, e-mails et billets dans la langue de l'acheteur, hébreu de droite à gauche compris. Nous ajoutons toute nouvelle langue sous 40 heures."
        link: { label: Billets électroniques, href: /product/tickets }
      - title: Chaque vente dans votre Telegram
        text: "Créez un événement à partir d'une photo d'affiche dans le bot Telegram et voyez chaque vente et chaque remboursement dans votre groupe en quelques secondes."
        link: { label: Bot Telegram, href: /product/telegram }
      - title: Configurez vous-même, ou déléguez
        text: "Vous créez vous-même les événements, les prix et les catégories dans l'Event Center ou le bot Telegram, en quelques minutes ; nous dessinons les plans de salle gratuitement. Pas le temps ? Notre gestionnaire d'événements s'en charge pour vous, en service payant."
        link: { label: Services complémentaires, href: /pricing#services }

  - type: faq
    id: questions
    title: Les questions des organisateurs qui comparent
    items:
      - q: ArenaSoldOut.com est-il moins cher que Weezevent ?
        a: "Notre commission est plus basse : {eurPrice} par billet contre au moins €0,99 chez Weezevent. La commission de Weezevent inclut les frais bancaires et la nôtre non : ajoutez les frais de carte de votre prestataire de paiement à la nôtre pour comparer les totaux au prix de votre billet."
      - q: Quand ai-je l'argent des billets ?
        a: "À chaque commande. L'acheteur paie sur votre propre compte de paiement : Stripe, Flitt ou AllPay. ArenaSoldOut.com ne détient jamais de fonds. Notre commission est facturée après l'événement ou prélevée sur vos crédits."
      - q: Proposez-vous le paiement sans espèces et les bracelets RFID ?
        a: "Non. ArenaSoldOut.com vend des billets et les contrôle à l'entrée avec l'application de scan MACS. Si vous avez besoin du paiement sans espèces au bar, gardez un prestataire distinct pour cela."
      - q: Puis-je transférer mes événements depuis Weezevent ?
        a: "Oui. Vous créez vos événements dans l'Event Center ou le bot Telegram, nous dessinons vos plans de salle gratuitement, et vous continuez à vendre sur Weezevent jusqu'à ce que votre page chez nous soit prête. Pas le temps de tout configurer vous-même ? Notre [gestionnaire d'événements](/pricing#services) s'en charge pour vous, en service payant."
      - q: Dois-je payer un abonnement ?
        a: "Non. Vous ne payez que les billets vendus. Les invitations et les billets gratuits pour des événements payants ne supportent aucune commission."

