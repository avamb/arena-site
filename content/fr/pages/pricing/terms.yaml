title: "Conditions tarifaires détaillées"
description: "Commission de plateforme : après l'événement, crédits, billets jusqu'à US$10, associations 50% de remise, salles, marque blanche €45/US$45 par mois, devise."
h1: Conditions détaillées
lead: Les conditions qui sous-tendent le prix par billet. Conditions standard ; conditions de volume et conditions individuelles sur demande. Tous les montants sont hors TVA.
sections:
  - type: prose
    id: terms
    body: |
      ## Ce que nous facturons

      La commission de plateforme est facturée par billet vendu, et non en pourcentage de votre chiffre d'affaires, sauf dans les deux cas ci-dessous. Un billet à US$15 et un billet à US$150 vous coûtent la même chose. Les invitations et les billets gratuits pour des événements payants ne supportent aucune commission.

      ## Paiement après l'événement

      US$0,62 par billet sans place et US$1,18 par billet avec une place choisie sur le plan de salle (€0,55 et €1,05 pour les salles des pays de l'UE).

      Les prix sont fixés en dollars US. Les prix en euros sont les prix en dollars convertis au taux de référence de la Banque centrale européenne (1 EUR = 1,1193 USD au 9 novembre 2026) et arrondis au centime ; la [page des tarifs](/pricing) affiche les deux. Deux montants ne sont pas convertis : le seuil pour les événements à billets bon marché est de €10, et le plafond pour les salles permanentes est de €1,09. Nous facturons après l'événement, pour les billets vendus, et vous payez par virement bancaire. Pour les événements en vente pendant plusieurs mois et pour les salles permanentes, nous facturons une fois par mois. Le paiement après l'événement est ouvert aux organisations confirmées sur la plateforme. Les frais d'encaissement par carte sont réglés à votre prestataire de paiement selon ses propres conditions.

      ## Crédits

      Vous achetez un pack de crédits une fois, et chaque billet prélève sa commission sur vos crédits au tarif de ce pack. Une place ajoute US$0,35 (€0,31) au tarif des crédits. Les crédits sont de l'argent sur votre compte : ils n'expirent jamais, vous pouvez acheter des packs de crédits aussi souvent que vous le souhaitez, et ils servent uniquement à payer nos services. Ils ne peuvent être ni retirés, ni transférés, ni encaissés. Si les crédits sont épuisés en cours de vente, les ventes ne s'arrêtent pas : les billets qu'ils n'ont pas couverts sont facturés au tarif du paiement après l'événement. Vous pouvez activer une recharge automatique. Les packs de crédits et leurs tarifs figurent sur la [page des tarifs](/pricing#packages).

      ## Associations caritatives enregistrées

      Les associations caritatives enregistrées paient 50% de la commission indiquée sur cette page, en paiement à l'usage comme avec des crédits. Notre équipe active la remise pour votre organisation une fois l'enregistrement vérifié : écrivez-nous depuis la [page de contact](/contact).

      ## Événements où chaque billet coûte US$10 ou moins

      Le tarif réduit est une propriété de l'événement entier : il s'applique uniquement si le prix le plus élevé d'un billet de l'événement, avant codes promo, est de US$10 ou moins, **US$10 inclus** (€10 dans les pays de l'UE). Toutes les catégories et tous les paliers de prix comptent, y compris ceux ajoutés plus tard. S'il existe un billet au-dessus, le tarif standard s'applique à tous les billets de l'événement, y compris les moins chers : un événement avec des billets à US$5 et à US$25 est au tarif standard. Le taux est de 4% du prix du billet, au minimum US$0,10 et au maximum US$0,35 par billet, et US$0,20 de plus pour un billet avec place (dans les pays de l'UE : au minimum €0,09, au maximum €0,31, €0,18 de plus avec une place).

      ## Salles permanentes

      Les salles qui organisent elles-mêmes des événements, toute l'année ou par saison, paient 2% du prix du billet (après codes promo, hors frais de service), au maximum US$1,18 par billet (€1,09 dans les pays de l'UE), identique avec et sans place. Nous facturons chaque mois. Le statut de salle est activé par notre équipe : écrivez-nous depuis la [page de contact](/contact).

      ## Opérateur de billetterie sur la page de l'événement, ou marque blanche

      Les tarifs de cette page supposent que la page où vous vendez nomme ArenaSoldOut.com comme opérateur de billetterie, avec un lien vers arenasoldout.com. Une ligne telle que « Billets : ArenaSoldOut.com » à côté des billets suffit, et le widget de billetterie affiche une telle ligne par défaut : avec le widget, il n'y a rien à ajouter. Les pages de vente que nous hébergeons portent toujours notre nom.

      Si vous préférez vendre sans nous nommer, la marque blanche coûte **€45 par mois par marque ou salle** dans les pays de l'UE et **US$45 par mois par marque ou salle** dans tous les autres pays, dans la devise de votre commission. Une marque est le promoteur de l'événement, ou votre organisation pour les événements sans promoteur : deux promoteurs qui vendent tous deux sans notre nom font deux marques. Une salle permanente qui vend sans notre nom paie pour elle-même comme une seule marque. Un mois incomplet est facturé au prorata des jours. Ce montant est une ligne de votre facture mensuelle ; les crédits ne le paient pas.

      Tant que la marque blanche est activée, la ligne du widget, le pied de page de votre boutique et la ligne de la plateforme dans les e-mails aux acheteurs disparaissent, et les e-mails partent sous le nom de la marque. Ce qui reste : les pages de vente que nous hébergeons, les liens vers les conditions et la politique de confidentialité de la plateforme au paiement et les coordonnées du vendeur, comme l'exige la loi. Notre équipe active et désactive la marque blanche pour une marque à partir d'une date de votre choix : écrivez-nous depuis la [page de contact](/contact).

      ## Remboursements, changements de date et annulation

      Lorsqu'un acheteur rend un billet, le remboursement est versé à l'acheteur par vous, l'organisateur. La commission d'une vente déjà réalisée reste due. Nous ne facturons pas de commission distincte pour le traitement d'un remboursement, le report de la date ou les e-mails aux acheteurs. Les conditions propres au prestataire de paiement s'appliquent telles que le prestataire les énonce. Si un événement est annulé, la commission déjà facturée n'est pas restituée en argent.

      ## Devise

      La commission est en dollars US pour tous les pays hors UE, y compris les pays européens hors UE, l'Asie et le Moyen-Orient, et en euros pour les salles des pays de l'UE. Les prix en euros sont les prix en dollars US au taux de la BCE indiqué ci-dessus. La devise de la commission ne change pas la devise dans laquelle vous vendez les billets. Si une organisation possède des salles dans les deux groupes, elle obtient deux comptes.

      ## Rapports

      L'Event Center fournit des totaux par séance et un rapport CSV détaillé par séance. Les exports vers votre CRM ou votre logiciel de comptabilité sont configurés sur demande.

      ## Confidentialité

      ArenaSoldOut.com traite les données des acheteurs pour le compte de l'organisateur, aux fins de la vente et de la remise des billets. La [politique de confidentialité](/legal/privacy) décrit ce qui est traité et pendant combien de temps ; les [conditions générales](/legal/terms) constituent le contrat de l'organisateur.
