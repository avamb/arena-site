title: "Billetterie en Suisse : TWINT, CHF et Stripe"
description: "Vendez des billets en Suisse en francs suisses via votre propre compte Stripe, avec TWINT et cartes. Plans de salle dessinés gratuitement."
h1: "Billetterie pour les événements en Suisse"
lead: "Les acheteurs en Suisse paient en francs avec TWINT ou par carte, et l'argent de chaque billet arrive sur votre propre compte Stripe."
related:
  - { label: "Tous les pays", href: "/countries", text: "Prestataires, devises et moyens de paiement par pays." }
  - { label: "Tournées de concerts", href: "/solutions/concert-tours", text: "Plusieurs villes et pays dans un seul événement, une page par producteur." }
  - { label: "Plans de salle", href: "/product/seating", text: "Envoyez un PDF, un croquis ou un tableau de rangées ; nous dessinons le plan gratuitement." }
sections:
  - type: glance
    id: glance
    eyebrow: "En un coup d'œil"
    title: "La Suisse en un coup d'œil"
    rows:
      - { k: "Prestataire de paiement", v: "Stripe" }
      - { k: "Devise", v: "Franc suisse (CHF)" }
      - { k: "Moyens de paiement", v: "TWINT, cartes, Apple Pay, Google Pay : ceux que vous activez dans Stripe" }
      - { k: "Page acheteur", v: "Anglais, espagnol, russe, tchèque, hébreu ; allemand, français et italien sur demande" }
      - { k: "Notre prix", v: "{usdPrice} par billet, {usdSeated} avec une place ; à partir de {usdFrom} avec des crédits" }
      - { k: "TVA sur notre commission", v: "Aucune" }

  - type: cards
    id: benefits
    eyebrow: "Pourquoi ArenaSoldOut.com"
    title: "Qu'obtiennent les organisateurs ?"
    lead: "Une plateforme de billetterie conçue pour les organisateurs : vous gardez plus sur chaque billet, vous vendez plus et vous démarrez plus tôt."
    items:
      - title: "Gagnez plus sur chaque billet"
        text: "{usdPrice} fixes par billet, et non un pourcentage du prix. Avec des crédits, c'est moins, à partir de {usdFrom} par billet. Les frais de carte restent entre vous et votre prestataire de paiement."
        link: { label: "Tarifs →", href: "/pricing" }
      - title: "Vendez plus"
        text: "Codes promo, prix early bird, liens de parrainage, relances de paniers abandonnés et un e-mail aux abonnés dès l'ouverture des ventes."
        link: { label: "Codes promo et fenêtres de prix →", href: "/product/pricing-tools" }
      - title: "Vendez plus tôt"
        text: "Un événement sans plan de salle est en vente en 10 minutes. Un plan de salle, nous le dessinons gratuitement, en général sous un jour."
        link: { label: "Votre premier événement →", href: "/first-event" }

  - type: prose
    id: twint
    eyebrow: "TWINT"
    title: "Comment les acheteurs paient-ils avec TWINT ?"
    body: "TWINT est le moyen de paiement que la plupart des gens utilisent en Suisse. Vous l'activez dans votre tableau de bord Stripe, et il apparaît dans la page de paiement à côté des cartes. Stripe fixe ses propres frais pour TWINT ; vous les voyez dans votre compte Stripe. L'argent de chaque billet arrive sur votre compte, et ArenaSoldOut.com ne le détient jamais."

  - type: cards
    id: where
    eyebrow: "Où vous vendez"
    title: "Où puis-je vendre des billets ?"
    lead: "À trois endroits à la fois. Les ventes de tous arrivent dans un seul Event Center."
    items:
      - title: "Notre page de vente"
        text: "Nous hébergeons une page pour votre événement à l'adresse tickets.arenasoldout.com/votre-nom/votre-evenement. Il n'y a rien à construire."
        link: { label: "Où vous vendez →", href: "/product/sell" }
      - title: "Votre propre site"
        text: "Placez le widget de billetterie sur le site que vous avez déjà. Les acheteurs choisissent leurs places et paient sans le quitter."
        link: { label: "Le widget →", href: "/product/sell" }
      - title: "Vos réseaux sociaux"
        text: "Partagez le lien sur les réseaux sociaux et les messageries, ou imprimez un QR code sur l'affiche. Chaque commande est liée à son lien, vous voyez donc lequel a vendu."
        link: { label: "Liens et QR codes →", href: "/product/sell" }

  - type: faq
    id: questions
    eyebrow: "Questions"
    title: "Que demandent les organisateurs avant de commencer ?"
    items:
      - q: "Combien un billet me coûte-t-il ?"
        a: "{usdPrice} par billet, {usdSeated} avec une place. Vous payez après l'événement, pour les billets vendus. Les invitations ne portent aucune commission. Voir les [tarifs](/pricing)."
      - q: "Puis-je payer moins par billet ?"
        a: "Oui. Achetez des crédits à l'avance et le prix descend à {usdFrom} par billet ({eurFrom} dans l'UE). Les crédits n'expirent jamais. Voir les [tarifs](/pricing)."
      - q: "Quand paie-je ArenaSoldOut.com ?"
        a: "Après l'événement, pour les billets vendus, si vous choisissez de payer ainsi. Vous pouvez aussi acheter des crédits avant l'événement."
      - q: "Où va l'argent des billets ?"
        a: "Sur votre propre compte chez votre prestataire de paiement, pour chaque billet vendu. ArenaSoldOut.com ne le détient jamais."
      - q: "En combien de temps puis-je commencer à vendre ?"
        a: "Nous confirmons votre organisation, en général sous un jour. Avec un compte de paiement en place, un événement sans plan de salle est en vente en 10 minutes. Un plan de salle, nous le dessinons gratuitement, en général sous un jour."
      - q: "Quelle est la fiabilité de la plateforme ?"
        a: "Testée en charge à 800 commandes par minute avec 1 000 acheteurs en même temps. Une surveillance automatique alerte l'équipe, des sauvegardes chiffrées sont faites chaque nuit, et Cloudflare se place devant. Aucune panne n'a été enregistrée depuis le lancement en 2019, même avec plusieurs dizaines de milliers de billets vendus en 5 minutes. Voir [la fiabilité](/product/reliability)."
      - q: "Je gère une salle permanente. Y a-t-il une autre formule ?"
        a: "Oui. Les théâtres, clubs et autres salles qui organisent des événements toute l'année ou par saison paient {percent} % du prix du billet, avec un plafond par billet, facturé chaque mois. Voir les [tarifs](/pricing)."
      - q: "Mes billets sont bon marché. Y a-t-il un prix plus bas ?"
        a: "Oui. Quand chaque billet de l'événement coûte {usdLowMax} ou moins, la commission est de {lowPercent} % du prix du billet. Voir les [tarifs](/pricing)."
      - q: "Un même événement peut-il avoir des billets à des prix différents ?"
        a: "Oui. Des catégories avec leurs propres prix, des prix early bird qui changent à une date, des paliers de quantité, des billets gratuits et à prix libre."
      - q: "Puis-je utiliser des codes promo ?"
        a: "Oui, avec un périmètre (quelles catégories et quelles séances), des dates de validité et une limite par acheteur. Voir [codes promo et fenêtres de prix](/product/pricing-tools)."
      - q: "Un billet enfant peut-il être vendu uniquement avec un billet adulte ?"
        a: "Oui, avec des catégories complémentaires. Un complément n'est vendu qu'avec un billet principal de la même séance : un billet enfant ne peut donc pas être acheté sans billet adulte."
      - q: "Puis-je vendre des boissons ou des produits dérivés avec les billets ?"
        a: "Oui. Un bon pour une boisson peut être une catégorie complémentaire : il n'est vendu qu'avec un billet et arrive sous forme de billet à part. Les produits dérivés, le vin et les coffrets cadeaux se vendent dans une boutique à côté de vos billets, avec variantes, panier, livraison et remboursements."
      - q: "Je donne le même spectacle chaque semaine. Dois-je créer un nouvel événement à chaque fois ?"
        a: "Non. Vous ajoutez une séance au même événement ; les prix, les catégories et le plan de salle sont repris, et les acheteurs choisissent la date."
      - q: "Puis-je voir les ventes de chaque événement en temps réel ?"
        a: "Oui. Dans l'Event Center, sur votre téléphone ou votre ordinateur, dans le navigateur, sans rien installer : commandes et totaux par séance, et un rapport CSV. Si vous utilisez Telegram, chaque vente et chaque remboursement arrivent aussi dans votre groupe en quelques secondes."
      - q: "Ai-je besoin d'un équipement spécial à l'entrée ?"
        a: "Non. L'application MACS scanne les billets sur n'importe quel iPhone ou téléphone Android, sur papier ou à l'écran. Les lecteurs laser portables et les lecteurs de codes-barres USB ou Bluetooth fonctionnent aussi. Voir [l'application MACS](/product/scanner)."
      - q: "Combien coûte l'application de scan MACS ?"
        a: "MACS est incluse pour les organisateurs qui vendent avec ArenaSoldOut.com."
      - q: "Quels moyens de paiement mes acheteurs verront-ils ?"
        a: "Ceux que vous activez dans votre compte Stripe. Activez TWINT, et les acheteurs en Suisse le voient à côté des cartes."

  - type: prose
    id: team
    eyebrow: "Notre équipe"
    title: "Des questions ou des idées ?"
    body: "Écrivez à l'équipe. Nous répondons aux questions sur votre pays, votre salle et votre événement, et nous écoutons les idées : nous construisons ArenaSoldOut.com pour que la vente de billets soit pratique et rentable pour vous. [Contactez l'équipe](/contact#write)."

  - type: cta
    id: start
    title: "Commencez à vendre dès aujourd'hui"
    text: "Créez l'événement, connectez votre compte de paiement, partagez le lien."
    primary: { label: "Créer votre événement", href: "/start#create" }
    secondary: { label: "Contacter l'équipe", href: "/contact#write" }
    note: "Nous confirmons votre organisation, connectons votre compte de paiement et dessinons gratuitement votre plan de salle."
