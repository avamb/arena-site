sections:
  - type: prose
    id: story
    eyebrow: Entreprise
    title: Qu'est-ce qu'ArenaSoldOut.com ?
    body: |
      ArenaSoldOut.com est une plateforme de billetterie pour organisateurs : places numérotées et placement libre dans un même événement, compte de paiement propre à l'organisateur, une page de vente que nous hébergeons ou un widget sur le site de l'organisateur, un Event Center dans le navigateur et dans Telegram. Les acheteurs paient directement l'organisateur ; la plateforme ne détient jamais l'argent.

      L'entreprise est ABH TEAM OÜ, enregistrée dans l'Union européenne. Les plateformes précédentes des fondateurs ont servi des spectacles du Cirque du Soleil, des stades de la FIFA 2018, les World Choir Games et 800 ice shows ; ArenaSoldOut.com vend des billets pour des organisateurs depuis 2019 et a été entièrement reconstruite en 2026.

      L'équipe répond aux organisateurs en anglais, espagnol, tchèque, russe et hébreu. La plupart des demandes des organisateurs sont livrées en quelques semaines ; chacune de celles passées en production figure sur la [page des modifications](/changes) avec sa date, et la [page des faits](/facts) indique ce qui existe, ce qui n'existe pas et depuis quand.
