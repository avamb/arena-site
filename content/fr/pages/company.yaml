title: "À propos d'ArenaSoldOut.com : billetterie depuis 2019"
description: "ArenaSoldOut.com est une infrastructure de billetterie pour organisateurs, gérée par ABH TEAM OÜ (UE). Clients dans 31 pays depuis 2019 ; refonte en 2026."
h1: Qui est derrière ArenaSoldOut.com
lead: Une petite équipe qui construit l'infrastructure de billetterie des organisateurs qui vendent leurs propres billets. Pas une place de marché, pas un agenda d'événements. Des organisateurs dans 31 pays depuis 2019 ; la plateforme qui les porte a été reconstruite en 2026 et les organisateurs l'ont suivie.
