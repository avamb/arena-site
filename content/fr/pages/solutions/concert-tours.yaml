title: "Billetterie de tournée : plusieurs villes, page promoteur"
description: "Vendez une tournée depuis un événement : séances par ville, plan par salle, pages de promoteurs avec liens et codes propres, contrôle dans chaque ville."
h1: Tournées de concerts
tagline: Une tournée commence bien avant la première ville.
lead: Un spectacle, plusieurs villes et dates. Chaque ville a sa séance et son plan, chaque promoteur a une page avec son propre lien, et vous suivez toute la tournée dans un seul Event Center.
related:
  - { label: Spectacles, href: /solutions/shows }
  - { label: Où vous vendez, href: /product/sell }
  - { label: Paiements par pays, href: /payments }
  - { label: "Pays et moyens de paiement", href: /countries }
sections:
  - type: paycountries
    id: countries
  - type: cards
    id: what
    eyebrow: Pour les tournées
    title: Qu'est-ce qui compte en tournée ?
    items:
      - { title: Séances par ville, text: "Dates et salles dans un seul événement ; les acheteurs choisissent la ville, vous voyez les totaux par séance et pour toute la tournée.", link: { label: Event Center →, href: /#center } }
      - { title: Un plan pour chaque salle, text: "Envoyez un PDF, un tableur ou un croquis à la main et l'équipe dessine gratuitement le plan de chaque salle ; au prochain passage, il est déjà là.", link: { label: Plans de salle →, href: /product/seating } }
      - { title: Pages de promoteurs, text: "Une page distincte pour chaque promoteur local, avec son lien et ses codes promo ; les ventes remontent chez vous.", link: { label: Où vous vendez →, href: /product/sell } }
      - { title: D'où viennent les acheteurs, text: "Ajoutez des balises UTM à vos liens et voyez quelle publication, quelle newsletter ou quel partenaire vend des billets dans chaque ville.", link: { label: Où vous vendez →, href: /product/sell } }
      - { title: Plusieurs pays, text: "Vendez en Tchéquie, en Espagne, en France, en Géorgie ou en Israël avec le prestataire de chaque pays, sur votre propre compte.", link: { label: Paiements →, href: /payments } }
      - { title: Langues des acheteurs, text: "Pages et billets dans la langue de l'acheteur, e-mails en sept langues, écriture de droite à gauche pour l'hébreu.", link: { label: Billets →, href: /product/tickets } }
      - { title: Toute la tournée sur Telegram, text: "Chaque vente et chaque remboursement, dans chaque ville, apparaît dans votre groupe Telegram en quelques secondes, avec les coordonnées de l'acheteur.", link: { label: Telegram →, href: /product/telegram } }
      - { title: "Un concert est déplacé ? C'est vous qui décidez", text: "Remboursez tout le monde, proposez une nouvelle date à la place, ou choisissez une autre solution. Les acheteurs reçoivent un e-mail avec le billet mis à jour.", link: { label: Billets →, href: /product/tickets } }
      - { title: L'entrée dans chaque ville, text: "L'application de contrôle MACS pour iOS et Android dans chaque salle ; les billets que vos partenaires locaux vendent dans d'autres systèmes sont acceptés aussi.", link: { label: Application de contrôle MACS →, href: /product/scanner } }
  - type: faq
    id: questions
    eyebrow: Questions
    title: Que demandent d'abord les organisateurs en tournée ?
    items:
      - q: Un événement peut-il couvrir plusieurs pays et devises ?
        a: Les séances peuvent se tenir dans des pays différents ; le compte de paiement et la devise suivent l'organisation. Pour des devises distinctes, l'équipe configure un canal par pays.
      - q: Les promoteurs voient-ils les ventes des autres ?
        a: Non. Chaque promoteur ne voit que sa propre page ; l'organisateur voit tout.
      - q: Une ville change de salle. Que deviennent les billets vendus ?
        a: La séance est déplacée et les acheteurs reçoivent un e-mail avec le billet mis à jour ; les places sont réattribuées avec vous sur le nouveau plan.
      - q: Combien me coûte un billet en tournée ?
        a: "Le même montant par billet dans chaque ville ; voir les [tarifs](/pricing)."
  - type: cta
    id: start
    title: Votre plus bel événement est encore à venir. On commence par les billets ?
    text: Créez l'événement, connectez votre compte de paiement, partagez le lien.
    primary: { label: Commencer à vendre, href: /start }
    secondary: { label: Créer votre événement, href: /start#create }
    tertiary: { label: Écrire à l'équipe, href: /contact#write }
