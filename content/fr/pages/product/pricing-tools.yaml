title: "Codes promo, prévente, paliers, gratuit et prix libre"
description: "Codes promo avec portée et limites, prix par date, paliers de quantité, chaînes de catégories, frais de service par canal, billets gratuits et à prix libre."
h1: Des prix qui changent comme vous l'avez prévu
lead: Prévente par date, prix suivant quand un palier est épuisé, codes pour les partenaires, frais de service par canal. Tout se règle dans l'Event Center et s'applique dans le widget et sur la page hébergée.
