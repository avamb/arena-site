title: "Billets électroniques EAN-13 et QR, scan, e-mails acheteurs"
description: "Billets PDF avec EAN-13 et QR dans la langue de l'acheteur, scan MACS pour iOS et Android, exemples de billets, e-mails en cas de report ou d'annulation."
h1: Un billet qui se scanne
lead: Chaque billet est un PDF avec un code-barres EAN-13 et un QR code, dans la langue de l'acheteur. Scannez-le avec l'application ou un scanner portable, renvoyez-le, remboursez-le, remplacez-le quand une date change.
