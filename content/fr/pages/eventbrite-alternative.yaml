  - type: prose
    id: examples
    title: Que cela donne-t-il pour un événement ?
    body: |
      Tous les chiffres sont calculés aux prix des deux plateformes au 11 novembre 2026.

      **1 000 billets à US$30, paiement à l'usage.** ArenaSoldOut.com : 1 000 × US$0,62 = **US$620**. Eventbrite : 1 000 × (3,7% de US$30 + US$1,79) = US$2 900. Cela fait **US$2 280** d'écart, avant l'encaissement par carte de part et d'autre.

      **300 billets avec place à US$60.** ArenaSoldOut.com : 300 × US$1,18 = **US$354**, et nous dessinons le plan de salle gratuitement. Eventbrite : 300 × (3,7% de US$60 + US$1,79) = US$1 203.

      **Plus un billet coûte cher, plus l'écart grandit.** Notre commission reste la même sur un billet à US$15 et sur un billet à US$150. Un pourcentage augmente avec le prix.

      Calculez votre propre événement dans le [calculateur de la page des tarifs](/pricing#packages).

  - type: cards
    id: more
    eyebrow: Au-delà du prix
    title: Qu'est-ce qui change d'autre avec ArenaSoldOut.com ?
    items:
      - title: L'argent est à vous dès la première commande
        text: "Les acheteurs paient sur votre propre compte Stripe, Flitt ou AllPay. ArenaSoldOut.com ne détient jamais de fonds : aucun versement à attendre après l'événement."
        link: { label: Paiements, href: /payments }
      - title: Plans de salle dessinés pour vous, gratuitement
        text: "Envoyez un PDF, une photo d'un croquis à la main ou un tableau de rangs et de places. L'équipe construit la salle ; vous ne la dessinez jamais vous-même."
        link: { label: Plans de salle, href: /product/seating }
      - title: Tarif réduit pour les billets bon marché
        text: "Quand chaque billet de l'événement coûte {usdLowMax} ou moins : {lowPercent}% du prix du billet au lieu du forfait. Soirées, courses, fêtes d'enfants, excursions."
        link: { label: Comment ça marche, href: /pricing#low-price }
      - title: Votre page, vos acheteurs
        text: "Vendez sur votre propre site avec le widget de billetterie ou sur votre page chez nous. Les acheteurs viennent à vous, pas dans un catalogue à côté d'autres événements."
        link: { label: Vendre sur votre site ou sur le nôtre, href: /product/sell }
      - title: Chaque vente dans votre Telegram
        text: "Créez un événement à partir d'une photo d'affiche dans le bot Telegram et voyez chaque vente et chaque remboursement dans votre groupe en quelques secondes."
        link: { label: Bot Telegram, href: /product/telegram }
      - title: Configurez vous-même, ou déléguez
        text: "Vous créez vous-même les événements, les prix et les catégories dans l'Event Center ou le bot Telegram, en quelques minutes ; nous dessinons les plans de salle gratuitement. Pas le temps ? Notre gestionnaire d'événements s'en charge pour vous, en service payant."
        link: { label: Services complémentaires, href: /pricing#services }

  - type: faq
    id: questions
    title: Les questions des organisateurs qui comparent
    items:
      - q: ArenaSoldOut.com est-il moins cher qu'Eventbrite ?
        a: "Sur la commission, oui, quel que soit le prix du billet : {usdPrice} par billet au lieu de 3,7% + US$1,79 aux États-Unis, et {eurPrice} au lieu de 5,9% + €0,79 en Irlande. L'encaissement par carte s'ajoute sur les deux plateformes aux États-Unis."
      - q: Qui paie les frais, moi ou l'acheteur ?
        a: "Vous décidez. Vous pouvez ajouter vos propres frais de service pour l'acheteur au-dessus du prix du billet, ou garder le prix tel quel et payer vous-même notre commission. Les invitations et les billets gratuits pour des événements payants ne supportent aucune commission."
      - q: Où va l'argent de l'acheteur ?
        a: "Directement sur votre propre compte de paiement à chaque commande : Stripe, Flitt ou AllPay. ArenaSoldOut.com ne détient jamais de fonds. Notre commission est facturée après l'événement ou prélevée sur vos crédits."
      - q: Mon événement sera-t-il listé sur une place de marché ?
        a: "Non. Eventbrite a une place de marché où les acheteurs parcourent les événements ; ArenaSoldOut.com n'en a pas. Nous vendons des billets sur votre site et sur votre propre page d'événement, et vous amenez les acheteurs avec vos propres canaux."
      - q: Puis-je transférer mes événements depuis Eventbrite ?
        a: "Oui. Vous créez vos événements dans l'Event Center ou le bot Telegram, nous dessinons vos plans de salle gratuitement, et vous continuez à vendre sur Eventbrite jusqu'à ce que votre page chez nous soit prête. Pas le temps de tout configurer vous-même ? Notre [gestionnaire d'événements](/pricing#services) s'en charge pour vous, en service payant."
      - q: Dois-je payer un abonnement ?
        a: "Non. Vous ne payez que les billets vendus, après l'événement, ou vous achetez des crédits à l'avance à partir de {usdFrom} par billet. Les crédits n'expirent jamais."

