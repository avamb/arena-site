  - type: compare
    id: prices
    eyebrow: Prix par billet
    title: Combien coûte un billet sur chaque plateforme ?
    lead: "Prix des deux plateformes au 11 novembre 2026. Notre commission par billet vendu à côté des frais de service d'Eventbrite. Aux États-Unis, l'encaissement par carte est réglé séparément sur les deux plateformes : à Eventbrite là-bas, à votre propre prestataire de paiement chez nous."
