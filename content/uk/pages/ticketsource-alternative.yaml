    id: start
    title: Спробуйте на своєму наступному заході
    text: Створіть захід, підключіть платіжний акаунт, поділіться посиланням.
    primary: { label: Почати продаж, href: /start }
    secondary: { label: Дивитися ціни, href: /pricing }
    note: "Питання? Надішліть нам, скільки ви платите в TicketSource, і ми порівняємо це з вашими витратами тут."
