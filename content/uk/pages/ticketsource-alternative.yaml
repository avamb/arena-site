title: "Альтернатива TicketSource з фіксованою платою за квиток"
description: "ArenaSoldOut.com і TicketSource: фіксована плата за квиток замість відсотка від кожного бронювання та безкоштовні схеми залів, намальовані для вас."
h1: Альтернатива TicketSource з фіксованою платою замість відсотка
lead: "TicketSource бере відсоток від кожного платного бронювання. ArenaSoldOut.com бере фіксовану плату за квиток, хоч скільки він коштує, а гроші йдуть на ваш власний платіжний акаунт з кожним замовленням. Нижче обидва прайси поруч, як вони опубліковані на 11 листопада 2026 року."
related:
  - { label: Усі порівняння, href: /alternatives, text: "ArenaSoldOut.com поруч з іншими платформами продажу квитків." }
  - { label: Ціни, href: /pricing, text: "Оплата за фактом або кредити, калькулятор і всі пакети кредитів." }
  - { label: Схеми залів, href: /product/seating, text: "Ми безкоштовно малюємо ваш майданчик за PDF або ескізом." }
sections:
  - type: compare
    id: prices
    eyebrow: Ціна за квиток
    title: Скільки коштує квиток на кожній платформі?
    lead: "Ціни обох платформ станом на 11 листопада 2026 року. У TicketSource є два варіанти: власна обробка карток, з платою за картку у складі, або ваш власний акаунт Stripe за нижчою ставкою. Ціни різняться між Великою Британією та ЄС. В ArenaSoldOut.com ви завжди користуєтеся власним платіжним акаунтом, тож чесне порівняння з другим варіантом."
    cols: { what: "", us: ArenaSoldOut.com, them: TicketSource }
    rows:
      - { what: "Як рахується плата", us: "Фіксована плата за квиток", them: "Відсоток від кожного платного бронювання" }
      - { what: "Велика Британія, власний акаунт Stripe", us: "**{usdPrice}** за квиток, близько £0,47", them: "4,5% + ПДВ" }
      - { what: "Велика Британія, квиток £20, власний акаунт Stripe", us: "**{usdPrice}**, близько £0,47", them: "£1,08 (£0,90 + ПДВ)" }
      - { what: "Велика Британія, квиток £50, власний акаунт Stripe", us: "**{usdPrice}**, близько £0,47", them: "£2,70 (£2,25 + ПДВ)" }
      - { what: "Велика Британія, їхня власна обробка карток", us: "Не пропонуємо: ви завжди користуєтеся власним акаунтом", them: "7% + ПДВ, щонайменше £0,25 + ПДВ, плата за картку у складі" }
      - { what: "ЄС, власний акаунт Stripe", us: "**{eurPrice}** за квиток", them: "4,5%" }
      - { what: "ЄС, квиток €20, власний акаунт Stripe", us: "**{eurPrice}**", them: "€0,90" }
      - { what: "ЄС, квиток €50, власний акаунт Stripe", us: "**{eurPrice}**", them: "€2,25" }
      - { what: "ЄС, їхня власна обробка карток", us: "Не пропонуємо: ви завжди користуєтеся власним акаунтом", them: "8,5%, щонайменше €0,30, плата за картку у складі" }
      - { what: "Коли ви отримуєте гроші", us: "З кожним замовленням, на ваш акаунт", them: "З власним Stripe: з кожним замовленням. З їхньою обробкою: у понеділок після заходу" }
      - { what: "Хто будує схему залу", us: "Наша команда, безкоштовно, за вашим PDF або ескізом", them: "Ви, у конструкторі схем залів" }
      - { what: "Кредити, оплачені наперед", us: "Від **{usdFrom}** за квиток, не згорають", them: "Немає в їхньому прайсі" }
      - { what: "Підписка", us: Немає, them: Немає }
    note: "Ціни TicketSource: [Велика Британія](https://www.ticketsource.com/pricing) і [ЄС](https://www.ticketsource.com/es/pricing), перевірено 11 листопада 2026 року. Наші ціни: [ціни](/pricing) і [докладні умови](/pricing/terms). Організатори в країнах ЄС сплачують нашу комісію в євро, решта світу в доларах США; суми у фунтах перераховано за референтним курсом ЄЦБ на 11 листопада 2026 року (US$1 = £0,7515). TicketSource є торговою маркою свого власника; ArenaSoldOut.com не афілійований з ним."

  - type: prose
    id: examples
    title: Що це означає для одного заходу?
    body: |
      Усі суми за цінами обох платформ станом на 11 листопада 2026 року. Наша комісія в доларах США; суми у фунтах за референтним курсом ЄЦБ того ж дня, US$1 = £0,7515.

      **400 квитків по £25, власний акаунт Stripe на обох.** ArenaSoldOut.com: 400 × US$0,62 = **US$248, близько £186**. TicketSource: 400 × (4,5% від £25 + ПДВ) = £540.

      **250 квитків з місцями по £40.** ArenaSoldOut.com: 250 × US$1,18 = **US$295, близько £222**, а схему залу ми малюємо безкоштовно. TicketSource: 250 × (4,5% від £40 + ПДВ) = £540.

      **300 квитків по €30 у ЄС, власний акаунт Stripe на обох.** ArenaSoldOut.com: 300 × €0,55 = **€165**. TicketSource: 300 × 4,5% від €30 = €405.

      **Чим дорожчий квиток, тим більша різниця.** Наша комісія однакова для квитка за £15 і за £150. Відсоток росте разом із ціною.

      Порахуйте власний захід у [калькуляторі на сторінці цін](/pricing#packages).

  - type: cards
    id: more
    eyebrow: Окрім ціни
    title: Що ще ви отримуєте з ArenaSoldOut.com?
    items:
      - title: Схеми залів, намальовані для вас безкоштовно
        text: "Надішліть PDF, фото ескіза від руки або таблицю рядів і місць. Команда збудує майданчик; самі ви його не малюєте."
        link: { label: Схеми залів, href: /product/seating }
      - title: Гроші просто на ваш акаунт
        text: "Покупці платять на ваш власний акаунт Stripe, Flitt або AllPay з кожним замовленням. ArenaSoldOut.com ніколи не тримає кошти і нічого не вираховує з ваших продажів."
        link: { label: Платежі, href: /payments }
      - title: Нижча ставка для дешевих квитків
        text: "Коли кожен квиток заходу коштує {usdLowMax} або менше: {lowPercent}% від ціни квитка замість фіксованої плати. Дискотеки, забіги, дитячі свята, екскурсії."
        link: { label: Як це працює, href: /pricing#low-price }
      - title: Покупці своєю мовою
        text: "Сторінка покупця, листи й квитки мовою покупця, зокрема іврит справа наліво. Будь-яку нову мову додаємо протягом 40 годин."
        link: { label: Електронні квитки, href: /product/tickets }
      - title: Кожен продаж у вашому Telegram
        text: "Створіть захід з фото афіші в Telegram-боті й бачте кожен продаж і повернення коштів у своїй групі за лічені секунди."
        link: { label: Telegram-бот, href: /product/telegram }
      - title: Налаштуйте самі або передайте нам
        text: "Заходи, ціни й категорії ви створюєте самі в Event Center або в Telegram-боті, за лічені хвилини; схеми залів ми малюємо безкоштовно. Немає часу? Наш менеджер заходів зробить це за вас, як платну послугу."
        link: { label: Додаткові послуги, href: /pricing#services }

  - type: faq
    id: questions
    title: Питання, які організатори ставлять, порівнюючи
    items:
      - q: Чи дешевший ArenaSoldOut.com за TicketSource?
        a: "З власним акаунтом Stripe на обох так, на будь-якому квитку понад приблизно £9 у Великій Британії та понад приблизно €12 в ЄС: {usdPrice} за квиток замість 4,5% плюс ПДВ у Великій Британії, {eurPrice} замість 4,5% в ЄС. На квитку £20 це близько £0,47 проти £1,08; на квитку €20 {eurPrice} проти €0,90."
      - q: Чи входить плата за картку у вашу комісію?
        a: "Ні. Плату за картку бере ваш власний платіжний провайдер за вашою ставкою, а наша комісія окрема. Власна обробка TicketSource (7% + ПДВ у Великій Британії, 8,5% в ЄС) включає плату за картку; їхній варіант 4,5% з вашим власним Stripe, як і в нас, не включає."
      - q: Куди йдуть гроші покупця?
        a: "На ваш власний платіжний акаунт з кожним замовленням: Stripe, Flitt або AllPay. ArenaSoldOut.com ніколи не тримає кошти. Нашу комісію виставляємо в рахунку після заходу або списуємо з ваших кредитів."
      - q: Чи можу я перенести свої заходи з TicketSource?
        a: "Так. Ви створюєте заходи в Event Center або в Telegram-боті, ми безкоштовно малюємо ваші схеми залів, а ви продовжуєте продавати на TicketSource, доки ваша сторінка в нас не буде готова. Немає часу налаштовувати самі? Наш [менеджер заходів](/pricing#services) зробить це за вас, як платну послугу."
      - q: А благодійні організації?
        a: "Зареєстровані благодійні організації отримують знижку 50% на нашу комісію. Напишіть нам, і ми ввімкнемо її для вашої організації."
      - q: Чи плачу я підписку?
        a: "Ні. Ви платите лише за продані квитки. Запрошення й безкоштовні квитки на платні заходи комісією не обкладаються."

