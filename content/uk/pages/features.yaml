title: "Функції: продаж квитків, схеми залів, платежі"
description: "Усі функції ArenaSoldOut.com на одній сторінці: сторінки продажу і віджет, схеми залів, ціни та промокоди, платежі, квитки, сканер, Event Center."
h1: Усі функції на одній сторінці
lead: "Що ArenaSoldOut.com робить для організатора, від першого квитка до входу в зал. Кожна група веде на свою сторінку з подробицями."
related:
  - { label: Ціни, href: /pricing, text: "Оплата за кожен проданий квиток або кредити, тоді менше." }
  - { label: ArenaSoldOut.com і Ticket Tailor, href: /tickettailor-alternative, text: "Ціни та функції поруч." }
  - { label: Ваша перша подія, href: /first-event, text: "Що підготувати і як відбувається перший продаж." }
sections:
  - type: cards
    id: selling
    eyebrow: Продаж
    title: Де і як ви продаєте
    lead: "Докладніше: [продаж на вашому сайті або нашому](/product/sell)."
    items:
      - title: Сторінка продажу на нашому хостингу
        text: "tickets.arenasoldout.com/your-name/your-event, готова за кілька хвилин. Одне посилання для соцмереж, месенджерів і афіш."
      - title: Віджет квитків на вашому сайті
        text: "Три рядки коду на будь-якому сайті: Tilda, Wix, Webflow або власний. Ваші кольори, ваші шрифти, ваша мова; покупці не залишають ваш домен."
      - title: Сторінки для промоутерів і партнерів
        text: "Окрема сторінка для кожного промоутера і посилання на ваших партнерів-продавців на тій самій сторінці."
      - title: Матеріали події на вашій сторінці продажу
        text: "Додавайте матеріали до події на своїй сторінці продажу на платформі, якщо власного сайту немає: тексти, фото й відео."
      - title: Описи, що виглядають оформленими
        text: "Заголовки, списки, посилання й цитати в описі події на вашій сторінці продажу. Нейромережа форматує звичайний текст за вас одним кліком."
      - title: '«Повідомити, коли відкриється продаж»'
        text: "Покупці підписуються на сторінці вашої події і отримують лист у момент відкриття продажу."
      - title: Нагадування про покинутий кошик
        text: "Покупець, який забронював квитки і не оплатив, отримує нагадування. У багатьох випадках такі нагадування помітно підвищують продажі."
      - title: Приведіть друга
        text: "Кожен покупець отримує особисте посилання: друг отримує знижку, покупець отримує кешбек після події друга."
      - title: Короткі посилання і QR-коди для друку
        text: "Посилання go.arenasoldout.com з QR-кодами для афіш і флаєрів: PNG, SVG або PDF-вкладка у форматах A5 і A6. Змінюйте адресу переходу вже після друку."
      - title: Магазин поруч із квитками
        text: "Продавайте вино, мерч і подарункові набори разом із квитками: варіанти, кошик, доставка, повернення коштів. Наш перший клієнт з магазином уже продає так."

  - type: cards
    id: seating
    eyebrow: Місця
    title: Схеми залів, що відповідають майданчику
    lead: "Докладніше: [схеми залів](/product/seating)."
    items:
      - title: Схему залу малюємо безкоштовно
        text: "Надішліть PDF, фото ескіза від руки або таблицю рядів і місць; команда збудує майданчик."
      - title: Місця і стоячі зони в одній схемі
        text: "Рядки з нумерованими місцями та категоріями і стоячі зони з квотами, кожна категорія з власною ціною й періодом продажу."
      - title: Версії схеми
        text: "Нове розташування для наступного сеансу не зачіпає вже продані квитки."
      - title: Вибір місць на телефоні
        text: "Масштабування щипком, легенда за категоріями і таймер утримання обраних місць, у віджеті й на сторінці на нашому хостингу."
      - title: Запрошення та місця для преси
        text: "Утримуйте місця для гостей і преси та випускайте запрошення з Event Center, без комісії."

  - type: cards
    id: prices
    eyebrow: Ціни
    title: Ціни, промокоди та періоди продажу
    lead: "Докладніше: [промокоди та цінові періоди](/product/pricing-tools)."
    items:
      - title: Розумна ціна
        text: "Готова схема цінових ступенів за кількістю і за датою замість того, щоб налаштовувати кожен ступінь вручну."
      - title: Додаткові категорії
        text: "Додатковий квиток продається лише разом з основним: дитячий квиток не можна продати без дорослого."
      - title: Промокоди
        text: "На одну подію, сеанс чи категорію, з періодом продажу, мінімальним замовленням і лімітом на покупця. Партнери отримують власні коди."
      - title: Ранній продаж і кількісні ступені
        text: "Ціни перемикаються в обрану вами дату або відкривають наступний ступінь, коли поточний розпродано."
      - title: Категорії та ланцюжки
        text: "Кожна категорія з власною ціною, квотою й періодом продажу; нерозпродані місця переходять до наступної категорії."
      - title: Сервісний збір
        text: "Відсоток для кожного каналу продажу, який покупець бачить окремим рядком і який надходить на ваш рахунок."
      - title: Безкоштовні квитки й квитки з оплатою за вибором покупця
        text: "Безкоштовні квитки для запрошень і реєстрацій та квитки з оплатою за вибором покупця із заданим вами мінімумом."

  - type: cards
    id: payments
    eyebrow: Платежі
    title: Гроші надходять на ваш власний акаунт
    lead: "Докладніше: [платежі](/payments)."
    items:
      - title: Ваш власний платіжний акаунт
        text: "Покупці платять на ваш акаунт Stripe, Flitt або AllPay з кожним замовленням. ArenaSoldOut.com ніколи не тримає кошти."
      - title: Повернення коштів через будь-якого провайдера
        text: "Ви вирішуєте про повернення в Event Center; кошти повертаються покупцю через вашого провайдера."
      - title: Автоматична обробка чарджбеків
        text: "Коли покупець оскаржує платіж, ми збираємо докази: дані платежу, згоду, доставку листів із квитками та кожне завантаження квитка."

  - type: cards
    id: tickets
    eyebrow: Квитки і вхід
    title: Що отримує покупець і як ви це скануєте
    lead: "Докладніше: [електронні квитки](/product/tickets) і [застосунок-сканер MACS](/product/scanner)."
    items:
      - title: Електронний квиток з QR і EAN-13
        text: "PDF-квиток у листі покупця, його можна показати з телефона або надрукувати."
      - title: Квитанція про оплату в листі з квитком
        text: "Квитанцію додано до листа з квитком, у ній вказано отримувача платежу."
      - title: Статус доставки кожного листа
        text: "Надіслано, Доставлено, Прочитано: перевірте, що покупець отримав квиток, і надішліть його повторно одним кліком."
      - title: Листи 7 мовами
        text: "Сторінка покупця, листи й квиток мовою покупця. Будь-яку нову мову додаємо протягом 40 годин."
      - title: Зміни дат і скасування
        text: "Покупці отримують лист з оновленим квитком, коли сеанс переноситься або скасовується."
      - title: Застосунок-сканер для iOS і Android
        text: "MACS, наш окремий застосунок для входу: будь-яка кількість телефонів, чітка відповідь на кожне сканування."

  - type: cards
    id: center
    eyebrow: Event Center
    title: Керуйте подією разом із командою
    lead: "Докладніше: [Event Center](/#center) і [Telegram-бот](/product/telegram)."
    items:
      - title: Замовлення і покупці
        text: "Пошук, фільтри та CSV-звіти за сеансами. Повторне надсилання, повернення коштів чи запрошення в один клік."
      - title: Сеанси
        text: "Додавайте дати, переносьте або скасовуйте сеанс, а покупці дізнаються з листа."
      - title: Аналітика продажів
        text: "Перегляди, кошики й платежі за подією, щоб ви бачили, де покупці йдуть."
      - title: Ролі в команді
        text: "Ролі власника та менеджера для вашої команди, у браузері на телефоні чи комп'ютері."
      - title: Telegram-бот
        text: "Створіть подію з фото афіші й отримуйте кожен продаж і повернення коштів у свою Telegram-групу за лічені секунди."

  - type: cards
    id: reliability
    eyebrow: Надійність
    title: Створено для великих відкриттів продажу
    lead: "Докладніше: [надійність](/product/reliability) і [сторінка з фактами](/facts)."
    items:
      - title: 800 замовлень на хвилину
        text: "При 1000 покупцях на сторінці одночасно, в навантажувальних тестах вересня 2026 року."
      - title: Сторожовий сервіс і резервні копії
        text: "Постійні перевірки зі сповіщеннями команді, щонічні зашифровані резервні копії, Cloudflare попереду."
      - title: Захист від ботів
        text: "Утримання місць закінчується за таймером, кількість замовлень обмежено, шкідливий трафік відфільтровується."

  - type: cards
    id: services
    eyebrow: Послуги
    title: Що для вас робить наша команда
    lead: "Докладніше: [додаткові послуги](/pricing#services)."
    items:
      - title: Малювання схеми залу, безкоштовно
        text: "Надішліть PDF, ескіз або таблицю рядів; ми намалюємо схему, зазвичай протягом дня."
      - title: Менеджер подій, платно
        text: "Людина з нашої команди працює як частина вашої: створює події, перевіряє їх до початку продажу, готує звіти. Умови узгоджуються з кожним організатором."
      - title: White label
        text: "Продавайте без нашої назви: €45 на місяць за бренд або майданчик в ЄС, US$45 в інших країнах."

  - type: cards
    id: pricing
    eyebrow: Ціни
    title: Що ви платите
    lead: "Докладніше: [ціни](/pricing) і [докладні умови](/pricing/terms)."
    items:
      - title: Оплата за фактом
        text: "{usdPrice} за проданий квиток ({eurPrice} в ЄС), рахунок після події. Без підписки, без договору."
      - title: Кредити
        text: "Купіть кредити наперед і платіть від {usdFrom} за квиток ({eurFrom} в ЄС). Кредити не згорають."
      - title: Знижка 50% для зареєстрованих благодійних організацій
        text: "Зареєстровані благодійні організації платять половину нашої комісії."
      - title: Безкоштовні запрошення і безкоштовні схеми залів
        text: "Без комісії за запрошення й безкоштовні квитки; схему залу ми малюємо безкоштовно."

  - type: cta
    id: start
    title: Почніть продаж сьогодні
    text: Створіть подію, підключіть платіжний акаунт, поділіться посиланням.
    primary: { label: Створити подію, href: /start#create }
    secondary: { label: Дивитися ціни, href: /pricing }
    note: "Питання? Напишіть нам: команда відповідає протягом одного робочого дня."
