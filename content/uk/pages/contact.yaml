title: "Контакти ArenaSoldOut.com: Telegram, e-mail, заявка"
description: "Напишіть команді ArenaSoldOut.com через форму, у чаті чи боті Telegram або електронною поштою. Покупцям квитків: спершу запитайте організатора вашої події."
h1: Зв'язок із командою
lead: "Організатори звертаються до команди через форму нижче, у Telegram або електронною поштою; відповідають ті самі люди. Покупцям квитків слід спершу писати організатору своєї події; сторінка допомоги для покупців пояснює, де знайти квиток."
related:
  - { label: Почати продаж, href: /start }
  - { label: Допомога покупцям квитків, href: /help/tickets }
  - { label: Партнери, href: /partners }
sections:
  - type: contact-form
    id: write
    eyebrow: Напишіть команді
    title: Як поставити запитання команді?
    lead: "Напишіть своє запитання нижче. Людина з команди відповідає електронною поштою, зазвичай того ж робочого дня. Запитання й відповіді, без імен та адрес електронної пошти, стають відповідями на цьому сайті."
  - type: cards
    id: ways
    eyebrow: Контакти
    title: Як зв'язатися з командою?
    items:
      - { title: "Чат у Telegram", text: "Найшвидший спосіб. Команда читає чат упродовж дня за часом Європи та Ізраїлю.", link: { label: "Відкрити чат у Telegram →", href: https://t.me/ArenaSoldOutChat } }
      - { title: "Бот у Telegram", text: "Створіть подію за афішею або просто привітайтеся; команда відповідає в тому ж боті.", link: { label: "Відкрити Telegram-бота →", href: https://t.me/EventsCentrBot } }
      - { title: "Форма заявки", text: "Розкажіть про свою подію й де ви продаєте; ми все налаштуємо, зазвичай протягом дня.", link: { label: "Почати продаж →", href: /start } }
      - { title: "E-mail", text: "hello@arenasoldout.com для всього іншого, зокрема партнерства й преси.", link: { label: "Написати листа →", href: "mailto:hello@arenasoldout.com" } }
  - type: faq
    id: questions
    eyebrow: Запитання
    title: До кого мені звертатися?
    items:
      - q: Я купив квиток і маю запитання
        a: "Напишіть організатору події; його контакт є на сторінці продажу й у листі з квитком. [Сторінка допомоги покупцям](/help/tickets) пояснює, де квиток і що робити на вході."
      - q: Я організатор і хочу почати
        a: "Скористайтеся [формою](/start) або ботом у Telegram. Команда разом із вами створює вашу організацію, вашу сторінку продажу й підключає ваш платіжний акаунт."
      - q: Я розробник або агентство
        a: "На [сторінці для розробників](/developers) є віджет і API; [партнери](/partners) пояснює, як з нами працюють агентства й майданчики."
  - type: cta
    id: start
    title: Почніть продаж сьогодні
    text: Створіть подію, підключіть платіжний акаунт, поділіться посиланням.
    primary: { label: Почати продаж, href: /start }
    secondary: { label: Відкрити чат у Telegram, href: https://t.me/ArenaSoldOutChat }
    note: "ABH TEAM OÜ, Європейський Союз."
