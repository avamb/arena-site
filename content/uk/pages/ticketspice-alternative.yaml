sections:
  - type: compare
    id: prices
    eyebrow: Ціни в доларах США
    title: Скільки коштує квиток на кожній платформі?
    lead: "Ціни обох платформ станом на 11 листопада 2026 року. Наша комісія за проданий квиток поруч із платою TicketSpice за платний квиток. Обробка карток окремо на обох платформах."
    cols: { what: "", us: ArenaSoldOut.com, them: TicketSpice }
    rows:
      - { what: "За платний квиток, вільна розсадка", us: "**{usdPrice}**", them: "US$0,99 на тарифі Standard" }
      - { what: "Квиток з місцем на схемі залу", us: "**{usdSeated}**", them: "US$1,49 на тарифі Premium (бронювання місць немає на Standard)" }
      - { what: "Хто будує схему залу", us: "Наша команда, безкоштовно, за вашим PDF або ескізом", them: "Ви, у конструкторі майданчика" }
      - { what: "Кредити, оплачені наперед", us: "Від **{usdFrom}** за квиток, не згорають", them: "Немає в їхньому прайсі" }
      - { what: "Обробка карток", us: "Сплачується вашому платіжному провайдеру", them: "2,9% + 30¢ за транзакцію" }
      - { what: "Коли ви отримуєте гроші", us: "З кожним замовленням, на ваш акаунт", them: "Щотижня, по середах, після верифікації особи" }
      - { what: "Ціни в євро (ЄС)", us: "**{eurPrice}**, **{eurSeated}** з місцем", them: "Їхні власні платежі: лише долари США й канадські долари" }
      - { what: "Підписка", us: Немає, them: Немає }
    note: "Ціни TicketSpice: [ticketspice.com/pricing](https://www.ticketspice.com/pricing) і [центр допомоги TicketSpice](https://help.ticketspice.com/en/articles/14172125-understand-webconnex-payments-payout-timing-and-when-you-ll-receive-your-funds), перевірено 11 листопада 2026 року. Наші ціни: [ціни](/pricing) і [докладні умови](/pricing/terms). TicketSpice є торговою маркою свого власника; ArenaSoldOut.com не афілійований з ним."

  - type: prose
    id: examples
    title: Що це означає для однієї події?
    body: |
      Усі суми за цінами обох платформ станом на 11 листопада 2026 року.

      **1000 квитків, вільна розсадка.** ArenaSoldOut.com: 1000 × US$0,62 = **US$620**. TicketSpice Standard: 1000 × US$0,99 = US$990. Вам лишається на **US$370** більше.

      **500 квитків з місцями.** ArenaSoldOut.com: 500 × US$1,18 = **US$590**, а схему залу ми малюємо безкоштовно. TicketSpice Premium: 500 × US$1,49 = US$745. Вам лишається на **US$155** більше, і схему ви не будуєте самі.

      **1000 квитків на рік, передоплата кредитами.** Пакет кредитів ArenaSoldOut.com 1K: **US$430**, або US$0,43 за квиток. Кредити не згорають.

      Порахуйте власну подію в [калькуляторі на сторінці цін](/pricing#packages).

  - type: cards
    id: more
    eyebrow: Окрім ціни
    title: Що ще ви отримуєте з ArenaSoldOut.com?
    items:
      - title: Схеми залів, намальовані для вас безкоштовно
        text: "Надішліть PDF, фото ескіза від руки або таблицю рядів і місць. Команда збудує майданчик; самі ви його не малюєте."
        link: { label: Схеми залів, href: /product/seating }
      - title: Гроші просто на ваш акаунт
        text: "Покупці платять на ваш власний акаунт Stripe, Flitt або AllPay з кожним замовленням. ArenaSoldOut.com ніколи не тримає кошти, тож щотижневої виплати чекати не треба."
        link: { label: Платежі, href: /payments }
      - title: Нижча ставка для дешевих квитків
        text: "Коли кожен квиток події коштує {usdLowMax} або менше: {lowPercent}% від ціни квитка замість фіксованої плати. Дискотеки, забіги, дитячі свята, екскурсії."
        link: { label: Як це працює, href: /pricing#low-price }
      - title: Покупці своєю мовою
        text: "Сторінка покупця, листи й квитки мовою покупця, зокрема іврит справа наліво. Будь-яку нову мову додаємо протягом 40 годин."
        link: { label: Електронні квитки, href: /product/tickets }
      - title: Кожен продаж у вашому Telegram
        text: "Створіть подію з фото афіші в Telegram-боті й бачте кожен продаж і повернення коштів у своїй групі за лічені секунди."
        link: { label: Telegram-бот, href: /product/telegram }
      - title: Налаштуйте самі або передайте нам
        text: "Події, ціни й категорії ви створюєте самі в Event Center або в Telegram-боті, за лічені хвилини; схеми залів ми малюємо безкоштовно. Немає часу? Наш менеджер подій зробить це за вас, як платну послугу."
        link: { label: Додаткові послуги, href: /pricing#services }

  - type: faq
    id: questions
    title: Питання, які організатори ставлять, порівнюючи
    items:
      - q: Чи дешевший ArenaSoldOut.com за TicketSpice?
        a: "За квиток так: {usdPrice} замість US$0,99 на TicketSpice Standard і {usdSeated} за квиток з місцем замість US$1,49 на TicketSpice Premium. З кредитами від {usdFrom} за квиток. Обробка карток окремо на обох."
      - q: Чи потрібен вищий тариф для бронювання місць?
        a: "Ні. Кожна подія може мати схему залу; квиток з місцем коштує {usdSeated}. Схему ви не малюєте: надішліть нам PDF, фото ескіза або таблицю рядів і місць, і команда збудує її безкоштовно."
      - q: Куди йдуть гроші покупця?
        a: "На ваш власний платіжний акаунт з кожним замовленням: Stripe, Flitt або AllPay. ArenaSoldOut.com ніколи не тримає кошти. Нашу комісію виставляємо в рахунку після події або списуємо з ваших кредитів."
      - q: Чи можу я продавати за межами США та Канади?
        a: "Так. Організатори в країнах ЄС сплачують нашу комісію в євро, {eurPrice} за квиток при оплаті після події; решта світу в доларах США. Квитки продаються у валюті вашого платіжного акаунта."
      - q: Чи можу я перенести свої події з TicketSpice?
        a: "Так. Ви створюєте події в Event Center або в Telegram-боті, ми безкоштовно малюємо ваші схеми залів, а ви продовжуєте продавати на TicketSpice, доки ваша сторінка в нас не буде готова. Немає часу налаштовувати самі? Наш [менеджер подій](/pricing#services) зробить це за вас, як платну послугу."
      - q: Чи плачу я підписку?
        a: "Ні. Ви платите лише за продані квитки. Запрошення й безкоштовні квитки на платні події комісією не обкладаються."

