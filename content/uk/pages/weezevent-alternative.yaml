sections:
  - type: compare
    id: prices
    eyebrow: Ціни в євро
    title: Як порівнюються дві пропозиції?
    lead: "Ціни обох платформ станом на 11 листопада 2026 року. Наша комісія за проданий квиток поруч із комісією Weezevent за онлайн-продаж квитків. Комісія Weezevent включає банківські збори; у нас плату за картку бере ваш власний платіжний провайдер за вашою ставкою, поверх нашої комісії."
    cols: { what: "", us: ArenaSoldOut.com, them: Weezevent }
    rows:
      - { what: "Як рахується плата", us: "Фіксована плата за квиток", them: "2,5% від ціни квитка, щонайменше €0,99" }
      - { what: "Квиток €20", us: "**{eurPrice}** + плата за картку вашого провайдера", them: "€0,99, банківські збори у складі" }
      - { what: "Квиток €50", us: "**{eurPrice}** + плата за картку вашого провайдера", them: "€1,25, банківські збори у складі" }
      - { what: "Квиток €100", us: "**{eurPrice}** + плата за картку вашого провайдера", them: "€2,50, банківські збори у складі" }
      - { what: "Коли ви отримуєте гроші", us: "З кожним замовленням, на ваш акаунт", them: "Раз на 15 днів, виплачує Weezevent" }
      - { what: "Хто тримає гроші покупця", us: "Ви, з першого замовлення", them: "Weezevent, до виплати" }
      - { what: "Нумеровані місця", us: "**{eurSeated}** за квиток з місцем, схему малюємо для вас безкоштовно", them: "Лише індивідуальна пропозиція, ціна за запитом" }
      - { what: "Кредити, оплачені наперед", us: "Від **{eurFrom}** за квиток, не згорають", them: "Немає в їхньому прайсі" }
      - { what: "Підписка", us: Немає, them: Немає }
    note: "Ціни Weezevent: [weezevent.com/fr/nos-tarifs](https://weezevent.com/fr/nos-tarifs/) і [weezevent.com/en-gb/our-prices](https://weezevent.com/en-gb/our-prices/), перевірено 11 листопада 2026 року, з ПДВ, як опубліковано. Наші ціни: [ціни](/pricing) і [докладні умови](/pricing/terms), без ПДВ. Weezevent є торговою маркою свого власника; ArenaSoldOut.com не афілійований з ним."

  - type: prose
    id: examples
    title: Що різниця означає на практиці?
    body: |
      Усі суми за цінами обох платформ станом на 11 листопада 2026 року.

      **Гроші до заходу.** Фестиваль продає 2000 квитків за три тижні до відкриття воріт. З ArenaSoldOut.com кожен платіж потрапляє на ваш власний акаунт у мить оплати замовлення, тож сцену, звук і охорону ви оплачуєте з грошей за квитки. З виплатою раз на 15 днів частина цих грошей приходить пізніше, ніж вони були потрібні.

      **Театр з нумерованими місцями.** У нас схема залу входить у кожен захід: ви надсилаєте PDF або фото ескіза від руки, команда безкоштовно будує схему, а квиток з місцем коштує {eurSeated}. У Weezevent нумеровані місця входять в індивідуальну пропозицію, ціна за запитом.

      **Сама комісія.** Наша {eurPrice} за квиток, хоч скільки він коштує; у Weezevent 2,5% з мінімумом €0,99, банківські збори у складі. Додайте до нашої плату за картку вашого платіжного провайдера, щоб порівняти підсумки для вашої ціни квитка.

  - type: cards
    id: more
    eyebrow: Окрім ціни
    title: Що ще ви отримуєте з ArenaSoldOut.com?
    items:
      - title: Гроші просто на ваш акаунт
        text: "Покупці платять на ваш власний акаунт Stripe, Flitt або AllPay. ArenaSoldOut.com ніколи не тримає кошти і нічого не вираховує з ваших продажів."
        link: { label: Платежі, href: /payments }
      - title: Схеми залів, намальовані для вас безкоштовно
        text: "Надішліть PDF, фото ескіза від руки або таблицю рядів і місць. Команда збудує майданчик; самі ви його не малюєте."
        link: { label: Схеми залів, href: /product/seating }
      - title: Нижча ставка для дешевих квитків
        text: "Коли кожен квиток заходу коштує {eurLowMax} або менше: {lowPercent}% від ціни квитка замість фіксованої плати. Дискотеки, забіги, дитячі свята, екскурсії."
        link: { label: Як це працює, href: /pricing#low-price }
      - title: Покупці своєю мовою
        text: "Сторінка покупця, листи й квитки мовою покупця, зокрема іврит справа наліво. Будь-яку нову мову додаємо протягом 40 годин."
        link: { label: Електронні квитки, href: /product/tickets }
      - title: Кожен продаж у вашому Telegram
        text: "Створіть захід з фото афіші в Telegram-боті й бачте кожен продаж і повернення коштів у своїй групі за лічені секунди."
        link: { label: Telegram-бот, href: /product/telegram }
      - title: Налаштуйте самі або передайте нам
        text: "Заходи, ціни й категорії ви створюєте самі в Event Center або в Telegram-боті, за лічені хвилини; схеми залів ми малюємо безкоштовно. Немає часу? Наш менеджер заходів зробить це за вас, як платну послугу."
        link: { label: Додаткові послуги, href: /pricing#services }

  - type: faq
    id: questions
    title: Питання, які організатори ставлять, порівнюючи
    items:
      - q: Чи дешевший ArenaSoldOut.com за Weezevent?
        a: "Наша комісія нижча: {eurPrice} за квиток проти щонайменше €0,99 у Weezevent. Комісія Weezevent включає банківські збори, а наша ні, тож додайте до нашої плату за картку вашого платіжного провайдера, щоб порівняти підсумки для вашої ціни квитка."
      - q: Коли я отримую гроші за квитки?
        a: "З кожним замовленням. Покупець платить на ваш власний платіжний акаунт: Stripe, Flitt або AllPay. ArenaSoldOut.com ніколи не тримає кошти. Нашу комісію виставляємо в рахунку після заходу або списуємо з ваших кредитів."
      - q: Чи є у вас безготівкові платежі та RFID-браслети?
        a: "Ні. ArenaSoldOut.com продає квитки й перевіряє їх на вході застосунком-сканером MACS. Якщо вам потрібні безготівкові платежі в барі, залиште для цього окремого провайдера."
      - q: Чи можу я перенести свої заходи з Weezevent?
        a: "Так. Ви створюєте заходи в Event Center або в Telegram-боті, ми безкоштовно малюємо ваші схеми залів, а ви продовжуєте продавати на Weezevent, доки ваша сторінка в нас не буде готова. Немає часу налаштовувати самі? Наш [менеджер заходів](/pricing#services) зробить це за вас, як платну послугу."
      - q: Чи плачу я підписку?
        a: "Ні. Ви платите лише за продані квитки. Запрошення й безкоштовні квитки на платні заходи комісією не обкладаються."

