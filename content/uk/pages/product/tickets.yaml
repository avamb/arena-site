title: "Електронні квитки з EAN-13 і QR, сканування, листи"
description: "PDF-квитки з EAN-13 і QR мовою покупця, застосунок-сканер MACS для iOS і Android, зразки квитків, листи, коли сеанс переноситься або скасовується."
h1: Квиток, що сканується
lead: Кожен квиток це PDF зі штрихкодом EAN-13 і QR-кодом, мовою покупця. Скануйте його застосунком або ручним сканером, надсилайте повторно, повертайте кошти, замінюйте, коли дата переноситься.
