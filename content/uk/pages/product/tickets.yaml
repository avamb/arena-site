sections:
  - type: faq
    id: questions
    eyebrow: Квитки
    title: Що отримує покупець?
    items:
      - q: Що є на квитку?
        a: "Подія, сеанс, місце або категорія, ціна, ім'я покупця, штрихкод EAN-13 і QR-код. Один PDF на замовлення, мовою покупця: на сторінці англійською, російською, чеською, івритом або іспанською, у листах сімома мовами. Будь-яку нову мову додаємо протягом 40 годин."
      - q: Чи є квитанція про оплату в листі?
        a: "Так. Квитанція про оплату додається до листа з квитком, а в листі вказано, хто отримав платіж: ваша організація і ваш платіжний провайдер."
      - q: Чи можу я перевірити, що покупець отримав квиток?
        a: "Так. Кожен лист показує свій статус у картці замовлення: Надіслано, Доставлено, Прочитано. Ви завжди бачите, чи отримав покупець квиток, і можете надіслати його ще раз, якщо він загубився."
      - q: Як скануватися на вході?
        a: "[Застосунком-сканером MACS](#scanner) для iOS і Android або ручним сканером штрихкодів. Застосунок також приймає квитки, продані вашими партнерами в інших системах, тож один вхід працює для кожного каналу."
      - q: Чи можу я побачити квиток до початку продажу?
        a: Так. Зразок квитка з водяним знаком надається разом із подією, з Event Center або Telegram-бота.
      - q: Що буде, коли дата переноситься?
        a: Покупці отримують лист своєю мовою з оновленим квитком у вкладенні. Так само при скасуванні, а повернення коштів обробляєте ви.
      - q: Чи можу я надіслати квиток повторно або повернути кошти?
        a: Так, з Event Center. Повторно на нову адресу, повернення на картку покупця, місце повертається в продаж.
      - q: Чи є застосунок для покупців?
        a: Ні. На вході достатньо PDF і листа; нічого встановлювати не треба.
  - type: cards
    id: scanner
    eyebrow: На вході
    title: Який застосунок сканує квитки?
    lead: "MACS це застосунок контролю доступу ArenaSoldOut.com. Встановіть його на телефони персоналу на вході, увійдіть зі своїм обліковим записом Event Center і скануйте EAN-13 або QR на кожному квитку: папір, PDF на екрані або лист. Один застосунок сканує квитки будь-якого організатора платформи і квитки партнерів з інших систем, тож майданчик, фестиваль або промоутер, що орендує майданчик, використовує ті самі телефони для кожної події."
    items:
      - { title: iPhone і iPad, text: "MACS в App Store. Увійдіть зі своїм обліковим записом Event Center; список подій і сеанси вже там.", link: { label: Відкрити App Store →, href: "https://apps.apple.com/app/id6770095694" } }
      - { title: Android, text: "MACS у Google Play. Той самий застосунок, той самий обліковий запис, ручні сканери з камерою або лазером теж працюють.", link: { label: Відкрити Google Play →, href: "https://play.google.com/store/apps/details?id=com.arenasoldout.macs" } }
      - { title: "Будь-який організатор, один застосунок", text: "Персонал майданчика сканує квитки кожного організатора, що продає через ArenaSoldOut.com, і квитки, продані партнерами в інших системах, без перемикання застосунків.", link: { label: "MACS як продукт →", href: /product/scanner } }
  - type: cta
    id: start
    title: Почніть продаж сьогодні
    text: Створіть подію, підключіть платіжний акаунт, поділіться посиланням. Зразок квитка готовий разом із подією.
    primary: { label: Створити подію, href: /start#create }
    secondary: { label: Відкрити Telegram-бота, href: https://t.me/EventsCentrBot }
    note: "Або напишіть нам: ми налаштуємо все разом із вами під час дзвінка."
