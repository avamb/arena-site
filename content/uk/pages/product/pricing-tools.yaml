title: "Промокоди, ранній продаж, ступені, безкоштовні квитки"
description: "Промокоди з областю дії та лімітами, цінові періоди за датою, кількісні ступені, ланцюжки категорій, сервісний збір за каналом, безкоштовні квитки."
h1: Ціни, що змінюються так, як ви запланували
lead: Ранній продаж за датою, наступна ціна, коли ступінь розпродано, коди для партнерів, сервісний збір за каналом. Усе налаштовується в Event Center і застосовується у віджеті та на сторінці на нашому хостингу.
