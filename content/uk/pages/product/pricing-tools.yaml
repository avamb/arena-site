sections:
  - type: faq
    id: questions
    eyebrow: Інструменти цін
    title: Що я можу робити з цінами?
    items:
      - q: Чи можна використовувати промокоди?
        a: Так. Код може діяти на один захід, один сеанс або одну категорію, з періодом продажу, мінімальним замовленням і лімітом на покупця. Партнери отримують власні коди.
      - q: Чи є готова цінова схема?
        a: "Так, розумна ціна. Оберіть готову схему цінових ступенів за кількістю і за датою замість того, щоб налаштовувати кожен ступінь вручну. Згодом її можна скоригувати."
      - q: Чи можна продавати квиток лише разом з іншим?
        a: "Так, через додаткові категорії. Додаток продається лише разом із квитком основної категорії того самого сеансу. Наприклад, дитячий квиток не можна продати без дорослого, а «ще одна дитина» додається до «дитина плюс дорослий». Коли основні категорії розпродано, сеанс показується як розпроданий."
      - q: Чи можуть ціни змінюватися в задану мною дату?
        a: Так. Ціни раннього продажу перемикаються за датою й часом. Кількісні ступені відкривають наступну ціну, коли поточна розпродана, тож розпроданий ступінь ніколи не блокує продаж.
      - q: Кілька цін для одного заходу?
        a: Так. Категорії з власною ціною, квотою й періодом продажу. Категорії можуть утворювати ланцюжки, що передають нерозпродані місця наступній.
      - q: Чи можна додати сервісний збір?
        a: Так. Відсоток для кожного каналу продажу, який покупець бачить окремим рядком і який надходить на ваш рахунок разом із ціною квитка.
      - q: Безкоштовні квитки й оплата за вибором покупця?
        a: Так, обидва. Безкоштовні квитки для запрошень і реєстрацій та квитки з оплатою за вибором покупця із заданим вами мінімумом.
      - q: Чи працюють знижки з місцями?
        a: Так. Коди й періоди діють на категорії з місцями так само, як і на стоячі зони.
  - type: cta
    id: start
    title: Налаштуйте свої ціни сьогодні
    text: Створіть захід, додайте категорії й періоди, підключіть платіжний акаунт, поділіться посиланням.
    primary: { label: Створити захід, href: /start#create }
    secondary: { label: Дивитися ціни, href: /pricing }
    note: Умови для великих обсягів та індивідуальні за запитом.
