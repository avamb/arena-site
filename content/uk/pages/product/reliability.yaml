title: "Надійність: 800 замовлень на хвилину, щонічні копії"
description: "Навантажувальні тести: 800 замовлень на хвилину при 1000 покупцях одночасно. Сторожовий сервіс зі сповіщеннями в Telegram, щонічні зашифровані копії."
h1: Чи впорається система зі стадіоном?
lead: Так. Платформу перевірено навантаженням, за нею стежать цілодобово, і щоночі робиться резервна копія. Наведені нижче цифри мають дати і розміщені на сторінці фактів, де оновлюються з кожним випуском.
related:
  - { label: Факти з датами, href: /facts }
  - { label: Останні зміни, href: /changes }
  - { label: Для розробників, href: /developers }
sections:
  - type: faq
    id: questions
    eyebrow: Надійність
    title: Що було виміряно?
    items:
      - q: Яке навантаження перевірено?
        a: "800 замовлень на хвилину при 1000 покупцях на сторінці одночасно, в навантажувальних тестах вересня 2026 року. Дата й цифри на [сторінці фактів](/facts)."
      - q: Що буде, якщо щось зламається вночі?
        a: Сторожовий сервіс постійно перевіряє платформу і сповіщає команду в Telegram раніше, ніж організатори помітять проблему. Cloudflare стоїть перед кожною сторінкою та API.
      - q: Чи робиться резервна копія моїх даних?
        a: Щоночі, із шифруванням. Замовлення, покупці, схеми залів і заходи.
      - q: А боти та масове бронювання?
        a: Утримання місць закінчується за таймером, кількість замовлень обмежено, а Cloudflare відфільтровує шкідливий трафік до того, як він дійде до платформи.
      - q: Чи можу я побачити історію змін?
        a: "Так, кожна функція, що дійшла до організаторів, наведена з датою на [сторінці змін](/changes)."
  - type: cta
    id: start
    title: Почніть продаж сьогодні
    text: Створіть захід, підключіть платіжний акаунт, поділіться посиланням.
    primary: { label: Створити захід, href: /start#create }
    secondary: { label: Читати факти, href: /facts }
    note: "Або напишіть нам: ми налаштуємо все разом із вами під час дзвінка."
