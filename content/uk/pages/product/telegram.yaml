title: "Бот організатора в Telegram: створення заходу з афіші"
description: "Створіть захід з фото афіші, підтвердьте прочитане ботом, додайте дати й команду. Кожен продаж і повернення коштів надходить у Telegram-групу за лічені секунди."
h1: Керуйте заходом з Telegram
lead: Event Center живе і в боті. Для початку достатньо фото афіші; кожне прочитане значення це кнопка підтвердження, без вас нічого не публікується.
related:
  - { label: Event Center у браузері, href: /#center }
  - { label: Продаж на вашому сайті або нашому, href: /product/sell }
  - { label: Почати продаж, href: /start }
sections:
  - type: steps
    id: how
    eyebrow: Як це працює
    title: Що робить бот?
    items:
      - title: Читає афішу
        text: Надішліть фото. Бот читає назву, дати, майданчик і ціни та показує кожне значення кнопкою, яку можна підтвердити або виправити.
      - title: Будує захід
        text: Сеанси, категорії, ціни та афіша потрапляють у захід. Додайте членів команди, отримайте зразок квитка з водяним знаком, опублікуйте, коли все готово.
      - title: Повідомляє про кожен продаж
        text: Кожен продаж і повернення коштів надходить у вашу групу організатора за лічені секунди, з ім'ям покупця, місцями, сумою та контактом.
  - type: faq
    id: questions
    eyebrow: Питання
    title: Чи Telegram єдиний спосіб?
    items:
      - q: Чи потрібен мені Telegram, щоб користуватися ArenaSoldOut.com?
        a: "Ні. Той самий Event Center працює в браузері на ArenaSoldOut.com, і команда може налаштувати все за вас. Telegram це один зі способів, для організаторів, які живуть у месенджері."
      - q: Якими мовами говорить бот?
        a: Сьогодні англійською, російською та іспанською; інші з'являться разом із мовами сайту.
      - q: Чи може користуватися ним моя команда?
        a: Так. Додайте членів команди з ролями; до групи продажів можна включити всіх, кому потрібно бачити замовлення.
      - q: Чи працює він зі схемою залу?
        a: Бот створює заходи з категоріями й датами; схему залу будує команда і прикріплює до заходу.
  - type: cta
    id: start
    title: Відкрийте бота
    text: Надішліть афішу або просто привітайтеся. Команда відповідає в тому самому чаті.
    primary: { label: Відкрити Telegram-бота, href: https://t.me/EventsCentrBot }
    secondary: { label: Натомість почати на сайті, href: /start }
    note: Заходу без схеми залу надходять у продаж сьогодні.
