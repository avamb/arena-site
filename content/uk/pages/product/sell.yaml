title: "Продаж квитків на вашому сайті або на нашій сторінці"
description: "Вбудуйте віджет квитків трьома рядками, скористайтеся плагіном WordPress або поділіться сторінкою продажу. Покупці платять на ваш власний платіжний акаунт."
h1: Ваш сайт або наш. Гроші надходять вам в обох випадках.
lead: Два способи продавати, один Event Center за ними. Вбудуйте віджет на сайт, який у вас уже є, або поділіться сторінкою, яку ми створюємо за кілька хвилин. Кожне замовлення потрапляє на ваш власний платіжний акаунт.
related:
  - { label: "Схеми залів, що відповідають майданчику", href: /product/seating, text: "Надішліть PDF, ескіз або таблицю рядів; ми безкоштовно намалюємо схему." }
  - { label: Платежі на ваш власний акаунт, href: /payments, text: "Провайдери за країнами, статуси, як підключити." }
  - { label: Сайти на WordPress, href: /solutions/wordpress, text: "Плагін із замовленнями WooCommerce, двоє клієнтів перейшли з ArenaSoldOut.com без простою." }
sections:
  - type: ways
    id: ways
    eyebrow: Де ви продаєте
    title: Який спосіб підходить моєму заходу?
    items:
      - title: У вас є сайт
        text: "Ваш сайт і є касою. Вбудуйте віджет квитків на будь-яку сторінку: WordPress, Tilda, Wix, Webflow або власний код. Покупці не залишають ваш домен."
        bullets:
          - Віджет на будь-якому сайті, три рядки коду
          - Плагін для WordPress із замовленнями WooCommerce
          - Ваші кольори, ваші шрифти, ваша мова
      - title: У вас немає сайту
        text: "Сторінку продажу розміщуємо ми: tickets.arenasoldout.com/your-name/your-event. Діліться одним посиланням у соцмережах, месенджерах і на афіші."
        bullets:
          - Сторінка на кожного організатора і на кожен захід
          - Окрема сторінка для кожного промоутера
          - Готово за кілька хвилин, без роботи дизайнера
          - Посилання на ваших партнерів-продавців на тій самій сторінці
  - type: cards
    id: page
    eyebrow: Ваша сторінка продажу
    title: Що ще вміє моя сторінка продажу?
    lead: "Усе нижче працює на сторінці вашого заходу на платформі та у віджеті. Налаштовуйте в Event Center."
    items:
      - title: Матеріали заходу на вашій сторінці продажу
        text: "Додавайте матеріали до заходу на своїй сторінці продажу на платформі, якщо власного сайту немає: тексти, фото й відео."
      - title: Описи, що виглядають оформленими
        text: "Заголовки, списки, посилання й цитати в описі заходу на вашій сторінці продажу. Нейромережа форматує звичайний текст за вас одним кліком."
      - title: '«Повідомити, коли відкриється продаж»'
        text: "Покупці підписуються на сторінці вашого заходу і отримують лист у момент відкриття продажу, своєю мовою."
      - title: Нагадування про покинутий кошик
        text: "Покупець, який забронював квитки і не оплатив, отримує нагадувальний лист. У багатьох випадках такі нагадування помітно підвищують продажі. Можна запропонувати знижку за згоду на вашу розсилку."
      - title: Приведіть друга
        text: "Кожен покупець отримує особисте посилання. Друг отримує знижку, а покупець, який привів друга, отримує кешбек на картку після заходу друга."
      - title: Короткі посилання і QR-коди для друку
        text: "Коротке посилання go.arenasoldout.com з QR-кодом для афіш, флаєрів і соцмереж: PNG, SVG або готова PDF-вкладка у форматах A5 і A6 для друку. Адресу переходу можна змінити вже після друку. Кожне замовлення прив'язане до свого посилання, тож ви бачите, яка афіша продала."
      - title: Магазин поруч із квитками
        text: "Продавайте товари разом із квитками: вино, напої за передзамовленням до заходу, мерч, подарункові набори. Вітрина з варіантами, кошик, повернення коштів і листи. Покупець забирає замовлення на заході, або ви надсилаєте його поштою чи кур'єром, якого організовуєте самі. Магазин підключається окремо, умови за запитом. Наш перший клієнт з магазином уже продає так."
  - type: faq
    id: questions
    eyebrow: Питання
    title: Що робить віджет на моєму сайті?
    items:
      - q: Як розмістити віджет на моєму сайті?
        a: "Два рядки HTML: тег script і елемент <arena-tickets> з вашим токеном стрічки. Віджет показує сеанси, схему залу або категорії, кошик і оформлення замовлення. Деталі та код на [сторінці для розробників](/developers)."
      - q: Чи виглядає він як мій сайт?
        a: Так. Віджет читає зі сторінки чотири змінні CSS (акцентний колір, радіус, фон, межа) і підлаштовується під мову покупця. Без iframe, без другого дизайну.
      - q: Де платить покупець?
        a: "На сторінці оплати вашого власного платіжного провайдера, на ваш власний акаунт. ArenaSoldOut.com створює замовлення, утримує місця і випускає квиток; гроші він ніколи не тримає. Дивіться [платежі](/payments)."
      - q: Чи можу я продавати і через партнерів?
        a: Так. Кожен промоутер отримує сторінку з власним посиланням, а на сторінці на нашому хостингу можна перелічити ваших партнерів-продавців. Продажі з кожного каналу з'являються в одному Event Center.
      - q: Що, якщо я перенесу сайт на іншу платформу?
        a: Для покупців нічого не змінюється. Віджет є веб-компонентом; він переїжджає разом із вашими сторінками, а сторінка на нашому хостингу лишається запасним варіантом.
  - type: cta
    id: start
    title: Почніть продаж сьогодні
    text: "Створіть захід, підключіть платіжний акаунт, поділіться посиланням. Захід без схеми залу надходить у продаж за 10 хвилин; схему залу ми малюємо для вас безкоштовно."
    primary: { label: Створити захід, href: /start#create }
    secondary: { label: Відкрити Telegram-бота, href: https://t.me/EventsCentrBot }
    note: "Або напишіть нам: ми налаштуємо все разом із вами під час дзвінка."
