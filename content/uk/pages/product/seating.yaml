sections:
  - type: faq
    id: questions
    eyebrow: Місця
    title: Як працюють місця з ArenaSoldOut.com?
    items:
      - q: Чи треба мені самому малювати схему?
        a: "Ні, ніколи. Надішліть нам схему, і ми безкоштовно намалюємо її у вашій події, зазвичай протягом доби. Достатньо будь-чого з цього: PDF зі схемою залу, фото ескіза від руки або таблиці рядів із кількістю місць у кожному (Excel або Google Sheets). Векторні файли (SVG) імпортуються напряму."
      - q: Чи можуть в одній події бути місця й стоячі зони?
        a: Так, в одній схемі. Ряди з нумерованими місцями та категоріями, стоячі зони з квотами, кожна категорія з власною ціною й періодом продажу.
      - q: Чи можна змінити схему після початку продажу?
        a: Так. У схем є версії, тож нове розташування для наступного сеансу не зачіпає вже продані квитки.
      - q: Скільки мені коштує квиток з місцем?
        a: "Комісія за квиток з місцем становить US$1,09 (€0,97 у країнах ЄС), проти US$0,59 (€0,53) без місця; кредити її знижують. Сама схема безкоштовна. Дивіться [ціни](/pricing)."
      - q: Чи обирає покупець місце на телефоні?
        a: Так. Схема місць однакова у віджеті та на сторінці на нашому хостингу, з масштабуванням щипком на телефонах, легендою за категоріями і таймером утримання обраних місць.
      - q: А запрошення та місця для преси?
        a: Випускайте безкоштовні квитки на конкретні місця з Event Center; вони скануються на вході, як і будь-який квиток.
  - type: cards
    id: who
    eyebrow: Типові майданчики
    title: Хто використовує нумеровані місця?
    items:
      - { title: Театри, text: "Від 100 до 1500 місць, повторні дати, запрошення для преси та партнерів.", link: { label: Для театрів →, href: /solutions/theatre } }
      - { title: Концертні зали та клуби, text: "Одна схема використовується повторно для багатьох подій на місяць, окремі умови для постійних майданчиків.", link: { label: Для майданчиків →, href: /solutions/venues } }
      - { title: Гастрольні шоу, text: "Одне шоу, багато міст, одна схема на майданчик використовується повторно під час наступного візиту.", link: { label: Для концертних турів →, href: /solutions/concert-tours } }
  - type: cta
    id: start
    title: Надішліть нам свою схему
    text: "Достатньо PDF, фото ескіза від руки або таблиці рядів і місць. Ми безкоштовно намалюємо її у вашій події та покажемо результат до початку продажу."
    primary: { label: Почати продаж, href: /start }
    secondary: { label: Відкрити Telegram-бота, href: https://t.me/EventsCentrBot }
    note: Події без схеми залу надходять у продаж сьогодні.
