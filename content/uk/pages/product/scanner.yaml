title: "Застосунок MACS: сканування квитків на iOS і Android"
description: "MACS сканує квитки EAN-13 і QR будь-якого організатора та квитки партнерів на iPhone, iPad, Android і ручних сканерах. Безкоштовно в App Store і Google Play."
h1: "MACS: застосунок на вході"
lead: Один застосунок для кожного входу. Персонал на вході авторизується, обирає сеанс і сканує EAN-13 або QR на квитку, на папері чи на екрані. Він приймає квитки будь-якого організатора, що продає через ArenaSoldOut.com, і квитки партнерів з інших систем, тож майданчик використовує ті самі телефони для кожної події.
related:
  - { label: Електронні квитки з EAN-13 і QR, href: /product/tickets }
  - { label: "Майданчики та клуби: одна схема, кожна подія", href: /solutions/venues }
  - { label: Партнери та агенції, href: /partners }
sections:
  - type: cards
    id: get
    eyebrow: Отримати застосунок
    title: Де встановити MACS?
    lead: Безкоштовно для організаторів платформи. Встановіть його на стільки телефонів, скільки у вас входів, і увійдіть зі своїм обліковим записом Event Center.
    items:
      - { title: iPhone і iPad, text: "MACS в App Store. Увійдіть зі своїм обліковим записом Event Center; ваші події та сеанси вже там.", link: { label: Відкрити App Store →, href: "https://apps.apple.com/app/id6770095694" } }
      - { title: Android, text: "MACS у Google Play. Той самий застосунок і той самий обліковий запис; ручні сканери на Android із вбудованим лазером теж працюють.", link: { label: Відкрити Google Play →, href: "https://play.google.com/store/apps/details?id=com.arenasoldout.macs" } }
      - { title: Ручні сканери, text: "USB- або Bluetooth-сканер штрихкодів, підключений до телефона чи ноутбука, читає той самий EAN-13; застосунок фіксує сканування.", link: { label: Як побудовано квитки →, href: /product/tickets } }
  - type: faq
    id: questions
    eyebrow: Питання
    title: Що робить сканер?
    items:
      - q: Які квитки він сканує?
        a: "Кожен квиток, виданий ArenaSoldOut.com: PDF зі штрихкодом EAN-13 і QR-кодом, надрукований або показаний на екрані, і лист із квитком. Квитки, продані вашими партнерами в інших системах, приймаються поруч із ними, тож один вхід працює для кожного каналу продажу."
      - q: Чи може один застосунок обслуговувати кількох організаторів?
        a: Так. MACS сканує квитки будь-якого організатора платформи. Персонал майданчика чи фестивалю перемикається між подіями та сеансами в застосунку; кожен організатор бачить сканування своїх подій в Event Center.
      - q: Що бачить персонал під час сканування?
        a: Чи дійсний квиток, з місцем або категорією, або чому він недійсний (уже використаний, скасований, інший сеанс). Організатор бачить кількість пропущених за сеансом в Event Center.
      - q: Чи потрібен мені продаж квитків ArenaSoldOut.com, щоб користуватися сканером?
        a: "Сьогодні MACS входить у пакет для організаторів, що продають через ArenaSoldOut.com, і приймає квитки партнерів з інших систем поруч із квитками ArenaSoldOut.com. Лише сканування для квитків, проданих деінде, пропонуємо за запитом: напишіть нам, вказавши вашу систему продажу квитків і подію."
      - q: Скільки телефонів можуть сканувати одночасно?
        a: Стільки, скільки у вас входів. Сканування фіксується централізовано, тож квиток, пропущений на одному вході, не буде пропущений повторно на іншому.
      - q: Скільки це коштує?
        a: Нічого понад ціну за квиток для організаторів платформи. Умови використання лише для сканування узгоджуються для кожної події; умови платформи дивіться на сторінці цін.
  - type: cards
    id: who
    eyebrow: Хто користується
    title: Хто сканує з MACS?
    items:
      - { title: Майданчики та клуби, text: "Один застосунок для кожного промоутера, що орендує майданчик; майданчик бачить кожну подію, кожен промоутер бачить свої.", link: { label: Для майданчиків і клубів →, href: /solutions/venues } }
      - { title: Фестивалі, text: "Кілька входів, багато телефонів, один підрахунок. Квитки партнерів приймаються на тих самих входах.", link: { label: Для фестивалів →, href: /solutions/festivals } }
      - { title: Агенції та партнери, text: "Скануйте квитки, які ви продали через ArenaSoldOut.com, і квитки із систем, якими ваші клієнти вже користуються.", link: { label: Партнери →, href: /partners } }
  - type: cta
    id: start
    title: Поставте MACS на свій вхід
    text: "Встановіть застосунок, увійдіть зі своїм обліковим записом Event Center, скануйте. Сканування для квитків, проданих деінде: напишіть нам, вказавши вашу систему продажу квитків і подію."
    primary: { label: Зв'язатися з нами, href: /contact }
    secondary: { label: Відкрити Telegram-бота, href: https://t.me/EventsCentrBot }
    note: "Безкоштовно в App Store і Google Play для організаторів платформи."
