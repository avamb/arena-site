title: "Продовжити заявку"
description: "Введіть e-mail, з яким ви подавали заявку, і ми надішлемо посилання на розпочату чернетку."
h1: Продовжити заявку
lead: Введіть e-mail, з яким ви подавали заявку. Ми надішлемо посилання на вашу чернетку, щоб ви продовжили з місця, де зупинилися.
sections:
  - type: onboarding
    id: form
    mode: continue
    ui:
      noscript: "Форма заявки потребує JavaScript. Натомість напишіть нам у Telegram, і ми налаштуємо все вручну."
