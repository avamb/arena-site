      err_not_allowed: "Ми поки не приймаємо заявки з цієї країни"
      e_generic: "Щось пішло не так. Спробуйте за хвилину або напишіть нам у Telegram."
      e_network: "Немає зв'язку із сервером. Перевірте інтернет і спробуйте ще раз."
