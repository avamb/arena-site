title: "Дякуємо, ми отримали вашу заявку"
description: "Команда читає кожну заявку особисто й відповідає протягом одного робочого дня."
h1: Дякуємо
lead: Команда читає кожну заявку особисто й відповідає протягом одного робочого дня, електронною поштою або в месенджері, який ви вказали.
sections:
  - type: cards
    id: next
    eyebrow: Тим часом
    title: Що я можу зробити зараз?
    items:
      - title: Підготуйте афішу й ціни
        text: Назва події, дати, ціни квитків і зображення афіші це все, що потрібно, щоб пустити в продаж подію без схеми залу.
        link: { label: "Як це працює →", href: /#how }
      - title: Знайдіть ключі свого платіжного акаунта
        text: Якщо у вас уже є акаунт у провайдера вашої країни, ключі API лежать у його кабінеті. Якщо ні, ми відкриємо його разом із вами.
        link: { label: "Платежі →", href: /payments }
      - title: Спробуйте бот у Telegram
        text: Бот створює подію за фото афіші та просить вас підтвердити дати, ціни й майданчик.
        link: { label: "Відкрити Telegram-бота →", href: https://t.me/EventsCentrBot }
