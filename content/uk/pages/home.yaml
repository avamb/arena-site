  - type: facts
    items:
      - Організатори у **31** країні з 2019 року
      - "**800** замовлень на хвилину в навантажувальних тестах"
      - Квитки **7** мовами
      - Виплати надходять на **ваш** рахунок

  - type: reasons
    id: why
    eyebrow: Чому ArenaSoldOut.com
    title: Чому організатори продають квитки з нами?
    lead: "Чотири причини, і за кожною стоять факти."
    items:
      - icon: wallet
        title: З кожного квитка вам лишається більше
        text: "Фіксовані **{price}** за квиток, а не відсоток від вашого доходу: квиток за $15 і квиток за $150 коштують вам однаково. Покупці платять на ваш платіжний акаунт, тож гроші ваші з моменту оплати, а не після події."
        bullets:
          - Нічого не вираховується з ваших продажів, жодного резерву
          - Без комісії за запрошення та безкоштовні квитки
          - Схему залу малюємо безкоштовно
        link: { label: Ціни та калькулятор →, href: /pricing }
      - icon: clock
        title: У продажу за 10 хвилин
        text: "Щойно вашу організацію підтверджено, зазвичай протягом доби, подія без схеми залу надходить у продаж за **10 хвилин**, якщо у вас уже є акаунт у платіжного провайдера. Ви підключаєте його один раз; для кожної наступної події потрібні лише назва, дати й ціни."
        link: { label: "Ваша перша подія крок за кроком →", href: /first-event }
      - icon: list-checks
        title: Те, про що просять організатори, уже готове
        text: "Жодних модулів для докупівлі, жодних плагінів для встановлення:"
        bullets:
          - Віджет на вашому сайті або сторінка продажу, яку розміщуємо ми
          - Місця і стоячі зони в одній події
          - Промокоди, ціни, що змінюються за датою
          - Запрошення, повернення коштів, перенесені дати з листами покупцям
          - Застосунок-сканер для iOS і Android
          - Кожен продаж у вашій Telegram-групі за лічені секунди
        link: { label: Відповіді докладніше →, href: "#answers" }
      - icon: shield-check
        title: Продаємо квитки з {since} року
        text: "Організатори з різних країн, усього **{countries}**, продають з нами з {since} року: концерти, театри, фестивалі, шоу, майстер-класи. **800** замовлень на хвилину в навантажувальних тестах, щонічні зашифровані резервні копії, сторожовий сервіс, що повідомляє команду раніше, ніж ви помітите проблему."
        link: { label: Клієнти та відгуки →, href: /clients }

  - type: steps
    id: how
    eyebrow: Як це працює
    title: У продажу сьогодні. Три питання, які організатори ставлять першими.
    items:
      - title: Як швидко я можу почати продаж?
        text: "Подія без схеми залу надходить у продаж за 10 хвилин, щойно вашу організацію підтверджено і платіжний акаунт підключено; підключаєте його один раз. Для залу з місцями надішліть нам схему: ми намалюємо її безкоштовно, зазвичай протягом доби."
      - title: Що мені потрібно?
        text: "Назва і розклад події, ціни квитків, афіша та ваш власний платіжний акаунт: Stripe, Flitt, AllPay або інший провайдер у вашій країні. Гроші надходять вам з першого квитка."
      - title: Як саме я налаштовую подію?
        text: "У браузері на комп'ютері чи телефоні, в «Event Center»*. Або в Telegram, де бот читає вашу афішу і заповнює дати, ціни та майданчик, а вам лишається підтвердити. Або надішліть її нам, і ми налаштуємо все самі."
    note: "* «Event Center» це ваш кабінет організатора на ArenaSoldOut.com: усі події, замовлення, повернення коштів, запрошення й сеанси, для вас і вашої команди, у браузері та в Telegram. [Дивіться Event Center нижче →](#center) Кожен крок від заявки до сканера: [ваша перша подія →](/first-event)"

  - type: ways
    id: where
    eyebrow: Де ви продаєте
    title: Ваш сайт або наш. Гроші надходять вам в обох випадках.
    items:
      - title: У вас є сайт
        text: "Ваш сайт і є касою. Вбудуйте віджет квитків на будь-яку сторінку: WordPress, Tilda, Wix, Webflow або власний код. Покупці не залишають ваш домен."
        bullets:
          - Віджет на будь-якому сайті, три рядки коду
          - Плагін для WordPress із замовленнями WooCommerce
          - Ваші кольори, ваші шрифти, ваша мова
      - title: У вас немає сайту
        text: "Сторінку продажу розміщуємо ми: tickets.arenasoldout.com/your-name/your-event. Діліться одним посиланням у соцмережах, месенджерах і на афіші."
        bullets:
          - Сторінка на кожного організатора і на кожну подію
          - Окрема сторінка для кожного промоутера
          - Готово за кілька хвилин, без роботи дизайнера
          - Посилання на ваших партнерів-продавців на тій самій сторінці

  - type: qa
    id: answers
    eyebrow: Що організатори питають далі
    title: Так. І ось як.
    items:
      - title: Чи можна використовувати промокоди?
        text: Так. Код може діяти на одну подію, один сеанс або одну категорію, з періодом дії, мінімальною сумою і лімітом на покупця.
      - title: Чи можуть ціни змінюватися в задану мною дату?
        text: Так. Ціни раннього продажу перемикаються за датою й часом. Кількісні ступені відкривають наступну ціну, коли поточна розпродана.
        visual:
          type: ladder
          rungs:
            - { price: US$24, width: 100, label: перші 100 · продано }
            - { price: US$119, width: 62, label: наступні 150 · у продажу }
            - { price: US$599, width: 0, label: відкриється після, next: true }
      - title: Кілька цін для однієї події?
        text: Так. Категорії з власною ціною, квотою і періодом продажу, а також безкоштовні квитки й квитки з оплатою за вибором покупця.
      - title: Чи можна додати сервісний збір?
        text: Так. Відсоток для кожного каналу продажу, який покупець бачить окремим рядком і який надходить на ваш рахунок разом із квитком. Перевірте, чи дозволяє ваша країна сервісний збір на продаж квитків.
      - title: З місцями і без місць?
        text: "Так, і обидва в одній події: схема залу з категоріями, стоячі зони з квотами. Надішліть нам схему вашого залу, і ми безкоштовно намалюємо її в системі, зазвичай протягом доби: достатньо PDF, фото ескіза від руки або таблиці рядів із кількістю місць у кожному (Excel або Google Sheets). Вручну вводити нічого не потрібно."
        visual:
          type: plan
          aria: Схема залу з партером, двома ложами, балконом і стоячою зоною
          stage: Сцена
          parterre: Партер · 312
          logeLeft: Ложа Л · 48
          logeRight: Ложа П · 48
          balcony: Балкон · 180
          standing: Стоячі місця
      - title: Чи працює сканер з цими квитками?
        text: Так. Кожен квиток це PDF зі штрихкодом EAN-13 і QR-кодом, мовою покупця. Скануйте на вході застосунком-сканером для iOS і Android або ручним сканером. Застосунок приймає і квитки, продані вашими партнерами в інших системах.
        visual:
          type: ticket
          event: Autumn Jazz Night
          meta: Пт 24 жовт · 19:30 · Palác Akropolis
          seat: Партер · Ряд G · Місце 7
          code: "2173049188256"
      - title: Як я бачу свої продажі?
        text: "У вашому «Event Center», вашому власному кабінеті на цьому сайті: відкривайте його на телефоні чи комп'ютері, нічого встановлювати не треба. Усі ваші події, кожне замовлення, повернення коштів і підсумки за сеансами видно лише вам і вашій команді. Віддаєте перевагу Telegram? Кожен продаж і кожне повернення також надходить у вашу Telegram-групу за лічені секунди, з контактом покупця. [Дивіться Event Center нижче →](#center)"
        visual:
          type: telegram
          from: ArenaSoldOut.com
          lines:
            - "**Оплачено** · Autumn Jazz Night · Пт 24 жовт"
            - Ряд G 7–8 · Партер
            - "**€76.00** · Anna K. · +420 ••• 41 18"
          time: "19:42"
      - title: Повернення коштів, запрошення, зміна дат?
        text: "Так, зі свого кабінету «Event Center». Поверніть кошти за квиток, випустіть запрошення, перенесіть або скасуйте сеанс: покупці отримають лист своєю мовою з оновленим квитком."
      - title: Чи впорається система зі стадіоном?
        text: Так. 800 замовлень на хвилину при 1000 покупцях на сторінці одночасно в навантажувальних тестах, щонічні зашифровані резервні копії, сторожовий сервіс, що повідомляє нам раніше, ніж ви помітите проблему.

