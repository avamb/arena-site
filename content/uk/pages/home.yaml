  - type: faq
    id: faq
    eyebrow: Запитання
    title: Що питають організатори
    items:
      - q: Скільки коштує почати?
        a: "Почати нічого не коштує: немає ні підписки, ні додаткових платежів щомісяця чи щороку. Ви сплачуєте комісію за кожен проданий квиток, від {usdPrice}. Запрошення й безкоштовні квитки без комісії. [Ціни та калькулятор →](/pricing)"
      - q: Чи є додаткові платежі, щомісячні чи щорічні?
        a: Ні. Жодних щомісячних чи щорічних платежів, жодної підписки. Ви сплачуєте лише комісію за проданий квиток.
      - q: Я продаю квитки через WhatsApp, і покупці мені телефонують. Навіщо мені платформа продажу квитків?
        a: "Щоб не приймати кожне замовлення вручну. Покупці самі обирають місця й оплачують у будь-який час, навіть уночі; гроші одразу надходять на ваш рахунок, а квиток із QR-кодом приходить покупцеві на пошту. Посилання на продаж можна й далі надсилати у WhatsApp: тепер ваш час іде на сам захід, а не на листування та списки."
      - q: Хто сплачує сервісний збір, я чи покупець?
        a: Вирішуєте ви. Можна додати до ціни квитка власний сервісний збір, і він повністю надходить вам разом з оплатою. Наша комісія за квиток від цього не змінюється.
      - q: Коли я отримую гроші?
        a: З кожним замовленням. Покупець платить безпосередньо на ваш платіжний акаунт; ArenaSoldOut.com не тримає ваших грошей. Виплати на ваш банківський рахунок ідуть за графіком вашого провайдера.
      - q: Чи можна вбудувати продаж квитків у власний сайт?
        a: "Так. Віджет квитків установлюється на будь-яку сторінку трьома рядками коду: WordPress, Tilda, Wix, Webflow або власний код. Покупці обирають місця й квитки прямо на вашому сайті. [Розробникам →](/developers)"
      - q: Як працює контроль входу в день заходу?
        a: "Кожен квиток це PDF із QR-кодом і штрихкодом EAN-13. На вході квитки сканує застосунок MACS для iOS і Android, вистачить звичайного телефона; підійде й ручний сканер. Застосунок приймає і квитки, продані вашими партнерами в інших системах. [Застосунок-сканер MACS →](/product/scanner)"
      - q: Чи можна купити квиток прямо біля входу?
        a: Так. Роздрукуйте QR-код із коротким посиланням на покупку й розмістіть його біля входу. Глядачі сканують код телефоном і одразу купують квиток.
      - q: Що буде, якщо захід скасують або перенесуть?
        a: Вирішуєте ви. Можна повернути гроші всім покупцям, запропонувати нову дату замість повернення або обрати інший варіант. Покупці отримають лист своєю мовою з оновленим квитком.
      - q: Чи видно, звідки прийшли покупці?
        a: Так. Додайте UTM-мітки до посилань на продаж, і в Event Center буде видно, який канал приніс замовлення.
      - q: Продаю квитки вперше. Це для мене?
        a: "Так. Ми проведемо вас крок за кроком: [ваш перший захід →](/first-event). Схему залу намалюємо безкоштовно, а якщо вам зручніше, налаштуємо все разом із вами під час дзвінка."
      - q: Як зв'язатися з командою ArenaSoldOut.com, якщо в мене є запитання?
        a: "Напишіть нам у Telegram, через [форму на сайті](/contact#write) або на hello@arenasoldout.com. Вам відповідають люди з команди."

