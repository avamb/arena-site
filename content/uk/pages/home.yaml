  - type: money
    id: money
    eyebrow: Гроші
    title: Покупці платять вам. Не нам.
    lead: 100% кожного продажу надходить вам. Покупець сплачує ціну квитка, а також сервісний збір, якщо ви його додаєте, одразу на ваш власний платіжний акаунт, у вашій валюті, у вашій виписці. ArenaSoldOut.com ніколи не тримає ваші гроші. Ви сплачуєте ArenaSoldOut.com комісію платформи за кожен проданий квиток, після події або з передоплаченого пакета. Повернення коштів і чарджбеки вирішуєте ви, а не політика платформи.
    flowAria: Рух платежу
    nodes:
      - { label: Покупець, sub: "картка, Apple Pay, Google Pay" }
      - { label: Ваш сайт, sub: або сторінка продажу на нашому хостингу }
      - { label: ArenaSoldOut.com, sub: "замовлення, місця, квиток" }
      - { label: Ваш платіжний акаунт, providers: true, highlight: true }
      - { label: Ваш банк, sub: за графіком провайдера }
    note: Ви сплачуєте ArenaSoldOut.com комісію платформи за кожен проданий квиток. З ваших продажів нічого не вираховується, нічого не утримується.

