    lead: "Квитки з місцями й без місць: для артистів, гуртів, промоутерів, майданчиків, фестивалів, театрів і майстер-класів. Просто для першого заходу, професійно для сотого."
    widgetNote: "Так покупець обирає місця в залі. На заходах без місць усе ще простіше: покупець обирає категорію квитка й кількість."
