  - type: steps
    id: how
    eyebrow: Як це працює
    title: У продажу сьогодні. Три питання, які організатори ставлять першими.
    items:
      - title: Як швидко я можу почати продаж?
        text: "Захід без схеми залу надходить у продаж за 10 хвилин, щойно вашу організацію підтверджено і платіжний акаунт підключено; підключаєте його один раз. Для залу з місцями надішліть нам схему: ми намалюємо її безкоштовно, зазвичай протягом доби."
      - title: Що мені потрібно?
        text: "Назва і розклад заходу, ціни квитків, афіша та ваш власний платіжний акаунт: Stripe, Flitt, AllPay або інший провайдер у вашій країні. Гроші надходять вам з першого квитка."
      - title: Як саме я налаштовую захід?
        text: "У браузері на комп'ютері чи телефоні, в «Event Center»*. Або в Telegram, де бот читає вашу афішу і заповнює дати, ціни та майданчик, а вам лишається підтвердити. Або надішліть її нам, і ми налаштуємо все самі."
    note: "* «Event Center» це ваш кабінет організатора на ArenaSoldOut.com: усі заходи, замовлення, повернення коштів, запрошення й сеанси, для вас і вашої команди, у браузері та в Telegram. [Дивіться Event Center нижче →](#center) Кожен крок від заявки до сканера: [ваш перший захід →](/first-event)"

  - type: ways
    id: where
    eyebrow: Де ви продаєте
    title: На вашому сайті, на нашій сторінці, у партнерів і в соцмережах. Гроші в будь-якому разі надходять вам.
    items:
      - title: Ваш сайт
        text: "Ваш сайт і є касою. Вбудуйте віджет квитків на будь-яку сторінку: WordPress, Tilda, Wix, Webflow або власний код. Покупці залишаються на вашому домені."
        bullets:
          - Віджет на будь-якому сайті, три рядки коду
          - Інтеграція з WordPress
          - Ваші кольори, ваші шрифти, ваша мова
      - title: Наша сторінка продажу
        text: "Сторінку продажу розміщуємо ми: tickets.arenasoldout.com/your-name/your-event. Одне посилання для афіші, розсилки й месенджерів."
        bullets:
          - Сторінка для кожного організатора й кожного заходу
          - Готово за кілька хвилин, без роботи дизайнера
          - Посилання на ваших партнерів-продавців на тій самій сторінці
      - title: Сайти партнерів
        text: "Той самий віджет ставиться на сайт майданчика, промоутера чи агенції. Кожен промоутер отримує власну сторінку продажу й власне посилання."
        bullets:
          - Віджет на сайті партнера
          - Окрема сторінка й посилання для кожного промоутера
          - Усі продажі партнерів в одному Event Center
      - title: Соцмережі й месенджери
        text: "Посилання на продаж в Instagram, Facebook, Telegram і WhatsApp, на афіші та в розсилці. QR-код із коротким посиланням біля входу: глядачі сканують його й одразу купують квиток."
        bullets:
          - Одне посилання для всіх каналів
          - QR-код на афіші й біля входу
          - Джерела продажів за UTM-мітками

  - type: qa
    id: answers
    eyebrow: Функції
    title: Усе, що потрібно організатору, на одній платформі
    more: { label: Усі функції →, href: /features }
    items:
      - title: Промокоди
        text: Код може діяти на один захід, один сеанс або одну категорію, з періодом дії, мінімальною сумою і лімітом на покупця.
      - title: Ціни, що змінюються самі
        text: Ранні ціни перемикаються за датою й часом. Кількісні ступені відкривають наступну ціну, коли поточну розпродано.
        visual:
          type: ladder
          rungs:
            - { price: US$24, width: 100, label: перші 100 · продано }
            - { price: US$119, width: 62, label: наступні 150 · у продажу }
            - { price: US$599, width: 0, label: відкриється після, next: true }
      - title: Категорії й безкоштовні квитки
        text: Категорії з власною ціною, квотою і періодом продажу, а також безкоштовні квитки й квитки з оплатою за бажанням покупця.
      - title: Ваш власний сервісний збір
        text: "Відсоток для кожного каналу продажу: покупець бачить його окремим рядком, а гроші повністю надходять на ваш рахунок разом із квитком. Перевірте, чи дозволяє ваша країна сервісний збір на продаж квитків."
      - title: Місця і стоячі зони
        text: "Схема залу з категоріями і стоячі зони з квотами в одному заході. Надішліть нам схему вашого залу, і ми безкоштовно намалюємо її в системі, зазвичай протягом доби: достатньо PDF, фото ескіза від руки або таблиці рядів із кількістю місць у кожному (Excel або Google Sheets). Вручну вводити нічого не потрібно."
        visual:
          type: plan
          aria: Схема залу з партером, двома ложами, балконом і стоячою зоною
          stage: Сцена
          parterre: Партер · 312
          logeLeft: Ложа Л · 48
          logeRight: Ложа П · 48
          balcony: Балкон · 180
          standing: Стоячі місця
      - title: Квитки й вхід
        text: Кожен квиток це PDF зі штрихкодом EAN-13 і QR-кодом, мовою покупця. Скануйте на вході застосунком-сканером для iOS і Android або ручним сканером. Застосунок приймає і квитки, продані вашими партнерами в інших системах.
        visual:
          type: ticket
          event: Autumn Jazz Night
          meta: Пт 24 жовт · 19:30 · Palác Akropolis
          seat: Партер · Ряд G · Місце 7
          code: "2173049188256"
      - title: Продажі в реальному часі
        text: "У вашому «Event Center», вашому власному кабінеті на цьому сайті: відкривайте його на телефоні чи комп'ютері, нічого встановлювати не треба. Усі ваші заходи, кожне замовлення, повернення коштів і підсумки за сеансами видно лише вам і вашій команді. UTM-мітки показують, звідки приходять покупці. Віддаєте перевагу Telegram? Кожен продаж і кожне повернення також надходить у вашу Telegram-групу за лічені секунди, з контактом покупця. [Дивіться Event Center нижче →](#center)"
        visual:
          type: telegram
          from: ArenaSoldOut.com
          lines:
            - "**Оплачено** · Autumn Jazz Night · Пт 24 жовт"
            - Ряд G 7–8 · Партер
            - "**€76.00** · Anna K. · +420 ••• 41 18"
          time: "19:42"
      - title: Повернення коштів, запрошення, перенесення дат
        text: "Усе з вашого кабінету «Event Center»: поверніть кошти за квиток, випустіть запрошення, перенесіть або скасуйте сеанс. Якщо захід скасовано чи перенесено, що робити з грошима, вирішуєте ви: повернути всім або запропонувати нову дату. Покупці отримають лист своєю мовою з оновленим квитком."
      - title: Надійність
        text: 800 замовлень на хвилину при 1000 покупцях на сторінці одночасно в навантажувальних тестах, щонічні зашифровані резервні копії, сторожовий сервіс, що стежить за платформою цілодобово.
      - title: QR-код біля входу
        text: Роздрукуйте QR-код із коротким посиланням на покупку й розмістіть його біля входу. Глядачі сканують його й одразу купують квиток, навіть якщо прийшли без нього.
      - title: API за запитом
        text: API, вебхуки й імпорт заходів одним викликом ми підключаємо за запитом, коли продажі треба поєднати з вашою власною системою.

