    eyebrow: Платформа продажу квитків для організаторів
    title: Продавайте місця. Продавайте квитки. Гроші лишаються вам.
    lead: Почніть продаж за кілька хвилин, на вашому сайті або на сторінці, яку розміщуємо ми. Покупці платять на ваш платіжний акаунт. Кожен квиток і кожна виплата лишаються під вашим контролем.
    primary: { label: Почати продаж, href: /start }
    secondary: { label: Створити подію, href: /start#create }
    note: Підключіть платіжний акаунт, поділіться посиланням. Події без схеми залу надходять у продаж сьогодні.
