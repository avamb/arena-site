sections:
  - type: prose
    id: text
    body: |
      ## Де зберігаються ваші дані

      - Платформа працює на серверах Hetzner у ЄС.
      - Трафік до платформи йде через Cloudflare і шифрується по HTTPS.
      - Резервні копії бази даних створюються кожні три години та щоночі й копіюються в окреме сховище в ЄС.

      ## Платежі

      - Дані картки не потрапляють на наші сервери. Покупці платять на сторінці платіжного провайдера.
      - Кожен організатор підключає власний платіжний акаунт, тому гроші за квитки йдуть організатору, а не через нас.

      ## Розмежування між організаторами

      - Події, замовлення й клієнти кожного організатора ізольовані від інших організаторів. Доступ перевіряється при кожному запиті.
      - Учасники команди мають ролі (власник, менеджер). Менеджери не можуть змінювати платіжні налаштування, оплату тарифу та доступ команди.
      - API-ключі обмежені однією організацією і ніколи не отримують прав рівня всієї платформи.

      ## Захист від зловживань

      - Публічні форми захищені від ботів. Вхід, оформлення замовлення та публічні API мають ліміти частоти запитів.
      - Вебхуки платіжних провайдерів перевіряються за підписом.
      - Важливі дії записуються в журнал аудиту.

      ## Квитки

      - Кожен квиток має унікальний випадковий штрихкод, який неможливо вгадати за сусіднім квитком. Сканування перевіряється за нашими записами.

      ## Моніторинг і відновлення

      - Ми стежимо за потоком продажів, невдалими доставками й системними помилками та отримуємо автоматичні сповіщення.
      - Якщо серйозний інцидент торкнеться ваших даних, ми повідомимо постраждалих організаторів без невиправданої затримки й відповідно до GDPR.

      ## Ваші дані та конфіденційність

      - Ми обробляємо дані покупців за дорученням організатора. Див. нашу [Політику конфіденційності](/legal/privacy).
      - Ви можете в будь-який момент запросити експорт або видалення своїх даних.

      ## Повідомити про вразливість

      Знайшли проблему з безпекою? Напишіть на support@arenasoldout.com і опишіть її. Ми відповідаємо на кожне повідомлення.
