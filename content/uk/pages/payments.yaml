title: "Платежі: ваш власний платіжний акаунт у вашій країні"
description: "Покупці платять на власний платіжний акаунт організатора. Країни, де компанія може підключити платіжного провайдера, з методами й валютами."
h1: Покупці платять на ваш власний платіжний акаунт
lead: Ви підключаєте акаунт, який у вас уже є, або відкриваєте його в провайдера вашої країни. Кожне замовлення йде прямо на нього. ArenaSoldOut.com ніколи не тримає кошти і ніколи не торкається ваших виплат.
related:
  - { label: "Країни та способи оплати", href: /countries, text: "Провайдери, валюти та способи оплати в кожній країні, де можна продавати." }
sections:
  - type: coverage
    id: countries
    eyebrow: Країни
    title: У яких країнах я можу продавати квитки?
    lead: У кожній країні, де вашу компанію приймає один із наведених нижче платіжних провайдерів. Організатори продають з ArenaSoldOut.com у {countries} країнах з {since} року. Якщо ваша юридична особа зареєстрована в одній із цих країн, ви підключаєте акаунт провайдера і продаєте.
    labels:
      countries: Країни
      note: Провайдери додають країни з часом; ми підтверджуємо вашу до початку роботи.
      missing: "Вашої країни немає в списку?"
    cta: { label: Напишіть нам, href: /contact }

  - type: providers
    id: providers
    eyebrow: Провайдери
    title: Які платіжні провайдери працюють з ArenaSoldOut.com?
    lead: Це список того, що працює в бойовому режимі сьогодні. Провайдера додаємо, коли його адаптер уже є в коді, і не раніше.
    labels:
      currencies: Валюти
      methods: Методи
      checkout: У віджеті
      statuses:
        live: Працює
        api: Через API
        planned: У підготовці
        checkout_yes: "так, сторінка оплати провайдера"
        checkout_no: "ще ні"
      methods_map:
        card: картки
        apple_pay: Apple Pay
        google_pay: Google Pay
        bit: Bit
        installments: розстрочка
        bank_transfer: банківський переказ
        ideal: iDEAL
        twint: TWINT

  - type: cards
    id: connect
    eyebrow: Як підключити
    title: Як підключити мій платіжний акаунт?
    lead: Три речі, зазвичай протягом доби.
    items:
      - title: Ключі у вашому власному акаунті
        text: Ви створюєте API-ключі в кабінеті вашого провайдера і вставляєте їх в Event Center або надсилаєте команді. Акаунт лишається вашим; ArenaSoldOut.com лише ініціює платежі на нього.
      - title: Гроші на ваш акаунт
        text: Кожне замовлення оплачується прямо на ваш акаунт. Виплати на ваш банк відбуваються за графіком вашого провайдера. Повернення коштів вирішуєте ви, і вони йдуть покупцю через вашого провайдера, з будь-яким провайдером.
      - title: Автоматична обробка чарджбеків
        text: "Коли покупець оскаржує платіж, ArenaSoldOut.com збирає докази за вас: дані платежу, згоду покупця, доставку листів із квитками та кожне завантаження квитка."
      - title: ArenaSoldOut.com нічого не тримає
        text: Комісію платформи виставляємо в рахунку після заходу або списуємо з ваших кредитів, окремо. З ваших продажів нічого не вираховується. Якщо ви колись підете, ваш платіжний акаунт і дані ваших покупців лишаються з вами.

  - type: cta
    id: start
    title: Почніть продаж сьогодні
    text: "Створіть захід, підключіть платіжний акаунт, поділіться посиланням. Захід без схеми залу надходить у продаж за 10 хвилин; схему залу ми малюємо для вас безкоштовно."
    primary: { label: Створити захід, href: /start#create }
    secondary: { label: Відкрити Telegram-бота, href: https://t.me/EventsCentrBot }
    note: "Питання? Напишіть нам: команда відповідає протягом одного робочого дня."
