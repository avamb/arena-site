title: "Почати продаж: заявка організатора"
description: "Розкажіть про вашу організацію й події. Ми підтвердимо її й підключимо ваш платіжний акаунт, зазвичай протягом дня; далі ви продаєте самі."
h1: Почати продаж
lead: "Розкажіть, хто ви і де продаєте. Ми підтверджуємо вашу організацію й один раз підключаємо ваш платіжний акаунт, зазвичай протягом дня; події, ціни й продажі ви ведете самі. Події без схеми залу йдуть у продаж сьогодні."
sections:
  - type: steps
    id: how
    eyebrow: Що буде далі
    title: Як ми починаємо?
    items:
      - title: Ви надсилаєте заявку
        text: "П'ять коротких кроків: контакти, організація, події, платежі та згода. Ваші відповіді зберігаються по ходу, тож можна піти й повернутися."
      - title: Ми вас підтверджуємо
        text: Команда перевіряє заявку, підтверджує вашу організацію й один раз підключає ваш платіжний акаунт. Для залу з нумерованими місцями ми безкоштовно малюємо схему залу за вашим PDF, ескізом від руки чи таблицею рядів. Події, ціни й категорії ви створюєте самі в Event Center або в Telegram-боті.
      - title: Ви йдете в продаж
        text: Поділіться одним посиланням або розмістіть віджет на своєму сайті. Кожен продаж потрапляє у ваш Event Center і у вашу групу в Telegram.
