      text: "{lowPercent}% від ціни квитка, не менше {lowMin} і не більше {lowCap} за квиток; ще {lowSeat} за квиток з місцем. Для дискотек, забігів, марафонів, дитячих свят, екскурсій. Діє для всього заходу, лише якщо **жоден квиток жодної категорії чи цінового ступеня**, зокрема доданого пізніше, не коштує понад {lowMax} до застосування промокодів. Якщо один квиток дорожчий, для всіх квитків заходу діє стандартна ціна, дешеві теж."
      example: "Комісія за квиток, оплата після заходу:"
