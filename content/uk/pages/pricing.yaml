      cols: { name: Пакет кредитів, prepay: Ціна, plain: "Комісія, без місця", seated: "Комісія, з місцем", plainCount: "Квитків без місця", seatedCount: "Або квитків з місцем", saving: "Економія порівняно з оплатою після заходу", buy: Купити }
      buy: { label: Купити, currency: Оплатити в, none: Напишіть нам, noneHref: /contact, note: "Під час оплати Stripe запитає e-mail, на який зареєстровано вашу організацію на ArenaSoldOut.com. Введіть саме його: кредити зараховуються організації, до якої він належить. Організації ще немає? Введіть e-mail, на який ви будете реєструватися, і кредити буде прив'язано до нього." }
      note: "Пакети кредитів можна купувати скільки завгодно разів; комісія за квиток списується з того пакета, з якого його оплачено. Можна ввімкнути автоматичне поповнення. Для обсягів понад 5000 квитків на рік: індивідуальні умови, напишіть нам."
    lowPrice:
