      brand: "Ціни розраховані на те, що на сторінці вашого заходу є рядок **Квитки: ArenaSoldOut.com** з посиланням на нас; віджет квитків показує його за замовчуванням. Щоб продавати без нього, white label коштує **€45 на місяць за бренд або майданчик у країнах ЄС** і **US$45 на місяць за бренд або майданчик в усіх інших країнах**. [Докладні умови →](/pricing/terms)"
    currencyNote: "Комісія в **доларах США** для кожної країни поза ЄС, зокрема європейських країн поза ЄС, Азії та Близького Сходу, і в **євро** для майданчиків у країнах ЄС. Базова валюта: долар США; ціни в євро це ціни в доларах за курсом ЄЦБ. Це лише наша комісія: квитки продаються у валюті вашого платіжного акаунта. Суми без ПДВ."
