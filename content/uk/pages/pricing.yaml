title: "Ціни: за квиток, без підписки"
description: "Комісія за кожен проданий квиток, без підписки. Платіть після заходу або купуйте кредити наперед дешевше. Нижчі ставки для майданчиків і недорогих заходів."
h1: За квиток. Без підписки.
lead: Ви сплачуєте ArenaSoldOut.com комісію платформи за кожен проданий квиток. Оплата за фактом після заходу або кредити наперед, тоді менше за квиток. Еквайринг за картки сплачується вашому платіжному провайдеру на його умовах.
