  - type: faq
    id: questions
    eyebrow: Питання про гроші
    title: Скільки саме коштує мені квиток?
    items:
      - q: Скільки коштує квиток з місцем?
        a: "За оплати після заходу: US$1,18 поза ЄС, €1,05 в ЄС. Квиток без місця коштує US$0,62 або €0,55. Сама схема залу нічого не коштує: ми малюємо її безкоштовно за PDF, фото ескіза від руки або таблицею рядів і місць. З кредитами комісія нижча, а місце додає US$0,35 (€0,31) до ставки за кредити."
      - q: Як працюють кредити?
        a: "Ви купуєте пакет кредитів один раз. З кожного проданого квитка комісія списується з ваших кредитів за ставкою пакета, доки вони не закінчаться. Кредити не згорають, їх можна поповнювати будь-коли, і вони витрачаються лише на наші послуги: їх не можна вивести чи передати."
      - q: Що буде, якщо кредити закінчаться посеред продажу?
        a: Продаж не зупиняється. Квитки, яких ваші кредити не покрили, потрапляють у звичайний рахунок за ціною оплати після заходу.
      - q: Чи є автоматичне поповнення?
        a: Так. Ви можете його ввімкнути, і коли кредити опустяться нижче вашого порога, наступний пакет буде куплено за вас.
      - q: Куди йдуть гроші покупця?
        a: "На ваш власний платіжний акаунт, з кожним замовленням. ArenaSoldOut.com ніколи не тримає кошти. Покупець сплачує ціну квитка і, якщо ви його додаєте, ваш сервісний збір."
      - q: Коли я плачу ArenaSoldOut.com?
        a: "Після заходу, банківським переказом, за продані квитки. Для заходів, що продаються кілька місяців, і для постійних майданчиків: раз на місяць. Кредити сплачуються в момент покупки."
      - q: А еквайринг за картки?
        a: Еквайринг за картки це договір між вами і вашим платіжним провайдером, на умовах провайдера. Він не входить у нашу комісію, і ми нічого до нього не додаємо.
      - q: Чи мушу я згадувати ArenaSoldOut.com на своєму сайті?
        a: "Ціни розраховані на те, що на сторінці заходу ArenaSoldOut.com названо оператором продажу квитків, з посиланням на нас; віджет квитків показує цей рядок за замовчуванням. Щоб продавати без нашої назви, white label коштує €45 на місяць за бренд або майданчик у країнах ЄС і US$45 на місяць за бренд або майданчик в усіх інших країнах, за неповний місяць нараховується за днями. У [докладних умовах](/pricing/terms) пояснено, що таке бренд і що приховує white label."
      - q: Чи є знижка для благодійних організацій?
        a: "Так. Зареєстровані благодійні організації платять 50% нашої комісії, і при оплаті після заходу, і з кредитами. Напишіть нам зі [сторінки контактів](/contact), і ми ввімкнемо її для вашої організації."
      - q: Чи безкоштовні запрошення?
        a: Так. Запрошення й безкоштовні квитки на платні заходи не обкладаються комісією.
      - q: Що буде з комісією, якщо кошти за квиток повернуто або дату перенесено?
        a: "Покупцю повертаєте кошти ви. Комісія за продаж, що вже відбувся, залишається, а за обробку повернення, перенесення дати чи листи покупцям окремої комісії ми не беремо. Власні умови платіжного провайдера це умови провайдера."
      - q: Що, якщо я скасую захід?
        a: "Уже нараховану комісію грошима не повертаємо. Напишіть нам про ваш випадок до скасування заходу."
      - q: Один мій квиток коштує понад US$10 (€10 в ЄС), решта дешеві. Яка ціна діє?
        a: "Стандартна, для всіх квитків заходу: для нижчої ставки кожен квиток кожної категорії та цінового ступеня має коштувати US$10 або менше (€10 в ЄС). Квиток за US$5 поруч із квитком за US$25 коштує за стандартною ціною."
      - q: Я володію майданчиком і проводжу багато заходів на місяць. Чи є інші умови?
        a: "Так. Власники постійних майданчиків (театрів, клубів, стадіонів, цирків та інших місць, що самі проводять заходи, цілий рік або за сезоном) платять {percent}% від ціни квитка, що розраховується після промокодів і без вашого сервісного збору. Комісія за квиток обмежена US$1,18 (€1,09 в ЄС), однаково з місцем і без. Запрошення комісією не обкладаються. Рахунок щомісяця. Статус майданчика підключає наша команда: напишіть нам зі [сторінки контактів](/contact). Повні умови в [докладних умовах](/pricing/terms)."

