title: "Ваша перша подія: від заявки до сканера"
description: "Крок за кроком: заявка, підтвердження, підключення платіжного акаунта, створення події, схема залу, публікація, продаж, сканування квитків на вході."
h1: Ваша перша подія з ArenaSoldOut.com
lead: "Вісім кроків від заявки до сканера на вході. Якщо акаунт у платіжного провайдера вже відкрито, подія без схеми залу надходить у продаж через 10 хвилин після підтвердження вашої організації."
related:
  - { label: Платіжні провайдери за країнами, href: /payments, text: "Якого провайдера може підключити ваша компанія, з методами й валютами." }
  - { label: Схеми залів, href: /product/seating, text: "Що надіслати нам, щоб ми безкоштовно намалювали ваш майданчик." }
  - { label: Застосунок-сканер MACS, href: /product/scanner, text: "Сканування квитків на вході на iOS і Android." }
sections:
  - type: steps
    id: steps
    eyebrow: Крок за кроком
    title: Як виставити першу подію в продаж?
    items:
      - title: Надішліть заявку
        text: "П'ять коротких кроків у [формі заявки](/start): контакт, організація, події, платежі, згода. Або надішліть те саме в [Telegram-боті](https://t.me/EventsCentrBot). Ваші відповіді зберігаються по ходу заповнення."
      - title: Ми підтверджуємо вашу організацію
        text: "Команда перевіряє заявку та створює вашу організацію й кабінет Event Center, зазвичай протягом доби, і повідомляє, як увійти."
      - title: Підключіть платіжний акаунт, один раз
        text: "Створіть API-ключі в кабінеті вашого провайдера (Stripe, Flitt, AllPay або інший провайдер у вашій країні) і вставте їх в Event Center або надішліть команді. Це робиться один раз для організації; кожна наступна подія використовує той самий акаунт. Ще немає акаунта? Спершу відкрийте його в [провайдера вашої країни](/payments): це забирає стільки часу, скільки потрібно самому провайдеру."
      - title: Створіть подію
        text: "В Event Center у браузері або в Telegram-боті за фото вашої афіші: назва, майданчик, дати й сеанси, категорії квитків і ціни, афіша. Без схеми залу це займає близько 10 хвилин."
      - title: Надішліть схему залу, якщо продаєте місця
        text: "Ми малюємо схему безкоштовно, зазвичай протягом доби, і показуємо її вам до початку продажу. Достатньо будь-чого з цього: PDF зі схемою залу, фото ескіза від руки або таблиці рядів із кількістю місць у кожному (Excel або Google Sheets). SVG імпортується напряму."
      - title: Опублікуйте і поділіться
        text: "Відкрийте подію для продажу. Поділіться посиланням на сторінку продажу, яку розміщуємо ми, або додайте віджет квитків на свій сайт трьома рядками коду. Промокоди, ціни за датою та сервісний збір налаштовуються там само."
      - title: Стежте за продажами
        text: "Покупці платять на ваш платіжний акаунт і отримують квиток на e-mail своєю мовою. Кожне замовлення є в Event Center, а кожен продаж і повернення коштів надходить у вашу Telegram-групу за лічені секунди."
      - title: Скануйте на вході
        text: "Встановіть застосунок MACS на iPhone або Android, увійдіть своїм обліковим записом Event Center, оберіть сеанс і скануйте EAN-13 або QR на папері чи на екрані. Стільки телефонів, скільки у вас входів."
  - type: faq
    id: questions
    eyebrow: Питання
    title: Що організатори питають перед першою подією?
    items:
      - q: Скільки це насправді займає часу?
        a: "Підтвердження організації: зазвичай протягом доби. Після цього, якщо платіжний акаунт уже відкрито, подія без схеми залу надходить у продаж приблизно за 10 хвилин. Подія з місцями чекає на схему, яку ми малюємо, зазвичай добу. Відкриття нового акаунта в платіжного провайдера триває стільки, скільки потрібно провайдеру."
      - q: Що мені підготувати?
        a: "Назву події, майданчик, дати й час, категорії квитків і ціни, афішу та API-ключі вашого платіжного акаунта. Для місць: схему залу в будь-якій із форм, наведених вище."
      - q: Чи може команда налаштувати все за мене?
        a: "Так. Надішліть деталі в [Telegram-боті](https://t.me/EventsCentrBot) або через контактну форму, і ми створимо подію разом із вами; ви перевіряєте її до початку продажу."
      - q: Скільки коштує перша подія?
        a: "Стільки ж, як і будь-яка інша: комісія за кожен проданий квиток, рахунок після події, або менше з кредитами, купленими наперед. Схеми залів і запрошення нічого не коштують. Ціни на [сторінці цін](/pricing)."
  - type: cta
    id: start
    title: Почніть із заявки
    text: "П'ять коротких кроків, зберігаються по ходу заповнення. Команда підтверджує вашу організацію, зазвичай протягом доби."
    primary: { label: Надіслати заявку, href: /start }
    secondary: { label: Відкрити Telegram-бота, href: https://t.me/EventsCentrBot }
    note: "Спершу є питання? Кнопка «Зв'язатися з командою» є на кожній сторінці."
