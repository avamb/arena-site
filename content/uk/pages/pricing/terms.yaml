title: "Докладні умови цін"
description: "Комісія платформи: оплата після заходу, кредити, квитки до US$10, знижка 50% для благодійних організацій, майданчики, white label €45/US$45 на місяць."
h1: Докладні умови
lead: Умови, що стоять за ціною за квиток. Стандартні умови; умови для великих обсягів та індивідуальні за запитом. Усі суми без ПДВ.
sections:
  - type: prose
    id: terms
    body: |
      ## За що ми беремо плату

      Комісія платформи нараховується за кожен проданий квиток, а не як відсоток від вашого доходу, окрім двох випадків нижче. Квиток за US$15 і квиток за US$150 коштують вам однаково. Запрошення й безкоштовні квитки на платні заходи комісією не обкладаються.

      ## Оплата після заходу

      US$0,62 за квиток без місця і US$1,18 за квиток з місцем, обраним на схемі залу (€0,55 і €1,05 для майданчиків у країнах ЄС).

      Ціни встановлено в доларах США. Ціни в євро це ціни в доларах, перераховані за референтним курсом Європейського центрального банку (1 EUR = 1,1193 USD на 9 листопада 2026 року) і округлені до цента; [сторінка цін](/pricing) показує обидва варіанти. Дві суми не перераховуються: поріг для заходів з дешевими квитками становить €10, а ліміт для постійних майданчиків становить €1,09. Ми виставляємо рахунок після заходу, за продані квитки, а ви платите банківським переказом. Для заходів, що продаються кілька місяців, і для постійних майданчиків рахунок виставляється раз на місяць. Оплата після заходу доступна організаціям, підтвердженим на платформі. Еквайринг за картки сплачується вашому платіжному провайдеру на його власних умовах.

      ## Кредити

      Ви купуєте пакет кредитів один раз, і з кожного квитка комісія списується з ваших кредитів за ставкою цього пакета. Місце додає US$0,35 (€0,31) до ставки за кредити. Кредити це гроші на вашому рахунку: вони не згорають, пакети кредитів можна купувати скільки завгодно разів, і вони витрачаються лише на наші послуги. Їх не можна вивести, передати чи обналичити. Якщо кредити закінчилися посеред продажу, продаж не зупиняється: квитки, яких вони не покрили, виставляються за ціною оплати після заходу. Можна ввімкнути автоматичне поповнення. Пакети кредитів і їхні ставки на [сторінці цін](/pricing#packages).

      ## Зареєстровані благодійні організації

      Зареєстровані благодійні організації платять 50% від комісії, зазначеної на цій сторінці, і за оплати після заходу, і з кредитами. Наша команда вмикає знижку для вашої організації після перевірки реєстрації: напишіть нам зі [сторінки контактів](/contact).

      ## Заходу, де кожен квиток коштує US$10 або менше

      Нижча ставка стосується всього заходу: вона діє, лише якщо найвища ціна будь-якого квитка заходу до промокодів становить US$10 або менше, **US$10 включно** (€10 у країнах ЄС). Враховуються всі категорії й цінові ступені, зокрема додані пізніше. Якщо є квиток дорожче, для кожного квитка заходу діє стандартна ціна, дешеві теж: захід з квитками за US$5 і US$25 коштує за стандартною ціною. Ставка становить 4% від ціни квитка, не менше US$0,10 і не більше US$0,35 за квиток, і ще US$0,20 за квиток з місцем (у країнах ЄС: не менше €0,09, не більше €0,31, ще €0,18 за місце).

      ## Постійні майданчики

      Майданчики, що самі проводять заходи, цілий рік або за сезоном, платять 2% від ціни квитка (після промокодів, без сервісного збору), не більше US$1,18 за квиток (€1,09 у країнах ЄС), однаково з місцем і без. Рахунок виставляємо щомісяця. Статус майданчика підключає наша команда: напишіть нам зі [сторінки контактів](/contact).

      ## Оператор продажу квитків на сторінці заходу, або white label

      Ціни на цій сторінці розраховані на те, що на сторінці, де ви продаєте, ArenaSoldOut.com названо оператором продажу квитків, з посиланням на arenasoldout.com. Достатньо рядка на кшталт «Квитки: ArenaSoldOut.com» поруч із квитками, а віджет квитків показує такий рядок за замовчуванням, тож з віджетом нічого додавати не потрібно. Сторінки продажу, які розміщуємо ми, завжди містять нашу назву.

      Якщо ви хочете продавати без згадки про нас, white label коштує **€45 на місяць за бренд або майданчик** у країнах ЄС і **US$45 на місяць за бренд або майданчик** в усіх інших країнах, у валюті вашої комісії. Бренд це промоутер заходу або ваша організація для заходів без промоутера: два промоутери, які обидва продають без нашої назви, це два бренди. Постійний майданчик, що продає без нашої назви, платить за себе як за один бренд. Неповний місяць нараховується за днями. Ця плата є рядком вашого щомісячного рахунку; кредитами її не сплатити.

      Поки white label ввімкнено, рядок у віджеті, нижній колонтитул вашого магазину та рядок платформи в листах покупцям зникають, а листи надходять від імені бренду. Що лишається: сторінки продажу, які розміщуємо ми, посилання на умови й політику конфіденційності платформи під час оплати та дані продавця, як того вимагає закон. Наша команда вмикає й вимикає white label для бренду з обраної вами дати: напишіть нам зі [сторінки контактів](/contact).

      ## Повернення коштів, зміна дат і скасування

      Коли покупець повертає квиток, кошти покупцю повертаєте ви, організатор. Комісія за продаж, що вже відбувся, залишається. Ми не беремо окремої комісії за обробку повернення, за перенесення дати чи за листи покупцям. Власні умови платіжного провайдера діють так, як їх визначає провайдер. Якщо захід скасовано, уже нараховану комісію грошима не повертаємо.

      ## Валюта

      Комісія в доларах США для кожної країни поза ЄС, зокрема європейських країн поза ЄС, Азії та Близького Сходу, і в євро для майданчиків у країнах ЄС. Ціни в євро це ціни в доларах США за наведеним вище курсом ЄЦБ. Валюта комісії не змінює валюту, в якій ви продаєте квитки. Якщо в однієї організації є майданчики в обох групах, вона отримує два акаунти.

      ## Звіти

      Event Center дає підсумки за сеансами й докладний CSV-звіт за кожним сеансом. Експорт у вашу CRM або облікову систему налаштовується за запитом.

      ## Конфіденційність

      ArenaSoldOut.com обробляє дані покупців від імені організатора з метою продажу й доставки квитків. [Політика конфіденційності](/legal/privacy) описує, що обробляється і як довго; [умови й положення](/legal/terms) є договором з організатором.
