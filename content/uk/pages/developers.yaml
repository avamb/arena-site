title: "Для розробників: три рядки на будь-якому сайті"
description: "Вбудуйте віджет квитків трьома рядками або скористайтеся публічним API: пакет заходу одним викликом, підписані вебхуки, ключі з обмеженими правами."
h1: Три рядки на будь-якому сайті
lead: "Віджет є веб-компонентом. Вставте його на будь-яку сторінку, стилізуйте змінними CSS, слухайте його події. Усе інше є публічним API з підписаними вебхуками."
sections:
  - type: code
    id: widget
    eyebrow: Віджет
    title: Як розмістити квитки на моєму сайті?
    code: |
      <script type="module" src="https://tickets.arenasoldout.com/widget/v1/arena-tickets.js"></script>
      <arena-tickets feed-token="YOUR_FEED_TOKEN" locale="en"></arena-tickets>
    items:
      - key: --arena-accent
        text: "Ваші кольори: віджет читає --arena-accent, --arena-radius, --arena-bg і --arena-border-color з вашої сторінки"
      - key: locale
        text: "Мова покупця: en, ru, cs, he, es; іврит пишеться справа наліво"
      - key: arena:order_paid
        text: "Заходу віджета arena:* для вашої аналітики й власних сторінок подяки"
      - key: feed-token
        text: Один токен на канал продажу; відкликайте його в Event Center будь-коли
    cta: { label: Отримати feed-токен, href: /start }

  - type: cards
    id: api
    eyebrow: Публічне API
    title: Що я можу робити через API?
    items:
      - title: Пакет заходу одним викликом
        text: Один запит створює захід, його сеанси, майданчик, ціни, афішу й публікацію. У тій самій формі, що й у боті Telegram.
      - title: Підписані вебхуки
        text: Замовлення, платежі, повернення й зміни сеансів надходять на ваш ендпоінт із підписом, який ви перевіряєте. Повторні спроби з наростаючою затримкою.
      - title: Ключі API з обмеженими правами
        text: Ключ бачить одну організацію й лише ті права, які ви надали. Змінюйте й відкликайте ключі в Event Center.
      - title: Плагін WordPress
        text: Замовлення потрапляють у WooCommerce, магазин працює далі, схема залу й квиток приходять з ArenaSoldOut.com. Саме плагін допоміг двом клієнтам перейти з ArenaSoldOut.com без простою.
      - title: Імпорт
        text: Сеанси, схеми залу й клієнтів імпортовано з ArenaSoldOut.com. Інші системи через пакет заходу й CSV із клієнтами.
      - title: OpenAPI
        text: Опис OpenAPI публікується разом з API. Попросіть у команди актуальний файл, доки його не буде прив'язано тут автоматично.

  - type: cta
    id: start
    title: Почніть розробку сьогодні
    text: Попросіть feed-токен і ключ API з обмеженими правами. Команда відповідає особисто й може створити для вас тестову організацію.
    primary: { label: Запросити доступ, href: /start }
    secondary: { label: Відкрити Telegram-бота, href: https://t.me/EventsCentrBot }
    note: Тестові платежі йдуть через тестовий режим вашого провайдера, ніколи через реальні картки.
