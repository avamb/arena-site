  # Shown only when Meta sends the person here after our data-deletion callback (?code=<confirmation code>).
  - type: deletion-status
    id: request
    title: "Ваш запит на видалення даних отримано"
    code_label: "Код підтвердження:"
    text: "Підключення Meta (Facebook) і пов’язані з ним дані (токен доступу, ідентифікатори пікселя й рекламного акаунта, рекламна статистика) видалено з Arena Sold Out. Якщо у вас є питання щодо цього запиту, напишіть на support@arenasoldout.com і вкажіть код підтвердження."
  - type: prose
    id: text
    body: |
      ## 1. Хто ми

      Квитковою платформою ArenaSoldOut.com і застосунком Meta «Arena Sold Out» керує ABH TEAM OÜ, зареєстрована в Комерційному реєстрі Естонії під реєстраційним номером 14162982, Narva mnt 5a, 10117 Таллінн, Естонія.

      ## 2. Організаторам, які підключили рекламний акаунт Meta (Facebook)

      Організатор може підключити свій рекламний акаунт Meta до Arena Sold Out: щоб передавати продажі квитків у Meta як конверсії й бачити витрати на рекламу поруч із продажами. Для цього ми зберігаємо токен доступу, ID пікселя та рекламного акаунта й отриману статистику реклами.

      **Відключіть доступ самі.** Після будь-якого з цих кроків Arena Sold Out більше не може нічого читати чи надсилати через ваш акаунт:

      - у Facebook: Налаштування й конфіденційність → Налаштування → Бізнес-інтеграції, знайдіть «Arena Sold Out» і натисніть «Видалити»;
      - у Meta Business Suite: Налаштування → Налаштування компанії → Інтеграції (або Акаунти → Застосунки), знайдіть «Arena Sold Out» і видаліть його.

      **Попросіть нас видалити збережені дані.** Напишіть на support@arenasoldout.com з адреси вашого облікового запису в Event Center, вкажіть «Видалити дані Meta» і назву вашої організації. Ми видалимо токен доступу, ID пікселя та рекламного акаунта й статистику реклами та підтвердимо це листом. Ми відповідаємо протягом одного місяця. Дані, які ми зобов'язані зберігати за законом, зберігаються лише протягом цього строку (розділ 3 політики конфіденційності).

      Дані, які Meta вже отримала через ваш акаунт, зберігає Meta відповідно до своєї політики конфіденційності.

      ## 3. Покупцям квитків

      Ваші права щодо персональних даних (доступ, виправлення, видалення та інші) описані в [розділі 5 політики конфіденційності](/uk/legal/privacy). Дані про ваші квитки ми обробляємо за дорученням організатора події, який є їхнім контролером: надішліть запит організатору, його контакт є на сторінці продажу та в листі з квитком. Можна написати й нам на support@arenasoldout.com, ми передамо запит організатору.

      ## 4. Докладніше

      Що ми обробляємо, навіщо і як довго: [політика конфіденційності](/uk/legal/privacy).
