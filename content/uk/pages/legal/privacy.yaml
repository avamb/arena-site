      Ця Політика конфіденційності пояснює, як ABH TEAM OÜ, що керує платформою продажу квитків ArenaSoldOut.com («ми», «ArenaSoldOut.com»), поводиться з персональними даними, які ми збираємо й отримуємо через сайт ArenaSoldOut.com, Event Center на app.arenasoldout.com, сторінки продажу в нас і віджет квитків на tickets.arenasoldout.com, публічне API, бот Telegram і застосунок-сканер (разом «послуги»).

      Вона стосується трьох груп людей: відвідувачів сайту; організаторів, які користуються послугами, і членів їхніх команд («організатори»); і людей, які купують квитки в організаторів через послуги («покупці квитків»).

      Користуючись сайтом чи послугами, ви погоджуєтеся з цією Політикою конфіденційності та з нашими Умовами та положеннями. Якщо ви не погоджуєтеся, будь ласка, не користуйтеся сайтом чи послугами.

      ## 1. Які дані ми збираємо й обробляємо

      1.1 У цьому розділі ми викладаємо: (a) категорії персональних даних, які ми можемо обробляти; (b) цілі, з якими ми їх обробляємо; і (c) правові підстави обробки.

      1.2 Ми обробляємо дані акаунтів організаторів («дані акаунта»): назву організації та її країну, імена, адреси електронної пошти й номери телефонів власника акаунта та членів команди, акаунти Telegram членів команди, які користуються ботом Telegram, записи про входи, ключі API й налаштування. Джерелом даних акаунта є ви. Їх обробляють, щоб керувати послугами, надавати їх вам, забезпечувати їхню безпеку, зберігати резервні копії та листуватися з вами щодо вашого акаунта й подій. Правовою підставою є виконання нашого договору з вами (Умов та положень) і наш законний інтерес у забезпеченні безпеки послуг.

      1.3 Ми обробляємо дані про використання сайту й послуг («дані про використання»). Сайт може користуватися аналітикою без файлів cookie, яку розміщуємо ми: переглянуті сторінки, сайт-джерело переходу, тип і версія браузера, операційна система, країна й обрана тема (світла чи темна). Вона не зберігає вашу повну IP-адресу й не встановлює файлів cookie. Послуги ведуть журнали сервера з IP-адресою, часом і запитом, для безпеки та усунення несправностей. Правовою підставою є наш законний інтерес у розумінні того, як використовують сайт, і в захисті послуг.

      1.3a Сайт також має власну продуктову аналітику, яка працює лише якщо ви приймаєте «Аналітику» у банері про cookie. Вона записує сторінки, які ви відкриваєте, час, проведений на сторінці, наскільки далеко ви прокручуєте, ваші кліки по позначених кнопках (наприклад «Почати продаж» чи «Зв'язатися з нами»), мову сторінки та джерело візиту (сайт-джерело й теги кампаній в адресі). Вона пов'язує ваші візити з випадковим кодом, що зберігається в cookie. Якщо ви потім починаєте заявку, код надсилається разом із нею, щоб ми бачили, які сторінки передували їй. Ці дані залишаються в ArenaSoldOut.com, зберігаються на наших власних серверах у Європейському Союзі й не передаються рекламним чи аналітичним компаніям. Її правовою підставою є ваша згода, яку ви можете відкликати в будь-який час (розділ 7). Якщо ви відмовитеся, нічого з цього не збирається.

      1.3b Якщо ви потрапляєте за посиланням у листі, який ми вам надіслали, посилання несе код вашого контактного запису. Візит за посиланням (сторінка, час) записується, навіть якщо ви відмовилися від аналітики, і нічого більшого з вами без вашої згоди не пов'язується. Правовою підставою є наш законний інтерес знати, які з наших листів було прочитано. Код видаляється з адреси, щойно сторінка відкривається. Ви можете заперечити в будь-який час (розділ 5).

      1.4 Ми обробляємо контент, який організатори публікують через послуги («дані публікації»): назви й описи подій, афіші, відомості про майданчик і сеанси, схеми залу, ціни та умови квитків. Їх обробляють, щоб опублікувати подію на сторінці продажу, у віджеті й на власному сайті організатора та щоб видавати квитки. Правовою підставою є виконання нашого договору з організатором.

      1.5 Ми обробляємо інформацію в будь-якому запиті, який ви нам надсилаєте («дані запитів»): форму заявки на цьому сайті (організація, країна, платіжний провайдер, ім'я, e-mail, телефон, повідомлення), повідомлення боту Telegram і чату Telegram та листи. Їх обробляють, щоб відповісти вам і налаштувати ваш акаунт. Правовою підставою є вжиття заходів на ваше прохання до укладення договору та ваша згода, якщо ви звертаєтеся до нас з іншої причини. Форму заявки захищає Cloudflare Turnstile, що перевіряє, чи відправник є людиною (див. розділ 6).

      1.6 Ми обробляємо дані покупців квитків і транзакцій («дані транзакцій»). Коли ви купуєте квиток в організатора через послуги, ми обробляємо ваше ім'я, адресу електронної пошти, номер телефону, якщо організатор його просить, обрану вами мову, місця й квитки, які ви купили, суму та статус платежу, історію ваших замовлень (повернення, повторно надіслані й замінені квитки) і сканування вашого квитка на вході. Ми обробляємо ці дані від імені організатора, який є контролером, щоб видати й доставити ваш електронний квиток, допустити вас на вході, обробити повернення, які вирішує організатор, і повідомити вас, коли сеанс переноситься чи скасовується. Організатор бачить ваше замовлення в Event Center і, якщо він це ввімкнув, у власній групі Telegram організатора. Сам платіж обробляє платіжний провайдер, якого підключив організатор; чинний список є на сторінці платежів. Ми ніколи не отримуємо дані вашої картки чи банківські реквізити й ніколи не тримаємо гроші. Запитання про ваш квиток, повернення чи подію надсилайте організатору; сторінка допомоги покупцям квитків пояснює, де знайти ваш квиток.

      1.7 Ми обробляємо дані, які ви надаєте нам, щоб отримувати наші листи («дані сповіщень»). Службові листи й повідомлення в Telegram про ваш акаунт, рахунки й події є частиною договору. Розсилки надсилаються лише з вашої згоди, яку ви можете відкликати за посиланням у кожній розсилці.

      1.8 Ми можемо обробляти будь-які ваші персональні дані, визначені в цій політиці, коли це необхідно для встановлення, здійснення чи захисту правових вимог, чи то в судовому провадженні, чи в адміністративній або позасудовій процедурі. Правовою підставою є наш законний інтерес у захисті й відстоюванні наших законних прав, ваших законних прав і законних прав інших осіб.

      1.9 Ми також можемо обробляти будь-які ваші персональні дані, коли обробка необхідна для захисту ваших життєво важливих інтересів чи життєво важливих інтересів іншої фізичної особи.

      ## 2. Як ми передаємо інформацію

      2.1 Персональні дані в послугах зберігаються на серверах, розташованих у Європейському Союзі, якими керують наші хостинг-провайдери за угодами про обробку даних, з нічним зашифрованим резервним копіюванням. Cloudflare, Inc. обслуговує цей сайт, захищає послуги й надає перевірку Turnstile на наших формах.

      2.2 Для роботи послуг ваші персональні дані передаються, кожному лише в обсязі, потрібному для його завдання: організатору, у якого ви купили квиток (покупці квитків); платіжному провайдеру, якого підключив організатор; провайдерам доставки електронної пошти, що надсилають квитки й службові листи; Telegram, через який доставляються бот Telegram, чат Telegram і сповіщення для груп організаторів за власною політикою конфіденційності Telegram; нашим провайдерам хостингу, аналітики, автоматизації й підтримки клієнтів. За нашими вказівками ці сторони можуть мати доступ до персональних даних, обробляти чи зберігати їх, виконуючи свої обов'язки перед нами.

      2.3 Якщо ми беремо участь у злитті, поглинанні, перевірці в разі залучення фінансування, реорганізації, банкрутстві, управлінні майном боржника, продажу всіх чи частини наших активів або передачі послуги іншому провайдеру, ваші персональні дані та інша інформація можуть бути передані правонаступнику чи афілійованій особі в межах цієї угоди.

      2.4 Ми розкриваємо персональні дані, якщо цього вимагає закон чи чинне регулювання або з добросовісного переконання, що така дія необхідна, щоб: (a) виконати юридичний обов'язок; (b) захистити свої права чи власність; (c) діяти в невідкладних обставинах для захисту особистої безпеки користувачів послуг чи суспільства; або (d) захистити нас від юридичної відповідальності, чи то в судовому провадженні, чи в адміністративній або позасудовій процедурі.

      2.5 З вашої згоди ми можемо передавати дані третім сторонам поза межами цієї Політики конфіденційності.

      2.6 Організатори змінюють або виправляють свої дані в Event Center чи написавши на support@arenasoldout.com. Покупці квитків пишуть організатору своєї події або нам на ту саму адресу; якщо контролером є організатор, ми пересилаємо запит організатору.

      ## 3. Як довго ми зберігаємо дані

      3.1 Ми зберігаємо вашу інформацію лише: (a) доти, доки це необхідно для досягнення цілей, з якими її зібрано й оброблено; (b) якщо чинне законодавство передбачає довший строк зберігання; і (c) протягом строку зберігання, якого вимагає закон. Після цього ваші персональні дані видаляються, блокуються чи знеособлюються, як передбачено чинним законодавством.

      3.2 Ми зберігаємо персональні дані так:

      (a) дані акаунта: поки акаунт відкритий і до 120 місяців після останнього входу, як зазначено в Умовах та положеннях; ми попереджаємо вас електронною поштою перед видаленням акаунта;

      (b) дані про використання: аналітика без файлів cookie в агрегованому вигляді; журнали сервера протягом обмеженого періоду, потрібного для безпеки й усунення несправностей; події продуктової аналітики 13 місяців, а профіль, побудований на їх основі (відвідані сторінки, перше джерело, етап заявки), доти, доки існує ваш контактний запис чи акаунт, після чого його видаляють; cookie відвідувача діє 13 місяців, а запис вашого вибору щодо cookie 6 місяців;

      (c) дані публікації: поки подію опубліковано й акаунт організатора відкритий;

      (d) дані запитів: заявки, що не призвели до акаунта, видаляються через 180 днів після останнього контакту; інші запити до закриття справи;

      (e) дані транзакцій: поки акаунт організатора відкритий і організатор потребує їх для повернень, спорів і звітів, а після цього протягом строку, якого вимагає бухгалтерське й податкове законодавство (в Естонії сім років для первинних бухгалтерських документів);

      (f) дані сповіщень: доки ви не відкличете згоду; ми зберігаємо запис про те, що ви відписалися, щоб не писати вам знову.

      ## 4. Безпека

      4.1 Ми прагнемо захищати конфіденційність відвідувачів сайту, організаторів і покупців квитків. Ми вживаємо розумних адміністративних і технічних заходів, щоб захистити персональні дані від втрати, неправомірного використання та несанкціонованого доступу, розкриття, зміни чи знищення: зашифровані з'єднання, нічні зашифровані резервні копії, доступ до даних покупців квитків, обмежений командою організатора та нашими працівниками, яким це потрібно, і моніторинг послуг.

      4.2 Проте жоден метод передавання через інтернет не є цілком безпечним. Хоча ми прагнемо захистити ваші дані, ми не можемо гарантувати їхню абсолютну безпеку.

      ## 5. Права за законодавством ЄС

      5.1 Цей розділ описує ваші права за законодавством ЄС (для цих цілей до ЄС належать країни Європейської економічної зони: Ісландія, Ліхтенштейн і Норвегія).

      «Законні інтереси» означають наші інтереси у веденні нашого бізнесу та в керуванні послугами й наданні їх. Ця Політика конфіденційності описує, коли ми обробляємо ваші персональні дані в наших законних інтересах, що це за інтереси та які ваші права. Ми не використовуємо ваші персональні дані для діяльності, вплив якої на вас переважає наші інтереси, якщо немає вашої згоди або якщо така діяльність інакше не вимагається чи не дозволяється законом.

      5.2 Ви маєте такі права щодо своїх персональних даних:

      (a) Право доступу: якщо ми обробляємо ваші персональні дані, ви можете попросити їхню копію.

      (b) Право на виправлення: якщо ваші персональні дані неточні чи неповні, ви можете попросити нас виправити або доповнити їх. Якщо ми передали їх іншим, ми повідомляємо їх про виправлення, де це можливо.

      (c) Право на видалення: ви можете попросити нас видалити ваші персональні дані за певних обставин, наприклад коли вони нам більше не потрібні чи ви відкликаєте згоду. Якщо ми передали їх іншим, ми сповіщаємо їх про потребу видалення, де це можливо.

      (d) Право на обмеження обробки: ви можете попросити нас обмежити або заблокувати обробку ваших персональних даних за певних обставин, наприклад коли ви оспорюєте їхню точність чи заперечуєте проти обробки. Якщо ми передали їх іншим, ми повідомляємо їх про обмеження, де це можливо.

      (e) Право заперечувати: ви можете в будь-який час попросити нас припинити обробку ваших персональних даних, і ми це робимо, коли спираємося на законний інтерес, якщо тільки не доведемо вагомих законних підстав, і завжди, коли обробляємо їх для прямого маркетингу.

      (f) Право на переносимість даних: ви можете отримати персональні дані, які ви надали нам за вашою згодою чи за нашим договором із вами, у структурованому, поширеному форматі.

      (g) Право відкликати згоду: де ми спираємося на вашу згоду, ви можете відкликати її в будь-який час; це не впливає на обробку, що вже відбулася.

      (h) Право подати скаргу: якщо у вас є занепокоєння щодо нашої практики конфіденційності, ви можете поскаржитися органу із захисту даних вашої країни. Наш наглядовий орган: Естонська інспекція із захисту даних (Andmekaitse Inspektsioon, www.aki.ee).

