      7.1 Ви можете блокувати чи видаляти cookie й локальне сховище в налаштуваннях браузера; довідка вашого браузера пояснює, як це зробити. Блокування суворо необхідних cookie унеможливлює вхід в Event Center і оформлення замовлення на квитки.

