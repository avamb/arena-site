      ## 6. Файли cookie та подібні технології

      6.1 «Cookie» це невеликий фрагмент інформації, який сайт зберігає у вашому браузері. Браузери також пропонують локальне сховище, яке працює подібно, але не надсилається на сервер з кожним запитом.

      6.2 Сайт показує банер про cookie з двома категоріями: «Необхідні», завжди ввімкнені, і «Аналітика», вимкнена, доки ви не приймете. Поки ви не зробили вибір, він не встановлює жодного cookie. Коли ви обираєте, він зберігає вашу відповідь у cookie aso_consent (6 місяців); це cookie є суворо необхідним, бо саме так ми пам'ятаємо вашу відповідь. Лише якщо ви приймаєте аналітику, він також встановлює cookie aso_aid, випадковий код відвідувача (13 місяців, first-party, ніколи не подовжується наступними візитами). Жодним із двох cookie не діляться з третіми сторонами. Ваш вибір теми (світла чи темна) зберігається в локальному сховищі вашого браузера й ніколи не надсилається нам. Аналітика без файлів cookie, описана в розділі 1.3, не встановлює cookie. Форма заявки використовує Cloudflare Turnstile, щоб відрізнити людей від автоматичних надсилань; перевірка працює з challenges.cloudflare.com і може використовувати власні cookie чи сховище за політикою конфіденційності Cloudflare.

      6.3 Event Center, сторінки продажу в нас і віджет квитків використовують суворо необхідні cookie та локальне сховище: щоб тримати організаторів у системі, утримувати ваші місця, поки ви завершуєте замовлення, запам'ятовувати вашу мову та захищати акаунти й замовлення від шахрайства. Ми не використовуємо рекламних cookie чи cookie сторонньої аналітики.

