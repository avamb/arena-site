      ## 1. Вступ

      Ця сторінка викладає юридичні умови та положення (далі «Умови»), на яких ABH TEAM OÜ, що працює під брендом ArenaSoldOut.com («ми», «нас»), надає вам нашу платформу для продажу квитків на події та пов'язаних продуктів і послуг (далі «Послуга»). Послуга охоплює Event Center на app.arenasoldout.com, сторінки продажу в нас і віджет квитків на tickets.arenasoldout.com, публічне API, плагін WordPress, бот Telegram і застосунок-сканер для входу.

      Будь ласка, уважно прочитайте ці Умови й переконайтеся, що розумієте їх, перш ніж подавати заявку на акаунт чи пускати подію в продаж через Послугу.

      ## 2. Наш договір із вами

      Ви погоджуєтеся з цими Умовами й укладаєте обов'язковий договір з ABH TEAM OÜ, коли подаєте заявку на акаунт через форму на цьому сайті чи через бот Telegram, коли наша команда створює для вас акаунт на ваше прохання або коли ви чи член вашої команди вперше входите в Event Center чи пускаєте подію в продаж. Якщо ви не погоджуєтеся з будь-якою частиною цих Умов, не користуйтеся Послугою й не отримуйте до неї доступ.

      Ми можемо час від часу змінювати ці Умови. Чинна версія завжди опублікована на ArenaSoldOut.com/legal/terms з датою останньої зміни. Платформа записує версію, чинну на момент вашого прийняття, і кожну наступну версію. Подальше користування Послугою після зміни означає, що ви приймаєте змінені Умови.

      ## 3. Характер послуги

      Наша Послуга дає вам акаунт на нашій онлайн-платформі для продажу квитків на події й керування ними, схемами залу та пов'язаними фізичними чи цифровими продуктами й послугами. Ви можете мати акаунт лише якщо ви організатор події або уповноважений продавець квитків з прямим письмовим дозволом організатора події на кожну подію, квитки на яку ви продаєте. Якщо ви користуєтеся Послугою від імені юридичної особи, ви погоджуєтеся з цими Умовами від її імені й підтверджуєте, що маєте на це повноваження.

      Ми надаємо Послугу вам і не маємо договірних відносин з вашими клієнтами («Покупці квитків»). Коли ви продаєте квитки чи інші продукти й послуги Покупцям квитків через Послугу, договір укладається між вами й Покупцем квитків. Ви відповідаєте за власні умови продажу для своїх Покупців квитків, зокрема за повернення коштів. Ми доставляємо квитки та службові листи Покупцям квитків від вашого імені, а наша сторінка допомоги покупцям квитків спрямовує їх до вас з усіма запитаннями про вашу подію, квитки й повернення.

      Ви погоджуєтеся:

      - вести все листування зі своїми Покупцями квитків і не відсилати їх до нас по підтримку клієнтів;
      - відповідати на будь-який запит, отриманий від Покупців квитків, протягом 5 днів;
      - прийняти всю відповідальність, що виникає з договірних відносин між вами й Покупцем квитків;
      - негайно повідомляти своїх Покупців квитків і оновлювати сторінку події, якщо вашу подію скасовано, відкладено чи суттєво змінено порівняно з інформацією, наведеною, коли подію вперше пустили в продаж. Послуга допомагає вам у цьому, надсилаючи Покупцям квитків листи, коли ви переносите чи скасовуєте сеанс.

      Ми залишаємо за собою право призупинити чи припинити ваш доступ до Послуги, якщо ви не виконуєте цих вимог щодо своїх Покупців квитків.

      Користуючись Послугою, ви зобов'язані:

      - дотримуватися чинних законів і зобов'язань, пов'язаних з вашими подіями, продуктами чи послугами та з отриманням виручки від квитків, зборів чи пожертв;
      - надавати нам інформацію та матеріали, які ми можемо обґрунтовано вимагати для надання Послуги, і забезпечувати їхню точність в усіх суттєвих аспектах;
      - підтримувати й оперативно оновлювати цю інформацію та матеріали, щоб вони залишалися правдивими, точними й повними;
      - співпрацювати з нами в усіх питаннях, пов'язаних із Послугою.

      Доступ до Послуги може бути тимчасово призупинено без попередження в разі збою системи, технічного обслуговування чи ремонту або з причин, що не залежать від нас. Ваш доступ також може бути призупинено, а ваш акаунт скасовано на наш розсуд, зокрема якщо ми підозрюємо, що ви користуєтеся Послугою з шахрайською чи злочинною метою, якщо нам радять так учинити правоохоронні органи або якщо ви не оплатили наші рахунки (див. розділи 6 і 11; зазвичай ми повідомляємо вас про несплату до призупинення чи скасування). Ми не несемо відповідальності за будь-які втрати чи збитки, що можуть виникнути внаслідок неправомірного використання нашої Послуги.

      ## 4. Ваш акаунт

      Акаунти створює наша команда після вашої заявки або через бот Telegram. Коли акаунт існує, ви можете налаштовувати свої події, схеми залу й квитки та, за умови наявності платіжного акаунта в Платіжного провайдера (розділ 5), продавати квитки на свої події. Ви також можете налаштувати продаж пов'язаних фізичних чи цифрових продуктів. Ви можете додавати до свого акаунта членів своєї команди; ви відповідаєте за їхні дії в Послузі.

      Для володіння акаунтом вам має бути 18 років.

      Для вашої зручності ми тримаємо ваш акаунт відкритим протягом 120 місяців після вашого останнього входу, на випадок, якщо ви вирішите знову скористатися нашою Послугою. Перед закриттям вашого акаунта й видаленням Вашого Контенту ми спробуємо надіслати попереджувальні листи на адресу електронної пошти акаунта, щоб ви мали змогу залишити акаунт відкритим або експортувати будь-які дані, які хочете зберегти.

      Ви можете закрити свій акаунт у будь-який час, написавши на hello@arenasoldout.com з адреси електронної пошти власника акаунта.

      Ми не повертаємо жодних зборів, які вже сплачено за Послугу.

      ### Безпека акаунта

      Ви відповідаєте за збереження конфіденційності свого акаунта й цілком відповідаєте за всю діяльність, що відбувається через доступ до вашого акаунта з вашими обліковими даними. Не передавайте свої дані для входу, ключі API, секрети вебхуків чи доступ до застосунка-сканера нікому поза вашою командою. Ви погоджуєтеся негайно повідомляти нас на hello@arenasoldout.com про будь-яке несанкціоноване використання вашого акаунта, ключів API чи застосунків або про будь-яке інше порушення безпеки. Ми не несемо відповідальності за будь-які втрати чи збитки, що виникли внаслідок невиконання вами цього положення.

      Передавання інформації через інтернет не є повністю безпечним. Ми не можемо гарантувати безпеку даних, що передаються на нашу платформу, і будь-яке передавання відбувається на ваш ризик. Коли ми отримали вашу інформацію, ми застосовуємо суворі процедури та засоби безпеки, щоб запобігти несанкціонованому доступу.

      ## 5. Платіжні провайдери

      Покупці квитків платять за ваші квитки на ваш власний акаунт у платіжного провайдера, якого підтримує Послуга («Платіжний провайдер»). Чинні провайдери, країни й валюти наведено на сторінці платежів. Ми ніколи не отримуємо й не тримаємо гроші, сплачені Покупцями квитків; вони йдуть від Покупця квитків до вашого Платіжного провайдера і звідти на ваш банківський рахунок. Еквайринг карток ви оплачуєте своєму Платіжному провайдеру за його власними умовами, окремо від наших зборів.

      Користування Платіжним провайдером вимагає від вас створити в нього акаунт, за умови власних умов і положень та політики конфіденційності Платіжного провайдера. Ви перебуваєте у прямих відносинах з Платіжним провайдером і повинні прочитати та прийняти його умови, перш ніж приймати платежі від Покупців квитків через Послугу. Повернення коштів і чарджбеки врегульовуються між вами, вашим Платіжним провайдером і Покупцем квитків; Послуга дозволяє вам оформлювати повернення, а гроші повертаються з вашого платіжного акаунта.

      Виконуючи певні функції, Платіжний провайдер діє як оператор даних (processor) для вас і для нас; в інших аспектах він діє як контролер за власною політикою конфіденційності. Користуючись нашою Послугою, ви підтверджуєте й погоджуєтеся, що ми передаємо особисті дані та інформацію про транзакції, здійснені через Послугу, вашому Платіжному провайдеру.

      Якщо ми отримаємо від Платіжного провайдера повідомлення, що ваше користування нашою Послугою порушує його умови чи будь-яку угоду між вами та ним, вами й нами або вами й Покупцем квитків, або виглядає шахрайським, порушує правила протидії відмиванню коштів чи є частиною іншої шкідливої діяльності, ми можемо вжити заходів, зокрема, але не виключно, кроків, необхідних для усунення порушення, позбавлення вас можливості користуватися Послугою та призупинення чи скасування вашого акаунта. Платіжний провайдер може відмовити в послугах будь-кому, з будь-якої причини, у будь-який час.

      Ми не відповідаємо за послугу, яку надає вам Платіжний провайдер, зокрема за дії та бездіяльність Платіжного провайдера, і цим відмовляємося від будь-якої відповідальності (зокрема, але не виключно, за будь-які збитки, витрати, збори й штрафи будь-якого характеру), що виникає з неї.

      ## 6. Наші збори

      Збори за користування нашою Послугою викладено на сторінці цін і в докладних умовах цін, і вони стягуються за кожен проданий квиток. Платним використанням є продаж платного квитка чи пов'язаного продукту або послуги. Безкоштовні запрошення й квитки, за які повернуто кошти, не оплачуються. Власникам постійних майданчиків пропонують відсоток від ціни квитка замість оплати за квиток, як описано в докладних умовах цін. Ми також можемо пропонувати додаткові послуги, які оплачуються так, як зазначено на нашій платформі чи як узгоджено з вами.

      Ми виставляємо рахунок на свою оплату наступного дня після кожного сеансу за квитки, продані на цей сеанс; для подій, що продаються кілька місяців, ми можемо за домовленістю виставляти рахунок щомісяця. Умови оплати вказано в рахунку.

      Уже виставлені збори не повертаються, зокрема й тоді, коли подію скасовано.

      ## 7. Контент організатора й прийнятні стандарти контенту

      Між вами й нами ви володієте всіма правами на весь контент, який завантажуєте на платформу, і відповідаєте за його законність, надійність, цілісність, точність і якість, зокрема за текст, зображення, афіші, схеми залу, інформацію про ваші події та пов'язані продукти й послуги, відгуки й коментарі («Ваш Контент»). Завантажуючи Ваш Контент, ви надаєте нам безумовну, невиключну, передавану, безоплатну, всесвітню ліцензію на використання Вашого Контенту будь-яким способом, необхідним для надання Послуги.

      Коли Послуга зчитує інформацію з афіші чи іншого файлу, який ви надсилаєте, наприклад для створення події в боті Telegram, ви підтверджуєте кожне поле до публікації й залишаєтеся відповідальними за його точність.

      Подаючи Ваш Контент на нашу платформу, ви повинні дотримуватися таких прийнятних стандартів контенту:

      - Ваш Контент має бути точним і відповідати чинному законодавству кожної країни, з якої його розміщено.
      - Ви не повинні використовувати нашу платформу для збирання від Покупців квитків чи відвідувачів подій того контенту, який вам не потрібен: наприклад даних карток (їх збирає лише Платіжний провайдер), номерів державних чи соціальних документів, паролів чи будь-яких інших надмірних або непотрібних персональних даних, зокрема даних особливих категорій (расове чи етнічне походження, політичні погляди, релігійні чи подібні переконання, членство в профспілках, фізичний чи психічний стан здоров'я, статеве життя, сексуальна орієнтація, біометричні чи генетичні дані). Це не забороняє вам збирати дані особливих категорій тією мірою, якою це необхідно для вашої події, наприклад для розміщення місць для людей з інвалідністю.

      Ваш Контент не повинен:

      - бути незаконним, шкідливим, загрозливим, наклепницьким, непристойним, оманливим, шахрайським, таким, що порушує права, переслідувальним, морально відразливим чи расово або етнічно образливим;
      - сприяти незаконній діяльності;
      - зображати сексуально відверті зображення;
      - пропагувати насильство;
      - бути дискримінаційним за ознакою раси, статі, релігії, національності, інвалідності, сексуальної орієнтації чи віку;
      - порушувати будь-яке авторське право, право на базу даних, торговельну марку чи інше право інтелектуальної власності будь-якої іншої особи;
      - приховувати особу чи бути здатним ввести будь-кого в оману.

      Ми можемо видалити Ваш Контент з нашої платформи та Послуги, якщо, на нашу виключну думку, він порушує ці стандарти. Ми залишаємо за собою право призупинити чи припинити ваш доступ до Послуги, якщо ви суттєво їх порушуєте, вимагати від вас відшкодування будь-яких витрат, яких ми зазнали внаслідок вашого порушення, і передавати інформацію правоохоронним органам, як цього вимагає закон чи як ми вважаємо обґрунтовано необхідним.

      ## 8. Відмова від гарантій

      Хоча ми прагнемо підтримувати доступність Послуги цілодобово, ми не гарантуємо її доступності й не несемо відповідальності, якщо з будь-якої причини Послуга недоступна в будь-який час чи протягом будь-якого періоду.

      Доступ до Послуги може бути тимчасово призупинено без попередження в разі збою системи, технічного обслуговування чи ремонту або з причин, що не залежать від нас.

      Ми не гарантуємо точності й повноти матеріалів на платформі. Ми можемо змінювати матеріали на платформі чи функціональність Послуги в будь-який час без попередження. Поточні можливості Послуги з датами опубліковано на сторінці фактів.

