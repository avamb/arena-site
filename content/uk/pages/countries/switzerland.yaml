title: "Продаж квитків у Швейцарії: TWINT і франки через Stripe"
description: "Продаж квитків на заходи у Швейцарії у франках через ваш акаунт Stripe: TWINT і картки. Схеми залів малюємо безкоштовно."
h1: "Продаж квитків на заходи у Швейцарії"
lead: "Покупці у Швейцарії платять у франках через TWINT або карткою, а гроші за кожен квиток надходять на ваш власний акаунт Stripe."
related:
  - { label: "Усі країни", href: "/countries", text: "Провайдери, валюти та способи оплати за країнами." }
  - { label: "Концертні тури", href: "/solutions/concert-tours", text: "Багато міст і країн в одному заході, власна сторінка в кожного промоутера." }
  - { label: "Схеми залу", href: "/product/seating", text: "Надішліть PDF, начерк або таблицю рядів, схему ми намалюємо безкоштовно." }
sections:
  - type: glance
    id: glance
    eyebrow: "Коротко"
    title: "Швейцарія коротко"
    rows:
      - { k: "Платіжний провайдер", v: "Stripe" }
      - { k: "Валюта", v: "Швейцарський франк (CHF)" }
      - { k: "Способи оплати", v: "TWINT, картки, Apple Pay, Google Pay: ті, що ви ввімкнули в Stripe" }
      - { k: "Сторінка покупки", v: "Англійська, іспанська, російська, чеська, іврит; німецька, французька та італійська на запит" }
      - { k: "Наша ціна", v: "{usdPrice} за квиток, {usdSeated} з місцем; з кредитами від {usdFrom}" }
      - { k: "ПДВ на нашу комісію", v: "Немає" }

  - type: cards
    id: benefits
    eyebrow: "Чому ArenaSoldOut.com"
    title: "Що отримують організатори?"
    lead: "Квиткова платформа, створена для організаторів: ви залишаєте собі більше з кожного квитка, продаєте більше й починаєте раніше."
    items:
      - title: "Заробляйте більше на кожному квитку"
        text: "Фіксовані {usdPrice} за квиток, а не відсоток від ціни. З кредитами ще дешевше, від {usdFrom} за квиток. Комісія за еквайринг лишається між вами й вашим платіжним провайдером."
        link: { label: "Ціни →", href: "/pricing" }
      - title: "Продавайте більше"
        text: "Промокоди, ранні ціни, посилання «приведи друга», нагадування про покинутий кошик і лист підписникам у момент старту продажів."
        link: { label: "Промокоди та цінові вікна →", href: "/product/pricing-tools" }
      - title: "Починайте швидше"
        text: "Захід без схеми залу виходить у продаж за 10 хвилин. Схему залу ми малюємо для вас безкоштовно, зазвичай за день."
        link: { label: "Ваш перший захід →", href: "/first-event" }

  - type: prose
    id: twint
    eyebrow: "TWINT"
    title: "Як покупці платять через TWINT?"
    body: "TWINT: найпопулярніший спосіб оплати у Швейцарії. Ви вмикаєте його в панелі Stripe, і він з'являється на оплаті поруч із картками. Комісію за TWINT встановлює Stripe, вона видна у вашому акаунті. Гроші за кожен квиток надходять на ваш акаунт, ArenaSoldOut.com їх не тримає."

  - type: cards
    id: where
    eyebrow: "Де продавати"
    title: "Де я можу продавати квитки?"
    lead: "Одразу в трьох місцях. Продажі звідусіль збираються в одному Event Center."
    items:
      - title: "Наша сторінка продажу"
        text: "Ми розміщуємо сторінку вашого заходу за адресою tickets.arenasoldout.com/ваша-назва/ваш-захід. Нічого не треба створювати самим."
        link: { label: "Де продавати →", href: "/product/sell" }
      - title: "Ваш сайт"
        text: "Поставте віджет квитків на сайт, який у вас уже є. Покупці обирають місця й платять, не залишаючи його."
        link: { label: "Віджет →", href: "/product/sell" }
      - title: "Ваші соцмережі"
        text: "Поділіться посиланням у соцмережах і месенджерах або надрукуйте QR-код на афіші. Кожне замовлення прив'язане до свого посилання, тож ви бачите, яке з них продало."
        link: { label: "Посилання та QR-коди →", href: "/product/sell" }

  - type: faq
    id: questions
    eyebrow: "Запитання"
    title: "Про що запитують організатори перед стартом?"
    items:
      - q: "Скільки мені коштує один квиток?"
        a: "{usdPrice} за квиток, {usdSeated} з місцем. Ви платите після заходу, за продані квитки. Запрошення без комісії. Докладніше в розділі [ціни](/pricing)."
      - q: "Чи можна платити менше за квиток?"
        a: "Так. Купіть кредити заздалегідь, і ціна знизиться до {usdFrom} за квиток ({eurFrom} в ЄС). Кредити не згорають. Докладніше в розділі [ціни](/pricing)."
      - q: "Коли я плачу ArenaSoldOut.com?"
        a: "Після заходу, за продані квитки, якщо ви обрали такий спосіб оплати. Також ви можете купити кредити до заходу."
      - q: "Куди надходять гроші за квитки?"
        a: "На ваш власний акаунт у вашого платіжного провайдера, за кожен проданий квиток. ArenaSoldOut.com їх не тримає."
      - q: "Як швидко можна почати продажі?"
        a: "Ми підтверджуємо вашу організацію, зазвичай протягом дня. Якщо платіжний акаунт уже є, захід без схеми залу виходить у продаж за 10 хвилин. Схему залу ми малюємо безкоштовно, зазвичай за день."
      - q: "Наскільки надійна платформа?"
        a: "Навантажувальний тест: 800 замовлень на хвилину при 1 000 покупців одночасно. Система моніторингу одразу сповіщає команду, резервні копії робляться щоночі й шифруються, перед сайтом стоїть Cloudflare. Від старту у 2019 році не зафіксовано жодного збою, навіть коли кілька десятків тисяч квитків продавалися за 5 хвилин. Докладніше в розділі [надійність](/product/reliability)."
      - q: "У мене постійний майданчик. Чи є особливі умови?"
        a: "Так. Театри, клуби й інші майданчики, що проводять заходи цілий рік або за сезоном, платять {percent}% від ціни квитка, з обмеженням на квиток, рахунок раз на місяць. Докладніше в розділі [ціни](/pricing)."
      - q: "У мене недорогі квитки. Чи є нижча ціна?"
        a: "Так. Якщо кожен квиток заходу коштує {usdLowMax} або менше, комісія становить {lowPercent}% від ціни квитка. Докладніше в розділі [ціни](/pricing)."
      - q: "Чи можна продавати квитки різної вартості на один захід?"
        a: "Так. Категорії з власними цінами, ранні ціни, що змінюються в задану дату, кроки за кількістю, безкоштовні квитки та квитки «плати скільки хочеш»."
      - q: "Чи є промокоди?"
        a: "Так, з областю дії (які категорії та сеанси), строками й лімітом на покупця. Докладніше в розділі [промокоди та цінові вікна](/product/pricing-tools)."
      - q: "Чи можна продавати дитячий квиток лише разом із дорослим?"
        a: "Так, через додаткові категорії. Додатковий квиток продається лише разом з основним квитком того самого сеансу, тому дитячий квиток не можна купити без дорослого."
      - q: "Чи можна продавати напої або мерч разом із квитками?"
        a: "Так. Напій можна продавати заздалегідь як додаткову категорію: він продається лише разом із квитком і надходить окремим квитком. Мерч, вино й подарункові набори продаються в магазині поруч із квитками: варіанти товару, кошик, самовивіз на заході або ваша доставка, повернення. Магазин підключається окремо, умови за запитом."
      - q: "Я проводжу те саме шоу щотижня. Щоразу створювати новий захід?"
        a: "Ні. Ви додаєте сеанс до того самого заходу: ціни, категорії та схема залу переносяться, а покупець обирає дату."
      - q: "Чи видно продажі кожного заходу в реальному часі?"
        a: "Так. В Event Center на телефоні чи комп'ютері, просто в браузері, нічого не треба встановлювати: замовлення та підсумки за кожним сеансом, звіт у CSV. Якщо ви користуєтеся Telegram, кожен продаж і кожне повернення за секунди надходять ще й у вашу групу."
      - q: "Чи потрібне спеціальне обладнання на вході?"
        a: "Ні. Застосунок MACS сканує квитки на будь-якому iPhone або Android, з паперу чи з екрана. Ручні лазерні сканери та сканери штрихкодів через USB або Bluetooth теж підходять. Докладніше в розділі [застосунок MACS](/product/scanner)."
      - q: "Скільки коштує застосунок MACS для контролю входу?"
        a: "MACS входить у вартість для організаторів, які продають через ArenaSoldOut.com."
      - q: "Які способи оплати побачать покупці?"
        a: "Ті, що ви ввімкнули в акаунті Stripe. Увімкніть TWINT, і покупці у Швейцарії побачать його поруч із картками."

  - type: prose
    id: team
    eyebrow: "Наша команда"
    title: "Є запитання чи пропозиції?"
    body: "Напишіть команді. Ми відповідаємо на запитання про вашу країну, майданчик і захід та слухаємо ідеї: ми робимо ArenaSoldOut.com для того, щоб продавати квитки вам було зручно й вигідно. [Написати команді](/contact#write)."

  - type: cta
    id: start
    title: "Почніть продавати сьогодні"
    text: "Створіть захід, підключіть платіжний акаунт, поділіться посиланням."
    primary: { label: "Створити захід", href: "/start#create" }
    secondary: { label: "Написати команді", href: "/contact#write" }
    note: "Ми підтверджуємо вашу організацію, підключаємо ваш платіжний акаунт і безкоштовно малюємо схему залу."
