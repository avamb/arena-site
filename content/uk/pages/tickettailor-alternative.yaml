  - type: prose
    id: examples
    title: Що це означає для однієї події?
    body: |
      **1000 квитків, вільна розсадка, оплата за фактом.** ArenaSoldOut.com: 1000 × US$0,59 = **US$590**. Ticket Tailor: 1000 × US$0,85 = US$850. Вам лишається на **US$260** більше.

      **500 квитків з місцями, оплата за фактом.** ArenaSoldOut.com: 500 × US$1,09 = **US$545**. Ticket Tailor: 500 × US$1,70 = US$850. Вам лишається на **US$305** більше, а схему залу ми малюємо безкоштовно.

      **1000 квитків на рік, передоплата кредитами.** Пакет кредитів ArenaSoldOut.com 1K: **US$430**. Ticket Tailor, 1000 кредитів: US$520. На **US$90** менше, а кредити не згорають на жодній із платформ.

      Порахуйте власну подію в [калькуляторі на сторінці цін](/pricing#packages).

