    eyebrow: Ціни в доларах США
    title: Скільки коштує квиток на кожній платформі?
    lead: "Наша комісія за проданий квиток поруч із комісією Ticket Tailor. Суми без ПДВ, обробка карток сплачується вашому платіжному провайдеру на обох платформах."
