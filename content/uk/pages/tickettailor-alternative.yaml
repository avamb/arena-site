    id: more
    eyebrow: Окрім ціни
    title: Що ще ви отримуєте з ArenaSoldOut.com?
    items:
      - title: Схеми залів, намальовані для вас безкоштовно
        text: "Надішліть PDF, фото ескіза від руки або таблицю рядів і місць. Команда збудує майданчик; самі ви його не малюєте."
        link: { label: Схеми залів, href: /product/seating }
      - title: Гроші просто на ваш акаунт
        text: "Покупці платять на ваш власний акаунт Stripe, Flitt або AllPay. ArenaSoldOut.com ніколи не тримає кошти і нічого не вираховує з ваших продажів."
        link: { label: Платежі, href: /payments }
      - title: Нижча ставка для дешевих квитків
        text: "Коли кожен квиток події коштує {usdLowMax} або менше: {lowPercent}% від ціни квитка замість фіксованої плати. Дискотеки, забіги, дитячі свята, екскурсії."
        link: { label: Як це працює, href: /pricing#low-price }
      - title: Покупці своєю мовою
        text: "Сторінка покупця, листи й квитки мовою покупця, зокрема іврит справа наліво. Будь-яку нову мову додаємо протягом 40 годин."
        link: { label: Електронні квитки, href: /product/tickets }
      - title: Кожен продаж у вашому Telegram
        text: "Створіть подію з фото афіші в Telegram-боті й бачте кожен продаж і повернення коштів у своїй групі за лічені секунди."
        link: { label: Telegram-бот, href: /product/telegram }
      - title: Людина, яка налаштовує все разом із вами
        text: "Не центр допомоги: наша команда підключає ваш платіжний акаунт, будує схему й разом із вами перевіряє першу подію."
        link: { label: Ваша перша подія, href: /first-event }

  - type: faq
    id: questions
    title: Питання, які організатори ставлять, порівнюючи
    items:
      - q: Чи дешевший ArenaSoldOut.com за Ticket Tailor?
        a: "Так, за квиток при кожному опублікованому обсязі до 5000 квитків на рік: {usdPrice} замість US$0,85 при оплаті після події, {usdSeated} замість US$1,70 за квиток з місцем, а з кредитами від {usdFrom} за квиток. Понад 5000 квитків на рік ми узгоджуємо індивідуальні умови."
      - q: Чи берете ви відсоток від ціни квитка?
        a: "Ні. Як і Ticket Tailor, ми беремо фіксовану плату за кожен проданий квиток. Єдині відсотки необов'язкові: нижча ставка для подій, де кожен квиток коштує {usdLowMax} або менше, і ставка для постійних майданчиків."
      - q: Куди йдуть гроші покупця?
        a: "На ваш власний платіжний акаунт з кожним замовленням: Stripe, Flitt або AllPay. ArenaSoldOut.com ніколи не тримає кошти. Нашу комісію виставляємо в рахунку після події або списуємо з ваших кредитів."
      - q: Чи можу я перенести свої події з Ticket Tailor?
        a: "Так. Надішліть нам список подій і схеми залів; команда налаштує події й безкоштовно намалює схеми, а ви продовжуєте продавати на Ticket Tailor, доки ваша сторінка в нас не буде готова."
      - q: Чи плачу я підписку?
        a: "Ні. Ви платите лише за продані квитки. Запрошення й безкоштовні квитки на платні події комісією не обкладаються."
      - q: А благодійні організації?
        a: "Зареєстровані благодійні організації отримують знижку 50% на нашу комісію, як і на Ticket Tailor. Напишіть нам, і ми ввімкнемо її для вашої організації."
      - q: Як продавати в євро?
        a: "Майданчики в країнах ЄС сплачують нашу комісію в євро: {eurPrice} за квиток при оплаті після події. Самі квитки продаються у валюті вашого платіжного акаунта."

