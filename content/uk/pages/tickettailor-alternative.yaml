      - { what: "Кредити, близько 5000 квитків", us: "**US$0,38** за квиток", them: "US$0,43 за квиток" }
      - { what: "Понад 5000 квитків на рік", us: "Індивідуальні умови: [напишіть нам](/contact)", them: "від US$0,39 до US$0,30 за квиток" }
