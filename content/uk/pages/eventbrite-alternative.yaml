    id: more
    eyebrow: Окрім ціни
    title: Чим ще відрізняється ArenaSoldOut.com?
    items:
      - title: Гроші ваші з першого замовлення
        text: "Покупці платять на ваш власний акаунт Stripe, Flitt або AllPay. ArenaSoldOut.com ніколи не тримає кошти, тож виплати після події чекати не треба."
        link: { label: Платежі, href: /payments }
      - title: Схеми залів, намальовані для вас безкоштовно
        text: "Надішліть PDF, фото ескіза від руки або таблицю рядів і місць. Команда збудує майданчик; самі ви його не малюєте."
        link: { label: Схеми залів, href: /product/seating }
      - title: Нижча ставка для дешевих квитків
        text: "Коли кожен квиток події коштує {usdLowMax} або менше: {lowPercent}% від ціни квитка замість фіксованої плати. Дискотеки, забіги, дитячі свята, екскурсії."
        link: { label: Як це працює, href: /pricing#low-price }
      - title: Ваша сторінка, ваші покупці
        text: "Продавайте на власному сайті через віджет квитків або на своїй сторінці в нас. Покупці приходять до вас, а не до каталогу поруч з іншими подіями."
        link: { label: Продаж на вашому сайті або нашому, href: /product/sell }
      - title: Кожен продаж у вашому Telegram
        text: "Створіть подію з фото афіші в Telegram-боті й бачте кожен продаж і повернення коштів у своїй групі за лічені секунди."
        link: { label: Telegram-бот, href: /product/telegram }
      - title: Налаштуйте самі або передайте нам
        text: "Ви створюєте події в Event Center або Telegram-боті за лічені хвилини; схеми залів ми малюємо безкоштовно. Немає часу? Наш менеджер подій зробить це за вас, як платна послуга."
        link: { label: Менеджер подій, href: /pricing#services }

  - type: faq
    id: questions
    title: Питання, які організатори ставлять, порівнюючи
    items:
      - q: Чи дешевший ArenaSoldOut.com за Eventbrite?
        a: "За комісією так, за будь-якої ціни квитка: {usdPrice} за квиток замість 3,7% + US$1,79 у США і {eurPrice} замість 5,9% + €0,79 в Ірландії. Обробка карток додається зверху на обох платформах у США."
      - q: Хто платить збір, я чи покупець?
        a: "Вирішуєте ви. Можна додати власний сервісний збір для покупця поверх ціни квитка або залишити ціну як є й сплачувати нашу комісію самому. Запрошення й безкоштовні квитки на платні події комісією не обкладаються."
      - q: Куди йдуть гроші покупця?
        a: "На ваш власний платіжний акаунт з кожним замовленням: Stripe, Flitt або AllPay. ArenaSoldOut.com ніколи не тримає кошти. Нашу комісію виставляємо в рахунку після події або списуємо з ваших кредитів."
      - q: Чи потрапить моя подія в маркетплейс?
        a: "Ні. В Eventbrite є маркетплейс, де покупці переглядають події; в ArenaSoldOut.com його немає. Ми продаємо квитки на вашому сайті й на вашій сторінці події, а покупців ви приводите власними каналами."
      - q: Чи можу я перенести свої події з Eventbrite?
        a: "Так. Ви створюєте події в Event Center або Telegram-боті за лічені хвилини, а ми безкоштовно малюємо ваші схеми залів за PDF або ескізом. Немає часу? Наш менеджер подій перенесе їх за вас, як платна послуга. Продовжуйте продавати на Eventbrite, доки ваша сторінка в нас не буде готова."
      - q: Чи плачу я підписку?
        a: "Ні. Ви платите лише за продані квитки, після події, або купуєте кредити наперед від {usdFrom} за квиток. Кредити не згорають."

