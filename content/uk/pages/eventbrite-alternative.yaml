title: "Альтернатива Eventbrite з фіксованою платою за квиток"
description: "ArenaSoldOut.com і Eventbrite: фіксовані US$0,62 за квиток замість 3,7% + US$1,79, гроші покупця одразу на ваш власний акаунт."
h1: Альтернатива Eventbrite без відсотка від ціни квитка
lead: "Eventbrite бере відсоток від кожного квитка плюс фіксовану суму. ArenaSoldOut.com бере фіксовану плату за квиток, хоч скільки він коштує, а гроші йдуть на ваш власний платіжний акаунт з кожним замовленням. Нижче обидва прайси поруч, як вони опубліковані на 11 листопада 2026 року."
related:
  - { label: Усі порівняння, href: /alternatives, text: "ArenaSoldOut.com поруч з іншими платформами продажу квитків." }
  - { label: Ціни, href: /pricing, text: "Оплата за фактом або кредити, калькулятор і всі пакети кредитів." }
  - { label: Платежі, href: /payments, text: "Які платіжні акаунти можна підключити, за країнами." }
sections:
  - type: compare
    id: prices
    eyebrow: Ціна за квиток
    title: Скільки коштує квиток на кожній платформі?
    lead: "Ціни обох платформ станом на 11 листопада 2026 року. Наша комісія за проданий квиток поруч із сервісним збором Eventbrite. Обробка карток у США оплачується окремо на обох платформах: там Eventbrite, у нас вашому власному платіжному провайдеру."
    cols: { what: "", us: ArenaSoldOut.com, them: Eventbrite }
    rows:
      - { what: "Як рахується плата", us: "Фіксована плата за квиток", them: "Відсоток від ціни квитка плюс фіксована сума" }
      - { what: "США, за платний квиток", us: "**{usdPrice}**", them: "3,7% + US$1,79" }
      - { what: "США, квиток US$20", us: "**{usdPrice}**", them: "US$2,53" }
      - { what: "США, квиток US$50", us: "**{usdPrice}**", them: "US$3,64" }
      - { what: "США, квиток US$100", us: "**{usdPrice}**", them: "US$5,49" }
      - { what: "Ірландія та ЄС, за платний квиток", us: "**{eurPrice}**", them: "5,9% + €0,79 в Ірландії" }
      - { what: "Обробка карток", us: "Сплачується вашому платіжному провайдеру", them: "2,9% від замовлення в США, сплачується Eventbrite" }
      - { what: "Коли ви отримуєте гроші", us: "З кожним замовленням, на ваш акаунт", them: "Після події, виплачує Eventbrite" }
    note: "Ціни Eventbrite: [центр допомоги Eventbrite](https://www.eventbrite.com/help/en-us/articles/755615/how-much-does-it-cost-for-organizers-to-use-eventbrite/) і [eventbrite.com/organizer/pricing](https://www.eventbrite.com/organizer/pricing/), перевірено 11 листопада 2026 року, без ПДВ. Наші ціни: [ціни](/pricing) і [докладні умови](/pricing/terms). Eventbrite є торговою маркою свого власника; ArenaSoldOut.com не афілійований з ним."

  - type: prose
    id: examples
    title: Що це означає для однієї події?
    body: |
      Усі суми за цінами обох платформ станом на 11 листопада 2026 року.

      **1000 квитків по US$30, оплата за фактом.** ArenaSoldOut.com: 1000 × US$0,62 = **US$620**. Eventbrite: 1000 × (3,7% від US$30 + US$1,79) = US$2900. Різниця **US$2280**, до обробки карток з обох боків.

      **300 квитків з місцями по US$60.** ArenaSoldOut.com: 300 × US$1,18 = **US$354**, а схему залу ми малюємо безкоштовно. Eventbrite: 300 × (3,7% від US$60 + US$1,79) = US$1203.

      **Чим дорожчий квиток, тим більша різниця.** Наша комісія однакова для квитка за US$15 і за US$150. Відсоток росте разом із ціною.

      Порахуйте власну подію в [калькуляторі на сторінці цін](/pricing#packages).

