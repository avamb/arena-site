  - type: prose
    id: how
    title: Як ми порівнюємо
    body: |
      **Лише опубліковані ціни.** Рядок потрапляє в таблицю, лише якщо ми змогли прочитати його на сторінці цін або в центрі допомоги іншої платформи. Посилання на джерело й дата стоять під кожною таблицею.

      **Порівняння на рівних умовах.** Деякі платформи включають плату за картку у свою комісію; ми ні, бо покупець платить на ваш власний платіжний акаунт, а ваш провайдер бере власну плату за картку. Кожна сторінка каже, що є що.

      **Чого ми не робимо.** В ArenaSoldOut.com немає маркетплейсу, де покупці переглядають події, і немає безготівкових платежів у барі. Повний список на [сторінці фактів](/facts).

      Знайшли ціну, яка змінилася? [Напишіть нам](/contact), і ми виправимо сторінку.

