title: "Партнери: майданчики, промоутери, WP-агенції, розробники"
description: "Як майданчики, промоутери, агентства WordPress і розробники працюють з ArenaSoldOut.com: сторінки промоутерів, плагін, віджет, API, окремі умови."
h1: Партнери
lead: "Майданчики, що приймають заходи, промоутери, які їх продають, агентства, що будують сайти організаторів, розробники, які інтегрують. У кожного є місце на платформі й людина в команді, з якою можна поговорити."
related:
  - { label: Для розробників, href: /developers }
  - { label: Майданчики й клуби, href: /solutions/venues }
  - { label: Контакти, href: /contact }
sections:
  - type: cards
    id: kinds
    eyebrow: Партнери
    title: Як партнери працюють з ArenaSoldOut.com?
    items:
      - { title: "Майданчики", text: "Постійний майданчик приносить свою схему один раз і пропонує її кожному організатору, що його орендує; окремі умови з відсотком від ціни квитка.", link: { label: "Майданчики й клуби →", href: /solutions/venues } }
      - { title: "Промоутери", text: "Сторінка для кожного промоутера з власним посиланням і кодами; організатор бачить кожен канал, промоутер бачить свій.", link: { label: "Де ви продаєте →", href: /product/sell } }
      - { title: "Агентства WordPress", text: "Плагін передає замовлення у WooCommerce; віджет підходить до будь-якої теми. Команда підтримує агентство під час запуску.", link: { label: "WordPress →", href: /solutions/wordpress } }
      - { title: "Розробники", text: "Публічне API, пакет заходу одним викликом, підписані вебхуки, ключі з обмеженими правами, події віджета; імпорт з ArenaSoldOut.com та інших систем.", link: { label: "Розробникам →", href: /developers } }
  - type: faq
    id: questions
    eyebrow: Запитання
    title: Що першим питають партнери?
    items:
      - q: Чи є реферальна або дилерська винагорода?
        a: Умови партнерства узгоджуються індивідуально; напишіть команді, чим ви займаєтеся і для кого.
      - q: Чи можна відсканувати на вході квиток, проданий партнером?
        a: "Так. [Застосунок-сканер MACS](/product/scanner) приймає квитки партнерів з інших систем поруч із квитками ArenaSoldOut.com, на iOS і Android."
      - q: Чи може агентство керувати кількома організаторами?
        a: Так, через ролі в Event Center кожної організації та ключі API з обмеженими правами для кожної організації.
  - type: cta
    id: start
    title: Напишіть команді
    text: Розкажіть, хто ви і з ким працюєте. Ми відповідаємо особисто протягом одного робочого дня.
    primary: { label: Зв'язатися з нами, href: /contact }
    secondary: { label: Читати документацію для розробників, href: /developers }
    note: "Або в Telegram: чат читають упродовж дня за часом Європи та Ізраїлю."
