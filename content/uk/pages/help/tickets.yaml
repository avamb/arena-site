title: "Я купив квиток: де він і що показати на вході"
description: "Ваш квиток є PDF у листі з підтвердженням з EAN-13 і QR-кодом; покажіть його на телефоні або роздрукованим. Повернення й зміна дат: питайте організатора."
h1: Допомога покупцям квитків
lead: "Ваш квиток є PDF, доданим до листа з підтвердженням, зі штрихкодом і QR-кодом. Покажіть його на телефоні або роздрукованим. Запитання про повернення й дати адресуйте організатору події, чий контакт є на сторінці продажу та в листі."
