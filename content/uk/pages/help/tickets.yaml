sections:
  - type: faq
    id: questions
    eyebrow: Покупцям
    title: Де мій квиток?
    items:
      - q: Я заплатив, але листа немає
        a: Перевірте папку зі спамом і адресу, яку ви ввели під час оформлення замовлення. Якщо за кілька хвилин листа немає, напишіть організатору зі своїм іменем і часом покупки; він може надіслати квиток повторно на іншу адресу.
      - q: Що показати на вході?
        a: PDF на телефоні або роздрукований. Штрихкод і QR-код скануються один раз; знімок екрана з кодом теж підійде.
      - q: Чи можу я повернути гроші?
        a: Про повернення вирішує організатор події, за умовами, показаними під час оформлення замовлення. Напишіть організатору; повернення йде на картку, якою ви платили.
      - q: Дату змінено
        a: Ви отримаєте лист від організатора з оновленим квитком у додатку. Старий квиток перестає діяти.
      - q: Чи можу я передати квиток другові?
        a: Перешліть PDF. Квиток сканується один раз, хто б його не приніс.
      - q: Маю запитання щодо моєї оплати
        a: Платіж пішов на власний платіжний акаунт організатора; організатор бачить його в Event Center і може відповісти. ArenaSoldOut.com не тримає гроші покупців.
      - q: Куди йдуть мої дані?
        a: "Організатору події, щоб доставити квиток, і платіжному провайдеру для оплати. Дивіться [політику конфіденційності](/legal/privacy)."
  - type: cta
    id: organizers
    title: Ви організатор?
    text: Створіть подію, підключіть платіжний акаунт, поділіться посиланням. Покупці платять на ваш власний рахунок з першого квитка.
    primary: { label: Почати продаж, href: /start }
    secondary: { label: Як це працює, href: /#how }
    note: Покупці квитків пишуть організатору своєї події.
