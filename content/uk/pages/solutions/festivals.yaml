title: "Продаж квитків на фестивалі: абонементи, багато категорій"
description: "Квитки на фестивалі: одноденні квитки й абонементи, категорії з квотами, ланцюжки нерозпроданих місць, рання ціна за датою, сканування на входах."
h1: Продаж квитків на фестивалі
tagline: Фестиваль починається задовго до відкриття воріт.
lead: "Одноденні квитки й абонементи на весь фестиваль, багато категорій із квотами, рання ціна, що закінчується в потрібну дату, і ланцюжок, що передає нерозпродані місця від однієї категорії до наступної. На кожному вході квитки сканують у застосунку."
