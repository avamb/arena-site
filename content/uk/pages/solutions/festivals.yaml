sections:
  - type: cards
    id: what
    eyebrow: Для фестивалів
    title: Що важливо для фестивалю?
    items:
      - { title: "Категорії з квотами", text: "Перший день, другий день, повний абонемент, VIP, кемпінг: кожна категорія з власною ціною, квотою й вікном продажу.", link: { label: "Цінові інструменти →", href: /product/pricing-tools } }
      - { title: "Ланцюжки категорій", text: "Коли early bird розпродано, його нерозпродані місця переходять до наступної категорії замість того, щоб блокувати продаж.", link: { label: "Цінові інструменти →", href: /product/pricing-tools } }
      - { title: "Входи", text: "Застосунок-сканер для iOS і Android на кожних воротах; квитки партнерів з інших систем теж приймаються.", link: { label: "Застосунок-сканер MACS →", href: /product/scanner } }
      - { title: "Навантаження", text: "800 замовлень на хвилину за 1000 одночасних покупців у тестах навантаження; початкова хвилина продажу покрита.", link: { label: "Надійність →", href: /product/reliability } }
  - type: faq
    id: questions
    eyebrow: Запитання
    title: Що першим питають організатори фестивалів?
    items:
      - q: Чи може покупець поєднати одноденний квиток і кемпінг в одному замовленні?
        a: Так, кілька категорій однієї події в одному оформленні замовлення.
      - q: Чи можемо ми змінити ціни на останній тиждень?
        a: Так. Цінові вікна перемикаються за датою й часом; кроки за кількістю відкривають наступну ціну, коли крок розпродано.
      - q: "У нас є безкоштовні квитки для спонсорів. Як бути?"
        a: Безкоштовні квитки й запрошення з Event Center, без комісії платформи, скануються як будь-який квиток.
      - q: Скільки це коштує?
        a: "Фіксована комісія за проданий квиток, рахунок після події або списання з ваших кредитів, щомісяця для подій, що продаються місяцями; дивіться [ціни](/pricing)."
  - type: cta
    id: start
    title: Почніть продаж сьогодні
    text: "Створіть подію, підключіть платіжний акаунт, поділіться посиланням."
    primary: { label: Створити подію, href: /start#create }
    secondary: { label: Відкрити Telegram-бота, href: https://t.me/EventsCentrBot }
    note: "Питання? Напишіть нам: команда відповідає протягом одного робочого дня."
