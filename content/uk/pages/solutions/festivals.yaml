title: "Продаж квитків на фестивалі: кілька днів, багато категорій"
description: "Квитки на фестивалі: одноденні й повні абонементи, категорії з квотами, ланцюжки нерозпроданих місць, early bird за датою, сканування на входах."
h1: Фестивалі
lead: "Одноденні й повні абонементи, багато категорій із квотами, early bird, що вмикається за датою, і ланцюжок, що передає нерозпродані місця від однієї категорії до наступної. Сканування на кожному вході через застосунок."
related:
  - { label: Промокоди й цінові вікна, href: /product/pricing-tools }
  - { label: Концерти, href: /solutions/concerts }
