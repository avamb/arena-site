  - type: cards
    id: what
    eyebrow: Для фестивалів
    title: Що важливо для фестивалю?
    items:
      - { title: "Категорії з квотами", text: "Перший день, другий день, повний абонемент, VIP, кемпінг: кожна категорія з власною ціною, квотою й вікном продажу.", link: { label: "Цінові інструменти →", href: /product/pricing-tools } }
      - { title: "Ланцюжки категорій", text: "Коли рання ціна закінчується, її нерозпродані місця переходять до наступної категорії, і продаж не зупиняється.", link: { label: "Цінові інструменти →", href: /product/pricing-tools } }
      - { title: "Рання ціна й ступені", text: "Рання ціна, що закінчується в призначений день, або ціна, що зростає, коли розпродано чергову партію квитків.", link: { label: "Цінові інструменти →", href: /product/pricing-tools } }
      - { title: "Промокоди з лімітами", text: "Коди для партнерів, шанувальників артистів чи підписників розсилки, з періодом дії та лімітом на покупця.", link: { label: "Цінові інструменти →", href: /product/pricing-tools } }
      - { title: "Запрошення без комісії", text: "Безкоштовні квитки для спонсорів, артистів і преси; на вході вони скануються як звичайні квитки.", link: { label: "Квитки →", href: /product/tickets } }
      - { title: "Входи", text: "Застосунок-сканер MACS для iOS і Android на кожних воротах; квитки партнерів з інших систем теж приймаються.", link: { label: "Застосунок-сканер MACS →", href: /product/scanner } }
      - { title: "Квитки біля воріт", text: "Поставте біля входу роздрукований QR-код із коротким посиланням на покупку: гості наводять камеру й одразу купують квиток.", link: { label: "Де ви продаєте →", href: /product/sell } }
      - { title: "Великий старт продажу", text: "800 замовлень на хвилину, коли на сторінці одночасно 1000 покупців, у навантажувальних тестах: перша хвилина продажу мине спокійно.", link: { label: "Надійність →", href: /product/reliability } }
      - { title: "Продажі в Telegram", text: "Кожен продаж і кожне повернення за лічені секунди з'являються у вашій групі в Telegram разом із контактом покупця.", link: { label: "Telegram →", href: /product/telegram } }
  - type: faq
    id: questions
    eyebrow: Запитання
    title: Що першим питають організатори фестивалів?
    items:
      - q: Чи може покупець поєднати одноденний квиток і кемпінг в одному замовленні?
        a: Так, квитки різних категорій одного заходу оплачуються одним замовленням.
      - q: Чи можемо ми змінити ціни на останній тиждень?
        a: Так. Цінові вікна перемикаються за датою й часом, а коли розпродано чергову партію квитків, відкривається наступна ціна.
      - q: "У нас є безкоштовні квитки для спонсорів. Як їх оформити?"
        a: Створіть безкоштовні квитки й запрошення в Event Center. Комісії за них немає, а на вході вони скануються як звичайні квитки.
      - q: Скільки це коштує?
        a: "Фіксована комісія за кожен проданий квиток. Рахунок виставляємо після заходу, або ви сплачуєте кредитами; якщо продаж триває місяцями, рахунок приходить щомісяця. Дивіться [ціни](/pricing)."
  - type: cta
    id: start
    title: Попереду ваш найкращий захід. Почнімо з квитків?
    text: Створіть захід, підключіть платіжний акаунт, поділіться посиланням.
