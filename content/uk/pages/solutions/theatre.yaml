title: "Продаж квитків у театр: схеми залу, повторні дати"
description: "Квитки для театрів: нумеровані місця за схемою вашого залу, повторні дати на одній схемі, запрошення, повернення й перенесення дат. Від 100 до 1500 місць."
h1: Театр
tagline: Вистава починається задовго до третього дзвоника.
lead: "Схема, що відповідає вашому залу: ми безкоштовно малюємо її за вашим PDF, ескізом чи таблицею рядів, і вона служить для кожної вистави. Запрошення для преси й партнерів, повернення коштів і перенесення дат оформлюються в Event Center."
related:
  - { label: "Схеми залу, що відповідають майданчику", href: /product/seating }
  - { label: "Майданчики й клуби: окремі умови", href: /solutions/venues }
  - { label: Електронні квитки й сканування, href: /product/tickets }
sections:
  - type: paycountries
    id: countries
  - type: cards
    id: what
    eyebrow: Для театрів
    title: Що важливо для театру?
    items:
      - { title: "Схема ваша", text: "Партер, ложі, балкон, категорії за ціною. Надішліть PDF, таблицю або ескіз від руки, і команда безкоштовно намалює схему; версії зберігають продані квитки, коли змінюється планування.", link: { label: "Схеми залу →", href: /product/seating } }
      - { title: "Повторні дати", text: "Додавайте вистави до того самого заходу: схема, ціни й категорії зберігаються, а глядач обирає зручну дату.", link: { label: "Event Center →", href: /#center } }
      - { title: "Запрошення без комісії", text: "Безкоштовні квитки на конкретні місця для преси, партнерів і трупи; на вході вони скануються як звичайні квитки.", link: { label: "Квитки →", href: /product/tickets } }
      - { title: "Ваша власна каса", text: "Продавайте на своєму сайті через віджет або на нашій сторінці продажу; гроші надходять прямо на ваш рахунок.", link: { label: "Де ви продаєте →", href: /product/sell } }
      - { title: "Промокоди й рання ціна", text: "Коди для передплатників, шкіл чи партнерів із періодом дії та лімітом на покупця; рання ціна, що закінчується в призначений день.", link: { label: "Цінові інструменти →", href: /product/pricing-tools } }
      - { title: "Вистава переноситься? Вирішуєте ви", text: "Повернути гроші всім, запропонувати нову дату або знайти інше рішення. Глядачі отримають лист з оновленим квитком.", link: { label: "Квитки →", href: /product/tickets } }
      - { title: "Продажі в Telegram", text: "Кожен продаж і кожне повернення за лічені секунди з'являються у вашій групі в Telegram разом із контактом покупця.", link: { label: "Telegram →", href: /product/telegram } }
      - { title: "Вхід", text: "Застосунок-сканер MACS для iOS і Android перевіряє кожен квиток. А за QR-кодом із коротким посиланням біля входу ті, хто запізнився, куплять квиток просто на місці.", link: { label: "Застосунок-сканер MACS →", href: /product/scanner } }
      - { title: "Сервісний збір ваш", text: "Додайте до ціни квитка власний сервісний збір для покупців: він повністю надходить вам.", link: { label: "Ціни →", href: /pricing } }
  - type: faq
    id: questions
    eyebrow: Запитання
    title: Що першим питають театри?
    items:
      - q: Чи малюєте ви схему залу?
        a: Так, безкоштовно. Надішліть PDF схеми, фото ескізу від руки або таблицю рядів із кількістю місць у кожному; ми намалюємо її для вашого заходу, зазвичай протягом дня, а ви затвердите її до початку продажу.
      - q: Чи можуть бути різні ціни для партеру й балкона?
        a: Так. Категорії з власними цінами, квотами й періодами продажу; рання ціна автоматично змінюється наступною в призначену дату.
      - q: "У нас багато вистав на місяць. Чи є інші умови?"
        a: "Так. Постійним майданчикам ми пропонуємо відсоток від ціни квитка замість оплати за кожен квиток; дивіться [майданчики](/solutions/venues) і [ціни](/pricing)."
      - q: Чи може глядач обрати місце з телефона?
        a: Так, схему залу легко збільшити пальцями на екрані телефона, і вона показується мовою покупця.
  - type: cta
    id: start
    title: Попереду ваш найкращий захід. Почнімо з квитків?
    text: "Достатньо PDF, фото ескізу від руки або таблиці рядів і місць. Ми безкоштовно намалюємо схему для вашого заходу та покажемо її вам до початку продажу."
    primary: { label: Почати продаж, href: /start }
    secondary: { label: Створити захід, href: /start#create }
    tertiary: { label: Зв'язатися з командою, href: /contact#write }
