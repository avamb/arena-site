title: "Продаж квитків у театр: схеми залу, повторні дати"
description: "Квитки для театрів: нумеровані місця за схемою вашого залу, повторні дати на одній схемі, запрошення, повернення й перенесення дат. Від 100 до 1500 місць."
h1: Театр
lead: "Схема, що відповідає вашому залу: ми безкоштовно малюємо її за вашим PDF, ескізом чи таблицею рядів і використовуємо для кожної вистави. Запрошення для преси й партнерів, повернення та перенесені дати обробляються з Event Center."
related:
  - { label: "Схеми залу, що відповідають майданчику", href: /product/seating }
  - { label: "Майданчики й клуби: окремі умови", href: /solutions/venues }
  - { label: Електронні квитки й сканування, href: /product/tickets }
sections:
  - type: cards
    id: what
    eyebrow: Для театрів
    title: Що важливо для театру?
    items:
      - { title: "Схема ваша", text: "Ряди, ложі, балкон, категорії за ціною. Версії зберігають продані квитки в безпеці, коли змінюється планування.", link: { label: "Схеми залу →", href: /product/seating } }
      - { title: "Повторні дати", text: "Додавайте сеанси до тієї самої події; схема, ціни й категорії переносяться. Перенесіть або скасуйте дату з листами покупцям.", link: { label: "Event Center →", href: /#center } }
      - { title: "Запрошення", text: "Безкоштовні квитки на конкретні місця для преси, партнерів і акторів, що скануються як будь-який інший квиток.", link: { label: "Квитки →", href: /product/tickets } }
      - { title: "Ваша власна каса", text: "Продавайте на своєму сайті через віджет або на сторінці в нас; гроші йдуть на ваш рахунок, а не через маркетплейс.", link: { label: "Де ви продаєте →", href: /product/sell } }
  - type: faq
    id: questions
    eyebrow: Запитання
    title: Що першим питають театри?
    items:
      - q: Чи малюєте ви схему залу?
        a: Так, безкоштовно. Надішліть PDF схеми, фото ескізу від руки або таблицю рядів із кількістю місць у кожному; ми намалюємо її у вашій події, зазвичай протягом дня, а ви схвалюєте її до початку продажу.
      - q: Чи можуть бути різні ціни для партеру й балкона?
        a: Так. Категорії з власними цінами, квотами й вікнами; вікна early bird перемикаються за датою.
      - q: "У нас багато вистав на місяць. Чи є інші умови?"
        a: "Так. Постійним майданчикам пропонують відсоток від ціни квитка замість оплати за квиток; дивіться [майданчики](/solutions/venues) і [ціни](/pricing)."
      - q: Чи можуть покупці обирати місця на телефоні?
        a: Так, схема місць працює на телефонах зі збільшенням щипком, мовою покупця.
  - type: cta
    id: start
    title: Надішліть нам вашу схему
    text: "Достатньо PDF, фото ескізу від руки або таблиці рядів і місць. Ми безкоштовно намалюємо її у вашій події та покажемо вам до початку продажу."
    primary: { label: Почати продаж, href: /start }
    secondary: { label: Відкрити Telegram-бота, href: https://t.me/EventsCentrBot }
    note: "Або напишіть нам: ми все налаштуємо разом із вами на дзвінку."
