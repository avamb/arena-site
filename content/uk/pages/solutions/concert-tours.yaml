sections:
  - type: paycountries
    id: countries
  - type: cards
    id: what
    eyebrow: Для концертних турів
    title: Що важливо в турі?
    items:
      - { title: "Сеанси за містами", text: "Дати й майданчики в одному заході; покупці обирають місто, а ви бачите підсумки по кожному сеансу і по всьому туру.", link: { label: "Event Center →", href: /#center } }
      - { title: "Схема для кожного майданчика", text: "Надішліть PDF, таблицю або ескіз від руки, і команда безкоштовно намалює схему кожного майданчика; під час наступного приїзду вона вже готова.", link: { label: "Схеми залу →", href: /product/seating } }
      - { title: "Сторінки промоутерів", text: "Окрема сторінка для кожного місцевого промоутера з власним посиланням і промокодами; продажі збираються у вас.", link: { label: "Де ви продаєте →", href: /product/sell } }
      - { title: "Звідки приходять покупці", text: "Додайте UTM-мітки до посилань і дивіться, який допис, розсилка чи партнер продає квитки в кожному місті.", link: { label: "Де ви продаєте →", href: /product/sell } }
      - { title: "Кілька країн", text: "Продавайте в Чехії, Іспанії, Франції, Грузії чи Ізраїлі через провайдера кожної країни, на ваш власний рахунок.", link: { label: "Платежі →", href: /payments } }
      - { title: "Мови покупців", text: "Сторінки й квитки мовою покупця, листи сімома мовами, для івриту текст іде справа наліво.", link: { label: "Квитки →", href: /product/tickets } }
      - { title: "Увесь тур у Telegram", text: "Кожен продаж і кожне повернення з будь-якого міста за лічені секунди з'являються у вашій групі в Telegram разом із контактом покупця.", link: { label: "Telegram →", href: /product/telegram } }
      - { title: "Концерт переноситься? Вирішуєте ви", text: "Повернути гроші всім, запропонувати нову дату або знайти інше рішення. Глядачі отримають лист з оновленим квитком.", link: { label: "Квитки →", href: /product/tickets } }
      - { title: "Вхід у кожному місті", text: "Застосунок-сканер MACS для iOS і Android на кожному майданчику; квитки місцевих партнерів з інших систем теж приймаються.", link: { label: "Застосунок-сканер MACS →", href: /product/scanner } }
  - type: faq
    id: questions
    eyebrow: Запитання
    title: Що першим питають організатори турів?
    items:
      - q: Чи може один захід охоплювати кілька країн і валют?
        a: "Сеанси можуть бути в різних країнах; платіжний акаунт і валюта прив'язані до організації. Якщо потрібні різні валюти, команда налаштує окремий канал для кожної країни."
      - q: Чи бачать промоутери продажі одне одного?
        a: Ні. Кожен промоутер бачить лише свою сторінку; організатор бачить усе.
      - q: "В одному з міст концерт переїжджає на інший майданчик. Що буде з проданими квитками?"
        a: "Ви переносите сеанс, і покупці отримують лист з оновленим квитком; місця на новій схемі ми розподілимо разом із вами."
      - q: Скільки мені коштує квиток у турі?
        a: "Однакова сума за квиток у кожному місті; дивіться [ціни](/pricing)."
  - type: cta
    id: start
    title: Попереду ваш найкращий захід. Почнімо з квитків?
    text: Створіть захід, підключіть платіжний акаунт, поділіться посиланням.
    primary: { label: Почати продаж, href: /start }
    secondary: { label: Створити захід, href: /start#create }
    tertiary: { label: Зв'язатися з командою, href: /contact#write }
