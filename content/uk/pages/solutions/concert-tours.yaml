title: "Квитки на концертні тури: міста, сторінки промоутерів"
description: "Продавайте концертний тур в одному заході: сеанси за містами, схема залу для кожного майданчика, сторінки промоутерів із власними посиланнями й промокодами."
h1: Концертні тури
tagline: Гастролі починаються задовго до першого міста.
lead: "Одне шоу, багато міст і дат. Кожне місто має свій сеанс і схему, кожен промоутер має сторінку з власним посиланням, а весь тур ви бачите в одному Event Center."
related:
  - { label: Шоу, href: /solutions/shows }
