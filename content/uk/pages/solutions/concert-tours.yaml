title: "Продаж квитків на концертні тури: багато міст"
description: "Продавайте концертний тур в одній події: сеанси за містами, схема залу для кожного майданчика, сторінки промоутерів із власними посиланнями й промокодами."
h1: Концертні тури
lead: "Одне шоу, багато міст і дат. Кожне місто має свій сеанс і схему, кожен промоутер має сторінку з власним посиланням, а весь тур ви бачите в одному Event Center."
related:
  - { label: Шоу, href: /solutions/shows }
  - { label: Де ви продаєте, href: /product/sell }
  - { label: Платежі за країнами, href: /payments }
sections:
  - type: cards
    id: what
    eyebrow: Для концертних турів
    title: Що важливо в турі?
    items:
      - { title: "Сеанси за містами", text: "Дати й майданчики в одній події; покупці обирають місто, а ви бачите підсумки по кожному сеансу і по всьому туру.", link: { label: "Event Center →", href: /#center } }
      - { title: "Сторінки промоутерів", text: "Окрема сторінка для кожного місцевого промоутера з власним посиланням і промокодами; продажі збираються у вас.", link: { label: "Де ви продаєте →", href: /product/sell } }
      - { title: "Кілька країн", text: "Продавайте в Чехії, Іспанії, Франції, Грузії чи Ізраїлі через провайдера кожної країни, на ваш власний рахунок.", link: { label: "Платежі →", href: /payments } }
      - { title: "Мови покупців", text: "Сторінки й квитки мовою покупця, листи сімома мовами, письмо справа наліво для івриту.", link: { label: "Квитки →", href: /product/tickets } }
  - type: faq
    id: questions
    eyebrow: Запитання
    title: Що першим питають організатори турів?
    items:
      - q: Чи може одна подія охоплювати кілька країн і валют?
        a: "Сеанси можуть бути в різних країнах; платіжний акаунт і валюта залежать від організації. Для окремих валют команда налаштовує канал для кожної країни."
      - q: Чи бачать промоутери продажі одне одного?
        a: Ні. Кожен промоутер бачить лише свою сторінку; організатор бачить усе.
      - q: "Місто переїжджає на інший майданчик. Що буде з проданими квитками?"
        a: "Сеанс переноситься з листами покупцям і оновленими квитками; місця переприв'язуються разом із вами на новій схемі."
      - q: Скільки коштує мені квиток у турі?
        a: "Однакова сума за квиток у кожному місті; дивіться [ціни](/pricing)."
  - type: cta
    id: start
    title: Почніть продаж сьогодні
    text: "Створіть подію, підключіть платіжний акаунт, поділіться посиланням."
    primary: { label: Створити подію, href: /start#create }
    secondary: { label: Відкрити Telegram-бота, href: https://t.me/EventsCentrBot }
    note: "Або напишіть нам: ми все налаштуємо разом із вами на дзвінку."
