title: "Продаж квитків на WordPress: плагін із WooCommerce"
description: "Плагін ArenaSoldOut.com передає замовлення у WooCommerce, а схеми залу, квитки й сканування дає платформа. Або вбудуйте віджет на будь-яку сторінку."
h1: Ваш WordPress, ваше оформлення замовлення
lead: "Залиште свій сайт і свій магазин. Плагін створює замовлення WooCommerce для кожного квитка; схема залу, електронний квиток і сканування приходять з ArenaSoldOut.com. Або вбудуйте віджет на будь-яку сторінку двома рядками."
related:
  - { label: Де ви продаєте, href: /product/sell }
  - { label: "Для розробників: віджет і API", href: /developers }
  - { label: Платежі, href: /payments }
sections:
  - type: cards
    id: what
    eyebrow: Для сайтів на WordPress
    title: Який варіант підходить моєму сайту?
    items:
      - { title: "Плагін", text: "Замовлення потрапляють у WooCommerce, ваш магазин і звіти працюють далі; місця, квитки й вхід забезпечує ArenaSoldOut.com.", link: { label: "Запросити плагін →", href: /start } }
      - { title: "Віджет", text: "Два рядки на будь-якій сторінці чи в блоці; покупці платять на сторінці оплати вашого провайдера, замовлення зберігаються в Event Center.", link: { label: "Розробникам →", href: /developers } }
      - { title: "Перехід з ArenaSoldOut.com", text: "Сеанси, схеми залу й клієнтів імпортовано; двоє клієнтів перейшли без простою.", link: { label: "Клієнти →", href: /clients } }
  - type: faq
    id: questions
    eyebrow: Запитання
    title: Що першим питають власники сайтів на WordPress?
    items:
      - q: Чи сповільнить плагін мій сайт?
        a: Плагін звертається до API ArenaSoldOut.com під час оформлення замовлення; сторінки відображаються як раніше. Віджет є веб-компонентом, що завантажується один раз.
      - q: Чи залишає покупець мій домен?
        a: З віджетом покупець лишається на вашій сторінці до сторінки оплати провайдера, а потім повертається. З плагіном оформлення замовлення належить самому WooCommerce.
      - q: Які платіжні провайдери працюють?
        a: "Ваш власний акаунт у провайдера вашої країни; список зі статусами на [сторінці платежів](/payments). В Ізраїлі для продажів через WordPress сьогодні працює AllPay."
      - q: Хто це встановлює?
        a: Команда може встановити й налаштувати плагін разом з адміністратором вашого сайту; віджет не потребує встановлення.
  - type: cta
    id: start
    title: Почніть продавати на своєму сайті
    text: "Додайте віджет квитків на свій сайт: три рядки коду, а продажі ведуться з вашого Event Center."
    primary: { label: Почати продаж, href: /start }
    secondary: { label: Читати документацію для розробників, href: /developers }
    note: Сайти на WooCommerce зберігають свій магазин.
