title: "Продаж квитків на сайті WordPress: інтеграція"
description: "Інтеграція з WordPress: віджет квитків ArenaSoldOut.com на будь-якій сторінці чи в блоці, схема місць, квитки й сканування від платформи. Гроші надходять вам."
h1: Ваш WordPress, ваша каса
lead: Залиште свій сайт. Віджет квитків установлюється на будь-яку сторінку чи в блок WordPress трьома рядками коду; схема місць, електронний квиток і сканування працюють на ArenaSoldOut.com, а покупці платять на ваш власний рахунок.
related:
  - { label: Де ви продаєте, href: /product/sell }
  - { label: "Розробникам: віджет і API", href: /developers }
  - { label: Платежі, href: /payments }
sections:
  - type: paycountries
    id: countries
  - type: cards
    id: what
    eyebrow: Для сайтів на WordPress
    title: Що отримує ваш сайт на WordPress?
    items:
      - { title: "Інтеграція з WordPress", text: "Віджет квитків на будь-якій сторінці, у записі чи блоці вашого сайту: покупці обирають місця й платять, не залишаючи його.", link: { label: "Розробникам →", href: /developers } }
      - { title: "Три рядки коду", text: "Вставте віджет на сторінку або в блок «Довільний HTML»; покупці платять на сторінці оплати вашого провайдера, замовлення видно в Event Center.", link: { label: "Розробникам →", href: /developers } }
      - { title: "Перехід з іншої системи", text: "Сеанси, схеми залу й покупці переїжджають разом із вами; два клієнти вже перейшли зі своєї попередньої системи продажу квитків без простою.", link: { label: "Клієнти →", href: /clients } }
      - { title: "Схема залу безкоштовно", text: "Надішліть PDF, таблицю або ескіз від руки, і команда намалює схему; покупці обирають місця прямо на вашому сайті.", link: { label: "Схеми залу →", href: /product/seating } }
      - { title: "Гроші на вашому рахунку", text: "Покупці платять через провайдера вашої країни прямо на ваш власний рахунок; ArenaSoldOut.com не тримає ваших грошей.", link: { label: "Платежі →", href: /payments } }
      - { title: "Промокоди й рання ціна", text: "Коди з періодом дії та лімітом на покупця, ранні ціни до визначеної дати, безкоштовні квитки й оплата за бажанням.", link: { label: "Цінові інструменти →", href: /product/pricing-tools } }
      - { title: "Звідки приходять покупці", text: "Додайте UTM-мітки до посилань і дивіться, який допис, розсилка чи партнер приводить покупців на ваш сайт.", link: { label: "Де ви продаєте →", href: /product/sell } }
      - { title: "Продажі в Telegram", text: "Кожен продаж і кожне повернення за лічені секунди надходять у вашу групу в Telegram, з контактом покупця.", link: { label: "Telegram →", href: /product/telegram } }
      - { title: "Вхід", text: "Електронні квитки з QR-кодом і EAN-13, перевірка застосунком-сканером MACS для iOS і Android.", link: { label: "Застосунок-сканер MACS →", href: /product/scanner } }
  - type: faq
    id: questions
    eyebrow: Запитання
    title: Що першим питають власники сайтів на WordPress?
    items:
      - q: Чи не сповільнить віджет мій сайт?
        a: Ні. Віджет це вебкомпонент, який завантажується один раз; сторінки відкриваються так само швидко, як і раніше.
      - q: Чи залишає покупець мій сайт?
        a: Покупець лишається на вашій сторінці до переходу на сторінку оплати провайдера, а потім повертається.
      - q: Які платіжні провайдери підходять?
        a: "Ваш власний акаунт у провайдера вашої країни; список зі статусами на [сторінці платежів](/payments)."
      - q: Хто все налаштовує?
        a: Ви вставляєте три рядки коду, або команда налаштує віджет разом з адміністратором вашого сайту під час дзвінка.
  - type: cta
    id: start
    title: Попереду ваш найкращий захід. Почнімо з квитків?
    text: Напишіть адресу сайту й провайдера, з яким ви працюєте. Ми налаштуємо віджет разом із вами.
    primary: { label: Почати продаж, href: /start }
    secondary: { label: Створити захід, href: /start#create }
    tertiary: { label: Зв'язатися з командою, href: /contact#write }
