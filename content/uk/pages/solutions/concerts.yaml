title: "Продаж квитків на концерти: танцпол, місця, рання ціна"
description: "Продавайте квитки на концерти на своєму сайті чи на нашій сторінці: квоти на танцпол, категорії з місцями, рання ціна, промокоди партнерів. Гроші надходять вам."
h1: Продаж квитків на концерти
tagline: Концерт починається задовго до першої ноти.
lead: "Танцпол і місця в одному заході, кілька цінових категорій, рання ціна, що вмикається в потрібну дату, і вхід, де сканується кожен квиток. Покупці платять на ваш власний рахунок з першого квитка."
related:
  - { label: Промокоди й цінові вікна, href: /product/pricing-tools }
  - { label: Електронні квитки й сканування, href: /product/tickets }
  - { label: Фестивалі, href: /solutions/festivals }
sections:
  - type: paycountries
    id: countries
  - type: cards
    id: what
    eyebrow: Для концертів
    title: Що важливо для концерту?
    items:
      - { title: "Стоячі й сидячі разом", text: "Танцпол із квотою поруч із сидячими категоріями, на одній схемі й в одному оформленні замовлення.", link: { label: "Схеми залу →", href: /product/seating } }
      - { title: "Рання ціна, що вмикається сама", text: "Цінове вікно за датою й часом або крок за кількістю, що відкриває наступну ціну, коли розпродано першу.", link: { label: "Цінові інструменти →", href: /product/pricing-tools } }
      - { title: "Партнери й промоутери", text: "Сторінка для кожного промоутера з власним посиланням, промокоди для кожного партнера, усі канали в одному Event Center.", link: { label: "Де ви продаєте →", href: /product/sell } }
      - { title: "Вхід", text: "Застосунок-сканер для iOS і Android, EAN-13 і QR на кожному квитку, квитки партнерів з інших систем теж приймаються.", link: { label: "Застосунок-сканер MACS →", href: /product/scanner } }
      - { title: "Схема залу безкоштовно", text: "Надішліть PDF, таблицю або ескіз залу від руки: схему намалює наша команда, вручну вводити нічого не потрібно.", link: { label: "Схеми залу →", href: /product/seating } }
      - { title: "Категорії й VIP", text: "Кожна категорія має власну ціну, квоту й вікно продажу; нерозпродані місця розпроданої категорії можуть перейти до наступної.", link: { label: "Цінові інструменти →", href: /product/pricing-tools } }
      - { title: "Продажі в реальному часі", text: "Кожен продаж за лічені секунди надходить у вашу групу в Telegram, а UTM-мітки показують, який канал привів покупців.", link: { label: "Telegram-бот →", href: /product/telegram } }
      - { title: "Скасування чи перенесення", text: "Вирішуєте ви: повернути гроші всім або запропонувати нову дату. Покупці отримують лист з оновленим квитком.", link: { label: "Електронні квитки →", href: /product/tickets } }
      - { title: "QR-код біля входу", text: "Розмістіть біля входу QR-код із коротким посиланням на покупку: хто прийшов без квитка, купить його просто в черзі." }
  - type: faq
    id: questions
    eyebrow: Запитання
    title: Що першим питають організатори концертів?
    items:
      - q: Як швидко концерт можна пустити в продаж?
        a: "Без схеми залу: 10 хвилин після підтвердження вашої організації й підключення платіжного акаунта (назва, дата, ціни, афіша). З місцями зазвичай протягом дня, після того як ми безкоштовно намалюємо схему за вашим файлом."
      - q: Чи можу я продавати VIP-категорію з обмеженою квотою?
        a: Так. Кожна категорія має власну ціну, квоту й вікно продажу; розпродана категорія може передати нерозпродані місця наступній.
      - q: Скільки мені коштує квиток?
        a: "Фіксована сума за проданий квиток, рахунок виставляється після сеансу; дивіться [ціни](/pricing). Запрошення й повернення безкоштовні."
      - q: Чи можу я бачити продажі в реальному часі?
        a: Так. Кожен продаж потрапляє у вашу групу в Telegram за лічені секунди та в Event Center з підсумками по сеансах і експортом у CSV.
  - type: cta
    id: start
    title: Попереду ваш найкращий захід. Почнімо з квитків?
    text: Створіть захід, підключіть платіжний акаунт, поділіться посиланням.
    primary: { label: Почати продаж, href: /start }
    secondary: { label: Створити захід, href: /start#create }
    tertiary: { label: Зв'язатися з командою, href: /contact#write }
