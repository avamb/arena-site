title: "Квитки для майданчиків і клубів: одна схема, окремі умови"
description: "Для постійних майданчиків і клубів: одна схема для кожної події, багато подій на місяць, сканування на вході, відсоток від ціни квитка замість оплати."
h1: Майданчики й клуби
lead: "Ваш власний майданчик, багато подій на місяць. Схема будується один раз і використовується повторно, кожен промоутер, що орендує майданчик, продає через вашу сторінку чи свою, а умови інші: відсоток від ціни квитка замість оплати за квиток."
related:
  - { label: Ціни й докладні умови, href: /pricing }
  - { label: Схеми залу, href: /product/seating }
  - { label: Театр, href: /solutions/theatre }
sections:
  - type: cards
    id: what
    eyebrow: Для майданчиків
    title: Що важливо для майданчика?
    items:
      - { title: "Одна схема, усі події", text: "Будується один раз за вашим файлом, використовується для кожної події; версії для різних планувань сцени.", link: { label: "Схеми залу →", href: /product/seating } }
      - { title: "Промоутери, що орендують майданчик", text: "Сторінка для кожного промоутера з власним посиланням; майданчик бачить кожну подію, промоутер бачить свою.", link: { label: "Де ви продаєте →", href: /product/sell } }
      - { title: "Окремі умови", text: "Два відсотки від ціни квитка замість оплати за квиток, без оплати за запрошення й повернення, умови для великих обсягів за запитом.", link: { label: "Ціни →", href: /pricing } }
      - { title: "Вхід", text: "Застосунок-сканер для iOS і Android, ручні сканери, квитки партнерів з інших систем приймаються.", link: { label: "Застосунок-сканер MACS →", href: /product/scanner } }
  - type: faq
    id: questions
    eyebrow: Запитання
    title: Що першим питають власники майданчиків?
    items:
      - q: Які умови для постійного майданчика?
        a: "Відсоток від ціни квитка замість оплати за квиток, без оплати за запрошення й повернення. Значення вказано на [сторінці цін](/pricing); умови для великих обсягів та індивідуальні за запитом."
      - q: Чи може промоутер продавати наші події на своєму сайті?
        a: Так, через віджет на його сайті або сторінку промоутера, яку ми розміщуємо. Продажі з усіх каналів з'являються в Event Center майданчика.
      - q: Чи можна перейти з іншої системи продажу квитків?
        a: "Так. Сеанси, схеми залу й клієнтів імпортували з ArenaSoldOut.com для двох клієнтів без простою; інші системи підключаються через API пакета подій. Дивіться [розробникам](/developers)."
      - q: Хто керує Event Center?
        a: Ваша команда, з ролями. Майданчик володіє організацією; менеджери бачать те, що ви дозволите.
  - type: cta
    id: start
    title: Поговоріть із нами
    text: Розкажіть про майданчик і кількість подій на місяць. Схему ми малюємо безкоштовно й узгоджуємо умови для майданчика.
    primary: { label: Поговорити з нами, href: /start }
    secondary: { label: Переглянути ціни, href: /pricing }
    note: "Питання? Напишіть нам: команда відповідає протягом одного робочого дня."
