title: "Квитки для майданчиків і клубів: одна схема, окремі умови"
description: "Для постійних майданчиків і клубів: одна схема для кожного заходу, багато заходів на місяць, сканування на вході, відсоток від ціни квитка замість оплати."
h1: Майданчики й клуби
tagline: Майданчик оживає задовго до відкриття дверей.
lead: "Ваш власний майданчик, багато заходів на місяць. Схема малюється один раз і служить для кожного заходу, кожен промоутер, що орендує майданчик, продає квитки через вашу сторінку чи свою, а умови особливі: відсоток від ціни квитка замість оплати за кожен квиток."
related:
  - { label: Ціни й докладні умови, href: /pricing }
  - { label: Схеми залу, href: /product/seating }
  - { label: Театр, href: /solutions/theatre }
sections:
  - type: paycountries
    id: countries
  - type: cards
    id: what
    eyebrow: Для майданчиків
    title: Що важливо для майданчика?
    items:
      - { title: "Одна схема, усі заходи", text: "Надішліть PDF, таблицю або ескіз від руки, і команда безкоштовно намалює схему; вона служить для кожного заходу, а версії потрібні для різних планувань сцени.", link: { label: "Схеми залу →", href: /product/seating } }
      - { title: "Промоутери, що орендують майданчик", text: "Сторінка для кожного промоутера з власним посиланням; майданчик бачить кожен захід, промоутер бачить свою.", link: { label: "Де ви продаєте →", href: /product/sell } }
      - { title: "Окремі умови", text: "Відсоток від ціни квитка замість оплати за кожен квиток, без комісії за запрошення й повернення, умови для великих обсягів за запитом.", link: { label: "Ціни →", href: /pricing } }
      - { title: "Промокоди й рання ціна", text: "Коди для постійних гостей і партнерів із лімітом на покупця, рання ціна до призначеної дати, безкоштовні квитки й оплата за бажанням.", link: { label: "Цінові інструменти →", href: /product/pricing-tools } }
      - { title: "Вхід", text: "Застосунок-сканер MACS для iOS і Android, ручні сканери; квитки партнерів з інших систем теж приймаються.", link: { label: "Застосунок-сканер MACS →", href: /product/scanner } }
      - { title: "Квитки біля входу", text: "Поставте біля входу роздрукований QR-код із коротким посиланням на покупку: гості наводять камеру й одразу купують квиток.", link: { label: "Де ви продаєте →", href: /product/sell } }
      - { title: "Продажі в Telegram", text: "Кожен продаж і кожне повернення з будь-якого заходу за лічені секунди з'являються у вашій групі в Telegram разом із контактом покупця.", link: { label: "Telegram →", href: /product/telegram } }
      - { title: "Захід переноситься? Вирішуєте ви", text: "Повернути гроші всім, запропонувати нову дату або знайти інше рішення. Глядачі отримають лист з оновленим квитком.", link: { label: "Квитки →", href: /product/tickets } }
      - { title: "Готові до великого старту продажу", text: "800 замовлень на хвилину, коли на сторінці одночасно 1000 покупців, у навантажувальних тестах, щонічні зашифровані резервні копії.", link: { label: "Надійність →", href: /product/reliability } }
  - type: faq
    id: questions
    eyebrow: Запитання
    title: Що першим питають власники майданчиків?
    items:
      - q: Які умови для постійного майданчика?
        a: "Відсоток від ціни квитка замість оплати за кожен квиток, без комісії за запрошення й повернення. Точне значення на [сторінці цін](/pricing); умови для великих обсягів та індивідуальні умови за запитом."
      - q: Чи може промоутер продавати наші заходи на своєму сайті?
        a: Так, через віджет на його сайті або сторінку промоутера, яку ми розміщуємо. Продажі з усіх каналів видно в Event Center майданчика.
      - q: Чи можна перейти з іншої системи продажу квитків?
        a: "Так. Два клієнти вже перейшли до нас зі своєї попередньої системи продажу квитків без простою, разом із сеансами, схемами залу й покупцями; з інших систем дані переносимо через API за запитом. Дивіться розділ [для розробників](/developers)."
      - q: Хто працює в Event Center?
        a: Ваша команда, у кожного своя роль. Організація належить майданчику, а менеджери бачать те, що ви їм відкриєте.
  - type: cta
    id: start
    title: Попереду ваш найкращий захід. Почнімо з квитків?
    text: Розкажіть про майданчик і кількість заходів на місяць. Схему залу намалюємо безкоштовно, а умови для майданчика узгодимо з вами.
    primary: { label: Почати продаж, href: /start }
    secondary: { label: Створити захід, href: /start#create }
    tertiary: { label: Зв'язатися з командою, href: /contact#write }
