title: "Квитки на майстер-класи, тренінги й дегустації"
description: "Місця на майстер-класи, тренінги, дегустації й воркшопи: малі групи з квотою, повторювані дати, власні листи, безкоштовні квитки й оплата за бажанням."
h1: Майстер-класи й тренінги
lead: "Малі групи, повторювані дати, ваші власні листи вашою мовою. Сторінка в нас готова за кілька хвилин; віджет вбудовується в сайт, який у вас уже є. Vino&Co в Ізраїлі продає свої дегустації саме так."
related:
  - { label: Промокоди й цінові вікна, href: /product/pricing-tools }
  - { label: Де ви продаєте, href: /product/sell }
  - { label: Клієнти, href: /clients }
sections:
  - type: cards
    id: what
    eyebrow: Для ведучих
    title: Що важливо для воркшопу?
    items:
      - { title: "Квота на кожну дату", text: "Дванадцять місць у вівторок, двадцять у суботу; розпродані дати закриваються самі.", link: { label: "Цінові інструменти →", href: /product/pricing-tools } }
      - { title: "Повторювані дати", text: "Додавайте сеанси до тієї самої події; ціни й категорії переносяться, покупці обирають дату.", link: { label: "Event Center →", href: /#center } }
      - { title: "Безкоштовно й оплата за бажанням", text: "Реєстрація без оплати або мінімальна ціна, а решту покупець визначає сам.", link: { label: "Цінові інструменти →", href: /product/pricing-tools } }
      - { title: "Ваша мова", text: "Сторінка, віджет, лист і квиток мовою покупця, зокрема іврит справа наліво.", link: { label: "Квитки →", href: /product/tickets } }
  - type: faq
    id: questions
    eyebrow: Запитання
    title: Що першим питають ведучі?
    items:
      - q: "У мене немає сайту. Де люди купуватимуть?"
        a: "На сторінці в нас, tickets.arenasoldout.com/your-name/your-event, готовій за кілька хвилин. Діліться посиланням у месенджерах і соцмережах."
      - q: Чи можу я брати лише завдаток?
        a: Встановіть ціну квитка рівною завдатку, а решту збирайте на місці; або використайте оплату за бажанням із мінімумом.
      - q: Чи отримують покупці нагадування?
        a: Покупці отримують квиток електронною поштою та лист, коли дату перенесено чи скасовано. Нагадування перед датою сьогодні не надсилаються.
      - q: Скільки це коштує?
        a: "Фіксована сума за платний квиток; безкоштовна реєстрація нічого не коштує. Дивіться [ціни](/pricing)."
  - type: cta
    id: start
    title: Почніть продаж сьогодні
    text: "Створіть подію, підключіть платіжний акаунт, поділіться посиланням."
    primary: { label: Створити подію, href: /start#create }
    secondary: { label: Відкрити Telegram-бота, href: https://t.me/EventsCentrBot }
    note: "Питання? Напишіть нам: команда відповідає протягом одного робочого дня."
