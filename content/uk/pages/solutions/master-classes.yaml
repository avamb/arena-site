title: "Квитки на майстер-класи, тренінги й дегустації"
description: "Місця на майстер-класи, тренінги, дегустації й воркшопи: малі групи з квотою, повторювані дати, власні листи, безкоштовні квитки й оплата за бажанням."
h1: Майстер-класи й тренінги
tagline: Майстер-клас починається з першого, хто записався.
lead: "Малі групи, повторювані дати, листи учасникам їхньою мовою. Наша сторінка продажу готова за кілька хвилин, а віджет вбудовується в сайт, який у вас уже є. Так продає свої дегустації Vino&Co в Ізраїлі."
related:
  - { label: Промокоди й цінові вікна, href: /product/pricing-tools }
  - { label: Де ви продаєте, href: /product/sell }
  - { label: Клієнти, href: /clients }
sections:
  - type: paycountries
    id: countries
  - type: cards
    id: what
    eyebrow: Для ведучих
    title: Що важливо для майстер-класу?
    items:
      - { title: "Квота на кожну дату", text: "Дванадцять місць у вівторок, двадцять у суботу; коли місця закінчуються, запис на дату закривається сам.", link: { label: "Цінові інструменти →", href: /product/pricing-tools } }
      - { title: "Повторювані дати", text: "Додавайте дати до того самого заходу: ціни й категорії зберігаються, а учасник обирає зручний день.", link: { label: "Event Center →", href: /#center } }
      - { title: "Безкоштовно або оплата за бажанням", text: "Безкоштовний запис або мінімальна ціна, а скільки додати понад неї, вирішує покупець.", link: { label: "Цінові інструменти →", href: /product/pricing-tools } }
      - { title: "Промокоди й рання ціна", text: "Код для постійних учасників чи партнера з лімітом на покупця; рання ціна, що закінчується в призначений день.", link: { label: "Цінові інструменти →", href: /product/pricing-tools } }
      - { title: "Продажі в Telegram", text: "Кожен продаж і кожне повернення за лічені секунди з'являються у вашій групі в Telegram разом із контактом покупця.", link: { label: "Telegram →", href: /product/telegram } }
      - { title: "Звідки приходять учасники", text: "Додайте UTM-мітки до посилань і дивіться, який допис, розсилка чи партнер приносить записи.", link: { label: "Де ви продаєте →", href: /product/sell } }
      - { title: "Ваша мова", text: "Сторінка, віджет, лист і квиток мовою покупця, зокрема іврит із текстом справа наліво.", link: { label: "Квитки →", href: /product/tickets } }
      - { title: "Дата переноситься? Вирішуєте ви", text: "Повернути гроші всім, запропонувати нову дату або знайти інше рішення. Учасники отримають лист з оновленим квитком.", link: { label: "Квитки →", href: /product/tickets } }
      - { title: "Без підписки й додаткових платежів", text: "Ні підписки, ні щомісячних чи щорічних платежів: лише комісія за оплачений квиток, а безкоштовний запис нічого не коштує.", link: { label: "Ціни →", href: /pricing } }
  - type: faq
    id: questions
    eyebrow: Запитання
    title: Що першим питають ведучі?
    items:
      - q: "У мене немає сайту. Де люди купуватимуть?"
        a: "На нашій сторінці продажу tickets.arenasoldout.com/your-name/your-event, вона готова за кілька хвилин. Діліться посиланням у месенджерах і соцмережах."
      - q: Чи можу я брати лише передоплату?
        a: Укажіть у ціні квитка суму передоплати, а решту отримаєте на місці; або скористайтеся оплатою за бажанням із мінімальною сумою.
      - q: Чи отримують покупці нагадування?
        a: Покупець отримує квиток електронною поштою та лист, якщо дату перенесли чи скасували. Нагадування перед датою поки що не надсилаються.
      - q: Скільки це коштує?
        a: "Фіксована сума за оплачений квиток; безкоштовний запис нічого не коштує. Дивіться [ціни](/pricing)."
  - type: cta
    id: start
    title: Попереду ваш найкращий захід. Почнімо з квитків?
    text: Створіть захід, підключіть платіжний акаунт, поділіться посиланням.
    primary: { label: Почати продаж, href: /start }
    secondary: { label: Створити захід, href: /start#create }
    tertiary: { label: Зв'язатися з командою, href: /contact#write }
