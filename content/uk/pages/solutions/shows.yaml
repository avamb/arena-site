title: "Квитки на шоу: льодові шоу, цирк, танці, багато міст"
description: "Квитки на гастрольні шоу: схема кожного майданчика використовується повторно, багато дат, сторінка для промоутера, усі міста в одному Event Center."
h1: Шоу
lead: "Льодові шоу, цирк, танці й сімейні шоу ідуть багато разів на багатьох майданчиках. Одна подія, схема для кожного майданчика, сторінка для кожного промоутера й продажі всіх міст в одному місці."
related:
  - { label: Концертні тури, href: /solutions/concert-tours }
  - { label: Схеми залу, href: /product/seating }
  - { label: Клієнти, href: /clients }
sections:
  - type: cards
    id: what
    eyebrow: Для шоу
    title: Що важливо для шоу?
    items:
      - { title: "Схема для кожного майданчика", text: "Схема кожного майданчика будується один раз і використовується під час наступного візиту; версії зберігають історію.", link: { label: "Схеми залу →", href: /product/seating } }
      - { title: "Багато дат", text: "Сеанси за містами й днями в одній події; покупці обирають дату у віджеті, а ви бачите підсумки по кожному сеансу.", link: { label: "Event Center →", href: /#center } }
      - { title: "Місцеві промоутери", text: "Сторінка для кожного промоутера з власним посиланням і кодами; усі канали звітують в один Event Center.", link: { label: "Де ви продаєте →", href: /product/sell } }
      - { title: "Сімейні квитки", text: "Категорії для дітей і груп, кроки за кількістю, безкоштовні квитки для дорослих, що супроводжують.", link: { label: "Цінові інструменти →", href: /product/pricing-tools } }
  - type: faq
    id: questions
    eyebrow: Запитання
    title: Що першим питають продюсери шоу?
    items:
      - q: Чи може одна подія охопити весь тур?
        a: Так. Сеанс несе місто, майданчик і схему; підсумки та звіти CSV доступні по кожному сеансу й по всій події.
      - q: Як бути з майданчиком, де ми ще не виступали?
        a: Надішліть його схему в будь-якому читабельному вигляді, і команда збудує її в системі. Наступного разу її використають повторно.
      - q: "Наші квитки також продають місцеві партнери. Чи впорається вхід?"
        a: Так. Застосунок-сканер приймає квитки партнерів з інших систем поруч із квитками ArenaSoldOut.com.
      - q: Куди йдуть гроші?
        a: "На ваш власний платіжний акаунт, у вашій валюті, з кожним замовленням. Дивіться [платежі](/payments)."
  - type: cta
    id: start
    title: Почніть продаж сьогодні
    text: "Створіть подію, підключіть платіжний акаунт, поділіться посиланням."
    primary: { label: Створити подію, href: /start#create }
    secondary: { label: Відкрити Telegram-бота, href: https://t.me/EventsCentrBot }
    note: "Питання? Напишіть нам: команда відповідає протягом одного робочого дня."
