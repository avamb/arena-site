title: "Квитки на шоу: льодові шоу, цирк, танці, багато міст"
description: "Квитки на гастрольні шоу: схема кожного майданчика використовується повторно, багато дат, сторінка для промоутера, усі міста в одному Event Center."
h1: Шоу
tagline: Шоу починається задовго до виходу на сцену.
lead: "Льодові шоу, цирк, танці й дитячі вистави йдуть багато разів на різних майданчиках. Один захід, схема для кожного майданчика, сторінка для кожного промоутера й продажі всіх міст в одному місці."
related:
  - { label: Концертні тури, href: /solutions/concert-tours }
  - { label: Схеми залу, href: /product/seating }
  - { label: Клієнти, href: /clients }
sections:
  - type: paycountries
    id: countries
  - type: cards
    id: what
    eyebrow: Для шоу
    title: Що важливо для шоу?
    items:
      - { title: "Схема для кожного майданчика", text: "Надішліть PDF, таблицю або ескіз від руки, і команда безкоштовно намалює схему майданчика. Під час наступного приїзду вона вже готова; версії зберігають історію змін.", link: { label: "Схеми залу →", href: /product/seating } }
      - { title: "Багато дат", text: "Сеанси за містами й днями в одному заході; покупці обирають дату у віджеті, а ви бачите підсумки по кожному сеансу.", link: { label: "Event Center →", href: /#center } }
      - { title: "Місцеві промоутери", text: "Сторінка для кожного промоутера з власним посиланням і кодами; продажі з усіх каналів сходяться в одному Event Center.", link: { label: "Де ви продаєте →", href: /product/sell } }
      - { title: "Діти й групи", text: "Окремі категорії для дітей і груп, безкоштовні квитки для дорослих, що супроводжують.", link: { label: "Цінові інструменти →", href: /product/pricing-tools } }
      - { title: "Звідки приходять покупці", text: "Додайте UTM-мітки до посилань і дивіться, який допис, розсилка чи партнер приносить продажі в кожному місті.", link: { label: "Де ви продаєте →", href: /product/sell } }
      - { title: "Продажі в Telegram", text: "Кожен продаж і кожне повернення з будь-якого міста за лічені секунди з'являються у вашій групі в Telegram разом із контактом покупця.", link: { label: "Telegram →", href: /product/telegram } }
      - { title: "Вхід", text: "Застосунок-сканер MACS для iOS і Android на одному вході перевіряє і ваші квитки, і квитки партнерів з інших систем.", link: { label: "Застосунок-сканер MACS →", href: /product/scanner } }
      - { title: "Дата переноситься? Вирішуєте ви", text: "Повернути гроші всім, запропонувати нову дату або знайти інше рішення. Глядачі отримають лист з оновленим квитком.", link: { label: "Квитки →", href: /product/tickets } }
      - { title: "Гроші на вашому рахунку", text: "Покупці платять через провайдера вашої країни прямо на ваш рахунок; ArenaSoldOut.com ніколи не тримає ваших грошей.", link: { label: "Платежі →", href: /payments } }
  - type: faq
    id: questions
    eyebrow: Запитання
    title: Що першим питають продюсери шоу?
    items:
      - q: Чи може один захід охопити весь тур?
        a: Так. У кожного сеансу своє місто, майданчик і схема; підсумки та звіти CSV доступні по кожному сеансу й по всьому заходу.
      - q: Як бути з майданчиком, де ми ще не виступали?
        a: Надішліть його схему в будь-якому зрозумілому вигляді, і команда внесе її в систему. Під час наступного приїзду схема вже буде готова.
      - q: "Наші квитки також продають місцеві партнери. Чи прийме їх сканер на вході?"
        a: Так. Застосунок-сканер приймає квитки партнерів з інших систем нарівні з квитками ArenaSoldOut.com.
      - q: Куди йдуть гроші?
        a: "На ваш власний платіжний акаунт, у вашій валюті, з кожним замовленням. Дивіться [платежі](/payments)."
  - type: cta
    id: start
    title: Попереду ваш найкращий захід. Почнімо з квитків?
    text: Створіть захід, підключіть платіжний акаунт, поділіться посиланням.
    primary: { label: Почати продаж, href: /start }
    secondary: { label: Створити захід, href: /start#create }
    tertiary: { label: Зв'язатися з командою, href: /contact#write }
