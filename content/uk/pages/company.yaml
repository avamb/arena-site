sections:
  - type: prose
    id: story
    eyebrow: Компанія
    title: Що таке ArenaSoldOut.com?
    body: |
      ArenaSoldOut.com є платформою продажу квитків для організаторів: нумеровані місця й вільна розсадка в одному заході, власний платіжний акаунт організатора, сторінка продажу в нас або віджет на сайті організатора, Event Center у браузері та в Telegram. Покупці платять організатору напряму; платформа ніколи не тримає гроші.

      Компанія називається ABH TEAM OÜ і зареєстрована в Європейському Союзі. Попередні платформи засновників обслуговували шоу Cirque du Soleil, стадіони FIFA 2018, World Choir Games і 800 льодових шоу; ArenaSoldOut.com продає квитки для організаторів з 2019 року, а у 2026 році його перебудовано з нуля.

      Команда відповідає організаторам особисто англійською, іспанською, чеською, російською та івритом. Більшість запитів організаторів виходить протягом кількох тижнів; кожен, що дійшов до роботи, наведено на [сторінці змін](/changes) з датою, а [сторінка фактів](/facts) розповідає, що є, чого немає і відколи.
