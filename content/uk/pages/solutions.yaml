title: "Для кого: концерти, театр, фестивалі, майданчики"
description: "Організатори, які продають власні квитки: концерти, театр, шоу, фестивалі, концертні тури, майстер-класи й тренінги, майданчики та клуби, сайти на WordPress."
h1: Організатори, які продають власні квитки
lead: Одна платформа, різні події. Оберіть свою, щоб побачити, які можливості важливі найбільше, як виглядає перший тиждень і про що першим питають інші організатори у вашій сфері.
related:
  - { label: Як це працює, href: /#how }
  - { label: Ціни, href: /pricing }
  - { label: Клієнти, href: /clients }
sections:
  - type: cards
    id: list
    eyebrow: Для кого
    title: Який тип подій ви проводите?
    items:
      - { title: Концерти, text: "Стоячі й з місцями, кілька цінових категорій, ранній продаж, сканування на вході.", link: { label: Для концертів →, href: /solutions/concerts } }
      - { title: Театр, text: "Схеми залу, що відповідають майданчику, повторні дати, запрошення для преси та партнерів.", link: { label: Для театрів →, href: /solutions/theatre } }
      - { title: Шоу, text: "Шоу на льоду, цирк, танці: багато дат, багато міст, одна схема на майданчик використовується повторно.", link: { label: Для шоу →, href: /solutions/shows } }
      - { title: Фестивалі, text: "Кілька днів, багато категорій, категорії, що передають нерозпродані місця наступній.", link: { label: Для фестивалів →, href: /solutions/festivals } }
      - { title: Концертні тури, text: "Одне шоу, багато міст і дат, сторінка на кожного промоутера з власним посиланням.", link: { label: Для концертних турів →, href: /solutions/concert-tours } }
      - { title: Майстер-класи й тренінги, text: "Малі групи, регулярні дати, власні листи та мова ведучого.", link: { label: Для ведучих →, href: /solutions/master-classes } }
      - { title: Майданчики та клуби, text: "Ваш власний майданчик, багато подій на місяць, одна схема залу використовується повторно, окремі умови.", link: { label: Для майданчиків →, href: /solutions/venues } }
      - { title: Сайти на WordPress, text: "Плагін із замовленнями WooCommerce; магазин продовжує працювати, квитки надходять з ArenaSoldOut.com.", link: { label: Для сайтів на WordPress →, href: /solutions/wordpress } }
  - type: cta
    id: start
    title: Почніть продаж сьогодні
    text: "Створіть подію, підключіть платіжний акаунт, поділіться посиланням. Подія без схеми залу надходить у продаж за 10 хвилин; схему залу ми малюємо для вас безкоштовно."
    primary: { label: Створити подію, href: /start#create }
    secondary: { label: Відкрити Telegram-бота, href: https://t.me/EventsCentrBot }
    note: "Або напишіть нам: ми налаштуємо все разом із вами під час дзвінка."
