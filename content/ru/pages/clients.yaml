title: "Клиенты: организаторы в 31 стране с 2019 года"
description: "Организаторы, которые продают собственные билеты через ArenaSoldOut.com: театры, фестивали, концерты, мастер-классы, парки. Опыт основателей."
h1: Организаторы в 31 стране
lead: ArenaSoldOut.com продаёт билеты для организаторов с 2019 года. Платформа, на которой он работает, была перестроена в 2026 году, и организаторы перешли вместе с ней, двое из них с ArenaSoldOut.com без простоя.
sections:
  - type: marks
    id: marks
    eyebrow: Клиенты
    title: Кто продаёт через ArenaSoldOut.com?

  - type: prose
    id: track-record
    eyebrow: Опыт
    title: Кто это построил?
    body: |
      Прежние платформы основателей обслуживали шоу Cirque du Soleil, стадионы FIFA 2018, Всемирные хоровые игры и 800 ледовых шоу. Команда, которая ведёт ArenaSoldOut.com сегодня, отвечает организаторам лично, на английском, испанском, чешском, русском и иврите.

      Отзывы и фотографии организаторов переносятся с предыдущего сайта и появятся на этой странице.

  - type: cta
    id: start
    title: Начните продавать сегодня
    text: "Создайте событие, подключите платёжный аккаунт, поделитесь ссылкой. Событие без схемы зала поступает в продажу за 10 минут; схему зала мы нарисуем для вас бесплатно."
    primary: { label: Создать событие, href: /start#create }
    secondary: { label: Открыть Telegram-бот, href: https://t.me/EventsCentrBot }
