sections:
  - type: prose
    id: story
    eyebrow: Компания
    title: Что такое ArenaSoldOut.com?
    body: |
      ArenaSoldOut.com это билетная платформа для организаторов: места по схеме и свободная рассадка в одном событии, собственный платёжный аккаунт организатора, страница продаж, которую мы размещаем, или виджет на сайте организатора, Event Center в браузере и в Telegram. Покупатели платят организатору напрямую; платформа никогда не держит деньги.

      Компания называется ABH TEAM OÜ и зарегистрирована в Европейском союзе. Прежние платформы основателей обслуживали шоу Cirque du Soleil, стадионы FIFA 2018, Всемирные хоровые игры и 800 ледовых шоу; ArenaSoldOut.com продаёт билеты для организаторов с 2019 года и был полностью перестроен с нуля в 2026 году.

      Команда отвечает организаторам лично, на английском, испанском, чешском, русском и иврите. Большинство запросов организаторов выходит в течение нескольких недель; каждый, дошедший до рабочей системы, указан на [странице изменений](/changes) с датой, а [страница фактов](/facts) говорит, что есть, чего нет и с какого времени.
