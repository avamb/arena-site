title: "Разработчикам: три строки на любом сайте"
description: "Встройте виджет билетов тремя строками или используйте публичный API: пакет события одним вызовом, подписанные вебхуки, ключи доступа, плагин WordPress."
h1: Три строки на любом сайте
lead: Виджет это веб-компонент. Поставьте его на любую страницу, настройте стиль через переменные CSS, подпишитесь на его события. Всё остальное это публичный API с подписанными вебхуками.
sections:
  - type: code
    id: widget
    eyebrow: Виджет
    title: Как разместить билеты на моём сайте?
    code: |
      <script type="module" src="https://tickets.arenasoldout.com/widget/v1/arena-tickets.js"></script>
      <arena-tickets feed-token="YOUR_FEED_TOKEN" locale="en"></arena-tickets>
    items:
      - key: --arena-accent
        text: "Ваши цвета: виджет читает --arena-accent, --arena-radius, --arena-bg и --arena-border-color с вашей страницы"
      - key: locale
        text: "Язык покупателя: en, ru, cs, he, es; иврит пишется справа налево"
      - key: arena:order_paid
        text: "События виджета arena:* для вашей аналитики и ваших собственных страниц благодарности"
      - key: feed-token
        text: Один токен на один канал продаж; отзовите его в Event Center в любой момент
    cta: { label: Получить feed-токен, href: /start }

  - type: cards
    id: api
    eyebrow: Публичный API
    title: Что можно делать через API?
    items:
      - title: Пакет события одним вызовом
        text: Один запрос создаёт событие, его сеансы, площадку, цены, афишу и публикацию. Та же структура, что использует Telegram-бот.
      - title: Подписанные вебхуки
        text: Заказы, платежи, возвраты и изменения сеансов доставляются на ваш адрес с подписью, которую вы проверяете. Повторы с нарастающей паузой.
      - title: Ключи API с областями доступа
        text: Ключ видит одну организацию и только те области, которые вы выдали. Меняйте и отзывайте ключи в Event Center.
      - title: Плагин WordPress
        text: Заказы попадают в WooCommerce, магазин продолжает работать, схема мест и билет приходят от ArenaSoldOut.com. Именно с помощью плагина два клиента перешли с ArenaSoldOut.com без простоя.
      - title: Импорт
        text: Сеансы, схемы зала и клиенты импортируются из ArenaSoldOut.com. Другие системы через пакет события и CSV с клиентами.
      - title: OpenAPI
        text: Описание OpenAPI публикуется вместе с API. Запросите у команды актуальный файл, пока он не подключён здесь автоматически.

  - type: cta
    id: start
    title: Начните разработку сегодня
    text: Запросите feed-токен и ключ API с областями доступа. Команда отвечает и может открыть для вас тестовую организацию.
    primary: { label: Запросить доступ, href: /start }
    secondary: { label: Открыть Telegram-бот, href: https://t.me/EventsCentrBot }
    note: Тестовые платежи идут через тестовый режим вашего провайдера, никогда через реальные карты.
