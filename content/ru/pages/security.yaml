sections:
  - type: prose
    id: text
    body: |
      ## Где хранятся ваши данные

      - Платформа работает на серверах Hetzner в ЕС.
      - Трафик к платформе идёт через Cloudflare и шифруется по HTTPS.
      - Резервные копии базы данных делаются каждые три часа и каждую ночь и копируются в отдельное хранилище в ЕС.

      ## Платежи

      - Данные карты не попадают на наши серверы. Покупатели платят на странице платёжного провайдера.
      - Каждый организатор подключает собственный платёжный аккаунт, поэтому деньги за билеты идут организатору, а не через нас.

      ## Разделение между организаторами

      - События, заказы и клиенты каждого организатора изолированы от других организаторов. Доступ проверяется при каждом запросе.
      - У участников команды есть роли (владелец, менеджер). Менеджеры не могут менять платёжные настройки, оплату тарифа и доступ команды.
      - API-ключи ограничены одной организацией и никогда не получают права уровня всей платформы.

      ## Защита от злоупотреблений

      - Публичные формы защищены от ботов. У входа, оформления заказа и публичных API есть лимиты частоты запросов.
      - Вебхуки платёжных провайдеров проверяются по подписи.
      - Важные действия записываются в журнал аудита.

      ## Билеты

      - У каждого билета уникальный случайный штрих-код, который нельзя угадать по соседнему билету. Сканирование проверяется по нашим записям.

      ## Мониторинг и восстановление

      - Мы следим за потоком продаж, неудачными доставками и системными ошибками и получаем автоматические оповещения.
      - Если серьёзный инцидент затронет ваши данные, мы сообщим затронутым организаторам без неоправданной задержки и в соответствии с GDPR.

      ## Ваши данные и конфиденциальность

      - Мы обрабатываем данные покупателей по поручению организатора. См. нашу [Политику конфиденциальности](/legal/privacy).
      - Вы можете в любой момент запросить экспорт или удаление своих данных.

      ## Сообщить об уязвимости

      Нашли проблему с безопасностью? Напишите на support@arenasoldout.com и опишите её. Мы отвечаем на каждое сообщение.
