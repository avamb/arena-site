title: "Платежи: собственный платёжный аккаунт в вашей стране"
description: "Покупатели платят на собственный платёжный аккаунт организатора. Страны, где компания может подключить платёжного провайдера, со способами оплаты и валютами."
h1: Покупатели платят на ваш собственный платёжный аккаунт
lead: Вы подключаете аккаунт, который у вас уже есть, или открываете его у провайдера вашей страны. Каждый заказ идёт прямо на него. ArenaSoldOut.com никогда не держит средства и никогда не касается ваших выплат.
sections:
  - type: coverage
    id: countries
    eyebrow: Страны
    title: В каких странах я могу продавать билеты?
    lead: В каждой стране, где вашу компанию принимает один из провайдеров ниже. Организаторы продают с ArenaSoldOut.com в {countries} странах с {since} года. Если ваше юридическое лицо зарегистрировано в одной из этих стран, вы подключаете аккаунт провайдера и продаёте.
    labels:
      countries: Страны
      note: Провайдеры со временем добавляют страны; вашу мы подтверждаем до начала работы.
      missing: "Вашей страны нет в списке?"
    cta: { label: Напишите нам, href: /contact }

  - type: providers
    id: providers
    eyebrow: Провайдеры
    title: Какие платёжные провайдеры работают с ArenaSoldOut.com?
    lead: Это список того, что работает в продакшене сегодня. Провайдер добавляется, когда его адаптер уже в коде, и никогда раньше.
    labels:
      currencies: Валюты
      methods: Способы оплаты
      checkout: В виджете
      statuses:
        live: Работает
        api: Через API
        planned: В подготовке
        checkout_yes: "да, страница оплаты у провайдера"
        checkout_no: "пока нет"
      methods_map:
        card: карты
        apple_pay: Apple Pay
        google_pay: Google Pay
        bit: Bit
        installments: рассрочка
        bank_transfer: банковский перевод

  - type: cards
    id: connect
    eyebrow: Как подключить
    title: Как подключить платёжный аккаунт?
    lead: Три вещи, обычно в течение дня.
    items:
      - title: Ключи в вашем собственном аккаунте
        text: Вы создаёте ключи API в кабинете провайдера и вставляете их в Event Center или отправляете команде. Аккаунт остаётся вашим; ArenaSoldOut.com лишь инициирует платежи на него.
      - title: Деньги на ваш аккаунт
        text: Каждый заказ оплачивается прямо на ваш аккаунт. Выплаты в ваш банк идут по графику вашего провайдера. Возвраты решаете вы, и они возвращаются покупателю через вашего провайдера, с любым провайдером.
      - title: Автоматическая работа с чарджбэками
        text: "Когда покупатель оспаривает платёж, ArenaSoldOut.com собирает доказательства за вас: данные платежа, согласие покупателя, доставку писем с билетами и каждое скачивание билета."
      - title: ArenaSoldOut.com ничего не держит
        text: Комиссия платформы выставляется счётом после мероприятия или списывается с ваших кредитов, отдельно. Из ваших продаж ничего не вычитается. Если вы когда-нибудь уйдёте, ваш платёжный аккаунт и данные ваших покупателей останутся у вас.

  - type: cta
    id: start
    title: Начните продавать сегодня
    text: "Создайте мероприятие, подключите платёжный аккаунт, поделитесь ссылкой. Мероприятие без схемы зала поступает в продажу за 10 минут; схему зала мы нарисуем для вас бесплатно."
    primary: { label: Создать мероприятие, href: /start#create }
    secondary: { label: Открыть Telegram-бота, href: https://t.me/EventsCentrBot }
    note: "Или напишите нам: мы настроим всё вместе с вами на созвоне."
