title: "Альтернатива TicketSource: фиксированная плата за билет"
description: "Сравнение ArenaSoldOut.com и TicketSource: фиксированная плата за билет вместо процента от каждого бронирования, схемы зала рисуем бесплатно."
h1: Альтернатива TicketSource с фиксированной платой вместо процента
lead: "TicketSource берёт процент от каждого платного бронирования. ArenaSoldOut.com берёт фиксированную плату за билет, сколько бы он ни стоил, а деньги идут на ваш собственный платёжный аккаунт с каждым заказом. Ниже оба прайс-листа рядом, как они опубликованы на 11 ноября 2026 года."
related:
  - { label: Все сравнения, href: /alternatives, text: "ArenaSoldOut.com рядом с другими платформами продажи билетов." }
  - { label: Цены, href: /pricing, text: "Оплата по факту или кредиты, калькулятор и все пакеты кредитов." }
  - { label: Схемы зала, href: /product/seating, text: "Мы бесплатно рисуем вашу площадку по PDF или эскизу." }
sections:
  - type: compare
    id: prices
    eyebrow: Цена за билет
    title: Сколько стоит билет на каждой платформе?
    lead: "Цены обеих платформ на 11 ноября 2026 года. У TicketSource два варианта: собственная обработка карт, с платой за карты внутри, или ваш собственный аккаунт Stripe по сниженной ставке. Цены различаются в Великобритании и ЕС. В ArenaSoldOut.com вы всегда используете свой платёжный аккаунт, поэтому честное сравнение со вторым вариантом."
    cols: { what: "", us: ArenaSoldOut.com, them: TicketSource }
    rows:
      - { what: "Как считается плата", us: "Фиксированная плата за билет", them: "Процент от каждого платного бронирования" }
      - { what: "Великобритания, свой аккаунт Stripe", us: "**{usdPrice}** за билет, около £0,47", them: "4,5% + НДС" }
      - { what: "Великобритания, билет за £20, свой аккаунт Stripe", us: "**{usdPrice}**, около £0,47", them: "£1,08 (£0,90 + НДС)" }
      - { what: "Великобритания, билет за £50, свой аккаунт Stripe", us: "**{usdPrice}**, около £0,47", them: "£2,70 (£2,25 + НДС)" }
      - { what: "Великобритания, их собственная обработка карт", us: "Не предлагается: вы всегда используете свой аккаунт", them: "7% + НДС, не менее £0,25 + НДС, плата за карты включена" }
      - { what: "ЕС, свой аккаунт Stripe", us: "**{eurPrice}** за билет", them: "4,5%" }
      - { what: "ЕС, билет за €20, свой аккаунт Stripe", us: "**{eurPrice}**", them: "€0,90" }
      - { what: "ЕС, билет за €50, свой аккаунт Stripe", us: "**{eurPrice}**", them: "€2,25" }
      - { what: "ЕС, их собственная обработка карт", us: "Не предлагается: вы всегда используете свой аккаунт", them: "8,5%, не менее €0,30, плата за карты включена" }
      - { what: "Когда вы получаете деньги", us: "С каждым заказом, на ваш аккаунт", them: "Со своим Stripe: с каждым заказом. С их обработкой: в понедельник после мероприятия" }
      - { what: "Кто строит схему зала", us: "Наша команда, бесплатно, по вашему PDF или эскизу", them: "Вы сами, в дизайнере схем зала" }
      - { what: "Кредиты с предоплатой", us: "От **{usdFrom}** за билет, не сгорают", them: "Нет в их прайс-листе" }
      - { what: "Подписка", us: Нет, them: Нет }
    note: "Цены TicketSource: [Великобритания](https://www.ticketsource.com/pricing) и [ЕС](https://www.ticketsource.com/es/pricing), проверены 11 ноября 2026 года. Наши цены: [цены](/pricing) и [подробные условия](/pricing/terms). Организаторы в странах ЕС платят нашу комиссию в евро, во всех остальных странах в долларах США; суммы в фунтах пересчитаны по референсному курсу ЕЦБ на 11 ноября 2026 года (US$1 = £0,7515). TicketSource это товарный знак его владельца; ArenaSoldOut.com с ним не связан."

  - type: prose
    id: examples
    title: Что это значит для одного мероприятия?
    body: |
      Все суммы по ценам обеих платформ на 11 ноября 2026 года. Наша комиссия в долларах США; суммы в фунтах по референсному курсу ЕЦБ того же дня, US$1 = £0,7515.

      **400 билетов по £25, на обеих свой аккаунт Stripe.** ArenaSoldOut.com: 400 × US$0,62 = **US$248, около £186**. TicketSource: 400 × (4,5% от £25 + НДС) = £540.

      **250 билетов с местами по £40.** ArenaSoldOut.com: 250 × US$1,18 = **US$295, около £222**, а схему зала мы рисуем бесплатно. TicketSource: 250 × (4,5% от £40 + НДС) = £540.

      **300 билетов по €30 в ЕС, на обеих свой аккаунт Stripe.** ArenaSoldOut.com: 300 × €0,55 = **€165**. TicketSource: 300 × 4,5% от €30 = €405.

      **Чем дороже билет, тем больше разрыв.** Наша комиссия одинакова на билете за £15 и за £150. Процент растёт вместе с ценой.

      Посчитайте своё мероприятие в [калькуляторе на странице цен](/pricing#packages).

  - type: cards
    id: more
    eyebrow: Кроме цены
    title: Что ещё вы получаете с ArenaSoldOut.com?
    items:
      - title: Схемы зала рисуем для вас бесплатно
        text: "Пришлите PDF, фото эскиза от руки или таблицу рядов и мест. Команда соберёт площадку; сами вы её не рисуете."
        link: { label: Схемы зала, href: /product/seating }
      - title: Деньги сразу на ваш аккаунт
        text: "Покупатели платят на ваш собственный аккаунт Stripe, Flitt или AllPay с каждым заказом. ArenaSoldOut.com никогда не держит средства и ничего не вычитает из ваших продаж."
        link: { label: Платежи, href: /payments }
      - title: Сниженный тариф для дешёвых билетов
        text: "Когда каждый билет мероприятия стоит {usdLowMax} или меньше: {lowPercent}% от цены билета вместо фиксированной платы. Дискотеки, забеги, детские праздники, экскурсии."
        link: { label: Как это работает, href: /pricing#low-price }
      - title: Покупатели на своём языке
        text: "Страница покупателя, письма и билеты на языке покупателя, в том числе иврит справа налево. Любой новый язык добавляем в течение 40 часов."
        link: { label: Электронные билеты, href: /product/tickets }
      - title: Каждая продажа в вашем Telegram
        text: "Создайте мероприятие по фото афиши в Telegram-боте и видите каждую продажу и возврат в своей группе за секунды."
        link: { label: Telegram-бот, href: /product/telegram }
      - title: Настройте сами или передайте нам
        text: "События, цены и категории вы создаёте сами в Event Center или в Telegram-боте, за минуты; схемы зала мы рисуем бесплатно. Нет времени? Наш ивент-менеджер сделает это за вас, как платная услуга."
        link: { label: Дополнительные услуги, href: /pricing#services }

  - type: faq
    id: questions
    title: Вопросы, которые организаторы задают при сравнении
    items:
      - q: ArenaSoldOut.com дешевле, чем TicketSource?
        a: "Со своим аккаунтом Stripe на обеих платформах да, на любом билете дороже примерно £9 в Великобритании и примерно €12 в ЕС: {usdPrice} за билет вместо 4,5% плюс НДС в Великобритании, {eurPrice} вместо 4,5% в ЕС. На билете за £20 это около £0,47 против £1,08; на билете за €20 {eurPrice} против €0,90."
      - q: Входит ли плата за карты в вашу комиссию?
        a: "Нет. Плату за карты берёт ваш платёжный провайдер по вашей ставке, а наша комиссия отдельная. Собственная обработка TicketSource (7% + НДС в Великобритании, 8,5% в ЕС) включает плату за карты; их вариант с 4,5% и вашим аккаунтом Stripe, как и у нас, не включает."
      - q: Куда идут деньги покупателя?
        a: "На ваш собственный платёжный аккаунт с каждым заказом: Stripe, Flitt или AllPay. ArenaSoldOut.com никогда не держит средства. Наша комиссия выставляется счётом после мероприятия или списывается с ваших кредитов."
      - q: Могу ли я перенести мероприятия из TicketSource?
        a: "Да. Вы создаёте мероприятия в Event Center или в Telegram-боте, мы бесплатно рисуем ваши схемы зала, а вы продолжаете продавать в TicketSource, пока ваша страница у нас не будет готова. Нет времени настраивать самому? Наш [ивент-менеджер](/pricing#services) сделает это за вас, как платная услуга."
      - q: А что с благотворительными организациями?
        a: "Зарегистрированные благотворительные организации получают скидку 50% на нашу комиссию. Напишите нам, и мы включим её для вашей организации."
      - q: Нужно ли платить за подписку?
        a: "Нет. Вы платите только за проданные билеты. С пригласительных и бесплатных билетов на платные мероприятия комиссия не взимается."

  - type: cta
    id: start
    title: Попробуйте на следующем мероприятии
    text: Создайте мероприятие, подключите платёжный аккаунт, поделитесь ссылкой.
    primary: { label: Начать продавать, href: /start }
    secondary: { label: Смотреть цены, href: /pricing }
    note: "Есть вопросы? Пришлите, сколько вы платите в TicketSource, и мы сравним это с вашими расходами здесь."
