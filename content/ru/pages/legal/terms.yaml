      ## 1. Введение

      На этой странице изложены юридические условия («Условия»), на которых ABH TEAM OÜ, работающая под брендом ArenaSoldOut.com («мы», «нас»), предоставляет вам нашу платформу для продажи билетов на события и сопутствующих товаров и услуг («Сервис»). Сервис включает Event Center на app.arenasoldout.com, размещаемые нами страницы продаж и виджет билетов на tickets.arenasoldout.com, публичный API, плагин WordPress, Telegram-бота и приложение-сканер для входа.

      Пожалуйста, внимательно прочитайте эти Условия и убедитесь, что вы их понимаете, прежде чем подавать заявку на учётную запись или пускать событие в продажу через Сервис.

      ## 2. Наш договор с вами

      Вы соглашаетесь с этими Условиями и заключаете обязывающий договор с ABH TEAM OÜ, когда подаёте заявку на учётную запись через форму на этом сайте или через Telegram-бота, когда наша команда создаёт для вас учётную запись по вашей просьбе или когда вы или член вашей команды впервые входите в Event Center или пускаете событие в продажу. Если вы не согласны с какой-либо частью этих Условий, не используйте Сервис и не получайте к нему доступ.

      Мы можем время от времени изменять эти Условия. Актуальная версия всегда опубликована на ArenaSoldOut.com/legal/terms с датой последнего изменения. Платформа записывает версию, действовавшую на момент вашего принятия, и каждую последующую версию. Продолжение использования Сервиса после изменения означает, что вы принимаете изменённые Условия.

      ## 3. Характер сервиса

      Наш Сервис даёт вам учётную запись на нашей онлайн-платформе для продажи билетов на события и управления ими, схемами зала и сопутствующими физическими или цифровыми товарами и услугами. Учётная запись может быть у вас только если вы организатор события или уполномоченный продавец билетов с прямого письменного разрешения организатора события на каждое событие, на которое вы продаёте билеты. Если вы используете Сервис от имени организации, вы соглашаетесь с этими Условиями от имени этой организации и заверяете, что имеете на это полномочия.

      Мы предоставляем Сервис вам и не состоим в договорных отношениях с вашими клиентами («Покупатели билетов»). Когда вы продаёте билеты или другие товары и услуги Покупателям билетов через Сервис, договор заключается между вами и Покупателем билетов. Вы отвечаете за собственные условия продажи для ваших Покупателей билетов, включая возвраты. Мы доставляем билеты и служебные письма Покупателям билетов от вашего имени, а наша страница помощи покупателям билетов направляет их к вам со всеми вопросами о вашем событии, ваших билетах и возвратах.

      Вы соглашаетесь:

      - самостоятельно вести всю коммуникацию с вашими Покупателями билетов и не направлять их к нам за поддержкой;
      - отвечать на любой запрос, полученный от Покупателей билетов, в течение 5 дней;
      - принять на себя всю ответственность, вытекающую из договорных отношений между вами и Покупателем билетов;
      - немедленно уведомлять ваших Покупателей билетов и обновлять страницу вашего события, если событие отменено, отложено или существенно изменено по сравнению со сведениями, указанными, когда событие впервые поступило в продажу. Сервис помогает вам в этом: он отправляет Покупателям билетов письма, когда вы переносите или отменяете сеанс.

      Мы оставляем за собой право приостановить или прекратить ваш доступ к Сервису, если вы не выполняете эти требования в отношении ваших Покупателей билетов.

      При использовании Сервиса вы обязаны:

      - соблюдать применимые законы и обязательства, связанные с вашими событиями, товарами или услугами, а также с получением выручки от билетов, сборов или пожертвований;
      - предоставлять нам информацию и материалы, которые мы можем разумно запросить для предоставления Сервиса, и обеспечивать их точность во всех существенных отношениях;
      - поддерживать эту информацию и эти материалы и оперативно обновлять их, чтобы они оставались верными, точными и полными;
      - сотрудничать с нами по всем вопросам, связанным с Сервисом.

      Доступ к Сервису может быть приостановлен временно и без уведомления в случае сбоя системы, технического обслуживания или ремонта либо по причинам, не зависящим от нас. Ваш доступ также может быть приостановлен, а ваша учётная запись аннулирована по нашему усмотрению, в том числе если мы подозреваем, что вы используете Сервис в мошеннических или преступных целях, если нам рекомендуют это сделать правоохранительные органы или если вы не оплатили наши счета (см. разделы 6 и 11; как правило, мы уведомляем вас о неоплате до приостановки или аннулирования). Мы не несём ответственности за любые убытки или ущерб, которые могут возникнуть из-за неправомерного использования нашего Сервиса.

      ## 4. Ваша учётная запись

      Учётные записи создаются нашей командой после вашей заявки или через Telegram-бота. Когда учётная запись создана, вы можете настроить свои события, схемы зала и билеты и, при наличии платёжного аккаунта у Платёжного провайдера (раздел 5), продавать билеты на свои события. Вы также можете настроить продажу сопутствующих физических или цифровых товаров. Вы можете добавлять членов своей команды в учётную запись; вы отвечаете за их действия в Сервисе.

      Чтобы иметь учётную запись, вам должно быть 18 лет.

      Для вашего удобства мы держим вашу учётную запись открытой в течение 120 месяцев после последнего входа на случай, если вы решите снова воспользоваться нашим Сервисом. Перед закрытием вашей учётной записи и удалением Вашего контента мы постараемся отправить предупредительные письма на адрес электронной почты учётной записи, чтобы у вас была возможность оставить учётную запись открытой или выгрузить данные, которые вы хотите сохранить.

      Вы можете закрыть учётную запись в любое время, написав на hello@arenasoldout.com с адреса электронной почты владельца учётной записи.

      Мы не возвращаем уже оплаченные за Сервис суммы.

      ### Безопасность учётной записи

      Вы отвечаете за сохранение конфиденциальности вашей учётной записи и несёте полную ответственность за всю активность, происходящую при доступе к вашей учётной записи с вашими учётными данными. Не передавайте данные для входа, ключи API, секреты вебхуков или доступ к приложению-сканеру никому за пределами вашей команды. Вы соглашаетесь немедленно уведомлять нас по адресу hello@arenasoldout.com о любом несанкционированном использовании вашей учётной записи, ключей API или приложений либо о любом другом нарушении безопасности. Мы не несём ответственности за любые убытки или ущерб, возникшие из-за вашего несоблюдения этого положения.

      Передача информации через интернет не является полностью безопасной. Мы не можем гарантировать безопасность данных, передаваемых на нашу платформу, и любая передача осуществляется на ваш риск. После получения вашей информации мы применяем строгие процедуры и средства защиты, чтобы предотвратить несанкционированный доступ.

      ## 5. Платёжные провайдеры

      Покупатели билетов платят за ваши билеты на ваш собственный аккаунт у платёжного провайдера, поддерживаемого Сервисом («Платёжный провайдер»). Актуальные провайдеры, страны и валюты перечислены на странице платежей. Мы никогда не получаем и не держим деньги, уплаченные Покупателями билетов; они идут от Покупателя билетов вашему Платёжному провайдеру и оттуда на ваш банковский счёт. Эквайринг по картам вы оплачиваете вашему Платёжному провайдеру на его условиях, отдельно от наших комиссий.

      Использование Платёжного провайдера требует от вас открыть у него аккаунт на основании собственных условий и политики конфиденциальности Платёжного провайдера. У вас прямые отношения с Платёжным провайдером, и вы должны прочитать и принять его условия до приёма платежей от Покупателей билетов через Сервис. Возвраты и обратные списания (chargeback) урегулируются между вами, вашим Платёжным провайдером и Покупателем билетов; Сервис позволяет вам оформлять возвраты, а деньги возвращаются с вашего платёжного аккаунта.

      При выполнении некоторых функций Платёжный провайдер выступает обработчиком данных для вас и для нас; в остальных отношениях он выступает контролёром в соответствии со своей политикой конфиденциальности. Используя наш Сервис, вы признаёте и соглашаетесь, что мы передаём вашему Платёжному провайдеру персональную информацию и информацию о транзакциях, совершённых через Сервис.

      Если мы получим от Платёжного провайдера уведомление о том, что ваше использование нашего Сервиса нарушает его условия или любое соглашение между вами и им, вами и нами либо вами и Покупателем билетов, либо выглядит мошенническим, нарушающим нормы о противодействии отмыванию денег или частью иной вредоносной деятельности, мы можем предпринять действия, включая, помимо прочего, меры, необходимые для устранения нарушения, лишение вас возможности использовать Сервис, приостановку или прекращение вашей учётной записи. Платёжный провайдер может отказать в своих услугах кому угодно, по любой причине и в любое время.

      Мы не несём ответственности за услугу, оказываемую вам Платёжным провайдером, включая действия и бездействие Платёжного провайдера, и настоящим отказываемся от любой ответственности (включая, помимо прочего, любые убытки, расходы, сборы и штрафы любого рода), возникающей из неё.

      ## 6. Наши комиссии

      Комиссии за использование нашего Сервиса указаны на странице цен и в подробных условиях цен и взимаются за каждый проданный билет. Облагаемым использованием является продажа платного билета или сопутствующего товара либо услуги. Бесплатные пригласительные и билеты, по которым сделан возврат, не облагаются. Владельцам постоянных площадок предлагается процент от цены билета вместо платы за каждый билет, как описано в подробных условиях цен. Мы также можем предлагать дополнительные услуги, которые оплачиваются так, как указано на нашей платформе или как согласовано с вами.

      Мы выставляем счёт на нашу комиссию на следующий день после каждого сеанса за билеты, проданные на этот сеанс; для событий, которые продаются несколько месяцев, мы можем по договорённости выставлять счёт ежемесячно. Сроки оплаты указаны в счёте.

      Уже выставленные комиссии не возвращаются, в том числе при отмене события.

      ## 7. Контент организатора события и стандарты допустимого контента

      Между вами и нами вам принадлежат все права на весь контент, который вы загружаете на платформу, включая тексты, изображения, афиши, схемы зала, информацию о ваших событиях и сопутствующих товарах и услугах, отзывы и комментарии («Ваш контент»), и вы отвечаете за его законность, надёжность, целостность, точность и качество. Загружая Ваш контент, вы предоставляете нам безусловную, неисключительную, передаваемую, безвозмездную, действующую во всём мире лицензию на использование Вашего контента любым способом, необходимым для предоставления Сервиса.

      Когда Сервис считывает информацию с афиши или другого файла, который вы отправляете, например, чтобы создать событие в Telegram-боте, вы подтверждаете каждое поле до публикации и остаётесь ответственным за его точность.

      При отправке Вашего контента на нашу платформу вы должны соблюдать следующие стандарты допустимого контента:

      - Ваш контент должен быть точным и соответствовать применимому законодательству каждой страны, из которой он размещается.
      - Вы не должны использовать нашу платформу для сбора у Покупателей билетов или посетителей события контента, который вам не нужен: например, данных карт (их собирает только Платёжный провайдер), номеров государственных документов или социального страхования, паролей либо любых других избыточных или ненужных персональных данных, в частности данных особых категорий (расовое или этническое происхождение, политические взгляды, религиозные или аналогичные убеждения, членство в профсоюзе, физическое или психическое здоровье, половая жизнь, сексуальная ориентация, биометрические или генетические данные). Это не мешает вам собирать данные особых категорий в объёме, необходимом для вашего события, например, чтобы разместить на местах людей с инвалидностью.

      Ваш контент не должен:

      - быть незаконным, вредным, угрожающим, клеветническим, непристойным, обманным, мошенническим, нарушающим права, оскорбительным, морально отталкивающим либо оскорбительным в расовом или этническом отношении;
      - способствовать незаконной деятельности;
      - содержать изображения откровенно сексуального характера;
      - пропагандировать насилие;
      - быть дискриминационным по признаку расы, пола, религии, национальности, инвалидности, сексуальной ориентации или возраста;
      - нарушать авторские права, права на базы данных, товарные знаки или иные права интеллектуальной собственности любого другого лица;
      - скрывать личность или быть способным ввести кого-либо в заблуждение.

      Мы можем удалить Ваш контент с нашей платформы и из Сервиса, если, по нашему единоличному мнению, он нарушает эти стандарты. Мы оставляем за собой право приостановить или прекратить ваш доступ к Сервису, если вы существенно нарушите их, требовать от вас возмещения любых расходов, понесённых нами в результате вашего нарушения, и раскрывать информацию правоохранительным органам, как этого требует закон или как мы сочтём разумно необходимым.

      ## 8. Отказ от гарантий

      Хотя мы стремимся обеспечивать доступность Сервиса круглосуточно, мы не гарантируем его доступность и не несём ответственности, если по какой-либо причине Сервис недоступен в любое время или в течение любого периода.

      Доступ к Сервису может быть приостановлен временно и без уведомления в случае сбоя системы, технического обслуживания или ремонта либо по причинам, не зависящим от нас.

      Мы не гарантируем точность и полноту материалов на платформе. Мы можем изменять материалы на платформе или функциональность Сервиса в любое время без уведомления. Текущие возможности Сервиса с датами опубликованы на странице фактов.

      Мы предоставляем Сервис с разумной заботой и квалификацией. Сервис предоставляется «как есть», и, за исключением гарантий, содержащихся в настоящих Условиях, в максимальной степени, разрешённой законом, мы исключаем все заверения, гарантии, условия и иные положения (включая, помимо прочего, условия удовлетворительного качества и пригодности для определённой цели).

      ## 9. Ответственность

      Мы не являемся стороной какой-либо сделки, иных отношений или спора между вами и Покупателями билетов либо между вами и посетителями события. Мы не проверяем Покупателей билетов заранее и не отвечаем за мошеннические операции Покупателей билетов. Мы исключаем любую ответственность, возникающую из действий, которые мы можем предпринять в ответ на нарушения наших стандартов допустимого контента и настоящих Условий. Вы соглашаетесь возместить нам и нашим должностным лицам, директорам и партнёрам любые расходы, требования или претензии, включая разумные юридические издержки:

      - в связи с любым спором с одним или несколькими вашими Покупателями билетов либо с вашими отношениями с Покупателями билетов и посетителями события;
      - предъявленные любой третьей стороной вследствие Вашего контента или вашего использования Сервиса либо возникшие из них. Вы единолично отвечаете за свои действия при использовании Сервиса.

      Наша общая ответственность перед вами за все прочие убытки, возникающие в связи с предоставлением Сервиса, будь то по договору, в порядке деликта (включая небрежность), из нарушения установленной законом обязанности или иным образом, ограничена суммой 50,00 USD.

      Ничто в настоящих Условиях не стремится ограничить или исключить законные права потребителей.

      ## 10. Право и юрисдикция

      Настоящие Условия регулируются законами Эстонской Республики и применимым правом Европейского союза и толкуются в соответствии с ними.

