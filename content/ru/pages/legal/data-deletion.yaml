  # Shown only when Meta sends the person here after our data-deletion callback (?code=<confirmation code>).
  - type: deletion-status
    id: request
    title: "Ваш запрос на удаление данных получен"
    code_label: "Код подтверждения:"
    text: "Подключение Meta (Facebook) и связанные с ним данные (токен доступа, идентификаторы пикселя и рекламного аккаунта, рекламная статистика) удалены из Arena Sold Out. Если у вас есть вопрос по этому запросу, напишите на support@arenasoldout.com и укажите код подтверждения."
  - type: prose
    id: text
    body: |
      ## 1. Кто мы

      Билетной платформой ArenaSoldOut.com и приложением Meta «Arena Sold Out» управляет ABH TEAM OÜ, зарегистрированная в Коммерческом регистре Эстонии под регистрационным номером 14162982, Narva mnt 5a, 10117 Таллин, Эстония.

      ## 2. Организаторам, подключившим рекламный аккаунт Meta (Facebook)

      Организатор может подключить свой рекламный аккаунт Meta к Arena Sold Out: чтобы передавать продажи билетов в Meta как конверсии и видеть расходы на рекламу рядом с продажами. Для этого мы храним токен доступа, ID пикселя и рекламного аккаунта и полученную статистику рекламы.

      **Отключите доступ сами.** После любого из этих шагов Arena Sold Out больше не может ничего читать или отправлять через ваш аккаунт:

      - в Facebook: Настройки и конфиденциальность → Настройки → Интеграции для бизнеса, найдите «Arena Sold Out» и нажмите «Удалить»;
      - в Meta Business Suite: Настройки → Настройки компании → Интеграции (или Аккаунты → Приложения), найдите «Arena Sold Out» и удалите его.

      **Попросите нас удалить сохранённые данные.** Напишите на support@arenasoldout.com с адреса вашей учётной записи в Event Center, укажите «Удалить данные Meta» и название вашей организации. Мы удалим токен доступа, ID пикселя и рекламного аккаунта и статистику рекламы и подтвердим это письмом. Мы отвечаем в течение одного месяца. Данные, которые мы обязаны хранить по закону, хранятся только в течение этого срока (раздел 3 политики конфиденциальности).

      Данные, которые Meta уже получила через ваш аккаунт, хранит Meta по своей политике конфиденциальности.

      ## 3. Покупателям билетов

      Ваши права в отношении персональных данных (доступ, исправление, удаление и другие) описаны в [разделе 5 политики конфиденциальности](/ru/legal/privacy). Данные о ваших билетах мы обрабатываем по поручению организатора события, который является их контролёром: направьте запрос организатору, его контакт есть на странице продаж и в письме с билетом. Можно написать и нам на support@arenasoldout.com, мы передадим запрос организатору.

      ## 4. Подробнее

      Что мы обрабатываем, зачем и как долго: [политика конфиденциальности](/ru/legal/privacy).
