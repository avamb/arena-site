    body: |
      Настоящая Политика конфиденциальности объясняет, как ABH TEAM OÜ, которая управляет билетной платформой ArenaSoldOut.com («мы», «ArenaSoldOut.com»), обращается с персональными данными, которые мы собираем и получаем через сайт ArenaSoldOut.com, Event Center на app.arenasoldout.com, размещаемые нами страницы продаж и виджет билетов на tickets.arenasoldout.com, публичный API, Telegram-бота и приложение-сканер (вместе «сервисы»).

      Она применяется к трём группам людей: посетителям сайта; организаторам, которые пользуются сервисами, и членам их команд («организаторы»); и людям, которые покупают билеты у организаторов через сервисы («покупатели билетов»).

      Используя сайт или сервисы, вы соглашаетесь с настоящей Политикой конфиденциальности и с нашими Условиями использования. Если вы не согласны, пожалуйста, не пользуйтесь сайтом и сервисами.

      ## 1. Какие данные мы собираем и обрабатываем

      1.1 В этом разделе мы указываем: (a) категории персональных данных, которые мы можем обрабатывать; (b) цели, для которых мы их обрабатываем; и (c) правовые основания обработки.

      1.2 Мы обрабатываем данные учётной записи организаторов («данные учётной записи»): название организации и её страну, имена, адреса электронной почты и номера телефонов владельца учётной записи и членов команды, учётные записи Telegram членов команды, использующих Telegram-бота, записи о входах, ключи API и настройки. Источник данных учётной записи это вы. Они обрабатываются для работы сервисов, их предоставления вам, обеспечения безопасности, хранения резервных копий и общения с вами по поводу вашей учётной записи и событий. Правовое основание: исполнение нашего договора с вами (Условий использования) и наш законный интерес в обеспечении безопасности сервисов.

      1.3 Мы обрабатываем данные об использовании сайта и сервисов («данные об использовании»). Сайт может использовать аналитику без cookie, размещённую у нас: просмотренные страницы, сайт-источник перехода, тип и версию браузера, операционную систему, страну и выбранную тему (светлую или тёмную). Полный IP-адрес не сохраняется, cookie не устанавливаются. Сервисы ведут журналы сервера с IP-адресом, временем и запросом для безопасности и устранения неполадок. Правовое основание: наш законный интерес в понимании того, как используется сайт, и в защите сервисов.

      1.3a На сайте также есть собственная продуктовая аналитика, которая работает только если вы принимаете «Аналитику» в баннере cookie. Она записывает страницы, которые вы открываете, время на странице, глубину прокрутки, ваши нажатия на отмеченные кнопки (например, «Начать продавать» или «Контакты»), язык страницы и источник визита (сайт-источник и метки кампании в адресе). Она связывает ваши визиты со случайным кодом, который хранится в cookie. Если затем вы начинаете заявку, код отправляется вместе с ней, чтобы мы видели, какие страницы ей предшествовали. Эти данные остаются у ArenaSoldOut.com, хранятся на наших собственных серверах в Европейском союзе и не передаются рекламным или аналитическим компаниям. Правовое основание: ваше согласие, которое вы можете отозвать в любое время (раздел 7). Если вы отказываетесь, ничего из этого не собирается.

      1.3b Если вы приходите по ссылке из письма, которое мы вам отправили, ссылка содержит код вашей контактной записи. Визит по ссылке (страница, время) записывается, даже если вы отказались от аналитики, и без вашего согласия ничего больше с вами не связывается. Правовое основание: наш законный интерес в том, чтобы знать, какие из наших писем были прочитаны. Код удаляется из адреса, как только страница открывается. Вы можете возразить в любое время (раздел 5).

      1.4 Мы обрабатываем содержимое, которое организаторы публикуют через сервисы («данные публикации»): названия и описания событий, афиши, сведения о площадке и сеансах, схемы зала, цены и условия билетов. Оно обрабатывается, чтобы опубликовать событие на странице продаж, в виджете и на собственном сайте организатора, а также чтобы выпускать билеты. Правовое основание: исполнение нашего договора с организатором.

      1.5 Мы обрабатываем сведения из любого обращения, которое вы нам отправляете («данные обращения»): форма заявки на этом сайте (организация, страна, платёжный провайдер, имя, электронная почта, телефон, сообщение), сообщения Telegram-боту и в чат Telegram, а также письма. Они обрабатываются, чтобы ответить вам и настроить вашу учётную запись. Правовое основание: действия по вашему запросу до заключения договора и ваше согласие, если вы обращаетесь к нам по другому поводу. Форма заявки защищена Cloudflare Turnstile, который проверяет, что отправитель человек (см. раздел 6).

      1.6 Мы обрабатываем данные покупателей билетов и транзакций («данные транзакций»). Когда вы покупаете билет у организатора через сервисы, мы обрабатываем ваше имя, адрес электронной почты, номер телефона, если организатор его запрашивает, выбранный вами язык, места и билеты, которые вы купили, сумму и статус платежа, историю вашего заказа (возвраты, повторно отправленные и заменённые билеты) и сканирование вашего билета на входе. Мы обрабатываем эти данные по поручению организатора, который является контролёром данных, чтобы выпустить и доставить ваш электронный билет, пропустить вас на входе, обработать возвраты, о которых решает организатор, и уведомить вас, если сеанс переносится или отменяется. Организатор видит ваш заказ в Event Center и, если организатор это включил, в собственной группе организатора в Telegram. Сам платёж обрабатывает платёжный провайдер, которого подключил организатор; актуальный список находится на странице платежей. Мы никогда не получаем данные вашей карты или банковского счёта и никогда не держим деньги. Вопросы о вашем билете, возврате или событии адресуйте организатору; страница помощи покупателям билетов объясняет, где найти ваш билет.

      1.7 Мы обрабатываем данные, которые вы даёте нам для получения наших писем («данные уведомлений»). Служебные письма и сообщения в Telegram о вашей учётной записи, счетах и событиях являются частью договора. Рассылки отправляются только с вашего согласия, которое вы можете отозвать по ссылке в каждой рассылке.

      1.8 Мы можем обрабатывать любые ваши персональные данные, указанные в настоящей политике, когда это необходимо для установления, осуществления или защиты правовых требований, в судебном, административном или внесудебном порядке. Правовое основание: наш законный интерес в защите и отстаивании наших юридических прав, ваших юридических прав и юридических прав других лиц.

      1.9 Мы также можем обрабатывать любые ваши персональные данные, когда обработка необходима для защиты ваших жизненно важных интересов или жизненно важных интересов другого физического лица.

      1.10 Мы обрабатываем данные подключения организаторов к Meta (Facebook) («данные Meta»). Если организатор подключает свой бизнес-аккаунт Meta к сервисам через наше приложение «Arena Sold Out», мы обрабатываем: токен доступа, который Meta выдаёт для этого подключения; ID бизнес-портфолио организатора в Meta и выбранных им рекламных аккаунтов, пикселей и страниц; выданные организатором разрешения; статистику рекламы выбранных рекламных аккаунтов (расходы, показы, клики, покупки и их сумма, по дням и по кампаниям, группам объявлений и объявлениям). Они обрабатываются, чтобы передавать продажи билетов организатора в Meta как конверсии и показывать организатору расходы на рекламу рядом с продажами в Event Center. Токен доступа хранится в зашифрованном виде, никому не показывается и не пишется в журналы. Правовое основание — исполнение нашего договора с организатором. Организатор может удалить подключение в любой момент; как это сделать и как удалить данные Meta, объясняет [инструкция по удалению данных](/ru/legal/data-deletion).

      1.11 Если организатор включил передачу конверсий в Meta, мы от имени этого организатора отправляем в Meta событие о каждой завершённой покупке на его страницах продаж и в его виджете: номер заказа, время, сумму и валюту, адрес страницы и технические данные браузера покупателя (IP-адрес, тип браузера и, если есть, идентификаторы Meta _fbp, _fbc или fbclid). E-mail и телефон покупателя добавляются, только если покупатель согласился на отслеживание, и только в хэшированном виде (SHA-256), по которому Meta сопоставляет покупку со своими пользователями. Контролёр этих данных — организатор, он использует их, чтобы измерять и улучшать свою рекламу; мы обрабатываем их по его поручению. Meta получает их по своим условиям с организатором и по своей политике конфиденциальности. Данные браузера, которые мы храним для этой цели, удаляются после отправки события.

      ## 2. Как мы передаём информацию

      2.1 Персональные данные в сервисах хранятся на серверах, расположенных в Европейском союзе, которыми управляют наши хостинг-провайдеры на основании соглашений об обработке данных, с ночным зашифрованным резервным копированием. Cloudflare, Inc. обслуживает этот сайт, защищает сервисы и предоставляет проверку Turnstile в наших формах.

      2.2 Для работы сервисов ваши персональные данные передаются, каждому только в объёме, необходимом для его задачи: организатору, у которого вы купили билет (покупатели билетов); платёжному провайдеру, подключённому организатором; провайдерам доставки электронной почты, которые отправляют билеты и служебные письма; Telegram, через который доставляются Telegram-бот, чат Telegram и уведомления в группы организаторов, на основании собственной политики конфиденциальности Telegram; нашим провайдерам хостинга, аналитики, автоматизации и поддержки клиентов. Следуя нашим инструкциям, эти стороны могут получать доступ к персональным данным, обрабатывать и хранить их при выполнении своих обязанностей перед нами.

      2.2a Если организатор подключил свой аккаунт Meta (раздел 1.10), данные, описанные в разделах 1.10 и 1.11, передаются также Meta Platforms Ireland Limited («Meta»), каждый раз по поручению этого организатора.

      2.3 Если мы участвуем в слиянии, поглощении, юридической проверке при привлечении финансирования, реорганизации, банкротстве, конкурсном управлении, продаже всех или части наших активов или передаче сервиса другому провайдеру, ваши персональные данные и другая информация могут быть переданы правопреемнику или аффилированному лицу в рамках такой сделки.

      2.4 Мы раскрываем персональные данные, если этого требует закон или применимые нормативные акты, либо при добросовестном убеждении, что такое действие необходимо, чтобы: (a) выполнить юридическую обязанность; (b) защитить свои права или имущество; (c) в неотложных обстоятельствах защитить личную безопасность пользователей сервисов или общества; или (d) защитить нас от юридической ответственности, в судебном, административном или внесудебном порядке.

      2.5 С вашего согласия мы можем передавать данные третьим лицам за пределами настоящей Политики конфиденциальности.

      2.6 Организаторы изменяют или исправляют свои данные в Event Center или написав на support@arenasoldout.com. Покупатели билетов пишут организатору своего события или нам по тому же адресу; если контролёром является организатор, мы пересылаем запрос организатору.

      ## 3. Как долго мы храним данные

      3.1 Мы храним вашу информацию только: (a) столько, сколько необходимо для целей, для которых она была собрана и обработана; (b) если применимое законодательство предусматривает более длительный срок хранения; и (c) в течение срока хранения, требуемого законом. После этого ваши персональные данные удаляются, блокируются или обезличиваются, как предусмотрено применимым законодательством.

      3.2 Мы храним персональные данные следующим образом:

      (a) данные учётной записи: пока учётная запись открыта и до 120 месяцев после последнего входа, как указано в Условиях использования; перед удалением учётной записи мы предупреждаем вас по электронной почте;

      (b) данные об использовании: аналитика без cookie в агрегированном виде; журналы сервера в течение ограниченного срока, необходимого для безопасности и устранения неполадок; события продуктовой аналитики 13 месяцев, а профиль, построенный из них (посещённые страницы, первый источник, этап заявки), пока существует ваша контактная запись или учётная запись, после чего он удаляется; cookie посетителя действует 13 месяцев, а запись о вашем выборе cookie 6 месяцев;

      (c) данные публикации: пока событие опубликовано и учётная запись организатора открыта;

      (d) данные обращения: заявки, которые не привели к созданию учётной записи, удаляются через 180 дней после последнего контакта; остальные обращения до закрытия вопроса;

      (e) данные транзакций: пока открыта учётная запись организатора и они нужны организатору для возвратов, споров и отчётов, а после этого в течение срока, требуемого законодательством о бухгалтерском учёте и налогах (в Эстонии семь лет для первичных бухгалтерских документов);

      (f) данные уведомлений: пока вы не отзовёте согласие; мы сохраняем запись о том, что вы отписались, чтобы больше не писать вам.

      (g) данные Meta: пока подключение действует; когда организатор удаляет подключение или просит удалить данные, мы удаляем токен доступа, ID и статистику рекламы в течение одного месяца; данные браузера для конверсий (раздел 1.11): до отправки события в Meta.

      ## 4. Безопасность

      4.1 Мы обязуемся защищать конфиденциальность посетителей сайта, организаторов и покупателей билетов. Мы принимаем разумные административные и технические меры для защиты персональных данных от потери, неправомерного использования и несанкционированного доступа, раскрытия, изменения или уничтожения: зашифрованные соединения, ночные зашифрованные резервные копии, доступ к данным покупателей билетов только для команды организатора и наших сотрудников, которым это нужно, и мониторинг сервисов.

      4.2 Однако ни один способ передачи данных через интернет не является абсолютно безопасным. Хотя мы стремимся защитить ваши данные, мы не можем гарантировать их абсолютную безопасность.

      ## 5. Права по законодательству ЕС

      5.1 В этом разделе описаны ваши права по законодательству ЕС (для этих целей в ЕС входят страны Европейской экономической зоны Исландия, Лихтенштейн и Норвегия).

      «Законные интересы» означают наши интересы в ведении нашего бизнеса и в управлении сервисами и их предоставлении. Настоящая Политика конфиденциальности описывает, когда мы обрабатываем ваши персональные данные в наших законных интересах, каковы эти интересы и каковы ваши права. Мы не используем ваши персональные данные для действий, в которых воздействие на вас перевешивает наши интересы, если только у нас нет вашего согласия или эти действия иным образом не требуются или не разрешены законом.

      5.2 У вас есть следующие права в отношении ваших персональных данных:

      (a) Право доступа: если мы обрабатываем ваши персональные данные, вы можете запросить их копию.

      (b) Право на исправление: если ваши персональные данные неточны или неполны, вы можете попросить нас исправить или дополнить их. Если мы передавали их другим лицам, мы сообщим им об исправлении, когда это возможно.

      (c) Право на удаление: вы можете попросить нас удалить ваши персональные данные в некоторых случаях, например, когда они нам больше не нужны или вы отзываете согласие. Если мы передавали их другим лицам, мы сообщим им о необходимости удаления, когда это возможно.

      (d) Право на ограничение обработки: вы можете попросить нас ограничить или заблокировать обработку ваших персональных данных в определённых случаях, например, когда вы оспариваете их точность или возражаете против обработки. Если мы передавали их другим лицам, мы сообщим им об ограничении, когда это возможно.

      (e) Право на возражение: вы можете в любое время попросить нас прекратить обработку ваших персональных данных, и мы это делаем, когда опираемся на законный интерес, если только не докажем убедительные законные основания, и всегда, когда обрабатываем их для прямого маркетинга.

      (f) Право на переносимость данных: вы можете получить персональные данные, которые передали нам с вашего согласия или по договору с вами, в структурированном, широко используемом формате.

      (g) Право отозвать согласие: если мы опираемся на ваше согласие, вы можете отозвать его в любое время; это не влияет на обработку, которая уже состоялась.

      (h) Право подать жалобу: если у вас есть опасения по поводу нашей практики конфиденциальности, вы можете пожаловаться в орган по защите данных вашей страны. Наш надзорный орган это Инспекция по защите данных Эстонии (Andmekaitse Inspektsioon, www.aki.ee).

      5.3 Чтобы воспользоваться этими правами, напишите на support@arenasoldout.com. Мы отвечаем в течение одного месяца. Покупатели билетов также могут обратиться к организатору своего события, который является контролёром их данных.

      ## 6. Cookie и аналогичные технологии

      6.1 «Cookie» это небольшой фрагмент информации, который сайт сохраняет в вашем браузере. Браузеры также предоставляют локальное хранилище, которое работает похоже, но не отправляется на сервер с каждым запросом.

      6.2 На сайте показывается баннер cookie с двумя категориями: «Необходимые», всегда включены, и «Аналитика», выключена, пока вы её не примете. Пока вы не сделали выбор, он не устанавливает ни одного cookie. Когда вы выбираете, он сохраняет ваш ответ в cookie aso_consent (6 месяцев); это cookie строго необходимо, потому что именно так мы запоминаем ваш ответ. Только если вы принимаете аналитику, он также устанавливает cookie aso_aid, случайный код посетителя (13 месяцев, собственный, не продлевается последующими визитами). Ни одно из этих cookie не передаётся третьим лицам. Ваш выбор темы (светлой или тёмной) хранится в локальном хранилище вашего браузера и нам никогда не отправляется. Аналитика без cookie, описанная в разделе 1.3, не устанавливает cookie. Форма заявки использует Cloudflare Turnstile, чтобы отличать людей от автоматических отправок; проверка работает с challenges.cloudflare.com и может использовать собственные cookie или хранилище в соответствии с политикой конфиденциальности Cloudflare.

      6.3 Event Center, размещаемые нами страницы продаж и виджет билетов используют строго необходимые cookie и локальное хранилище: чтобы организаторы оставались в системе, чтобы удерживать ваши места, пока вы оформляете заказ, чтобы запоминать ваш язык и чтобы защищать учётные записи и заказы от мошенничества. Мы не используем рекламные cookie и cookie сторонней аналитики.

      6.4 Организатор может установить пиксель Meta на свой собственный сайт. Этот пиксель и его cookie (например, _fbp и _fbc) принадлежат организатору и Meta, и организатор отвечает за то, чтобы спросить на них согласие своих посетителей. Если значения этих cookie доступны при покупке билета, мы передаём их в Meta вместе с покупкой (раздел 1.11).

      ## 7. Как управлять cookie

      7.1 Вы можете блокировать или удалять cookie и локальное хранилище в настройках браузера; как это сделать, объясняет справка вашего браузера. Блокировка строго необходимых cookie не позволит войти в Event Center и оформить заказ на билеты.

      7.2 Вы можете изменить или отозвать свой выбор в отношении аналитики в любое время по ссылке «Настройки cookie» в нижней части каждой страницы. Отзыв удаляет cookie aso_aid и немедленно прекращает дальнейший сбор. Чтобы удалить события, уже собранные под вашим кодом, напишите на support@arenasoldout.com.

      ## 8. Изменения и делимость положений

      8.1 Мы можем время от времени обновлять настоящую Политику конфиденциальности, публикуя на этой странице новую версию с датой изменения. Время от времени проверяйте эту страницу, чтобы убедиться, что вас устраивают изменения.

      8.2 Если какое-либо положение настоящей политики будет признано судом или другим компетентным органом незаконным или не подлежащим исполнению, остальные положения продолжают действовать.

      8.3 Если какое-либо незаконное или не подлежащее исполнению положение стало бы законным или подлежащим исполнению при исключении его части, эта часть считается исключённой, а остальная часть положения продолжает действовать.

