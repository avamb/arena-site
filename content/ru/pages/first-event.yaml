title: "Первое мероприятие: от заявки до сканера"
description: "Шаг за шагом: подайте заявку, получите подтверждение, подключите платёжный аккаунт, создайте мероприятие, пришлите план зала, продавайте, сканируйте билеты."
h1: Ваше первое мероприятие с ArenaSoldOut.com
lead: "Восемь шагов от заявки до сканера на входе. Если аккаунт у платёжного провайдера уже открыт, мероприятие без схемы зала поступает в продажу через 10 минут после подтверждения вашей организации."
related:
  - { label: Платёжные провайдеры по странам, href: /payments, text: "Какого провайдера может подключить ваша компания, со способами оплаты и валютами." }
  - { label: Схемы зала, href: /product/seating, text: "Что прислать нам, чтобы мы бесплатно нарисовали вашу площадку." }
  - { label: Приложение-сканер MACS, href: /product/scanner, text: "Сканирование билетов на входе на iOS и Android." }
sections:
  - type: steps
    id: steps
    eyebrow: Шаг за шагом
    title: Как поставить первое мероприятие в продажу?
    items:
      - title: Отправьте заявку
        text: "Пять коротких шагов в [форме заявки](/start): контакт, организация, мероприятия, платежи, согласие. Или отправьте то же самое в [Telegram-боте](https://t.me/EventsCentrBot). Ответы сохраняются по ходу заполнения."
      - title: Мы подтверждаем вашу организацию
        text: "Команда проверяет заявку и создаёт вашу организацию и ваш кабинет Event Center, обычно в течение дня, и сообщает, как войти."
      - title: Подключите платёжный аккаунт, один раз
        text: "Создайте ключи API в кабинете вашего провайдера (Stripe, Flitt, AllPay или другого провайдера вашей страны) и вставьте их в Event Center или отправьте команде. Это делается один раз для организации; каждое следующее мероприятие использует тот же аккаунт. Аккаунта ещё нет? Сначала откройте его у [провайдера вашей страны](/payments): это занимает время самого провайдера."
      - title: Создайте мероприятие
        text: "В Event Center в браузере или в Telegram-боте по фото афиши: название, площадка, даты и сеансы, категории билетов и цены, афиша. Без схемы зала это занимает около 10 минут."
      - title: Пришлите план зала, если продаёте места
        text: "Мы бесплатно рисуем схему, обычно в течение дня, и показываем её вам до начала продаж. Достаточно любого из вариантов: PDF с планом зала, фото эскиза от руки или таблица рядов с местами в каждом ряду (Excel или Google Таблицы). SVG импортируется напрямую."
      - title: Опубликуйте и поделитесь
        text: "Откройте мероприятие для продажи. Поделитесь ссылкой на страницу продаж, которую размещаем мы, или добавьте виджет билетов на свой сайт тремя строками кода. Промокоды, цены по датам и сервисный сбор настраиваются там же."
      - title: Следите за продажами
        text: "Покупатели платят на ваш платёжный аккаунт и получают билет по e-mail на своём языке. Каждый заказ виден в Event Center, а каждая продажа и каждый возврат приходят в вашу Telegram-группу за секунды."
      - title: Сканируйте на входе
        text: "Установите приложение MACS на iPhone или Android, войдите под своим аккаунтом Event Center, выберите сеанс и сканируйте EAN-13 или QR на бумаге или на экране. Столько телефонов, сколько у вас входов."
  - type: faq
    id: questions
    eyebrow: Вопросы
    title: О чём организаторы спрашивают перед первым мероприятием?
    items:
      - q: Сколько это занимает на самом деле?
        a: "Подтверждение организации: обычно в течение дня. После этого, если платёжный аккаунт уже открыт, мероприятие без схемы зала поступает в продажу примерно за 10 минут. Мероприятие с местами ждёт схему, которую мы рисуем, обычно один день. Открытие нового аккаунта у платёжного провайдера занимает столько, сколько нужно провайдеру."
      - q: Что нужно подготовить?
        a: "Название мероприятия, площадку, даты и время, категории билетов и цены, афишу и ключи API вашего платёжного аккаунта. Для мест: план зала в любом из указанных выше видов."
      - q: Может ли команда настроить всё за меня?
        a: "Как платная услуга, да. Ивент-менеджер из нашей команды работает как часть вашей: создаёт мероприятия и сеансы, проверяет цены, категории и схему зала до начала продаж, готовит отчёты. Условия согласуются с каждым организатором: [напишите нам](/contact). Самостоятельно мероприятие настраивается примерно за 10 минут."
      - q: Сколько стоит первое мероприятие?
        a: "Столько же, сколько любое другое: комиссия за каждый проданный билет, счёт после мероприятия, или меньше с кредитами, купленными заранее. Схемы зала и пригласительные ничего не стоят. Цены на [странице цен](/pricing)."
  - type: cta
    id: start
    title: Начните с заявки
    text: "Пять коротких шагов, сохраняются по ходу заполнения. Команда подтверждает вашу организацию, обычно в течение дня."
    primary: { label: Отправить заявку, href: /start }
    secondary: { label: Открыть Telegram-бота, href: https://t.me/EventsCentrBot }
    note: "Сначала вопросы? Кнопка «Написать команде» есть на каждой странице."
