title: "Возможности: продажа билетов, схемы, платежи"
description: "Все возможности ArenaSoldOut.com на одной странице: страницы продаж и виджет, схемы зала, цены и промокоды, платежи, билеты, сканер, Event Center."
h1: Все возможности на одной странице
lead: "Что ArenaSoldOut.com делает для организатора, от первого билета до входа. Каждая группа ведёт на свою страницу с подробностями."
related:
  - { label: Цены, href: /pricing, text: "Оплата по факту за проданный билет или покупка кредитов с меньшей ценой." }
  - { label: ArenaSoldOut.com и Ticket Tailor, href: /tickettailor-alternative, text: "Цены и возможности рядом." }
  - { label: Ваше первое мероприятие, href: /first-event, text: "Что подготовить и как происходит первая продажа." }
sections:
  - type: cards
    id: selling
    eyebrow: Продажа
    title: Где и как вы продаёте
    lead: "Подробнее: [продажа на вашем сайте или на нашем](/product/sell)."
    items:
      - title: Страница продаж на нашем хостинге
        text: "tickets.arenasoldout.com/your-name/your-event, готова за минуты. Одна ссылка для соцсетей, мессенджеров и афиш."
      - title: Виджет билетов на вашем сайте
        text: "Три строки кода на любом сайте: Tilda, Wix, Webflow или собственном. Ваши цвета, ваши шрифты, ваш язык; покупатели не покидают ваш домен."
      - title: Страницы для промоутеров и партнёров
        text: "Отдельная страница для каждого промоутера и ссылки на ваших партнёров-продавцов на той же странице."
      - title: Материалы мероприятия на странице продаж
        text: "Добавьте материалы к мероприятию на своей странице продаж на платформе, если у вас нет собственного сайта: тексты, фото и видео."
      - title: Описания с оформлением
        text: "Заголовки, списки, ссылки и цитаты в описании мероприятия на странице продаж. Нейросеть оформит простой текст за один клик."
      - title: «Сообщите мне, когда откроются продажи»
        text: "Покупатели подписываются на странице мероприятия и получают письмо в момент открытия продаж."
      - title: Напоминания о брошенной корзине
        text: "Покупатель, который забронировал билеты и не оплатил, получает напоминание. Во многих случаях такие напоминания заметно повышают продажи."
      - title: Приведите друга
        text: "Каждый покупатель получает личную ссылку: друг получает скидку, покупатель получает кэшбэк после мероприятия друга."
      - title: Короткие ссылки и QR-коды для печати
        text: "Ссылки go.arenasoldout.com с QR-кодами для афиш и флаеров: PNG, SVG или вкладыш в PDF форматов A5 и A6. Назначение можно менять после печати."
      - title: Магазин рядом с билетами
        text: "Продавайте вино, напитки по предзаказу, мерч и подарочные наборы вместе с билетами: варианты, корзина, выдача на событии или своя доставка, возвраты. Магазин подключается отдельно, условия по запросу. Наш первый клиент с магазином уже продаёт этим способом."

  - type: cards
    id: seating
    eyebrow: Места
    title: Схемы зала, которые повторяют площадку
    lead: "Подробнее: [схемы зала](/product/seating)."
    items:
      - title: Рисуем схему бесплатно
        text: "Пришлите PDF, фото эскиза от руки или таблицу рядов и мест; команда соберёт площадку."
      - title: Места и танцпол на одной схеме
        text: "Ряды с местами по категориям и танцпол с квотами, у каждой категории своя цена и свой период продажи."
      - title: Версии схемы
        text: "Новая раскладка для следующего сеанса не затрагивает уже проданные билеты."
      - title: Выбор места на телефоне
        text: "Масштабирование щипком, легенда по категориям и таймер удержания выбранных мест, в виджете и на странице на нашем хостинге."
      - title: Пригласительные и места для прессы
        text: "Держите места для гостей и прессы и выпускайте пригласительные из Event Center, без комиссии."

  - type: cards
    id: prices
    eyebrow: Цены
    title: Цены, промокоды и периоды продажи
    lead: "Подробнее: [промокоды и ценовые окна](/product/pricing-tools)."
    items:
      - title: Умная цена
        text: "Готовая схема ценовых ступеней по количеству и по дате, вместо ручной настройки каждой ступени."
      - title: Дополнительные категории
        text: "Дополнение продаётся только вместе с основным билетом: детский билет нельзя продать без взрослого."
      - title: Промокоды
        text: "На одно мероприятие, сеанс или категорию, с периодом продажи, минимальным заказом и лимитом на покупателя. Партнёры получают собственные коды."
      - title: Ранние цены и ступени по количеству
        text: "Цены переключаются в заданную вами дату или открывают следующую ступень, когда текущая распродана."
      - title: Категории и цепочки
        text: "У каждой категории своя цена, квота и период продажи; непроданные места переходят в следующую категорию."
      - title: Сервисный сбор
        text: "Процент по каждому каналу продаж, который покупатель видит отдельной строкой и который поступает на ваш аккаунт."
      - title: Бесплатные билеты и билеты «заплатите, сколько захотите»
        text: "Бесплатные билеты для пригласительных и регистраций и билеты «заплатите, сколько захотите» с минимумом, который задаёте вы."

  - type: cards
    id: payments
    eyebrow: Платежи
    title: Деньги идут на ваш собственный аккаунт
    lead: "Подробнее: [платежи](/payments)."
    items:
      - title: Собственный платёжный аккаунт
        text: "Покупатели платят на ваш аккаунт Stripe, Flitt или AllPay с каждым заказом. ArenaSoldOut.com никогда не держит средства."
      - title: Возвраты через любого провайдера
        text: "Решение о возврате вы принимаете в Event Center; деньги вернутся покупателю через вашего провайдера."
      - title: Автоматическая работа с чарджбэками
        text: "Когда покупатель оспаривает платёж, мы собираем доказательства: данные платежа, согласие, доставку писем с билетами и каждое скачивание билета."

  - type: cards
    id: tickets
    eyebrow: Билеты и вход
    title: Что получает покупатель и как вы это сканируете
    lead: "Подробнее: [электронные билеты](/product/tickets) и [приложение-сканер MACS](/product/scanner)."
    items:
      - title: Электронный билет с QR и EAN-13
        text: "Билет в PDF в письме покупателя, его можно показать с телефона или распечатать."
      - title: Чек об оплате в письме с билетом
        text: "Чек прикладывается к письму с билетом и называет получателя платежа."
      - title: Статус доставки каждого письма
        text: "Отправлено, доставлено, прочитано: проверьте, что покупатель получил билет, и отправьте его повторно в один клик."
      - title: Письма на 7 языках
        text: "Страница покупателя, письма и билет на языке покупателя. Любой новый язык добавляем в течение 40 часов."
      - title: Перенос даты и отмена
        text: "Когда сеанс переносится или отменяется, покупатели получают письмо с обновлённым билетом."
      - title: Приложение-сканер для iOS и Android
        text: "MACS, наше отдельное приложение на входе: любое число телефонов, понятный ответ на каждое сканирование."

  - type: cards
    id: center
    eyebrow: Event Center
    title: Ведите мероприятие вместе с командой
    lead: "Подробнее: [Event Center](/#center) и [Telegram-бот](/product/telegram)."
    items:
      - title: Заказы и покупатели
        text: "Поиск, фильтры и отчёты CSV по сеансам. Отправить повторно, вернуть или пригласить в один клик."
      - title: Сеансы
        text: "Добавляйте даты, переносите или отменяйте сеанс, а покупатели получают письмо."
      - title: Аналитика продаж
        text: "Просмотры, корзины и оплаты по каждому мероприятию, чтобы видеть, где покупатели уходят."
      - title: Роли в команде
        text: "Роли владельца и менеджера для вашей команды, в браузере на телефоне или компьютере."
      - title: Telegram-бот
        text: "Создайте мероприятие по фото афиши и получайте каждую продажу и возврат в свою Telegram-группу за секунды."

  - type: cards
    id: reliability
    eyebrow: Надёжность
    title: Рассчитано на большие старты продаж
    lead: "Подробнее: [надёжность](/product/reliability) и [страница фактов](/facts)."
    items:
      - title: 800 заказов в минуту
        text: "При 1000 покупателей на странице одновременно, в нагрузочных тестах сентября 2026 года."
      - title: Сторожевой процесс и резервные копии
        text: "Постоянные проверки с оповещением команды, ночные зашифрованные резервные копии, Cloudflare на входе."
      - title: Защита от ботов
        text: "Удержание мест истекает по таймеру, число заказов ограничено, вредоносный трафик отсеивается."

  - type: cards
    id: services
    eyebrow: Услуги
    title: Что для вас делает наша команда
    lead: "Подробнее: [дополнительные услуги](/pricing#services)."
    items:
      - title: Рисуем схему зала, бесплатно
        text: "Пришлите PDF, набросок или таблицу рядов; мы нарисуем схему, обычно в течение дня."
      - title: Ивент-менеджер, платно
        text: "Человек из нашей команды работает как часть вашей: создаёт мероприятия, проверяет их до начала продаж, готовит отчёты. Условия согласуются с каждым организатором."
      - title: White label
        text: "Продавайте без нашего названия: €45 в месяц за бренд или площадку в ЕС, US$45 в остальных странах."

  - type: cards
    id: pricing
    eyebrow: Цены
    title: Что вы платите
    lead: "Подробнее: [цены](/pricing) и [подробные условия](/pricing/terms)."
    items:
      - title: Оплата по факту
        text: "{usdPrice} за проданный билет ({eurPrice} в ЕС), счёт после мероприятия. Без подписки, без договора."
      - title: Кредиты
        text: "Купите кредиты заранее и платите от {usdFrom} за билет ({eurFrom} в ЕС). Кредиты не сгорают."
      - title: Скидка 50% для зарегистрированных благотворительных организаций
        text: "Зарегистрированные благотворительные организации платят половину нашей комиссии."
      - title: Бесплатные пригласительные и бесплатные схемы зала
        text: "Без комиссии за пригласительные и бесплатные билеты; схему зала рисуем бесплатно."

  - type: cta
    id: start
    title: Начните продавать сегодня
    text: Создайте мероприятие, подключите платёжный аккаунт, поделитесь ссылкой.
    primary: { label: Создать мероприятие, href: /start#create }
    secondary: { label: Смотреть цены, href: /pricing }
    note: "Есть вопросы? Напишите нам: команда отвечает в течение одного рабочего дня."
