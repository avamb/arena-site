sections:
  - type: compare
    id: prices
    eyebrow: Цены в евро
    title: Как сравниваются два предложения?
    lead: "Цены обеих платформ на 11 ноября 2026 года. Наша комиссия за проданный билет рядом с комиссией Weezevent за онлайн-продажу билетов. Комиссия Weezevent включает банковские сборы; у нас плату за карты берёт ваш платёжный провайдер по вашей ставке, сверх нашей комиссии."
    cols: { what: "", us: ArenaSoldOut.com, them: Weezevent }
    rows:
      - { what: "Как считается плата", us: "Фиксированная плата за билет", them: "2,5% от цены билета, не менее €0,99" }
      - { what: "Билет за €20", us: "**{eurPrice}** + плата за карты вашего провайдера", them: "€0,99, банковские сборы включены" }
      - { what: "Билет за €50", us: "**{eurPrice}** + плата за карты вашего провайдера", them: "€1,25, банковские сборы включены" }
      - { what: "Билет за €100", us: "**{eurPrice}** + плата за карты вашего провайдера", them: "€2,50, банковские сборы включены" }
      - { what: "Когда вы получаете деньги", us: "С каждым заказом, на ваш аккаунт", them: "Раз в 15 дней, выплата от Weezevent" }
      - { what: "Кто держит деньги покупателя", us: "Вы, с первого заказа", them: "Weezevent, до выплаты" }
      - { what: "Нумерованные места", us: "**{eurSeated}** за билет с местом, схему рисуем бесплатно", them: "Только в индивидуальном предложении, цена по запросу" }
      - { what: "Кредиты с предоплатой", us: "От **{eurFrom}** за билет, не сгорают", them: "Нет в их прайс-листе" }
      - { what: "Подписка", us: Нет, them: Нет }
    note: "Цены Weezevent: [weezevent.com/fr/nos-tarifs](https://weezevent.com/fr/nos-tarifs/) и [weezevent.com/en-gb/our-prices](https://weezevent.com/en-gb/our-prices/), проверены 11 ноября 2026 года, с НДС, как опубликовано. Наши цены: [цены](/pricing) и [подробные условия](/pricing/terms), без НДС. Weezevent это товарный знак его владельца; ArenaSoldOut.com с ним не связан."

  - type: prose
    id: examples
    title: Что эта разница значит на практике?
    body: |
      Все суммы по ценам обеих платформ на 11 ноября 2026 года.

      **Деньги до мероприятия.** Фестиваль продаёт 2000 билетов за три недели до открытия ворот. В ArenaSoldOut.com каждый платёж попадает на ваш аккаунт в момент оплаты заказа, так что сцену, звук и охрану вы оплачиваете деньгами за билеты. При выплате раз в 15 дней часть этих денег приходит позже, чем они были нужны.

      **Театр с нумерованными местами.** У нас схема зала входит в каждое мероприятие: вы присылаете PDF или фото эскиза от руки, команда бесплатно собирает схему, а билет с местом стоит {eurSeated}. В Weezevent нумерованные места есть в индивидуальном предложении, цена по запросу.

      **Сама комиссия.** Наша {eurPrice} за билет, сколько бы он ни стоил; у Weezevent 2,5% с минимумом €0,99, банковские сборы включены. Прибавьте к нашей комиссии плату за карты вашего платёжного провайдера, чтобы сравнить итог для вашей цены билета.

  - type: cards
    id: more
    eyebrow: Кроме цены
    title: Что ещё вы получаете с ArenaSoldOut.com?
    items:
      - title: Деньги сразу на ваш аккаунт
        text: "Покупатели платят на ваш собственный аккаунт Stripe, Flitt или AllPay. ArenaSoldOut.com никогда не держит средства и ничего не вычитает из ваших продаж."
        link: { label: Платежи, href: /payments }
      - title: Схемы зала рисуем для вас бесплатно
        text: "Пришлите PDF, фото эскиза от руки или таблицу рядов и мест. Команда соберёт площадку; сами вы её не рисуете."
        link: { label: Схемы зала, href: /product/seating }
      - title: Сниженный тариф для дешёвых билетов
        text: "Когда каждый билет мероприятия стоит {eurLowMax} или меньше: {lowPercent}% от цены билета вместо фиксированной платы. Дискотеки, забеги, детские праздники, экскурсии."
        link: { label: Как это работает, href: /pricing#low-price }
      - title: Покупатели на своём языке
        text: "Страница покупателя, письма и билеты на языке покупателя, в том числе иврит справа налево. Любой новый язык добавляем в течение 40 часов."
        link: { label: Электронные билеты, href: /product/tickets }
      - title: Каждая продажа в вашем Telegram
        text: "Создайте мероприятие по фото афиши в Telegram-боте и видите каждую продажу и возврат в своей группе за секунды."
        link: { label: Telegram-бот, href: /product/telegram }
      - title: Настройте сами или передайте нам
        text: "События, цены и категории вы создаёте сами в Event Center или в Telegram-боте, за минуты; схемы зала мы рисуем бесплатно. Нет времени? Наш ивент-менеджер сделает это за вас, как платная услуга."
        link: { label: Дополнительные услуги, href: /pricing#services }

  - type: faq
    id: questions
    title: Вопросы, которые организаторы задают при сравнении
    items:
      - q: ArenaSoldOut.com дешевле, чем Weezevent?
        a: "Наша комиссия ниже: {eurPrice} за билет против не менее €0,99 у Weezevent. Комиссия Weezevent включает банковские сборы, а наша нет, поэтому прибавьте к нашей комиссии плату за карты вашего платёжного провайдера, чтобы сравнить итог для вашей цены билета."
      - q: Когда я получу деньги за билеты?
        a: "С каждым заказом. Покупатель платит на ваш собственный платёжный аккаунт: Stripe, Flitt или AllPay. ArenaSoldOut.com никогда не держит средства. Наша комиссия выставляется счётом после мероприятия или списывается с ваших кредитов."
      - q: Есть ли у вас безналичная оплата и браслеты RFID?
        a: "Нет. ArenaSoldOut.com продаёт билеты и проверяет их на входе в приложении-сканере MACS. Если вам нужна безналичная оплата в баре, оставьте для неё отдельного провайдера."
      - q: Могу ли я перенести мероприятия из Weezevent?
        a: "Да. Вы создаёте мероприятия в Event Center или в Telegram-боте, мы бесплатно рисуем ваши схемы зала, а вы продолжаете продавать в Weezevent, пока ваша страница у нас не будет готова. Нет времени настраивать самому? Наш [ивент-менеджер](/pricing#services) сделает это за вас, как платная услуга."
      - q: Нужно ли платить за подписку?
        a: "Нет. Вы платите только за проданные билеты. С пригласительных и бесплатных билетов на платные мероприятия комиссия не взимается."

