title: "Партнёры: площадки, промоутеры, WordPress, разработчики"
description: "Как площадки, промоутеры, агентства WordPress и разработчики работают с ArenaSoldOut.com: страницы промоутеров, плагин, виджет, публичный API."
h1: Партнёры
lead: Площадки, где проходят события, промоутеры, которые их продают, агентства, которые строят сайты организаторов, разработчики, которые делают интеграции. У каждого есть место в платформе и человек в команде, с которым можно поговорить.
related:
  - { label: Разработчикам, href: /developers }
  - { label: Площадки и клубы, href: /solutions/venues }
  - { label: Контакты, href: /contact }
sections:
  - type: cards
    id: kinds
    eyebrow: Партнёры
    title: Как партнёры работают с ArenaSoldOut.com?
    items:
      - { title: Площадки, text: "Постоянная площадка приносит свою схему один раз и предлагает её каждому организатору, который её арендует; отдельные условия с процентом от цены билета.", link: { label: Площадки и клубы →, href: /solutions/venues } }
      - { title: Промоутеры, text: "Страница для каждого промоутера со своей ссылкой и промокодами; организатор видит каждый канал, промоутер видит только свой.", link: { label: Где вы продаёте →, href: /product/sell } }
      - { title: Агентства WordPress, text: "Плагин передаёт заказы в WooCommerce; виджет подходит к любой теме. Команда поддерживает агентство во время запуска.", link: { label: WordPress →, href: /solutions/wordpress } }
      - { title: Разработчики, text: "Публичный API, пакет события одним вызовом, подписанные вебхуки, ключи с областями доступа, события виджета; импорт из ArenaSoldOut.com и других систем.", link: { label: Разработчикам →, href: /developers } }
  - type: faq
    id: questions
    eyebrow: Вопросы
    title: О чём первым делом спрашивают партнёры?
    items:
      - q: Есть ли реферальное вознаграждение или плата для реселлеров?
        a: Условия партнёрства согласуются индивидуально; напишите команде, чем вы занимаетесь и для кого.
      - q: Можно ли отсканировать на входе билет, проданный партнёром?
        a: "Да. [Приложение-сканер MACS](/product/scanner) принимает билеты партнёров из других систем наравне с билетами ArenaSoldOut.com, на iOS и Android."
      - q: Может ли агентство управлять несколькими организаторами?
        a: Да, с ролями в Event Center каждой организации и ключами API с областями доступа для каждой организации.
  - type: cta
    id: start
    title: Напишите команде
    text: Расскажите, кто вы и с кем работаете. Мы отвечаем в течение одного рабочего дня.
    primary: { label: Связаться с нами, href: /contact }
    secondary: { label: Читать документацию для разработчиков, href: /developers }
    note: "Или в Telegram: чат читают днём по времени Европы и Израиля."
