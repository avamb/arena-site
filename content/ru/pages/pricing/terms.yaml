title: "Подробные условия по ценам"
description: "Комиссия: оплата после мероприятия, кредиты, билеты до US$10, скидка 50% для благотворительных организаций, white label €45/US$45 в месяц, возвраты."
h1: Подробные условия
lead: Условия, которые стоят за ценой за билет. Стандартные условия; объёмные и индивидуальные условия по запросу. Все суммы указаны без НДС.
sections:
  - type: prose
    id: terms
    body: |
      ## За что мы берём плату

      Комиссия платформы взимается за каждый проданный билет, а не в процентах от вашей выручки, за исключением двух случаев ниже. Билет за US$15 и билет за US$150 обходятся вам одинаково. С пригласительных и бесплатных билетов на платные мероприятия комиссия не взимается.

      ## Оплата после мероприятия

      US$0,62 за билет без места и US$1,18 за билет с местом, выбранным на схеме зала (€0,55 и €1,05 для площадок в странах ЕС).

      Цены установлены в долларах США. Цены в евро это цены в долларах, пересчитанные по референсному курсу Европейского центрального банка (1 EUR = 1,1193 USD на 9 ноября 2026 года) и округлённые до цента; [страница цен](/pricing) показывает обе валюты. Две суммы не пересчитываются: порог для мероприятий с дешёвыми билетами составляет €10, а потолок для постоянных площадок составляет €1,09. Мы выставляем счёт после мероприятия за проданные билеты, а вы платите банковским переводом. Для мероприятий, которые идут в продаже несколько месяцев, и для постоянных площадок мы выставляем счёт раз в месяц. Оплата после мероприятия доступна организациям, подтверждённым на платформе. Эквайринг по картам вы платите своему платёжному провайдеру по его тарифам.

      ## Кредиты

      Вы покупаете пакет кредитов один раз, и с каждого билета комиссия списывается с ваших кредитов по тарифу этого пакета. Место добавляет US$0,35 (€0,31) к тарифу в кредитах. Кредиты это деньги на вашем аккаунте: они не сгорают, пакеты кредитов можно покупать сколько угодно раз, а тратятся они только на наши услуги. Их нельзя вывести, передать или обналичить. Если кредиты закончились посреди продаж, продажи не останавливаются: билеты, которые они не покрыли, выставляются по цене оплаты после мероприятия. Можно включить автоматическое пополнение. Пакеты кредитов и их тарифы на [странице цен](/pricing#packages).

      ## Зарегистрированные благотворительные организации

      Зарегистрированные благотворительные организации платят 50% от комиссии, указанной на этой странице, и при оплате по факту, и с кредитами. Наша команда включает скидку для вашей организации после того, как увидит регистрацию: напишите нам со [страницы контактов](/contact).

      ## Мероприятия, где каждый билет стоит US$10 или меньше

      Сниженный тариф относится ко всему мероприятию: он действует, только если самая высокая цена любого билета мероприятия до применения промокодов составляет US$10 или меньше, **US$10 включительно** (€10 в странах ЕС). Учитываются все категории и ценовые ступени, в том числе добавленные позже. Если есть билет дороже, стандартная цена действует для каждого билета мероприятия, в том числе для дешёвых: мероприятие с билетами за US$5 и за US$25 идёт по стандартной цене. Тариф составляет 4% от цены билета, не менее US$0,10 и не более US$0,35 за билет, и ещё US$0,20 за билет с местом (в странах ЕС: не менее €0,09, не более €0,31, ещё €0,18 за билет с местом).

      ## Постоянные площадки

      Площадки, которые сами проводят мероприятия, круглый год или сезонно, платят 2% от цены билета (после промокодов, без сервисного сбора), не более US$1,18 за билет (€1,09 в странах ЕС), одинаково с местом и без. Мы выставляем счёт ежемесячно. Статус площадки подключает наша команда: напишите нам со [страницы контактов](/contact).

      ## Оператор продажи билетов на странице мероприятия или white label

      Цены на этой странице предполагают, что на странице, где вы продаёте, ArenaSoldOut.com указан как оператор продажи билетов, со ссылкой на arenasoldout.com. Достаточно строки вида «Tickets: ArenaSoldOut.com» рядом с билетами; виджет билетов показывает такую строку по умолчанию, так что с виджетом ничего добавлять не нужно. Страницы продаж, которые размещаем мы, всегда содержат наше название.

      Если вы предпочитаете продавать без нашего названия, white label стоит **€45 в месяц за бренд или площадку** в странах ЕС и **US$45 в месяц за бренд или площадку** во всех остальных странах, в валюте вашей комиссии. Бренд это промоутер мероприятия или ваша организация, если у мероприятия нет промоутера: два промоутера, которые оба продают без нашего названия, это два бренда. Постоянная площадка, которая продаёт без нашего названия, платит за себя как за один бренд. Неполный месяц считается по дням. Плата идёт отдельной строкой в вашем ежемесячном счёте; кредитами она не оплачивается.

      Пока white label включён, строка в виджете, подвал вашего магазина и строка о платформе в письмах покупателям пропадают, а письма уходят от имени бренда. Остаются: страницы продаж, которые размещаем мы, ссылки на условия платформы и политику конфиденциальности при оплате и данные продавца, как этого требует закон. Наша команда включает и выключает white label для бренда с выбранной вами даты: напишите нам со [страницы контактов](/contact).

      ## Ивент-менеджер

      ArenaSoldOut.com устроен так, чтобы организаторы настраивали всё сами: мероприятия, сеансы, цены, категории, промокоды, отчёты. Наша комиссия за билет покрывает платформу и ответы на вопросы; работа, выполняемая за вас, в неё не входит. Если на эту работу нет времени, ивент-менеджер из нашей команды может выполнить её как часть вашей команды: создать мероприятия и сеансы, проверить их до начала продаж, подготовить отчёты, отправить пригласительные и повторно выслать билеты. Это отдельная платная услуга; её объём и цена согласуются с каждым организатором. Напишите нам со [страницы контактов](/contact).

      ## Возвраты, перенос даты и отмена

      Когда покупатель возвращает билет, возврат покупателю выплачиваете вы, организатор. Комиссия за уже состоявшуюся продажу остаётся. Мы не берём отдельную комиссию за обработку возврата, за перенос даты или за письма покупателям. Собственные условия платёжного провайдера действуют так, как их излагает провайдер. Если мероприятие отменено, уже начисленная комиссия деньгами не возвращается.

      ## Валюта

      Комиссия указывается в долларах США для каждой страны за пределами ЕС, включая европейские страны вне ЕС, Азию и Ближний Восток, и в евро для площадок в странах ЕС. Цены в евро это цены в долларах США по курсу ЕЦБ, указанному выше. Валюта комиссии не меняет валюту, в которой вы продаёте билеты. Если у одной организации есть площадки в обеих группах, у неё два аккаунта.

      ## Отчёты

      Event Center даёт итоги по сеансам и подробный отчёт CSV по каждому сеансу. Экспорт в вашу CRM или бухгалтерскую систему настраивается по запросу.

      ## Конфиденциальность

      ArenaSoldOut.com обрабатывает данные покупателей по поручению организатора в целях продажи и доставки билетов. [Политика конфиденциальности](/legal/privacy) описывает, что обрабатывается и как долго; [условия и положения](/legal/terms) это соглашение с организатором.
