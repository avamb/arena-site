title: "Контакты ArenaSoldOut.com: Telegram, почта, заявка"
description: "Напишите команде ArenaSoldOut.com через форму, в чат или бот Telegram или по почте. Покупателям билетов: сначала спросите организатора вашего события."
h1: Связаться с командой
lead: Организаторы связываются с командой через форму ниже, в Telegram или по почте; отвечают одни и те же люди. Покупателям билетов стоит сначала написать организатору своего события; страница помощи покупателям объясняет, где найти билет.
related:
  - { label: Начать продавать, href: /start }
  - { label: Помощь покупателям билетов, href: /help/tickets }
  - { label: Партнёры, href: /partners }
sections:
  - type: contact-form
    id: write
    eyebrow: Напишите команде
    title: Как задать вопрос команде?
    lead: "Напишите свой вопрос ниже. Команда отвечает по электронной почте, обычно в тот же рабочий день. Вопросы и ответы, без имён и адресов почты, становятся ответами на этом сайте."
  - type: cards
    id: ways
    eyebrow: Контакты
    title: Как связаться с командой?
    items:
      - { title: Чат в Telegram, text: "Самый быстрый способ. Команда читает чат днём по времени Европы и Израиля.", link: { label: Открыть чат в Telegram →, href: https://t.me/ArenaSoldOutChat } }
      - { title: Бот в Telegram, text: "Создайте событие по афише или просто поздоровайтесь; команда отвечает в том же боте.", link: { label: Открыть Telegram-бот →, href: https://t.me/EventsCentrBot } }
      - { title: Форма заявки, text: "Расскажите о своей организации и о том, где вы продаёте; мы подтвердим её, обычно в течение дня.", link: { label: Начать продавать →, href: /start } }
      - { title: Почта, text: "hello@arenasoldout.com по всем остальным вопросам, включая партнёрство и прессу.", link: { label: Написать письмо →, href: "mailto:hello@arenasoldout.com" } }
  - type: faq
    id: questions
    eyebrow: Вопросы
    title: К кому обращаться?
    items:
      - q: Я купил билет, и у меня есть вопрос
        a: "Напишите организатору события; его контакт указан на странице продаж и в письме с билетом. [Страница помощи покупателям](/help/tickets) объясняет, где билет и что делать на входе."
      - q: Я организатор и хочу начать
        a: "Воспользуйтесь [формой](/start) или Telegram-ботом. Мы один раз подтвердим вашу организацию и подключим платёжный аккаунт; события и продажи вы ведёте сами в Event Center."
      - q: Я разработчик или агентство
        a: "На [странице для разработчиков](/developers) есть виджет и API; [партнёры](/partners) объясняют, как с нами работают агентства и площадки."
  - type: cta
    id: start
    title: Начните продавать сегодня
    text: Создайте событие, подключите платёжный аккаунт, поделитесь ссылкой.
    primary: { label: Начать продавать, href: /start }
    secondary: { label: Открыть чат в Telegram, href: https://t.me/ArenaSoldOutChat }
    note: "ABH TEAM OÜ, Европейский союз."
