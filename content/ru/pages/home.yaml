  - type: faq
    id: faq
    eyebrow: Вопросы
    title: Что спрашивают организаторы
    items:
      - q: Сколько стоит начать?
        a: "Начать ничего не стоит: нет подписки и нет дополнительных платежей за месяц или за год. Вы платите комиссию за каждый проданный билет, от {usdPrice}. Пригласительные и бесплатные билеты без комиссии. [Цены и калькулятор →](/pricing)"
      - q: Есть ли дополнительные платежи, например за месяц или за год?
        a: Нет. Ни ежемесячных, ни годовых платежей, ни подписки. Вы платите только комиссию за проданный билет.
      - q: Я продаю билеты через WhatsApp, клиенты звонят мне. Зачем мне билетная платформа?
        a: "Чтобы не принимать каждый заказ вручную. Покупатель сам выбирает место и платит в любое время, даже ночью; деньги сразу приходят на ваш аккаунт, а билет с QR-кодом приходит покупателю на почту. Ссылку на продажу можно и дальше отправлять в WhatsApp: только теперь вы тратите время на само мероприятие, а не на переписку и списки."
      - q: Кто платит сервисный сбор, я или покупатель?
        a: Решаете вы. Можно добавить к цене билета свой сервисный сбор, и он целиком приходит вам вместе с оплатой. Наша комиссия за билет от этого не меняется.
      - q: Когда я получаю деньги?
        a: С каждым заказом. Покупатель платит прямо на ваш платёжный аккаунт, ArenaSoldOut.com деньги не держит. В банк они выводятся по графику вашего провайдера.
      - q: Можно ли встроить продажу билетов в свой сайт?
        a: "Да. Виджет билетов встаёт на любую страницу тремя строками кода: WordPress, Tilda, Wix, Webflow или собственный код. Покупатель выбирает места и билеты прямо на вашем сайте. [Разработчикам →](/developers)"
      - q: Как работает контроль доступа в день мероприятия?
        a: "Каждый билет это PDF с QR-кодом и штрихкодом EAN-13. На входе билеты сканирует приложение MACS для iOS и Android, достаточно обычного телефона; можно работать и с ручным сканером. Приложение принимает и билеты, проданные вашими партнёрами в других системах. [Приложение-сканер MACS →](/product/scanner)"
      - q: Можно ли продавать билеты прямо у входа?
        a: Да. Распечатайте QR-код с короткой ссылкой на покупку и повесьте его у входа. Зрители сканируют код телефоном и сразу покупают билет.
      - q: Что будет, если мероприятие отменят или перенесут?
        a: Решаете вы. Можно вернуть деньги всем покупателям, предложить новую дату вместо возврата или выбрать другой вариант. Покупатели получат письмо на своём языке с обновлённым билетом.
      - q: Видно ли, откуда пришли покупатели?
        a: Да. Добавьте UTM-метки к ссылкам на продажу, и в Event Center будет видно, какой канал принёс заказы.
      - q: Я никогда не продавал билеты. Это для меня?
        a: "Да. Мы проведём вас по шагам: [ваше первое мероприятие →](/first-event). Схему зала нарисуем бесплатно, а если удобнее, настроим всё вместе с вами на созвоне."
      - q: Как связаться с командой ArenaSoldOut.com, если у меня возник вопрос?
        a: "Напишите нам в Telegram, через [форму на сайте](/contact#write) или на hello@arenasoldout.com. Вам ответят люди из команды."

