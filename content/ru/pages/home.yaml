  - type: steps
    id: how
    eyebrow: Как это работает
    title: В продаже уже сегодня. Три вопроса, которые организаторы задают первыми.
    items:
      - title: Как быстро я смогу начать продажи?
        text: "Мероприятие без схемы зала поступает в продажу за 10 минут после подтверждения вашей организации и подключения платёжного аккаунта; подключаете его один раз. Для зала с местами пришлите нам план: мы нарисуем его бесплатно, обычно в течение дня."
      - title: Что для этого нужно?
        text: "Название и расписание мероприятия, цены билетов, афиша и собственный платёжный аккаунт: Stripe, Flitt, AllPay или другой провайдер вашей страны. Деньги идут вам с первого билета."
      - title: Как мне всё настроить?
        text: "В браузере на компьютере или телефоне, в «Event Center»*. Или в Telegram: бот читает вашу афишу и заполняет даты, цены и площадку, вам остаётся подтвердить. Или пришлите материалы нам, и мы настроим сами."
    note: "* «Event Center» это ваш кабинет организатора на ArenaSoldOut.com: все мероприятия, заказы, возвраты, пригласительные и сеансы, для вас и вашей команды, в браузере и в Telegram. [Смотрите Event Center ниже →](#center) Каждый шаг от заявки до сканера: [ваше первое мероприятие →](/first-event)"

  - type: ways
    id: where
    eyebrow: Где вы продаёте
    title: На вашем сайте, на нашей странице, у партнёров и в соцсетях. Деньги в любом случае идут вам.
    items:
      - title: Ваш сайт
        text: "Ваш сайт и есть касса. Встройте виджет билетов на любую страницу: WordPress, Tilda, Wix, Webflow или собственный код. Покупатели не покидают ваш домен."
        bullets:
          - Виджет на любом сайте, три строки кода
          - Интеграция с WordPress
          - Ваши цвета, ваши шрифты, ваш язык
      - title: Наша страница продаж
        text: "Страницу продаж размещаем мы: tickets.arenasoldout.com/your-name/your-event. Одна ссылка для афиши, рассылки и мессенджеров."
        bullets:
          - Страница на каждого организатора и на каждое мероприятие
          - Готово за минуты, дизайн не нужен
          - Ссылки на ваших партнёров-продавцов на той же странице
      - title: Сайты партнёров
        text: "Тот же виджет ставится на сайт площадки, промоутера или агентства. У каждого промоутера своя страница продаж и своя ссылка."
        bullets:
          - Виджет на сайте партнёра
          - Отдельная страница и ссылка для каждого промоутера
          - Все продажи партнёров в одном Event Center
      - title: Соцсети и мессенджеры
        text: "Ссылка на продажу в Instagram, Facebook, Telegram и WhatsApp, на афише и в рассылке. QR-код с короткой ссылкой у входа: зритель сканирует его и сразу покупает билет."
        bullets:
          - Одна ссылка для всех каналов
          - QR-код на афише и у входа
          - Источники продаж по UTM-меткам

  - type: qa
    id: answers
    eyebrow: Функции
    title: Всё, что нужно организатору, на одной платформе
    more: { label: Все функции →, href: /features }
    items:
      - title: Промокоды
        text: Код может действовать на одно мероприятие, один сеанс или одну категорию, с периодом действия, минимумом и лимитом на покупателя.
      - title: Цены, которые меняются сами
        text: Окна ранней цены переключаются по дате и времени. Ступени по количеству открывают следующую цену, когда текущая распродана.
        visual:
          type: ladder
          rungs:
            - { price: US$24, width: 100, label: первые 100 · продано }
            - { price: US$119, width: 62, label: следующие 150 · продаются }
            - { price: US$599, width: 0, label: откроется после, next: true }
      - title: Категории и бесплатные билеты
        text: Категории со своей ценой, квотой и периодом продажи, а также бесплатные билеты и билеты «заплатите, сколько захотите».
      - title: Ваш сервисный сбор
        text: "Процент по каждому каналу продаж: покупатель видит его отдельной строкой, а деньги целиком приходят на ваш аккаунт вместе с билетом. Убедитесь, что закон вашей страны разрешает сервисный сбор при продаже билетов."
      - title: Места и танцпол
        text: "Схема зала с категориями и танцпол с квотами в одном мероприятии. Пришлите нам план площадки, и мы нарисуем его в системе бесплатно, обычно в течение дня: достаточно PDF, фото эскиза от руки или таблицы рядов с местами в каждом ряду (Excel или Google Таблицы). Вручную вводить ничего не нужно."
        visual:
          type: plan
          aria: План зала с партером, двумя ложами, балконом и танцполом
          stage: Сцена
          parterre: Партер · 312
          logeLeft: Ложа Л · 48
          logeRight: Ложа П · 48
          balcony: Балкон · 180
          standing: Танцпол
      - title: Билеты и вход
        text: Каждый билет это PDF со штрихкодом EAN-13 и QR-кодом, на языке покупателя. Сканируйте на входе приложением-сканером для iOS и Android или ручным сканером. Приложение принимает и билеты, проданные вашими партнёрами в других системах.
        visual:
          type: ticket
          event: Autumn Jazz Night
          meta: пт, 24 окт · 19:30 · Palác Akropolis
          seat: Партер · Ряд G · Место 7
          code: "2173049188256"
      - title: Продажи в реальном времени
        text: "В вашем «Event Center», собственном кабинете на этом сайте: откройте его на телефоне или компьютере, устанавливать ничего не нужно. Все ваши мероприятия, каждый заказ, возвраты и итоги по сеансам, видны только вам и вашей команде. Источники покупателей видны по UTM-меткам. Предпочитаете Telegram? Каждая продажа и каждый возврат также приходят в вашу Telegram-группу за секунды, с контактом покупателя. [Смотрите Event Center ниже →](#center)"
        visual:
          type: telegram
          from: ArenaSoldOut.com
          lines:
            - "**Оплачено** · Autumn Jazz Night · пт, 24 окт"
            - Ряд G 7–8 · Партер
            - "**€76.00** · Anna K. · +420 ••• 41 18"
          time: "19:42"
      - title: Возвраты, пригласительные, перенос
        text: "Всё из вашего кабинета «Event Center»: верните билет, выпустите пригласительные, перенесите или отмените сеанс. Что делать с деньгами при отмене или переносе, решаете вы: вернуть всем или предложить новую дату. Покупатели получат письмо на своём языке с обновлённым билетом."
      - title: Надёжность
        text: 800 заказов в минуту при 1000 покупателей на странице одновременно в нагрузочных тестах, ночные зашифрованные резервные копии, сторожевой процесс, который следит за платформой круглые сутки.
      - title: QR-код у входа
        text: Распечатайте QR-код с короткой ссылкой на покупку и повесьте у входа. Зрители сканируют его и сразу покупают билет, даже если пришли без него.
      - title: API по запросу
        text: API, вебхуки и импорт мероприятий одним запросом подключаем по запросу, если продажи нужно связать с вашей системой.

  - type: center
    id: center
    eyebrow: Event Center
    title: Заказы, билеты, возвраты и пригласительные в одном месте
    lead: "«Event Center» это ваш собственный кабинет на ArenaSoldOut.com. Откройте его на телефоне или компьютере, устанавливать ничего не нужно. Каждое ваше мероприятие, каждый заказ, возвраты, пригласительные и цифры продаж: видны только вам и вашей команде. Прокрутите экраны, чтобы увидеть, что он умеет."
