  - type: money
    id: money
    eyebrow: Деньги
    title: Покупатели платят вам. Не нам.
    lead: 100% каждой продажи идёт вам. Покупатель платит цену билета и сервисный сбор, если вы его добавили, напрямую на ваш платёжный аккаунт, в вашей валюте, с вашим названием в выписке. ArenaSoldOut.com никогда не держит ваши деньги. Вы платите ArenaSoldOut.com комиссию платформы за каждый проданный билет, после мероприятия или из предоплаченного пакета. Возвраты и чарджбэки решаете вы, это не политика платформы.
