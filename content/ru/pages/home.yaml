  - type: steps
    id: how
    eyebrow: Как это работает
    title: В продаже уже сегодня. Три вопроса, которые организаторы задают первыми.
    items:
      - title: Как быстро я смогу начать продажи?
        text: "Мероприятие без схемы зала поступает в продажу за 10 минут после подтверждения вашей организации и подключения платёжного аккаунта; подключаете его один раз. Для зала с местами пришлите нам план: мы нарисуем его бесплатно, обычно в течение дня."
      - title: Что для этого нужно?
        text: "Название и расписание мероприятия, цены билетов, афиша и собственный платёжный аккаунт: Stripe, Flitt, AllPay или другой провайдер вашей страны. Деньги идут вам с первого билета."
      - title: Как мне всё настроить?
        text: "В браузере на компьютере или телефоне, в «Event Center»*. Или в Telegram: бот читает вашу афишу и заполняет даты, цены и площадку, вам остаётся подтвердить. Нет времени? Наш [ивент-менеджер](/pricing#services) сделает это за вас, как платная услуга."
    note: "* «Event Center» это ваш кабинет организатора на ArenaSoldOut.com: все мероприятия, заказы, возвраты, пригласительные и сеансы, для вас и вашей команды, в браузере и в Telegram. [Смотрите Event Center ниже →](#center) Каждый шаг от заявки до сканера: [ваше первое мероприятие →](/first-event)"

  - type: ways
    id: where
    eyebrow: Где вы продаёте
    title: На вашем сайте или на нашем. Деньги идут вам в любом случае.
    items:
      - title: У вас есть сайт
        text: "Ваш сайт и есть касса. Встройте виджет билетов на любую страницу: WordPress, Tilda, Wix, Webflow или собственный код. Покупатели не покидают ваш домен."
        bullets:
          - Виджет на любом сайте, три строки кода
          - Плагин для WordPress с заказами WooCommerce
          - Ваши цвета, ваши шрифты, ваш язык
      - title: У вас нет сайта
        text: "Страницу продаж размещаем мы: tickets.arenasoldout.com/your-name/your-event. Делитесь одной ссылкой в соцсетях, мессенджерах и на афише."
        bullets:
          - Страница на каждого организатора и на каждое мероприятие
          - Отдельная страница для каждого промоутера
          - Готово за минуты, дизайн не нужен
          - Ссылки на ваших партнёров-продавцов на той же странице

  - type: qa
    id: answers
    eyebrow: Что организаторы спрашивают дальше
    title: Да. Вот как это делается.
    items:
      - title: Можно ли использовать промокоды?
        text: Да. Код может действовать на одно мероприятие, один сеанс или одну категорию, с периодом действия, минимумом и лимитом на покупателя.
      - title: Могут ли цены меняться в заданную мной дату?
        text: Да. Окна раннего бронирования переключаются по дате и времени. Ступени по количеству открывают следующую цену, когда текущая распродана.
        visual:
          type: ladder
          rungs:
            - { price: US$24, width: 100, label: первые 100 · продано }
            - { price: US$119, width: 62, label: следующие 150 · продаются }
            - { price: US$599, width: 0, label: откроется после, next: true }
      - title: Несколько цен на одно мероприятие?
        text: Да. Категории со своей ценой, квотой и периодом продажи, а также бесплатные билеты и билеты «заплатите, сколько захотите».
      - title: Можно ли добавить сервисный сбор?
        text: Да. Процент по каждому каналу продаж, который покупатель видит отдельной строкой и который поступает на ваш аккаунт вместе с билетом. Убедитесь, что закон вашей страны разрешает сервисный сбор при продаже билетов.
      - title: С местами и без?
        text: "Да, и то и другое в одном мероприятии: схема зала с категориями, танцпол с квотами. Пришлите нам план площадки, и мы нарисуем его в системе бесплатно, обычно в течение дня: достаточно PDF, фото эскиза от руки или таблицы рядов с местами в каждом ряду (Excel или Google Таблицы). Вручную вводить ничего не нужно."
        visual:
          type: plan
          aria: План зала с партером, двумя ложами, балконом и танцполом
          stage: Сцена
          parterre: Партер · 312
          logeLeft: Ложа Л · 48
          logeRight: Ложа П · 48
          balcony: Балкон · 180
          standing: Танцпол
      - title: Работает ли сканер с этими билетами?
        text: Да. Каждый билет это PDF со штрихкодом EAN-13 и QR-кодом, на языке покупателя. Сканируйте на входе приложением-сканером для iOS и Android или ручным сканером. Приложение принимает и билеты, проданные вашими партнёрами в других системах.
        visual:
          type: ticket
          event: Autumn Jazz Night
          meta: пт, 24 окт · 19:30 · Palác Akropolis
          seat: Партер · Ряд G · Место 7
          code: "2173049188256"
      - title: Как мне увидеть свои продажи?
        text: "В вашем «Event Center», собственном кабинете на этом сайте: откройте его на телефоне или компьютере, устанавливать ничего не нужно. Все ваши мероприятия, каждый заказ, возвраты и итоги по сеансам, видны только вам и вашей команде. Предпочитаете Telegram? Каждая продажа и каждый возврат также приходят в вашу Telegram-группу за секунды, с контактом покупателя. [Смотрите Event Center ниже →](#center)"
        visual:
          type: telegram
          from: ArenaSoldOut.com
          lines:
            - "**Оплачено** · Autumn Jazz Night · пт, 24 окт"
            - Ряд G 7–8 · Партер
            - "**€76.00** · Anna K. · +420 ••• 41 18"
          time: "19:42"
      - title: Возвраты, пригласительные, перенос даты?
        text: "Да, из вашего кабинета «Event Center». Верните билет, выпустите пригласительные, перенесите или отмените сеанс: покупатели получат письмо на своём языке с обновлённым билетом."
      - title: Выдержит ли он стадион?
        text: Да. 800 заказов в минуту при 1000 покупателей на странице одновременно в нагрузочных тестах, ночные зашифрованные резервные копии, сторожевой процесс, который предупреждает нас раньше, чем вы заметите.

