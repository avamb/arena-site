      - { label: Ваш платёжный аккаунт, providers: true, highlight: true }
      - { label: Ваш банк, sub: по графику провайдера }
    note: Вы платите ArenaSoldOut.com комиссию платформы за каждый проданный билет. Из ваших продаж ничего не вычитается и ничего не удерживается.

