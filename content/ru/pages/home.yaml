  - type: reasons
    id: why
    eyebrow: Почему ArenaSoldOut.com
    title: Почему организаторы продают билеты с нами?
    lead: "Четыре причины, за каждой стоят факты."
    items:
      - icon: wallet
        title: С каждого билета вам остаётся больше
        text: "Фиксированные **{price}** за билет, а не процент от выручки: билет за $15 и билет за $150 обходятся вам одинаково. Покупатели платят на ваш платёжный аккаунт, поэтому деньги ваши в момент оплаты, а не после мероприятия."
        bullets:
          - Ничего не удерживается из ваших продаж, резерв не откладывается
          - Без комиссии за пригласительные и бесплатные билеты
          - Схему зала нарисуем бесплатно
        link: { label: Цены и калькулятор →, href: /pricing }
      - icon: clock
        title: В продаже за 10 минут
        text: "Когда ваша организация подтверждена (обычно в течение дня), мероприятие без схемы зала поступает в продажу за **10 минут**, если у вас уже есть аккаунт у платёжного провайдера. Аккаунт подключается один раз; для каждого следующего мероприятия нужны только название, даты и цены."
        link: { label: "Ваше первое мероприятие, шаг за шагом →", href: /first-event }
      - icon: list-checks
        title: Всё, что просят организаторы, уже есть
        text: "Никаких модулей для покупки, никаких плагинов для установки:"
        bullets:
          - Виджет на вашем сайте или страница продаж, которую размещаем мы
          - Места и танцпол в одном мероприятии
          - Промокоды, цены, которые меняются по датам
          - Пригласительные, возвраты, перенос дат с письмами покупателям
          - Приложение-сканер для iOS и Android
