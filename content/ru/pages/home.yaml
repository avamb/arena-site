  - type: hero
    eyebrow: Платформа продажи билетов для организаторов
    title: Концерт начинается с билета.
    rotate: [Концерт, Фестиваль, Премьера, Спектакль, Шоу, Мастер-класс, Детский праздник]
    lead: "Билеты с местами и без мест: для артистов, групп, промоутеров, площадок, фестивалей, театров и мастер-классов. Просто для первого мероприятия, профессионально для сотого."
    widgetNote: "Так покупатель выбирает места в зале. На мероприятиях без мест всё ещё проще: он выбирает категорию билета и количество."
