      brand: "Цены предполагают строку **Tickets: ArenaSoldOut.com** со ссылкой на нас на странице вашего мероприятия; виджет билетов показывает её по умолчанию. Чтобы продавать без неё, white label стоит **€45 в месяц за бренд или площадку в странах ЕС** и **US$45 в месяц за бренд или площадку во всех остальных странах**. [Подробные условия →](/pricing/terms)"
    currencyNote: "Комиссия в **долларах США** для каждой страны за пределами ЕС, включая европейские страны вне ЕС, Азию и Ближний Восток, и в **евро** для площадок в странах ЕС. Базовая валюта доллар США; цены в евро это цены в долларах по курсу ЕЦБ. Это только наша комиссия: билеты продаются в валюте вашего платёжного аккаунта. Суммы указаны без НДС."
    packages:
