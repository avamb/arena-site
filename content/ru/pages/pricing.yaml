title: "Цены: за билет, без подписки"
description: "Комиссия за проданный билет, без подписки. Оплата после мероприятия или кредиты заранее дешевле. Ниже для площадок и дешёвых событий. Пригласительные бесплатно."
h1: За билет. Без подписки.
lead: Вы платите ArenaSoldOut.com комиссию платформы за каждый проданный билет. Оплата по факту после мероприятия, или кредиты заранее и меньше за билет. Эквайринг по картам вы платите своему платёжному провайдеру по его тарифам.
