      text: "Вы покупаете пакет кредитов один раз; с каждого проданного билета комиссия списывается с ваших кредитов по тарифу этого пакета. Кредиты не сгорают и тратятся только на наши услуги. Если кредиты закончились посреди продаж, продажи продолжаются: остальные билеты выставляются по цене оплаты после мероприятия."
