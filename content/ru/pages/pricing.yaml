      buy: { label: Купить, currency: Платить в, none: Свяжитесь с нами, noneHref: /contact, note: "При оплате Stripe спросит e-mail, на который зарегистрирована ваша организация в ArenaSoldOut.com. Введите именно этот e-mail: кредиты будут зачислены организации, которой он принадлежит. Организации ещё нет? Введите e-mail, на который вы будете регистрироваться, и кредиты будут привязаны к нему." }
      note: "Пакеты кредитов можно покупать сколько угодно раз; билет списывает комиссию из того пакета, из которого он оплачен. Можно включить автоматическое пополнение. Для объёмов свыше 5000 билетов в год: индивидуальные условия, напишите нам."
