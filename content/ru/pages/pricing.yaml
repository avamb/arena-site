  - type: cards
    id: services
    eyebrow: Дополнительные услуги
    title: Что ещё можно заказать?
    lead: "Не входит в комиссию за билет. Каждая услуга заказывается отдельно."
    items:
      - title: Ивент-менеджер
        text: "Нет времени настраивать мероприятия самому? Человек из нашей команды работает как часть вашей: создаёт мероприятия и сеансы, проверяет цены, категории и схему зала до начала продаж, готовит нужные вам отчёты, отправляет пригласительные и повторно высылает билеты. Оплачивается отдельно; условия согласуются с каждым организатором."
        link: { label: Написать нам, href: /contact }
      - title: White label
        text: "Продажи без строки Tickets: ArenaSoldOut.com: €45 в месяц за бренд или площадку в странах ЕС, US$45 во всех остальных странах."
        link: { label: Условия, href: /pricing/terms }
      - title: Рисуем схему зала
        text: "Бесплатно. Пришлите PDF, фото наброска от руки или таблицу рядов и мест, и мы нарисуем схему, обычно в течение дня."
        link: { label: Схемы зала, href: /product/seating }
  - type: faq
    id: questions
    eyebrow: Вопросы о деньгах
    title: Сколько именно стоит мне билет?
    items:
      - q: Сколько стоит билет с местом?
        a: "При оплате после мероприятия: US$1,18 за пределами ЕС, €1,05 в ЕС. Билет без места стоит US$0,62 или €0,55. Сама схема зала ничего не стоит: мы рисуем её бесплатно по PDF, фото эскиза от руки или таблице рядов и мест. С кредитами комиссия ниже, а место добавляет US$0,35 (€0,31) к тарифу в кредитах."
      - q: Как работают кредиты?
        a: "Вы покупаете пакет кредитов один раз. С каждого проданного билета комиссия списывается с ваших кредитов по тарифу пакета, пока они не закончатся. Кредиты не сгорают, их можно пополнять в любой момент, и тратятся они только на наши услуги: их нельзя вывести или передать."
      - q: Что если кредиты закончились посреди продаж?
        a: Продажи не останавливаются. Билеты, которые ваши кредиты не покрыли, попадают в обычный счёт по цене оплаты после мероприятия.
      - q: Есть ли автоматическое пополнение?
        a: Да. Его можно включить, и когда ваши кредиты опустятся ниже заданного порога, следующий пакет будет куплен за вас.
      - q: Куда идут деньги покупателя?
        a: "На ваш собственный платёжный аккаунт, с каждым заказом. ArenaSoldOut.com никогда не держит средства. Покупатель платит цену билета и, если вы его добавили, ваш сервисный сбор."
      - q: Когда я плачу ArenaSoldOut.com?
        a: "После мероприятия, банковским переводом, за проданные билеты. Для мероприятий, которые идут в продаже несколько месяцев, и для постоянных площадок раз в месяц. Кредиты оплачиваются при покупке."
      - q: А что с эквайрингом по картам?
        a: Эквайринг по картам это договор между вами и вашим платёжным провайдером на условиях провайдера. Он не входит в нашу комиссию, и мы ничего к нему не добавляем.
      - q: Нужно ли упоминать ArenaSoldOut.com на моём сайте?
        a: "Цены предполагают, что страница мероприятия указывает ArenaSoldOut.com как оператора продажи билетов, со ссылкой на нас; виджет билетов показывает эту строку по умолчанию. Чтобы продавать без нашего названия, white label стоит €45 в месяц за бренд или площадку в странах ЕС и US$45 в месяц за бренд или площадку во всех остальных странах, неполный месяц считается по дням. [Подробные условия](/pricing/terms) объясняют, что такое бренд и что скрывает white label."
      - q: Есть ли скидка для благотворительных организаций?
        a: "Да. Зарегистрированные благотворительные организации платят 50% нашей комиссии, и при оплате по факту, и с кредитами. Напишите нам со [страницы контактов](/contact), и мы включим скидку для вашей организации."
      - q: Бесплатны ли пригласительные?
        a: Да. С пригласительных и бесплатных билетов на платные мероприятия комиссия не взимается.
      - q: Что происходит с комиссией, когда билет возвращают или дата переносится?
        a: "Возврат покупателю выплачиваете вы. Комиссия за уже состоявшуюся продажу остаётся, а отдельную комиссию за обработку возврата, за перенос даты или за письма покупателям мы не берём. Собственные условия платёжного провайдера остаются условиями провайдера."
      - q: Что если я отменю мероприятие?
        a: "Уже начисленная комиссия деньгами не возвращается. Напишите нам о вашем случае до отмены мероприятия."
      - q: Один из моих билетов стоит больше US$10 (€10 в ЕС), остальные дешёвые. Какая цена действует?
        a: "Стандартная, для всех билетов мероприятия: сниженный тариф требует, чтобы каждый билет каждой категории и ценовой ступени стоил US$10 или меньше (€10 в ЕС). Билет за US$5 рядом с билетом за US$25 идёт по стандартной цене."
      - q: Я владею площадкой и провожу много мероприятий в месяц. Есть ли другие условия?
        a: "Да. Владельцы постоянных площадок (театры, клубы, стадионы, цирки и другие места, которые сами проводят мероприятия, круглый год или сезонно) платят {percent}% от цены билета, считая после промокодов и без вашего сервисного сбора. Комиссия за билет ограничена US$1,18 (€1,09 в ЕС), одинаково с местом и без. С пригласительных комиссия не взимается. Мы выставляем счёт ежемесячно. Статус площадки подключает наша команда: напишите нам со [страницы контактов](/contact). Полные условия в [подробных условиях](/pricing/terms)."

