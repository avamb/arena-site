  - type: prose
    id: how
    title: Как мы сравниваем
    body: |
      **Только опубликованные цены.** Строка попадает в таблицу, только если мы смогли прочитать её на странице цен или в справочном центре другой платформы. Ссылка на источник и дата стоят под каждой таблицей.

      **Сопоставимые условия.** Некоторые платформы включают плату за обработку карт в свою комиссию; мы нет, потому что покупатель платит на ваш собственный платёжный аккаунт, а ваш провайдер берёт собственную плату за обработку карт. Каждая страница уточняет, где что.

      **Чего мы не делаем.** В ArenaSoldOut.com нет маркетплейса, где покупатели выбирают мероприятия, и нет безналичной оплаты в баре. Полный список на [странице фактов](/facts).

      Нашли цену, которая изменилась? [Напишите нам](/contact), и мы исправим страницу.

