      - { title: Фестивали, text: "Несколько входов, много телефонов, один подсчёт. Билеты партнёров принимаются на тех же входах.", link: { label: Для фестивалей →, href: /solutions/festivals } }
      - { title: Агентства и партнёры, text: "Сканируйте билеты, которые вы продали через ArenaSoldOut.com, и билеты из систем, которыми уже пользуются ваши клиенты.", link: { label: Партнёры →, href: /partners } }
