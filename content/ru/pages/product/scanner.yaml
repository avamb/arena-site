title: "MACS: приложение-сканер билетов на iOS и Android"
description: "MACS сканирует билеты EAN-13 и QR любого организатора платформы и билеты партнёров на iPhone, iPad, Android и ручных сканерах. Бесплатно в магазинах приложений."
h1: "MACS: приложение на входе"
lead: Одно приложение для каждого входа. Сотрудники на входе авторизуются, выбирают сеанс и сканируют EAN-13 или QR на билете, на бумаге или на экране. Оно принимает билеты любого организатора, который продаёт через ArenaSoldOut.com, и билеты партнёров из других систем, так что площадка использует одни и те же телефоны для каждого мероприятия.
