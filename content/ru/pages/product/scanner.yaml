sections:
  - type: cards
    id: get
    eyebrow: Получите приложение
    title: Где установить MACS?
    lead: Бесплатно для организаторов платформы. Установите его на столько телефонов, сколько у вас входов, и войдите под своим аккаунтом Event Center.
    items:
      - { title: iPhone и iPad, text: "MACS в App Store. Войдите под своим аккаунтом Event Center; ваши мероприятия и сеансы уже там.", link: { label: Открыть App Store →, href: "https://apps.apple.com/app/id6770095694" } }
      - { title: Android, text: "MACS в Google Play. То же приложение и тот же аккаунт; ручные сканеры на Android со встроенным лазером тоже работают.", link: { label: Открыть Google Play →, href: "https://play.google.com/store/apps/details?id=com.arenasoldout.macs" } }
      - { title: Ручные сканеры, text: "Штрихкод-сканер с USB или Bluetooth, подключённый к телефону или ноутбуку, читает тот же EAN-13; приложение фиксирует сканирование.", link: { label: Как устроены билеты →, href: /product/tickets } }
  - type: faq
    id: questions
    eyebrow: Вопросы
    title: Что делает сканер?
    items:
      - q: Какие билеты он сканирует?
        a: "Каждый билет, выпущенный ArenaSoldOut.com: PDF со штрихкодом EAN-13 и QR-кодом, распечатанный или показанный на экране, и письмо с билетом. Билеты, проданные вашими партнёрами в других системах, принимаются наравне с ними, так что один вход работает для каждого канала продаж."
      - q: Может ли одно приложение обслуживать нескольких организаторов?
        a: Да. MACS сканирует билеты любого организатора платформы. Сотрудники на входе площадки или фестиваля переключаются между мероприятиями и сеансами в приложении; каждый организатор видит сканирования своих мероприятий в Event Center.
      - q: Что видит сотрудник при сканировании?
        a: Действителен ли билет, с местом или категорией, или почему нет (уже использован, отменён, другой сеанс). Организатор видит число прошедших по каждому сеансу в Event Center.
      - q: Нужно ли пользоваться продажей билетов ArenaSoldOut.com, чтобы использовать сканер?
        a: "Сейчас MACS включён для организаторов, которые продают через ArenaSoldOut.com, и принимает билеты партнёров из других систем наравне с билетами ArenaSoldOut.com. Только сканирование, для билетов, проданных в другом месте, предлагается по запросу: напишите нам, указав вашу систему продажи билетов и мероприятие."
      - q: Сколько телефонов могут сканировать одновременно?
        a: Столько, сколько у вас входов. Сканирования записываются централизованно, поэтому билет, пропущенный на одних воротах, на других повторно не пропустят.
      - q: Сколько это стоит?
        a: Ничего сверх цены за билет для организаторов платформы. Условия использования только для сканирования согласуются для каждого мероприятия; условия платформы смотрите на странице цен.
