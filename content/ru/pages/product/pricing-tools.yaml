title: "Промокоды, ранние цены, ступени, «заплати сколько хочешь»"
description: "Промокоды с областью действия и лимитами, ценовые окна по датам, ступени по количеству, цепочки категорий, сервисный сбор по каналам, бесплатные билеты."
h1: Цены, которые меняются так, как вы запланировали
lead: Ранние цены по дате, следующая цена, когда ступень распродана, коды для партнёров, сервисный сбор по каналам. Всё настраивается в Event Center и применяется в виджете и на странице на нашем хостинге.
