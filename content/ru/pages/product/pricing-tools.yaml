sections:
  - type: faq
    id: questions
    eyebrow: Инструменты цен
    title: Что можно делать с ценами?
    items:
      - q: Можно ли использовать промокоды?
        a: Да. Код может действовать на одно мероприятие, один сеанс или одну категорию, с периодом продажи, минимальным заказом и лимитом на покупателя. Партнёры получают собственные коды.
      - q: Есть ли готовая схема цен?
        a: "Да, «Умная цена». Выберите готовую схему ценовых ступеней по количеству и по дате, вместо ручной настройки каждой ступени. Потом её можно скорректировать."
      - q: Можно ли продавать билет только вместе с другим?
        a: "Да, с помощью дополнительных категорий. Дополнение продаётся только вместе с билетом основной категории того же сеанса. Например, детский билет нельзя продать без взрослого, а «ещё один ребёнок» добавляется к «ребёнок плюс взрослый». Когда основные категории распроданы, сеанс отображается как распроданный."
      - q: Могут ли цены меняться в заданную мной дату?
        a: Да. Окна раннего бронирования переключаются по дате и времени. Ступени по количеству открывают следующую цену, когда текущая распродана, так что распроданная ступень никогда не блокирует продажи.
      - q: Несколько цен на одно мероприятие?
        a: Да. Категории со своей ценой, квотой и периодом продажи. Категории могут образовывать цепочки, которые передают непроданные места следующей.
      - q: Можно ли добавить сервисный сбор?
        a: Да. Процент по каждому каналу продаж, который покупатель видит отдельной строкой и который поступает на ваш аккаунт вместе с ценой билета.
      - q: Бесплатные билеты и «заплати сколько хочешь»?
        a: Да, и то и другое. Бесплатные билеты для пригласительных и регистраций и билеты «заплати сколько хочешь» с минимумом, который задаёте вы.
      - q: Работают ли скидки с местами?
        a: Да. Коды и окна применяются к категориям с местами так же, как к танцполу.
