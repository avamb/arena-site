sections:
  - type: faq
    id: questions
    eyebrow: Места
    title: Как работает продажа мест в ArenaSoldOut.com?
    items:
      - q: Нужно ли мне самому рисовать схему?
        a: "Нет, никогда. Пришлите нам план, и мы бесплатно нарисуем его в вашем мероприятии, обычно в течение дня. Достаточно любого из вариантов: PDF с планом зала, фото эскиза от руки или таблица рядов с местами в каждом ряду (Excel или Google Таблицы). Векторные файлы (SVG) импортируются напрямую."
      - q: Могут ли в одном мероприятии быть места и танцпол?
        a: Да, на одной схеме. Ряды с местами по категориям, танцпол с квотами, у каждой категории своя цена и свой период продажи.
      - q: Можно ли изменить схему после начала продаж?
        a: Да. У схем есть версии, поэтому новая раскладка для следующего сеанса не затрагивает уже проданные билеты.
      - q: Сколько мне стоит билет с местом?
        a: "Комиссия за билет с местом составляет US$1,09 (€0,97 в странах ЕС) против US$0,59 (€0,53) без места; кредиты её снижают. Сама схема бесплатна. Смотрите [цены](/pricing)."
      - q: Выбирает ли покупатель место на телефоне?
        a: Да. Схема мест одинакова в виджете и на странице на нашем хостинге, с масштабированием щипком на телефонах, легендой по категориям и таймером удержания выбранных мест.
      - q: Что с пригласительными и местами для прессы?
        a: Выпускайте бесплатные билеты на конкретные места из Event Center; на входе они сканируются как любой билет.
