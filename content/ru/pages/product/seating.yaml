title: "Схемы зала: места с номерами и танцпол"
description: "Схемы зала с версиями, импорт SVG, смешанная рассадка, цены по категориям. Пришлите PDF, эскиз или таблицу рядов, мы нарисуем схему бесплатно."
h1: Схемы зала, которые повторяют площадку
lead: Продажа мест с номерами это часть ядра платформы, а не дополнение. Команда собирает вашу схему из того, что у вас есть, обычно в течение дня, и использует её для каждой даты.
