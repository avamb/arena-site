title: "Продажа билетов на своём сайте или на нашей странице"
description: "Встройте виджет билетов тремя строками, используйте плагин WordPress или поделитесь страницей продаж на нашем хостинге. Покупатели платят на ваш аккаунт."
h1: На вашем сайте или на нашем. Деньги идут вам в любом случае.
lead: Два способа продавать, за ними один Event Center. Встройте виджет на уже имеющийся сайт или поделитесь страницей на нашем хостинге, которую мы создадим за минуты. Каждый заказ попадает на ваш собственный платёжный аккаунт.
related:
  - { label: "Схемы зала, которые повторяют площадку", href: /product/seating, text: "Пришлите PDF, эскиз или таблицу рядов; мы бесплатно нарисуем схему." }
  - { label: Платежи на ваш собственный аккаунт, href: /payments, text: "Провайдеры по странам, статусы, как подключить." }
  - { label: Сайты на WordPress, href: /solutions/wordpress, text: "Плагин с заказами WooCommerce, два клиента перешли с ArenaSoldOut.com без простоя." }
sections:
  - type: ways
    id: ways
    eyebrow: Где вы продаёте
    title: Какой способ подходит моему мероприятию?
    items:
      - title: У вас есть сайт
        text: "Ваш сайт и есть касса. Встройте виджет билетов на любую страницу: WordPress, Tilda, Wix, Webflow или собственный код. Покупатели не покидают ваш домен."
        bullets:
          - Виджет на любом сайте, три строки кода
          - Плагин для WordPress с заказами WooCommerce
          - Ваши цвета, ваши шрифты, ваш язык
      - title: У вас нет сайта
        text: "Страницу продаж размещаем мы: tickets.arenasoldout.com/your-name/your-event. Делитесь одной ссылкой в соцсетях, мессенджерах и на афише."
        bullets:
          - Страница на каждого организатора и на каждое мероприятие
          - Отдельная страница для каждого промоутера
          - Готово за минуты, дизайн не нужен
          - Ссылки на ваших партнёров-продавцов на той же странице
  - type: cards
    id: page
    eyebrow: Ваша страница продаж
    title: Что ещё умеет моя страница продаж?
    lead: "Всё ниже работает на странице вашего мероприятия на платформе и в виджете. Настраивается в Event Center."
    items:
      - title: Материалы мероприятия на странице продаж
        text: "Добавьте материалы к мероприятию на своей странице продаж на платформе, если у вас нет собственного сайта: тексты, фото и видео."
      - title: Описания с оформлением
        text: "Заголовки, списки, ссылки и цитаты в описании мероприятия на странице продаж. Нейросеть оформит простой текст за один клик."
      - title: «Сообщите мне, когда откроются продажи»
        text: "Покупатели подписываются на странице мероприятия и получают письмо в момент открытия продаж, на своём языке."
      - title: Напоминания о брошенной корзине
        text: "Покупатель, который забронировал билеты и не оплатил, получает напоминание по e-mail. Во многих случаях такие напоминания заметно повышают продажи. Можно предложить скидку за согласие на вашу рассылку."
      - title: Приведи друга
        text: "Каждый покупатель получает личную ссылку. Друг получает скидку, а покупатель, который его привёл, получает кэшбэк на карту после мероприятия друга."
      - title: Короткие ссылки и QR-коды для печати
        text: "Короткая ссылка go.arenasoldout.com с QR-кодом для афиш, флаеров и соцсетей: PNG, SVG или готовый вкладыш в PDF форматов A5 и A6 для печати. Можно изменить, куда ведёт ссылка, после печати. Каждый заказ привязан к своей ссылке, поэтому видно, какая афиша продала."
      - title: Магазин рядом с билетами
        text: "Продавайте товары вместе с билетами: вино, напитки по предзаказу к событию, мерч, подарочные наборы. Витрина с вариантами, корзиной, возвратами и письмами. Покупатель забирает заказ на событии, или вы отправляете его почтой или курьером, которого организуете сами. Магазин подключается отдельно, условия по запросу. Наш первый клиент с магазином уже продаёт этим способом."
  - type: faq
    id: questions
    eyebrow: Вопросы
    title: Что делает виджет на моём сайте?
    items:
      - q: Как поставить виджет на мой сайт?
        a: "Две строки HTML: тег script и элемент <arena-tickets> с токеном вашей ленты. Виджет показывает сеансы, схему зала или категории, корзину и оплату. Подробности и код на [странице для разработчиков](/developers)."
      - q: Будет ли он выглядеть как мой сайт?
        a: Да. Виджет считывает со страницы четыре переменные CSS (акцентный цвет, радиус, фон, рамку) и следует языку покупателя. Без iframe, без второго дизайна.
      - q: Где платит покупатель?
        a: "На странице оплаты вашего собственного платёжного провайдера, на ваш аккаунт. ArenaSoldOut.com создаёт заказ, удерживает места и выпускает билет; деньги он никогда не держит. Смотрите [платежи](/payments)."
      - q: Могу ли я продавать и через партнёров?
        a: Да. Каждый промоутер получает страницу со своей ссылкой, а страница на нашем хостинге может перечислять ваших партнёров-продавцов. Продажи из каждого канала видны в одном Event Center.
      - q: Что если я перенесу сайт на другую платформу?
        a: Для покупателей ничего не изменится. Виджет это веб-компонент; он переезжает вместе с вашими страницами, а страница на нашем хостинге продолжает работать как запасная.
  - type: cta
    id: start
    title: Начните продавать сегодня
    text: "Создайте мероприятие, подключите платёжный аккаунт, поделитесь ссылкой. Мероприятие без схемы зала поступает в продажу за 10 минут; схему зала мы нарисуем для вас бесплатно."
    primary: { label: Создать мероприятие, href: /start#create }
    secondary: { label: Открыть Telegram-бота, href: https://t.me/EventsCentrBot }
    note: "Есть вопросы? Напишите нам: команда отвечает в течение одного рабочего дня."
