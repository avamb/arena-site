sections:
  - type: faq
    id: questions
    eyebrow: Билеты
    title: Что получает покупатель?
    items:
      - q: Что указано на билете?
        a: "Мероприятие, сеанс, место или категория, цена, имя покупателя, штрихкод EAN-13 и QR-код. Один PDF на заказ, на языке покупателя: английский, русский, чешский, иврит или испанский на странице, семь языков в письмах. Любой новый язык добавляем в течение 40 часов."
      - q: Приходит ли чек об оплате в письме?
        a: "Да. Чек об оплате прикладывается к письму с билетом, а в письме указано, кто получил платёж: ваша организация и ваш платёжный провайдер."
      - q: Могу ли я проверить, что покупатель получил билет?
        a: "Да. У каждого письма в карточке заказа виден статус: отправлено, доставлено, прочитано. Вы всегда видите, получил ли покупатель билет, и можете отправить его снова, если он потерялся."
      - q: Как сканировать на входе?
        a: "[Приложением-сканером MACS](#scanner) для iOS и Android или ручным штрихкод-сканером. Приложение принимает и билеты, проданные вашими партнёрами в других системах, так что один вход работает для каждого канала."
      - q: Можно ли увидеть билет до начала продаж?
        a: Да. Образец билета с водяным знаком создаётся вместе с мероприятием, из Event Center или из Telegram-бота.
      - q: Что происходит, когда дата переносится?
        a: Покупатели получают письмо на своём языке с приложенным обновлённым билетом. То же самое при отмене, а возврат выполняете вы.
      - q: Можно ли отправить билет повторно или вернуть его?
        a: Да, из Event Center. Отправить на новый адрес, вернуть на карту покупателя, место возвращается в продажу.
      - q: Есть ли приложение для покупателей?
        a: Нет. На входе достаточно PDF и письма; ничего устанавливать не нужно.
  - type: cards
    id: scanner
    eyebrow: На входе
    title: Каким приложением сканировать билеты?
    lead: "MACS это приложение контроля доступа ArenaSoldOut.com. Установите его на телефоны сотрудников на входе, войдите под своим аккаунтом Event Center и сканируйте EAN-13 или QR на каждом билете: бумажном, в PDF на экране или в письме. Одно приложение сканирует билеты любого организатора платформы и билеты партнёров из других систем, так что площадка, фестиваль или промоутер, арендующий площадку, используют одни и те же телефоны для каждого мероприятия."
    items:
      - { title: iPhone и iPad, text: "MACS в App Store. Войдите под своим аккаунтом Event Center; список мероприятий и сеансы уже там.", link: { label: Открыть App Store →, href: "https://apps.apple.com/app/id6770095694" } }
      - { title: Android, text: "MACS в Google Play. То же приложение, тот же аккаунт, ручные сканеры с камерой или лазером тоже работают.", link: { label: Открыть Google Play →, href: "https://play.google.com/store/apps/details?id=com.arenasoldout.macs" } }
      - { title: "Любой организатор, одно приложение", text: "Сотрудники на входе площадки сканируют билеты каждого организатора, который продаёт через ArenaSoldOut.com, и билеты, проданные партнёрами в других системах, без переключения приложений.", link: { label: "MACS как продукт →", href: /product/scanner } }
  - type: cta
    id: start
    title: Начните продавать сегодня
    text: Создайте мероприятие, подключите платёжный аккаунт, поделитесь ссылкой. Образец билета готов вместе с мероприятием.
    primary: { label: Создать мероприятие, href: /start#create }
    secondary: { label: Открыть Telegram-бота, href: https://t.me/EventsCentrBot }
    note: "Есть вопросы? Напишите нам: команда отвечает в течение одного рабочего дня."
