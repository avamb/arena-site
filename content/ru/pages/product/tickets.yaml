title: "Электронные билеты с EAN-13 и QR, сканирование, письма"
description: "Билеты в PDF с EAN-13 и QR на языке покупателя, приложение-сканер MACS для iOS и Android, образцы билетов, письма при переносе или отмене сеанса."
h1: Билет, который сканируется
lead: Каждый билет это PDF со штрихкодом EAN-13 и QR-кодом, на языке покупателя. Сканируйте его приложением или ручным сканером, отправляйте повторно, возвращайте, заменяйте, когда дата переносится.
