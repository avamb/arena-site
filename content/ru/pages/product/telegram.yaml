title: "Бот организатора в Telegram: мероприятие по афише"
description: "Создайте мероприятие по фото афиши, подтвердите прочитанное, добавьте даты и команду. Каждая продажа и возврат приходят в группу Telegram за секунды."
h1: Ведите мероприятие из Telegram
lead: Event Center живёт и в боте. Для начала достаточно фото афиши; каждое прочитанное значение это кнопка для подтверждения, без вас ничего не публикуется.
related:
  - { label: Event Center в браузере, href: /#center }
  - { label: Продажа на вашем сайте или на нашем, href: /product/sell }
  - { label: Начать продавать, href: /start }
sections:
  - type: steps
    id: how
    eyebrow: Как это работает
    title: Что делает бот?
    items:
      - title: Читает афишу
        text: Пришлите фото. Бот прочитает название, даты, площадку и цены и покажет каждое значение кнопкой, которую можно подтвердить или изменить.
      - title: Собирает мероприятие
        text: Сеансы, категории, цены и афиша попадают в мероприятие. Добавьте участников команды, получите образец билета с водяным знаком, опубликуйте, когда будет готово.
      - title: Сообщает о каждой продаже
        text: Каждая продажа и каждый возврат приходят в вашу группу организатора за секунды, с именем покупателя, местами, суммой и контактом.
  - type: faq
    id: questions
    eyebrow: Вопросы
    title: Telegram это единственный способ?
    items:
      - q: Нужен ли мне Telegram, чтобы пользоваться ArenaSoldOut.com?
        a: "Нет. Тот же Event Center работает в браузере на ArenaSoldOut.com, а команда может всё настроить за вас. Telegram это один из способов, для организаторов, которые живут в мессенджере."
      - q: На каких языках говорит бот?
        a: Сегодня на английском, русском и испанском; остальные появятся вслед за языками сайта.
      - q: Может ли моя команда им пользоваться?
        a: Да. Добавляйте участников команды с ролями; в группу продаж можно включить всех, кому нужно видеть заказы.
      - q: Работает ли он со схемой зала?
        a: Бот создаёт мероприятия с категориями и датами; схему зала встраивает команда и привязывает к мероприятию.
  - type: cta
    id: start
    title: Откройте бота
    text: Пришлите афишу или просто поздоровайтесь. Команда отвечает в том же чате.
    primary: { label: Открыть Telegram-бота, href: https://t.me/EventsCentrBot }
    secondary: { label: Начать лучше на сайте, href: /start }
    note: Мероприятия без схемы зала поступают в продажу сегодня.
