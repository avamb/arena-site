sections:
  - type: faq
    id: questions
    eyebrow: Надёжность
    title: Что было измерено?
    items:
      - q: Какая нагрузка проверена?
        a: "800 заказов в минуту при 1000 покупателей на странице одновременно, в нагрузочных тестах сентября 2026 года. Дата и цифры на [странице фактов](/facts)."
      - q: Что будет, если что-то сломается ночью?
        a: Сторожевой процесс постоянно проверяет платформу и оповещает команду в Telegram раньше, чем это заметят организаторы. Cloudflare стоит перед каждой страницей и перед API.
      - q: Сохраняются ли резервные копии моих данных?
        a: Каждую ночь, в зашифрованном виде. Заказы, покупатели, схемы зала и мероприятия.
      - q: Что с ботами и массовым бронированием?
        a: Удержание мест истекает по таймеру, число заказов ограничено, а Cloudflare отсеивает вредоносный трафик до того, как он дойдёт до платформы.
      - q: Могу ли я увидеть историю изменений?
        a: "Да, каждая функция, дошедшая до организаторов, указана с датой на [странице изменений](/changes)."
