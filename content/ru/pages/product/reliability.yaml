title: "Надёжность: 800 заказов в минуту, ночные копии"
description: "Нагрузочный тест: 800 заказов в минуту при 1000 покупателей одновременно. Сторожевой процесс с оповещениями в Telegram, ночные копии, Cloudflare."
h1: Выдержит ли он стадион?
lead: Да. Платформа прошла нагрузочные тесты, круглосуточно под наблюдением и каждую ночь копируется. Цифры ниже указаны с датами и живут на странице фактов, где обновляются с каждым релизом.
