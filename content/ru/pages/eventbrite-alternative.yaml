title: "Альтернатива Eventbrite: фиксированная плата за билет"
description: "Сравнение ArenaSoldOut.com и Eventbrite: фиксированные US$0,62 за билет вместо 3,7% + US$1,79, деньги покупателя сразу на ваш аккаунт."
h1: Альтернатива Eventbrite без процента от цены билета
lead: "Eventbrite берёт процент от каждого билета плюс фиксированную сумму. ArenaSoldOut.com берёт фиксированную плату за билет, сколько бы он ни стоил, а деньги идут на ваш собственный платёжный аккаунт с каждым заказом. Ниже оба прайс-листа рядом, как они опубликованы на 11 ноября 2026 года."
related:
  - { label: Все сравнения, href: /alternatives, text: "ArenaSoldOut.com рядом с другими платформами продажи билетов." }
  - { label: Цены, href: /pricing, text: "Оплата по факту или кредиты, калькулятор и все пакеты кредитов." }
  - { label: Платежи, href: /payments, text: "Какие платёжные аккаунты можно подключить, по странам." }
sections:
  - type: compare
    id: prices
    eyebrow: Цена за билет
    title: Сколько стоит билет на каждой платформе?
    lead: "Цены обеих платформ на 11 ноября 2026 года. Наша комиссия за проданный билет рядом с сервисным сбором Eventbrite. Эквайринг по картам в США оплачивается отдельно на обеих платформах: Eventbrite там, вашему платёжному провайдеру у нас."
    cols: { what: "", us: ArenaSoldOut.com, them: Eventbrite }
    rows:
      - { what: "Как считается плата", us: "Фиксированная плата за билет", them: "Процент от цены билета плюс фиксированная сумма" }
      - { what: "США, за платный билет", us: "**{usdPrice}**", them: "3,7% + US$1,79" }
      - { what: "США, билет за US$20", us: "**{usdPrice}**", them: "US$2,53" }
      - { what: "США, билет за US$50", us: "**{usdPrice}**", them: "US$3,64" }
      - { what: "США, билет за US$100", us: "**{usdPrice}**", them: "US$5,49" }
      - { what: "Ирландия и ЕС, за платный билет", us: "**{eurPrice}**", them: "5,9% + €0,79 в Ирландии" }
      - { what: "Эквайринг по картам", us: "Оплачивается вашему платёжному провайдеру", them: "2,9% от заказа в США, оплачивается Eventbrite" }
      - { what: "Когда вы получаете деньги", us: "С каждым заказом, на ваш аккаунт", them: "После мероприятия, выплата от Eventbrite" }
    note: "Цены Eventbrite: [справочный центр Eventbrite](https://www.eventbrite.com/help/en-us/articles/755615/how-much-does-it-cost-for-organizers-to-use-eventbrite/) и [eventbrite.com/organizer/pricing](https://www.eventbrite.com/organizer/pricing/), проверены 11 ноября 2026 года, без НДС. Наши цены: [цены](/pricing) и [подробные условия](/pricing/terms). Eventbrite это товарный знак его владельца; ArenaSoldOut.com с ним не связан."

  - type: prose
    id: examples
    title: Что это значит для одного мероприятия?
    body: |
      Все суммы по ценам обеих платформ на 11 ноября 2026 года.

      **1000 билетов по US$30, оплата по факту.** ArenaSoldOut.com: 1000 × US$0,62 = **US$620**. Eventbrite: 1000 × (3,7% от US$30 + US$1,79) = US$2900. Разница **US$2280**, до эквайринга по картам с обеих сторон.

      **300 билетов с местами по US$60.** ArenaSoldOut.com: 300 × US$1,18 = **US$354**, а схему зала мы рисуем бесплатно. Eventbrite: 300 × (3,7% от US$60 + US$1,79) = US$1203.

      **Чем дороже билет, тем больше разрыв.** Наша комиссия одинакова на билете за US$15 и за US$150. Процент растёт вместе с ценой.

      Посчитайте своё мероприятие в [калькуляторе на странице цен](/pricing#packages).

  - type: cards
    id: more
    eyebrow: Кроме цены
    title: Чем ещё отличается ArenaSoldOut.com?
    items:
      - title: Деньги ваши с первого заказа
        text: "Покупатели платят на ваш собственный аккаунт Stripe, Flitt или AllPay. ArenaSoldOut.com никогда не держит средства, так что выплаты после мероприятия ждать не нужно."
        link: { label: Платежи, href: /payments }
      - title: Схемы зала рисуем для вас бесплатно
        text: "Пришлите PDF, фото эскиза от руки или таблицу рядов и мест. Команда соберёт площадку; сами вы её не рисуете."
        link: { label: Схемы зала, href: /product/seating }
      - title: Сниженный тариф для дешёвых билетов
        text: "Когда каждый билет мероприятия стоит {usdLowMax} или меньше: {lowPercent}% от цены билета вместо фиксированной платы. Дискотеки, забеги, детские праздники, экскурсии."
        link: { label: Как это работает, href: /pricing#low-price }
      - title: Ваша страница, ваши покупатели
        text: "Продавайте на своём сайте через виджет билетов или на своей странице у нас. Покупатели приходят к вам, а не в каталог рядом с другими мероприятиями."
        link: { label: Продажа на вашем сайте или на нашем, href: /product/sell }
      - title: Каждая продажа в вашем Telegram
        text: "Создайте мероприятие по фото афиши в Telegram-боте и видите каждую продажу и возврат в своей группе за секунды."
        link: { label: Telegram-бот, href: /product/telegram }
      - title: Настройте сами или передайте нам
        text: "Мероприятия вы создаёте в Event Center или в Telegram-боте за минуты; схемы зала мы рисуем бесплатно. Нет времени? Наш менеджер мероприятий сделает это за вас, как платная услуга."
        link: { label: Менеджер мероприятий, href: /pricing#services }

  - type: faq
    id: questions
    title: Вопросы, которые организаторы задают при сравнении
    items:
      - q: ArenaSoldOut.com дешевле, чем Eventbrite?
        a: "По комиссии да, при любой цене билета: {usdPrice} за билет вместо 3,7% + US$1,79 в США и {eurPrice} вместо 5,9% + €0,79 в Ирландии. Эквайринг по картам в США добавляется сверху на обеих платформах."
      - q: Кто платит сбор, я или покупатель?
        a: "Решаете вы. Можно добавить свой сервисный сбор для покупателя сверх цены билета или оставить цену как есть и платить нашу комиссию самому. С пригласительных и бесплатных билетов на платные мероприятия комиссия не взимается."
      - q: Куда идут деньги покупателя?
        a: "На ваш собственный платёжный аккаунт с каждым заказом: Stripe, Flitt или AllPay. ArenaSoldOut.com никогда не держит средства. Наша комиссия выставляется счётом после мероприятия или списывается с ваших кредитов."
      - q: Попадёт ли моё мероприятие в маркетплейс?
        a: "Нет. У Eventbrite есть маркетплейс, где покупатели выбирают мероприятия; у ArenaSoldOut.com его нет. Мы продаём билеты на вашем сайте и на вашей странице мероприятия, а покупателей вы приводите своими каналами."
      - q: Могу ли я перенести мероприятия из Eventbrite?
        a: "Да. Мероприятия вы создаёте в Event Center или в Telegram-боте за минуты, а схемы зала мы бесплатно рисуем по вашему PDF или эскизу. Нет времени? Наш менеджер мероприятий перенесёт их за вас, как платная услуга. Продолжайте продавать в Eventbrite, пока ваша страница у нас не будет готова."
      - q: Нужно ли платить за подписку?
        a: "Нет. Вы платите только за проданные билеты, после мероприятия, или покупаете кредиты заранее от {usdFrom} за билет. Кредиты никогда не сгорают."

