title: "Для кого: концерты, театры, фестивали, площадки"
description: "Организаторы, которые продают свои билеты: концерты, театр, шоу, фестивали, туры, мастер-классы и тренинги, площадки, клубы, сайты на WordPress."
h1: Организаторы, которые продают собственные билеты
lead: Одна платформа, разные мероприятия. Выберите своё, чтобы увидеть, что для вас важнее всего, как выглядит первая неделя и о чём в первую очередь спрашивают другие организаторы вашей сферы.
related:
  - { label: Как это работает, href: /#how }
  - { label: Цены, href: /pricing }
  - { label: Клиенты, href: /clients }
sections:
  - type: cards
    id: list
    eyebrow: Для кого
    title: Какое мероприятие вы проводите?
    items:
      - { title: Концерты, text: "Танцпол и места, несколько ценовых категорий, ранние цены, сканирование на входе.", link: { label: Для концертов →, href: /solutions/concerts } }
      - { title: Театр, text: "Схемы зала, точно повторяющие площадку, повторные даты, пригласительные для прессы и партнёров.", link: { label: Для театров →, href: /solutions/theatre } }
      - { title: Шоу, text: "Ледовые шоу, цирк, танцы: много дат, много городов, одна схема на площадку используется повторно.", link: { label: Для шоу →, href: /solutions/shows } }
      - { title: Фестивали, text: "Несколько дней, много категорий, категории, которые передают непроданные места следующей.", link: { label: Для фестивалей →, href: /solutions/festivals } }
      - { title: Гастрольные туры, text: "Одно шоу, много городов и дат, страница на каждого промоутера со своей ссылкой.", link: { label: Для гастрольных туров →, href: /solutions/concert-tours } }
      - { title: Мастер-классы и тренинги, text: "Небольшие группы, повторяющиеся даты, собственные письма и язык ведущего.", link: { label: Для ведущих →, href: /solutions/master-classes } }
      - { title: Площадки и клубы, text: "Ваша площадка, много мероприятий в месяц, одна схема зала для всех, отдельные условия.", link: { label: Для площадок →, href: /solutions/venues } }
      - { title: Сайты на WordPress, text: "Плагин с заказами WooCommerce; магазин продолжает работать, билеты приходят из ArenaSoldOut.com.", link: { label: Для сайтов на WordPress →, href: /solutions/wordpress } }
  - type: cta
    id: start
    title: Начните продавать сегодня
    text: "Создайте мероприятие, подключите платёжный аккаунт, поделитесь ссылкой. Мероприятие без схемы зала поступает в продажу за 10 минут; схему зала мы нарисуем для вас бесплатно."
    primary: { label: Создать мероприятие, href: /start#create }
    secondary: { label: Открыть Telegram-бота, href: https://t.me/EventsCentrBot }
    note: "Есть вопросы? Напишите нам: команда отвечает в течение одного рабочего дня."
