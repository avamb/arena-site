title: "Я купил билет: где он и что показать на входе"
description: "Ваш билет это PDF в письме с подтверждением, с EAN-13 и QR-кодом; покажите его на телефоне или в распечатке. Возвраты и переносы дат: спросите организатора."
h1: Помощь покупателям билетов
lead: Ваш билет это PDF, приложенный к письму с подтверждением, со штрихкодом и QR-кодом. Покажите его на телефоне или в распечатке. Вопросы о возвратах и датах адресуйте организатору события; его контакт указан на странице продаж и в письме.
