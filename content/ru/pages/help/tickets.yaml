sections:
  - type: faq
    id: questions
    eyebrow: Покупателям
    title: Где мой билет?
    items:
      - q: Я заплатил, но письма нет
        a: Проверьте папку со спамом и адрес, который вы ввели при оплате. Если через несколько минут письма нет, напишите организатору, указав своё имя и время покупки; он может отправить билет на другой адрес.
      - q: Что показать на входе?
        a: PDF на телефоне или в распечатке. Штрихкод и QR-код сканируются один раз; скриншот кода тоже подходит.
      - q: Можно ли вернуть деньги?
        a: О возвратах решает организатор события на условиях, показанных при оплате. Напишите организатору; деньги вернутся на карту, которой вы платили.
      - q: Дата изменилась
        a: Вы получите письмо от организатора с обновлённым билетом во вложении. Старый билет перестанет действовать.
      - q: Можно ли передать билет другу?
        a: Перешлите PDF. Билет сканируется один раз, кто бы его ни принёс.
      - q: У меня вопрос по платежу
        a: Платёж пошёл на собственный платёжный аккаунт организатора; организатор видит его в Event Center и может ответить. ArenaSoldOut.com не держит деньги покупателей.
      - q: Куда попадают мои данные?
        a: "Организатору события, чтобы доставить билет, и платёжному провайдеру для оплаты. Смотрите [политику конфиденциальности](/legal/privacy)."
  - type: cta
    id: organizers
    title: Вы организатор?
    text: Создайте событие, подключите платёжный аккаунт, поделитесь ссылкой. Покупатели платят на ваш собственный аккаунт с первого билета.
    primary: { label: Начать продавать, href: /start }
    secondary: { label: Как это работает, href: /#how }
    note: Покупатели билетов пишут организатору своего события.
