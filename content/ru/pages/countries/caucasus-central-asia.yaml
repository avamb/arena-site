languages: [en, ru]
title: "Продажа билетов в Грузии, Армении, Казахстане и Узбекистане"
description: "Продажа билетов в Грузии, Армении, Казахстане и Узбекистане через ваш аккаунт Flitt, с оплатой прямо в виджете билетов."
h1: "Продажа билетов в Грузии, Армении, Казахстане и Узбекистане"
lead: "Во всех четырёх странах покупатели платят через Flitt прямо в виджете билетов, а деньги за каждый билет приходят на ваш собственный аккаунт Flitt."
related:
  - { label: "Все страны", href: "/countries", text: "Провайдеры, валюты и способы оплаты по странам." }
  - { label: "Концертные туры", href: "/solutions/concert-tours", text: "Много городов и стран в одном мероприятии, своя страница у каждого промоутера." }
  - { label: "Схемы зала", href: "/product/seating", text: "Пришлите PDF, набросок или таблицу рядов, схему мы нарисуем бесплатно." }
sections:
  - type: glance
    id: glance
    eyebrow: "Коротко"
    title: "Четыре страны коротко"
    rows:
      - { k: "Платёжный провайдер", v: "Flitt" }
      - { k: "Валюта", v: "По договорённости с Flitt при открытии аккаунта" }
      - { k: "Способы оплаты", v: "Карты" }
      - { k: "Страница покупки", v: "Русский, английский, испанский, чешский, иврит; другие языки по запросу" }
      - { k: "Наша цена", v: "{usdPrice} за билет, {usdSeated} с местом; с кредитами от {usdFrom}" }
      - { k: "НДС на нашу комиссию", v: "Нет" }

  - type: cards
    id: benefits
    eyebrow: "Почему ArenaSoldOut.com"
    title: "Что получают организаторы?"
    lead: "Билетная платформа, сделанная для организаторов: вы оставляете себе больше с каждого билета, продаёте больше и начинаете раньше."
    items:
      - title: "Зарабатывайте больше на каждом билете"
        text: "Фиксированные {usdPrice} за билет, а не процент от цены. С кредитами ещё дешевле, от {usdFrom} за билет. Комиссия за эквайринг остаётся между вами и вашим платёжным провайдером."
        link: { label: "Цены →", href: "/pricing" }
      - title: "Продавайте больше"
        text: "Промокоды, ранние цены, ссылки «приведи друга», напоминания о брошенной корзине и письмо подписчикам в момент старта продаж."
        link: { label: "Промокоды и ценовые окна →", href: "/product/pricing-tools" }
      - title: "Начинайте быстрее"
        text: "Мероприятие без схемы зала выходит в продажу за 10 минут. Схему зала мы рисуем для вас бесплатно, обычно за день."
        link: { label: "Ваше первое мероприятие →", href: "/first-event" }

  - type: prose
    id: payments
    eyebrow: "Платежи"
    title: "Как идут платежи?"
    body: "Вы один раз подключаете свой аккаунт Flitt. Деньги за каждый проданный билет приходят прямо на него, выплаты идут по графику Flitt, а возвраты уходят покупателю через Flitt. ArenaSoldOut.com не держит ваши деньги."

  - type: cards
    id: where
    eyebrow: "Где продавать"
    title: "Где я могу продавать билеты?"
    lead: "Сразу в трёх местах. Продажи отовсюду собираются в одном Event Center."
    items:
      - title: "Наша страница покупки"
        text: "Мы размещаем страницу вашего мероприятия по адресу tickets.arenasoldout.com/ваше-имя/ваше-мероприятие. Ничего не нужно делать самим."
        link: { label: "Где продавать →", href: "/product/sell" }
      - title: "Ваш сайт"
        text: "Поставьте виджет билетов на сайт, который у вас уже есть. Покупатели выбирают места и платят, не уходя с него."
        link: { label: "Виджет →", href: "/product/sell" }
      - title: "Ваши соцсети"
        text: "Поделитесь ссылкой в соцсетях и мессенджерах или напечатайте QR-код на афише. Каждый заказ привязан к своей ссылке, и вы видите, какая из них продала."
        link: { label: "Ссылки и QR-коды →", href: "/product/sell" }

  - type: faq
    id: questions
    eyebrow: "Вопросы"
    title: "О чём спрашивают организаторы перед стартом?"
    items:
      - q: "Сколько стоит мне один билет?"
        a: "{usdPrice} за билет, {usdSeated} с местом. Вы платите после мероприятия, за проданные билеты. Пригласительные без комиссии. Подробнее в разделе [цены](/pricing)."
      - q: "Можно ли платить меньше за билет?"
        a: "Да. Купите кредиты заранее, и цена снизится до {usdFrom} за билет ({eurFrom} в ЕС). Кредиты не сгорают. Подробнее в разделе [цены](/pricing)."
      - q: "Когда я плачу ArenaSoldOut.com?"
        a: "После мероприятия, за проданные билеты, если вы выбрали такой способ оплаты. Также вы можете купить кредиты до мероприятия."
      - q: "Куда приходят деньги за билеты?"
        a: "На ваш собственный аккаунт у вашего платёжного провайдера, за каждый проданный билет. ArenaSoldOut.com их не держит."
      - q: "Как быстро можно начать продажи?"
        a: "Мы подтверждаем вашу организацию, обычно в течение дня. Если платёжный аккаунт уже есть, мероприятие без схемы зала выходит в продажу за 10 минут. Схему зала мы рисуем бесплатно, обычно за день."
      - q: "Насколько надёжна платформа?"
        a: "Нагрузочный тест: 800 заказов в минуту при 1 000 покупателей одновременно. Система мониторинга сразу оповещает команду, резервные копии делаются каждую ночь и шифруются, перед сайтом стоит Cloudflare. С момента старта в 2019 году не зарегистрировано ни одного сбоя, даже когда несколько десятков тысяч билетов продавались за 5 минут. Подробнее в разделе [надёжность](/product/reliability)."
      - q: "У меня постоянная площадка. Есть особые условия?"
        a: "Да. Театры, клубы и другие площадки, которые проводят мероприятия круглый год или по сезону, платят {percent}% от цены билета, с потолком на билет, счёт раз в месяц. Подробнее в разделе [цены](/pricing)."
      - q: "У меня недорогие билеты. Есть цена ниже?"
        a: "Да. Если каждый билет мероприятия стоит {usdLowMax} или меньше, комиссия составляет {lowPercent}% от цены билета. Подробнее в разделе [цены](/pricing)."
      - q: "Можно ли продавать билеты разной стоимости на одно мероприятие?"
        a: "Да. Категории со своими ценами, ранние цены, которые меняются в заданную дату, шаги по количеству, бесплатные билеты и билеты «плати сколько хочешь»."
      - q: "Есть ли промокоды?"
        a: "Да, с областью действия (какие категории и сеансы), сроками и лимитом на покупателя. Подробнее в разделе [промокоды и ценовые окна](/product/pricing-tools)."
      - q: "Можно ли продавать детский билет только вместе со взрослым?"
        a: "Да, через дополнительные категории. Дополнительный билет продаётся только вместе с основным билетом того же сеанса, поэтому детский билет нельзя купить без взрослого."
      - q: "Можно ли продавать напитки или мерч вместе с билетами?"
        a: "Да. Напиток можно продавать заранее как дополнительную категорию: он продаётся только вместе с билетом и приходит отдельным билетом. Мерч, вино и подарочные наборы продаются в магазине рядом с билетами: варианты товара, корзина, доставка и возвраты."
      - q: "Я провожу одно и то же шоу каждую неделю. Каждый раз создавать новое мероприятие?"
        a: "Нет. Вы добавляете сеанс в то же мероприятие: цены, категории и схема зала переносятся, а покупатель выбирает дату."
      - q: "Видно ли продажи каждого мероприятия в реальном времени?"
        a: "Да. В Event Center на телефоне или компьютере, прямо в браузере, ничего не нужно устанавливать: заказы и итоги по каждому сеансу, отчёт в CSV. Если вы пользуетесь Telegram, каждая продажа и каждый возврат за секунды приходят ещё и в вашу группу."
      - q: "Нужно ли специальное оборудование для контроля входа?"
        a: "Нет. Приложение MACS сканирует билеты на любом iPhone или Android, с бумаги или с экрана. Ручные лазерные сканеры и сканеры штрихкодов по USB или Bluetooth тоже подходят. Подробнее в разделе [приложение MACS](/product/scanner)."
      - q: "Сколько стоит приложение MACS для контроля входа?"
        a: "MACS входит в стоимость для организаторов, которые продают через ArenaSoldOut.com."
      - q: "В какой валюте будут платить покупатели?"
        a: "В той, что указана в вашем аккаунте Flitt. Валюты для вашей страны Flitt подтверждает при открытии аккаунта."

  - type: prose
    id: team
    eyebrow: "Наша команда"
    title: "Есть вопросы или предложения?"
    body: "Напишите команде. Мы отвечаем на вопросы о вашей стране, площадке и мероприятии и слушаем идеи: мы делаем ArenaSoldOut.com для того, чтобы продавать билеты вам было удобно и выгодно. [Написать команде](/contact#write)."

  - type: cta
    id: start
    title: "Начните продавать сегодня"
    text: "Создайте мероприятие, подключите платёжный аккаунт, поделитесь ссылкой."
    primary: { label: "Создать мероприятие", href: "/start#create" }
    secondary: { label: "Написать команде", href: "/contact#write" }
    note: "Мы подтверждаем вашу организацию, подключаем ваш платёжный аккаунт и бесплатно рисуем схему зала."
