title: "Начать продавать: заявка организатора"
description: "Расскажите о вашей организации и событиях. Мы подтвердим её и подключим платёжный аккаунт, обычно в течение дня; дальше вы продаёте сами."
h1: Начать продавать
lead: "Расскажите, кто вы и где продаёте. Мы один раз подтвердим вашу организацию и подключим платёжный аккаунт, обычно в течение дня; события, цены и продажи вы ведёте сами. События без схемы зала поступают в продажу сегодня."
sections:
  - type: steps
    id: how
    eyebrow: Что дальше
    title: Как мы начинаем?
    items:
      - title: Вы отправляете заявку
        text: "Пять коротких шагов: контакт, организация, события, платежи и согласие. Ответы сохраняются по ходу, поэтому можно уйти и вернуться."
      - title: Мы вас подтверждаем
        text: Команда проверяет заявку, подтверждает вашу организацию и один раз подключает платёжный аккаунт. Для площадки с местами мы бесплатно рисуем схему зала по вашему PDF, наброску от руки или таблице рядов. События, цены и категории вы создаёте сами в Event Center или в Telegram-боте.
      - title: Вы выходите в продажу
        text: Поделитесь одной ссылкой или поставьте виджет на свой сайт. Каждая продажа попадает в ваш Event Center и в вашу группу в Telegram.
  - type: onboarding
    id: form
    mode: apply
    eyebrow: Заявка
    title: Расскажите о себе
