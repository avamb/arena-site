sections:
  - type: paycountries
    id: countries
  - type: cards
    id: what
    eyebrow: Для театров
    title: Что важно для театра?
    items:
      - { title: Схема ваша, text: "Партер, ложи, балкон, категории по цене. Пришлите PDF, таблицу или набросок от руки, и команда бесплатно нарисует схему; версии сохраняют проданные билеты, когда меняется планировка.", link: { label: Схемы зала →, href: /product/seating } }
      - { title: Повторные даты, text: "Добавляйте спектакли в то же событие: схема, цены и категории сохраняются, а зритель выбирает удобную дату.", link: { label: Event Center →, href: /#center } }
      - { title: Пригласительные без комиссии, text: "Бесплатные билеты на конкретные места для прессы, партнёров и труппы; на входе они сканируются как обычные билеты.", link: { label: Билеты →, href: /product/tickets } }
      - { title: Своя касса, text: "Продавайте на своём сайте через виджет или на странице продаж; деньги поступают прямо на ваш счёт.", link: { label: Где вы продаёте →, href: /product/sell } }
      - { title: Промокоды и ранняя цена, text: "Коды для подписчиков, школ или партнёров с периодом действия и лимитом на покупателя; ранняя цена, которая заканчивается в назначенный день.", link: { label: Ценовые инструменты →, href: /product/pricing-tools } }
      - { title: "Спектакль переносится? Решаете вы", text: "Вернуть деньги всем, предложить новую дату или найти другое решение. Зрители получат письмо с обновлённым билетом.", link: { label: Билеты →, href: /product/tickets } }
      - { title: Продажи в Telegram, text: "Каждая продажа и каждый возврат через несколько секунд появляются в вашей группе в Telegram вместе с контактом покупателя.", link: { label: Telegram →, href: /product/telegram } }
      - { title: Вход, text: "Приложение-сканер MACS для iOS и Android проверяет каждый билет. А по QR-коду с короткой ссылкой у входа опоздавшие купят билет прямо на месте.", link: { label: Приложение-сканер MACS →, href: /product/scanner } }
      - { title: Сервисный сбор ваш, text: "Добавьте к цене билета свой сервисный сбор для покупателей: он целиком достаётся вам.", link: { label: Цены →, href: /pricing } }
  - type: faq
    id: questions
    eyebrow: Вопросы
    title: О чём первым делом спрашивают театры?
    items:
      - q: Вы сами рисуете схему зала?
        a: Да, бесплатно. Пришлите PDF со схемой, фото наброска от руки или таблицу рядов с местами в каждом ряду; мы нарисуем схему в вашем событии, обычно в течение дня, и вы утвердите её до начала продаж.
      - q: Можно ли назначить разные цены на партер и балкон?
        a: Да. У каждой категории своя цена, квота и период продаж; ранняя цена сменяется следующей автоматически в назначенную дату.
      - q: У нас много спектаклей в месяц. Есть ли другие условия?
        a: "Да. Постоянным площадкам мы предлагаем процент от цены билета вместо платы за каждый билет; подробнее на страницах [площадки](/solutions/venues) и [цены](/pricing)."
      - q: Может ли зритель выбрать место с телефона?
        a: Да, схему зала легко увеличить пальцами на экране телефона, и она показывается на языке покупателя.
  - type: cta
    id: start
    title: Впереди ваше лучшее событие. Начнём с билетов?
    text: "Достаточно PDF, фото наброска от руки или таблицы рядов и мест. Мы бесплатно нарисуем схему в вашем событии и покажем её вам до начала продаж."
