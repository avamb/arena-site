title: "Продажа билетов в театр: схемы зала, повторные даты"
description: "Билеты в театр с местами по схеме вашего зала, повторные даты на одной схеме, пригласительные, возвраты и переносы дат. От 100 до 1 500 мест."
h1: Театр
lead: "Схема, которая совпадает с вашим залом: мы бесплатно рисуем её по вашему PDF, наброску или таблице рядов и используем для каждого спектакля. Пригласительные для прессы и партнёров, возвраты и переносы дат делаются из Event Center."
related:
  - { label: "Схемы зала, которые совпадают с площадкой", href: /product/seating }
  - { label: "Площадки и клубы: отдельные условия", href: /solutions/venues }
  - { label: Электронные билеты и сканирование, href: /product/tickets }
sections:
  - type: cards
    id: what
    eyebrow: Для театров
    title: Что важно для театра?
    items:
      - { title: Схема ваша, text: "Ряды, ложи, балкон, категории по цене. Версии сохраняют проданные билеты, когда меняется планировка.", link: { label: Схемы зала →, href: /product/seating } }
      - { title: Повторные даты, text: "Добавляйте сеансы в то же событие; схема, цены и категории сохраняются. Перенесите или отмените дату с письмами покупателям.", link: { label: Event Center →, href: /#center } }
      - { title: Пригласительные, text: "Бесплатные билеты на конкретные места для прессы, партнёров и труппы, сканируются как любой другой билет.", link: { label: Билеты →, href: /product/tickets } }
      - { title: Своя касса, text: "Продавайте на своём сайте через виджет или на странице продаж; деньги идут на ваш аккаунт, а не через маркетплейс.", link: { label: Где вы продаёте →, href: /product/sell } }
  - type: faq
    id: questions
    eyebrow: Вопросы
    title: О чём первым делом спрашивают театры?
    items:
      - q: Вы сами рисуете схему зала?
        a: Да, бесплатно. Пришлите PDF со схемой, фото наброска от руки или таблицу рядов с местами в каждом ряду; мы нарисуем схему в вашем событии, обычно в течение дня, и вы утвердите её до начала продаж.
      - q: Можно ли поставить разные цены на партер и балкон?
        a: Да. Категории со своими ценами, квотами и окнами; окна ранней цены переключаются по дате.
      - q: У нас много спектаклей в месяц. Есть ли другие условия?
        a: "Да. Постоянным площадкам предлагается процент от цены билета вместо платы за каждый билет; смотрите [площадки](/solutions/venues) и [цены](/pricing)."
      - q: Могут ли покупатели выбирать места на телефоне?
        a: Да, карта мест работает на телефонах с увеличением щипком, на языке покупателя.
  - type: cta
    id: start
    title: Пришлите нам вашу схему
    text: "Достаточно PDF, фото наброска от руки или таблицы рядов и мест. Мы бесплатно нарисуем схему в вашем событии и покажем её вам до начала продаж."
    primary: { label: Начать продавать, href: /start }
    secondary: { label: Открыть Telegram-бот, href: https://t.me/EventsCentrBot }
    note: "Или напишите нам: мы настроим всё вместе с вами на звонке."
