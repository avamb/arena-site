title: "Продажа билетов в театр: схемы зала, повторные даты"
description: "Билеты в театр с местами по схеме вашего зала, повторные даты на одной схеме, пригласительные, возвраты и переносы дат. От 100 до 1 500 мест."
h1: Театр
tagline: Спектакль начинается задолго до третьего звонка.
lead: "Схема, которая в точности повторяет ваш зал: мы бесплатно рисуем её по вашему PDF, наброску или таблице рядов, и она служит для каждого спектакля. Пригласительные для прессы и партнёров, возвраты и переносы дат оформляются в Event Center."
