title: "Продажа билетов на фестивали: несколько дней, категории"
description: "Билеты на фестиваль: однодневные и полные пропуска, категории с квотами, передача непроданных мест, ранняя цена по дате, сканирование на входе."
h1: Фестивали
lead: Однодневные и полные пропуска, много категорий с квотами, ранняя цена, которая включается в нужную дату, и цепочка, передающая непроданные места от одной категории к следующей. Сканирование на каждом входе через приложение.
