title: "Продажа билетов на фестивали: абонементы, много категорий"
description: "Билеты на фестиваль: билеты на один день и абонементы, категории с квотами, передача непроданных мест, ранняя цена по дате, сканирование на входе."
h1: Продажа билетов на фестивали
tagline: Фестиваль начинается задолго до открытия ворот.
lead: Билеты на один день и абонементы на весь фестиваль, много категорий с квотами, ранняя цена, которая заканчивается в нужную дату, и цепочка, по которой непроданные места переходят из одной категории в следующую. На каждом входе билеты сканируют в приложении.
