sections:
  - type: cards
    id: what
    eyebrow: Для фестивалей
    title: Что важно для фестиваля?
    items:
      - { title: Категории с квотами, text: "Первый день, второй день, полный пропуск, VIP, кемпинг: у каждой категории своя цена, квота и окно продаж.", link: { label: Ценовые инструменты →, href: /product/pricing-tools } }
      - { title: Цепочки категорий, text: "Когда ранняя цена распродана, её непроданные места переходят в следующую категорию и не блокируют продажи.", link: { label: Ценовые инструменты →, href: /product/pricing-tools } }
      - { title: Входы, text: "Приложение-сканер для iOS и Android на каждых воротах; билеты партнёров из других систем тоже принимаются.", link: { label: Приложение-сканер MACS →, href: /product/scanner } }
      - { title: Нагрузка, text: "800 заказов в минуту при 1 000 одновременных покупателей в нагрузочных тестах; первая минута продаж выдерживается.", link: { label: Надёжность →, href: /product/reliability } }
  - type: faq
    id: questions
    eyebrow: Вопросы
    title: О чём первым делом спрашивают организаторы фестивалей?
    items:
      - q: Может ли покупатель взять однодневный пропуск и кемпинг в одном заказе?
        a: Да, несколько категорий одного события оформляются в одной оплате.
      - q: Можно ли изменить цены на последнюю неделю?
        a: Да. Ценовые окна переключаются по дате и времени; шаги по количеству открывают следующую цену, когда шаг распродан.
      - q: У нас есть бесплатные билеты для спонсоров. Как быть?
        a: Бесплатные билеты и пригласительные создаются в Event Center, комиссии платформы нет, сканируются как любой билет.
      - q: Сколько это стоит?
        a: "Фиксированная комиссия за проданный билет, счёт после события или списание с ваших кредитов, ежемесячно для событий, которые продаются месяцами; смотрите [цены](/pricing)."
  - type: cta
    id: start
    title: Начните продавать сегодня
    text: Создайте событие, подключите платёжный аккаунт, поделитесь ссылкой.
    primary: { label: Создать событие, href: /start#create }
    secondary: { label: Открыть Telegram-бот, href: https://t.me/EventsCentrBot }
    note: "Или напишите нам: мы настроим всё вместе с вами на звонке."
