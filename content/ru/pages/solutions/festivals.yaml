  - type: faq
    id: questions
    eyebrow: Вопросы
    title: О чём первым делом спрашивают организаторы фестивалей?
    items:
      - q: Может ли покупатель взять билет на один день и кемпинг в одном заказе?
        a: Да, билеты разных категорий одного события оплачиваются одним заказом.
      - q: Можно ли изменить цены на последнюю неделю?
        a: Да. Цены переключаются по дате и времени, а когда распродана очередная партия билетов, автоматически открывается следующая цена.
      - q: У нас есть бесплатные билеты для спонсоров. Как их оформить?
        a: Создайте бесплатные билеты и пригласительные в Event Center. Комиссии за них нет, а на входе они сканируются как обычные билеты.
      - q: Сколько это стоит?
        a: "Фиксированная комиссия за каждый проданный билет. Счёт выставляется после события, или оплачивается вашими кредитами; если продажи идут месяцами, счёт приходит раз в месяц. Подробнее на странице [цен](/pricing)."
  - type: cta
    id: start
    title: Впереди ваше лучшее событие. Начнём с билетов?
    text: Создайте событие, подключите платёжный аккаунт, поделитесь ссылкой.
