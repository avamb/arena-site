title: "Билеты для площадок и клубов: одна схема, отдельные условия"
description: "Для постоянных площадок и клубов: одна схема зала для всех событий, много событий в месяц, сканирование на входе, процент от цены билета вместо платы за билет."
h1: Площадки и клубы
lead: "Ваша собственная площадка, много событий в месяц. Схема строится один раз и используется снова, каждый промоутер, арендующий площадку, продаёт через вашу страницу или свою, а условия другие: процент от цены билета вместо платы за каждый билет."
