  - type: cards
    id: what
    eyebrow: Для площадок
    title: Что важно для площадки?
    items:
      - { title: "Одна схема, любое событие", text: "Пришлите PDF, таблицу или набросок от руки, и команда бесплатно нарисует схему; она служит для каждого события, а версии нужны для разных планировок сцены.", link: { label: Схемы зала →, href: /product/seating } }
      - { title: "Промоутеры, которые арендуют площадку", text: "У каждого промоутера своя страница и своя ссылка; площадка видит все события, промоутер только свои.", link: { label: Где вы продаёте →, href: /product/sell } }
      - { title: Особые условия, text: "Процент от цены билета вместо платы за каждый билет, без комиссии за пригласительные и возвраты, условия для больших объёмов по запросу.", link: { label: Цены →, href: /pricing } }
      - { title: Промокоды и ранняя цена, text: "Коды для постоянных гостей и партнёров с лимитом на покупателя, ранняя цена до назначенной даты, бесплатные билеты и оплата по желанию.", link: { label: Ценовые инструменты →, href: /product/pricing-tools } }
      - { title: Вход, text: "Приложение-сканер MACS для iOS и Android, ручные сканеры; билеты партнёров из других систем тоже принимаются.", link: { label: Приложение-сканер MACS →, href: /product/scanner } }
      - { title: Билеты у входа, text: "Поставьте у входа распечатанный QR-код с короткой ссылкой на покупку: гости наводят камеру и покупают билет прямо на месте.", link: { label: Где вы продаёте →, href: /product/sell } }
      - { title: Продажи в Telegram, text: "Каждая продажа и каждый возврат по любому событию через несколько секунд появляются в вашей группе в Telegram вместе с контактом покупателя.", link: { label: Telegram →, href: /product/telegram } }
      - { title: "Событие переносится? Решаете вы", text: "Вернуть деньги всем, предложить новую дату или найти другое решение. Зрители получат письмо с обновлённым билетом.", link: { label: Билеты →, href: /product/tickets } }
      - { title: Готовы к большому старту продаж, text: "800 заказов в минуту при 1 000 одновременных покупателей в нагрузочных тестах, ночные зашифрованные резервные копии.", link: { label: Надёжность →, href: /product/reliability } }
  - type: faq
    id: questions
    eyebrow: Вопросы
    title: О чём первым делом спрашивают владельцы площадок?
    items:
      - q: Какие условия для постоянной площадки?
        a: "Процент от цены билета вместо платы за каждый билет, без комиссии за пригласительные и возвраты. Точная цифра на [странице цен](/pricing); условия для больших объёмов и индивидуальные условия по запросу."
      - q: Может ли промоутер продавать наши события на своём сайте?
        a: Да, через виджет на своём сайте или через страницу промоутера, которую мы размещаем. Продажи из всех каналов видны в Event Center площадки.
      - q: Можно ли перейти из другой билетной системы?
        a: "Да. Два клиента уже перешли к нам со своей прежней билетной системы без простоя, вместе с сеансами, схемами зала и покупателями; из других систем данные загружаются через API по запросу. Подробнее в разделе [для разработчиков](/developers)."
      - q: Кто работает в Event Center?
        a: Ваша команда, у каждого своя роль. Организация принадлежит площадке, а менеджеры видят то, что вы им откроете.
