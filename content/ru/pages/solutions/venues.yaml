title: "Билеты для площадок и клубов: одна схема, отдельные условия"
description: "Для постоянных площадок и клубов: одна схема зала для всех событий, много событий в месяц, сканирование на входе, процент от цены билета вместо платы за билет."
h1: Площадки и клубы
tagline: Площадка оживает задолго до открытия дверей.
lead: "Своя площадка, много событий в месяц. Схема рисуется один раз и служит для каждого события, каждый промоутер, который арендует площадку, продаёт билеты через вашу страницу или свою, а условия особые: процент от цены билета вместо платы за каждый билет."
