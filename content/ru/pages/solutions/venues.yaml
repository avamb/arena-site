sections:
  - type: cards
    id: what
    eyebrow: Для площадок
    title: Что важно для площадки?
    items:
      - { title: "Одна схема, любое событие", text: "Строится один раз по вашему файлу и используется для каждого события; версии для разных планировок сцены.", link: { label: Схемы зала →, href: /product/seating } }
      - { title: "Промоутеры, арендующие площадку", text: "Страница для каждого промоутера со своей ссылкой; площадка видит каждое событие, промоутер видит только своё.", link: { label: Где вы продаёте →, href: /product/sell } }
      - { title: Отдельные условия, text: "Два процента от цены билета вместо платы за каждый билет, без комиссии на пригласительные и возвраты, условия для больших объёмов по запросу.", link: { label: Цены →, href: /pricing } }
      - { title: Вход, text: "Приложение-сканер для iOS и Android, ручные сканеры, билеты партнёров из других систем принимаются.", link: { label: Приложение-сканер MACS →, href: /product/scanner } }
  - type: faq
    id: questions
    eyebrow: Вопросы
    title: О чём первым делом спрашивают владельцы площадок?
    items:
      - q: Какие условия для постоянной площадки?
        a: "Процент от цены билета вместо платы за каждый билет, без комиссии на пригласительные и возвраты. Цифра указана на [странице цен](/pricing); условия для больших объёмов и индивидуальные по запросу."
      - q: Может ли промоутер продавать наши события на своём сайте?
        a: Да, через виджет на его сайте или страницу промоутера, которую мы размещаем. Продажи из всех каналов отображаются в Event Center площадки.
      - q: Можно ли перейти из другой билетной системы?
        a: "Да. Сеансы, схемы зала и клиенты были импортированы в ArenaSoldOut.com для двух клиентов без простоя; из других систем через API пакета события. Смотрите [разработчикам](/developers)."
      - q: Кто работает в Event Center?
        a: Ваша команда, с ролями. Организация принадлежит площадке; менеджеры видят то, что вы разрешите.
  - type: cta
    id: start
    title: Поговорите с нами
    text: Расскажите о площадке и числе событий в месяц. Мы настроим схему и условия вместе с вами.
    primary: { label: Поговорить с нами, href: /start }
    secondary: { label: Смотреть цены, href: /pricing }
    note: "Или напишите нам: мы настроим всё вместе с вами на звонке."
