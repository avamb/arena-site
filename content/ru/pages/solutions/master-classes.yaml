title: "Продажа билетов на мастер-классы, тренинги и дегустации"
description: "Продавайте места на мастер-классы, тренинги, дегустации: малые группы с квотой, повторяющиеся даты, свои письма, бесплатные места, оплата по желанию."
h1: Мастер-классы и тренинги
lead: Малые группы, повторяющиеся даты, ваши письма на вашем языке. Страница продаж готова за минуты; виджет встраивается в сайт, который у вас уже есть. Так продаёт свои дегустации Vino&Co в Израиле.
related:
  - { label: Промокоды и ценовые окна, href: /product/pricing-tools }
  - { label: Где вы продаёте, href: /product/sell }
  - { label: Клиенты, href: /clients }
sections:
  - type: cards
    id: what
    eyebrow: Для ведущих
    title: Что важно для мастер-класса?
    items:
      - { title: Квота на каждую дату, text: "Двенадцать мест во вторник, двадцать в субботу; распроданные даты закрываются сами.", link: { label: Ценовые инструменты →, href: /product/pricing-tools } }
      - { title: Повторяющиеся даты, text: "Добавляйте сеансы в то же событие; цены и категории сохраняются, покупатели выбирают дату.", link: { label: Event Center →, href: /#center } }
      - { title: Бесплатно и оплата по желанию, text: "Регистрации без оплаты или минимальная цена, а остальное решает покупатель.", link: { label: Ценовые инструменты →, href: /product/pricing-tools } }
      - { title: Ваш язык, text: "Страница, виджет, письмо и билет на языке покупателя, включая иврит справа налево.", link: { label: Билеты →, href: /product/tickets } }
  - type: faq
    id: questions
    eyebrow: Вопросы
    title: О чём первым делом спрашивают ведущие?
    items:
      - q: У меня нет сайта. Где людям покупать?
        a: "На странице продаж tickets.arenasoldout.com/your-name/your-event, она готова за минуты. Делитесь ссылкой в мессенджерах и соцсетях."
      - q: Можно ли брать только предоплату?
        a: Поставьте в цену билета сумму предоплаты, а остальное получите на месте; или используйте оплату по желанию с минимальной суммой.
      - q: Получают ли покупатели напоминание?
        a: Покупатель получает билет по электронной почте и письмо, если дата переносится или отменяется. Напоминания перед датой сегодня не отправляются.
      - q: Сколько это стоит?
        a: "Фиксированная сумма за оплаченный билет; бесплатные регистрации ничего не стоят. Смотрите [цены](/pricing)."
  - type: cta
    id: start
    title: Начните продавать сегодня
    text: Создайте событие, подключите платёжный аккаунт, поделитесь ссылкой.
    primary: { label: Создать событие, href: /start#create }
    secondary: { label: Открыть Telegram-бот, href: https://t.me/EventsCentrBot }
    note: "Есть вопросы? Напишите нам: команда отвечает в течение одного рабочего дня."
