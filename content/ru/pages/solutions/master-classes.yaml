title: "Продажа билетов на мастер-классы, тренинги и дегустации"
description: "Продавайте места на мастер-классы, тренинги, дегустации: малые группы с квотой, повторяющиеся даты, свои письма, бесплатная запись, оплата по желанию."
h1: Мастер-классы и тренинги
tagline: Мастер-класс начинается с первого записавшегося.
lead: Малые группы, повторяющиеся даты, письма участникам на их языке. Страница продаж готова за несколько минут, а виджет встраивается в сайт, который у вас уже есть. Так продаёт свои дегустации Vino&Co в Израиле.
related:
  - { label: Промокоды и ценовые окна, href: /product/pricing-tools }
  - { label: Где вы продаёте, href: /product/sell }
  - { label: Клиенты, href: /clients }
sections:
  - type: paycountries
    id: countries
  - type: cards
    id: what
    eyebrow: Для ведущих
    title: Что важно для мастер-класса?
    items:
      - { title: Квота на каждую дату, text: "Двенадцать мест во вторник, двадцать в субботу; когда места заканчиваются, запись на дату закрывается сама.", link: { label: Ценовые инструменты →, href: /product/pricing-tools } }
      - { title: Повторяющиеся даты, text: "Добавляйте даты в то же событие: цены и категории сохраняются, а участник выбирает удобный день.", link: { label: Event Center →, href: /#center } }
      - { title: Бесплатно или оплата по желанию, text: "Бесплатная запись или минимальная цена, а сколько добавить сверх неё, решает покупатель.", link: { label: Ценовые инструменты →, href: /product/pricing-tools } }
      - { title: Промокоды и ранняя цена, text: "Код для постоянных участников или партнёра с лимитом на покупателя; ранняя цена, которая заканчивается в назначенный день.", link: { label: Ценовые инструменты →, href: /product/pricing-tools } }
      - { title: Продажи в Telegram, text: "Каждая продажа и каждый возврат через несколько секунд появляются в вашей группе в Telegram вместе с контактом покупателя.", link: { label: Telegram →, href: /product/telegram } }
      - { title: Откуда приходят участники, text: "Добавьте UTM-метки к ссылкам и смотрите, какой пост, рассылка или партнёр приносит записи.", link: { label: Где вы продаёте →, href: /product/sell } }
      - { title: Ваш язык, text: "Страница, виджет, письмо и билет на языке покупателя, включая иврит с текстом справа налево.", link: { label: Билеты →, href: /product/tickets } }
      - { title: "Дата переносится? Решаете вы", text: "Вернуть деньги всем, предложить новую дату или найти другое решение. Участники получат письмо с обновлённым билетом.", link: { label: Билеты →, href: /product/tickets } }
      - { title: Без подписки и дополнительных платежей, text: "Ни подписки, ни платежей за месяц или за год: только комиссия за оплаченный билет, а бесплатная запись ничего не стоит.", link: { label: Цены →, href: /pricing } }
  - type: faq
    id: questions
    eyebrow: Вопросы
    title: О чём первым делом спрашивают ведущие?
    items:
      - q: У меня нет сайта. Где людям покупать?
        a: "На странице продаж tickets.arenasoldout.com/your-name/your-event, она готова за несколько минут. Делитесь ссылкой в мессенджерах и соцсетях."
      - q: Можно ли брать только предоплату?
        a: Поставьте в цену билета сумму предоплаты, а остальное получите на месте; или используйте оплату по желанию с минимальной суммой.
      - q: Получают ли покупатели напоминание?
        a: Покупатель получает билет по электронной почте и письмо, если дату перенесли или отменили. Напоминания перед датой пока не отправляются.
      - q: Сколько это стоит?
        a: "Фиксированная сумма за оплаченный билет; бесплатная запись ничего не стоит. Подробнее на странице [цен](/pricing)."
  - type: cta
    id: start
    title: Впереди ваше лучшее событие. Начнём с билетов?
    text: Создайте событие, подключите платёжный аккаунт, поделитесь ссылкой.
    primary: { label: Начать продавать, href: /start }
    secondary: { label: Создать мероприятие, href: /start#create }
    tertiary: { label: Связаться с командой, href: /contact#write }
