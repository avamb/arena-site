sections:
  - type: paycountries
    id: countries
  - type: cards
    id: what
    eyebrow: Для гастролей
    title: Что важно на гастролях?
    items:
      - { title: Сеансы по городам, text: "Даты и площадки в одном событии: покупатель выбирает город, а вы видите итоги по каждому сеансу и по всем гастролям.", link: { label: Event Center →, href: /#center } }
      - { title: Схема для каждой площадки, text: "Пришлите PDF, таблицу или набросок от руки, и команда бесплатно нарисует схему площадки; при следующем приезде она уже готова.", link: { label: Схемы зала →, href: /product/seating } }
      - { title: Страницы промоутеров, text: "Отдельная страница для каждого местного промоутера со своей ссылкой и промокодами; все продажи собираются у вас.", link: { label: Где вы продаёте →, href: /product/sell } }
      - { title: Откуда приходят покупатели, text: "Добавьте UTM-метки к ссылкам и смотрите, какой пост, рассылка или партнёр продаёт билеты в каждом городе.", link: { label: Где вы продаёте →, href: /product/sell } }
      - { title: Несколько стран, text: "Продавайте в Чехии, Испании, Франции, Грузии или Израиле через провайдера каждой страны, на ваш собственный счёт.", link: { label: Платежи →, href: /payments } }
      - { title: Языки покупателей, text: "Страницы и билеты на языке покупателя, письма на семи языках, для иврита текст идёт справа налево.", link: { label: Билеты →, href: /product/tickets } }
      - { title: Все гастроли в Telegram, text: "Каждая продажа и каждый возврат из любого города через несколько секунд появляются в вашей группе в Telegram вместе с контактом покупателя.", link: { label: Telegram →, href: /product/telegram } }
      - { title: "Концерт переносится? Решаете вы", text: "Вернуть деньги всем, предложить новую дату или найти другое решение. Зрители получат письмо с обновлённым билетом.", link: { label: Билеты →, href: /product/tickets } }
      - { title: Вход в каждом городе, text: "Приложение-сканер MACS для iOS и Android на каждой площадке; билеты местных партнёров из других систем тоже принимаются.", link: { label: Приложение-сканер MACS →, href: /product/scanner } }
  - type: faq
    id: questions
    eyebrow: Вопросы
    title: О чём первым делом спрашивают организаторы гастролей?
    items:
      - q: Может ли одно событие охватывать несколько стран и валют?
        a: Сеансы могут проходить в разных странах; платёжный аккаунт и валюта привязаны к организации. Если нужны разные валюты, команда настроит отдельный канал для каждой страны.
      - q: Видят ли промоутеры продажи друг друга?
        a: Нет. Каждый промоутер видит только свою страницу; организатор видит всё.
      - q: В одном городе концерт переезжает на другую площадку. Что будет с проданными билетами?
        a: Вы переносите сеанс, и покупатели получают письмо с обновлённым билетом; места на новой схеме мы распределим вместе с вами.
      - q: Сколько я плачу за билет на гастролях?
        a: "Одинаковую сумму за билет в каждом городе; подробнее на странице [цен](/pricing)."
  - type: cta
    id: start
    title: Впереди ваше лучшее событие. Начнём с билетов?
    text: Создайте событие, подключите платёжный аккаунт, поделитесь ссылкой.
    primary: { label: Начать продавать, href: /start }
    secondary: { label: Создать мероприятие, href: /start#create }
    tertiary: { label: Связаться с командой, href: /contact#write }
