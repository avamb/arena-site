title: "Продажа билетов на гастроли: города, страницы промоутеров"
description: "Продавайте билеты на гастроли из одного события: сеансы по городам, схема каждой площадки, страницы промоутеров с промокодами, сканирование везде."
h1: Гастрольные туры
tagline: Гастроли начинаются задолго до первого города.
lead: Одна программа, много городов и дат. У каждого города свой сеанс и своя схема, у каждого промоутера своя страница со своей ссылкой, а все гастроли вы видите в одном Event Center.
