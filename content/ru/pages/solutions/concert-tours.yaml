title: "Продажа билетов на гастроли: города, страницы промоутеров"
description: "Продавайте билеты на тур из одного события: сеансы по городам, схема зала для каждой площадки, страницы промоутеров с промокодами, сканирование везде."
h1: Гастрольные туры
lead: Одно шоу, много городов и дат. У каждого города свой сеанс и своя схема, у каждого промоутера страница со своей ссылкой, а весь тур вы видите в одном Event Center.
related:
  - { label: Шоу, href: /solutions/shows }
  - { label: Где вы продаёте, href: /product/sell }
  - { label: Платежи по странам, href: /payments }
sections:
  - type: cards
    id: what
    eyebrow: Для гастролей
    title: Что важно в туре?
    items:
      - { title: Сеансы по городам, text: "Даты и площадки в одном событии; покупатели выбирают город, а итоги вы видите по каждому сеансу и по всему туру.", link: { label: Event Center →, href: /#center } }
      - { title: Страницы промоутеров, text: "Отдельная страница для каждого местного промоутера со своей ссылкой и промокодами; продажи собираются у вас.", link: { label: Где вы продаёте →, href: /product/sell } }
      - { title: Несколько стран, text: "Продавайте в Чехии, Испании, Франции, Грузии или Израиле через провайдера каждой страны, на ваш собственный счёт.", link: { label: Платежи →, href: /payments } }
      - { title: Языки покупателей, text: "Страницы и билеты на языке покупателя, письма на семи языках, письмо справа налево для иврита.", link: { label: Билеты →, href: /product/tickets } }
  - type: faq
    id: questions
    eyebrow: Вопросы
    title: О чём первым делом спрашивают организаторы туров?
    items:
      - q: Может ли одно событие охватывать несколько стран и валют?
        a: Сеансы могут проходить в разных странах; платёжный аккаунт и валюта привязаны к организации. Для отдельных валют команда настраивает канал на каждую страну.
      - q: Видят ли промоутеры продажи друг друга?
        a: Нет. Каждый промоутер видит только свою страницу; организатор видит всё.
      - q: Город переезжает на другую площадку. Что будет с проданными билетами?
        a: Сеанс переносится вместе с письмами покупателям и обновлёнными билетами; места переносятся на новую схему вместе с вами.
      - q: Сколько стоит билет в туре?
        a: "Одинаковая сумма за билет в каждом городе; смотрите [цены](/pricing)."
  - type: cta
    id: start
    title: Начните продавать сегодня
    text: Создайте событие, подключите платёжный аккаунт, поделитесь ссылкой.
    primary: { label: Создать событие, href: /start#create }
    secondary: { label: Открыть Telegram-бот, href: https://t.me/EventsCentrBot }
    note: "Или напишите нам: мы настроим всё вместе с вами на звонке."
