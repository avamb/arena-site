title: "Продажа билетов на шоу: ледовые шоу, цирк, танцы"
description: "Продавайте билеты на гастрольные шоу: схема каждой площадки рисуется один раз, много дат, страницы промоутеров, все города в одном Event Center."
h1: Шоу
tagline: Шоу начинается задолго до выхода на сцену.
lead: Ледовые шоу, цирк, танцевальные и детские спектакли идут много дней на разных площадках. Одно событие, своя схема для каждой площадки, своя страница для каждого промоутера и продажи всех городов в одном месте.
related:
  - { label: Гастрольные туры, href: /solutions/concert-tours }
  - { label: Схемы зала, href: /product/seating }
  - { label: Клиенты, href: /clients }
sections:
  - type: paycountries
    id: countries
  - type: cards
    id: what
    eyebrow: Для шоу
    title: Что важно для шоу?
    items:
      - { title: Схема для каждой площадки, text: "Пришлите PDF, таблицу или набросок от руки, и команда бесплатно нарисует схему площадки. При следующем приезде она уже готова; версии хранят историю изменений.", link: { label: Схемы зала →, href: /product/seating } }
      - { title: Много дат, text: "Сеансы по городам и дням в одном событии: покупатель выбирает дату в виджете, а вы видите итоги по каждому сеансу.", link: { label: Event Center →, href: /#center } }
      - { title: Местные промоутеры, text: "У каждого промоутера своя страница, своя ссылка и свои промокоды; продажи из всех каналов сходятся в одном Event Center.", link: { label: Где вы продаёте →, href: /product/sell } }
      - { title: Дети и группы, text: "Отдельные категории для детей и групп, бесплатные билеты для сопровождающих взрослых.", link: { label: Ценовые инструменты →, href: /product/pricing-tools } }
      - { title: Откуда приходят покупатели, text: "Добавьте UTM-метки к ссылкам и смотрите, какой пост, рассылка или партнёр приносит продажи в каждом городе.", link: { label: Где вы продаёте →, href: /product/sell } }
      - { title: Продажи в Telegram, text: "Каждая продажа и каждый возврат из любого города через несколько секунд появляются в вашей группе в Telegram вместе с контактом покупателя.", link: { label: Telegram →, href: /product/telegram } }
      - { title: Вход, text: "Приложение-сканер MACS для iOS и Android на одном входе проверяет и ваши билеты, и билеты партнёров из других систем.", link: { label: Приложение-сканер MACS →, href: /product/scanner } }
      - { title: "Дата переносится? Решаете вы", text: "Вернуть деньги всем, предложить новую дату или найти другое решение. Зрители получат письмо с обновлённым билетом.", link: { label: Билеты →, href: /product/tickets } }
      - { title: Деньги на вашем счёте, text: "Покупатели платят через провайдера вашей страны прямо на ваш счёт; ArenaSoldOut.com никогда не держит у себя ваши деньги.", link: { label: Платежи →, href: /payments } }
  - type: faq
    id: questions
    eyebrow: Вопросы
    title: О чём первым делом спрашивают продюсеры шоу?
    items:
      - q: Можно ли вести все гастроли в одном событии?
        a: Да. У каждого сеанса свой город, площадка и схема; итоги и отчёты в CSV доступны и по каждому сеансу, и по всему событию.
      - q: Как быть с площадкой, на которой мы ещё не выступали?
        a: Пришлите её схему в любом понятном виде, и команда внесёт её в систему. При следующем приезде схема уже будет готова.
      - q: Наши билеты продают и местные партнёры. Пропустит ли их сканер на входе?
        a: Да. Приложение-сканер принимает билеты партнёров из других систем наравне с билетами ArenaSoldOut.com.
      - q: Куда поступают деньги?
        a: "На ваш собственный счёт у платёжного провайдера, в вашей валюте, с каждого заказа. Подробнее на странице [платежей](/payments)."
  - type: cta
    id: start
    title: Впереди ваше лучшее событие. Начнём с билетов?
    text: Создайте событие, подключите платёжный аккаунт, поделитесь ссылкой.
    primary: { label: Начать продавать, href: /start }
    secondary: { label: Создать мероприятие, href: /start#create }
    tertiary: { label: Связаться с командой, href: /contact#write }
