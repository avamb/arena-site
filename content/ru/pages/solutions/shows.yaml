title: "Продажа билетов на шоу: ледовые, цирк, танцы, много городов"
description: "Продавайте билеты на гастрольные шоу: одна схема на площадку с повторным использованием, много дат, страницы промоутеров, все города в Event Center."
h1: Шоу
lead: Ледовые шоу, цирк, танцы и семейные спектакли играют много дат на многих площадках. Одно событие, схема на каждую площадку, страница для каждого промоутера и продажи всех городов в одном месте.
related:
  - { label: Гастрольные туры, href: /solutions/concert-tours }
  - { label: Схемы зала, href: /product/seating }
  - { label: Клиенты, href: /clients }
sections:
  - type: cards
    id: what
    eyebrow: Для шоу
    title: Что важно для шоу?
    items:
      - { title: Схема на каждую площадку, text: "Схема каждой площадки строится один раз и используется при следующем приезде; версии сохраняют историю.", link: { label: Схемы зала →, href: /product/seating } }
      - { title: Много дат, text: "Сеансы по городам и дням в одном событии; покупатели выбирают дату в виджете, а итоги вы видите по каждому сеансу.", link: { label: Event Center →, href: /#center } }
      - { title: Местные промоутеры, text: "Страница для каждого промоутера со своей ссылкой и промокодами; все каналы отчитываются в одном Event Center.", link: { label: Где вы продаёте →, href: /product/sell } }
      - { title: Семейные билеты, text: "Категории для детей и групп, шаги по количеству, бесплатные билеты для сопровождающих взрослых.", link: { label: Ценовые инструменты →, href: /product/pricing-tools } }
  - type: faq
    id: questions
    eyebrow: Вопросы
    title: О чём первым делом спрашивают продюсеры шоу?
    items:
      - q: Может ли одно событие охватить весь тур?
        a: Да. У сеанса есть город, площадка и схема; итоги и отчёты в CSV доступны по каждому сеансу и по всему событию.
      - q: Как быть с площадкой, на которой мы ещё не играли?
        a: Пришлите её схему в любом читаемом виде, и команда внесёт её в систему. При следующем приезде схема используется снова.
      - q: Наши билеты продают и местные партнёры. Справится ли вход?
        a: Да. Приложение-сканер принимает билеты партнёров из других систем наравне с билетами ArenaSoldOut.com.
      - q: Куда идут деньги?
        a: "На ваш собственный платёжный аккаунт, в вашей валюте, с каждым заказом. Смотрите [платежи](/payments)."
  - type: cta
    id: start
    title: Начните продавать сегодня
    text: Создайте событие, подключите платёжный аккаунт, поделитесь ссылкой.
    primary: { label: Создать событие, href: /start#create }
    secondary: { label: Открыть Telegram-бот, href: https://t.me/EventsCentrBot }
    note: "Есть вопросы? Напишите нам: команда отвечает в течение одного рабочего дня."
