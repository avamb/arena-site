title: "Продажа билетов на сайте WordPress: интеграция"
description: "Интеграция с WordPress: виджет билетов ArenaSoldOut.com на любой странице или в блоке, схема мест, билеты и сканирование от платформы. Деньги идут вам."
h1: Ваш WordPress, ваша касса
lead: Оставьте свой сайт. Виджет билетов встаёт на любую страницу или в блок WordPress тремя строками кода; схема мест, электронный билет и сканирование работают на ArenaSoldOut.com, а покупатели платят на ваш собственный счёт.
related:
  - { label: Где вы продаёте, href: /product/sell }
  - { label: "Разработчикам: виджет и API", href: /developers }
  - { label: Платежи, href: /payments }
sections:
  - type: paycountries
    id: countries
  - type: cards
    id: what
    eyebrow: Для сайтов на WordPress
    title: Что получает ваш сайт на WordPress?
    items:
      - { title: Интеграция с WordPress, text: "Виджет билетов на любой странице, в записи или блоке вашего сайта: покупатели выбирают места и платят, не уходя с него.", link: { label: Разработчикам →, href: /developers } }
      - { title: Три строки кода, text: "Вставьте виджет на страницу или в блок «Произвольный HTML»; покупатели платят на странице оплаты вашего провайдера, заказы видны в Event Center.", link: { label: Разработчикам →, href: /developers } }
      - { title: Переход с другой системы, text: "Сеансы, схемы зала и покупатели переезжают вместе с вами; два клиента уже перешли со своей прежней билетной системы без простоя.", link: { label: Клиенты →, href: /clients } }
      - { title: Схема зала бесплатно, text: "Пришлите PDF, таблицу или набросок от руки, и команда нарисует схему; покупатели выбирают места прямо на вашем сайте.", link: { label: Схемы зала →, href: /product/seating } }
      - { title: Деньги на вашем счёте, text: "Покупатели платят через провайдера вашей страны прямо на ваш собственный счёт; ArenaSoldOut.com деньги не держит.", link: { label: Платежи →, href: /payments } }
      - { title: Промокоды и ранняя цена, text: "Коды с периодом действия и лимитом на покупателя, ранние цены до заданной даты, бесплатные билеты и билеты «заплатите, сколько захотите».", link: { label: Ценовые инструменты →, href: /product/pricing-tools } }
      - { title: Откуда приходят покупатели, text: "Добавьте UTM-метки к ссылкам и смотрите, какой пост, рассылка или партнёр приводит покупателей на ваш сайт.", link: { label: Где вы продаёте →, href: /product/sell } }
      - { title: Продажи в Telegram, text: "Каждая продажа и каждый возврат приходят в вашу группу в Telegram за секунды, с контактом покупателя.", link: { label: Telegram →, href: /product/telegram } }
      - { title: Вход, text: "Электронные билеты с QR-кодом и EAN-13, проверка приложением-сканером MACS для iOS и Android.", link: { label: Приложение-сканер MACS →, href: /product/scanner } }
  - type: faq
    id: questions
    eyebrow: Вопросы
    title: О чём первым делом спрашивают владельцы сайтов на WordPress?
    items:
      - q: Не замедлит ли виджет мой сайт?
        a: Нет. Виджет это веб-компонент, который загружается один раз; страницы открываются так же быстро, как раньше.
      - q: Уходит ли покупатель с моего сайта?
        a: Покупатель остаётся на вашей странице до перехода на страницу оплаты провайдера, а затем возвращается.
      - q: Какие платёжные провайдеры подходят?
        a: "Ваш собственный аккаунт у провайдера вашей страны; список со статусами на [странице платежей](/payments)."
      - q: Кто всё настраивает?
        a: Вы вставляете три строки кода, или команда настроит виджет вместе с администратором вашего сайта на созвоне.
  - type: cta
    id: start
    title: Впереди ваше лучшее событие. Начнём с билетов?
    text: Напишите адрес сайта и провайдера, с которым вы работаете. Мы настроим виджет вместе с вами.
    primary: { label: Начать продавать, href: /start }
    secondary: { label: Создать мероприятие, href: /start#create }
    tertiary: { label: Связаться с командой, href: /contact#write }
