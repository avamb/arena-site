title: "Продажа билетов на WordPress: плагин для WooCommerce"
description: "Плагин ArenaSoldOut.com передаёт заказы в WooCommerce, а схема мест, билеты и сканирование работают на платформе. Или встройте виджет на любую страницу."
h1: Ваш WordPress, ваша оплата
lead: Сохраните свой сайт и свой магазин. Плагин создаёт заказы WooCommerce на каждый билет; схема мест, электронный билет и сканирование приходят от ArenaSoldOut.com. Или встройте виджет на любую страницу двумя строками.
related:
  - { label: Где вы продаёте, href: /product/sell }
  - { label: "Разработчикам: виджет и API", href: /developers }
  - { label: Платежи, href: /payments }
sections:
  - type: cards
    id: what
    eyebrow: Для сайтов на WordPress
    title: Какой вариант подойдёт моему сайту?
    items:
      - { title: Плагин, text: "Заказы попадают в WooCommerce, ваш магазин и отчёты продолжают работать; места, билеты и вход обеспечивает ArenaSoldOut.com.", link: { label: Запросить плагин →, href: /start } }
      - { title: Виджет, text: "Две строки на любой странице или в блоке; покупатели платят на странице оплаты вашего провайдера, заказы видны в Event Center.", link: { label: Разработчикам →, href: /developers } }
      - { title: Переход с ArenaSoldOut.com, text: "Сеансы, схемы зала и клиенты импортированы; два клиента перешли без простоя.", link: { label: Клиенты →, href: /clients } }
  - type: faq
    id: questions
    eyebrow: Вопросы
    title: О чём первым делом спрашивают владельцы сайтов на WordPress?
    items:
      - q: Замедлит ли плагин мой сайт?
        a: Плагин обращается к API ArenaSoldOut.com при оформлении заказа; страницы отображаются как раньше. Виджет это веб-компонент, который загружается один раз.
      - q: Уходит ли покупатель с моего домена?
        a: С виджетом покупатель остаётся на вашей странице до страницы оплаты провайдера, затем возвращается. С плагином оформление заказа это штатный процесс WooCommerce.
      - q: Какие платёжные провайдеры работают?
        a: "Ваш собственный аккаунт у провайдера вашей страны; список со статусами на [странице платежей](/payments). В Израиле для продаж на WordPress сегодня работает AllPay."
      - q: Кто это устанавливает?
        a: Команда может установить и настроить плагин вместе с администратором вашего сайта; виджет устанавливать не нужно.
  - type: cta
    id: start
    title: Начните продавать на своём сайте
    text: Назовите адрес сайта и провайдера, которым вы пользуетесь. Мы настроим плагин или виджет вместе с вами.
    primary: { label: Начать продавать, href: /start }
    secondary: { label: Читать документацию для разработчиков, href: /developers }
    note: Сайты на WooCommerce сохраняют свой магазин.
