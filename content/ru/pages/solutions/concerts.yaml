title: "Продажа билетов на концерты: танцпол, места, ранняя цена"
description: "Продавайте билеты на концерты на своём сайте или странице продаж: квоты на танцпол, категории с местами, ранняя цена, промокоды. Деньги идут вам."
h1: Концерты
lead: Танцпол и места в одном событии, несколько ценовых категорий, окно ранней цены, которое включается в нужную дату, и вход, где сканируется каждый билет. Покупатели платят на ваш собственный счёт с первого билета.
related:
  - { label: Промокоды и ценовые окна, href: /product/pricing-tools }
  - { label: Электронные билеты и сканирование, href: /product/tickets }
  - { label: Фестивали, href: /solutions/festivals }
sections:
  - type: cards
    id: what
    eyebrow: Для концертов
    title: Что важно для концерта?
    items:
      - { title: Танцпол и места вместе, text: "Танцпол с квотой рядом с категориями с местами: одна схема и одна оплата.", link: { label: Схемы зала →, href: /product/seating } }
      - { title: "Ранняя цена, которая переключается сама", text: "Ценовое окно по дате и времени или шаг по количеству: когда первая цена распродана, открывается следующая.", link: { label: Ценовые инструменты →, href: /product/pricing-tools } }
      - { title: Партнёры и промоутеры, text: "Страница для каждого промоутера со своей ссылкой, промокоды для каждого партнёра, все каналы в одном Event Center.", link: { label: Где вы продаёте →, href: /product/sell } }
      - { title: Вход, text: "Приложение-сканер для iOS и Android, EAN-13 и QR на каждом билете, билеты партнёров из других систем тоже принимаются.", link: { label: Приложение-сканер MACS →, href: /product/scanner } }
  - type: faq
    id: questions
    eyebrow: Вопросы
    title: О чём первым делом спрашивают организаторы концертов?
    items:
      - q: Как быстро концерт можно пустить в продажу?
        a: "Без схемы зала: 10 минут после подтверждения вашей организации и подключения платёжного аккаунта (название, дата, цены, афиша). С местами обычно в течение дня, после того как мы бесплатно нарисуем схему по вашему файлу."
      - q: Можно ли продавать VIP-категорию с ограниченной квотой?
        a: Да. У каждой категории своя цена, квота и окно продаж; распроданная категория может передать свои непроданные места следующей.
      - q: Сколько стоит билет для меня?
        a: "Фиксированная сумма за проданный билет, счёт выставляется после сеанса; смотрите [цены](/pricing). Пригласительные и возвраты бесплатны."
      - q: Можно ли видеть продажи в реальном времени?
        a: Да. Каждая продажа попадает в вашу группу в Telegram в течение нескольких секунд и в Event Center с итогами по сеансам и выгрузкой в CSV.
  - type: cta
    id: start
    title: Пустите концерт в продажу сегодня
    text: Создайте событие, подключите платёжный аккаунт, поделитесь ссылкой.
    primary: { label: Создать событие, href: /start#create }
    secondary: { label: Открыть Telegram-бот, href: https://t.me/EventsCentrBot }
    note: "Или напишите нам: мы настроим всё вместе с вами на звонке."
