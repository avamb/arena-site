sections:
  - type: paycountries
    id: countries
  - type: cards
    id: what
    eyebrow: Para anfitriões
    title: O que importa em uma oficina?
    items:
      - { title: Uma cota por data, text: "Doze vagas na terça, vinte no sábado; as datas esgotadas se fecham sozinhas.", link: { label: Ferramentas de preço →, href: /product/pricing-tools } }
      - { title: Datas recorrentes, text: "Adicione sessões ao mesmo evento; preços e categorias são mantidos e o público escolhe a data.", link: { label: Event Center →, href: /#center } }
      - { title: Gratuito e pague quanto quiser, text: "Inscrições gratuitas, ou um preço mínimo e o comprador decide quanto acrescentar.", link: { label: Ferramentas de preço →, href: /product/pricing-tools } }
      - { title: Cupons de desconto e pré-venda, text: "Um cupom para quem já é da casa ou para um parceiro, com limite por comprador; um preço de pré-venda que vale até a data que você definir.", link: { label: Ferramentas de preço →, href: /product/pricing-tools } }
      - { title: Vendas no Telegram, text: "Cada venda e cada reembolso aparecem no seu grupo do Telegram em segundos, com o contato do comprador.", link: { label: Telegram →, href: /product/telegram } }
      - { title: De onde vêm as pessoas, text: "Adicione parâmetros UTM aos seus links e veja qual post, newsletter ou parceiro traz as inscrições.", link: { label: Onde você vende →, href: /product/sell } }
      - { title: Seu idioma, text: "Página, widget, e-mail e ingresso no idioma do comprador, inclusive hebraico da direita para a esquerda.", link: { label: Ingressos →, href: /product/tickets } }
      - { title: "Mudança de data? Você decide", text: "Reembolse todos, ofereça uma nova data ou escolha outra solução. Os participantes recebem um e-mail com o ingresso atualizado.", link: { label: Ingressos →, href: /product/tickets } }
      - { title: "Sem assinatura, sem pagamentos extras", text: "Sem assinatura e sem pagamentos mensais ou anuais: uma comissão por ingresso pago, e as inscrições gratuitas não custam nada.", link: { label: Preços →, href: /pricing } }
  - type: faq
    id: questions
    eyebrow: Perguntas
    title: O que os anfitriões perguntam primeiro?
    items:
      - q: Não tenho site. Onde as pessoas compram?
        a: "Em uma página hospedada, tickets.arenasoldout.com/seu-nome/seu-evento, pronta em minutos. Compartilhe o link em mensageiros e redes sociais."
      - q: Posso cobrar apenas um sinal?
        a: Defina o preço do ingresso como o valor do sinal e receba o resto no local; ou use pague quanto quiser com um valor mínimo.
      - q: Os compradores recebem um lembrete?
        a: Os compradores recebem o ingresso por e-mail e um e-mail quando uma data muda ou é cancelada. Lembretes antes da data não são enviados hoje.
      - q: Quanto custa?
        a: "Um valor fixo por ingresso pago; inscrições gratuitas não custam nada. Veja os [preços](/pricing)."
  - type: cta
    id: start
    title: Seu melhor evento ainda está por vir. Vamos começar pelos ingressos?
    text: Crie o evento, conecte sua conta de pagamentos e compartilhe o link.
    primary: { label: Começar a vender, href: /start }
    secondary: { label: Criar seu evento, href: /start#create }
    tertiary: { label: Fale com a equipe, href: /contact#write }
