title: "Ingressos para casas de show: um mapa, condições separadas"
description: "Para locais permanentes e casas de show: um mapa reutilizado em cada evento, muitos eventos por mês, leitura na portaria, porcentagem do preço em vez de taxa."
h1: Locais e casas de show
lead: "Seu próprio local, muitos eventos por mês. O mapa é feito uma vez e reutilizado, cada promotor que aluga o local vende pela sua página ou pela dele, e as condições são diferentes: uma porcentagem do preço do ingresso em vez da taxa por ingresso."
related:
  - { label: Preços e condições detalhadas, href: /pricing }
  - { label: Mapas de assentos, href: /product/seating }
  - { label: Teatro, href: /solutions/theatre }
sections:
  - type: cards
    id: what
    eyebrow: Para locais
    title: O que importa em um local?
    items:
      - { title: "Um mapa, todos os eventos", text: "Feito uma vez a partir do seu arquivo e reutilizado em cada evento; versões para as disposições de palco.", link: { label: Mapas de assentos →, href: /product/seating } }
      - { title: Promotores que alugam o local, text: "Uma página por promotor com link próprio; o local vê todos os eventos e o promotor vê os seus.", link: { label: Onde você vende →, href: /product/sell } }
      - { title: Condições separadas, text: "Dois por cento do preço do ingresso em vez da taxa por ingresso, sem taxa sobre convites e reembolsos, condições por volume sob consulta.", link: { label: Preços →, href: /pricing } }
      - { title: A portaria, text: "Aplicativo leitor para iOS e Android, leitores de mão, ingressos de parceiros vindos de outros sistemas aceitos.", link: { label: Aplicativo leitor MACS →, href: /product/scanner } }
  - type: faq
    id: questions
    eyebrow: Perguntas
    title: O que donos de locais perguntam primeiro?
    items:
      - q: Quais são as condições para um local permanente?
        a: "Uma porcentagem do preço do ingresso em vez da taxa por ingresso, sem taxa sobre convites e reembolsos. O número está na [página de preços](/pricing); condições por volume e individuais sob consulta."
      - q: Um promotor pode vender nossos eventos no site dele?
        a: Sim, com o widget no site dele ou com uma página de promotor que hospedamos. As vendas de todos os canais aparecem no Event Center do local.
      - q: Podemos migrar de outro sistema de venda de ingressos?
        a: "Sim. Sessões, mapas de assentos e clientes foram importados do ArenaSoldOut.com para dois clientes sem nenhuma interrupção; outros sistemas pela API de pacote de eventos. Veja [desenvolvedores](/developers)."
      - q: Quem opera o Event Center?
        a: Sua equipe, com funções. O local é dono da organização; os gerentes veem o que você permitir.
  - type: cta
    id: start
    title: Fale conosco
    text: Conte-nos sobre o local e o número de eventos por mês. Desenhamos o mapa de graça e combinamos as condições do local.
    primary: { label: Fale conosco, href: /start }
    secondary: { label: Ver preços, href: /pricing }
    note: "Dúvidas? Escreva para nós: a equipe responde em até um dia útil."
