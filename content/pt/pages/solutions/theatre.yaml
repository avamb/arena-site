sections:
  - type: paycountries
    id: countries
  - type: cards
    id: what
    eyebrow: Para teatros
    title: O que importa em um teatro?
    items:
      - { title: O mapa é seu, text: "Plateia, camarotes, balcão, categorias por preço. Envie um PDF, uma planilha ou um croqui à mão e a equipe desenha o mapa de graça; as versões mantêm os ingressos vendidos seguros quando a disposição muda.", link: { label: Mapas de assentos →, href: /product/seating } }
      - { title: Datas repetidas, text: "Adicione apresentações ao mesmo evento; o mapa, os preços e as categorias são mantidos, e o público escolhe a data.", link: { label: Event Center →, href: /#center } }
      - { title: Convites sem comissão, text: "Ingressos gratuitos para assentos exatos, para imprensa, parceiros e elenco, lidos na entrada como qualquer outro ingresso.", link: { label: Ingressos →, href: /product/tickets } }
      - { title: Sua própria bilheteria, text: "Venda no seu site com o widget ou na página hospedada; o dinheiro vai direto para a sua própria conta.", link: { label: Onde você vende →, href: /product/sell } }
      - { title: Cupons de desconto e pré-venda, text: "Cupons para assinantes, escolas ou parceiros, com período de validade e limite por comprador; um preço de pré-venda que vale até a data que você definir.", link: { label: Ferramentas de preço →, href: /product/pricing-tools } }
      - { title: "Mudança de data? Você decide", text: "Reembolse todos, ofereça uma nova data ou escolha outra solução. Os compradores recebem um e-mail com o ingresso atualizado.", link: { label: Ingressos →, href: /product/tickets } }
      - { title: Vendas no Telegram, text: "Cada venda e cada reembolso aparecem no seu grupo do Telegram em segundos, com o contato do comprador.", link: { label: Telegram →, href: /product/telegram } }
      - { title: A portaria, text: "O aplicativo leitor MACS para iOS e Android confere cada ingresso. Um QR code impresso na entrada, com link curto de compra, permite que quem deixou para a última hora compre ali mesmo.", link: { label: Aplicativo leitor MACS →, href: /product/scanner } }
      - { title: Sua taxa de serviço é sua, text: "Acrescente a sua própria taxa de serviço ao preço do ingresso; ela vai inteira para você.", link: { label: Preços →, href: /pricing } }
  - type: faq
    id: questions
    eyebrow: Perguntas
    title: O que os teatros perguntam primeiro?
    items:
      - q: Vocês desenham o mapa de assentos?
        a: Sim, sem custo. Envie um PDF do mapa, uma foto de um croqui à mão ou uma tabela de fileiras com os assentos de cada uma; nós o desenhamos no seu evento, em geral em até um dia, e você o aprova antes de as vendas começarem.
      - q: Podemos ter preços diferentes para a plateia e o balcão?
        a: Sim. Categorias com preços, cotas e janelas próprios; as janelas de lote promocional trocam por data.
      - q: Temos muitas apresentações por mês. Existe outra condição?
        a: "Sim. Locais permanentes recebem uma porcentagem do preço do ingresso em vez da taxa por ingresso; veja [locais](/solutions/venues) e [preços](/pricing)."
      - q: Os compradores podem escolher assentos no celular?
        a: Sim, o mapa de assentos funciona no celular com zoom por pinça, no idioma do comprador.
  - type: cta
    id: start
    title: Seu melhor evento ainda está por vir. Vamos começar pelos ingressos?
    text: "Um PDF, uma foto de um croqui à mão ou uma tabela de fileiras e assentos bastam. Nós o desenhamos no seu evento sem custo e o mostramos a você antes de as vendas começarem."
    primary: { label: Começar a vender, href: /start }
    secondary: { label: Criar seu evento, href: /start#create }
    tertiary: { label: Fale com a equipe, href: /contact#write }
