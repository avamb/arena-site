sections:
  - type: prose
    id: text
    body: |
      ## Onde ficam os seus dados

      - A plataforma roda em servidores da Hetzner na UE.
      - O tráfego para a plataforma passa pela Cloudflare e é criptografado com HTTPS.
      - Os backups do banco de dados são feitos a cada três horas e toda noite, e copiados para um armazenamento separado na UE.

      ## Pagamentos

      - Os dados do cartão nunca chegam aos nossos servidores. Os compradores pagam na página hospedada do provedor de pagamentos.
      - Cada organizador conecta a sua própria conta de pagamentos, então o dinheiro dos ingressos vai para o organizador, sem passar por nós.

      ## Separação entre organizadores

      - Os eventos, pedidos e clientes de cada organizador ficam isolados dos demais. O acesso é verificado a cada solicitação.
      - Os membros da equipe têm funções (proprietário, gerente). Os gerentes não podem alterar as configurações de pagamento, a cobrança nem o acesso da equipe.
      - As chaves de API são limitadas a uma organização e nunca podem ter permissões de toda a plataforma.

      ## Proteção contra abusos

      - Os formulários públicos usam proteção contra bots. Login, compra e APIs públicas têm limites de frequência.
      - As chamadas de webhook dos provedores de pagamento são verificadas por assinatura.
      - As ações sensíveis são registradas em um log de auditoria.

      ## Ingressos

      - Cada ingresso tem um código de barras aleatório e único, que não dá para adivinhar a partir do ingresso ao lado. As leituras são validadas com os nossos registros.

      ## Monitoramento e recuperação

      - Monitoramos o fluxo de vendas, os envios com falha e os erros do sistema, e recebemos alertas automáticos.
      - Se um incidente grave afetar os seus dados, avisaremos os organizadores afetados sem demora injustificada e de acordo com o RGPD.

      ## Seus dados e privacidade

      - Tratamos os dados dos compradores em nome do organizador. Veja a nossa [Política de Privacidade](/legal/privacy).
      - Você pode pedir a exportação ou a exclusão dos seus dados a qualquer momento.

      ## Relatar uma vulnerabilidade

      Encontrou um problema de segurança? Escreva para support@arenasoldout.com com os detalhes. Respondemos a todos os relatos.
