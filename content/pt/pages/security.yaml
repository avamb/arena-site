title: "Segurança no ArenaSoldOut.com"
description: "Como o ArenaSoldOut.com protege os dados de organizadores e compradores: hospedagem na UE, pagamentos na página do provedor, separação entre organizadores."
h1: "Segurança no ArenaSoldOut.com"
lead: "Cuidamos da venda de ingressos e dos dados de contato dos compradores de organizadores de eventos, por isso tratamos a segurança de forma prática e concreta. Veja o que fazemos hoje."
