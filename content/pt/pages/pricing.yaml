      buy: { label: Comprar, currency: Pagar em, none: Fale conosco, noneHref: /contact, note: "No checkout, o Stripe pede o e-mail com o qual sua organização está registrada no ArenaSoldOut.com. Informe exatamente esse e-mail: os créditos são adicionados à organização a que ele pertence. Ainda não tem organização? Informe o e-mail com o qual você vai se registrar, e os créditos ficarão vinculados a ele." }
