  - type: cards
    id: services
    eyebrow: Serviços extras
    title: O que mais posso contratar?
    lead: "Não fazem parte da comissão por ingresso. Cada um é contratado separadamente."
    items:
      - title: Gerente de eventos
        text: "Sem tempo para configurar os eventos sozinho? Uma pessoa da nossa equipe trabalha como parte da sua: cria eventos e sessões, confere preços, categorias e o mapa de assentos antes das vendas, extrai os relatórios de que você precisa, envia convites e reenvia ingressos. Pago à parte; as condições são combinadas com cada organizador."
        link: { label: Escreva para nós, href: /contact }
      - title: White label
        text: "Venda sem a linha Tickets: ArenaSoldOut.com: €45 por mês por marca ou local em países da UE, US$45 em todos os outros países."
        link: { label: Condições, href: /pricing/terms }
      - title: Desenho do mapa de assentos
        text: "Grátis. Envie um PDF, uma foto de um croqui à mão ou uma tabela de fileiras e assentos, e desenhamos o mapa, em geral em um dia."
        link: { label: Mapas de assentos, href: /product/seating }
  - type: faq
    id: questions
    eyebrow: Perguntas sobre dinheiro
    title: Quanto custa exatamente um ingresso para mim?
    items:
      - q: Quanto custa um ingresso com assento?
        a: "Pagando depois do evento: US$1,18 fora da UE, €1,05 na UE. Um ingresso sem assento custa US$0,62 ou €0,55. O mapa de assentos em si não custa nada: nós o desenhamos de graça a partir de um PDF, de uma foto de um esboço à mão ou de uma tabela de fileiras e assentos. Com créditos a comissão é menor, e um assento acrescenta US$0,35 (€0,31) à taxa dos créditos."
      - q: Como funcionam os créditos?
        a: "Você compra um pacote de créditos uma vez. Cada ingresso vendido desconta sua comissão dos seus créditos, na taxa do pacote, até que acabem. Os créditos nunca expiram, podem ser recarregados a qualquer momento e são usados apenas nos nossos serviços: não podem ser sacados nem transferidos."
      - q: E se os créditos acabarem no meio das vendas?
        a: As vendas não param. Os ingressos que seus créditos não cobriram entram na fatura habitual pelo preço do pagamento depois do evento.
      - q: Existe recarga automática?
        a: Sim. Você pode ativá-la e, quando seus créditos caírem abaixo do seu limite, o próximo pacote é comprado para você.
      - q: Para onde vai o dinheiro do comprador?
        a: "Para a sua própria conta de pagamentos, a cada pedido. O ArenaSoldOut.com nunca retém valores. O comprador paga o preço do ingresso e, se você adicionar, a sua taxa de serviço."
      - q: Quando eu pago ao ArenaSoldOut.com?
        a: "Depois do evento, por transferência bancária, pelos ingressos vendidos. Para eventos à venda por vários meses e para locais permanentes, uma vez por mês. Os créditos são pagos na compra."
      - q: E a adquirência de cartões?
        a: A adquirência de cartões é um contrato entre você e o seu provedor de pagamentos, nas condições dele. Ela não faz parte da nossa comissão e não acrescentamos nada a ela.
      - q: Preciso mencionar o ArenaSoldOut.com no meu site?
        a: "Os preços pressupõem que a página do evento cite o ArenaSoldOut.com como operador da venda de ingressos, com um link para nós; o widget de ingressos exibe essa linha por padrão. Para vender sem o nosso nome, o white label custa €45 por mês por marca ou local em países da UE e US$45 por mês por marca ou local em todos os outros países, cobrado por dia em um mês incompleto. As [condições detalhadas](/pricing/terms) explicam o que é uma marca e o que o white label oculta."
      - q: Há desconto para entidades beneficentes?
        a: "Sim. Entidades beneficentes registradas pagam 50% da nossa comissão, no pague conforme usa e com créditos. Escreva para nós pela [página de contato](/contact) e ativamos o desconto para a sua organização."
      - q: Os convites são grátis?
        a: Sim. Convites e ingressos gratuitos em eventos pagos não têm comissão.
      - q: O que acontece com a comissão quando um ingresso é reembolsado ou a data muda?
        a: "O comprador recebe o reembolso de você. A comissão de uma venda que já ocorreu permanece, e não cobramos comissão separada pelo processamento do reembolso, pela mudança de data nem pelos e-mails aos compradores. As condições do próprio provedor de pagamentos são do provedor."
      - q: E se eu cancelar o evento?
        a: "A comissão já cobrada não é devolvida em dinheiro. Escreva para nós sobre o seu caso antes de cancelar o evento."
      - q: Um dos meus ingressos custa mais de US$10 (€10 na UE), o resto é barato. Qual preço vale?
        a: "O padrão, para todos os ingressos do evento: a taxa menor exige que todos os ingressos de todas as categorias e faixas de preço custem US$10 ou menos (€10 na UE). Um ingresso de US$5 ao lado de um de US$25 fica no preço padrão."
      - q: Tenho um local e realizo muitos eventos por mês. Existe outra condição?
        a: "Sim. Donos de locais permanentes (teatros, clubes, estádios, circos e outros espaços que realizam eventos por conta própria, o ano todo ou por temporada) pagam {percent}% do preço do ingresso, calculado após os códigos promocionais e sem a sua taxa de serviço. A comissão por ingresso é limitada a US$1,18 (€1,09 na UE), igual com e sem assento. Convites não têm comissão. Cobramos mensalmente. Nossa equipe ativa o status de local: escreva para nós pela [página de contato](/contact). As condições completas estão nas [condições detalhadas](/pricing/terms)."

