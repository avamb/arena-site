      - { what: "Processamento de cartões", us: "Pago ao seu próprio provedor de pagamentos", them: "2,9% + 30¢ por transação" }
      - { what: "Quando você recebe o dinheiro", us: "A cada pedido, na sua própria conta", them: "Toda semana, às quartas-feiras, após a verificação de identidade" }
      - { what: "Preços em euros (UE)", us: "**{eurPrice}**, **{eurSeated}** com assento", them: "Pagamentos próprios: apenas dólares americanos e dólares canadenses" }
