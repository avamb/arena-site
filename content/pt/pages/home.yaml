  - type: money
    id: money
    eyebrow: Dinheiro
    title: Os compradores pagam a você. Não a nós.
    lead: 100% de cada venda vai para você. O comprador paga o preço do ingresso, e a taxa de serviço se você acrescentar uma, direto na sua própria conta de pagamentos, na sua moeda, no seu extrato. O ArenaSoldOut.com nunca retém o seu dinheiro. Você paga ao ArenaSoldOut.com a comissão da plataforma por ingresso vendido, depois do evento ou a partir de um pacote pré-pago. Reembolsos e estornos são decisão sua, não uma política da plataforma.
    flowAria: Fluxo de pagamento
    nodes:
      - { label: Comprador, sub: "cartão, Apple Pay, Google Pay" }
      - { label: Seu site, sub: ou a página de vendas que hospedamos }
      - { label: ArenaSoldOut.com, sub: "pedido, assentos, ingresso" }
      - { label: Sua conta de pagamentos, providers: true, highlight: true }
      - { label: Seu banco, sub: no prazo do provedor }
    note: Você paga ao ArenaSoldOut.com a comissão da plataforma por ingresso vendido. Nada é descontado das suas vendas, nada é retido.

