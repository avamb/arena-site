  - type: reasons
    id: why
    eyebrow: Por que o ArenaSoldOut.com
    title: Por que os organizadores vendem ingressos conosco?
    lead: "Quatro motivos, cada um com os fatos por trás."
    items:
      - icon: wallet
        title: Você fica com mais de cada ingresso
        text: "Uma tarifa fixa de **{price}** por ingresso, e não uma porcentagem da sua receita: um ingresso de US$15 e um de US$150 custam o mesmo para você. Os compradores pagam na sua própria conta de pagamentos, então o dinheiro é seu no momento em que pagam, não depois do evento."
        bullets:
          - Nada é descontado das suas vendas, nenhuma reserva é retida
          - Sem comissão sobre convites e ingressos gratuitos
          - Seu mapa de assentos desenhado por nós, de graça
        link: { label: Preços e a calculadora →, href: /pricing }
      - icon: clock
        title: À venda em 10 minutos
        text: "Depois que sua organização for confirmada, em geral em até um dia, um evento sem mapa de assentos entra à venda em **10 minutos**, se você já tem conta em um provedor de pagamentos. Você conecta essa conta uma vez; cada evento seguinte só precisa de nome, datas e preços."
        link: { label: "Seu primeiro evento, passo a passo →", href: /first-event }
      - icon: list-checks
        title: O que os organizadores pedem, já pronto
        text: "Sem módulos para comprar, sem plugins para instalar:"
        bullets:
          - Widget no seu site, ou uma página de vendas hospedada por nós
          - Assentos e lugares em pé no mesmo evento
          - Códigos promocionais, preços que mudam por data
          - Convites, reembolsos, datas alteradas com e-mails aos compradores
          - Aplicativo de leitura de ingressos para iOS e Android
          - Cada venda no seu grupo do Telegram em segundos
        link: { label: As respostas em detalhe →, href: "#answers" }
      - icon: shield-check
        title: Vendendo ingressos desde {since}
        text: "Organizadores em **{countries}** países desde {since}: shows, teatros, festivais, espetáculos, master classes. **800** pedidos por minuto em testes de carga, backups criptografados toda noite, um monitor que avisa a equipe antes que você perceba."
        link: { label: Clientes e depoimentos →, href: /clients }

  - type: steps
    id: how
    eyebrow: Como funciona
    title: À venda hoje. Três perguntas que os organizadores fazem primeiro.
    items:
      - title: Com que rapidez posso entrar à venda?
        text: "Um evento sem mapa de assentos entra à venda em 10 minutos depois que sua organização for confirmada e sua conta de pagamentos estiver conectada; você a conecta uma vez. Para um local com assentos marcados, envie o seu mapa: nós o desenhamos de graça, em geral em até um dia."
      - title: O que eu preciso?
        text: "O nome e a programação do evento, os preços dos ingressos, o seu cartaz e a sua própria conta de pagamentos: Stripe, Flitt, AllPay ou outro provedor do seu país. O dinheiro vai para você desde o primeiro ingresso."
      - title: De que forma eu configuro?
        text: "No navegador, no computador ou no celular, no “Event Center”*. Ou no Telegram, onde o bot lê o seu cartaz e preenche datas, preços e o local para você confirmar. Ou envie para nós e configuramos por você."
    note: "* O “Event Center” é a sua conta de organizador no ArenaSoldOut.com: cada evento, pedido, reembolso, convite e sessão, para você e sua equipe, no navegador e no Telegram. [Veja o Event Center abaixo →](#center) Cada etapa, do cadastro ao leitor de ingressos: [seu primeiro evento →](/first-event)"

  - type: ways
    id: where
    eyebrow: Onde você vende
    title: No seu site, ou no nosso. O dinheiro vai para você de qualquer forma.
    items:
      - title: Você tem um site
        text: "O seu site é o checkout. Incorpore o widget de ingressos em qualquer página: WordPress, Tilda, Wix, Webflow ou código próprio. Os compradores nunca saem do seu domínio."
        bullets:
          - Widget em qualquer site, três linhas de código
          - Plugin do WordPress com pedidos do WooCommerce
          - Suas cores, suas fontes, seu idioma
      - title: Você não tem um site
        text: "Nós hospedamos a página de vendas: tickets.arenasoldout.com/your-name/your-event. Compartilhe um só link nas redes sociais, nos mensageiros e no cartaz."
        bullets:
          - Uma página por organizador e por evento
          - Uma página separada para cada promotor
          - Pronta em minutos, sem trabalho de design
          - Links para os seus parceiros de venda na mesma página

  - type: qa
    id: answers
    eyebrow: O que os organizadores perguntam em seguida
    title: Sim. E veja como.
    items:
      - title: Posso usar códigos promocionais?
        text: Sim. Um código pode valer para um evento, uma sessão ou uma categoria, com período de validade, mínimo e limite por comprador.
      - title: Os preços podem mudar em uma data que eu defino?
        text: Sim. Os períodos de pré-venda mudam por data e hora. Os lotes por quantidade abrem o próximo preço quando o atual esgota.
        visual:
          type: ladder
          rungs:
            - { price: US$24, width: 100, label: primeiros 100 · vendido }
            - { price: US$119, width: 62, label: próximos 150 · à venda }
            - { price: US$599, width: 0, label: abre depois, next: true }
      - title: Vários preços para um evento?
        text: Sim. Categorias com preço, cota e período de venda próprios, além de ingressos gratuitos e de valor livre.
      - title: Posso acrescentar uma taxa de serviço?
        text: Sim. Uma porcentagem por canal de venda, mostrada ao comprador em uma linha separada e paga na sua conta junto com o ingresso. Verifique se o seu país permite uma taxa de serviço na venda de ingressos.
      - title: Com assentos e sem?
        text: "Sim, e os dois no mesmo evento: um mapa de assentos com categorias, áreas em pé com cotas. Envie o mapa do seu local e nós o desenhamos no sistema de graça, em geral em até um dia: basta um PDF, uma foto de um esboço à mão ou uma tabela de fileiras com os assentos de cada fileira (Excel ou Google Sheets). Você nunca precisa inseri-lo à mão."
        visual:
          type: plan
          aria: Mapa de local com plateia, dois camarotes, um balcão e uma área em pé
          stage: Palco
          parterre: Plateia · 312
          logeLeft: Camarote E · 48
          logeRight: Camarote D · 48
          balcony: Balcão · 180
          standing: Em pé
      - title: Um leitor de ingressos funciona com os ingressos?
        text: Sim. Cada ingresso é um PDF com código de barras EAN-13 e um QR, no idioma do comprador. Leia na entrada com o aplicativo de leitura para iOS e Android ou com um leitor portátil. O aplicativo também aceita ingressos vendidos pelos seus parceiros em outros sistemas.
        visual:
          type: ticket
          event: Autumn Jazz Night
          meta: Sex, 24 out · 19:30 · Palác Akropolis
          seat: Plateia · Fileira G · Assento 7
          code: "2173049188256"
      - title: Como vejo as minhas vendas?
        text: "No seu “Event Center”, sua própria conta neste site: abra no celular ou no computador, sem nada para instalar. Todos os seus eventos, cada pedido, reembolsos e totais por sessão, visíveis apenas para você e sua equipe. Prefere o Telegram? Cada venda e cada reembolso também chega ao seu grupo do Telegram em segundos, com o contato do comprador. [Veja o Event Center abaixo →](#center)"
        visual:
          type: telegram
          from: ArenaSoldOut.com
          lines:
            - "**Pago** · Autumn Jazz Night · Sex, 24 out"
            - Fileira G 7–8 · Plateia
            - "**€76,00** · Anna K. · +420 ••• 41 18"
          time: "19:42"
      - title: Reembolsos, convites, mudanças de data?
        text: "Sim, pela sua conta do “Event Center”. Reembolse um ingresso, emita convites, mova ou cancele uma sessão: os compradores recebem um e-mail no seu idioma com o ingresso atualizado."
      - title: Aguenta um estádio?
        text: Sim. 800 pedidos por minuto com 1.000 compradores na página ao mesmo tempo em testes de carga, backups criptografados toda noite, um monitor que nos avisa antes que você perceba.

