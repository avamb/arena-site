  - type: steps
    id: how
    eyebrow: Como funciona
    title: À venda hoje. Três perguntas que os organizadores fazem primeiro.
    items:
      - title: Com que rapidez posso entrar à venda?
        text: "Um evento sem mapa de assentos entra à venda em 10 minutos depois que sua organização for confirmada e sua conta de pagamentos estiver conectada; você a conecta uma vez. Para um local com assentos marcados, envie o seu mapa: nós o desenhamos de graça, em geral em até um dia."
      - title: O que eu preciso?
        text: "O nome e a programação do evento, os preços dos ingressos, o seu cartaz e a sua própria conta de pagamentos: Stripe, Flitt, AllPay ou outro provedor do seu país. O dinheiro vai para você desde o primeiro ingresso."
      - title: De que forma eu configuro?
        text: "No navegador, no computador ou no celular, no “Event Center”*. Ou no Telegram, onde o bot lê o seu cartaz e preenche datas, preços e o local para você confirmar. Sem tempo? O nosso [gerente de eventos](/pricing#services) faz isso por você, como serviço pago."
    note: "* O “Event Center” é a sua conta de organizador no ArenaSoldOut.com: cada evento, pedido, reembolso, convite e sessão, para você e sua equipe, no navegador e no Telegram. [Veja o Event Center abaixo →](#center) Cada etapa, do cadastro ao leitor de ingressos: [seu primeiro evento →](/first-event)"

  - type: ways
    id: where
    eyebrow: Onde você vende
    title: No seu site, na nossa página, em sites de parceiros e nas redes sociais. O dinheiro vai para você de qualquer jeito.
    items:
      - title: Seu site
        text: "O seu site é o checkout. Incorpore o widget de ingressos em qualquer página: WordPress, Tilda, Wix, Webflow ou código próprio. Os compradores nunca saem do seu domínio."
        bullets:
          - Widget em qualquer site, três linhas de código
          - Integração com WordPress
          - Suas cores, suas fontes, seu idioma
      - title: Nossa página de vendas
        text: "Nós hospedamos a página de vendas: tickets.arenasoldout.com/your-name/your-event. Um só link para o cartaz, a newsletter e os mensageiros."
        bullets:
          - Uma página por organizador e por evento
          - Pronta em minutos, sem trabalho de design
          - Links para os seus parceiros de venda na mesma página
      - title: Sites de parceiros
        text: "O mesmo widget vai para o site de uma casa de show, de um produtor ou de uma agência. Cada produtor ganha a sua própria página de vendas e o seu próprio link."
        bullets:
          - Widget no site de um parceiro
          - Uma página e um link separados para cada produtor
          - Todas as vendas dos parceiros em um só Event Center
      - title: Redes sociais e mensageiros
        text: "Um link de vendas no Instagram, no Facebook, no Telegram e no WhatsApp, no cartaz e na newsletter. Um QR code com link curto na entrada: as pessoas escaneiam e compram o ingresso na hora."
        bullets:
          - Um só link para todos os canais
          - Um QR code no cartaz e na entrada
          - Origem das vendas pelos parâmetros UTM

  - type: qa
    id: answers
    eyebrow: Recursos
    title: Tudo de que um organizador precisa, em uma só plataforma
    more: { label: Todos os recursos →, href: /features }
    items:
      - title: Cupons de desconto
        text: Um cupom pode valer para um evento, uma sessão ou uma categoria, com período de validade, valor mínimo e limite por comprador.
      - title: Preços que mudam sozinhos
        text: Os períodos de pré-venda mudam por data e hora. Os lotes por quantidade abrem o próximo preço quando o atual esgota.
        visual:
          type: ladder
          rungs:
            - { price: US$24, width: 100, label: primeiros 100 · vendido }
            - { price: US$119, width: 62, label: próximos 150 · à venda }
            - { price: US$599, width: 0, label: abre depois, next: true }
      - title: Categorias e ingressos gratuitos
        text: Categorias com preço, cota e período de venda próprios, além de ingressos gratuitos e de valor livre.
      - title: Sua própria taxa de serviço
        text: Uma porcentagem por canal de venda, mostrada ao comprador em uma linha separada e paga na sua conta junto com o ingresso, inteiramente sua. Verifique se o seu país permite uma taxa de serviço na venda de ingressos.
      - title: Lugares marcados e em pé
        text: "Um mapa de assentos com categorias e áreas em pé com cotas, no mesmo evento. Envie o mapa do seu local e nós o desenhamos no sistema de graça, em geral em até um dia: basta um PDF, uma foto de um esboço à mão ou uma tabela de fileiras com os assentos de cada fileira (Excel ou Google Sheets). Você nunca precisa inseri-lo à mão."
        visual:
          type: plan
          aria: Mapa de local com plateia, dois camarotes, um balcão e uma área em pé
          stage: Palco
          parterre: Plateia · 312
          logeLeft: Camarote E · 48
          logeRight: Camarote D · 48
          balcony: Balcão · 180
          standing: Em pé
      - title: Ingressos e entrada
        text: Cada ingresso é um PDF com código de barras EAN-13 e um QR, no idioma do comprador. Leia na entrada com o aplicativo de leitura para iOS e Android ou com um leitor portátil. O aplicativo também aceita ingressos vendidos pelos seus parceiros em outros sistemas.
        visual:
          type: ticket
          event: Autumn Jazz Night
          meta: Sex, 24 out · 19:30 · Palác Akropolis
          seat: Plateia · Fileira G · Assento 7
          code: "2173049188256"
      - title: Vendas em tempo real
        text: "No seu “Event Center”, sua própria conta neste site: abra no celular ou no computador, sem nada para instalar. Todos os seus eventos, cada pedido, reembolsos e totais por sessão, visíveis apenas para você e sua equipe. Os parâmetros UTM mostram de onde vêm os compradores. Prefere o Telegram? Cada venda e cada reembolso também chega ao seu grupo do Telegram em segundos, com o contato do comprador. [Veja o Event Center abaixo →](#center)"
        visual:
          type: telegram
          from: ArenaSoldOut.com
          lines:
            - "**Pago** · Autumn Jazz Night · Sex, 24 out"
            - Fileira G 7–8 · Plateia
            - "**€76,00** · Anna K. · +420 ••• 41 18"
          time: "19:42"
      - title: Reembolsos, convites, mudanças de data
        text: "Tudo pela sua conta do “Event Center”: reembolse um ingresso, emita convites, mude ou cancele uma sessão. Se um evento for cancelado ou remarcado, você decide o que acontece com o dinheiro: reembolsar todos ou oferecer uma nova data. Os compradores recebem um e-mail no idioma deles com o ingresso atualizado."
      - title: Confiabilidade
        text: 800 pedidos por minuto com 1.000 compradores na página ao mesmo tempo em testes de carga, backups criptografados toda noite, um monitor que acompanha a plataforma 24 horas por dia.
      - title: Um QR code na entrada
        text: Imprima um QR code com um link curto de compra e coloque na entrada. As pessoas escaneiam e compram o ingresso na hora, mesmo que tenham chegado sem ele.
      - title: API sob consulta
        text: A API, os webhooks e a importação de eventos em uma só chamada são configurados sob consulta, quando as suas vendas precisam se conectar ao seu próprio sistema.

