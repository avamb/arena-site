  - type: faq
    id: faq
    eyebrow: Perguntas
    title: O que os organizadores perguntam
    items:
      - q: Quanto custa para começar?
        a: "Nada. Não há assinatura nem pagamentos extras mensais ou anuais. Você paga uma comissão por ingresso vendido, a partir de {usdPrice}. Convites e ingressos gratuitos não têm comissão. [Preços e a calculadora →](/pricing)"
      - q: Existe algum pagamento extra, mensal ou anual?
        a: Não. Nenhum pagamento mensal ou anual, nenhuma assinatura. Você paga apenas uma comissão por ingresso vendido.
      - q: Vendo ingressos pelo WhatsApp e os compradores me ligam. Para que eu preciso de uma plataforma de ingressos?
        a: "Para não precisar mais anotar cada pedido à mão. Os compradores escolhem os assentos e pagam a qualquer hora, até de madrugada; o dinheiro vai direto para a sua conta e o ingresso com QR code chega ao e-mail do comprador. Você pode continuar compartilhando o link de vendas no WhatsApp: o seu tempo vai para o evento, não para mensagens e listas."
      - q: Quem paga a taxa de serviço, eu ou o comprador?
        a: Você decide. Você pode acrescentar a sua própria taxa de serviço ao preço do ingresso, e ela chega inteira para você junto com o pagamento. A nossa comissão por ingresso continua a mesma.
      - q: Quando recebo o dinheiro?
        a: A cada pedido. O comprador paga direto na sua conta de pagamentos; o ArenaSoldOut.com nunca retém o dinheiro. Os repasses para o seu banco seguem o calendário do seu provedor.
      - q: Posso colocar a venda de ingressos no meu próprio site?
        a: "Sim. O widget de ingressos entra em qualquer página com três linhas de código: WordPress, Tilda, Wix, Webflow ou código próprio. Os compradores escolhem assentos e ingressos ali mesmo, no seu site. [Para desenvolvedores →](/developers)"
      - q: Como funciona o controle de acesso no dia do evento?
        a: "Cada ingresso é um PDF com QR code e código de barras EAN-13. Na entrada, o aplicativo MACS para iOS e Android lê os ingressos em um celular comum; um leitor portátil também funciona. O aplicativo também aceita ingressos vendidos pelos seus parceiros em outros sistemas. [Aplicativo leitor MACS →](/product/scanner)"
      - q: As pessoas podem comprar ingresso na própria entrada?
        a: Sim. Imprima um QR code com um link curto de compra e coloque na entrada. As pessoas escaneiam com o celular e compram o ingresso na hora.
      - q: O que acontece se o evento for cancelado ou remarcado?
        a: Você decide. Reembolse todos os compradores, ofereça uma nova data em vez do reembolso ou escolha outra opção. Os compradores recebem um e-mail no idioma deles com o ingresso atualizado.
      - q: Consigo ver de onde vêm os compradores?
        a: Sim. Adicione parâmetros UTM aos seus links de venda e o Event Center mostra qual canal trouxe os pedidos.
      - q: Nunca vendi ingressos. Isso é para mim?
        a: "Sim. Mostramos tudo passo a passo: [seu primeiro evento →](/first-event). Desenhamos o seu mapa de assentos de graça. Sem tempo? Nosso [gerente de eventos](/pricing#services) faz isso por você, como serviço pago."
      - q: Como falo com a equipe do ArenaSoldOut.com se tiver uma dúvida?
        a: "Escreva para nós no Telegram, pelo [formulário do site](/contact#write) ou para hello@arenasoldout.com. Quem responde são pessoas da equipe."

