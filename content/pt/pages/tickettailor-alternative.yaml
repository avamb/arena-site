  - type: prose
    id: examples
    title: O que isso significa para um evento?
    body: |
      **1.000 ingressos, entrada geral, pague conforme usa.** ArenaSoldOut.com: 1.000 × US$0,62 = **US$620**. Ticket Tailor: 1.000 × US$0,85 = US$850. Você fica com **US$230** a mais.

      **500 ingressos com assento, pague conforme usa.** ArenaSoldOut.com: 500 × US$1,18 = **US$590**. Ticket Tailor: 500 × US$1,70 = US$850. Você fica com **US$260** a mais, e desenhamos o mapa de assentos de graça.

      **1.000 ingressos por ano, pagos antecipadamente com créditos.** Pacote de créditos 1K do ArenaSoldOut.com: **US$430**. Ticket Tailor, 1.000 créditos: US$520. **US$90** a menos, e os créditos nunca expiram em nenhuma das plataformas.

      Calcule o seu próprio evento na [calculadora da página de preços](/pricing#packages).

  - type: cards
    id: more
    eyebrow: Além do preço
    title: O que mais você recebe com o ArenaSoldOut.com?
    items:
      - title: Mapas de assentos desenhados para você, grátis
        text: "Envie um PDF, uma foto de um esboço à mão ou uma tabela de fileiras e assentos. A equipe monta o local; você nunca precisa desenhá-lo."
        link: { label: Mapas de assentos, href: /product/seating }
      - title: Dinheiro direto na sua conta
        text: "Os compradores pagam na sua própria conta Stripe, Flitt ou AllPay. O ArenaSoldOut.com nunca retém valores e não desconta nada das suas vendas."
        link: { label: Pagamentos, href: /payments }
      - title: Taxa menor para ingressos baratos
        text: "Quando todos os ingressos do evento custam {usdLowMax} ou menos: {lowPercent}% do preço do ingresso em vez da tarifa fixa. Baladas, corridas, festas infantis, passeios."
        link: { label: Como funciona, href: /pricing#low-price }
      - title: Compradores no próprio idioma
        text: "Página do comprador, e-mails e ingressos no idioma do comprador, inclusive hebraico da direita para a esquerda. Acrescentamos qualquer idioma novo em até 40 horas."
        link: { label: Ingressos eletrônicos, href: /product/tickets }
      - title: Cada venda no seu Telegram
        text: "Crie um evento a partir da foto de um cartaz no bot do Telegram e veja cada venda e reembolso no seu grupo em segundos."
        link: { label: Bot do Telegram, href: /product/telegram }
      - title: Configure você mesmo, ou nos passe a tarefa
        text: "Você cria eventos, preços e categorias no Event Center ou no bot do Telegram, em minutos; desenhamos os mapas de assentos de graça. Sem tempo? O nosso gerente de eventos faz isso por você, como serviço pago."
        link: { label: Serviços extras, href: /pricing#services }

  - type: faq
    id: questions
    title: Perguntas que os organizadores fazem ao comparar
    items:
      - q: O ArenaSoldOut.com é mais barato que o Ticket Tailor?
        a: "Sim, por ingresso em todos os volumes publicados até 5.000 ingressos por ano: {usdPrice} em vez de US$0,85 no pague conforme usa, {usdSeated} em vez de US$1,70 por um ingresso com assento, e a partir de {usdFrom} por ingresso com créditos. Acima de 5.000 ingressos por ano combinamos condições individuais."
      - q: Vocês cobram uma porcentagem do preço do ingresso?
        a: "Não. Como o Ticket Tailor, cobramos uma tarifa fixa por ingresso vendido. As únicas porcentagens são opcionais: a taxa menor para eventos em que todos os ingressos custam {usdLowMax} ou menos e a taxa para locais permanentes."
      - q: Para onde vai o dinheiro do comprador?
        a: "Para a sua própria conta de pagamentos, a cada pedido: Stripe, Flitt ou AllPay. O ArenaSoldOut.com nunca retém valores. Nossa comissão é cobrada depois do evento ou descontada dos seus créditos."
      - q: Posso migrar meus eventos do Ticket Tailor?
        a: "Sim. Envie a lista dos seus eventos e os seus mapas de assentos; você cria os seus eventos no Event Center ou no bot do Telegram, desenhamos os seus mapas de assentos de graça, e você continua vendendo no Ticket Tailor até a sua página conosco ficar pronta. Sem tempo para configurar sozinho? O nosso [gerente de eventos](/pricing#services) faz isso por você, como serviço pago."
      - q: Eu pago assinatura?
        a: "Não. Você paga apenas pelos ingressos vendidos. Convites e ingressos gratuitos em eventos pagos não têm comissão."
      - q: E as entidades beneficentes?
        a: "Entidades beneficentes registradas têm 50% de desconto na nossa comissão, como no Ticket Tailor. Escreva para nós e ativamos o desconto para a sua organização."
      - q: Como vendo em euros?
        a: "Locais em países da UE pagam a nossa comissão em euros: {eurPrice} por ingresso no pague conforme usa. Os ingressos em si são vendidos na moeda da sua conta de pagamentos."

  - type: cta
    id: start
    title: Experimente no seu próximo evento
    text: Crie o evento, conecte sua conta de pagamentos, compartilhe o link.
    primary: { label: Começar a vender, href: /start }
    secondary: { label: Ver preços, href: /pricing }
    note: "Dúvidas? Envie o que você paga no Ticket Tailor e comparamos com os seus custos aqui."
