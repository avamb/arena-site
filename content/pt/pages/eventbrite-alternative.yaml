sections:
  - type: compare
    id: prices
    eyebrow: Preço por ingresso
    title: Quanto custa um ingresso em cada plataforma?
    lead: "Preços das duas plataformas em 11 de novembro de 2026. A nossa comissão por ingresso vendido ao lado da taxa de serviço do Eventbrite. O processamento de cartões é pago separadamente nas duas plataformas nos EUA: ao Eventbrite lá, ao seu próprio provedor de pagamentos conosco."
    cols: { what: "", us: ArenaSoldOut.com, them: Eventbrite }
    rows:
