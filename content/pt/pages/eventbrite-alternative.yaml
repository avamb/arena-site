    note: "Preços do Eventbrite: [central de ajuda do Eventbrite](https://www.eventbrite.com/help/en-us/articles/755615/how-much-does-it-cost-for-organizers-to-use-eventbrite/) e [eventbrite.com/organizer/pricing](https://www.eventbrite.com/organizer/pricing/), consultados em 11 de novembro de 2026, sem impostos. Nossos preços: [preços](/pricing) e [condições detalhadas](/pricing/terms). Eventbrite é marca registrada do seu titular; o ArenaSoldOut.com não é afiliado a ele."

  - type: prose
    id: examples
    title: O que isso significa para um evento?
    body: |
      Todos os valores nos preços das duas plataformas em 11 de novembro de 2026.

      **1.000 ingressos a US$30, pague conforme usa.** ArenaSoldOut.com: 1.000 × US$0,62 = **US$620**. Eventbrite: 1.000 × (3,7% de US$30 + US$1,79) = US$2.900. São **US$2.280** de diferença, antes do processamento de cartões de ambos os lados.

      **300 ingressos com assento a US$60.** ArenaSoldOut.com: 300 × US$1,18 = **US$354**, e desenhamos o mapa de assentos de graça. Eventbrite: 300 × (3,7% de US$60 + US$1,79) = US$1.203.

      **Quanto mais caro o ingresso, maior a diferença.** A nossa comissão é a mesma num ingresso de US$15 e num de US$150. Uma porcentagem cresce com o preço.

      Calcule o seu próprio evento na [calculadora da página de preços](/pricing#packages).

  - type: cards
    id: more
    eyebrow: Além do preço
    title: O que mais é diferente no ArenaSoldOut.com?
    items:
      - title: O dinheiro é seu desde o primeiro pedido
        text: "Os compradores pagam na sua própria conta Stripe, Flitt ou AllPay. O ArenaSoldOut.com nunca retém valores, então não há repasse para esperar depois do evento."
        link: { label: Pagamentos, href: /payments }
      - title: Mapas de assentos desenhados para você, grátis
        text: "Envie um PDF, uma foto de um esboço à mão ou uma tabela de fileiras e assentos. A equipe monta o local; você nunca precisa desenhá-lo."
        link: { label: Mapas de assentos, href: /product/seating }
      - title: Taxa menor para ingressos baratos
        text: "Quando todos os ingressos do evento custam {usdLowMax} ou menos: {lowPercent}% do preço do ingresso em vez da tarifa fixa. Baladas, corridas, festas infantis, passeios."
        link: { label: Como funciona, href: /pricing#low-price }
      - title: Sua página, seus compradores
        text: "Venda no seu próprio site com o widget de ingressos ou na sua página conosco. Os compradores vêm até você, e não a um catálogo ao lado de outros eventos."
        link: { label: Venda no seu site ou no nosso, href: /product/sell }
      - title: Cada venda no seu Telegram
        text: "Crie um evento a partir da foto de um cartaz no bot do Telegram e veja cada venda e reembolso no seu grupo em segundos."
        link: { label: Bot do Telegram, href: /product/telegram }
      - title: Configure você mesmo, ou nos passe a tarefa
        text: "Você cria eventos, preços e categorias no Event Center ou no bot do Telegram, em minutos; desenhamos os mapas de assentos de graça. Sem tempo? O nosso gerente de eventos faz isso por você, como serviço pago."
        link: { label: Serviços extras, href: /pricing#services }

  - type: faq
    id: questions
    title: Perguntas que os organizadores fazem ao comparar
    items:
      - q: O ArenaSoldOut.com é mais barato que o Eventbrite?
        a: "Na comissão, sim, em qualquer preço de ingresso: {usdPrice} por ingresso em vez de 3,7% + US$1,79 nos EUA, e {eurPrice} em vez de 5,9% + €0,79 na Irlanda. O processamento de cartões vem além disso nas duas plataformas nos EUA."
      - q: Quem paga a taxa, eu ou o comprador?
        a: "Você decide. Você pode somar a sua própria taxa de serviço para o comprador ao preço do ingresso, ou manter o preço como está e pagar a nossa comissão você mesmo. Convites e ingressos gratuitos em eventos pagos não têm comissão."
      - q: Para onde vai o dinheiro do comprador?
        a: "Para a sua própria conta de pagamentos, a cada pedido: Stripe, Flitt ou AllPay. O ArenaSoldOut.com nunca retém valores. Nossa comissão é cobrada depois do evento ou descontada dos seus créditos."
      - q: Meu evento será listado em um marketplace?
        a: "Não. O Eventbrite tem um marketplace em que os compradores navegam por eventos; o ArenaSoldOut.com não tem. Vendemos ingressos no seu site e na sua própria página do evento, e você traz os compradores pelos seus próprios canais."
      - q: Posso migrar meus eventos do Eventbrite?
        a: "Sim. Envie a lista dos seus eventos e os seus mapas de assentos; você cria os seus eventos no Event Center ou no bot do Telegram, desenhamos os seus mapas de assentos de graça, e você continua vendendo no Eventbrite até a sua página conosco ficar pronta. Sem tempo para configurar sozinho? O nosso [gerente de eventos](/pricing#services) faz isso por você, como serviço pago."
      - q: Eu pago assinatura?
        a: "Não. Você paga apenas pelos ingressos vendidos, depois do evento, ou compra créditos antecipadamente a partir de {usdFrom} por ingresso. Os créditos nunca expiram."

