sections:
  - type: prose
    id: story
    eyebrow: Empresa
    title: O que é o ArenaSoldOut.com?
    body: |
      O ArenaSoldOut.com é uma plataforma de venda de ingressos para organizadores: assentos marcados e entrada livre no mesmo evento, a conta de pagamentos do próprio organizador, uma página de vendas hospedada por nós ou um widget no site do organizador, um Event Center no navegador e no Telegram. Os compradores pagam diretamente ao organizador; a plataforma nunca retém o dinheiro.

      A empresa é a ABH TEAM OÜ, registrada na União Europeia. As plataformas anteriores dos fundadores atenderam espetáculos do Cirque du Soleil, estádios da Copa do Mundo FIFA 2018, os World Choir Games e 800 espetáculos no gelo; o ArenaSoldOut.com vende ingressos para organizadores desde 2019 e foi reconstruído do zero em 2026.

      A equipe responde aos organizadores em inglês, espanhol, tcheco, russo e hebraico. A maioria dos pedidos dos organizadores é entregue em semanas; todos os que chegaram à produção estão listados na [página de mudanças](/changes) com a data, e a [página de fatos](/facts) diz o que existe, o que não existe e desde quando.
