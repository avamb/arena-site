title: "Sobre o ArenaSoldOut.com: venda de ingressos desde 2019"
description: "O ArenaSoldOut.com é uma plataforma de venda de ingressos operada pela ABH TEAM OÜ (UE). Clientes em 31 países desde 2019; plataforma reconstruída em 2026."
h1: Quem está por trás do ArenaSoldOut.com
lead: Uma equipe pequena que constrói infraestrutura de venda de ingressos para organizadores que vendem os próprios ingressos. Não é um marketplace, nem uma lista de eventos. Organizadores em 31 países desde 2019; a plataforma por trás deles foi reconstruída em 2026 e os organizadores migraram com ela.
