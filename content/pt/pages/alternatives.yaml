  - type: prose
    id: how
    title: Como comparamos
    body: |
      **Só preços publicados.** Uma linha entra na tabela apenas se pudemos lê-la na página de preços ou na central de ajuda da outra plataforma. O link da fonte e a data ficam abaixo de cada tabela.

      **Comparação justa.** Algumas plataformas incluem a taxa do cartão na comissão; nós não, porque o comprador paga na sua própria conta de pagamentos e o seu provedor cobra a taxa do cartão dele. Cada página diz qual é qual.

      **O que não fazemos.** O ArenaSoldOut.com não tem um marketplace em que os compradores navegam por eventos, nem pagamentos sem dinheiro no bar. A lista completa está na [página de fatos](/facts).

      Encontrou um preço que mudou? [Escreva para nós](/contact) e corrigimos a página.

