title: "Venda ingressos no seu site ou em uma página nossa"
description: "Incorpore o widget com três linhas, use o plugin do WordPress ou compartilhe uma página de venda hospedada. Os compradores pagam na sua conta de qualquer forma."
h1: No seu site, ou no nosso. O dinheiro vai para você de qualquer forma.
lead: Duas formas de vender, um só Event Center por trás. Incorpore o widget no site que você já tem, ou compartilhe uma página hospedada que criamos em minutos. Cada pedido cai na sua própria conta de pagamentos.
related:
  - { label: Mapas de assentos iguais ao local, href: /product/seating, text: "Envie um PDF, um esboço ou uma tabela de fileiras; desenhamos o mapa de graça." }
  - { label: Pagamentos na sua própria conta, href: /payments, text: "Provedores por país, status, como conectar." }
  - { label: Sites em WordPress, href: /solutions/wordpress, text: "Plugin com pedidos do WooCommerce, dois clientes migraram do ArenaSoldOut.com sem interrupção." }
sections:
  - type: ways
    id: ways
    eyebrow: Onde você vende
    title: Qual forma combina com o meu evento?
    items:
      - title: Você tem um site
        text: "O seu site é o checkout. Incorpore o widget de ingressos em qualquer página: WordPress, Tilda, Wix, Webflow ou código próprio. Os compradores nunca saem do seu domínio."
        bullets:
          - Widget em qualquer site, três linhas de código
          - Plugin do WordPress com pedidos do WooCommerce
          - Suas cores, suas fontes, seu idioma
      - title: Você não tem um site
        text: "Nós hospedamos a página de vendas: tickets.arenasoldout.com/your-name/your-event. Compartilhe um só link nas redes sociais, nos mensageiros e no cartaz."
        bullets:
          - Uma página por organizador e por evento
          - Uma página separada para cada promotor
          - Pronta em minutos, sem trabalho de design
          - Links para os seus parceiros de venda na mesma página
  - type: cards
    id: page
    eyebrow: Sua página de vendas
    title: O que mais a minha página de vendas faz?
    lead: "Tudo abaixo funciona na página do seu evento na plataforma e no widget. Configure no Event Center."
    items:
      - title: Materiais do evento na sua página de vendas
        text: "Adicione materiais ao seu evento na sua página de vendas na plataforma, se você não tem um site próprio: textos, fotos e vídeos."
      - title: Descrições com aparência de design
        text: "Títulos, listas, links e citações na descrição do evento na sua página de vendas. Uma rede neural formata um texto simples para você com um clique."
      - title: '"Avise-me quando as vendas abrirem"'
        text: "Os compradores se inscrevem na página do seu evento e recebem um e-mail no momento em que as vendas abrem, no seu idioma."
      - title: Lembretes de carrinho abandonado
        text: "O comprador que reservou ingressos e não pagou recebe um e-mail de lembrete. Em muitos casos, esses lembretes aumentam bastante as vendas. Você pode oferecer um desconto em troca do consentimento para a sua newsletter."
      - title: Indique um amigo
        text: "Cada comprador recebe um link pessoal. O amigo ganha um desconto, e o comprador que trouxe o amigo ganha cashback no cartão depois do evento do amigo."
      - title: Links curtos e QR codes para impressão
        text: "Um link curto go.arenasoldout.com com um QR code para cartazes, folhetos e redes sociais: PNG, SVG ou um encarte em PDF pronto nos formatos A5 e A6 para impressão. Você pode mudar o destino do link depois da impressão. Cada pedido fica ligado ao seu link, então você vê qual cartaz vendeu."
      - title: Uma loja junto dos seus ingressos
        text: "Venda produtos junto com os ingressos: vinho, bebidas por encomenda para o evento, mercadorias, kits de presente. Uma vitrine com variações, carrinho, reembolsos e e-mails. O comprador retira o pedido no evento, ou você envia pelo correio ou por entrega que você organiza. Nosso primeiro cliente com loja já vende por ela."
  - type: faq
    id: questions
    eyebrow: Perguntas
    title: O que o widget faz no meu site?
    items:
      - q: Como coloco o widget no meu site?
        a: "Duas linhas de HTML: uma tag script e o elemento <arena-tickets> com o seu token de feed. O widget mostra sessões, o mapa de assentos ou categorias, o carrinho e o checkout. Os detalhes e o código estão na [página para desenvolvedores](/developers)."
      - q: Ele combina com o meu site?
        a: Sim. O widget lê quatro variáveis CSS da sua página (cor de destaque, raio, fundo, borda) e segue o idioma do comprador. Sem iframe, sem um segundo design.
      - q: Onde o comprador paga?
        a: "No checkout hospedado do seu próprio provedor de pagamentos, na sua própria conta. O ArenaSoldOut.com cria o pedido, reserva os assentos e emite o ingresso; nunca retém o dinheiro. Veja [pagamentos](/payments)."
      - q: Posso vender também por parceiros?
        a: Sim. Cada promotor recebe uma página com link próprio, e a página hospedada pode listar os seus parceiros de venda. As vendas de todos os canais aparecem em um só Event Center.
      - q: E se eu mudar meu site para outra plataforma?
        a: Nada muda para os compradores. O widget é um web component; ele se move com as suas páginas, e a página hospedada continua funcionando como alternativa.
  - type: cta
    id: start
    title: Comece a vender hoje
    text: "Crie o evento, conecte sua conta de pagamentos, compartilhe o link. Um evento sem mapa de assentos entra à venda em 10 minutos; o mapa de assentos nós desenhamos para você, sem custo."
    primary: { label: Criar seu evento, href: /start#create }
    secondary: { label: Abrir o bot do Telegram, href: https://t.me/EventsCentrBot }
    note: "Ou escreva para nós: configuramos tudo com você em uma conversa."
