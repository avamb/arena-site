title: "Aplicativo MACS: leitura de ingressos em iOS e Android"
description: "O MACS lê ingressos EAN-13 e QR de todos os organizadores e parceiros, em iPhone, iPad, Android e leitores portáteis. Grátis nas lojas de aplicativos."
h1: "MACS: o aplicativo na entrada"
lead: Um aplicativo para todas as entradas. A equipe da porta entra, escolhe a sessão e lê o EAN-13 ou o QR do ingresso, em papel ou na tela. Ele aceita ingressos de qualquer organizador que vende pelo ArenaSoldOut.com e ingressos de parceiros de outros sistemas, então um local usa os mesmos celulares em todos os eventos.
related:
  - { label: Ingressos eletrônicos com EAN-13 e QR, href: /product/tickets }
  - { label: "Locais e clubes: um mapa, todos os eventos", href: /solutions/venues }
