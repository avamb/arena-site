sections:
  - type: faq
    id: questions
    eyebrow: Assentos
    title: Como funcionam os assentos no ArenaSoldOut.com?
    items:
      - q: Preciso desenhar o mapa eu mesmo?
        a: "Não, nunca. Envie o mapa para nós e o desenhamos no seu evento de graça, em geral em até um dia. Qualquer um destes basta: um PDF do mapa do local, uma foto de um esboço à mão ou uma tabela de fileiras com os assentos de cada fileira (Excel ou Google Sheets). Arquivos vetoriais (SVG) são importados diretamente."
      - q: Um evento pode ter assentos e lugares em pé?
        a: Sim, no mesmo mapa. Fileiras marcadas com categorias, áreas em pé com cotas, cada categoria com seu próprio preço e período de venda.
      - q: Posso mudar o mapa depois que as vendas começaram?
        a: Sim. Os mapas têm versões, então um novo layout para a próxima sessão não afeta os ingressos já vendidos.
      - q: Quanto me custa um ingresso com assento?
        a: "A comissão de um ingresso com assento é de US$1,09 (€0,97 nos países da UE), contra US$0,59 (€0,53) sem assento; os créditos a reduzem. O mapa em si é grátis. Veja [preços](/pricing)."
      - q: O comprador escolhe o assento no celular?
        a: Sim. O mapa de assentos é o mesmo no widget e na página hospedada, com zoom com pinça no celular, uma legenda por categoria e um cronômetro de reserva para os assentos escolhidos.
      - q: E convites e assentos para a imprensa?
        a: Emita ingressos gratuitos para assentos exatos pelo Event Center; eles são lidos na entrada como qualquer ingresso.
