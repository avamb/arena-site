title: "Mapas de assentos: lugares marcados e áreas em pé"
description: "Mapas de assentos com versões, importação de SVG, assentos marcados e entrada geral juntos, preços por categoria. Envie um PDF ou esboço, desenhamos de graça."
h1: Mapas de assentos iguais ao local
lead: Os assentos marcados fazem parte do núcleo da plataforma, não são um complemento. A equipe monta o seu mapa com o que você tiver, em geral em até um dia, e o reaproveita em todas as datas.
