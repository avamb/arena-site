title: "Ingressos com EAN-13 e QR, leitura e e-mails ao comprador"
description: "Ingressos em PDF com EAN-13 e QR no idioma do comprador, app de leitura MACS para iOS e Android, ingresso de exemplo, e-mails se uma sessão muda ou é cancelada."
h1: Um ingresso que lê
lead: Cada ingresso é um PDF com código de barras EAN-13 e código QR, no idioma do comprador. Leia com o aplicativo ou com um leitor portátil, reenvie, reembolse, substitua quando uma data mudar.
