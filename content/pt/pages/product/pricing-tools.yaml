title: "Códigos promocionais, pré-venda, lotes, grátis e valor livre"
description: "Códigos promocionais com limites, preços por período, lotes, sequências de categorias, taxa de serviço por canal, ingressos grátis e de valor livre."
h1: Preços que mudam do jeito que você planejou
lead: Pré-venda por data, o próximo preço quando um lote esgota, códigos para parceiros, uma taxa de serviço por canal. Tudo definido no Event Center, aplicado no widget e na página hospedada.
