sections:
  - type: faq
    id: questions
    eyebrow: Ferramentas de preço
    title: O que posso fazer com os preços?
    items:
      - q: Posso usar códigos promocionais?
        a: Sim. Um código pode valer para um evento, uma sessão ou uma categoria, com período de venda, pedido mínimo e limite por comprador. Os parceiros recebem códigos próprios.
      - q: Existe um esquema de preços pronto?
        a: "Sim, o Smart price (preço inteligente). Escolha um esquema pronto de faixas de preço por quantidade e por data, em vez de definir cada faixa à mão. Você pode ajustá-lo depois."
      - q: Um ingresso pode ser vendido só junto com outro?
        a: "Sim, com categorias complementares. Um complemento só é vendido junto com um ingresso de uma categoria principal da mesma sessão. Por exemplo, um ingresso infantil não pode ser vendido sem um ingresso de adulto, e “mais uma criança” é adicionado a “criança mais adulto”. Quando as categorias principais esgotam, a sessão aparece como esgotada."
      - q: Os preços podem mudar em uma data que eu defino?
        a: Sim. Os períodos de pré-venda mudam por data e hora. Os lotes por quantidade abrem o próximo preço quando o atual esgota, então um lote esgotado nunca bloqueia as vendas.
      - q: Vários preços para um evento?
        a: Sim. Categorias com preço, cota e período de venda próprios. As categorias podem formar sequências que repassam os lugares não vendidos para a seguinte.
      - q: Posso acrescentar uma taxa de serviço?
        a: Sim. Uma porcentagem por canal de venda, mostrada ao comprador em uma linha separada e paga na sua conta junto com o preço do ingresso.
      - q: Ingressos gratuitos e de valor livre?
        a: Sim, os dois. Ingressos gratuitos para convites e inscrições, e ingressos de valor livre com um mínimo que você define.
      - q: Os descontos funcionam com assentos?
        a: Sim. Códigos e períodos valem para categorias com assento e também para áreas em pé.
  - type: cta
    id: start
    title: Defina seus preços hoje
    text: Crie o evento, adicione categorias e períodos, conecte sua conta de pagamentos, compartilhe o link.
    primary: { label: Criar seu evento, href: /start#create }
    secondary: { label: Ver preços, href: /pricing }
    note: Condições de volume e individuais sob consulta.
