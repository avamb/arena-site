# One source of truth for response headers (doc 33 §3.7a). scripts/build-edge.mjs turns this into
# dist/_headers (Cloudflare) and ops/nginx/headers.conf (nginx). Patterns use the _headers syntax:
# `/*` everything, `/_astro/*` a folder, `/*.md` an extension.
# The X-Robots-Tag noindex header is added by the script while site.config.ts `indexing` is false.
# Cloudflare combines values of headers set by several matching rules; a key written as "! Name"
# first removes the value from the broader rule (nginx locations replace headers anyway, so the
# nginx generator ignores "!" keys).
headers:
  - pattern: "/*"
    values:
      X-Content-Type-Options: nosniff
      Referrer-Policy: strict-origin-when-cross-origin
      Permissions-Policy: "camera=(), microphone=(), geolocation=(), payment=()"
      X-Frame-Options: SAMEORIGIN
      Cross-Origin-Opener-Policy: same-origin
      Content-Security-Policy: "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.arenasoldout.com https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'self'"
      Cache-Control: "public, max-age=0, must-revalidate"
  - pattern: "/_astro/*"
    values:
      "! Cache-Control": ""
      Cache-Control: "public, max-age=31536000, immutable"
  - pattern: "/brand/*"
    values:
      "! Cache-Control": ""
      Cache-Control: "public, max-age=86400"
  - pattern: "/*.md"
    values:
      Content-Type: "text/markdown; charset=utf-8"
      "! Cache-Control": ""
      Cache-Control: "public, max-age=300, stale-while-revalidate=86400"
  - pattern: "/llms.txt"
    values:
      "! Cache-Control": ""
      Cache-Control: "public, max-age=300, stale-while-revalidate=86400"
  - pattern: "/llms-full.txt"
    values:
      "! Cache-Control": ""
      Cache-Control: "public, max-age=300, stale-while-revalidate=86400"
  - pattern: "/facts.json"
    values:
      "! Cache-Control": ""
      Cache-Control: "public, max-age=300, stale-while-revalidate=86400"
      Access-Control-Allow-Origin: "*"
