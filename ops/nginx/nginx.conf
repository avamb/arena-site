# nginx image of the same dist/ (doc 33 §3.7a). Built in CI on every push as the `parity` job and
# usable in Dokploy on lead-parser the day Cloudflare Workers stops being the host. The domain stays
# proxied by Cloudflare either way. Generated includes: redirects.conf and headers.conf
# (scripts/build-edge.mjs from redirects.yaml and headers.yaml).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    types { text/markdown md; }
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    tcp_nopush on;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/markdown image/svg+xml application/xml;
    gzip_min_length 1024;
    # Brotli: enable the module in the image if available; Cloudflare in front compresses anyway.

    upstream forms { server ${FORMS_UPSTREAM}; }

    server {
        listen 8080;
        server_name _;
        absolute_redirect off;
        root /usr/share/nginx/html;
        index index.html;

        include /etc/nginx/conf.d/headers.conf;
        include /etc/nginx/conf.d/redirects.conf;

        location /api/ {
            proxy_pass http://forms;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 15s;
        }

        location = /healthz { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }

        # Astro `build.format: 'file'`: /pricing → pricing.html; Workers Static Assets does the same.
        location / {
            try_files $uri $uri.html $uri/index.html =404;
        }
        error_page 404 /404.html;
    }
}
