# One source of truth for redirects (doc 33 §3.7a). scripts/build-edge.mjs turns this into
# dist/_redirects (Cloudflare Workers Static Assets) and ops/nginx/redirects.conf (nginx).
# `from` is the old WordPress path (trailing slash optional, both forms are generated),
# `to` the new path, `code` 301 by default. Wave 2 adds the full 71 + 75 + 9 inventory from doc 33 §1.3.
redirects:
  - { from: /prices/, to: /pricing }
  - { from: /special-offers-for-permanent-venues/, to: /pricing#venues }
  - { from: /examples/, to: /clients }
  - { from: /about/, to: /clients }
  - { from: /contact-us/, to: /start }
  - { from: /create-event/, to: /start }
  - { from: /get-started/, to: /start }
  - { from: /connect-to-stripe/, to: /payments }
  - { from: /for-developers/, to: /developers }
  - { from: /api-documents/, to: /developers }
  - { from: /wordpress-integration/, to: /developers#wordpress }
  - { from: /help/, to: /start }
  - { from: /events/, to: /clients }
  - { from: /sitemap_index.xml, to: /sitemap-index.xml }
  - { from: /changelog, to: /changes }
  - { from: /customers, to: /clients }
