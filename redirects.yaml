# One source of truth for redirects (doc 33 §3.7a). scripts/build-edge.mjs turns this into
# dist/_redirects (Cloudflare Workers Static Assets) and ops/nginx/redirects.conf (nginx).
# `from` is the old WordPress path (with or without the trailing slash; both forms are generated),
# `to` the new path, `code` 301 by default. A trailing `*` matches a whole folder.
# Blog posts are NOT listed here: every imported post carries `legacy_url` in its frontmatter and
# scripts/lib/legacy.mjs derives its 301 from that (75 posts, en/ru/es/no).
# Inventory source: old sitemap 2026-10-08 (71 pages, 9 products, 6 categories, 6 tags).
