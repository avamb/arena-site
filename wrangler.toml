# Cloudflare Worker "arena-site": Workers Static Assets serve dist/, the Worker handles /api/* only
# (forms/worker.ts). No KV, D1, R2 or Durable Objects by rule (doc 33 §3.7a). No secrets here:
# TURNSTILE_SECRET_KEY, FORMS_WEBHOOK_URL, FORMS_WEBHOOK_TOKEN are `wrangler secret put` values,
# CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID come from the environment (GitHub Actions secrets).
name = "arena-site"
main = "forms/worker.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
run_worker_first = ["/api/*"]

# Development host (doc 33 §3.7b). On launch day replace with:
#   { pattern = "arenasoldout.com", custom_domain = true },
#   { pattern = "www.arenasoldout.com", custom_domain = true }
# and set `indexing: true` in site.config.ts. Rollback = the reverse edit, minutes.
routes = [
  { pattern = "arenasoldout.com", custom_domain = true },
  { pattern = "www.arenasoldout.com", custom_domain = true },
  # new. stays attached: the first lines of _redirects send it to the apex with a 301
  { pattern = "new.arenasoldout.com", custom_domain = true }
]

[vars]
SITE_URL = "https://arenasoldout.com"

[observability]
enabled = true
